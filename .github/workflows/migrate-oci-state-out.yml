name: One-time OCI source state removal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type FORGET_OCI_STATE_NO_DESTROY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: k8s-cms-oci-state-migration
  cancel-in-progress: false

jobs:
  forget:
    if: inputs.confirmation == 'FORGET_OCI_STATE_NO_DESTROY'
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_WORKSPACE: ${{ github.event.repository.name }}
      SOURCE_LOCK_REASON: suncoast-external-infrastructure OCI state migration
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Verify source configuration is forget-only
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TF_API_TOKEN:-}" ]] || {
            echo "TFE_TOKEN is unavailable to this repository" >&2
            exit 1
          }

          removed_files=(
            terraform/oci-directus-db.tf
            terraform/oci-directus-db-variables.tf
            terraform/oci-directus-db-outputs.tf
            terraform/templates/cloud-init-directus-db.tftpl
            terraform/scripts/smoke-test-oci-directus-db.sh
          )
          for path in "${removed_files[@]}"; do
            [[ ! -e "${path}" ]] || {
              echo "OCI source file still exists: ${path}" >&2
              exit 1
            }
          done
          [[ -f terraform/removed-oci-postgresql.tf ]] || {
            echo "terraform/removed-oci-postgresql.tf is required" >&2
            exit 1
          }

          expected_removed_blocks="$(grep -c '^removed {' terraform/removed-oci-postgresql.tf)"
          [[ "${expected_removed_blocks}" == "8" ]] || {
            echo "Expected eight no-destroy removed blocks; found ${expected_removed_blocks}" >&2
            exit 1
          }
          expected_destroy_false="$(grep -c '^    destroy = false$' terraform/removed-oci-postgresql.tf)"
          [[ "${expected_destroy_false}" == "8" ]] || {
            echo "Every removed block must set destroy = false" >&2
            exit 1
          }

      - name: Verify migration lock and unlock source for the run
        shell: bash
        run: |
          set -euo pipefail
          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"
          workspace_json="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"
          workspace_id="$(jq -r '.data.id' <<<"${workspace_json}")"
          locked="$(jq -r '.data.attributes.locked' <<<"${workspace_json}")"
          locked_reason="$(jq -r '.data.attributes["locked-reason"] // empty' <<<"${workspace_json}")"
          [[ "${locked}" == "true" && "${locked_reason}" == "${SOURCE_LOCK_REASON}" ]] || {
            echo "Source workspace does not have the expected migration lock" >&2
            exit 1
          }

          curl --fail --silent --show-error \
            --request POST \
            --header "${auth_header}" \
            --header "${content_header}" \
            "${api}/workspaces/${workspace_id}/actions/unlock" >/dev/null
          echo "Unlocked source workspace for its guarded forget-only run"

      - name: Upload forget-only source configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: terraform

      - name: Create applicable source run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: false
          message: Forget OCI resources after verified target import

      - name: Read source plan summary
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: plan
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Reject any infrastructure mutation
        env:
          PLAN_ADD: ${{ steps.plan.outputs.add }}
          PLAN_CHANGE: ${{ steps.plan.outputs.change }}
          PLAN_DESTROY: ${{ steps.plan.outputs.destroy }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PLAN_ADD}" == "0" && "${PLAN_CHANGE}" == "0" && "${PLAN_DESTROY}" == "0" ]] || {
            echo "Source forget rejected: plan contains add=${PLAN_ADD}, change=${PLAN_CHANGE}, destroy=${PLAN_DESTROY}" >&2
            exit 1
          }
          echo "Source plan contains only no-destroy state removals"

      - name: Apply source state removal
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        with:
          run: ${{ steps.run.outputs.run_id }}
          comment: Forget OCI addresses without destroying live resources

      - name: Verify source state no longer owns OCI
        shell: bash
        run: |
          set -euo pipefail
          api="https://app.terraform.io/api/v2"
          auth_header="Authorization: Bearer ${TF_API_TOKEN}"
          content_header="Content-Type: application/vnd.api+json"
          workspace_json="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE}")"
          workspace_id="$(jq -r '.data.id' <<<"${workspace_json}")"
          resources_json="$(curl --fail --silent --show-error --header "${auth_header}" --header "${content_header}" "${api}/workspaces/${workspace_id}/resources?page%5Bsize%5D=100")"
          remaining="$(jq '[.data[]? | select(.attributes.provider | test("oracle/oci|hashicorp/tls"))] | length' <<<"${resources_json}")"
          [[ "${remaining}" == "0" ]] || {
            echo "Source state still contains ${remaining} OCI/TLS resource records" >&2
            exit 1
          }
          echo "Source state no longer owns OCI or TLS resources"
          echo "HCP Terraform run: ${{ steps.run.outputs.run_link }}"
