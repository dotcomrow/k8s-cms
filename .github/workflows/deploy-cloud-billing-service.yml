name: Build and Push Cloud Billing Service

on:
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    name: "Build and Push"
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set timestamp tag
        id: set-tag
        run: |
          echo "tag=ts-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build Docker image
        run: |
          cd cloud-billing-service/
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cloud-billing-service:${{ steps.set-tag.outputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/cloud-billing-service:latest \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cloud-billing-service:${{ steps.set-tag.outputs.tag }}
          docker push ghcr.io/${{ github.repository_owner }}/cloud-billing-service:latest

      - name: Remove local Docker image
        run: |
          docker rmi ghcr.io/${{ github.repository_owner }}/cloud-billing-service:${{ steps.set-tag.outputs.tag }} || true
          docker rmi ghcr.io/${{ github.repository_owner }}/cloud-billing-service:latest || true
          docker image prune -f
