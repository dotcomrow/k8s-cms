apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-runtime-status-service
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
          mode = 0644
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-status-service
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: runtime-status-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-status-service
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: runtime-status-service
    spec:
      serviceAccountName: directus
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 96Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: runtime-status-service
          image: "ghcr.io/dotcomrow/runtime-status-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DIRECTUS_BASE_URL
              value: "http://directus-service.directus.svc.cluster.local:8055"
            - name: DIRECTUS_HEALTH_PATH
              value: "/server/health"
            - name: DIRECTUS_TOKEN_VAULT_PATH
              value: "secret/data/directus/gravitee/openapi/admin"
            - name: DIRECTUS_TOKEN_VAULT_KEY
              value: "token"
            - name: INTERNAL_TOKEN_VAULT_PATH
              value: "secret/data/runtime-status-service"
            - name: INTERNAL_TOKEN_VAULT_KEY
              value: "token"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
            - name: OPENAPI_SERVER_URL
              value: "http://runtime-status-service.directus.svc.cluster.local:8080"
            - name: REQUEST_TIMEOUT_MS
              value: "8000"
            - name: RUN_TIMEOUT_MS
              value: "30000"
            - name: RATE_MAX
              value: "90"
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-runtime-status-service
        - name: vault-secrets
          emptyDir: {}
---
