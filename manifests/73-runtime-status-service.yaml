apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-status-lightweight-canary
  namespace: directus
  annotations:
    suncoast.systems/execution-backend: "flink"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          annotations:
            linkerd.io/inject: "disabled"
          labels:
            app: runtime-status-lightweight-canary
        spec:
          serviceAccountName: directus
          restartPolicy: Never
          containers:
            - name: submit-flink-job
              image: ghcr.io/dotcomrow/runtime-status-flink-job:latest
              imagePullPolicy: Always
              env:
                - name: FLINK_REST_TARGET
                  value: "flink-rest.kafka.svc.cluster.local:8081"
                - name: RUNTIME_STATUS_URL
                  value: "http://runtime-status-service.directus.svc.cluster.local:8080"
                - name: CANARY_DEFINITION_KEY
                  value: "cms.translation.pipeline.lightweight"
                - name: CANARY_SOURCE
                  value: "flink"
                - name: ENDPOINT_MODE
                  value: "action"
                - name: CONNECT_TIMEOUT_MS
                  value: "5000"
                - name: HTTP_TIMEOUT_MS
                  value: "60000"
                - name: FAIL_ON_WARNING
                  value: "false"
                - name: FAIL_ON_SKIPPED
                  value: "false"
                - name: REQUIRE_STEPS
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 768Mi
