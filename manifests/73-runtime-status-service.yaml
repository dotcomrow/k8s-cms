apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-status-lightweight-canary
  namespace: directus
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      backoffLimit: 12
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: runtime-status-lightweight-canary
        spec:
          serviceAccountName: directus
          restartPolicy: Never
          initContainers:
            - name: vault-agent
              image: hashicorp/vault:1.15.4
              command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 50m
                  memory: 96Mi
              volumeMounts:
                - name: vault-agent-config
                  mountPath: /vault-config
                - name: vault-secrets
                  mountPath: /vault-secrets
          containers:
            - name: run
              image: alpine/k8s:1.31.4
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -u
                  VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
                  CANARY_URL="http://runtime-status-service.directus.svc.cluster.local:8080/internal/canaries/run"
                  RETRY_DELAY_SECONDS=60
                  ATTEMPT=0

                  ensure_tools() {
                    if command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
                      return 0
                    fi
                    apk add --no-cache curl jq ca-certificates >/dev/null 2>&1
                  }

                  is_http_success() {
                    case "${1:-}" in
                      2??) return 0 ;;
                      *) return 1 ;;
                    esac
                  }

                  while true; do
                    ATTEMPT=$((ATTEMPT + 1))

                    if ! ensure_tools; then
                      echo "runtime-status canary attempt ${ATTEMPT}: waiting for curl/jq tooling"
                      sleep "${RETRY_DELAY_SECONDS}"
                      continue
                    fi

                    if [ ! -s /vault-secrets/vault-token ]; then
                      echo "runtime-status canary attempt ${ATTEMPT}: waiting for Vault token"
                      sleep "${RETRY_DELAY_SECONDS}"
                      continue
                    fi

                    VAULT_TOKEN="$(cat /vault-secrets/vault-token 2>/dev/null || true)"
                    if [ -z "${VAULT_TOKEN}" ]; then
                      echo "runtime-status canary attempt ${ATTEMPT}: Vault token is empty"
                      sleep "${RETRY_DELAY_SECONDS}"
                      continue
                    fi

                    TOKEN_HTTP_CODE="$(curl -sS --connect-timeout 3 --max-time 8 \
                      -o /tmp/runtime-status-token.json \
                      -w "%{http_code}" \
                      -H "X-Vault-Token: ${VAULT_TOKEN}" \
                      "${VAULT_ADDR}/v1/secret/data/runtime-status-service" 2>/tmp/runtime-status-token.err || true)"

                    if ! is_http_success "${TOKEN_HTTP_CODE}"; then
                      echo "runtime-status canary attempt ${ATTEMPT}: waiting for internal token (vault HTTP ${TOKEN_HTTP_CODE:-000})"
                      sleep "${RETRY_DELAY_SECONDS}"
                      continue
                    fi

                    INTERNAL_TOKEN="$(jq -r '.data.data.token // .data.data.value // empty' /tmp/runtime-status-token.json 2>/dev/null || true)"
                    if [ -z "${INTERNAL_TOKEN}" ] || [ "${INTERNAL_TOKEN}" = "null" ]; then
                      echo "runtime-status canary attempt ${ATTEMPT}: internal token missing"
                      sleep "${RETRY_DELAY_SECONDS}"
                      continue
                    fi

                    REQUEST_ID="$(cat /proc/sys/kernel/random/uuid)"
                    CANARY_HTTP_CODE="$(curl -sS --connect-timeout 5 --max-time 45 \
                      -o /tmp/runtime-status-canary.json \
                      -w "%{http_code}" \
                      -X POST \
                      -H "Authorization: Bearer ${INTERNAL_TOKEN}" \
                      -H "Content-Type: application/json" \
                      -d "{\"definition_key\":\"cms.translation.pipeline.lightweight\",\"source\":\"schedule\",\"request_id\":\"${REQUEST_ID}\"}" \
                      "${CANARY_URL}" 2>/tmp/runtime-status-canary.err || true)"

                    if is_http_success "${CANARY_HTTP_CODE}"; then
                      if jq -e '.ok == true' /tmp/runtime-status-canary.json >/dev/null 2>&1; then
                        echo "runtime-status canary succeeded on attempt ${ATTEMPT}"
                        jq -c '{ok, request_id, result_count: (.results | length)}' /tmp/runtime-status-canary.json 2>/dev/null || true
                        exit 0
                      fi
                    fi

                    echo "runtime-status canary attempt ${ATTEMPT}: waiting for service (HTTP ${CANARY_HTTP_CODE:-000})"
                    sleep "${RETRY_DELAY_SECONDS}"
                  done
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: vault-secrets
                  mountPath: /vault-secrets
          volumes:
            - name: vault-agent-config
              configMap:
                name: vault-agent-config-runtime-status-canary
            - name: vault-secrets
              emptyDir: {}
