apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-status-lightweight-canary
  namespace: directus
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app: runtime-status-lightweight-canary
        spec:
          serviceAccountName: directus
          restartPolicy: Never
          initContainers:
            - name: vault-agent
              image: hashicorp/vault:1.15.4
              command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 50m
                  memory: 96Mi
              volumeMounts:
                - name: vault-agent-config
                  mountPath: /vault-config
                - name: vault-secrets
                  mountPath: /vault-secrets
          containers:
            - name: run
              image: alpine/k8s:1.31.4
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -eu
                  if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
                    apk add --no-cache curl jq ca-certificates >/dev/null
                  fi
                  VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
                  VAULT_TOKEN="$(cat /vault-secrets/vault-token)"
                  INTERNAL_TOKEN="$(curl -sS --connect-timeout 3 --max-time 8 -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/runtime-status-service" | jq -r '.data.data.token // .data.data.value // empty')"
                  if [ -z "${INTERNAL_TOKEN}" ] || [ "${INTERNAL_TOKEN}" = "null" ]; then
                    echo "runtime-status-service internal token missing"
                    exit 1
                  fi
                  REQUEST_ID="$(cat /proc/sys/kernel/random/uuid)"
                  curl -sS --connect-timeout 5 --max-time 45 \
                    -X POST \
                    -H "Authorization: Bearer ${INTERNAL_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "{\"definition_key\":\"cms.translation.pipeline.lightweight\",\"source\":\"schedule\",\"request_id\":\"${REQUEST_ID}\"}" \
                    "http://runtime-status-service.directus.svc.cluster.local:8080/internal/canaries/run"
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: vault-secrets
                  mountPath: /vault-secrets
          volumes:
            - name: vault-agent-config
              configMap:
                name: vault-agent-config-runtime-status-canary
            - name: vault-secrets
              emptyDir: {}
