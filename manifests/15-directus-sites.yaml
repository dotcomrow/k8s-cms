# Directus "customer sites" config (drives role + token + permissions bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-sites
  namespace: directus
  labels:
    app: directus
data:
  sites.yaml: |
    sites:
      # Internal site (Cloudflare Worker service client)
      - site_key: internal
        homepage_slug: home
        client_key: cms-site-internal
        role_name: cms-site-internal
        read_collections:
          - collection: demo_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: demo_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - collection:
                    _in:
                      - demo_block_rich_text
                      - demo_block_hero
          - collection: demo_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: demo_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published

      # External site (Cloudflare Worker service client)
      - site_key: external
        homepage_slug: home
        client_key: cms-site-external
        role_name: cms-site-external
        read_collections:
          - collection: demo_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: demo_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - collection:
                    _in:
                      - demo_block_rich_text
                      - demo_block_hero
          - collection: demo_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: demo_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
