# Directus "customer sites" config (drives role + token + permissions bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-sites
  namespace: directus
  labels:
    app: directus
data:
  sites.yaml: |
    # Bootstrap cache refresh endpoints for initial platform_apps rows.
    # Long-term app refresh URLs are managed on platform_apps in Directus.
    cache_refresh_endpoint_templates:
      internal_prod_refresh_url: &cache_refresh_internal_prod_refresh_url "https://internal.suncoast.systems/api/cache/refresh?mode=purge-and-refresh&slug=home"
      internal_preview_refresh_url: &cache_refresh_internal_preview_refresh_url "https://internal-preview.suncoast.systems/api/cache/refresh?mode=purge-and-refresh&slug=home"
      external_prod_refresh_url: &cache_refresh_external_prod_refresh_url "https://www.suncoast.systems/api/cache/refresh?mode=purge-and-refresh&slug=home"
      external_preview_refresh_url: &cache_refresh_external_preview_refresh_url "https://www-preview.suncoast.systems/api/cache/refresh?mode=purge-and-refresh&slug=home"

    sites:
      # Every Directus content scope needs one site entry. platform_apps rows
      # are the deployed app/cache-refresh identities; site_key is the content
      # scope passed as DIRECTUS_CONTENT_SITE_KEY. Multiple apps can share a
      # realm and either use distinct site_key values or refresh from the same
      # site_key.
      # Internal site (Cloudflare Worker service client)
      - site_key: internal
        app_key: internal
        realm: internal
        homepage_slug: home
        homepage_release_channel: preview
        homepage_layout_template_key: spa-default
        homepage_theme_package_key: theme-clear
        client_key: cms-site-internal
        role_name: cms-site-internal
        # These endpoints seed platform_apps when missing. Once an app row exists,
        # the app row is authoritative for generated refresh flows.
        cache_refresh:
          enabled: true
          targets:
            prod:
              enabled: true
              endpoint: *cache_refresh_internal_prod_refresh_url
              method: POST
              headers: []
            preview:
              enabled: true
              endpoint: *cache_refresh_internal_preview_refresh_url
              method: POST
              headers: []
          auth:
            enabled: true
            token_url: "https://auth-origin.suncoast.systems/realms/internal/protocol/openid-connect/token"
            audience: ""
            scope: ""
            audience_vault_path: "secret/data/keycloak-client-id-graphql-api"
            audience_vault_field: "value"
            client_id_vault_path: "secret/data/keycloak-client-id-cms-site-internal"
            client_id_vault_field: "value"
            client_secret_vault_path: "secret/data/keycloak-client-secret-cms-site-internal"
            client_secret_vault_field: "value"
        read_collections:
          - collection: cms_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published
          - collection: cms_layout_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_theme_packages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - collection:
                    _in:
                      - cms_block_rich_text
                      - cms_block_hero
                      - cms_block_module
                      - cms_block_template_ref
                      - cms_block_content_ref
          - collection: cms_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published
          - collection: cms_block_module
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published
          - collection: cms_block_template_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published
          - collection: cms_block_content_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published
          - collection: cms_content_items
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - release_channel:
                    _in:
                      - preview
                      - prod
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_content_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_template_functions
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - release_channel:
                    _in:
                      - preview
                      - prod
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_content_item_translations
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
          - collection: cms_translation_languages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
          - collection: cms_modules
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: platform_organizations
            fields:
              - "*"
            permissions: {}
          - collection: platform_apps
            fields:
              - "*"
            permissions: {}
          - collection: platform_app_operations
            fields:
              - "*"
            permissions: {}
          - collection: platform_app_operation_steps
            fields:
              - "*"
            permissions: {}
          - collection: cms_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - status:
                    _eq: published

      # External site (Cloudflare Worker service client)
      - site_key: external
        app_key: external
        realm: external
        # The external app is now created by the platform deployment pipeline.
        # Keep this site for content/auth scoping, but do not seed a deployed
        # platform_apps row from Directus startup.
        seed_platform_app: false
        homepage_slug: home
        homepage_release_channel: preview
        homepage_layout_template_key: spa-default
        homepage_theme_package_key: theme-clear
        client_key: cms-site-external
        # Runtime Keycloak client id can rotate on rebuilds; postschema reads this
        # Vault path and binds the resolved client id to the same Directus token.
        directus_client_id_vault_path: "secret/data/keycloak-client-id-graphql-api"
        directus_client_id_vault_field: "value"
        role_name: cms-site-external
        # The internal MFE reaches Directus through Hasura/Gravitee using the
        # GraphQL audience alias bound to this Directus service token.
        platform_management:
          enabled: true
        cache_refresh:
          enabled: true
          # Retry transient 429/5xx refresh failures from Cloudflare edge rules.
          retry_attempts: 12
          retry_delay_ms: 2000
          targets:
            prod:
              enabled: true
              endpoint: *cache_refresh_external_prod_refresh_url
              method: POST
              headers: []
            preview:
              enabled: true
              endpoint: *cache_refresh_external_preview_refresh_url
              method: POST
              retry_attempts: 12
              retry_delay_ms: 2000
              headers: []
          auth:
            enabled: true
            token_url: "https://auth-origin.suncoast.systems/realms/external/protocol/openid-connect/token"
            audience: ""
            scope: ""
            audience_vault_path: "secret/data/keycloak-client-id-graphql-api"
            audience_vault_field: "value"
            client_id_vault_path: "secret/data/keycloak-client-id-cms-site-external"
            client_id_vault_field: "value"
            client_secret_vault_path: "secret/data/keycloak-client-secret-cms-site-external"
            client_secret_vault_field: "value"
        read_collections:
          - collection: cms_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
          - collection: cms_layout_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_theme_packages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - collection:
                    _in:
                      - cms_block_rich_text
                      - cms_block_hero
                      - cms_block_module
                      - cms_block_template_ref
                      - cms_block_content_ref
          - collection: cms_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
          - collection: cms_block_module
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
          - collection: cms_block_template_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
          - collection: cms_block_content_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
          - collection: cms_content_items
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - release_channel:
                    _in:
                      - preview
                      - prod
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_content_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_template_functions
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - release_channel:
                    _in:
                      - preview
                      - prod
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_content_item_translations
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
          - collection: cms_translation_languages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
          - collection: cms_modules
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: platform_organizations
            fields:
              - "*"
            permissions: {}
          - collection: platform_apps
            fields:
              - "*"
            permissions: {}
          - collection: platform_app_operations
            fields:
              - "*"
            permissions: {}
          - collection: platform_app_operation_steps
            fields:
              - "*"
            permissions: {}
          - collection: cms_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - status:
                    _eq: published
