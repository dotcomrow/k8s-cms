# Directus "customer sites" config (drives role + token + permissions bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-sites
  namespace: directus
  labels:
    app: directus
data:
  sites.yaml: |
    sites:
      # Internal site (Cloudflare Worker service client)
      - site_key: internal
        client_key: cms-site-internal
        role_name: cms-site-internal
        read_collections:
          # Baseline system collections required by client apps.
          - directus_files
          - directus_folders
          # Content collections exposed to the site worker.
          - demo_pages
          - demo_page_blocks
          - demo_block_rich_text
          - demo_block_hero

      # External site (Cloudflare Worker service client)
      - site_key: external
        client_key: cms-site-external
        role_name: cms-site-external
        read_collections:
          - directus_files
          - directus_folders
          - demo_pages
          - demo_page_blocks
          - demo_block_rich_text
          - demo_block_hero
