# Directus "customer sites" config (drives role + token + permissions bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-sites
  namespace: directus
  labels:
    app: directus
data:
  sites.yaml: |
    # Single-source cache refresh endpoints for all sites/targets.
    # Update URLs here only; site target endpoint fields below reference these anchors.
    cache_refresh_endpoint_templates:
      internal_prod_refresh_url: &cache_refresh_internal_prod_refresh_url "https://internal.suncoast.systems/api/cache/refresh?mode=refresh"
      internal_preview_refresh_url: &cache_refresh_internal_preview_refresh_url "https://internal-preview.suncoast.systems/api/cache/refresh?mode=refresh"
      external_prod_refresh_url: &cache_refresh_external_prod_refresh_url "https://www.suncoast.systems/api/cache/refresh?mode=refresh"
      external_preview_refresh_url: &cache_refresh_external_preview_refresh_url "https://www-preview.suncoast.systems/api/cache/refresh?mode=refresh"

    sites:
      # Internal site (Cloudflare Worker service client)
      - site_key: internal
        homepage_slug: home
        homepage_release_channel: preview
        homepage_layout_template_key: spa-default
        homepage_theme_package_key: theme-clear
        client_key: cms-site-internal
        role_name: cms-site-internal
        # Flow endpoints can be edited in Directus UI (Settings -> Flows),
        # but this GitOps config is authoritative on deploy.
        cache_refresh:
          enabled: true
          targets:
            prod:
              enabled: true
              endpoint: *cache_refresh_internal_prod_refresh_url
              method: POST
              headers: []
            preview:
              enabled: true
              endpoint: *cache_refresh_internal_preview_refresh_url
              method: POST
              headers: []
          auth:
            enabled: true
            token_url: "https://auth-origin.suncoast.systems/realms/internal/protocol/openid-connect/token"
            audience: ""
            scope: ""
            audience_vault_path: "secret/data/keycloak-client-id-graphql-api"
            audience_vault_field: "value"
            client_id_vault_path: "secret/data/keycloak-client-id-cms-site-internal"
            client_id_vault_field: "value"
            client_secret_vault_path: "secret/data/keycloak-client-secret-cms-site-internal"
            client_secret_vault_field: "value"
        read_collections:
          - collection: cms_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_layout_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_theme_packages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - collection:
                    _in:
                      - cms_block_rich_text
                      - cms_block_hero
                      - cms_block_module
                      - cms_block_template_ref
          - collection: cms_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_block_module
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_block_template_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_modules
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: internal
          - collection: cms_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: internal
                - page_slug:
                    _eq: home
                - status:
                    _eq: published

      # External site (Cloudflare Worker service client)
      - site_key: external
        homepage_slug: home
        homepage_release_channel: preview
        homepage_layout_template_key: spa-default
        homepage_theme_package_key: theme-clear
        client_key: cms-site-external
        # Runtime Keycloak client id can rotate on rebuilds; postschema reads this
        # Vault path and binds the resolved client id to the same Directus token.
        directus_client_id_vault_path: "secret/data/keycloak-client-id-graphql-api"
        directus_client_id_vault_field: "value"
        role_name: cms-site-external
        cache_refresh:
          enabled: true
          # Retry transient 429/5xx refresh failures from Cloudflare edge rules.
          retry_attempts: 12
          retry_delay_ms: 2000
          targets:
            prod:
              enabled: true
              endpoint: *cache_refresh_external_prod_refresh_url
              method: POST
              headers: []
            preview:
              enabled: true
              endpoint: *cache_refresh_external_preview_refresh_url
              method: POST
              retry_attempts: 12
              retry_delay_ms: 2000
              headers: []
          auth:
            enabled: true
            token_url: "https://auth-origin.suncoast.systems/realms/external/protocol/openid-connect/token"
            audience: ""
            scope: ""
            audience_vault_path: "secret/data/keycloak-client-id-graphql-api"
            audience_vault_field: "value"
            client_id_vault_path: "secret/data/keycloak-client-id-cms-site-external"
            client_id_vault_field: "value"
            client_secret_vault_path: "secret/data/keycloak-client-secret-cms-site-external"
            client_secret_vault_field: "value"
        read_collections:
          - collection: cms_pages
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_layout_templates
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_theme_packages
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_page_blocks
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - collection:
                    _in:
                      - cms_block_rich_text
                      - cms_block_hero
                      - cms_block_module
                      - cms_block_template_ref
          - collection: cms_block_rich_text
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_block_module
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_block_template_ref
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
          - collection: cms_modules
            fields:
              - "*"
            permissions:
              _and:
                - status:
                    _eq: published
                - _or:
                    - site_key:
                        _null: true
                    - site_key:
                        _eq: external
          - collection: cms_block_hero
            fields:
              - "*"
            permissions:
              _and:
                - site_key:
                    _eq: external
                - page_slug:
                    _eq: home
                - status:
                    _eq: published
