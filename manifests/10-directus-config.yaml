            }
            return h('span', {
              style: {
                padding: '1px 5px',
                borderRadius: '999px',
                border: '1px solid var(--theme--border-subdued)',
                background: 'var(--theme--background-subdued)',
                fontSize: '10px',
                color: 'var(--theme--foreground-subdued)',
              },
            }, text);
          };
    
          const renderCard = ({ className, style, children }) => {
            if (hasCard) {
              return h(
                resolvedCard,
                {
                  class: className,
                  style,
                },
                { default: () => children }
              );
            }
            return h('section', {
              class: className,
              style: {
                border: '1px solid var(--theme--border-subdued)',
                borderRadius: 'var(--theme--border-radius)',
                background: 'var(--theme--background-page)',
                ...style,
              },
            }, children);
          };
    
          const renderTreeNode = (row, ancestorPath = []) => {
            const rowId = asString(row?.id);
            const hasCycle = rowId && ancestorPath.includes(rowId);
            if (hasCycle) {
              return h('li', { key: `${rowId}-cycle` }, [
                h('article', { class: 'cms-page-blocks-manager__tree-node-card', style: styles.treeNodeCard }, [
                  h('strong', { style: styles.treeNodeTitle }, `Cycle detected at block ${rowId}`),
                ]),
              ]);
            }
            const childRows = childrenByParent.get(rowId) || [];
            const hasChildren = childRows.length > 0;
            const nodeExpanded = isNodeExpanded(rowId, true);
            const collectionKey = asString(row?.collection);
            const blockTypeLabel = collectionDisplayName(collectionKey);
            const isTemplateNode = hasChildren
              || toLower(row?.template_scope) === 'template'
              || toLower(collectionKey).includes('template');
            const title = asString(row?.group_tag) || `${blockTypeLabel} (${asString(row?.slot) || 'main'})`;
            const subtitle = collectionKey || '(collection?)';
            const rowBusy = isSaving(rowId) || isDeleting(rowId);
            const rowTemplateKey = asString(row?.template_group_key);
            return h('li', { key: rowId }, [
              h('article', { class: 'cms-page-blocks-manager__tree-node-card', style: styles.treeNodeCard }, [
                h('header', { class: 'cms-page-blocks-manager__tree-node-header', style: styles.treeNodeHeader }, [
                  h('div', { style: styles.treeNodeHeaderLeft }, [
                    ...(hasChildren
                      ? [
                          renderIconControl({
                            icon: nodeExpanded ? 'remove' : 'add',
                            fallbackIcon: nodeExpanded ? '−' : '+',
                            label: nodeExpanded ? 'Collapse children' : 'Expand children',
                            disabled: rowBusy,
                            onClick: () => toggleNodeExpanded(rowId, true),
                          }),
                        ]
                      : []),
                    h('div', { style: styles.treeNodeTitleWrap }, [
                      h('strong', { style: styles.treeNodeTitle }, title),
                      h('span', { style: styles.treeNodeSubtitle }, subtitle),
                    ]),
                  ]),
                  h('div', { style: styles.treeNodeActions }, [
                    renderIconControl({
                      icon: 'tune',
                      fallbackIcon: 'B',
                      label: 'Edit block settings',
                      disabled: !rowId || rowBusy,
                      onClick: () => openBlockRow(row),
                    }),
                    renderIconControl({
                      icon: 'edit_note',
                      fallbackIcon: 'C',
                      label: 'Edit block content',
                      disabled: !row.collection || !row.item || rowBusy,
                      onClick: () => openContentItem(row),
                    }),
                    renderIconControl({
                      icon: 'delete',
                      fallbackIcon: '🗑',
                      label: isDeleting(rowId) ? 'Deleting block...' : 'Delete block',
                      disabled: !rowId || rowBusy,
                      danger: true,
                      onClick: () => { void deleteBlockRow(row); },
                    }),
                  ]),
                ]),
                h('div', { style: styles.treeNodeMeta }, [
                  renderMetaChip(blockTypeLabel),
                  renderMetaChip(`slot:${asString(row?.slot) || 'main'}`),
                  ...(asInteger(row?.sort) !== null ? [renderMetaChip(`sort:${asInteger(row?.sort)}`)] : []),
                  ...(asString(row?.group_tag) ? [renderMetaChip(`group:${asString(row.group_tag)}`)] : []),
                  ...(rowTemplateKey && rowTemplateKey !== 'page-root' ? [renderMetaChip(`tpl:${rowTemplateKey}`)] : []),
                  ...(isTemplateNode ? [renderMetaChip(`children:${childRows.length}`)] : []),
                ]),
              ]),
              ...(hasChildren && nodeExpanded
                ? [
                    h('ul', { class: 'cms-page-blocks-manager__tree-child-list', style: styles.treeChildList }, childRows.map((childRow) => renderTreeNode(childRow, [...ancestorPath, rowId]))),
                  ]
                : []),
            ]);
          };
          const rootExpanded = isNodeExpanded('__root', true);
          const selectedAddTypeLabel = addBlockTypeChoices.find((item) => item.value === addBlockType.value)?.text || 'Block';
          const creatingAddTypeLabel = addBlockTypeChoices.find((item) => item.value === creatingBlockType.value)?.text || 'Block';

          const children = [
            renderCard({
              className: 'cms-page-blocks-manager__toolbar-card',
              children: [
                h('div', { class: 'cms-page-blocks-manager__toolbar', style: styles.toolbar }, [
                  h('div', { style: styles.toolbarActionGroup }, [
                    renderIconControl({
                      icon: 'autorenew',
                      fallbackIcon: '↻',
                      label: loading.value ? 'Loading...' : 'Reload blocks',
                      disabled: loading.value,
                      onClick: () => { void refreshAll(); },
                    }),
                    renderIconControl({
                      icon: 'unfold_more',
                      fallbackIcon: '▾▾',
                      label: 'Expand all',
                      disabled: loading.value || blocks.value.length === 0,
                      onClick: () => expandCollapseAllNodes(true),
                    }),
                    renderIconControl({
                      icon: 'unfold_less',
                      fallbackIcon: '▴▴',
                      label: 'Collapse all',
                      disabled: loading.value || blocks.value.length === 0,
                      onClick: () => expandCollapseAllNodes(false),
                    }),
                  ]),
                  h('div', { style: styles.toolbarSearch }, [
                    renderInputControl({
                      value: searchText.value,
                      disabled: loading.value,
                      placeholder: 'Search blocks (type, slot, group, template, id)',
                      onUpdate: (next) => { searchText.value = asString(next); },
                    }),
                  ]),
                  h('div', { style: styles.toolbarActionGroup }, [
                    h('div', { style: { minWidth: '180px' } }, [
                      renderSelectControl({
                        value: addBlockType.value,
                        items: addBlockTypeChoices,
                        disabled: !pageId.value || !!creatingBlockType.value || loading.value,
                        onUpdate: (next) => { addBlockType.value = asString(next) || 'rich_text'; },
                      }),
                    ]),
                    renderButtonControl({
                      label: creatingBlockType.value ? `Adding ${creatingAddTypeLabel}...` : `Add ${selectedAddTypeLabel}`,
                      disabled: !pageId.value || !!creatingBlockType.value || loading.value,
                      primary: true,
                      onClick: () => { void createPageBlockWithContent(addBlockType.value); },
                    }),
                  ]),
                ]),
              ],
            }),
          ];

          if (pageId.value) {
            children.push(
              h('p', { class: 'cms-page-blocks-manager__meta', style: styles.meta }, `Page ${pageContext.value.slug || pageId.value} | Site ${pageContext.value.site_key || '(global)'} | Layout ${pageContext.value.layout_template_key || '(none)'} | Blocks ${visibleCount}/${blocks.value.length}`)
            );
          } else {
            children.push(
              h('p', { class: 'cms-page-blocks-manager__meta', style: styles.meta }, 'Save this page first to manage blocks.')
            );
          }
    
          if (error.value) {
            children.push(
              hasNotice
                ? h(resolvedNotice, { type: 'danger' }, () => error.value)
                : h('p', { class: 'cms-page-blocks-manager__error' }, error.value)
            );
          }
          if (info.value && !error.value) {
            children.push(
              hasNotice
                ? h(resolvedNotice, { type: 'success' }, () => info.value)
                : h('p', { class: 'cms-page-blocks-manager__hint' }, info.value)
            );
          }

          if (!loading.value && rootRows.length === 0) {
            children.push(
              h(
                'p',
                { class: 'cms-page-blocks-manager__hint', style: styles.meta },
                pageId.value
                  ? (searchNeedle ? 'No blocks match the current search.' : 'No blocks found for this page.')
                  : 'No page context available.'
              )
            );
          }

          if (pageId.value && rootRows.length > 0) {
            children.push(
              h('div', { class: 'cms-page-blocks-manager__tree-viewport-frame', style: styles.treeViewportFrame }, [
                h('div', { class: 'cms-page-blocks-manager__tree-viewport', style: styles.treeViewport }, [
                  h('section', { class: 'cms-page-blocks-manager__tree-root', style: styles.treeRoot }, [
                    h('article', { class: 'cms-page-blocks-manager__tree-node-card', style: styles.treeNodeCard }, [
                    h('header', { style: styles.treePageHeader }, [
                      h('div', { style: styles.treeNodeHeaderLeft }, [
                        renderIconControl({
                          icon: rootExpanded ? 'remove' : 'add',
                          fallbackIcon: rootExpanded ? '−' : '+',
                          label: rootExpanded ? 'Collapse tree' : 'Expand tree',
                          disabled: false,
                          onClick: () => toggleNodeExpanded('__root', true),
                        }),
                        h('strong', { style: styles.treeNodeTitle }, `Page Root: ${pageContext.value.slug || pageId.value}`),
                      ]),
                      renderMetaChip(`children=${rootRows.length}`),
                    ]),
                  ]),
                    ...(rootExpanded
                      ? [h('ul', { class: 'cms-page-blocks-manager__tree-list', style: styles.treeList }, rootRows.map((row) => renderTreeNode(row)))]
                      : []),
                  ]),
                ]),
              ])
            );
          }

          if (hasDrawerItem) {
            children.push(
              h(resolvedDrawerItem, {
                key: `${drawerCollection.value || pageBlocksCollection.value}:${drawerPrimaryKey.value || '+'}:${drawerSessionKey.value}`,
                active: drawerActive.value,
                collection: drawerCollection.value || pageBlocksCollection.value,
                primaryKey: drawerPrimaryKey.value || '+',
                disabled: props.disabled,
                nonEditable: props.disabled,
                onInput: (payload) => {
                  void handleDrawerInput(payload);
                },
                onSave: (payload) => {
                  void handleDrawerInput(payload);
                },
                onSaved: (payload) => {
                  void handleDrawerInput(payload);
                },
                onSubmit: (payload) => {
                  void handleDrawerInput(payload);
                },
                'onUpdate:active': (next) => {
                  handleDrawerActive(next);
                },
              })
            );
          }

          return h('div', { class: 'cms-page-blocks-manager', style: styles.root }, children);
        };
      },
    });
    
    export default defineInterface({
      id: 'cms-page-blocks-manager',
      name: 'CMS Page Blocks Manager',
      icon: 'view_list',
      description: 'Tree manager for page blocks with nested template/content navigation and quick edit links.',
      component: InterfaceComponent,
      types: ['alias'],
      localTypes: ['m2a', 'o2m'],
      group: 'relational',
      options: [
        {
          field: 'pages_collection',
          name: 'Pages Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_pages' },
        },
        {
          field: 'page_blocks_collection',
          name: 'Page Blocks Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_page_blocks' },
        },
        {
          field: 'layout_templates_collection',
          name: 'Layout Templates Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_layout_templates' },
        },
        {
          field: 'layout_slots_collection',
          name: 'Layout Slots Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_layout_template_slots' },
        },
        {
          field: 'page_id_field',
          name: 'Page ID Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'id' },
        },
        {
          field: 'page_template_field',
          name: 'Page Template Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'layout_template_key' },
        },
        {
          field: 'page_site_field',
          name: 'Page Site Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'site_key' },
        },
        {
          field: 'default_group_by',
          name: 'Default Group By',
          type: 'string',
          meta: {
            width: 'half',
            interface: 'select-dropdown',
            options: {
              choices: [
                { text: 'Template Group', value: 'template' },
                { text: 'Group Tag', value: 'group_tag' },
                { text: 'Slot', value: 'slot' },
                { text: 'Collection', value: 'collection' },
                { text: 'None', value: 'none' }
              ]
            }
          },
          schema: { default_value: 'template' },
        },
        {
          field: 'default_hierarchy',
          name: 'Default Hierarchy Filter',
          type: 'string',
          meta: {
            width: 'half',
            interface: 'select-dropdown',
            options: {
              choices: [
                { text: 'Page Children', value: 'direct_children' },
                { text: 'Nested Only', value: 'nested_only' },
                { text: 'All Blocks', value: 'all' }
              ]
            }
          },
          schema: { default_value: 'direct_children' },
        },
        {
          field: 'default_limit',
          name: 'Default Query Limit',
          type: 'integer',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 400 },
        },
        {
          field: 'admin_base_path',
          name: 'Admin Base Path',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: '/admin/content' },
        },
      ],
    });
---
# Vault Agent Configuration for Directus
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus
  namespace: directus
data:
  vault-agent.hcl: "pid_file = \"/vault/agent.pid\"\nexit_after_auth = false\n\nvault {\n  address = \"http://vault.vault.svc.cluster.local:8200\"\n}\n\nauto_auth {\n  method \"kubernetes\" {\n    mount_path = \"auth/kubernetes\"\n    config = {\n      role = \"directus\"\n    }\n  }\n  \n  sink \"file\" {\n    config = {\n      path = \"/vault/token\"\n    }\n  }\n}\n\ntemplate {\n  source      = \"/vault-templates/db-creds.tpl\"\n  destination = \"/vault-secrets/db-creds.env\"\n  perms       = 0644\n}\n\ntemplate {\n  source      = \"/vault-templates/app-keys.tpl\"\n  destination = \"/vault-secrets/app-keys.env\"\n  perms       = 0644\n}\n\ntemplate {\n  source      = \"/vault-templates/openai.tpl\"\n  destination = \"/vault-secrets/openai.env\"\n  perms       = 0644\n}\n\n\n\ntemplate {\n  source      = \"/vault-templates/redis-creds.tpl\"\n  destination = \"/vault-secrets/redis-creds.env\"\n  perms       = 0644\n}\n"
  db-creds.tpl: |
    {{ with secret "yugabyte-db/static-creds/directus-app" -}}
    export DB_USER="{{ .Data.username }}"
    export DB_PASSWORD="{{ .Data.password }}"
    {{- end }}
  app-keys.tpl: |
    {{ with secret "secret/data/directus/keys" -}}
    export KEY="{{ .Data.data.key }}"
    export SECRET="{{ .Data.data.secret }}"
    {{- end }}
  openai.tpl: |
    {{ with secret "secret/data/open_ai_key" -}}
    export OPENAI_API_KEY="{{ .Data.data.value }}"
    {{- end }}
  redis-creds.tpl: |
    {{ with secret "secret/data/redis" -}}
    export REDIS_PASSWORD="{{ .Data.data.password }}"
    {{- end }}
---
# PersistentVolumeClaim for Directus uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads
  namespace: directus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-client
