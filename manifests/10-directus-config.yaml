        const layoutTemplatesCollection = computed(() => asString(resolvedOptions.value?.layout_templates_collection) || 'cms_layout_templates');
        const layoutSlotsCollection = computed(() => asString(resolvedOptions.value?.layout_slots_collection) || 'cms_layout_template_slots');
        const pageIdField = computed(() => asString(resolvedOptions.value?.page_id_field) || 'id');
        const pageTemplateField = computed(() => asString(resolvedOptions.value?.page_template_field) || 'layout_template_key');
        const pageSiteField = computed(() => asString(resolvedOptions.value?.page_site_field) || 'site_key');
        const moduleRegistryEnabled = computed(() => asBoolean(resolvedOptions.value?.module_registry_enabled, false));
        const moduleRegistryUrl = computed(() => asString(resolvedOptions.value?.module_registry_url).replace(/\/+$/g, ''));
        const moduleRegistryPath = computed(() => asString(resolvedOptions.value?.module_registry_path) || '/api/modules');
        const moduleRegistryChannelOption = computed(() => toLower(resolvedOptions.value?.module_registry_channel || 'auto'));
        const moduleRegistryLimit = computed(() => {
          const configured = asInteger(resolvedOptions.value?.module_registry_limit);
          if (!configured || configured < 1) return 250;
          return Math.min(configured, 1000);
        });
        const moduleRegistryCacheTtlMs = computed(() => {
          const configured = asInteger(resolvedOptions.value?.module_registry_cache_ttl_ms, 180000);
          if (!configured || configured < 1000) return 180000;
          return Math.min(configured, 3600000);
        });
        const addBlockTypeChoices = [
          { text: 'Rich Text', value: 'rich_text' },
          { text: 'Hero', value: 'hero' },
          { text: 'Image', value: 'image' },
          { text: 'Module', value: 'module' },
          { text: 'MFE', value: 'mfe' },
          { text: 'Template', value: 'template_ref' },
        ];
        const defaultLimit = computed(() => {
          const candidate = asInteger(resolvedOptions.value?.default_limit);
          if (!candidate || candidate < 50) return 400;
          return Math.min(candidate, 1000);
        });
        const defaultSort = computed(() => {
          const source = resolvedOptions.value?.default_sort;
          if (Array.isArray(source) && source.length > 0) {
            return source.map((entry) => asString(entry)).filter(Boolean);
          }
          return ['template_scope', 'template_group_key', 'group_tag', 'tree_path', 'sort'];
        });
        const defaultHierarchy = computed(() => {
          const candidate = toLower(resolvedOptions.value?.default_hierarchy || 'direct_children');
          if (candidate === 'all' || candidate === 'nested_only' || candidate === 'direct_children') return candidate;
          return 'direct_children';
        });
        const PAGE_CONTEXT_ID = '__page';
        const buildTemplateContextId = (blockId) => {
          const normalized = parseId(blockId);
          if (!normalized) return '';
          return `template:${normalized}`;
        };
        const parseTemplateContextId = (contextId) => {
          const normalized = asString(contextId);
          if (!normalized.startsWith('template:')) return '';
          return normalized.slice('template:'.length);
        };
    
        const pageIdFromValues = computed(() => parseId(props.values?.[pageIdField.value] ?? props.values?.id));
        const pageId = computed(() => {
          const fromValues = pageIdFromValues.value;
          if (fromValues) return fromValues;
          return getPrimaryKeyFromLocation(pagesCollection.value);
        });
        const sourcePageReleaseChannel = computed(() => {
          const contextValue = toLower(pageContext.value?.release_channel);
          if (contextValue) return contextValue;
          return toLower(props.values?.release_channel);
        });
        const canPromoteToProd = computed(() =>
          Boolean(pageId.value)
          && sourcePageReleaseChannel.value === PROMOTE_SOURCE_CHANNEL
        );
    
        const isNodeExpanded = (nodeKey, defaultOpen = true) => {
          const key = asString(nodeKey);
          if (!key) return Boolean(defaultOpen);
          const current = expandedNodes.value?.[key];
          if (typeof current === 'boolean') return current;
          return Boolean(defaultOpen);
        };
    
        const setNodeExpanded = (nodeKey, nextOpen) => {
          const key = asString(nodeKey);
          if (!key) return;
          expandedNodes.value = {
            ...expandedNodes.value,
            [key]: Boolean(nextOpen),
          };
        };
    
        const toggleNodeExpanded = (nodeKey, defaultOpen = true) => {
          setNodeExpanded(nodeKey, !isNodeExpanded(nodeKey, defaultOpen));
        };
    
        const expandCollapseAllNodes = (expanded) => {
          const next = { __root: Boolean(expanded) };
          for (const row of blocks.value) {
            const rowId = asString(row?.id);
            if (!rowId) continue;
            next[rowId] = Boolean(expanded);
          }
          expandedNodes.value = next;
        };
    
        const resetFilters = () => {
          searchText.value = '';
          filterCollection.value = '__all';
          filterSlot.value = '__all';
          filterScope.value = '__all';
          filterGroupTag.value = '__all';
          filterHierarchy.value = defaultHierarchy.value;
          groupBy.value = asString(resolvedOptions.value?.default_group_by) || 'template';
          selectedContext.value = PAGE_CONTEXT_ID;
        };
    
        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    
        const isTransientSchemaMismatchMessage = (message) => {
          const normalized = toLower(message);
          return (
            normalized.includes('mismatched_schema')
            || normalized.includes('catalog snapshot')
            || normalized.includes('catalog version mismatch')
            || normalized.includes('invalidated')
          );
        };
    
        const apiRequest = async (method, path, query = {}, body = null) => {
          const url = new URL(path, window.location.origin);
          Object.entries(query || {}).forEach(([key, value]) => {
            if (value === null || value === undefined || value === '') return;
            url.searchParams.set(key, String(value));
          });
    
          const upperMethod = toLower(method) === 'get' ? 'GET' : method;
          const maxAttempts = upperMethod === 'GET' ? 5 : 1;
    
          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            try {
              const response = await fetch(url.toString(), {
                method: upperMethod,
                cache: 'no-store',
                credentials: 'same-origin',
                headers: {
                  Accept: 'application/json',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
    
              const payload = await response.json().catch(() => ({}));
              if (!response.ok) {
                const message = payload?.errors?.[0]?.message || `${upperMethod} failed (${response.status})`;
                const canRetry =
                  upperMethod === 'GET'
                  && attempt < maxAttempts
                  && isTransientSchemaMismatchMessage(message);
                if (canRetry) {
                  await delay(300 * attempt);
                  continue;
                }
                throw new Error(message);
              }
              return payload;
            } catch (error) {
              const message = error?.message || `${upperMethod} failed`;
              const canRetry =
                upperMethod === 'GET'
                && attempt < maxAttempts
                && isTransientSchemaMismatchMessage(message);
              if (canRetry) {
                await delay(300 * attempt);
                continue;
              }
              throw error;
            }
          }
    
          throw new Error(`${upperMethod} failed after retries.`);
        };
    
        const readRegistryCache = (cacheKey) => {
          if (!cacheKey || typeof window === 'undefined') return null;
          const now = Date.now();
          const memoryStore = window.__cmsModuleRegistryResponseCache ?? {};
          const memoryEntry = memoryStore[cacheKey];
          if (memoryEntry && Number(memoryEntry.expiresAt || 0) > now && memoryEntry.payload) {
            return memoryEntry.payload;
          }
          try {
            const raw = window.localStorage.getItem(`cms:module-registry:${cacheKey}`);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (Number(parsed?.expiresAt || 0) <= now || !parsed?.payload) {
              window.localStorage.removeItem(`cms:module-registry:${cacheKey}`);
              return null;
            }
            const nextMemoryStore = window.__cmsModuleRegistryResponseCache ?? {};
            nextMemoryStore[cacheKey] = parsed;
            window.__cmsModuleRegistryResponseCache = nextMemoryStore;
            return parsed.payload;
          } catch {
            return null;
          }
        };

        const writeRegistryCache = (cacheKey, cacheTtlMs, payload) => {
          if (!cacheKey || !payload || typeof window === 'undefined') return;
          const expiresAt = Date.now() + cacheTtlMs;
          const entry = { expiresAt, payload };
          const memoryStore = window.__cmsModuleRegistryResponseCache ?? {};
          memoryStore[cacheKey] = entry;
          window.__cmsModuleRegistryResponseCache = memoryStore;
          try {
            window.localStorage.setItem(`cms:module-registry:${cacheKey}`, JSON.stringify(entry));
          } catch {
            // Ignore storage quota/permission issues; memory cache remains available.
          }
        };

        const externalApiGet = async (baseUrl, path, params = {}, cacheConfig = {}) => {
          const prefix = asString(baseUrl).replace(/\/+$/g, '');
          const suffix = asString(path);
          const normalizedPath = suffix.startsWith('/') ? suffix : `/${suffix}`;
          const url = new URL(`${prefix}${normalizedPath}`);
          Object.entries(params).forEach(([key, value]) => {
            if (value === null || value === undefined || value === '') return;
            url.searchParams.set(key, String(value));
          });

          const cacheKey = asString(cacheConfig?.cacheKey);
          const cacheTtlMs = asInteger(cacheConfig?.cacheTtlMs, moduleRegistryCacheTtlMs.value);
          const cached = readRegistryCache(cacheKey);
          if (cached) return cached;

          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort('registry_timeout'), 10000);
          try {
            const response = await fetch(url.toString(), {
              method: 'GET',
              credentials: 'omit',
              cache: 'no-store',
              headers: {
                Accept: 'application/json',
              },
              signal: controller.signal,
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              const message = payload?.error || payload?.errors?.[0]?.message || `GET failed (${response.status})`;
              throw new Error(message);
            }
            writeRegistryCache(cacheKey, cacheTtlMs, payload);
            return payload;
          } finally {
            clearTimeout(timeout);
          }
        };
    
        const toStableObject = (value) => {
          if (Array.isArray(value)) {
            return value.map((entry) => toStableObject(entry));
          }
          if (!value || typeof value !== 'object') return value;
          const output = {};
          for (const key of Object.keys(value).sort((a, b) => a.localeCompare(b))) {
            output[key] = toStableObject(value[key]);
          }
          return output;
        };
    
        const toSnapshotHash = (value) => {
          try {
            return JSON.stringify(toStableObject(value ?? null));
          } catch {
            return '';
          }
        };
    
        const unwrapDrawerPayload = (value) => {
          if (!value || typeof value !== 'object') return {};
          const candidateKeys = ['edits', 'values', 'data', 'item'];
          for (const key of candidateKeys) {
            const nested = value?.[key];
            if (nested && typeof nested === 'object' && !Array.isArray(nested)) {
              return nested;
            }
          }
          return value;
        };
    
        const sanitizeDrawerPatchPayload = (value) => {
          const source = unwrapDrawerPayload(value);
          if (!source || typeof source !== 'object' || Array.isArray(source)) return {};
    
          const blockedKeys = new Set([
            'id',
            'date_created',
            'date_updated',
            'user_created',
            'user_updated',
            '__typename',
          ]);
          const payload = {};
          for (const [rawKey, rawValue] of Object.entries(source)) {
            const key = asString(rawKey);
            if (!key || blockedKeys.has(key) || key.startsWith('$')) continue;
            payload[key] = rawValue;
          }
          return payload;
        };
    
        const fetchDrawerSnapshotHash = async (collectionName, primaryKey) => {
          const collection = asString(collectionName);
          const rowId = parseId(primaryKey);
          if (!collection || !rowId || rowId === '+') return '';
          try {
            const response = await apiRequest(
              'GET',
              `/items/${collection}/${encodeURIComponent(rowId)}`,
              { fields: '*' },
            );
            return toSnapshotHash(response?.data || null);
          } catch {
            return '';
          }
        };
    
        const captureDrawerSnapshot = async (collectionName, primaryKey, sessionToken) => {
          const snapshot = await fetchDrawerSnapshotHash(collectionName, primaryKey);
          if (sessionToken !== drawerSessionKey.value) return '';
          drawerSnapshotHash.value = snapshot;
          return snapshot;
        };
    
    
        const normalizeBlockRow = (row) => {
          const groupTag = asString(row?.group_tag);
          const slot = asString(row?.slot) || 'main';
          const templateScope = asString(row?.template_scope) || 'page';
          const templateGroupKey = asString(row?.template_group_key) || 'page-root';
          const sortValue = asInteger(row?.sort);
          const treePath = asString(row?.tree_path);
          const collection = asString(row?.collection);
          const item = parseId(row?.item);
          const status = asString(row?.status);
          const treeDepth = asInteger(row?.tree_depth) ?? 0;
          const pageSlug = asString(row?.page_slug);
          const parentBlockId = parseId(row?.parent_block_id);
          const templateRootBlockId = parseId(row?.template_root_block_id);
          const templateNearestBlockId = parseId(row?.template_nearest_block_id);
          const contextToken = templateNearestBlockId ? buildTemplateContextId(templateNearestBlockId) : PAGE_CONTEXT_ID;
          const hierarchyToken = parentBlockId ? 'nested-child' : 'page-child';
          const searchTokens = [
            parseId(row?.id),
            collection,
            item,
            slot,
            groupTag,
            templateScope,
            templateGroupKey,
            treePath,
            parentBlockId,
            templateRootBlockId,
            templateNearestBlockId,
            contextToken,
            hierarchyToken,
            pageSlug,
            ...(status ? [status] : []),
          ]
            .map((entry) => toLower(entry))
            .filter(Boolean);
    
          return {
            id: parseId(row?.id),
            collection,
            item,
            slot,
            group_tag: groupTag,
            template_scope: templateScope,
            template_group_key: templateGroupKey,
            tree_path: treePath,
            tree_depth: treeDepth,
            sort: sortValue,
            status,
            parent_block_id: parentBlockId,
            template_root_block_id: templateRootBlockId,
            template_nearest_block_id: templateNearestBlockId,
            page_slug: pageSlug,
            _context_id: contextToken,
            _search_text: searchTokens.join(' '),
          };
        };
    
        const primeDrafts = () => {
          const next = {};
          for (const row of blocks.value) {
            next[row.id] = {
              slot: asString(row.slot) || 'main',
              sort: row.sort,
              group_tag: asString(row.group_tag),
            };
          }
          drafts.value = next;
        };
    
        const buildRelationManagerValue = () => {
          const rows = [];
          for (const row of blocks.value) {
            const rowId = parseId(row?.id);
            const collectionName = asString(row?.collection);
            const itemId = parseId(row?.item);
            if (!rowId && (!collectionName || !itemId)) continue;
    
            const nextRow = {};
            if (rowId) nextRow.id = rowId;
            if (collectionName) nextRow.collection = collectionName;
            if (itemId) nextRow.item = itemId;
    
            const slot = asString(row?.slot);
            if (slot) nextRow.slot = slot;
    
            const sortValue = asInteger(row?.sort);
            if (sortValue !== null) nextRow.sort = sortValue;
    
            const parentId = parseId(row?.parent_block_id);
            if (parentId) nextRow.parent_block_id = parentId;
    
            const groupTag = asString(row?.group_tag);
            if (groupTag) nextRow.group_tag = groupTag;
    
            rows.push(nextRow);
          }
          return rows;
        };
    
        const markPageDirtyFromDrawerEdits = () => {
          if (props.disabled) return;
          // Emit a canonical relation payload so Directus marks the parent form as dirty.
          emit('input', buildRelationManagerValue());
          info.value = 'Detected content updates from drawer. Save the page to publish and trigger refresh.';
        };
    
        const loadPageContext = async () => {
          if (!pageId.value) {
            pageContext.value = { id: '', slug: '', site_key: '', release_channel: '', layout_template_key: '' };
            return;
          }
          const response = await apiRequest('GET', `/items/${pagesCollection.value}/${encodeURIComponent(pageId.value)}`, {
            fields: ['id', 'slug', pageSiteField.value, 'release_channel', pageTemplateField.value].join(','),
          });
          const row = response?.data || {};
          pageContext.value = {
            id: parseId(row?.id) || pageId.value,
            slug: asString(row?.slug),
            site_key: asString(row?.[pageSiteField.value]),
            release_channel: asString(row?.release_channel),
            layout_template_key: asString(row?.[pageTemplateField.value]),
          };
        };
    
        const resolveModuleRegistryChannel = () => {
          const configured = moduleRegistryChannelOption.value;
          if (configured === 'preview' || configured === 'prod' || configured === 'all') return configured;
          const pageReleaseChannel = toLower(pageContext.value?.release_channel);
          if (pageReleaseChannel === 'preview' || pageReleaseChannel === 'prod') return pageReleaseChannel;
          return 'all';
        };
    
        const loadModuleRegistryModules = async () => {
          if (!moduleRegistryEnabled.value || !moduleRegistryUrl.value) {
            moduleRegistryModules.value = [];
            return;
          }
    
          try {
            const response = await externalApiGet(moduleRegistryUrl.value, moduleRegistryPath.value, {
              channel: resolveModuleRegistryChannel(),
              limit: moduleRegistryLimit.value,
            }, {
              cacheKey: `module-list:${moduleRegistryUrl.value}:${moduleRegistryPath.value}:${resolveModuleRegistryChannel()}:${moduleRegistryLimit.value}`,
              cacheTtlMs: moduleRegistryCacheTtlMs.value,
            });
            const rows = Array.isArray(response?.items)
              ? response.items
              : Array.isArray(response?.data?.items)
                ? response.data.items
                : [];
            moduleRegistryModules.value = rows
              .map((row) => ({
                module_key: asString(row?.module_key),
                provider: toLower(row?.provider),
                latest_version_preview: asString(row?.latest_version_preview),
                latest_version_prod: asString(row?.latest_version_prod),
              }))
              .filter((row) => Boolean(row.module_key));
          } catch (registryError) {
            moduleRegistryModules.value = [];
            // Keep UX functional via cms_modules fallback.
            console.warn('cms-page-blocks-manager: module registry fetch failed; using cms_modules fallback', registryError);
          }
        };
    
        const templateSlotsFor = (templateKey) => {
          const normalizedTemplateKey = asString(templateKey);
          if (!normalizedTemplateKey) return ['main'];
          const fromCache = slotsByTemplateKey.value[normalizedTemplateKey];
          if (!Array.isArray(fromCache) || fromCache.length === 0) return ['main'];
          return fromCache;
        };
    
        const loadSlotsForTemplate = async (templateKey) => {
          const normalizedTemplateKey = asString(templateKey);
          if (!normalizedTemplateKey) return ['main'];
          if (Array.isArray(slotsByTemplateKey.value[normalizedTemplateKey]) && slotsByTemplateKey.value[normalizedTemplateKey].length > 0) {
            return slotsByTemplateKey.value[normalizedTemplateKey];
          }
    
          const siteKey = asString(pageContext.value.site_key);
          const filter = {
            _and: [
              { template_key: { _eq: normalizedTemplateKey } },
              siteKey
                ? {
                    _or: [
                      { site_key: { _empty: true } },
                      { site_key: { _eq: siteKey } },
                    ],
                  }
                : { site_key: { _empty: true } },
            ],
          };
    
          const response = await apiRequest('GET', `/items/${layoutSlotsCollection.value}`, {
            fields: 'slot_key',
            limit: -1,
            sort: 'slot_key',
            filter: JSON.stringify(filter),
          });
    
          const values = uniqueNonEmpty(normalizeRows(response).map((row) => row?.slot_key));
          const resolvedValues = values.length > 0 ? values : ['main'];
          slotsByTemplateKey.value = {
            ...slotsByTemplateKey.value,
            [normalizedTemplateKey]: resolvedValues,
          };
          return resolvedValues;
        };
    
        const preloadSlotsForKnownTemplates = async () => {
          const candidates = uniqueNonEmpty([
            asString(pageContext.value.layout_template_key),
            ...blocks.value.map((row) => asString(row.template_group_key)).filter((value) => value && value !== 'page-root'),
          ]);
          const nextCache = {};
          slotsByTemplateKey.value = nextCache;
          for (const templateKey of candidates) {
            const values = await loadSlotsForTemplate(templateKey);
            nextCache[templateKey] = values;
          }
          slotsByTemplateKey.value = nextCache;
        };
    
        const loadBlocks = async () => {
          if (!pageId.value) {
            blocks.value = [];
            drafts.value = {};
            return;
          }
    
          const filter = { page_id: { _eq: pageId.value } };
          const response = await apiRequest('GET', `/items/${pageBlocksCollection.value}`, {
            fields: [
              'id',
              'collection',
              'item',
              'slot',
              'group_tag',
              'template_scope',
              'template_group_key',
              'tree_path',
              'tree_depth',
              'sort',
              'parent_block_id',
              'template_root_block_id',
              'template_nearest_block_id',
              'page_slug',
            ].join(','),
            limit: defaultLimit.value,
            sort: defaultSort.value.join(','),
            filter: JSON.stringify(filter),
          });
    
          blocks.value = normalizeRows(response).map(normalizeBlockRow);
          primeDrafts();
        };
    
        const refreshAll = async () => {
          loading.value = true;
          error.value = '';
          info.value = '';
