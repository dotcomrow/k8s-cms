            selectedDefinition?.default_props,
            selectedDefinition?.defaultProps,
            selectedDefinition?.defaults,
            selectedDefinition?.props_defaults,
            moduleSummary?.[defaultPropsField.value],
            moduleSummary?.default_props,
            moduleSummary?.defaultProps,
          );

          const normalizedName = pickFirstNonEmptyString(
            selectedSeed?.name,
            selectedDefinition?.display_name,
            selectedDefinition?.name,
            moduleSummary?.display_name,
            moduleSummary?.name,
            normalizedModuleKey,
          );

          const normalizedDescription = pickFirstNonEmptyString(
            selectedSeed?.description,
            selectedDefinition?.description,
            moduleSummary?.description,
            moduleSummary?.summary,
          );

          return {
            id: pickFirstNonEmptyString(selectedVersion?.module_version, moduleSummary?.module_key, `${normalizedModuleKey}:registry`),
            name: normalizedName,
            description: normalizedDescription,
            provider: normalizedProvider,
            [moduleKeyField.value]: normalizedModuleKey,
            [moduleProviderField.value]: normalizedProvider,
            site_key: pickFirstNonEmptyString(
              selectedSeed?.site_key,
              selectedDefinition?.site_key,
              moduleSummary?.site_key,
            ),
            status: 'published',
            [propsSchemaField.value]: normalizedSchema,
            [defaultPropsField.value]: normalizedDefaults,
            date_updated: pickFirstNonEmptyString(
              selectedVersion?.updated_at,
              selectedVersion?.published_at,
              moduleSummary?.updated_at,
            ),
            date_created: pickFirstNonEmptyString(
              selectedVersion?.created_at,
              selectedVersion?.published_at,
            ),
          };
        };

        const fetchModuleDefinitionFromRegistry = async (key, effectiveSiteKey) => {
          const detailPath = buildModuleRegistryDetailPath(key);
          const response = await externalApiGet(moduleRegistryUrl.value, detailPath, {}, {
            cacheKey: `module-detail:${moduleRegistryUrl.value}:${detailPath}:${resolveRegistryChannel()}`,
            cacheTtlMs: moduleRegistryCacheTtlMs.value,
          });

          const normalized = normalizeRegistryModuleDefinition(response, key);
          if (!normalized) return null;
          return selectPreferredModuleDefinition([normalized], effectiveSiteKey);
        };
    
        const countSchemaPropertyKeys = (schemaCandidate) => {
          const parsedSchema = normalizeObject(parseJsonLike(schemaCandidate, {}));
          const properties = normalizeObject(parsedSchema?.properties);
          return Object.keys(properties).length;
        };
    
        const toEpochMs = (value) => {
          const raw = asString(value);
          if (!raw) return 0;
          const parsed = Date.parse(raw);
          return Number.isFinite(parsed) ? parsed : 0;
        };
    
        const selectPreferredModuleDefinition = (rows, effectiveSiteKey) => {
          const targetSiteKey = asString(effectiveSiteKey);
          if (!Array.isArray(rows) || rows.length === 0) return null;
    
          const compareRows = (left, right) => {
            const leftSite = asString(left?.site_key);
            const rightSite = asString(right?.site_key);
    
            const leftScopeRank = targetSiteKey && leftSite === targetSiteKey ? 0 : leftSite ? 2 : 1;
            const rightScopeRank = targetSiteKey && rightSite === targetSiteKey ? 0 : rightSite ? 2 : 1;
            if (leftScopeRank !== rightScopeRank) return leftScopeRank - rightScopeRank;
    
            const leftSchemaRank = countSchemaPropertyKeys(left?.[propsSchemaField.value]) > 0 ? 0 : 1;
            const rightSchemaRank = countSchemaPropertyKeys(right?.[propsSchemaField.value]) > 0 ? 0 : 1;
            if (leftSchemaRank !== rightSchemaRank) return leftSchemaRank - rightSchemaRank;
    
            const leftUpdated = Math.max(toEpochMs(left?.date_updated), toEpochMs(left?.date_created));
            const rightUpdated = Math.max(toEpochMs(right?.date_updated), toEpochMs(right?.date_created));
            if (leftUpdated !== rightUpdated) return rightUpdated - leftUpdated;
    
            return asString(left?.id).localeCompare(asString(right?.id));
          };
    
          return [...rows].sort(compareRows)[0] || rows[0];
        };
    
        const fetchModuleDefinition = async () => {
          let key = moduleKey.value;
          if (!key) {
            await loadRecordFallbackValues();
            key = moduleKey.value;
          }
          if (!key) {
            moduleDefinition.value = null;
            loadError.value = 'Select a module before configuring props.';
            return;
          }
    
          let effectiveSiteKey = siteKey.value;
          if (!effectiveSiteKey) {
            const pageId = getPrimaryKeyFromLocation(pageCollection.value);
            if (pageId) {
              try {
                const pageResp = await apiGet(`/items/${pageCollection.value}/${encodeURIComponent(pageId)}`, {
                  fields: pageSiteField.value,
                });
                effectiveSiteKey = asString(pageResp?.data?.[pageSiteField.value]);
              } catch {
                // keep empty; we'll still resolve global module definitions.
              }
            }
          }
          if (!effectiveSiteKey) {
            effectiveSiteKey = asString(recordSiteKey.value);
          }
    
          let registryError = null;
          if (moduleRegistryEnabled.value && moduleRegistryUrl.value) {
            try {
              const registryDefinition = await fetchModuleDefinitionFromRegistry(key, effectiveSiteKey);
              if (registryDefinition) {
                moduleDefinition.value = registryDefinition;
                loadError.value = '';
                const resolvedModuleKey = asString(registryDefinition?.[moduleKeyField.value]) || key;
                if (pendingModuleSwitchKey.value && pendingModuleSwitchKey.value === resolvedModuleKey) {
                  pendingModuleDefaults.value = normalizeObject(parseJsonLike(registryDefinition?.[defaultPropsField.value], {}));
                  applyPendingDefaultsForModuleKey.value = resolvedModuleKey;
                  pendingModuleSwitchKey.value = '';
                }
                return;
              }
            } catch (error) {
              registryError = error;
            }
          }
    
          const filter = {
            _and: [
              { [moduleKeyField.value]: { _eq: key } },
              { status: { _eq: 'published' } },
              ...(effectiveModuleProviders.value.length === 1
                ? [{ provider: { _eq: effectiveModuleProviders.value[0] } }]
                : effectiveModuleProviders.value.length > 1
                  ? [{ provider: { _in: effectiveModuleProviders.value } }]
                  : []),
              buildScopedFilter(effectiveSiteKey),
            ],
          };
          const response = await apiGet(`/items/${modulesCollection.value}`, {
            fields: ['id', moduleKeyField.value, 'provider', 'name', 'description', 'site_key', propsSchemaField.value, defaultPropsField.value, 'date_created', 'date_updated'].join(','),
            limit: -1,
            sort: '-date_updated,-date_created,site_key,id',
            filter: JSON.stringify(filter),
          });

          let rows = normalizeRows(response);
          if (rows.length === 0 && effectiveModuleProviders.value.length > 0) {
            const providerAgnosticFilter = {
              _and: [
                { [moduleKeyField.value]: { _eq: key } },
                { status: { _eq: 'published' } },
                buildScopedFilter(effectiveSiteKey),
              ],
            };
            const providerAgnosticResponse = await apiGet(`/items/${modulesCollection.value}`, {
              fields: ['id', moduleKeyField.value, 'provider', 'name', 'description', 'site_key', propsSchemaField.value, defaultPropsField.value, 'date_created', 'date_updated'].join(','),
              limit: -1,
              sort: '-date_updated,-date_created,site_key,id',
              filter: JSON.stringify(providerAgnosticFilter),
            });
            rows = normalizeRows(providerAgnosticResponse);
          }
          if (rows.length === 0) {
            moduleDefinition.value = null;
            const fallbackMessage = effectiveModuleProviders.value.length > 0
              ? `No published module definition found for "${key}" with provider "${effectiveModuleProviders.value.join(',')}".`
              : `No published module definition found for "${key}".`;
            loadError.value = registryError
              ? `${fallbackMessage} Module registry lookup failed: ${registryError?.message || 'unknown error'}.`
              : fallbackMessage;
            return;
          }
    
          const preferred = selectPreferredModuleDefinition(rows, effectiveSiteKey);
          if (!preferred) {
            moduleDefinition.value = null;
            loadError.value = `No usable module definition found for "${key}".`;
            return;
          }
    
          moduleDefinition.value = preferred;
          loadError.value = '';
    
          const resolvedModuleKey = asString(preferred?.[moduleKeyField.value]) || key;
          if (pendingModuleSwitchKey.value && pendingModuleSwitchKey.value === resolvedModuleKey) {
            pendingModuleDefaults.value = normalizeObject(parseJsonLike(preferred?.[defaultPropsField.value], {}));
            applyPendingDefaultsForModuleKey.value = resolvedModuleKey;
            pendingModuleSwitchKey.value = '';
          }
        };

        const isMfeRemoteModuleDefinition = computed(() => {
          const activeModuleKey = toLower(moduleKey.value);
          const activeProvider = toLower(
            moduleDefinition.value?.provider
            ?? props.values?.[moduleProviderField.value]
            ?? recordModuleProvider.value
          );
          const activeComponentType = toLower(moduleDefinition.value?.component_type);
          return (
            activeModuleKey === 'mfe-generic-remote'
            || activeProvider === 'mfe'
            || activeComponentType === 'mfe.remote'
            || activeComponentType.startsWith('mfe.')
          );
        });

        const loadMfeRegistryModuleRows = async () => {
          if (!moduleRegistryHasUrl.value) {
            mfeRegistryModuleRows.value = [];
            mfeRegistryLoadError.value = 'Module registry URL is not configured for this interface context.';
            return;
          }

          try {
            const fetchRowsForChannel = async (channel) => {
              const response = await externalApiGet(moduleRegistryUrl.value, moduleRegistryPath.value, {
                channel,
                limit: moduleRegistryLimit.value,
              }, {
                cacheKey: `mfe-props-module-list:${moduleRegistryUrl.value}:${moduleRegistryPath.value}:${channel}:${moduleRegistryLimit.value}`,
                cacheTtlMs: moduleRegistryCacheTtlMs.value,
              });
              return normalizeRegistryRows(response)
                .map((row) => normalizeObject(parseJsonLike(row, {})))
                .filter((row) => {
                  const moduleKeyValue = asString(row?.module_key);
                  if (!moduleKeyValue) return false;
                  const provider = toLower(row?.provider);
                  const componentType = toLower(row?.component_type ?? row?.componentType);
                  const normalizedModuleKey = toLower(moduleKeyValue);
                  return (
                    componentType.startsWith('mfe.')
                    || provider === 'mfe'
                    || normalizedModuleKey.startsWith('mfe-')
                  );
                })
                .sort((left, right) => asString(left?.module_key).localeCompare(asString(right?.module_key)));
            };

            const activeChannel = resolveRegistryChannel();
            let rows = await fetchRowsForChannel(activeChannel);
            if (rows.length === 0 && activeChannel !== 'all') {
              rows = await fetchRowsForChannel('all');
            }
            mfeRegistryModuleRows.value = rows;
            mfeRegistryLoadError.value = '';
          } catch (error) {
            mfeRegistryModuleRows.value = [];
            mfeRegistryLoadError.value = error?.message || 'Unable to load module registry options.';
          }
        };

        const ensureMfeRegistryDetail = async (registryKeyValue) => {
          const normalizedKey = asString(registryKeyValue);
          if (!normalizedKey || !moduleRegistryHasUrl.value) return;
          if (mfeRegistryDetailByKey.value[normalizedKey]) return;
          const detailPath = buildModuleRegistryDetailPath(normalizedKey);
          const response = await externalApiGet(moduleRegistryUrl.value, detailPath, {}, {
            cacheKey: `mfe-props-module-detail:${moduleRegistryUrl.value}:${detailPath}:${resolveRegistryChannel()}`,
            cacheTtlMs: moduleRegistryCacheTtlMs.value,
          });
          mfeRegistryDetailByKey.value = {
            ...mfeRegistryDetailByKey.value,
            [normalizedKey]: normalizeObject(parseJsonLike(response, {})),
          };
        };
    
        watch(
          () => JSON.stringify({
            moduleKey: moduleKey.value,
            moduleProviderField: moduleProviderField.value,
            moduleProvider: asString(props.values?.[moduleProviderField.value] ?? recordModuleProvider.value),
            staticModuleProviders: staticModuleProviders.value.join(','),
            siteKey: siteKey.value,
            modulesCollection: modulesCollection.value,
            moduleKeyField: moduleKeyField.value,
            propsSchemaField: propsSchemaField.value,
            defaultPropsField: defaultPropsField.value,
            moduleRegistryEnabled: moduleRegistryEnabled.value,
            moduleRegistryUrl: moduleRegistryUrl.value,
            moduleRegistryPath: moduleRegistryPath.value,
            moduleRegistryChannel: resolveRegistryChannel(),
            moduleRegistryLimit: moduleRegistryLimit.value,
            collection: asString(props.collection),
            recordId: resolveRecordId(),
            blockCollection: asString(props.values?.collection),
            blockItem: parseId(props.values?.item),
          }),
          async () => {
            loading.value = true;
            try {
              await loadRecordFallbackValues();
              await fetchModuleDefinition();
            } catch (error) {
              moduleDefinition.value = null;
              loadError.value = error?.message || 'Failed to load module definition.';
            } finally {
              loading.value = false;
            }
          },
          { immediate: true }
        );
    
        const defaultProps = computed(() => normalizeObject(parseJsonLike(moduleDefinition.value?.[defaultPropsField.value], {})));
        const shouldUseMfeFallbackSchema = computed(() => {
          const activeModuleKey = toLower(
            moduleKey.value
            || props.values?.[moduleKeyField.value]
            || props.values?.module_key
          );
          const activeProvider = toLower(
            moduleDefinition.value?.provider
            ?? props.values?.[moduleProviderField.value]
            ?? props.values?.module_provider
            ?? recordModuleProvider.value
          );
          const activeComponentType = toLower(moduleDefinition.value?.component_type);
          return (
            activeModuleKey === 'mfe-generic-remote'
            || activeModuleKey.startsWith('mfe-')
            || activeProvider === 'mfe'
            || activeComponentType === 'mfe.remote'
            || activeComponentType.startsWith('mfe.')
          );
        });
        const resolvedSchema = computed(() => {
          const parsedSchema = normalizeObject(parseJsonLike(moduleDefinition.value?.[propsSchemaField.value], {}));
          const parsedProperties = normalizeObject(parsedSchema?.properties);
          if (Object.keys(parsedProperties).length > 0) {
            return parsedSchema;
          }
    
          const inferredProperties = {};
          for (const [key, rawValue] of Object.entries(defaultProps.value || {})) {
            const propKey = asString(key);
            if (!propKey) continue;
            let inferredType = 'string';
            if (Array.isArray(rawValue)) {
              inferredType = 'array';
            } else if (rawValue && typeof rawValue === 'object') {
              inferredType = 'object';
            } else if (typeof rawValue === 'boolean') {
              inferredType = 'boolean';
            } else if (typeof rawValue === 'number') {
              inferredType = Number.isInteger(rawValue) ? 'integer' : 'number';
            }
            inferredProperties[propKey] = {
              type: inferredType,
              title: propKey,
            };
          }

          const ensureMfeFallbackProperties = () => {
            inferredProperties.registryKey = inferredProperties.registryKey || { type: 'string', title: 'Registry Key' };
            inferredProperties.version = inferredProperties.version || { type: 'string', title: 'Version' };
            inferredProperties.manifestUrl = inferredProperties.manifestUrl || { type: 'string', title: 'Manifest URL' };
            inferredProperties.entryExport = inferredProperties.entryExport || { type: 'string', title: 'Entry Export' };
            inferredProperties.mountStrategy = inferredProperties.mountStrategy || {
              type: 'string',
              title: 'Mount Strategy',
              enum: ['module', 'iframe'],
            };
            inferredProperties.sandbox = inferredProperties.sandbox || { type: 'boolean', title: 'Sandbox' };
            inferredProperties.preload = inferredProperties.preload || { type: 'boolean', title: 'Preload' };
          };

          if (shouldUseMfeFallbackSchema.value) {
            const inferredKeys = Object.keys(inferredProperties).map((entry) => toLower(entry));
            const hasRegistryShape = inferredKeys.includes('registrykey') || inferredKeys.includes('registry_key');
            if (!hasRegistryShape) {
              ensureMfeFallbackProperties();
            }
          }
    
          if (Object.keys(inferredProperties).length === 0) {
            return parsedSchema;
          }

          const required = Array.isArray(parsedSchema?.required) ? parsedSchema.required.map((value) => asString(value)).filter(Boolean) : [];
          if (shouldUseMfeFallbackSchema.value && !required.includes('registryKey')) {
            required.push('registryKey');
          }

          return {
            ...parsedSchema,
            type: 'object',
            properties: inferredProperties,
            required,
          };
        });
        const schemaProperties = computed(() => normalizeObject(resolvedSchema.value?.properties));
        const hasMfeRegistrySchemaShape = computed(() => {
          const normalizedKeys = Object.keys(schemaProperties.value || {}).map((key) => toLower(key));
          return normalizedKeys.includes('registrykey') || normalizedKeys.includes('registry_key');
        });
        const getMfePropPriority = (fieldName) => {
          const token = normalizeFieldToken(fieldName);
          const rank = MFE_PROP_PRIORITY[token];
          return Number.isInteger(rank) ? rank : 1000;
        };
        const resolveFieldHelpText = (schemaValue, fieldPath, required = false) => {
          const schema = normalizeObject(schemaValue);
          const explicitHelp = pickFirstNonEmptyString(
            schema?.description,
            schema?.help,
            schema?.help_text,
            schema?.helpText,
            schema?.hint,
            schema?.x_help,
            schema?.xHelp,
            schema?.['x-help'],
            schema?.['x-ui-help'],
            schema?.['x_hint'],
            schema?.['x-directus-hint'],
          );
          if (explicitHelp) return explicitHelp;

          const normalizedPath = normalizeFieldToken(fieldPath);
          const pathHint = FIELD_HELP_FALLBACKS[normalizedPath];
          if (pathHint) return pathHint;

          const leafName = asString(fieldPath).split('.').pop();
          const leafHint = FIELD_HELP_FALLBACKS[normalizeFieldToken(leafName)];
          if (leafHint) return leafHint;

          return required ? 'Required.' : 'Optional.';
        };
        const isComplexPropertySchema = (schemaValue) => {
          const schema = normalizeObject(schemaValue);
          const type = asString(schema?.type).toLowerCase();
          if (type === 'array' || type === 'object') return true;
          if (Array.isArray(schema?.items)) return true;
          if (schema?.items && typeof schema.items === 'object') return true;
          if (schema?.properties && typeof schema.properties === 'object') return true;
          if (schema?.additionalProperties && typeof schema.additionalProperties === 'object') return true;
          return false;
        };
        const schemaRequiredSet = computed(() => {
          const required = Array.isArray(resolvedSchema.value?.required) ? resolvedSchema.value.required : [];
          return new Set(required.map((value) => asString(value)));
        });
        const effectiveShowJsonFallback = computed(() =>
          showJsonFallback.value && !isMfeRemoteModuleDefinition.value
        );
        const orderedSchemaPropertyEntries = computed(() => {
          const entries = Object.entries(schemaProperties.value || {});
          if (!isMfeRemoteModuleDefinition.value) return entries;
          return entries
            .map(([propKey, propSchema], index) => ({
              propKey,
              propSchema,
              index,
              priority: getMfePropPriority(propKey),
            }))
            .sort((left, right) => {
              if (left.priority !== right.priority) return left.priority - right.priority;
              return left.index - right.index;
            })
            .map(({ propKey, propSchema }) => [propKey, propSchema]);
        });
        const mergedProps = computed(() => ({ ...defaultProps.value, ...localProps.value }));
        const selectedMfeRegistryKey = computed(() =>
          pickFirstNonEmptyString(
            mergedProps.value?.registryKey,
            mergedProps.value?.registry_key,
          )
        );
        const selectedMfeRegistryVersion = computed(() =>
          pickFirstNonEmptyString(
            mergedProps.value?.version,
            mergedProps.value?.module_version,
            mergedProps.value?.moduleVersion,
          )
        );
        const selectedMfeRegistryDetail = computed(() =>
          normalizeObject(parseJsonLike(mfeRegistryDetailByKey.value?.[selectedMfeRegistryKey.value], {}))
        );
        const selectedMfeRegistryVersionRow = computed(() => {
          const versionRows = normalizeRegistryVersionRows(selectedMfeRegistryDetail.value);
          if (versionRows.length === 0) return {};
          const requestedVersion = asString(selectedMfeRegistryVersion.value);
          if (requestedVersion) {
            const exact = versionRows.find((row) => asString(row?.module_version) === requestedVersion);
            if (exact) return normalizeObject(parseJsonLike(exact, {}));
          }
          return normalizeObject(parseJsonLike(pickRegistryVersionRowForChannel(versionRows, resolveRegistryChannel()), {}));
        });
        const selectedMfeRegistrySpecSchema = computed(() => {
          const detail = normalizeObject(parseJsonLike(selectedMfeRegistryDetail.value, {}));
          const version = normalizeObject(parseJsonLike(selectedMfeRegistryVersionRow.value, {}));
          const versionSeed = normalizeObject(parseJsonLike(version?.seed ?? version?.seed_ref, {}));
          const versionDefinition = normalizeObject(parseJsonLike(version?.definition ?? version?.definition_ref, {}));
          const versionDefinitionIo = normalizeObject(parseJsonLike(versionDefinition?.io, {}));
          const detailSeed = normalizeObject(parseJsonLike(detail?.seed ?? detail?.seed_ref, {}));
          const detailDefinition = normalizeObject(parseJsonLike(detail?.definition ?? detail?.definition_ref, {}));
          const detailDefinitionIo = normalizeObject(parseJsonLike(detailDefinition?.io, {}));
          return pickFirstObject(
            version?.props_schema,
            version?.propsSchema,
            version?.schema,
            version?.config_schema,
            version?.configSchema,
            versionSeed?.props_schema,
            versionSeed?.propsSchema,
            versionSeed?.schema,
            versionDefinition?.props_schema,
            versionDefinition?.propsSchema,
            versionDefinition?.schema,
            versionDefinitionIo?.props_schema,
            versionDefinitionIo?.propsSchema,
            versionDefinitionIo?.schema,
            detailSeed?.props_schema,
            detailSeed?.propsSchema,
            detailSeed?.schema,
            detailDefinition?.props_schema,
            detailDefinition?.propsSchema,
            detailDefinition?.schema,
            detailDefinitionIo?.props_schema,
            detailDefinitionIo?.propsSchema,
            detailDefinitionIo?.schema,
          );
        });
        const selectedMfeRegistrySpecDefaults = computed(() => {
          const detail = normalizeObject(parseJsonLike(selectedMfeRegistryDetail.value, {}));
          const version = normalizeObject(parseJsonLike(selectedMfeRegistryVersionRow.value, {}));
          const versionSeed = normalizeObject(parseJsonLike(version?.seed ?? version?.seed_ref, {}));
          const versionDefinition = normalizeObject(parseJsonLike(version?.definition ?? version?.definition_ref, {}));
          const detailSeed = normalizeObject(parseJsonLike(detail?.seed ?? detail?.seed_ref, {}));
          const detailDefinition = normalizeObject(parseJsonLike(detail?.definition ?? detail?.definition_ref, {}));
          return pickFirstObject(
            version?.default_props,
            version?.defaultProps,
            version?.defaults,
            version?.props_defaults,
            versionSeed?.default_props,
            versionSeed?.defaultProps,
            versionSeed?.defaults,
            versionSeed?.props_defaults,
            versionDefinition?.default_props,
            versionDefinition?.defaultProps,
            versionDefinition?.defaults,
            versionDefinition?.props_defaults,
            detailSeed?.default_props,
            detailSeed?.defaultProps,
            detailSeed?.defaults,
            detailSeed?.props_defaults,
            detailDefinition?.default_props,
            detailDefinition?.defaultProps,
            detailDefinition?.defaults,
            detailDefinition?.props_defaults,
          );
        });
        const selectedMfeUiSchema = computed(() => {
          if (!isMfeRemoteModuleDefinition.value) return {};
          if (!selectedMfeRegistryKey.value) return {};
          const schema = normalizeObject(parseJsonLike(selectedMfeRegistrySpecSchema.value, {}));
          const allProperties = normalizeObject(schema?.properties);
          const properties = omitObjectKeysByFieldToken(allProperties, MFE_UI_SCHEMA_EXCLUDED_TOKENS);
          if (Object.keys(properties).length === 0) return {};
          const propertyTokens = new Set(Object.keys(properties).map((key) => normalizeFieldToken(key)));
          const required = Array.isArray(schema?.required)
            ? schema.required
              .map((entry) => asString(entry))
              .filter(Boolean)
              .filter((entry) => propertyTokens.has(normalizeFieldToken(entry)))
            : [];
          return {
            type: 'object',
            title: 'UI Configuration',
            description: resolveFieldHelpText(
              schema,
              'ui',
              required.length > 0
            ),
            additionalProperties: schema?.additionalProperties === true,
            properties,
            required,
          };
        });
        const mfeRegistryKeyOptions = computed(() =>
          mfeRegistryModuleRows.value.map((row) => {
            const moduleKeyValue = asString(row?.module_key);
            const latestVersion = asString(row?.latest_version_preview || row?.latest_version_prod);
            return {
              text: latestVersion ? `${moduleKeyValue} (${latestVersion})` : moduleKeyValue,
              value: moduleKeyValue,
            };
          })
        );
        const mfeRegistryVersionRows = computed(() => normalizeRegistryVersionRows(selectedMfeRegistryDetail.value));
        const mfeRegistryVersionOptions = computed(() => {
          const seen = new Set();
          return mfeRegistryVersionRows.value
            .map((row) => {
              const moduleVersion = asString(row?.module_version);
              if (!moduleVersion || seen.has(moduleVersion)) return null;
              seen.add(moduleVersion);
              const channelLabel = asString(row?.channel) || 'unknown';
              return {
                text: `${moduleVersion} (${channelLabel})`,
                value: moduleVersion,
              };
            })
            .filter(Boolean);
        });
        const mfeRegistryManifestOptions = computed(() => {
          const seen = new Set();
          return mfeRegistryVersionRows.value
            .map((row) => {
              const manifestUrl = asString(row?.manifest_url ?? row?.manifestUrl);
              if (!manifestUrl || seen.has(manifestUrl)) return null;
              seen.add(manifestUrl);
              const moduleVersion = asString(row?.module_version) || 'unknown';
              const channelLabel = asString(row?.channel) || 'unknown';
              return {
                text: `${moduleVersion} (${channelLabel})`,
                value: manifestUrl,
              };
            })
            .filter(Boolean);
        });

        const emitProps = (nextProps) => {
          const normalized = normalizeObject(nextProps);
          localProps.value = { ...normalized };
          jsonEditorValue.value = JSON.stringify(localProps.value, null, 2);
          emit('input', localProps.value);
        };
    
        const applyJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            emitProps({});
            return;
          }
          try {
            emitProps(normalizeObject(JSON.parse(jsonEditorValue.value)));
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };
    
        const formatJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            jsonEditorValue.value = '{}';
            emitProps({});
            schemaError.value = '';
            return;
          }
          try {
            const parsed = normalizeObject(JSON.parse(jsonEditorValue.value));
            jsonEditorValue.value = JSON.stringify(parsed, null, 2);
            emitProps(parsed);
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };

        watch(
          () => JSON.stringify({
            isMfeRemote: isMfeRemoteModuleDefinition.value,
            hasMfeRegistrySchemaShape: hasMfeRegistrySchemaShape.value,
            moduleRegistryEnabled: moduleRegistryEnabled.value,
            moduleRegistryUrl: moduleRegistryUrl.value,
            moduleRegistryPath: moduleRegistryPath.value,
            moduleRegistryChannel: resolveRegistryChannel(),
            moduleRegistryLimit: moduleRegistryLimit.value,
          }),
          async () => {
            if (!hasMfeRegistrySchemaShape.value) {
              mfeRegistryModuleRows.value = [];
              mfeRegistryLoadError.value = '';
              return;
            }
            await loadMfeRegistryModuleRows();
          },
          { immediate: true }
        );

        watch(
          () => JSON.stringify({
            isMfeRemote: isMfeRemoteModuleDefinition.value,
            hasMfeRegistrySchemaShape: hasMfeRegistrySchemaShape.value,
            moduleRegistryEnabled: moduleRegistryEnabled.value,
            moduleRegistryUrl: moduleRegistryUrl.value,
            moduleRegistryPath: moduleRegistryPath.value,
            moduleRegistryChannel: resolveRegistryChannel(),
            moduleRegistryKey: selectedMfeRegistryKey.value,
            moduleRegistryVersion: selectedMfeRegistryVersion.value,
            hasRegistryDetail: Boolean(mfeRegistryDetailByKey.value?.[selectedMfeRegistryKey.value]),
          }),
          async () => {
            if (!hasMfeRegistrySchemaShape.value || !moduleRegistryHasUrl.value) {
              return;
            }

            const registryKeyValue = selectedMfeRegistryKey.value;
            if (!registryKeyValue) return;

            try {
              await ensureMfeRegistryDetail(registryKeyValue);
            } catch (error) {
              mfeRegistryLoadError.value = error?.message || 'Unable to load module registry details.';
              return;
            }

            const versionRows = normalizeRegistryVersionRows(selectedMfeRegistryDetail.value);
            if (!Array.isArray(versionRows) || versionRows.length === 0) return;

            const channel = resolveRegistryChannel();
            const requestedVersion = selectedMfeRegistryVersion.value;
            const requestedRows = requestedVersion
              ? versionRows.filter((row) => asString(row?.module_version) === requestedVersion)
              : [];
            const selectedRow = pickRegistryVersionRowForChannel(
              requestedRows.length > 0 ? requestedRows : versionRows,
              channel,
            );
            const selectedVersion = asString(selectedRow?.module_version);
            const selectedManifestUrl = asString(selectedRow?.manifest_url ?? selectedRow?.manifestUrl);

            const nextProps = { ...mergedProps.value };
            let changed = false;

            if (selectedVersion && asString(nextProps?.version) !== selectedVersion) {
              nextProps.version = selectedVersion;
              changed = true;
            }
            if (selectedManifestUrl && asString(nextProps?.manifestUrl) !== selectedManifestUrl) {
              nextProps.manifestUrl = selectedManifestUrl;
              changed = true;
            }
            const selectedUiSchemaProperties = normalizeObject(selectedMfeUiSchema.value?.properties);
            const selectedSpecDefaults = normalizeObject(parseJsonLike(selectedMfeRegistrySpecDefaults.value, {}));
            const selectedUiDefaults = omitObjectKeysByFieldToken(
              selectedSpecDefaults,
              MFE_UI_SCHEMA_EXCLUDED_TOKENS,
            );
            const selectedAsyncDefaults = normalizeObject(parseJsonLike(selectedSpecDefaults?.async, {}));
            if (Object.keys(selectedAsyncDefaults).length > 0) {
              const currentAsyncValue = normalizeObject(parseJsonLike(nextProps?.async, {}));
              if (isShellAsyncPlaceholder(currentAsyncValue)) {
                nextProps.async = { ...selectedAsyncDefaults };
                changed = true;
              }
            }
            if (
              Object.keys(selectedUiSchemaProperties).length > 0
              && Object.keys(selectedUiDefaults).length > 0
            ) {
              const currentUiValue = normalizeObject(parseJsonLike(nextProps?.ui, {}));
              if (Object.keys(currentUiValue).length === 0) {
                nextProps.ui = { ...selectedUiDefaults };
                changed = true;
              }
            }

            if (changed) {
              emitProps(nextProps);
              schemaError.value = '';
            }
          },
          { immediate: true }
        );

        watch(
          () => applyPendingDefaultsForModuleKey.value,
          (nextModuleKey) => {
            if (!nextModuleKey) return;
            emitProps(pendingModuleDefaults.value);
            propertyDraftValues.value = {};
            pendingModuleDefaults.value = {};
            applyPendingDefaultsForModuleKey.value = '';
            schemaError.value = '';
          }
        );
    
        const onModuleSelectorEvent = (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          const eventMode = asString(detail.mode).toLowerCase();
          const eventField = asString(detail.field).toLowerCase();
          if (eventMode !== 'module') return;
          const normalizedModuleKeyField = moduleKeyField.value.toLowerCase();
          const isModuleFieldEvent = (
            !eventField
            || eventField === normalizedModuleKeyField
            || eventField === 'module_key'
            || eventField.endsWith(`.${normalizedModuleKeyField}`)
            || eventField.endsWith('.module_key')
            || eventField.includes(':module_key')
          );
          if (!isModuleFieldEvent) return;
    
          const eventCollection = asString(detail.collection).toLowerCase();
          const { recordCollection, recordId } = resolveRecordContext();
          const currentCollection = asString(recordCollection).toLowerCase();
          if (eventCollection && currentCollection && eventCollection !== currentCollection) return;
    
          const eventRecordId = asString(detail.recordId);
          const currentRecordId = asString(recordId || resolveRecordId());
          if (eventRecordId && currentRecordId && eventRecordId !== currentRecordId) return;
    
          const nextKey = asString(detail.value);
          if (!nextKey) return;
          if (nextKey !== moduleKey.value) {
            pendingModuleSwitchKey.value = nextKey;
            moduleKeyOverride.value = nextKey;
          }
        };
    
        onMounted(() => {
          if (typeof window === 'undefined') return;
          window.addEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });
    
        onBeforeUnmount(() => {
          if (typeof window === 'undefined') return;
          window.removeEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });
    
        const setPropertyValue = (key, value, options = {}) => {
          const next = { ...mergedProps.value };
          if (value === undefined || value === null || value === '') {
            delete next[key];
          } else {
            next[key] = value;
          }
          maybeApplyAutoMediaType(next, key, value, options);
          if (Object.prototype.hasOwnProperty.call(propertyDraftValues.value, key)) {
            const nextDrafts = { ...propertyDraftValues.value };
            delete nextDrafts[key];
            propertyDraftValues.value = nextDrafts;
          }
          emitProps(next);
        };
    
        const renderPropertyEditor = (propKey, propSchema) => {
          const normalizedPropKey = toLower(propKey);
          const normalizedPropToken = normalizeFieldToken(propKey);
          const hasSelectedMfeUiSchema = Object.keys(normalizeObject(selectedMfeUiSchema.value?.properties)).length > 0;
          const schema = normalizeObject(
            isMfeRemoteModuleDefinition.value
            && normalizedPropToken === 'ui'
            && hasSelectedMfeUiSchema
              ? selectedMfeUiSchema.value
              : propSchema
          );
          const isRequired = schemaRequiredSet.value.has(propKey);
          const title = asString(schema.title) || propKey;
          const description = resolveFieldHelpText(schema, propKey, isRequired);
          const value = mergedProps.value[propKey];
          const type = asString(schema.type).toLowerCase();
          const enumValues = Array.isArray(schema.enum) ? schema.enum.map((entry) => asString(entry)).filter(Boolean) : [];
          const inputId = `cms-module-prop-${propKey}`;
          const disabled = props.disabled || loading.value;
          const isRegistryKeyProp = normalizedPropKey === 'registrykey' || normalizedPropKey === 'registry_key';
          const isVersionProp = normalizedPropKey === 'version' || normalizedPropKey === 'module_version' || normalizedPropKey === 'moduleversion';
          const isManifestUrlProp = normalizedPropKey === 'manifesturl' || normalizedPropKey === 'manifest_url';
          const isRegistryBackedMfeProp = isRegistryKeyProp || isVersionProp || isManifestUrlProp;
          const canUseRegistryBackedMfeSelect =
            hasMfeRegistrySchemaShape.value
            && isRegistryBackedMfeProp;
    
          const resolvedInput = resolveComponent('v-input');
          const resolvedSelect = resolveComponent('v-select');
          const resolvedTextarea = resolveComponent('v-textarea');
          const resolvedCheckbox = resolveComponent('v-checkbox');
          const resolvedButton = resolveComponent('v-button');
          const resolvedNotice = resolveComponent('v-notice');
    
          const hasInput = typeof resolvedInput !== 'string';
          const hasSelect = typeof resolvedSelect !== 'string';
          const hasTextarea = typeof resolvedTextarea !== 'string';
          const hasCheckbox = typeof resolvedCheckbox !== 'string';
          const hasButton = typeof resolvedButton !== 'string';
          const hasNotice = typeof resolvedNotice !== 'string';
    
          const renderInputControl = ({ id, modelValue, onUpdate, type: inputType = 'text', placeholder = '', onBlur = null, onKeydown = null, style = {} }) => {
            if (hasInput) {
              return h(resolvedInput, {
                id,
                modelValue: modelValue ?? '',
                type: inputType,
                placeholder,
                disabled,
                style,
                'onUpdate:modelValue': (next) => onUpdate(asInputString(next)),
                onBlur,
                onKeydown,
              });
            }
            return h('input', {
              id,
              type: inputType,
              value: modelValue ?? '',
              placeholder,
              disabled,
              style,
              onInput: (event) => onUpdate(asInputString(event?.target?.value)),
              onBlur,
              onKeydown,
            });
          };
    
          const renderTextareaControl = ({ id, modelValue, rows = 4, placeholder = '', onUpdate = null, onBlur = null, style = {} }) => {
            if (hasTextarea) {
              return h(resolvedTextarea, {
                id,
                modelValue: modelValue ?? '',
                rows,
                placeholder,
                disabled,
                monospace: true,
                style,
                'onUpdate:modelValue': onUpdate ? (next) => onUpdate(asInputString(next)) : undefined,
                onBlur,
              });
            }
            return h('textarea', {
              id,
              rows,
              value: modelValue ?? '',
              placeholder,
              disabled,
              style,
              onInput: onUpdate ? (event) => onUpdate(asInputString(event?.target?.value)) : undefined,
              onBlur,
            });
          };
    
          const renderSelectControl = ({ id, modelValue, items, placeholder = '' }) => {
            if (hasSelect) {
              return h(resolvedSelect, {
                id,
                modelValue: modelValue || null,
                items,
                placeholder,
                disabled,
                showDeselect: true,
                'onUpdate:modelValue': (next) => setPropertyValue(propKey, asInputString(next)),
              });
            }
            return h(
              'select',
              {
                id,
                disabled,
                value: modelValue,
                onChange: (event) => setPropertyValue(propKey, asInputString(event?.target?.value)),
              },
              [
                h('option', { value: '' }, placeholder || `Select ${title}`),
                ...items.map((entry) => h('option', { value: entry.value }, entry.text)),
              ],
            );
          };
    
          const renderCheckboxControl = ({ id, modelValue }) => {
            if (hasCheckbox) {
              return h(resolvedCheckbox, {
                id,
                modelValue: Boolean(modelValue),
                disabled,
                'onUpdate:modelValue': (next) => setPropertyValue(propKey, Boolean(next)),
              });
            }
            return h('input', {
              id,
              type: 'checkbox',
              disabled,
              checked: Boolean(modelValue),
              onChange: (event) => setPropertyValue(propKey, Boolean(event?.target?.checked)),
            });
          };
    
          const renderButtonControl = ({ label, onClick, disabled: buttonDisabled = false, primary = false, style = {}, children = null }) => {
            if (hasButton) {
              return h(
                resolvedButton,
                {
                  disabled: buttonDisabled,
                  secondary: !primary,
                  small: true,
                  onClick,
                  style,
                },
                children ? { default: () => children } : () => label,
              );
            }
            return h('button', { type: 'button', disabled: buttonDisabled, onClick, style }, children || label);
          };
    
          const renderErrorNotice = (message) => {
            if (!message) return null;
            if (hasNotice) {
              return h(resolvedNotice, { type: 'danger', icon: 'warning' }, { default: () => message });
            }
            return h('p', { style: { margin: 0, color: 'var(--theme--danger)' } }, message);
          };
    
          let control = null;
          const dynamicRegistryHint = (
            hasMfeRegistrySchemaShape.value
            && isRegistryBackedMfeProp
            && !canUseRegistryBackedMfeSelect
            && !moduleRegistryHasUrl.value
          )
            ? 'Module registry selections are unavailable in this field context. Ensure cms_block_module.props_json interface options include module_registry_url.'
            : '';

          if (canUseRegistryBackedMfeSelect && isRegistryKeyProp) {
            control = renderSelectControl({
              id: inputId,
              modelValue: asInputString(value),
              items: mfeRegistryKeyOptions.value,
              placeholder: mfeRegistryKeyOptions.value.length > 0 ? `Select ${title}` : 'No published MFE modules available',
            });
          } else if (canUseRegistryBackedMfeSelect && isVersionProp) {
            control = renderSelectControl({
              id: inputId,
              modelValue: asInputString(value),
              items: mfeRegistryVersionOptions.value,
              placeholder: mfeRegistryVersionOptions.value.length > 0 ? `Select ${title}` : 'No versions available for selected module',
            });
          } else if (canUseRegistryBackedMfeSelect && isManifestUrlProp) {
            control = renderSelectControl({
              id: inputId,
              modelValue: asInputString(value),
              items: mfeRegistryManifestOptions.value,
              placeholder: mfeRegistryManifestOptions.value.length > 0 ? `Select ${title}` : 'No manifest URL available for selected module',
            });
          } else if (enumValues.length > 0) {
            const items = enumValues.map((entry) => ({ text: entry, value: entry }));
            control = renderSelectControl({
              id: inputId,
              modelValue: asInputString(value),
              items,
              placeholder: `Select ${title}`,
            });
          } else if (type === 'boolean') {
            control = renderCheckboxControl({
              id: inputId,
              modelValue: value,
            });
          } else if (type === 'number' || type === 'integer') {
            control = renderInputControl({
              id: inputId,
              type: 'number',
              modelValue: asInputString(value),
              onUpdate: (rawValue) => {
                const raw = asString(rawValue);
                if (!raw) {
                  setPropertyValue(propKey, undefined);
                  return;
                }
                const parsed = type === 'integer' ? Number.parseInt(raw, 10) : Number.parseFloat(raw);
                setPropertyValue(propKey, Number.isFinite(parsed) ? parsed : undefined);
              },
            });
          } else if (type === 'object' && Object.keys(normalizeObject(schema?.properties)).length > 0) {
            const getNestedValue = (source, pathSegments) => {
              let cursor = source;
              for (const segment of pathSegments) {
                if (!cursor || typeof cursor !== 'object' || Array.isArray(cursor)) return undefined;
                cursor = cursor[segment];
              }
              return cursor;
            };

            const setNestedValue = (source, pathSegments, nextValue) => {
              if (!Array.isArray(pathSegments) || pathSegments.length === 0) return source;
              const output = cloneJsonValue(source);
              let cursor = output;
              for (let index = 0; index < pathSegments.length - 1; index += 1) {
                const segment = pathSegments[index];
                const existing = cursor?.[segment];
                if (!existing || typeof existing !== 'object' || Array.isArray(existing)) {
                  cursor[segment] = {};
                }
                cursor = cursor[segment];
              }
              const leafKey = pathSegments[pathSegments.length - 1];
              if (nextValue === undefined || nextValue === null || nextValue === '') {
                delete cursor[leafKey];
              } else {
                cursor[leafKey] = nextValue;
              }
              return output;
            };

            const pruneEmptyObjects = (valueToPrune) => {
              if (Array.isArray(valueToPrune)) {
                return valueToPrune.map((entry) => pruneEmptyObjects(entry));
              }
              if (!valueToPrune || typeof valueToPrune !== 'object') return valueToPrune;
              const output = {};
              for (const [entryKey, entryValue] of Object.entries(valueToPrune)) {
                const nextValue = pruneEmptyObjects(entryValue);
                if (
                  nextValue === undefined
                  || nextValue === null
                  || nextValue === ''
                  || (typeof nextValue === 'object' && !Array.isArray(nextValue) && Object.keys(nextValue).length === 0)
                ) {
                  continue;
                }
                output[entryKey] = nextValue;
              }
              return output;
            };

            const clearDraftValue = (draftKey) => {
              if (!Object.prototype.hasOwnProperty.call(propertyDraftValues.value, draftKey)) return;
              const nextDrafts = { ...propertyDraftValues.value };
              delete nextDrafts[draftKey];
              propertyDraftValues.value = nextDrafts;
            };

            const applyNestedValue = (pathSegments, nextValue) => {
              const currentRoot = normalizeObject(mergedProps.value?.[propKey]);
              const withUpdate = setNestedValue(currentRoot, pathSegments, nextValue);
              const pruned = pruneEmptyObjects(withUpdate);
              const draftKey = `${propKey}.${pathSegments.join('.')}`;
              clearDraftValue(draftKey);
              if (Object.keys(pruned).length === 0) {
                setPropertyValue(propKey, undefined);
              } else {
                setPropertyValue(propKey, pruned);
              }
            };

            const renderNestedField = (pathSegments, fieldSchema, requiredSet, depth = 0) => {
              const nestedSchema = normalizeObject(fieldSchema);
              const nestedType = asString(nestedSchema?.type).toLowerCase();
              const enumItems = Array.isArray(nestedSchema?.enum)
                ? nestedSchema.enum.map((entry) => asString(entry)).filter(Boolean)
                : [];
              const fieldKey = asString(pathSegments[pathSegments.length - 1]);
              const fieldValue = getNestedValue(normalizeObject(mergedProps.value?.[propKey]), pathSegments);
              const fieldId = `${inputId}-${pathSegments.join('-')}`;
              const fieldTitle = asString(nestedSchema?.title) || fieldKey;
              const isFieldRequired = requiredSet.has(fieldKey);
              const fieldDescription = resolveFieldHelpText(
                nestedSchema,
                `${propKey}.${pathSegments.join('.')}`,
                isFieldRequired
              );
              const nestedProperties = normalizeObject(nestedSchema?.properties);

              let nestedControl = null;
              if (enumItems.length > 0) {
                const selectChoices = enumItems.map((entry) => ({ text: entry, value: entry }));
                if (hasSelect) {
                  nestedControl = h(resolvedSelect, {
                    id: fieldId,
                    modelValue: asInputString(fieldValue) || null,
                    items: selectChoices,
                    placeholder: `Select ${fieldTitle}`,
                    disabled,
                    showDeselect: true,
                    'onUpdate:modelValue': (nextValue) => applyNestedValue(pathSegments, asInputString(nextValue)),
                  });
                } else {
                  nestedControl = h(
                    'select',
                    {
                      id: fieldId,
                      disabled,
                      value: asInputString(fieldValue),
                      onChange: (event) => applyNestedValue(pathSegments, asInputString(event?.target?.value)),
                    },
                    [
                      h('option', { value: '' }, `Select ${fieldTitle}`),
                      ...selectChoices.map((entry) => h('option', { value: entry.value }, entry.text)),
                    ],
                  );
                }
              } else if (nestedType === 'boolean') {
                if (hasCheckbox) {
                  nestedControl = h(resolvedCheckbox, {
                    id: fieldId,
                    modelValue: Boolean(fieldValue),
                    disabled,
                    'onUpdate:modelValue': (nextValue) => applyNestedValue(pathSegments, Boolean(nextValue)),
                  });
                } else {
                  nestedControl = h('input', {
                    id: fieldId,
                    type: 'checkbox',
                    disabled,
                    checked: Boolean(fieldValue),
                    onChange: (event) => applyNestedValue(pathSegments, Boolean(event?.target?.checked)),
                  });
                }
              } else if (nestedType === 'number' || nestedType === 'integer') {
                nestedControl = renderInputControl({
                  id: fieldId,
                  type: 'number',
                  modelValue: asInputString(fieldValue),
                  onUpdate: (rawValue) => {
                    const raw = asString(rawValue);
                    if (!raw) {
                      applyNestedValue(pathSegments, undefined);
                      return;
                    }
                    const parsed = nestedType === 'integer' ? Number.parseInt(raw, 10) : Number.parseFloat(raw);
                    applyNestedValue(pathSegments, Number.isFinite(parsed) ? parsed : undefined);
                  },
                });
              } else if (nestedType === 'object' && Object.keys(nestedProperties).length > 0) {
                const nestedRequired = new Set(
                  (Array.isArray(nestedSchema?.required) ? nestedSchema.required : []).map((entry) => asString(entry))
                );
                const nestedFields = Object.entries(nestedProperties).map(([childKey, childSchema]) =>
                  renderNestedField([...pathSegments, childKey], childSchema, nestedRequired, depth + 1)
                );
                nestedControl = h('section', {
                  style: {
                    border: '1px solid var(--theme--border-subdued)',
                    borderRadius: '8px',
                    padding: '10px',
                    background: 'var(--theme--background-subdued)',
                    display: 'grid',
                    gap: '10px',
                  },
                }, nestedFields);
              } else if (nestedType === 'array' || nestedType === 'object') {
                const draftKey = `${propKey}.${pathSegments.join('.')}`;
                const existingDraft = Object.prototype.hasOwnProperty.call(propertyDraftValues.value, draftKey)
                  ? propertyDraftValues.value[draftKey]
                  : null;
                const draftValue = existingDraft === null
                  ? (fieldValue === undefined ? '' : JSON.stringify(fieldValue, null, 2))
                  : asInputString(existingDraft);
                nestedControl = renderTextareaControl({
                  id: fieldId,
                  rows: 4,
                  modelValue: draftValue,
                  onUpdate: (nextValue) => {
                    propertyDraftValues.value = {
                      ...propertyDraftValues.value,
                      [draftKey]: asInputString(nextValue),
                    };
                  },
                  onBlur: (event) => {
                    const raw = asString(event?.target?.value ?? propertyDraftValues.value[draftKey]);
                    if (!raw) {
                      applyNestedValue(pathSegments, undefined);
                      schemaError.value = '';
                      return;
                    }
                    try {
                      const parsed = JSON.parse(raw);
                      applyNestedValue(pathSegments, parsed);
                      schemaError.value = '';
                    } catch {
                      schemaError.value = `Invalid JSON for ${fieldTitle}.`;
                    }
                  },
                });
              } else {
                nestedControl = renderInputControl({
                  id: fieldId,
                  type: 'text',
                  modelValue: asInputString(fieldValue),
                  onUpdate: (nextValue) => applyNestedValue(pathSegments, asInputString(nextValue)),
                });
              }

              return h('div', {
                class: 'cms-module-props-editor__field',
                key: `${propKey}.${pathSegments.join('.')}`,
                style: depth > 0 ? { paddingLeft: '4px' } : {},
              }, [
                h('label', { for: fieldId, class: 'cms-module-props-editor__label' }, [
                  fieldTitle,
                  isFieldRequired ? h('span', { class: 'cms-module-props-editor__required' }, ' *') : null,
                ]),
                fieldDescription ? h('p', { class: 'cms-module-props-editor__hint' }, fieldDescription) : null,
                nestedControl,
              ]);
            };

            const requiredKeys = new Set(
              (Array.isArray(schema?.required) ? schema.required : []).map((entry) => asString(entry))
            );
            const nestedFields = Object.entries(normalizeObject(schema?.properties)).map(([childKey, childSchema]) =>
              renderNestedField([childKey], childSchema, requiredKeys)
            );

            control = h('section', {
              style: {
                border: '1px solid var(--theme--border-subdued)',
                borderRadius: '8px',
                padding: '10px',
                background: 'var(--theme--background-subdued)',
                display: 'grid',
                gap: '10px',
              },
            }, nestedFields);
          } else if (type === 'array' || type === 'object') {
            const existingDraft = Object.prototype.hasOwnProperty.call(propertyDraftValues.value, propKey)
              ? propertyDraftValues.value[propKey]
              : null;
            const draftValue = existingDraft === null
              ? (value === undefined ? '' : JSON.stringify(value, null, 2))
              : asInputString(existingDraft);
    
            control = renderTextareaControl({
              id: inputId,
              rows: 4,
              modelValue: draftValue,
              onUpdate: (nextValue) => {
                propertyDraftValues.value = {
                  ...propertyDraftValues.value,
                  [propKey]: asInputString(nextValue),
                };
              },
              onBlur: (event) => {
                const raw = asString(event?.target?.value ?? propertyDraftValues.value[propKey]);
                if (!raw) {
                  setPropertyValue(propKey, undefined);
                  schemaError.value = '';
                  return;
                }
                try {
                  const parsed = JSON.parse(raw);
                  setPropertyValue(propKey, parsed);
                  schemaError.value = '';
                } catch {
                  schemaError.value = `Invalid JSON for ${title}.`;
                }
              },
            });
          } else {
            const supportsAssetPicker = isAssetLikeProperty(propKey, schema);
            const currentValue = asInputString(value);
