            'GET',
            `/items/${pagesCollection.value}/${encodeURIComponent(normalizedPageId)}`,
            { fields },
          );
          return response?.data || null;
        };
    
        const findPageByScope = async ({ slug, siteKey, releaseChannel }) => {
          const normalizedSlug = asString(slug);
          const normalizedRelease = toLower(releaseChannel);
