# Service Account for Directus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus
  namespace: directus
---
# ConfigMap for Directus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-config
  namespace: directus
data:
  DB_CLIENT: "pg"
  DB_HOST: "yb-tserver-service.yugabyte.svc.cluster.local"
  DB_PORT: "5433"
  DB_DATABASE: "directus"
  DB_SCHEMA: "directus"
  DB_POOL__MIN: "0"
  DB_POOL__MAX: "20"

  CACHE_ENABLED: "true"
  CACHE_STORE: "redis"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis-0.redis-headless.redis.svc.cluster.local"
  REDIS_PORT: "6379"

  RATE_LIMITER_ENABLED: "true"
  RATE_LIMITER_STORE: "redis"

  STORAGE_LOCATIONS: "local"
  STORAGE_LOCAL_DRIVER: "local"
  STORAGE_LOCAL_ROOT: "./uploads"

  LOG_LEVEL: "info"
  LOG_STYLE: "pretty"
  PUBLIC_URL: "https://cms.teleport.app.suncoast.systems/"

  CORS_ENABLED: "true"
  CORS_ORIGIN: "true"
  ASSETS_CACHE_TTL: "30d"

  # --- GitHub OAuth (Directus reads these envs) ---
  AUTH_GITHUB_DRIVER: "oauth2"
  AUTH_GITHUB_AUTHORIZE_URL: "https://github.com/login/oauth/authorize"
  AUTH_GITHUB_ACCESS_URL: "https://github.com/login/oauth/access_token"
  # Provide the FULL profile proxy URL (including ?key=...) via Vault/AVP:
  AUTH_GITHUB_PROFILE_URL: "<path:secret/data/directus-github-profile-api-url#value><path:secret/data/directus-github-profile-api-key#value>"

  # Keep CLIENT_ID/SECRET here only if AVP resolves them; otherwise they are injected by Vault Agent below.
  AUTH_GITHUB_CLIENT_ID: "<path:secret/data/directus-oauth-client-id#value>"
  AUTH_GITHUB_CLIENT_SECRET: "<path:secret/data/directus-oauth-client-secret#value>"
  # Increase OAuth2 userinfo timeout for cold-starting profile proxy
  AUTH_GITHUB_CLIENT_HTTP__TIMEOUT: "15000"

  AUTH_GITHUB_IDENTIFIER_KEY: "id"
  AUTH_GITHUB_EMAIL_KEY: "email"
  AUTH_GITHUB_SCOPE: "read:user user:email read:org"
  AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION: "true"
  AUTH_GITHUB_GROUP_CLAIM_NAME: "groups"
  AUTH_GITHUB_SYNC_USER_INFO: "true"
  AUTH_GITHUB_FIRST_NAME_KEY: "name"
  # Directus 11 no longer supports PROFILE_TRANSFORM; handled via hook extension.

  WEBSOCKETS_ENABLED: "true"
  # Yugabyte can throw transient catalog snapshot errors during collab init; disable collab handler by default.
  WEBSOCKETS_COLLAB_ENABLED: "false"
---
# Optional Directus settings patch.
# Add fields to settings.yaml to apply them via DB on startup.
# Note: If you add secrets here (e.g. OpenAI key), AVP will render them into a ConfigMap.
# Consider whether a Secret is more appropriate for your threat model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-settings
  namespace: directus
data:
  settings.yaml: |
    id: 1 # Singleton settings row id (always 1).
    project_name: "Suncoast Systems CMS" # Project name shown in Data Studio, login, and public pages.
    project_descriptor: "Content Management System for Suncoast Systems" # Short descriptor shown beneath the project name in Data Studio.
    project_url: null # URL opened when clicking the top-left logo in the module bar.
    project_color: "#6644FF" # Brand color (hex) for logo, login, and public pages.
    project_logo: null # File id for 40x40 logo (directus_files).
    public_foreground: null # File id for public page foreground image (directus_files).
    public_background: null # File id for public page background image/video (directus_files).
    public_favicon: null # File id for Data Studio favicon (directus_files).
    public_note: null # Markdown note shown on the public/login page.
    default_appearance: auto # Theme mode: auto | light | dark.
    default_theme_light: null # Theme name/id for light mode (from themes list).
    default_theme_dark: null # Theme name/id for dark mode (from themes list).
    theme_light_overrides: null # JSON of theme token overrides for light mode.
    theme_dark_overrides: null # JSON of theme token overrides for dark mode.
    default_language: en-US # Default language locale for the app (e.g. en-US).
    auth_login_attempts: 25 # Failed login attempts before account is locked/suspended.
    auth_password_policy: null # Password policy regex or preset (none/weak/strong/custom); null disables.
    storage_asset_transform: all # Asset transforms: all | none | presets.
    storage_asset_presets: null # Array of preset objects (key, fit, width, height, quality, withoutEnlargement, format, etc).
    # example:
    # - key: small
    #   fit: cover
    #   width: 200
    #   height: 161
    #   quality: 80
    #   withoutEnlargement: false
    custom_css: null # Custom CSS injected into the Data Studio.
    storage_default_folder: null # Default upload folder id (directus_folders).
    basemaps: null # Array of custom basemap tile configs; overrides Mapbox defaults.
    # example (UI fields: name, type, tileSize, url, attribution):
    # - name: OpenStreetMap
    #   type: raster
    #   tileSize: 256
    #   url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    #   attribution: "(c) OpenStreetMap contributors"
    #   # type values map to UI choices: Raster | Raster TileJSON | Mapbox Style
    mapbox_key: null # Mapbox access token for map features.
    module_bar: null # Module bar config array (visibility, order, custom links with name/icon/url).
    # example (core modules, order matters):
    # - content
    # - files
    # - insights
    # - settings
    # # Use the UI then read /settings to capture the exact structure for your version.
    custom_aspect_ratios: null # Array of { text, value } for image editor aspect ratios.
    # example:
    # - text: "16:10"
    #   value: 1.6
    report_error_url: null # Error report URL template with error/route/user context variables.
    report_bug_url: null # Bug report URL.
    report_feature_url: null # Feature request URL.
    public_registration: false # Enable user self-registration.
    public_registration_verify_email: true # Require email verification for new registrations.
    public_registration_role: null # Role id assigned to new registrations (non-admin).
    public_registration_email_filter: null # Email filter rule(s) using Directus string filters.
    visual_editor_urls: null # List of allowed website URLs for Visual Editor module.
    # example:
    # - https://www.example.com
    # - https://admin.example.com
    mcp_enabled: true # Enable MCP server in Settings > AI > Model Context Protocol.
    mcp_allow_deletes: false # Allow destructive MCP tools (delete items/files/fields/etc).
    mcp_prompts_collection: null # Collection for MCP stored prompts.
    mcp_system_prompt_enabled: true # Use default MCP system prompt.
    mcp_system_prompt: null # Custom MCP system prompt (overrides default).
    ai_openai_api_key: "<path:secret/data/open_ai_key#value>" # OpenAI API key for AI Chat (encrypted at rest; AVP renders).
    # Directus AI providers are enabled when their API key (and for openai-compatible: base URL) is configured.
    # Standard providers (openai/anthropic/google) also require a non-empty allowed-models list.
    ai_anthropic_api_key: null # Anthropic API key for AI Chat.
    ai_google_api_key: null # Google (Gemini) API key for AI Chat.
    # OpenAI-compatible provider (useful for proxies / gateways / self-hosted OpenAI-compatible endpoints).
    # Note: api keys are encrypted at rest; the manifest startup script stores the key in encrypted form.
    ai_openai_compatible_api_key: "<path:secret/data/open_ai_key#value>" # OpenAI-compatible API key (encrypted at rest).
    # Internal OpenAI-compatible provider.
    # Ollama exposes an OpenAI-compatible API at /v1 (models: GET /v1/models, chat: POST /v1/chat/completions).
    # Alternative: Open WebUI also exposes an OpenAI-like API under /api/v1, but typically requires auth.
    # Route internal AI traffic through Gravitee (via directus-ai-proxy which mints a Keycloak JWT).
    ai_openai_compatible_base_url: "http://directus-ai-proxy.directus.svc.cluster.local:8080/v1" # OpenAI-compatible base URL.
    ai_openai_compatible_name: "ollama" # Provider name (UI label / providerOptions key).
    ai_openai_compatible_models:
      - id: "llama3.1:8b"
        name: "Llama 3.1 8B (Ollama)"
        context: 8192
        output: 4096
        attachment: false
        reasoning: false
      - id: "deepseek-r1:14b"
        name: "DeepSeek R1 14B (Ollama)"
        context: 8192
        output: 4096
        attachment: false
        reasoning: true
    ai_openai_compatible_headers: null # Optional: [{ header, value }, ...]
    # Allowed models (empty/null disables the provider in /ai/chat).
    ai_openai_allowed_models: ["gpt-4o-mini","gpt-5-nano","gpt-5-mini","gpt-5"]
    ai_anthropic_allowed_models: ["claude-haiku-4-5","claude-sonnet-4-5"]
    ai_google_allowed_models: ["gemini-3-pro-preview","gemini-3-flash-preview","gemini-2.5-pro","gemini-2.5-flash"]
    ai_system_prompt: null # Custom AI Chat system prompt.
    collaborative_editing_enabled: false # Disable collaborative editing (collab websockets) by default.
    project_id: null # Undocumented; likely Directus Cloud metadata (leave null for self-hosted).
    project_owner: null # Undocumented; likely project owner user id (Cloud).
    project_usage: null # Undocumented; likely usage telemetry/metadata (Cloud).
    org_name: null # Undocumented; likely organization name (Cloud).
    product_updates: null # Undocumented; likely product updates metadata (Cloud).
    project_status: null # Undocumented; likely project status (Cloud).
---
# Directus hook extension: sync GitHub profile fields + avatar on SSO
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-extensions-seed
  namespace: directus
data:
  github-profile-sync.package.json: |
    {
      "name": "directus-extension-github-profile-sync",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "hook",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }
  github-profile-sync.index.js: |
    const PROVIDER = 'github';

    const isNonEmpty = (value) => value !== null && value !== undefined && value !== '';
    const isObject = (value) => value && typeof value === 'object' && !Array.isArray(value);
    const splitName = (fullName) => {
      if (!fullName || typeof fullName !== 'string') return { firstName: undefined, lastName: undefined };
      const cleaned = fullName.trim().replace(/\s+/g, ' ');
      if (!cleaned) return { firstName: undefined, lastName: undefined };
      if (cleaned.includes(',')) {
        const parts = cleaned.split(',').map((part) => part.trim()).filter(Boolean);
        if (parts.length >= 2) return { firstName: parts.slice(1).join(' '), lastName: parts[0] };
      }
      const parts = cleaned.split(' ');
      if (parts.length === 1) return { firstName: parts[0], lastName: undefined };
      return { firstName: parts.slice(0, -1).join(' '), lastName: parts[parts.length - 1] };
    };
    const getPath = (obj, path) => {
      if (!obj) return undefined;
      return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined ? acc[key] : undefined), obj);
    };
    const pick = (obj, ...paths) => {
      if (!obj) return undefined;
      for (const path of paths) {
        const value = getPath(obj, path);
        if (isNonEmpty(value)) return value;
      }
      return undefined;
    };
    const isProfileLike = (obj) => {
      if (!isObject(obj)) return false;
      return ['login', 'id', 'html_url', 'avatar_url', 'name', 'company', 'bio']
        .some((key) => isNonEmpty(obj[key]));
    };
    const extractUserInfo = (meta) => {
      const payload = meta?.providerPayload;
      if (!isObject(payload)) return null;
      const directCandidates = [
        payload.userInfo,
        payload.profile,
        payload.user,
        payload.data,
        payload.raw,
        payload.response,
        payload.body
      ];
      for (const candidate of directCandidates) {
        if (isProfileLike(candidate)) return candidate;
      }
      if (isProfileLike(payload)) return payload;
      const queue = [{ value: payload, depth: 0 }];
      const seen = new Set();
      while (queue.length) {
        const { value, depth } = queue.shift();
        if (!isObject(value) || seen.has(value) || depth > 3) continue;
        seen.add(value);
        if (isProfileLike(value)) return value;
        for (const key of Object.keys(value)) {
          const next = value[key];
          if (isObject(next)) queue.push({ value: next, depth: depth + 1 });
        }
      }
      return null;
    };

    const buildGithubMetadata = (info, payload) => {
      const metadata = {};
      const sources = [info, payload].filter(isObject);
      const readMeta = (key) => {
        for (const src of sources) {
          const val = pick(src, key, `profile.${key}`, `data.${key}`, `user.${key}`);
          if (val !== undefined) return val;
        }
        return undefined;
      };
      const emails = readMeta('emails');
      const orgs = readMeta('orgs');
      const teams = readMeta('teams');
      if (emails !== undefined) metadata.emails = emails;
      if (orgs !== undefined) metadata.orgs = orgs;
      if (teams !== undefined) metadata.teams = teams;
      return Object.keys(metadata).length ? metadata : undefined;
    };

    export default ({ filter }, { services, logger, getSchema }) => {
      logger.info('[github-profile-sync] hook loaded');
      const { FilesService } = services;

      async function filterUserUpdates(updates, context) {
        try {
          const schema = context.schema ?? (await getSchema());
          const fields = schema?.collections?.directus_users?.fields;
          if (!fields) return updates;
          const allowed = new Set(Object.keys(fields));
          const filtered = {};
          for (const [key, value] of Object.entries(updates)) {
            if (allowed.has(key)) filtered[key] = value;
          }
          return filtered;
        } catch {
          return updates;
        }
      }

      async function maybeImportAvatar(avatarUrl, meta, context, userInfo) {
        if (!avatarUrl || typeof avatarUrl !== 'string') return undefined;

        try {
          if (meta?.identifier) {
            const existing = await context.database('directus_users')
              .select('avatar')
              .where({ external_identifier: meta.identifier, provider: PROVIDER })
              .first();

            if (existing?.avatar) return undefined;
          }

          const schema = context.schema ?? (await getSchema());
          const filesService = new FilesService({
            knex: context.database,
            schema,
            accountability: null
          });

          const title = userInfo?.login ? `${userInfo.login} (GitHub avatar)` : 'GitHub avatar';
          return await filesService.importOne(avatarUrl, { title });
        } catch (error) {
          logger.warn(error, '[github-profile-sync] Failed to import avatar from GitHub');
          return undefined;
        }
      }

      async function applyGithubProfile(payload, meta, context, opts) {
        const provider = (meta?.provider || '').toLowerCase();
        if (provider !== PROVIDER) return payload;

        const userInfo = extractUserInfo(meta);
        if (!userInfo) {
          try {
            logger.info(
              { providerPayloadKeys: Object.keys(meta?.providerPayload || {}) },
              '[github-profile-sync] No userInfo found in provider payload'
            );
          } catch {}
          return payload;
        }
        try {
          const keys = Object.keys(userInfo);
          logger.info(
            { keys: keys.slice(0, 30), total: keys.length },
            '[github-profile-sync] userInfo keys'
          );
        } catch {}

        const payloadInfo = isObject(meta?.providerPayload) ? meta.providerPayload : {};
        const updates = {};
        const login = pick(userInfo, 'login', 'profile.login', 'data.login', 'user.login')
          ?? pick(payloadInfo, 'login', 'profile.login', 'data.login', 'user.login');
        const htmlUrl = pick(userInfo, 'html_url', 'profile.html_url', 'data.html_url', 'user.html_url')
          ?? pick(payloadInfo, 'html_url', 'profile.html_url', 'data.html_url', 'user.html_url');
        const company = pick(userInfo, 'company', 'profile.company', 'data.company', 'user.company')
          ?? pick(payloadInfo, 'company', 'profile.company', 'data.company', 'user.company');
        const bio = pick(userInfo, 'bio', 'profile.bio', 'data.bio', 'user.bio')
          ?? pick(payloadInfo, 'bio', 'profile.bio', 'data.bio', 'user.bio');
        const location = pick(userInfo, 'location', 'profile.location', 'data.location', 'user.location')
          ?? pick(payloadInfo, 'location', 'profile.location', 'data.location', 'user.location');
        const title = pick(userInfo, 'title', 'profile.title', 'data.title', 'user.title')
          ?? pick(payloadInfo, 'title', 'profile.title', 'data.title', 'user.title');
        const description = pick(userInfo, 'description', 'profile.description', 'data.description', 'user.description')
          ?? pick(payloadInfo, 'description', 'profile.description', 'data.description', 'user.description');
        const givenName = pick(
          userInfo,
          'given_name',
          'first_name',
          'profile.given_name',
          'profile.first_name',
          'data.given_name',
          'data.first_name',
          'user.given_name',
          'user.first_name'
        ) ?? pick(
          payloadInfo,
          'given_name',
          'first_name',
          'profile.given_name',
          'profile.first_name',
          'data.given_name',
          'data.first_name',
          'user.given_name',
          'user.first_name'
        );
        const familyName = pick(
          userInfo,
          'family_name',
          'last_name',
          'profile.family_name',
          'profile.last_name',
          'data.family_name',
          'data.last_name',
          'user.family_name',
          'user.last_name'
        ) ?? pick(
          payloadInfo,
          'family_name',
          'last_name',
          'profile.family_name',
          'profile.last_name',
          'data.family_name',
          'data.last_name',
          'user.family_name',
          'user.last_name'
        );

        if (login) updates.github_login = login;
        if (htmlUrl) updates.github_url = htmlUrl;
        if (company) updates.github_company = company;
        if (bio) updates.github_bio = bio;
        if (location) updates.location = location;
        if (title || company) updates.title = title || company;
        if (description || bio) updates.description = description || bio;

        if (givenName || familyName) {
          if (givenName) updates.first_name = givenName;
          if (familyName) updates.last_name = familyName;
        } else {
          const name = pick(userInfo, 'name', 'profile.name', 'data.name', 'user.name')
            ?? pick(payloadInfo, 'name', 'profile.name', 'data.name', 'user.name');
          const split = splitName(name);
          if (split.firstName) updates.first_name = split.firstName;
          if (split.lastName) updates.last_name = split.lastName;
        }

        const metadata = buildGithubMetadata(userInfo, payloadInfo);
        if (metadata) updates.github_metadata = metadata;

        if (opts?.importAvatar) {
          const avatarUrl = pick(userInfo, 'avatar_url', 'profile.avatar_url', 'data.avatar_url', 'user.avatar_url')
            ?? pick(payloadInfo, 'avatar_url', 'profile.avatar_url', 'data.avatar_url', 'user.avatar_url');
          const avatarId = await maybeImportAvatar(avatarUrl, meta, context, userInfo);
          if (avatarId) updates.avatar = avatarId;
        }

        const safeUpdates = await filterUserUpdates(updates, context);
        return { ...payload, ...safeUpdates };
      }

      filter('auth.create', async (payload, meta, context) => {
        return applyGithubProfile(payload, meta, context, { importAvatar: true });
      });

      filter('auth.update', async (payload, meta, context) => {
        return applyGithubProfile(payload, meta, context, { importAvatar: true });
      });
    };

  ai-provider-access.package.json: |
    {
      "name": "directus-extension-ai-provider-access",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "hook",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }

  ai-provider-access.index.js: |
    const EXTERNAL_PROVIDER_KEYS = [
      'ai_openai_allowed_models',
      'ai_anthropic_allowed_models',
      'ai_google_allowed_models'
    ];

    const EXTERNAL_PROVIDER_SECRET_KEYS = [
      'ai_openai_api_key',
      'ai_anthropic_api_key',
      'ai_google_api_key'
    ];

    const redactExternalProviders = (record) => {
      if (!record || typeof record !== 'object') return record;
      const next = { ...record };
      for (const key of EXTERNAL_PROVIDER_KEYS) {
        if (key in next) next[key] = [];
      }
      for (const key of EXTERNAL_PROVIDER_SECRET_KEYS) {
        if (key in next) next[key] = null;
      }
      return next;
    };

    export default ({ filter, init }, { logger }) => {
      logger.info('[ai-provider-access] hook loaded');

      // Hide external providers (OpenAI/Anthropic/Google) from non-admin users in the UI and API.
      filter('settings.read', (records, _meta, context) => {
        const acc = context?.accountability;
        if (!acc || acc.admin) return records;
        if (Array.isArray(records)) return records.map(redactExternalProviders);
        return redactExternalProviders(records);
      });

      // Enforce cost controls server-side: only admins may call external providers via /ai/chat.
      init('routes.before', ({ app }) => {
        const sendForbidden = (res, message) => {
          res.status(403).json({
            errors: [
              {
                message: message || 'Forbidden',
                extensions: { code: 'FORBIDDEN' }
              }
            ]
          });
        };

        app.use('/ai/chat', (req, res, next) => {
          try {
            const acc = req.accountability;
            if (!acc || acc.admin) return next();
            if (req.method !== 'POST') return next();

            const provider = req.body?.provider;
            if (!provider) return next(); // let Directus validate payload

            if (provider !== 'openai-compatible') {
              sendForbidden(res, 'External AI providers are restricted to administrators');
              return;
            }

            return next();
          } catch (error) {
            return next(error);
          }
        });
      });
    };

  cms-content-model-select.package.json: |
    {
      "name": "directus-extension-cms-content-model-select",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "interface",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }

  cms-content-model-select.index.js: |
    import { defineInterface } from '@directus/extensions-sdk';
    import { defineComponent, h, ref, computed, watch, onMounted, onBeforeUnmount, resolveComponent } from 'vue';

    const asString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    };

    const normalizeRows = (response) => {
      const payload = response?.data;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload)) return payload;
      return [];
    };

    const parseId = (value) => {
      if (value && typeof value === 'object') {
        if ('id' in value) return asString(value.id);
        if ('primaryKey' in value) return asString(value.primaryKey);
      }
      return asString(value);
    };

    const escapeRegex = (value) => String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const getPrimaryKeyFromLocation = (collectionName) => {
      if (typeof window === 'undefined') return '';
      const targetCollection = asString(collectionName);
      const path = asString(window.location?.pathname);
      if (targetCollection && path) {
        const match = path.match(new RegExp(`/${escapeRegex(targetCollection)}/([^/?#]+)`));
        if (match?.[1]) return asString(decodeURIComponent(match[1]));
      }

      const query = new URLSearchParams(window.location?.search || '');
      const candidates = ['primaryKey', 'pk', 'item', 'id'].map((key) => asString(query.get(key)));
      return candidates.find((value) => Boolean(value)) || '';
    };

    const uniqueChoices = (items) => {
      const seen = new Set();
      const result = [];
      for (const item of items) {
        const value = asString(item?.value);
        if (!value || seen.has(value)) continue;
        seen.add(value);
        result.push({ value, text: asString(item?.text) || value });
      }
      return result;
    };
    
    const parseOptions = (value) => {
      if (!value) return {};
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return typeof value === 'object' ? value : {};
    };
    
    const InterfaceComponent = defineComponent({
      name: 'CmsContentModelSelect',
      props: {
        value: { type: [String, Number, null], default: null },
        disabled: { type: Boolean, default: false },
        options: { type: Object, default: () => ({}) },
        values: { type: Object, default: () => ({}) },
        field: { type: String, default: '' },
        collection: { type: String, default: '' },
      },
      emits: ['input'],
      setup(props, { emit }) {
        const loading = ref(false);
        const loadError = ref('');
        const choices = ref([]);
        const missingContext = ref('');
        
        const resolvedOptions = computed(() => parseOptions(props.options));
        const fieldKey = computed(() => asString(props.field).toLowerCase());
        const collectionKey = computed(() => asString(props.collection).toLowerCase());
        const mode = computed(() => {
          const explicit = asString(resolvedOptions.value?.mode).toLowerCase();
          if (explicit === 'template' || explicit === 'slot' || explicit === 'theme' || explicit === 'module' || explicit === 'parent') return explicit;
          if (fieldKey.value === 'slot') return 'slot';
          if (fieldKey.value === 'parent_block_id') return 'parent';
          if (fieldKey.value === 'layout_template_key') return 'template';
          if (fieldKey.value === 'theme_package_key') return 'theme';
          if (fieldKey.value === 'module_key') return 'module';
          if (collectionKey.value === 'cms_page_blocks' && fieldKey.value.includes('slot')) return 'slot';
          if (collectionKey.value === 'cms_page_blocks' && fieldKey.value.includes('parent_block')) return 'parent';
          if (collectionKey.value === 'cms_pages' && fieldKey.value.includes('layout_template')) return 'template';
          if (collectionKey.value === 'cms_pages' && fieldKey.value.includes('theme_package')) return 'theme';
          if (collectionKey.value === 'cms_block_module' && fieldKey.value.includes('module_key')) return 'module';
          if (resolvedOptions.value?.page_blocks_collection || resolvedOptions.value?.template_refs_collection || resolvedOptions.value?.parent_id_field) {
            return 'parent';
          }
          if (resolvedOptions.value?.slots_collection || resolvedOptions.value?.slot_value_field || resolvedOptions.value?.slot_label_field) {
            return 'slot';
          }
          if (resolvedOptions.value?.themes_collection || resolvedOptions.value?.theme_value_field || resolvedOptions.value?.theme_label_field) {
            return 'theme';
          }
          if (resolvedOptions.value?.modules_collection || resolvedOptions.value?.module_value_field || resolvedOptions.value?.module_label_field) {
            return 'module';
          }
          return 'template';
        });
        const templatesCollection = computed(() => asString(resolvedOptions.value?.templates_collection) || 'cms_layout_templates');
        const slotsCollection = computed(() => asString(resolvedOptions.value?.slots_collection) || 'cms_layout_template_slots');
        const themesCollection = computed(() => asString(resolvedOptions.value?.themes_collection) || 'cms_theme_packages');
        const modulesCollection = computed(() => asString(resolvedOptions.value?.modules_collection) || 'cms_modules');
        const pagesCollection = computed(() => asString(resolvedOptions.value?.pages_collection) || 'cms_pages');
        const pageBlocksCollection = computed(() => asString(resolvedOptions.value?.page_blocks_collection) || 'cms_page_blocks');
        const pageBlocksCollectionKey = computed(() => pageBlocksCollection.value.toLowerCase());
        const templateRefsCollection = computed(() => asString(resolvedOptions.value?.template_refs_collection) || 'cms_block_template_ref');

        const pageIdField = computed(() => asString(resolvedOptions.value?.page_id_field) || 'page_id');
        const pageTemplateField = computed(() => asString(resolvedOptions.value?.page_template_field) || 'layout_template_key');
        const pageSiteField = computed(() => asString(resolvedOptions.value?.page_site_field) || 'site_key');
        const pageSlugField = computed(() => asString(resolvedOptions.value?.page_slug_field) || 'page_slug');
        const parentIdField = computed(() => asString(resolvedOptions.value?.parent_id_field) || 'parent_block_id');
        const itemIdField = computed(() => asString(resolvedOptions.value?.item_id_field) || 'id');
        const slotValueField = computed(() => asString(resolvedOptions.value?.slot_value_field) || 'slot_key');
        const slotLabelField = computed(() => asString(resolvedOptions.value?.slot_label_field) || 'slot_label');
        const templateValueField = computed(() => asString(resolvedOptions.value?.template_value_field) || 'template_key');
        const templateLabelField = computed(() => asString(resolvedOptions.value?.template_label_field) || 'name');
        const themeValueField = computed(() => asString(resolvedOptions.value?.theme_value_field) || 'theme_key');
        const themeLabelField = computed(() => asString(resolvedOptions.value?.theme_label_field) || 'name');
        const moduleValueField = computed(() => asString(resolvedOptions.value?.module_value_field) || 'module_key');
        const moduleLabelField = computed(() => asString(resolvedOptions.value?.module_label_field) || 'name');
        const includeGlobal = computed(() => {
          const v = resolvedOptions.value?.include_global;
          if (typeof v === 'string') return v.toLowerCase() !== 'false';
          return v !== false;
        });
        const parentSelectionOverride = ref('');
        const persistedValue = ref('');
        const fallbackCommittedValue = ref('');
        const hasUserInput = ref(false);
        const recordUpdatedAt = computed(() =>
          asString(
            props.values?.date_updated
              ?? props.values?.updated_at
              ?? props.values?.dateUpdated
          )
        );
        let requestId = 0;
        let persistedRequestId = 0;

        const resolveRecordContext = () => {
          const recordCollection = collectionKey.value || pagesCollection.value;
          let recordId =
            parseId(props.values?.[itemIdField.value]) ||
            parseId(props.values?.id);

          // For top-level editors, recover record id from URL.
          if (!recordId && recordCollection === pagesCollection.value) {
            recordId = getPrimaryKeyFromLocation(recordCollection);
          }

          return { recordCollection, recordId };
        };

        const resolveSelectedParentBlockId = () => {
          const overrideValue = asString(parentSelectionOverride.value);
          if (overrideValue) return overrideValue;
          return parseId(props.values?.[parentIdField.value]);
        };
        
        const apiGet = async (path, params = {}) => {
          const url = new URL(path, window.location.origin);
          Object.entries(params).forEach(([key, value]) => {
            if (value === null || value === undefined) return;
            url.searchParams.set(key, String(value));
          });
        
          const response = await fetch(url.toString(), {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          });
        
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const message = payload?.errors?.[0]?.message || `Request failed (${response.status})`;
            throw new Error(message);
          }
        
          return payload;
        };

        const buildScopedFilter = (siteKey) => {
          if (!includeGlobal.value && siteKey) {
            return { site_key: { _eq: siteKey } };
          }
          if (siteKey) {
            return {
              _or: [
                { site_key: { _empty: true } },
                { site_key: { _eq: siteKey } },
              ],
            };
          }
          return { site_key: { _empty: true } };
        };

        const loadTemplateChoices = async () => {
          const siteKey = asString(props.values?.[pageSiteField.value]);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              buildScopedFilter(siteKey),
            ],
          };
          const response = await apiGet(`/items/${templatesCollection.value}`, {
            fields: [templateValueField.value, templateLabelField.value, 'site_key', 'status'].join(','),
            limit: -1,
            sort: templateValueField.value,
            filter: JSON.stringify(filter),
          });
          return uniqueChoices(
            normalizeRows(response).map((row) => ({
              value: row?.[templateValueField.value],
              text: row?.[templateLabelField.value] || row?.[templateValueField.value],
            }))
          );
        };

        const loadThemeChoices = async () => {
          const siteKey = asString(props.values?.[pageSiteField.value]);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              buildScopedFilter(siteKey),
            ],
          };
          const response = await apiGet(`/items/${themesCollection.value}`, {
            fields: [themeValueField.value, themeLabelField.value, 'site_key', 'status'].join(','),
            limit: -1,
            sort: themeValueField.value,
            filter: JSON.stringify(filter),
          });
          return uniqueChoices(
            normalizeRows(response).map((row) => ({
              value: row?.[themeValueField.value],
              text: row?.[themeLabelField.value] || row?.[themeValueField.value],
            }))
          );
        };

        const loadModuleChoices = async () => {
          const siteKey = asString(props.values?.[pageSiteField.value]);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              buildScopedFilter(siteKey),
            ],
          };
          const response = await apiGet(`/items/${modulesCollection.value}`, {
            fields: [moduleValueField.value, moduleLabelField.value, 'site_key', 'status'].join(','),
            limit: -1,
            sort: moduleValueField.value,
            filter: JSON.stringify(filter),
          });
          return uniqueChoices(
            normalizeRows(response).map((row) => ({
              value: row?.[moduleValueField.value],
              text: row?.[moduleLabelField.value] || row?.[moduleValueField.value],
            }))
          );
        };

        const resolvePageContext = async () => {
          let pageId = parseId(props.values?.[pageIdField.value]);
          let pageSlug = asString(props.values?.[pageSlugField.value]);
          let siteKey = asString(props.values?.[pageSiteField.value]);
          let currentBlockId =
            parseId(props.values?.[itemIdField.value]) ||
            parseId(props.values?.id);

          if (!currentBlockId && collectionKey.value === pageBlocksCollectionKey.value) {
            currentBlockId = getPrimaryKeyFromLocation(collectionKey.value);
          }

          if (!pageId && currentBlockId && collectionKey.value === pageBlocksCollectionKey.value) {
            try {
              const blockResp = await apiGet(`/items/${pageBlocksCollection.value}/${encodeURIComponent(currentBlockId)}`, {
                fields: [pageIdField.value, pageSlugField.value, pageSiteField.value].join(','),
              });
              const block = blockResp?.data || {};
              pageId = parseId(block?.[pageIdField.value]);
              if (!pageSlug) pageSlug = asString(block?.[pageSlugField.value]);
              if (!siteKey) siteKey = asString(block?.[pageSiteField.value]);
            } catch {
              // Ignore context lookup errors and continue fallback chain.
            }
          }

          if (!pageId) {
            const pageIdFromUrl = getPrimaryKeyFromLocation(pagesCollection.value);
            if (pageIdFromUrl) {
              pageId = pageIdFromUrl;
            }
          }

          if (pageId && (!siteKey || !pageSlug)) {
            try {
              const pageResp = await apiGet(`/items/${pagesCollection.value}/${encodeURIComponent(pageId)}`, {
                fields: [pageSiteField.value, pageSlugField.value].join(','),
              });
              const page = pageResp?.data || {};
              if (!siteKey) siteKey = asString(page?.[pageSiteField.value]);
              if (!pageSlug) pageSlug = asString(page?.[pageSlugField.value]);
            } catch {
              // Ignore page lookup errors and continue with best-effort context.
            }
          }

          if (!pageId && pageSlug) {
            const pageFilter = {
              _and: [
                { slug: { _eq: pageSlug } },
                ...(siteKey ? [{
                  _or: [
                    { [pageSiteField.value]: { _empty: true } },
                    { [pageSiteField.value]: { _eq: siteKey } },
                  ],
                }] : []),
              ],
            };
            try {
              const pageListResp = await apiGet(`/items/${pagesCollection.value}`, {
                fields: ['id', pageSiteField.value, pageSlugField.value].join(','),
                limit: 1,
                filter: JSON.stringify(pageFilter),
              });
              const page = normalizeRows(pageListResp)?.[0] || {};
              if (!pageId) pageId = parseId(page?.id);
              if (!siteKey) siteKey = asString(page?.[pageSiteField.value]);
              if (!pageSlug) pageSlug = asString(page?.[pageSlugField.value]);
            } catch {
              // Ignore page lookup errors and continue with best-effort context.
            }
          }

          return { pageId, pageSlug, siteKey, currentBlockId };
        };

        const loadSlotChoices = async () => {
          const selectedParentBlockId = resolveSelectedParentBlockId();
          let siteKey = asString(props.values?.[pageSiteField.value]);
          let templateKey = '';
          let { pageId, pageSlug } = await resolvePageContext();

          if (!siteKey) {
            siteKey = asString(props.values?.[pageSiteField.value]);
          }

          if (selectedParentBlockId) {
            try {
              const parentBlockResp = await apiGet(`/items/${pageBlocksCollection.value}/${encodeURIComponent(selectedParentBlockId)}`, {
                fields: ['collection', 'item', pageIdField.value, pageSlugField.value, pageSiteField.value].join(','),
              });
              const parentBlock = parentBlockResp?.data || {};
              const parentCollection = asString(parentBlock?.collection);
              if (parentCollection !== 'cms_block_template_ref') {
                missingContext.value = 'Selected parent must be a Template Ref block.';
                return [];
              }

              const parentTemplateRefId = parseId(parentBlock?.item);
              if (!parentTemplateRefId) {
                missingContext.value = 'Parent template block is missing its template reference.';
                return [];
              }

              if (!pageId) pageId = parseId(parentBlock?.[pageIdField.value]);
              if (!pageSlug) pageSlug = asString(parentBlock?.[pageSlugField.value]);
              if (!siteKey) siteKey = asString(parentBlock?.[pageSiteField.value]);

              const parentTemplateRefResp = await apiGet(`/items/${templateRefsCollection.value}/${encodeURIComponent(parentTemplateRefId)}`, {
                fields: ['template_key', 'status', 'site_key'].join(','),
              });
              const parentTemplateRef = parentTemplateRefResp?.data || {};
              templateKey = asString(parentTemplateRef?.template_key);
              if (!siteKey) siteKey = asString(parentTemplateRef?.site_key);
            } catch {
              missingContext.value = 'Select a valid parent template block before assigning nested slots.';
              return [];
            }
          } else {
            templateKey = asString(props.values?.[pageTemplateField.value]);
          }

          if (!templateKey && pageId) {
            const pageResp = await apiGet(`/items/${pagesCollection.value}/${encodeURIComponent(pageId)}`, {
              fields: [pageTemplateField.value, pageSiteField.value].join(','),
            });
            const page = pageResp?.data || {};
            templateKey = asString(page?.[pageTemplateField.value]);
            if (!siteKey) siteKey = asString(page?.[pageSiteField.value]);
          }

          // Fallback for cases where only page_slug/site_key are present in form values.
          if (!templateKey && pageSlug) {
            const pageFilter = {
              _and: [
                { slug: { _eq: pageSlug } },
                ...(siteKey ? [{
                  _or: [
                    { [pageSiteField.value]: { _empty: true } },
                    { [pageSiteField.value]: { _eq: siteKey } },
                  ],
                }] : []),
              ],
            };
            const pageListResp = await apiGet(`/items/${pagesCollection.value}`, {
              fields: [pageTemplateField.value, pageSiteField.value, 'id'].join(','),
              limit: 1,
              filter: JSON.stringify(pageFilter),
            });
            const page = normalizeRows(pageListResp)?.[0] || {};
            templateKey = asString(page?.[pageTemplateField.value]);
            if (!siteKey) siteKey = asString(page?.[pageSiteField.value]);
            if (!pageId) pageId = parseId(page?.id);
          }

          if (!templateKey) {
            missingContext.value = selectedParentBlockId
              ? 'Select a parent template block before assigning nested slots.'
              : 'Select a page template before assigning a slot.';
            return [];
          }

          const filter = {
            _and: [
              { template_key: { _eq: templateKey } },
              buildScopedFilter(siteKey),
            ],
          };
          const response = await apiGet(`/items/${slotsCollection.value}`, {
            fields: [slotValueField.value, slotLabelField.value, 'site_key', 'template_key'].join(','),
            limit: -1,
            sort: slotValueField.value,
            filter: JSON.stringify(filter),
          });

          return uniqueChoices(
            normalizeRows(response).map((row) => ({
              value: row?.[slotValueField.value],
              text: row?.[slotLabelField.value] || row?.[slotValueField.value],
            }))
          );
        };

        const loadParentChoices = async () => {
          const context = await resolvePageContext();
          const pageId = context.pageId;
          if (!pageId) {
            missingContext.value = 'Save this block first so Directus can resolve its page context.';
            return [];
          }

          const clauses = [
            { collection: { _eq: 'cms_block_template_ref' } },
            { [pageIdField.value]: { _eq: pageId } },
          ];
          if (context.siteKey) {
            clauses.push({ [pageSiteField.value]: { _eq: context.siteKey } });
          }
          if (context.pageSlug) {
            clauses.push({ [pageSlugField.value]: { _eq: context.pageSlug } });
          }
          if (context.currentBlockId) {
            clauses.push({ [itemIdField.value]: { _neq: context.currentBlockId } });
          }

          const blockLinksResp = await apiGet(`/items/${pageBlocksCollection.value}`, {
            fields: [itemIdField.value, 'collection', 'item', 'slot', 'sort', pageIdField.value, pageSiteField.value, pageSlugField.value].join(','),
            limit: -1,
            filter: JSON.stringify({ _and: clauses }),
          });
          const blockLinks = normalizeRows(blockLinksResp).filter((row) => asString(row?.collection) === 'cms_block_template_ref');
          if (blockLinks.length === 0) {
            return [];
          }

          const templateRefIds = uniqueChoices(
            blockLinks.map((row) => ({ value: asString(row?.item), text: asString(row?.item) }))
          ).map((choice) => choice.value);
          if (templateRefIds.length === 0) {
            return [];
          }

          const templateRefsResp = await apiGet(`/items/${templateRefsCollection.value}`, {
            fields: ['id', 'name', 'template_key', 'status'].join(','),
            limit: -1,
            filter: JSON.stringify({
              _and: [
                { id: { _in: templateRefIds } },
                { status: { _eq: 'published' } },
              ],
            }),
          });
          const templateRefMap = new Map(
            normalizeRows(templateRefsResp).map((row) => [asString(row?.id), row]),
          );

          const sortedBlockLinks = [...blockLinks].sort((left, right) => {
            const leftSort = Number(left?.sort ?? Number.MAX_SAFE_INTEGER);
            const rightSort = Number(right?.sort ?? Number.MAX_SAFE_INTEGER);
            if (leftSort !== rightSort) return leftSort - rightSort;
            return asString(left?.[itemIdField.value]).localeCompare(asString(right?.[itemIdField.value]));
          });

          return uniqueChoices(
            sortedBlockLinks.map((row) => {
              const linkId = asString(row?.[itemIdField.value]);
              const templateRef = templateRefMap.get(asString(row?.item));
              const baseLabel =
                asString(templateRef?.name) ||
                asString(templateRef?.template_key) ||
                asString(row?.item) ||
                'Template Block';
              const slotLabel = asString(row?.slot);
              const text = slotLabel ? `${baseLabel} [slot:${slotLabel}]` : baseLabel;
              return { value: linkId, text };
            })
          );
        };

        const loadChoices = async () => {
          const currentRequest = ++requestId;
          loading.value = true;
          loadError.value = '';
          missingContext.value = '';
          try {
            const nextChoices = mode.value === 'template'
              ? await loadTemplateChoices()
              : mode.value === 'theme'
                ? await loadThemeChoices()
                : mode.value === 'module'
                  ? await loadModuleChoices()
                  : mode.value === 'parent'
                    ? await loadParentChoices()
                    : await loadSlotChoices();
            if (currentRequest !== requestId) return;
            choices.value = uniqueChoices(nextChoices);

            if (mode.value === 'slot' && choices.value.length > 0) {
              const currentValue = asString(props.value);
              const hasCurrent = currentValue && choices.value.some((choice) => asString(choice.value) === currentValue);
              if (!hasCurrent) {
                const nextValue = asString(choices.value[0]?.value);
                if (nextValue) {
                  emit('input', nextValue);
                }
              }
            }

            if (choices.value.length === 0 && !missingContext.value) {
              if (mode.value === 'parent') {
                loadError.value = '';
                missingContext.value = 'Optional: leave empty for top-level blocks, or create a published Template Ref block on this page first.';
              } else {
                loadError.value = mode.value === 'template'
                  ? 'No published templates available for this site scope.'
                  : mode.value === 'theme'
                    ? 'No published themes available for this site scope.'
                    : mode.value === 'module'
                      ? 'No published modules available for this site scope.'
                      : 'No valid slots available for this page template and site scope.';
              }
            }
          } catch (error) {
            if (currentRequest !== requestId) return;
            choices.value = [];
            missingContext.value = '';
            if (mode.value === 'parent') {
              loadError.value = '';
              missingContext.value = 'Optional: parent block unavailable in this context. Save the page and create a Template Ref block first.';
            } else {
              loadError.value = error?.response?.data?.errors?.[0]?.message
                || error?.message
                || 'Failed to load options';
            }
          } finally {
            if (currentRequest === requestId) loading.value = false;
          }
        };

        const loadPersistedValue = async () => {
          const currentRequest = ++persistedRequestId;
          persistedValue.value = '';

          const { recordCollection, recordId } = resolveRecordContext();
          const fieldName = asString(props.field);
          if (!recordCollection || !fieldName) return;

          let nextPersisted = '';

          if (recordId) {
            try {
              const response = await apiGet(
                `/items/${recordCollection}/${encodeURIComponent(recordId)}`,
                { fields: fieldName }
              );
              nextPersisted = asString(response?.data?.[fieldName]);
            } catch {
              nextPersisted = '';
            }
          }

          // Block drawers don't always expose the page_blocks row id in values.
          // When selecting slot, resolve persisted value from cms_page_blocks by (collection,item).
          if (!nextPersisted && (fieldKey.value === 'slot' || fieldKey.value === 'parent_block_id')) {
            const blockCollection = asString(props.values?.collection);
            const blockItem = parseId(props.values?.item);
            const blockPageId = parseId(props.values?.[pageIdField.value]);
            const blockSiteKey = asString(props.values?.[pageSiteField.value]);
            const blockPageSlug = asString(props.values?.[pageSlugField.value]);

            if (blockCollection && blockItem) {
              const clauses = [
                { collection: { _eq: blockCollection } },
                { item: { _eq: blockItem } },
              ];
              if (blockPageId) {
                clauses.push({ [pageIdField.value]: { _eq: blockPageId } });
              }
              if (blockSiteKey) {
                clauses.push({ [pageSiteField.value]: { _eq: blockSiteKey } });
              }
              if (blockPageSlug) {
                clauses.push({ [pageSlugField.value]: { _eq: blockPageSlug } });
              }

              try {
                const response = await apiGet(`/items/${pageBlocksCollection.value}`, {
                  fields: ['id', fieldName, pageIdField.value, pageSiteField.value, pageSlugField.value].join(','),
                  limit: -1,
                  sort: '-date_updated',
                  filter: JSON.stringify({ _and: clauses }),
                });
                const rows = normalizeRows(response);
                const currentFieldValue = asString(props.value);
                const preferredRow =
                  rows.find((row) => currentFieldValue && asString(row?.[fieldName]) === currentFieldValue)
                  || rows[0]
                  || {};
                nextPersisted = asString(preferredRow?.[fieldName]);
              } catch {
                nextPersisted = '';
              }
            }
          }

          if (currentRequest !== persistedRequestId) return;
          persistedValue.value = nextPersisted;
        };

        watch(
          () => JSON.stringify({
            mode: mode.value,
            templatesCollection: templatesCollection.value,
            slotsCollection: slotsCollection.value,
            themesCollection: themesCollection.value,
            modulesCollection: modulesCollection.value,
            pageBlocksCollection: pageBlocksCollection.value,
            templateRefsCollection: templateRefsCollection.value,
            pagesCollection: pagesCollection.value,
            siteKey: asString(props.values?.[pageSiteField.value]),
            pageId: parseId(props.values?.[pageIdField.value]),
            pageSlug: asString(props.values?.[pageSlugField.value]),
            pageTemplate: asString(props.values?.[pageTemplateField.value]),
            parentBlockId: parseId(props.values?.[parentIdField.value]),
            parentSelectionOverride: asString(parentSelectionOverride.value),
            field: fieldKey.value,
            collection: collectionKey.value,
          }),
          () => { void loadChoices(); },
          { immediate: true }
        );

        watch(
          () => JSON.stringify({
            field: asString(props.field),
            fieldKey: fieldKey.value,
            recordCollection: resolveRecordContext().recordCollection,
            recordId: resolveRecordContext().recordId,
            blockCollection: asString(props.values?.collection),
            blockItem: parseId(props.values?.item),
            blockPageId: parseId(props.values?.[pageIdField.value]),
            blockSiteKey: asString(props.values?.[pageSiteField.value]),
            blockPageSlug: asString(props.values?.[pageSlugField.value]),
            updatedAt: recordUpdatedAt.value,
          }),
          () => {
            // Reset fallback baseline when editor context changes.
            // Slot mode relies on persisted lookup only to avoid false "current" markers.
            fallbackCommittedValue.value = '';
            hasUserInput.value = false;
            void loadPersistedValue();
          },
          { immediate: true }
        );

        watch(
          () => asString(props.value),
          (nextValue) => {
            if (!nextValue || hasUserInput.value) return;
            if (fieldKey.value === 'slot') {
              if (!fallbackCommittedValue.value) {
                fallbackCommittedValue.value = nextValue;
                return;
              }
              // Replace an early placeholder (commonly "main") with the first
              // loaded persisted value, as long as the user has not interacted.
              if (fallbackCommittedValue.value !== nextValue && fallbackCommittedValue.value === 'main') {
                fallbackCommittedValue.value = nextValue;
              }
              return;
            }
            if (fallbackCommittedValue.value) return;
            const { recordId } = resolveRecordContext();
            if (recordId) {
              // Capture delayed initial value once for existing records only.
              fallbackCommittedValue.value = nextValue;
            }
          },
          { immediate: true }
        );

        const selectItems = computed(() => {
          const currentValue = asString(props.value);
          const committed = asString(persistedValue.value) || asString(fallbackCommittedValue.value);
          const isSlotMode = mode.value === 'slot';
          const items = choices.value.map((choice) => ({
            text: committed && asString(choice.value) === committed
              ? `${choice.text} (current)`
              : choice.text,
            value: choice.value,
          }));
          if (!isSlotMode && committed && !items.some((item) => asString(item.value) === committed)) {
            items.unshift({ text: `${committed} (current)`, value: committed });
          }
          if (!isSlotMode && currentValue && currentValue !== committed && !items.some((item) => asString(item.value) === currentValue)) {
            items.unshift({ text: currentValue, value: currentValue });
          }
          return items;
        });

        const onInput = (nextValue) => {
          const next = asString(nextValue);
          const current = asString(props.value);
          if (next !== current) {
            hasUserInput.value = true;
          }
          if (typeof window !== 'undefined') {
            const context = resolveRecordContext();
            window.dispatchEvent(
              new CustomEvent('cms-content-model-select-change', {
                detail: {
                  mode: mode.value,
                  field: asString(props.field),
                  collection: context.recordCollection || collectionKey.value,
                  recordId: context.recordId || '',
                  value: next || '',
                },
              }),
            );
          }
          emit('input', next || null);
        };

        const onSelectorEvent = (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          const eventMode = asString(detail.mode).toLowerCase();
          if (eventMode !== 'parent') return;

          const eventField = asString(detail.field).toLowerCase();
          if (eventField && eventField !== parentIdField.value.toLowerCase()) return;

          const eventCollection = asString(detail.collection).toLowerCase();
          const context = resolveRecordContext();
          const currentCollection = asString(context.recordCollection || collectionKey.value).toLowerCase();
          if (eventCollection && currentCollection && eventCollection !== currentCollection) return;

          const eventRecordId = asString(detail.recordId);
          const currentRecordId = asString(context.recordId);
          if (eventRecordId && currentRecordId && eventRecordId !== currentRecordId) return;

          parentSelectionOverride.value = asString(detail.value);
          if (mode.value === 'slot') {
            void loadChoices();
          }
        };

        onMounted(() => {
          if (typeof window === 'undefined') return;
          window.addEventListener('cms-content-model-select-change', onSelectorEvent);
        });

        onBeforeUnmount(() => {
          if (typeof window === 'undefined') return;
          window.removeEventListener('cms-content-model-select-change', onSelectorEvent);
        });

        return () => {
          const currentValue = asString(props.value);
          const resolvedSelect = resolveComponent('v-select');
          const resolvedNotice = resolveComponent('v-notice');
          const hasDirectusSelect = typeof resolvedSelect !== 'string';
          const placeholderText = loading.value
            ? 'Loading options...'
            : (missingContext.value || (mode.value === 'template' ? 'Select a template' : mode.value === 'theme' ? 'Select a theme' : mode.value === 'module' ? 'Select a module' : mode.value === 'parent' ? 'Optional: select a parent block' : 'Select a slot'));

          const errorNotice = loadError.value
            ? (typeof resolvedNotice !== 'string'
                ? h(
                    resolvedNotice,
                    { type: 'danger', icon: 'warning' },
                    { default: () => loadError.value }
                  )
                : h('p', { class: 'cms-content-model-select__error' }, loadError.value))
            : null;

          if (hasDirectusSelect) {
            return h('div', { class: 'cms-content-model-select' }, [
              h(resolvedSelect, {
                modelValue: currentValue || null,
                items: selectItems.value,
                placeholder: placeholderText,
                disabled: props.disabled || loading.value,
                nonEditable: props.disabled || loading.value,
                showDeselect: false,
                'onUpdate:modelValue': onInput,
              }),
              errorNotice ? h('div', { style: { marginTop: '8px' } }, [errorNotice]) : null,
            ]);
          }

          const opts = selectItems.value.map((choice) => h('option', { value: choice.value }, choice.text));

          return h('div', { class: 'cms-content-model-select' }, [
            h(
              'select',
              {
                class: 'cms-content-model-select__input',
                disabled: props.disabled || loading.value,
                value: currentValue,
                onChange: (event) => onInput(event?.target?.value),
              },
              [h('option', { value: '' }, placeholderText), ...opts]
            ),
            errorNotice,
          ]);
        };
      },
    });

    export default defineInterface({
      id: 'cms-content-model-select',
      name: 'CMS Content Model Select',
      icon: 'view_quilt',
      description: 'Context-aware selector for CMS templates, themes, modules, slots, and parent template blocks.',
      component: InterfaceComponent,
      types: ['string', 'text', 'uuid'],
      group: 'selection',
      options: [
        {
          field: 'mode',
          name: 'Mode',
          type: 'string',
          meta: {
            width: 'half',
            interface: 'select-dropdown',
            options: {
              allowNone: false,
              choices: [
                { text: 'Template Selector', value: 'template' },
                { text: 'Theme Selector', value: 'theme' },
                { text: 'Module Selector', value: 'module' },
                { text: 'Slot Selector', value: 'slot' },
                { text: 'Parent Block Selector', value: 'parent' },
              ],
            },
          },
          schema: { default_value: 'slot' },
        },
        {
          field: 'templates_collection',
          name: 'Templates Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_layout_templates' },
        },
        {
          field: 'slots_collection',
          name: 'Slots Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_layout_template_slots' },
        },
        {
          field: 'themes_collection',
          name: 'Themes Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_theme_packages' },
        },
        {
          field: 'modules_collection',
          name: 'Modules Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_modules' },
        },
        {
          field: 'page_blocks_collection',
          name: 'Page Blocks Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_page_blocks' },
        },
        {
          field: 'template_refs_collection',
          name: 'Template Ref Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_block_template_ref' },
        },
        {
          field: 'parent_id_field',
          name: 'Parent ID Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'parent_block_id' },
        },
        {
          field: 'pages_collection',
          name: 'Pages Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_pages' },
        },
        {
          field: 'include_global',
          name: 'Include Global (site_key null)',
          type: 'boolean',
          meta: { width: 'half', interface: 'boolean' },
          schema: { default_value: true },
        },
      ],
    });

  cms-module-props-editor.package.json: |
    {
      "name": "directus-extension-cms-module-props-editor",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "interface",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }

  cms-module-props-editor.index.js: |
    import { defineInterface } from '@directus/extensions-sdk';
    import { defineComponent, h, ref, computed, watch, onMounted, onBeforeUnmount, resolveComponent } from 'vue';

    const asString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    };

    const asInputString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value);
    };

    const parseJsonLike = (value, fallback) => {
      if (value === null || value === undefined) return fallback;
      if (typeof value === 'string') {
        try {
          return JSON.parse(value);
        } catch {
          return fallback;
        }
      }
      return value;
    };

    const normalizeObject = (value) => {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
      return value;
    };

    const normalizeRows = (response) => {
      const payload = response?.data;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload)) return payload;
      return [];
    };

    const parseId = (value) => {
      if (value && typeof value === 'object') {
        if ('id' in value) return asString(value.id);
        if ('primaryKey' in value) return asString(value.primaryKey);
      }
      return asString(value);
    };

    const parseOptions = (value) => {
      if (!value) return {};
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return typeof value === 'object' ? value : {};
    };

    const escapeRegex = (value) => String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const getPrimaryKeyFromLocation = (collectionName) => {
      if (typeof window === 'undefined') return '';
      const targetCollection = asString(collectionName);
      const path = asString(window.location?.pathname);
      if (targetCollection && path) {
        const match = path.match(new RegExp(`/${escapeRegex(targetCollection)}/([^/?#]+)`));
        if (match?.[1]) return asString(decodeURIComponent(match[1]));
      }
      const query = new URLSearchParams(window.location?.search || '');
      const candidates = ['primaryKey', 'pk', 'item', 'id'].map((key) => asString(query.get(key)));
      return candidates.find((value) => Boolean(value)) || '';
    };

    const InterfaceComponent = defineComponent({
      name: 'CmsModulePropsEditor',
      props: {
        value: { type: [Object, String, null], default: null },
        disabled: { type: Boolean, default: false },
        options: { type: Object, default: () => ({}) },
        values: { type: Object, default: () => ({}) },
        field: { type: String, default: '' },
        collection: { type: String, default: '' },
      },
      emits: ['input'],
      setup(props, { emit }) {
        const loading = ref(false);
        const loadError = ref('');
        const schemaError = ref('');
        const moduleDefinition = ref(null);
        const localProps = ref({});
        const jsonEditorValue = ref('{}');
        const pendingModuleSwitchKey = ref('');
        const pendingModuleDefaults = ref({});
        const applyPendingDefaultsForModuleKey = ref('');
        const moduleKeyOverride = ref('');

        const resolvedOptions = computed(() => parseOptions(props.options));
        const modulesCollection = computed(() => asString(resolvedOptions.value?.modules_collection) || 'cms_modules');
        const moduleKeyField = computed(() => asString(resolvedOptions.value?.module_key_field) || 'module_key');
        const propsSchemaField = computed(() => asString(resolvedOptions.value?.props_schema_field) || 'props_schema');
        const defaultPropsField = computed(() => asString(resolvedOptions.value?.default_props_field) || 'default_props');
        const pageSiteField = computed(() => asString(resolvedOptions.value?.page_site_field) || 'site_key');
        const includeGlobal = computed(() => {
          const v = resolvedOptions.value?.include_global;
          if (typeof v === 'string') return v.toLowerCase() !== 'false';
          return v !== false;
        });
        const showJsonFallback = computed(() => {
          const v = resolvedOptions.value?.show_json_fallback;
          if (typeof v === 'string') return v.toLowerCase() !== 'false';
          return v !== false;
        });
        const pageCollection = computed(() => asString(resolvedOptions.value?.pages_collection) || 'cms_pages');

        const moduleKeyFromValues = computed(() => asString(props.values?.[moduleKeyField.value] ?? props.values?.module_key));
        const moduleKey = computed(() => asString(moduleKeyOverride.value) || moduleKeyFromValues.value);
        const siteKey = computed(() => asString(props.values?.[pageSiteField.value] ?? props.values?.site_key));
        const recordCollectionKey = computed(() => asString(props.collection).toLowerCase());
        const resolveRecordId = () => {
          const fromValues = parseId(props.values?.id);
          if (fromValues) return fromValues;
          const fromLocation = getPrimaryKeyFromLocation(asString(props.collection));
          return asString(fromLocation);
        };

        const incomingProps = computed(() => normalizeObject(parseJsonLike(props.value, {})));

        watch(
          () => JSON.stringify(incomingProps.value),
          () => {
            localProps.value = { ...incomingProps.value };
            jsonEditorValue.value = JSON.stringify(localProps.value, null, 2);
            schemaError.value = '';
          },
          { immediate: true }
        );

        watch(
          () => moduleKey.value,
          (nextValue, previousValue) => {
            const nextKey = asString(nextValue);
            const previousKey = asString(previousValue);
            if (nextKey && previousKey && nextKey !== previousKey) {
              pendingModuleSwitchKey.value = nextKey;
            }
            if (!nextKey) {
              pendingModuleSwitchKey.value = '';
              pendingModuleDefaults.value = {};
              applyPendingDefaultsForModuleKey.value = '';
            }
          }
        );

        watch(
          () => moduleKeyFromValues.value,
          (nextValue) => {
            const nextKey = asString(nextValue);
            if (moduleKeyOverride.value && nextKey && nextKey === moduleKeyOverride.value) {
              moduleKeyOverride.value = '';
            }
          },
        );

        const apiGet = async (path, params = {}) => {
          const url = new URL(path, window.location.origin);
          Object.entries(params).forEach(([key, value]) => {
            if (value === null || value === undefined) return;
            url.searchParams.set(key, String(value));
          });

          const response = await fetch(url.toString(), {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const message = payload?.errors?.[0]?.message || `Request failed (${response.status})`;
            throw new Error(message);
          }
          return payload;
        };

        const buildScopedFilter = (site) => {
          if (!includeGlobal.value && site) {
            return { site_key: { _eq: site } };
          }
          if (site) {
            return {
              _or: [
                { site_key: { _empty: true } },
                { site_key: { _eq: site } },
              ],
            };
          }
          return { site_key: { _empty: true } };
        };

        const fetchModuleDefinition = async () => {
          const key = moduleKey.value;
          if (!key) {
            moduleDefinition.value = null;
            loadError.value = 'Select a module before configuring props.';
            return;
          }

          let effectiveSiteKey = siteKey.value;
          if (!effectiveSiteKey) {
            const pageId = getPrimaryKeyFromLocation(pageCollection.value);
            if (pageId) {
              try {
                const pageResp = await apiGet(`/items/${pageCollection.value}/${encodeURIComponent(pageId)}`, {
                  fields: pageSiteField.value,
                });
                effectiveSiteKey = asString(pageResp?.data?.[pageSiteField.value]);
              } catch {
                // keep empty; we'll still resolve global module definitions.
              }
            }
          }

          const filter = {
            _and: [
              { [moduleKeyField.value]: { _eq: key } },
              { status: { _eq: 'published' } },
              buildScopedFilter(effectiveSiteKey),
            ],
          };
          const response = await apiGet(`/items/${modulesCollection.value}`, {
            fields: ['id', moduleKeyField.value, 'name', 'description', 'site_key', propsSchemaField.value, defaultPropsField.value].join(','),
            limit: -1,
            sort: 'site_key',
            filter: JSON.stringify(filter),
          });

          const rows = normalizeRows(response);
          if (rows.length === 0) {
            moduleDefinition.value = null;
            loadError.value = `No published module definition found for "${key}".`;
            return;
          }

          const preferred =
            rows.find((row) => asString(row?.site_key) && asString(row?.site_key) === effectiveSiteKey)
            || rows[0];

          moduleDefinition.value = preferred;
          loadError.value = '';

          const resolvedModuleKey = asString(preferred?.[moduleKeyField.value]) || key;
          if (pendingModuleSwitchKey.value && pendingModuleSwitchKey.value === resolvedModuleKey) {
            pendingModuleDefaults.value = normalizeObject(parseJsonLike(preferred?.[defaultPropsField.value], {}));
            applyPendingDefaultsForModuleKey.value = resolvedModuleKey;
            pendingModuleSwitchKey.value = '';
          }
        };

        watch(
          () => JSON.stringify({
            moduleKey: moduleKey.value,
            siteKey: siteKey.value,
            modulesCollection: modulesCollection.value,
            moduleKeyField: moduleKeyField.value,
            propsSchemaField: propsSchemaField.value,
            defaultPropsField: defaultPropsField.value,
          }),
          async () => {
            loading.value = true;
            try {
              await fetchModuleDefinition();
            } catch (error) {
              moduleDefinition.value = null;
              loadError.value = error?.message || 'Failed to load module definition.';
            } finally {
              loading.value = false;
            }
          },
          { immediate: true }
        );

        const resolvedSchema = computed(() => normalizeObject(parseJsonLike(moduleDefinition.value?.[propsSchemaField.value], {})));
        const schemaProperties = computed(() => normalizeObject(resolvedSchema.value?.properties));
        const isComplexPropertySchema = (schemaValue) => {
          const schema = normalizeObject(schemaValue);
          const type = asString(schema?.type).toLowerCase();
          if (type === 'array' || type === 'object') return true;
          if (Array.isArray(schema?.items)) return true;
          if (schema?.items && typeof schema.items === 'object') return true;
          if (schema?.properties && typeof schema.properties === 'object') return true;
          if (schema?.additionalProperties && typeof schema.additionalProperties === 'object') return true;
          return false;
        };
        const schemaRequiredSet = computed(() => {
          const required = Array.isArray(resolvedSchema.value?.required) ? resolvedSchema.value.required : [];
          return new Set(required.map((value) => asString(value)));
        });
        const defaultProps = computed(() => normalizeObject(parseJsonLike(moduleDefinition.value?.[defaultPropsField.value], {})));

        const mergedProps = computed(() => ({ ...defaultProps.value, ...localProps.value }));

        const emitProps = (nextProps) => {
          const normalized = normalizeObject(nextProps);
          localProps.value = { ...normalized };
          jsonEditorValue.value = JSON.stringify(localProps.value, null, 2);
          emit('input', localProps.value);
        };

        const applyJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            emitProps({});
            return;
          }
          try {
            emitProps(normalizeObject(JSON.parse(jsonEditorValue.value)));
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };

        const formatJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            jsonEditorValue.value = '{}';
            emitProps({});
            schemaError.value = '';
            return;
          }
          try {
            const parsed = normalizeObject(JSON.parse(jsonEditorValue.value));
            jsonEditorValue.value = JSON.stringify(parsed, null, 2);
            emitProps(parsed);
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };

        watch(
          () => applyPendingDefaultsForModuleKey.value,
          (nextModuleKey) => {
            if (!nextModuleKey) return;
            emitProps(pendingModuleDefaults.value);
            pendingModuleDefaults.value = {};
            applyPendingDefaultsForModuleKey.value = '';
            schemaError.value = '';
          }
        );

        const onModuleSelectorEvent = (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          const eventMode = asString(detail.mode).toLowerCase();
          const eventField = asString(detail.field).toLowerCase();
          if (eventMode !== 'module') return;
          if (eventField && eventField !== moduleKeyField.value.toLowerCase()) return;

          const eventCollection = asString(detail.collection).toLowerCase();
          if (eventCollection && recordCollectionKey.value && eventCollection !== recordCollectionKey.value) return;

          const eventRecordId = asString(detail.recordId);
          const currentRecordId = resolveRecordId();
          if (eventRecordId && currentRecordId && eventRecordId !== currentRecordId) return;

          const nextKey = asString(detail.value);
          if (!nextKey) return;
          if (nextKey !== moduleKey.value) {
            pendingModuleSwitchKey.value = nextKey;
            moduleKeyOverride.value = nextKey;
          }
        };

        onMounted(() => {
          if (typeof window === 'undefined') return;
          window.addEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });

        onBeforeUnmount(() => {
          if (typeof window === 'undefined') return;
          window.removeEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });

        const setPropertyValue = (key, value) => {
          const next = { ...mergedProps.value };
          if (value === undefined || value === null || value === '') {
            delete next[key];
          } else {
            next[key] = value;
          }
          emitProps(next);
        };

        const renderPropertyEditor = (propKey, propSchema) => {
          const schema = normalizeObject(propSchema);
          const title = asString(schema.title) || propKey;
          const description = asString(schema.description);
          const value = mergedProps.value[propKey];
          const type = asString(schema.type).toLowerCase();
          const isRequired = schemaRequiredSet.value.has(propKey);
          const enumValues = Array.isArray(schema.enum) ? schema.enum.map((entry) => asString(entry)).filter(Boolean) : [];
          const inputId = `cms-module-prop-${propKey}`;

          let control = null;

          if (enumValues.length > 0) {
            control = h(
              'select',
              {
                id: inputId,
                disabled: props.disabled || loading.value,
                value: asInputString(value),
                onChange: (event) => setPropertyValue(propKey, asInputString(event?.target?.value)),
              },
              [
                h('option', { value: '' }, `Select ${title}`),
                ...enumValues.map((entry) => h('option', { value: entry }, entry)),
              ],
            );
          } else if (type === 'boolean') {
            control = h('input', {
              id: inputId,
              type: 'checkbox',
              disabled: props.disabled || loading.value,
              checked: Boolean(value),
              onChange: (event) => setPropertyValue(propKey, Boolean(event?.target?.checked)),
            });
          } else if (type === 'number' || type === 'integer') {
            control = h('input', {
              id: inputId,
              type: 'number',
              disabled: props.disabled || loading.value,
              value: asString(value),
              onInput: (event) => {
                const raw = asString(event?.target?.value);
                if (!raw) {
                  setPropertyValue(propKey, undefined);
                  return;
                }
                const parsed = type === 'integer' ? Number.parseInt(raw, 10) : Number.parseFloat(raw);
                setPropertyValue(propKey, Number.isFinite(parsed) ? parsed : undefined);
              },
            });
          } else if (type === 'array' || type === 'object') {
            control = h('textarea', {
              id: inputId,
              disabled: props.disabled || loading.value,
              rows: 4,
              value: value === undefined ? '' : JSON.stringify(value, null, 2),
              onBlur: (event) => {
                const raw = asString(event?.target?.value);
                if (!raw) {
                  setPropertyValue(propKey, undefined);
                  return;
                }
                try {
                  const parsed = JSON.parse(raw);
                  setPropertyValue(propKey, parsed);
                  schemaError.value = '';
                } catch {
                  schemaError.value = `Invalid JSON for ${title}.`;
                }
              },
            });
          } else {
            control = h('input', {
              id: inputId,
              type: 'text',
              disabled: props.disabled || loading.value,
              value: asInputString(value),
              onInput: (event) => setPropertyValue(propKey, asInputString(event?.target?.value)),
            });
          }

          return h('div', { class: 'cms-module-props-editor__field', key: propKey }, [
            h('label', { for: inputId, class: 'cms-module-props-editor__label' }, [
              title,
              isRequired ? h('span', { class: 'cms-module-props-editor__required' }, ' *') : null,
            ]),
            description ? h('p', { class: 'cms-module-props-editor__hint' }, description) : null,
            control,
          ]);
        };

        return () => {
          const definition = moduleDefinition.value;
          const hasSchemaProperties = Object.keys(schemaProperties.value).length > 0;
          const inlinePropertyEntries = Object.entries(schemaProperties.value).filter(([, propSchema]) => {
            if (!showJsonFallback.value) return true;
            return !isComplexPropertySchema(propSchema);
          });
          const hasInlineProperties = inlinePropertyEntries.length > 0;
          const hasComplexProperties = Object.values(schemaProperties.value).some((propSchema) =>
            isComplexPropertySchema(propSchema)
          );
          const definitionTitle = asString(definition?.name) || moduleKey.value || 'Module';
          const definitionDescription = asString(definition?.description);

          const children = [
            h('div', { class: 'cms-module-props-editor__header' }, [
              h('strong', `Module: ${definitionTitle}`),
              moduleKey.value ? h('code', moduleKey.value) : null,
            ]),
            definitionDescription
              ? h('p', { class: 'cms-module-props-editor__hint' }, definitionDescription)
              : null,
            loading.value ? h('p', { class: 'cms-module-props-editor__hint' }, 'Loading module schema...') : null,
            loadError.value ? h('p', { class: 'cms-module-props-editor__error' }, loadError.value) : null,
            schemaError.value ? h('p', { class: 'cms-module-props-editor__error' }, schemaError.value) : null,
          ];

          if (hasInlineProperties) {
            children.push(
              h(
                'div',
                { class: 'cms-module-props-editor__fields' },
                inlinePropertyEntries.map(([propKey, propSchema]) => renderPropertyEditor(propKey, propSchema))
              )
            );
          } else if (!loading.value && !loadError.value && !hasComplexProperties) {
            children.push(
              h('p', { class: 'cms-module-props-editor__hint' }, 'No property schema defined for this module. Use JSON fallback.')
            );
          }

          if (showJsonFallback.value && hasComplexProperties) {
            children.push(
              h(
                'p',
                { class: 'cms-module-props-editor__hint' },
                'Complex properties (arrays/objects) are edited in Advanced JSON editor below.'
              )
            );
          }

          if (showJsonFallback.value) {
            const resolvedCodeEditor = resolveComponent('v-input-code');
            const resolvedTextarea = resolveComponent('v-textarea');
            const hasCodeEditor = typeof resolvedCodeEditor !== 'string';
            const hasTextarea = typeof resolvedTextarea !== 'string';
            const jsonPlaceholder = '{\n  "key": "value"\n}';

            let jsonControl = null;
            if (hasCodeEditor) {
              jsonControl = h(resolvedCodeEditor, {
                modelValue: jsonEditorValue.value,
                language: 'json',
                lineNumbers: true,
                disabled: props.disabled || loading.value,
                class: 'cms-module-props-editor__json-code',
                style: { minHeight: '340px' },
                'onUpdate:modelValue': (nextValue) => {
                  jsonEditorValue.value = asInputString(nextValue);
                  schemaError.value = '';
                },
                onBlur: applyJsonEditorValue,
              });
            } else if (hasTextarea) {
              jsonControl = h(resolvedTextarea, {
                modelValue: jsonEditorValue.value,
                rows: 14,
                placeholder: jsonPlaceholder,
                disabled: props.disabled || loading.value,
                monospace: true,
                class: 'cms-module-props-editor__json-code',
                style: { minHeight: '340px' },
                'onUpdate:modelValue': (nextValue) => {
                  jsonEditorValue.value = asInputString(nextValue);
                  schemaError.value = '';
                },
                onBlur: applyJsonEditorValue,
              });
            } else {
              jsonControl = h('textarea', {
                rows: 14,
                disabled: props.disabled || loading.value,
                value: jsonEditorValue.value,
                placeholder: jsonPlaceholder,
                class: 'cms-module-props-editor__json-code',
                style: {
                  width: '100%',
                  minHeight: '340px',
                  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace',
                  fontSize: '12px',
                  lineHeight: '1.45',
                  background: 'var(--theme--background-subdued)',
                  border: '1px solid var(--theme--border-normal)',
                  borderRadius: '8px',
                  padding: '12px',
                },
                onInput: (event) => {
                  jsonEditorValue.value = asInputString(event?.target?.value);
                  schemaError.value = '';
                },
                onBlur: applyJsonEditorValue,
              });
            }

            children.push(
              h('section', { class: 'cms-module-props-editor__json' }, [
                h('div', { class: 'cms-module-props-editor__json-header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' } }, [
                  h('strong', 'Advanced JSON editor'),
                  h('button', {
                    type: 'button',
                    disabled: props.disabled || loading.value,
                    onClick: formatJsonEditorValue,
                    style: {
                      border: '1px solid var(--theme--border-normal)',
                      background: 'var(--theme--background-page)',
                      color: 'var(--theme--foreground-normal)',
                      borderRadius: '6px',
                      fontSize: '12px',
                      padding: '4px 8px',
                      cursor: props.disabled || loading.value ? 'not-allowed' : 'pointer',
                    },
                  }, 'Format JSON'),
                ]),
                jsonControl,
                h('p', { class: 'cms-module-props-editor__hint' }, 'Editor is always visible. Changes are validated and saved on blur.'),
              ])
            );
          }

          return h('div', { class: 'cms-module-props-editor' }, children);
        };
      },
    });

    export default defineInterface({
      id: 'cms-module-props-editor',
      name: 'CMS Module Props Editor',
      icon: 'tune',
      description: 'Schema-driven editor for cms_block_module.props_json values.',
      component: InterfaceComponent,
      types: ['json', 'string'],
      group: 'standard',
      options: [
        {
          field: 'modules_collection',
          name: 'Modules Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_modules' },
        },
        {
          field: 'module_key_field',
          name: 'Module Key Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'module_key' },
        },
        {
          field: 'props_schema_field',
          name: 'Props Schema Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'props_schema' },
        },
        {
          field: 'default_props_field',
          name: 'Default Props Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'default_props' },
        },
        {
          field: 'pages_collection',
          name: 'Pages Collection',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'cms_pages' },
        },
        {
          field: 'page_site_field',
          name: 'Page Site Field',
          type: 'string',
          meta: { width: 'half', interface: 'input' },
          schema: { default_value: 'site_key' },
        },
        {
          field: 'include_global',
          name: 'Include Global (site_key null)',
          type: 'boolean',
          meta: { width: 'half', interface: 'boolean' },
          schema: { default_value: true },
        },
        {
          field: 'show_json_fallback',
          name: 'Show JSON Fallback',
          type: 'boolean',
          meta: { width: 'half', interface: 'boolean' },
          schema: { default_value: true },
        },
      ],
    });
---
# Vault Agent Configuration for Directus
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false
    
    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }
    
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }
      
      sink "file" {
        config = {
          path = "/vault/token"
        }
      }
    }
    
    template {
      source      = "/vault-templates/db-creds.tpl"
      destination = "/vault-secrets/db-creds.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/app-keys.tpl"
      destination = "/vault-secrets/app-keys.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/openai.tpl"
      destination = "/vault-secrets/openai.env"
      perms       = 0644
    }
    

    
    template {
      source      = "/vault-templates/redis-creds.tpl"
      destination = "/vault-secrets/redis-creds.env"
      perms       = 0644
    }
  
  db-creds.tpl: |
    {{ with secret "yugabyte-db/static-creds/directus-app" -}}
    export DB_USER="{{ .Data.username }}"
    export DB_PASSWORD="{{ .Data.password }}"
    {{- end }}
  
  app-keys.tpl: |
    {{ with secret "secret/data/directus/keys" -}}
    export KEY="{{ .Data.data.key }}"
    export SECRET="{{ .Data.data.secret }}"
    {{- end }}
  
  openai.tpl: |
    {{ with secret "secret/data/open_ai_key" -}}
    export OPENAI_API_KEY="{{ .Data.data.value }}"
    {{- end }}
  

  
  redis-creds.tpl: |
    {{ with secret "secret/data/redis" -}}
    export REDIS_PASSWORD="{{ .Data.data.password }}"
    {{- end }}
---
# PersistentVolumeClaim for Directus uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads
  namespace: directus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-client
