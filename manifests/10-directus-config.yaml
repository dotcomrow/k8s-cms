  cms-asset-url-picker.package.json: |
    {
      "name": "directus-extension-cms-asset-url-picker",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "interface",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }
  cms-asset-url-picker.index.js: |
    import { defineInterface } from '@directus/extensions-sdk';
    import { defineComponent, h, ref, computed, watch, resolveComponent } from 'vue';

    const asString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    };

    const asInteger = (value, fallback) => {
      const parsed = Number.parseInt(asString(value), 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    };

    const parseOptions = (value) => {
      if (!value) return {};
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return typeof value === 'object' ? value : {};
    };

    const normalizeRows = (response) => {
      const payload = response?.data;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload)) return payload;
      return [];
    };

    const defaultAssetPath = '/assets';

    const InterfaceComponent = defineComponent({
      name: 'CmsAssetUrlPicker',
      props: {
        value: { type: [String, Number, Object, null], default: null },
        disabled: { type: Boolean, default: false },
        options: { type: Object, default: () => ({}) },
      },
      emits: ['input'],
      setup(props, { emit }) {
        const pickerOpen = ref(false);
        const loading = ref(false);
        const uploading = ref(false);
        const error = ref('');
        const query = ref('');
        const files = ref([]);
        const hiddenFileInput = ref(null);

        const resolvedOptions = computed(() => parseOptions(props.options));
        const storeAbsoluteUrl = computed(() => {
          const raw = asString(resolvedOptions.value?.store_absolute_url).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const assetPath = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_path);
          return configured ? (configured.startsWith('/') ? configured : `/${configured}`) : defaultAssetPath;
        });
        const assetBaseUrl = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_base_url);
          if (configured) return configured.replace(/\/+$/, '');
          if (typeof window !== 'undefined' && window.location?.origin) {
            return window.location.origin.replace(/\/+$/, '');
          }
          return '';
        });
        const accept = computed(() => asString(resolvedOptions.value?.accept) || 'image/*');
        const limit = computed(() => asInteger(resolvedOptions.value?.limit, 40));
        const showPreview = computed(() => {
          const raw = asString(resolvedOptions.value?.show_preview).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const showUpload = computed(() => {
          const raw = asString(resolvedOptions.value?.show_upload).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const showLibrary = computed(() => {
          const raw = asString(resolvedOptions.value?.show_library).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const storeFileId = computed(() => {
          const raw = asString(resolvedOptions.value?.store_file_id).toLowerCase();
          if (['1', 'true', 'yes', 'on'].includes(raw)) return true;
          return false;
        });

        const currentValue = computed(() => {
          if (props.value && typeof props.value === 'object') {
            if ('id' in props.value) return asString(props.value.id);
            return '';
          }
          return props.value === null || props.value === undefined ? '' : String(props.value);
        });

        const extractAssetIdFromValue = (value) => {
          const raw = asString(value);
          if (!raw) return '';
          const pathStyle = raw.match(/\/assets\/([0-9a-fA-F-]{36})(?:[/?#]|$)/);
          if (pathStyle?.[1]) return asString(pathStyle[1]);
          if (/^[0-9a-fA-F-]{36}$/.test(raw)) return raw;
          return '';
        };

        const resolveAssetUrlFromId = (id) => {
          const normalizedId = asString(id);
          if (!normalizedId) return '';
          const relative = `${assetPath.value.replace(/\/+$/, '')}/${encodeURIComponent(normalizedId)}`;
          if (!storeAbsoluteUrl.value) return relative;
          return assetBaseUrl.value ? `${assetBaseUrl.value}${relative}` : relative;
        };

        const toStoredValue = (fileId) => {
          const normalizedId = asString(fileId);
          if (!normalizedId) return '';
          if (storeFileId.value) return normalizedId;
          return resolveAssetUrlFromId(normalizedId);
        };

        const previewSource = computed(() => {
          const raw = currentValue.value;
          if (!raw) return '';
          if (storeFileId.value) {
            const id = extractAssetIdFromValue(raw);
            return id ? resolveAssetUrlFromId(id) : '';
          }
          return raw;
        });

        const apiRequest = async (method, path, queryParams = null, body = null, isFormData = false) => {
          const url = new URL(path, window.location.origin);
          if (queryParams && typeof queryParams === 'object') {
            Object.entries(queryParams).forEach(([key, value]) => {
              if (value === null || value === undefined || value === '') return;
              url.searchParams.set(key, String(value));
            });
          }

          const headers = { Accept: 'application/json' };
          if (!isFormData && body !== null) headers['Content-Type'] = 'application/json';

          const response = await fetch(url.toString(), {
            method,
            credentials: 'same-origin',
            cache: 'no-store',
            headers,
            body: body === null ? null : isFormData ? body : JSON.stringify(body),
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload?.errors?.[0]?.message || `${method} ${path} failed (${response.status})`);
          }
          return payload;
        };

        const loadFiles = async () => {
          loading.value = true;
          error.value = '';
          try {
            const response = await apiRequest('GET', '/files', {
              fields: 'id,title,filename_download,type,width,height',
              limit: limit.value,
              sort: '-uploaded_on',
              search: asString(query.value) || undefined,
            });
            files.value = normalizeRows(response);
          } catch (requestError) {
            files.value = [];
            error.value = requestError?.message || 'Failed to load files.';
          } finally {
            loading.value = false;
          }
        };

        const selectFile = (row) => {
          const fileId = asString(row?.id);
          if (!fileId) return;
          emit('input', toStoredValue(fileId));
          pickerOpen.value = false;
        };

        const openUploadChooser = () => {
          const input = hiddenFileInput.value;
          if (!input || props.disabled) return;
          input.click();
        };

        const onUploadChange = async (event) => {
          const file = event?.target?.files?.[0];
          if (!file) return;
          uploading.value = true;
          error.value = '';
          try {
            const form = new FormData();
            form.append('file', file);
            const response = await apiRequest('POST', '/files', null, form, true);
            const fileId = asString(response?.data?.id);
            if (!fileId) throw new Error('Upload succeeded but file id was missing.');
            emit('input', toStoredValue(fileId));
            pickerOpen.value = false;
            await loadFiles();
          } catch (uploadError) {
            error.value = uploadError?.message || 'Failed to upload file.';
          } finally {
            uploading.value = false;
            if (event?.target) event.target.value = '';
          }
        };

        watch(
          () => pickerOpen.value,
          async (isOpen) => {
            if (isOpen) await loadFiles();
          },
        );

        return () => {
          const resolvedInput = resolveComponent('v-input');
          const resolvedButton = resolveComponent('v-button');
          const resolvedNotice = resolveComponent('v-notice');

          const hasInput = typeof resolvedInput !== 'string';
          const hasButton = typeof resolvedButton !== 'string';
          const hasNotice = typeof resolvedNotice !== 'string';

          const renderInput = ({ value, placeholder, disabled = false, type = 'text', onUpdate }) => {
            if (hasInput) {
              return h(resolvedInput, {
                modelValue: value ?? '',
                placeholder,
                disabled,
                type,
                'onUpdate:modelValue': (next) => onUpdate(next ?? ''),
              });
            }
            return h('input', {
              type,
              value: value ?? '',
              placeholder,
              disabled,
              onInput: (event) => onUpdate(event?.target?.value || ''),
            });
          };

          const renderButton = ({ label, onClick, disabled = false, primary = false, style = {} }) => {
            if (hasButton) {
              return h(
                resolvedButton,
                {
                  disabled,
                  secondary: !primary,
                  small: true,
                  onClick,
                  style,
                },
                () => label,
              );
            }
            return h('button', { type: 'button', disabled, onClick, style }, label);
          };

          const renderError = error.value
            ? (hasNotice
              ? h(resolvedNotice, { type: 'danger' }, () => error.value)
              : h('p', { style: { margin: 0, color: 'var(--theme--danger)' } }, error.value))
            : null;

          return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } }, [
            renderInput({
              type: 'text',
              value: currentValue.value,
              disabled: props.disabled,
              placeholder: storeFileId.value ? '<file-id> or /assets/<file-id>' : 'https://... or /assets/<file-id>',
              onUpdate: (next) => {
                const normalized = asString(next);
                if (storeFileId.value) {
                  const extractedId = extractAssetIdFromValue(normalized);
                  emit('input', extractedId || normalized);
                  return;
                }
                emit('input', normalized);
              },
            }),
            h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } }, [
              showLibrary.value
                ? renderButton({
                    label: pickerOpen.value ? 'Close Library' : 'Browse Files',
                    disabled: props.disabled,
                    onClick: () => { pickerOpen.value = !pickerOpen.value; },
                  })
                : null,
              showUpload.value
                ? renderButton({
                    label: uploading.value ? 'Uploading...' : 'Upload File',
                    disabled: props.disabled || uploading.value,
                    onClick: openUploadChooser,
                  })
                : null,
              renderButton({
                label: 'Clear',
                disabled: props.disabled || !currentValue.value,
                onClick: () => emit('input', ''),
              }),
            ]),
            showPreview.value && previewSource.value ? h('div', { style: { maxWidth: '220px' } }, [
              h('img', {
                src: previewSource.value,
                alt: 'Selected asset preview',
                style: { width: '100%', height: 'auto', borderRadius: '8px', border: '1px solid var(--theme--border-subdued)' },
              }),
            ]) : null,
            pickerOpen.value ? h('section', {
              style: {
                border: '1px solid var(--theme--border-subdued)',
                borderRadius: '8px',
                padding: '10px',
                background: 'var(--theme--background-subdued)',
                display: 'flex',
                flexDirection: 'column',
                gap: '8px',
                maxHeight: '320px',
                overflow: 'auto',
              },
            }, [
              h('div', { style: { display: 'flex', gap: '8px' } }, [
                h('div', { style: { flex: '1 1 auto' } }, [
                  renderInput({
                    type: 'search',
                    value: query.value,
                    placeholder: 'Search files',
                    onUpdate: (next) => { query.value = next; },
                  }),
                ]),
                renderButton({
                  label: loading.value ? 'Loading...' : 'Search',
                  disabled: loading.value,
                  onClick: () => { void loadFiles(); },
                }),
              ]),
              renderError,
              ...files.value.map((row) => renderButton({
                label: `${asString(row?.title) || asString(row?.filename_download) || asString(row?.id)}`,
                disabled: props.disabled,
                onClick: () => selectFile(row),
                style: {
                  justifyContent: 'flex-start',
                  width: '100%',
                  textAlign: 'left',
                },
              })),
            ]) : null,
            h('input', {
              ref: hiddenFileInput,
              type: 'file',
              accept: accept.value,
              style: { display: 'none' },
              onChange: onUploadChange,
            }),
          ]);
        };
      },
    });

    export default defineInterface({
      id: 'cms-asset-url-picker',
      name: 'CMS Asset URL Picker',
      icon: 'image',
      description: 'Pick/upload Directus Files and store URL value for shell rendering.',
      component: InterfaceComponent,
      types: ['string', 'text', 'uuid'],
      group: 'selection',
      options: [
        { field: 'asset_base_url', name: 'Asset Base URL', type: 'string', meta: { width: 'half', interface: 'input' }, schema: { default_value: '' } },
        { field: 'asset_path', name: 'Asset Path', type: 'string', meta: { width: 'half', interface: 'input' }, schema: { default_value: '/assets' } },
        { field: 'store_absolute_url', name: 'Store Absolute URL', type: 'boolean', meta: { width: 'half', interface: 'boolean' }, schema: { default_value: true } },
        { field: 'store_file_id', name: 'Store File ID (UUID)', type: 'boolean', meta: { width: 'half', interface: 'boolean' }, schema: { default_value: false } },
        { field: 'accept', name: 'Upload Accept', type: 'string', meta: { width: 'half', interface: 'input' }, schema: { default_value: 'image/*' } },
        { field: 'show_preview', name: 'Show Preview', type: 'boolean', meta: { width: 'half', interface: 'boolean' }, schema: { default_value: true } },
        { field: 'show_upload', name: 'Show Upload', type: 'boolean', meta: { width: 'half', interface: 'boolean' }, schema: { default_value: true } },
        { field: 'show_library', name: 'Show Library', type: 'boolean', meta: { width: 'half', interface: 'boolean' }, schema: { default_value: true } },
        { field: 'limit', name: 'Library Limit', type: 'integer', meta: { width: 'half', interface: 'input' }, schema: { default_value: 40 } },
      ],
    });

  cms-module-props-editor.package.json: |
    {
      "name": "directus-extension-cms-module-props-editor",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "interface",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }
  cms-module-props-editor.index.js: |
    import { defineInterface } from '@directus/extensions-sdk';
    import { defineComponent, h, ref, computed, watch, onMounted, onBeforeUnmount, resolveComponent } from 'vue';

    const asString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    };

    const asInputString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value);
    };

    const asInteger = (value, fallback) => {
      const parsed = Number.parseInt(asString(value), 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    };

    const parseJsonLike = (value, fallback) => {
      if (value === null || value === undefined) return fallback;
      if (typeof value === 'string') {
        try {
          return JSON.parse(value);
        } catch {
          return fallback;
        }
      }
      return value;
    };

    const normalizeObject = (value) => {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
      return value;
    };

    const normalizeRows = (response) => {
      const payload = response?.data;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload)) return payload;
      return [];
    };

    const parseId = (value) => {
      if (value && typeof value === 'object') {
        if ('id' in value) return asString(value.id);
        if ('primaryKey' in value) return asString(value.primaryKey);
      }
      return asString(value);
    };

    const parseOptions = (value) => {
      if (!value) return {};
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return typeof value === 'object' ? value : {};
    };

    const normalizeProviderList = (value) => {
      if (Array.isArray(value)) {
        return Array.from(
          new Set(
            value
              .map((entry) => asString(entry).toLowerCase())
              .filter(Boolean),
          ),
        );
      }
      const raw = asString(value).toLowerCase();
      if (!raw) return [];
      return Array.from(
        new Set(
          raw
            .split(',')
            .map((entry) => asString(entry).toLowerCase())
            .filter(Boolean),
        ),
      );
    };

    const escapeRegex = (value) => String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const getPrimaryKeyFromLocation = (collectionName) => {
      if (typeof window === 'undefined') return '';
      const targetCollection = asString(collectionName);
      const path = asString(window.location?.pathname);
      if (targetCollection && path) {
        const match = path.match(new RegExp(`/${escapeRegex(targetCollection)}/([^/?#]+)`));
        if (match?.[1]) return asString(decodeURIComponent(match[1]));
      }
      const query = new URLSearchParams(window.location?.search || '');
      const candidates = ['primaryKey', 'pk', 'item', 'id'].map((key) => asString(query.get(key)));
      return candidates.find((value) => Boolean(value)) || '';
    };

    const InterfaceComponent = defineComponent({
      name: 'CmsModulePropsEditor',
      props: {
        value: { type: [Object, String, null], default: null },
        disabled: { type: Boolean, default: false },
        options: { type: Object, default: () => ({}) },
        values: { type: Object, default: () => ({}) },
        field: { type: String, default: '' },
        collection: { type: String, default: '' },
      },
      emits: ['input'],
      setup(props, { emit }) {
        const loading = ref(false);
        const loadError = ref('');
        const schemaError = ref('');
        const moduleDefinition = ref(null);
        const localProps = ref({});
        const jsonEditorValue = ref('{}');
        const pendingModuleSwitchKey = ref('');
        const pendingModuleDefaults = ref({});
        const applyPendingDefaultsForModuleKey = ref('');
        const moduleKeyOverride = ref('');
        const assetPickerField = ref('');
        const assetPickerQuery = ref('');
        const assetPickerRows = ref([]);
        const assetPickerLoading = ref(false);
        const assetPickerError = ref('');
        const assetPickerUploading = ref(false);
        const assetUploadInput = ref(null);

        const resolvedOptions = computed(() => parseOptions(props.options));
        const modulesCollection = computed(() => asString(resolvedOptions.value?.modules_collection) || 'cms_modules');
        const moduleKeyField = computed(() => asString(resolvedOptions.value?.module_key_field) || 'module_key');
        const moduleProviderField = computed(() => asString(resolvedOptions.value?.module_provider_field) || 'module_provider');
        const propsSchemaField = computed(() => asString(resolvedOptions.value?.props_schema_field) || 'props_schema');
        const defaultPropsField = computed(() => asString(resolvedOptions.value?.default_props_field) || 'default_props');
        const pageSiteField = computed(() => asString(resolvedOptions.value?.page_site_field) || 'site_key');
        const staticModuleProviders = computed(() => {
          const fromList = normalizeProviderList(resolvedOptions.value?.module_provider_in);
          if (fromList.length > 0) return fromList;
          return normalizeProviderList(resolvedOptions.value?.module_provider);
        });
        const dynamicModuleProviders = computed(() => normalizeProviderList(props.values?.[moduleProviderField.value]));
        const effectiveModuleProviders = computed(() => {
          if (dynamicModuleProviders.value.length > 0) return dynamicModuleProviders.value;
          return staticModuleProviders.value;
        });
        const includeGlobal = computed(() => {
          const v = resolvedOptions.value?.include_global;
          if (typeof v === 'string') return v.toLowerCase() !== 'false';
          return v !== false;
        });
        const showJsonFallback = computed(() => {
          const v = resolvedOptions.value?.show_json_fallback;
          if (typeof v === 'string') return v.toLowerCase() !== 'false';
          return v !== false;
        });
        const pageCollection = computed(() => asString(resolvedOptions.value?.pages_collection) || 'cms_pages');
        const assetPath = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_path);
          return configured ? (configured.startsWith('/') ? configured : `/${configured}`) : '/assets';
        });
        const assetBaseUrl = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_base_url);
          if (configured) return configured.replace(/\/+$/, '');
          if (typeof window !== 'undefined' && window.location?.origin) {
            return window.location.origin.replace(/\/+$/, '');
          }
          return '';
        });
        const assetStoreAbsolute = computed(() => {
          const raw = asString(resolvedOptions.value?.asset_store_absolute).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const assetPickerLimit = computed(() => asInteger(resolvedOptions.value?.asset_picker_limit, 40));
        const assetPickerAccept = computed(() => asString(resolvedOptions.value?.asset_picker_accept) || 'image/*');
        const assetPickerKeys = computed(() => {
          const raw = resolvedOptions.value?.asset_picker_keys;
          if (!Array.isArray(raw)) return [];
          return raw.map((entry) => asString(entry).toLowerCase()).filter(Boolean);
        });
        const assetFieldPattern = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_field_pattern);
          return configured || '(image|icon|logo|avatar|thumbnail|sprite|background|poster|favicon|hero)';
        });

        const moduleKeyFromValues = computed(() => asString(props.values?.[moduleKeyField.value] ?? props.values?.module_key));
        const moduleKey = computed(() => asString(moduleKeyOverride.value) || moduleKeyFromValues.value);
        const siteKey = computed(() => asString(props.values?.[pageSiteField.value] ?? props.values?.site_key));
        const recordCollectionKey = computed(() => asString(props.collection).toLowerCase());
        const resolveRecordId = () => {
          const fromValues = parseId(props.values?.id);
          if (fromValues) return fromValues;
          const fromLocation = getPrimaryKeyFromLocation(asString(props.collection));
          return asString(fromLocation);
        };

        const incomingProps = computed(() => normalizeObject(parseJsonLike(props.value, {})));

        watch(
          () => JSON.stringify(incomingProps.value),
          () => {
            localProps.value = { ...incomingProps.value };
            jsonEditorValue.value = JSON.stringify(localProps.value, null, 2);
            schemaError.value = '';
          },
          { immediate: true }
        );

        watch(
          () => moduleKey.value,
          (nextValue, previousValue) => {
            const nextKey = asString(nextValue);
            const previousKey = asString(previousValue);
            if (nextKey && previousKey && nextKey !== previousKey) {
              pendingModuleSwitchKey.value = nextKey;
            }
            if (!nextKey) {
              pendingModuleSwitchKey.value = '';
              pendingModuleDefaults.value = {};
              applyPendingDefaultsForModuleKey.value = '';
            }
          }
        );

        watch(
          () => moduleKeyFromValues.value,
          (nextValue) => {
            const nextKey = asString(nextValue);
            if (moduleKeyOverride.value && nextKey && nextKey === moduleKeyOverride.value) {
              moduleKeyOverride.value = '';
            }
          },
        );

        const apiGet = async (path, params = {}) => {
          const url = new URL(path, window.location.origin);
          Object.entries(params).forEach(([key, value]) => {
            if (value === null || value === undefined) return;
            url.searchParams.set(key, String(value));
          });

          const response = await fetch(url.toString(), {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          });

          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            const message = payload?.errors?.[0]?.message || `Request failed (${response.status})`;
            throw new Error(message);
          }
          return payload;
        };

        const isAssetLikeProperty = (propKey, schema) => {
          const key = asString(propKey).toLowerCase();
          if (!key) return false;

          if (assetPickerKeys.value.includes(key)) {
            return true;
          }

          const schemaFormat = asString(schema?.format).toLowerCase();
          const schemaType = asString(schema?.type).toLowerCase();
          if (schemaFormat === 'image' || schemaFormat === 'asset-url') {
            return true;
          }
          if (schemaType === 'string' && schemaFormat === 'uri') {
            return /(image|icon|logo|avatar|thumbnail|sprite|background|poster|favicon)/i.test(key);
          }

          try {
            return new RegExp(assetFieldPattern.value, 'i').test(key);
          } catch {
            return /(image|icon|logo|avatar|thumbnail|sprite|background|poster|favicon)/i.test(key);
          }
        };

        const resolveAssetUrlFromId = (id) => {
          const normalizedId = asString(id);
          if (!normalizedId) return '';
          const relative = `${assetPath.value.replace(/\/+$/, '')}/${encodeURIComponent(normalizedId)}`;
          if (!assetStoreAbsolute.value) return relative;
          return assetBaseUrl.value ? `${assetBaseUrl.value}${relative}` : relative;
        };

        const loadAssetPickerFiles = async () => {
          assetPickerLoading.value = true;
          assetPickerError.value = '';
          try {
            const response = await apiGet('/files', {
              fields: 'id,title,filename_download,type,width,height',
              limit: assetPickerLimit.value,
              sort: '-uploaded_on',
              search: asString(assetPickerQuery.value) || undefined,
            });
            assetPickerRows.value = normalizeRows(response);
          } catch (error) {
            assetPickerRows.value = [];
            assetPickerError.value = error?.message || 'Failed to load files.';
          } finally {
            assetPickerLoading.value = false;
          }
        };

        const toggleAssetPicker = async (propKey) => {
          const key = asString(propKey);
          if (!key) return;
          if (assetPickerField.value === key) {
            assetPickerField.value = '';
            return;
          }
          assetPickerField.value = key;
          assetPickerQuery.value = '';
          await loadAssetPickerFiles();
        };

        const chooseAsset = (propKey, row) => {
          const key = asString(propKey);
          if (!key) return;
          const url = resolveAssetUrlFromId(row?.id);
          if (!url) return;
          setPropertyValue(key, url);
          assetPickerField.value = '';
        };

        const openAssetUploadChooser = (propKey) => {
          const input = assetUploadInput.value;
          if (!input || props.disabled || loading.value) return;
          input.dataset.field = asString(propKey);
          input.click();
        };

        const onAssetUploadChange = async (event) => {
          const input = event?.target;
          const file = input?.files?.[0];
          const propKey = asString(input?.dataset?.field || assetPickerField.value);
          if (!file || !propKey) return;

          assetPickerUploading.value = true;
          assetPickerError.value = '';
          try {
            const form = new FormData();
            form.append('file', file);
            const response = await fetch('/files', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { Accept: 'application/json' },
              body: form,
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              const message = payload?.errors?.[0]?.message || `Upload failed (${response.status})`;
              throw new Error(message);
            }
            const fileId = asString(payload?.data?.id);
            if (!fileId) {
              throw new Error('Upload succeeded but no file id was returned.');
            }
            setPropertyValue(propKey, resolveAssetUrlFromId(fileId));
            assetPickerField.value = propKey;
            await loadAssetPickerFiles();
          } catch (error) {
            assetPickerError.value = error?.message || 'Failed to upload file.';
          } finally {
            assetPickerUploading.value = false;
            if (input) {
              input.value = '';
              input.dataset.field = '';
            }
          }
        };

        const buildScopedFilter = (site) => {
          if (!includeGlobal.value && site) {
            return { site_key: { _eq: site } };
          }
          if (site) {
            return {
              _or: [
                { site_key: { _empty: true } },
                { site_key: { _eq: site } },
              ],
            };
          }
          return { site_key: { _empty: true } };
        };

        const fetchModuleDefinition = async () => {
          const key = moduleKey.value;
          if (!key) {
            moduleDefinition.value = null;
            loadError.value = 'Select a module before configuring props.';
            return;
          }

          let effectiveSiteKey = siteKey.value;
          if (!effectiveSiteKey) {
            const pageId = getPrimaryKeyFromLocation(pageCollection.value);
            if (pageId) {
              try {
                const pageResp = await apiGet(`/items/${pageCollection.value}/${encodeURIComponent(pageId)}`, {
                  fields: pageSiteField.value,
                });
                effectiveSiteKey = asString(pageResp?.data?.[pageSiteField.value]);
              } catch {
                // keep empty; we'll still resolve global module definitions.
              }
            }
          }

          const filter = {
            _and: [
              { [moduleKeyField.value]: { _eq: key } },
              { status: { _eq: 'published' } },
              ...(effectiveModuleProviders.value.length === 1
                ? [{ provider: { _eq: effectiveModuleProviders.value[0] } }]
                : effectiveModuleProviders.value.length > 1
                  ? [{ provider: { _in: effectiveModuleProviders.value } }]
                  : []),
              buildScopedFilter(effectiveSiteKey),
            ],
          };
          const response = await apiGet(`/items/${modulesCollection.value}`, {
            fields: ['id', moduleKeyField.value, 'provider', 'name', 'description', 'site_key', propsSchemaField.value, defaultPropsField.value].join(','),
            limit: -1,
            sort: 'site_key',
            filter: JSON.stringify(filter),
          });

          const rows = normalizeRows(response);
          if (rows.length === 0) {
            moduleDefinition.value = null;
            loadError.value = effectiveModuleProviders.value.length > 0
              ? `No published module definition found for "${key}" with provider "${effectiveModuleProviders.value.join(',')}".`
              : `No published module definition found for "${key}".`;
            return;
          }

          const preferred =
            rows.find((row) => asString(row?.site_key) && asString(row?.site_key) === effectiveSiteKey)
            || rows[0];

          moduleDefinition.value = preferred;
          loadError.value = '';

          const resolvedModuleKey = asString(preferred?.[moduleKeyField.value]) || key;
          if (pendingModuleSwitchKey.value && pendingModuleSwitchKey.value === resolvedModuleKey) {
            pendingModuleDefaults.value = normalizeObject(parseJsonLike(preferred?.[defaultPropsField.value], {}));
            applyPendingDefaultsForModuleKey.value = resolvedModuleKey;
            pendingModuleSwitchKey.value = '';
          }
        };

        watch(
          () => JSON.stringify({
            moduleKey: moduleKey.value,
            moduleProviderField: moduleProviderField.value,
            moduleProvider: asString(props.values?.[moduleProviderField.value]),
            staticModuleProviders: staticModuleProviders.value.join(','),
            siteKey: siteKey.value,
            modulesCollection: modulesCollection.value,
            moduleKeyField: moduleKeyField.value,
            propsSchemaField: propsSchemaField.value,
            defaultPropsField: defaultPropsField.value,
          }),
          async () => {
            loading.value = true;
            try {
              await fetchModuleDefinition();
            } catch (error) {
              moduleDefinition.value = null;
              loadError.value = error?.message || 'Failed to load module definition.';
            } finally {
              loading.value = false;
            }
          },
          { immediate: true }
        );

        const resolvedSchema = computed(() => normalizeObject(parseJsonLike(moduleDefinition.value?.[propsSchemaField.value], {})));
        const schemaProperties = computed(() => normalizeObject(resolvedSchema.value?.properties));
        const isComplexPropertySchema = (schemaValue) => {
          const schema = normalizeObject(schemaValue);
          const type = asString(schema?.type).toLowerCase();
          if (type === 'array' || type === 'object') return true;
          if (Array.isArray(schema?.items)) return true;
          if (schema?.items && typeof schema.items === 'object') return true;
          if (schema?.properties && typeof schema.properties === 'object') return true;
          if (schema?.additionalProperties && typeof schema.additionalProperties === 'object') return true;
          return false;
        };
        const schemaRequiredSet = computed(() => {
          const required = Array.isArray(resolvedSchema.value?.required) ? resolvedSchema.value.required : [];
          return new Set(required.map((value) => asString(value)));
        });
        const defaultProps = computed(() => normalizeObject(parseJsonLike(moduleDefinition.value?.[defaultPropsField.value], {})));

        const mergedProps = computed(() => ({ ...defaultProps.value, ...localProps.value }));

        const emitProps = (nextProps) => {
          const normalized = normalizeObject(nextProps);
          localProps.value = { ...normalized };
          jsonEditorValue.value = JSON.stringify(localProps.value, null, 2);
          emit('input', localProps.value);
        };

        const applyJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            emitProps({});
            return;
          }
          try {
            emitProps(normalizeObject(JSON.parse(jsonEditorValue.value)));
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };

        const formatJsonEditorValue = () => {
          if (!jsonEditorValue.value) {
            jsonEditorValue.value = '{}';
            emitProps({});
            schemaError.value = '';
            return;
          }
          try {
            const parsed = normalizeObject(JSON.parse(jsonEditorValue.value));
            jsonEditorValue.value = JSON.stringify(parsed, null, 2);
            emitProps(parsed);
            schemaError.value = '';
          } catch {
            schemaError.value = 'Invalid JSON in advanced editor.';
          }
        };

        watch(
          () => applyPendingDefaultsForModuleKey.value,
          (nextModuleKey) => {
            if (!nextModuleKey) return;
            emitProps(pendingModuleDefaults.value);
            pendingModuleDefaults.value = {};
            applyPendingDefaultsForModuleKey.value = '';
            schemaError.value = '';
          }
        );

        const onModuleSelectorEvent = (event) => {
          const detail = event?.detail && typeof event.detail === 'object' ? event.detail : {};
          const eventMode = asString(detail.mode).toLowerCase();
          const eventField = asString(detail.field).toLowerCase();
          if (eventMode !== 'module') return;
          if (eventField && eventField !== moduleKeyField.value.toLowerCase()) return;

          const eventCollection = asString(detail.collection).toLowerCase();
          if (eventCollection && recordCollectionKey.value && eventCollection !== recordCollectionKey.value) return;

          const eventRecordId = asString(detail.recordId);
          const currentRecordId = resolveRecordId();
          if (eventRecordId && currentRecordId && eventRecordId !== currentRecordId) return;

          const nextKey = asString(detail.value);
          if (!nextKey) return;
          if (nextKey !== moduleKey.value) {
            pendingModuleSwitchKey.value = nextKey;
            moduleKeyOverride.value = nextKey;
          }
        };

        onMounted(() => {
          if (typeof window === 'undefined') return;
          window.addEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });

        onBeforeUnmount(() => {
          if (typeof window === 'undefined') return;
          window.removeEventListener('cms-content-model-select-change', onModuleSelectorEvent);
        });

        const setPropertyValue = (key, value) => {
          const next = { ...mergedProps.value };
          if (value === undefined || value === null || value === '') {
            delete next[key];
          } else {
            next[key] = value;
          }
          emitProps(next);
        };

        const renderPropertyEditor = (propKey, propSchema) => {
          const schema = normalizeObject(propSchema);
          const title = asString(schema.title) || propKey;
          const description = asString(schema.description);
          const value = mergedProps.value[propKey];
          const type = asString(schema.type).toLowerCase();
          const isRequired = schemaRequiredSet.value.has(propKey);
          const enumValues = Array.isArray(schema.enum) ? schema.enum.map((entry) => asString(entry)).filter(Boolean) : [];
          const inputId = `cms-module-prop-${propKey}`;

          let control = null;

          if (enumValues.length > 0) {
            control = h(
              'select',
              {
                id: inputId,
                disabled: props.disabled || loading.value,
                value: asInputString(value),
                onChange: (event) => setPropertyValue(propKey, asInputString(event?.target?.value)),
              },
              [
                h('option', { value: '' }, `Select ${title}`),
                ...enumValues.map((entry) => h('option', { value: entry }, entry)),
              ],
            );
          } else if (type === 'boolean') {
            control = h('input', {
              id: inputId,
              type: 'checkbox',
              disabled: props.disabled || loading.value,
              checked: Boolean(value),
              onChange: (event) => setPropertyValue(propKey, Boolean(event?.target?.checked)),
            });
          } else if (type === 'number' || type === 'integer') {
            control = h('input', {
              id: inputId,
              type: 'number',
              disabled: props.disabled || loading.value,
              value: asString(value),
              onInput: (event) => {
                const raw = asString(event?.target?.value);
                if (!raw) {
