          if (drawerRefreshTimer) {
            clearTimeout(drawerRefreshTimer);
            drawerRefreshTimer = null;
          }
          if (!pageId.value) return;
          drawerRefreshTimer = setTimeout(() => {
            drawerRefreshTimer = null;
            if (!drawerActive.value && pageId.value) {
              void refreshAll();
            }
          }, 1200);
        };

        const handleDrawerInput = async (edits) => {
          const collection = asString(drawerCollection.value);
          const primaryKey = parseId(drawerPrimaryKey.value);
          if (!collection || !primaryKey || primaryKey === '+') return;
          if (!edits || typeof edits !== 'object') return;
          const sanitizedPatch = sanitizeDrawerPatchPayload(edits);
          if (Object.keys(sanitizedPatch).length === 0) return;
          drawerPendingPatch.value = sanitizedPatch;

          try {
            const response = await apiRequest(
              'PATCH',
              `/items/${collection}/${encodeURIComponent(primaryKey)}`,
              {},
              sanitizedPatch,
            );

            const updatedRow = response?.data || null;
            drawerSavedByInput.value = true;
            drawerPendingPatch.value = {};

            if (collection === asString(pageBlocksCollection.value) && updatedRow) {
              const normalizedUpdated = normalizeBlockRow(updatedRow);
              blocks.value = blocks.value.map((candidate) => (
                candidate.id === normalizedUpdated.id ? normalizedUpdated : candidate
              ));
              setDraft(normalizedUpdated.id, {
                slot: normalizedUpdated.slot,
                sort: normalizedUpdated.sort,
                group_tag: normalizedUpdated.group_tag,
