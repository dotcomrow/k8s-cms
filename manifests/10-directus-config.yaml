          } finally {
            creatingBlockType.value = '';
          }
        };
    
        const siteScopeFilterFor = (siteKey) => {
          const normalized = asString(siteKey);
          if (normalized) {
            return { site_key: { _eq: normalized } };
          }
          return {
            _or: [
              { site_key: { _null: true } },
              { site_key: { _eq: '' } },
            ],
          };
        };
    
        const sanitizeClonePayload = (value, { blockedKeys = [], force = {} } = {}) => {
          if (!value || typeof value !== 'object' || Array.isArray(value)) return { ...force };
          const blocked = new Set([
            'id',
            'date_created',
            'date_updated',
            'user_created',
            'user_updated',
            '__typename',
            ...blockedKeys.map((entry) => asString(entry)),
          ]);
          const payload = {};
          for (const [rawKey, rawValue] of Object.entries(value)) {
            const key = asString(rawKey);
            if (!key || blocked.has(key) || key.startsWith('$') || key.startsWith('_')) continue;
            if (rawValue === undefined) continue;
            payload[key] = rawValue;
          }
          return {
            ...payload,
            ...force,
          };
        };
    
        const isNotFoundError = (message) => {
