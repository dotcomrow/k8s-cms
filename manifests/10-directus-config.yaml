          return (
            normalized.includes('mismatched_schema')
            || normalized.includes('catalog snapshot')
            || normalized.includes('catalog version mismatch')
            || normalized.includes('invalidated')
          );
        };
    
        const apiRequest = async (method, path, query = {}, body = null) => {
          const url = new URL(path, window.location.origin);
          Object.entries(query || {}).forEach(([key, value]) => {
            if (value === null || value === undefined || value === '') return;
            url.searchParams.set(key, String(value));
          });

          const upperMethod = toLower(method) === 'get' ? 'GET' : method;
          const maxAttempts = upperMethod === 'GET' ? 5 : 1;

          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            try {
              const response = await fetch(url.toString(), {
                method: upperMethod,
                cache: 'no-store',
                credentials: 'same-origin',
                headers: {
                  Accept: 'application/json',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });

              const payload = await response.json().catch(() => ({}));
              if (!response.ok) {
                const message = payload?.errors?.[0]?.message || `${upperMethod} failed (${response.status})`;
                const canRetry =
                  upperMethod === 'GET'
                  && attempt < maxAttempts
                  && isTransientSchemaMismatchMessage(message);
                if (canRetry) {
                  await delay(300 * attempt);
                  continue;
                }
                throw new Error(message);
              }
              return payload;
            } catch (error) {
              const message = error?.message || `${upperMethod} failed`;
              const canRetry =
                upperMethod === 'GET'
                && attempt < maxAttempts
                && isTransientSchemaMismatchMessage(message);
              if (canRetry) {
                await delay(300 * attempt);
                continue;
              }
              throw error;
            }
          }

          throw new Error(`${upperMethod} failed after retries.`);
        };

        const toStableObject = (value) => {
          if (Array.isArray(value)) {
            return value.map((entry) => toStableObject(entry));
          }
          if (!value || typeof value !== 'object') return value;
          const output = {};
          for (const key of Object.keys(value).sort((a, b) => a.localeCompare(b))) {
            output[key] = toStableObject(value[key]);
          }
          return output;
        };

        const toSnapshotHash = (value) => {
          try {
            return JSON.stringify(toStableObject(value ?? null));
          } catch {
            return '';
          }
        };

        const unwrapDrawerPayload = (value) => {
          if (!value || typeof value !== 'object') return {};
          const candidateKeys = ['edits', 'values', 'data', 'item'];
          for (const key of candidateKeys) {
            const nested = value?.[key];
            if (nested && typeof nested === 'object' && !Array.isArray(nested)) {
              return nested;
            }
          }
          return value;
        };

        const sanitizeDrawerPatchPayload = (value) => {
          const source = unwrapDrawerPayload(value);
          if (!source || typeof source !== 'object' || Array.isArray(source)) return {};

          const blockedKeys = new Set([
            'id',
            'date_created',
            'date_updated',
            'user_created',
            'user_updated',
            '__typename',
          ]);
          const payload = {};
          for (const [rawKey, rawValue] of Object.entries(source)) {
            const key = asString(rawKey);
            if (!key || blockedKeys.has(key) || key.startsWith('$')) continue;
            payload[key] = rawValue;
          }
          return payload;
        };

        const fetchDrawerSnapshotHash = async (collectionName, primaryKey) => {
          const collection = asString(collectionName);
          const rowId = parseId(primaryKey);
          if (!collection || !rowId || rowId === '+') return '';
          try {
            const response = await apiRequest(
              'GET',
              `/items/${collection}/${encodeURIComponent(rowId)}`,
              { fields: '*' },
            );
            return toSnapshotHash(response?.data || null);
          } catch {
            return '';
          }
        };

        const captureDrawerSnapshot = async (collectionName, primaryKey, sessionToken) => {
          const snapshot = await fetchDrawerSnapshotHash(collectionName, primaryKey);
          if (sessionToken !== drawerSessionKey.value) return '';
          drawerSnapshotHash.value = snapshot;
          return snapshot;
        };

    
        const normalizeBlockRow = (row) => {
          const groupTag = asString(row?.group_tag);
          const slot = asString(row?.slot) || 'main';
          const templateScope = asString(row?.template_scope) || 'page';
          const templateGroupKey = asString(row?.template_group_key) || 'page-root';
          const sortValue = asInteger(row?.sort);
          const treePath = asString(row?.tree_path);
          const collection = asString(row?.collection);
          const item = parseId(row?.item);
          const status = asString(row?.status);
          const treeDepth = asInteger(row?.tree_depth) ?? 0;
          const pageSlug = asString(row?.page_slug);
          const parentBlockId = parseId(row?.parent_block_id);
          const templateRootBlockId = parseId(row?.template_root_block_id);
          const templateNearestBlockId = parseId(row?.template_nearest_block_id);
          const contextToken = templateNearestBlockId ? buildTemplateContextId(templateNearestBlockId) : PAGE_CONTEXT_ID;
          const hierarchyToken = parentBlockId ? 'nested-child' : 'page-child';
          const searchTokens = [
            parseId(row?.id),
            collection,
            item,
            slot,
            groupTag,
            templateScope,
            templateGroupKey,
            treePath,
            parentBlockId,
            templateRootBlockId,
            templateNearestBlockId,
            contextToken,
            hierarchyToken,
            pageSlug,
            ...(status ? [status] : []),
          ]
            .map((entry) => toLower(entry))
            .filter(Boolean);
    
          return {
            id: parseId(row?.id),
            collection,
            item,
            slot,
            group_tag: groupTag,
            template_scope: templateScope,
            template_group_key: templateGroupKey,
            tree_path: treePath,
            tree_depth: treeDepth,
            sort: sortValue,
            status,
            parent_block_id: parentBlockId,
            template_root_block_id: templateRootBlockId,
            template_nearest_block_id: templateNearestBlockId,
            page_slug: pageSlug,
            _context_id: contextToken,
            _search_text: searchTokens.join(' '),
          };
        };
    
        const primeDrafts = () => {
          const next = {};
          for (const row of blocks.value) {
            next[row.id] = {
              slot: asString(row.slot) || 'main',
              sort: row.sort,
              group_tag: asString(row.group_tag),
            };
          }
          drafts.value = next;
        };

        const buildRelationManagerValue = () => {
          const rows = [];
          for (const row of blocks.value) {
            const rowId = parseId(row?.id);
            const collectionName = asString(row?.collection);
            const itemId = parseId(row?.item);
            if (!rowId && (!collectionName || !itemId)) continue;

            const nextRow = {};
            if (rowId) nextRow.id = rowId;
            if (collectionName) nextRow.collection = collectionName;
            if (itemId) nextRow.item = itemId;

            const slot = asString(row?.slot);
            if (slot) nextRow.slot = slot;

            const sortValue = asInteger(row?.sort);
            if (sortValue !== null) nextRow.sort = sortValue;

            const parentId = parseId(row?.parent_block_id);
            if (parentId) nextRow.parent_block_id = parentId;

            const groupTag = asString(row?.group_tag);
            if (groupTag) nextRow.group_tag = groupTag;

            rows.push(nextRow);
          }
          return rows;
        };

        const markPageDirtyFromDrawerEdits = () => {
          if (props.disabled) return;
          // Emit a canonical relation payload so Directus marks the parent form as dirty.
          emit('input', buildRelationManagerValue());
          info.value = 'Detected content updates from drawer. Save the page to publish and trigger refresh.';
        };
    
        const loadPageContext = async () => {
          if (!pageId.value) {
            pageContext.value = { id: '', slug: '', site_key: '', layout_template_key: '' };
            return;
          }
          const response = await apiRequest('GET', `/items/${pagesCollection.value}/${encodeURIComponent(pageId.value)}`, {
            fields: ['id', 'slug', pageSiteField.value, pageTemplateField.value].join(','),
          });
          const row = response?.data || {};
          pageContext.value = {
            id: parseId(row?.id) || pageId.value,
            slug: asString(row?.slug),
            site_key: asString(row?.[pageSiteField.value]),
            layout_template_key: asString(row?.[pageTemplateField.value]),
          };
        };
    
        const templateSlotsFor = (templateKey) => {
          const normalizedTemplateKey = asString(templateKey);
          if (!normalizedTemplateKey) return ['main'];
          const fromCache = slotsByTemplateKey.value[normalizedTemplateKey];
          if (!Array.isArray(fromCache) || fromCache.length === 0) return ['main'];
          return fromCache;
        };

        const loadSlotsForTemplate = async (templateKey) => {
          const normalizedTemplateKey = asString(templateKey);
          if (!normalizedTemplateKey) return ['main'];
          if (Array.isArray(slotsByTemplateKey.value[normalizedTemplateKey]) && slotsByTemplateKey.value[normalizedTemplateKey].length > 0) {
            return slotsByTemplateKey.value[normalizedTemplateKey];
          }

          const siteKey = asString(pageContext.value.site_key);
          const filter = {
            _and: [
              { template_key: { _eq: normalizedTemplateKey } },
              siteKey
                ? {
                    _or: [
                      { site_key: { _empty: true } },
                      { site_key: { _eq: siteKey } },
                    ],
                  }
                : { site_key: { _empty: true } },
            ],
          };

          const response = await apiRequest('GET', `/items/${layoutSlotsCollection.value}`, {
            fields: 'slot_key',
            limit: -1,
            sort: 'slot_key',
            filter: JSON.stringify(filter),
          });

          const values = uniqueNonEmpty(normalizeRows(response).map((row) => row?.slot_key));
          const resolvedValues = values.length > 0 ? values : ['main'];
          slotsByTemplateKey.value = {
            ...slotsByTemplateKey.value,
            [normalizedTemplateKey]: resolvedValues,
          };
          return resolvedValues;
        };

        const preloadSlotsForKnownTemplates = async () => {
          const candidates = uniqueNonEmpty([
            asString(pageContext.value.layout_template_key),
            ...blocks.value.map((row) => asString(row.template_group_key)).filter((value) => value && value !== 'page-root'),
          ]);
          const nextCache = {};
          slotsByTemplateKey.value = nextCache;
          for (const templateKey of candidates) {
            const values = await loadSlotsForTemplate(templateKey);
            nextCache[templateKey] = values;
          }
          slotsByTemplateKey.value = nextCache;
        };
    
        const loadBlocks = async () => {
          if (!pageId.value) {
            blocks.value = [];
            drafts.value = {};
            return;
          }
    
          const filter = { page_id: { _eq: pageId.value } };
          const response = await apiRequest('GET', `/items/${pageBlocksCollection.value}`, {
            fields: [
              'id',
              'collection',
              'item',
              'slot',
              'group_tag',
              'template_scope',
              'template_group_key',
              'tree_path',
              'tree_depth',
              'sort',
              'parent_block_id',
              'template_root_block_id',
              'template_nearest_block_id',
              'page_slug',
            ].join(','),
            limit: defaultLimit.value,
            sort: defaultSort.value.join(','),
            filter: JSON.stringify(filter),
          });
    
          blocks.value = normalizeRows(response).map(normalizeBlockRow);
          primeDrafts();
        };
    
        const refreshAll = async () => {
          loading.value = true;
          error.value = '';
          info.value = '';
          try {
            await loadPageContext();
            await loadBlocks();
            await preloadSlotsForKnownTemplates();
          } catch (requestError) {
            error.value = requestError?.message || 'Failed to load blocks manager data.';
          } finally {
            loading.value = false;
          }
        };
    
        const isSaving = (rowId) => Boolean(saving.value[rowId]);
    
        const getDraft = (row) => {
          const current = drafts.value[row.id];
          if (current) return current;
          return {
            slot: asString(row.slot) || 'main',
            sort: row.sort,
            group_tag: asString(row.group_tag),
          };
        };
    
        const setDraft = (rowId, patch) => {
          drafts.value = {
            ...drafts.value,
            [rowId]: {
              ...(drafts.value[rowId] || {}),
              ...patch,
            },
          };
        };
    
        const hasChanges = (row) => {
          const draft = getDraft(row);
          const normalizedSlot = asString(draft.slot) || 'main';
          const normalizedSort = asInteger(draft.sort);
          const normalizedTag = asString(draft.group_tag);
          return (
            normalizedSlot !== (asString(row.slot) || 'main')
            || normalizedSort !== (asInteger(row.sort))
            || normalizedTag !== asString(row.group_tag)
          );
        };
    
        const buildPatchPayload = (row) => {
          const draft = getDraft(row);
          const nextSlot = asString(draft.slot) || 'main';
          const nextSort = asInteger(draft.sort);
          const nextTag = asString(draft.group_tag);
    
          const payload = {};
          if (nextSlot !== (asString(row.slot) || 'main')) payload.slot = nextSlot;
          if (nextSort !== asInteger(row.sort)) payload.sort = nextSort;
          if (nextTag !== asString(row.group_tag)) payload.group_tag = nextTag || null;
          return payload;
        };
    
        const markSaving = (rowId, active) => {
          const next = { ...saving.value };
          if (active) next[rowId] = true;
          else delete next[rowId];
          saving.value = next;
        };

        const isDeleting = (rowId) => Boolean(deleting.value[rowId]);

        const markDeleting = (rowId, active) => {
          const next = { ...deleting.value };
          if (active) next[rowId] = true;
          else delete next[rowId];
          deleting.value = next;
        };
    
        const saveRow = async (row) => {
          if (props.disabled || isSaving(row.id)) return;
          const payload = buildPatchPayload(row);
          if (Object.keys(payload).length === 0) return;
    
          markSaving(row.id, true);
          info.value = '';
          error.value = '';
          try {
            const response = await apiRequest(
              'PATCH',
              `/items/${pageBlocksCollection.value}/${encodeURIComponent(row.id)}`,
              {},
              payload,
            );
            const updated = normalizeBlockRow(response?.data || { ...row, ...payload });
            blocks.value = blocks.value.map((candidate) => (candidate.id === row.id ? updated : candidate));
            setDraft(row.id, {
              slot: updated.slot,
              sort: updated.sort,
              group_tag: updated.group_tag,
            });
            info.value = `Saved block ${row.id}.`;
          } catch (requestError) {
            error.value = requestError?.message || `Failed to save block ${row.id}.`;
          } finally {
            markSaving(row.id, false);
          }
        };
    
        const saveAll = async () => {
          if (props.disabled) return;
          const changedRows = contextBlocks.value.filter((row) => hasChanges(row));
          if (changedRows.length === 0) return;
          info.value = '';
          error.value = '';
          for (const row of changedRows) {
            await saveRow(row);
            if (error.value) return;
          }
          info.value = `Saved ${changedRows.length} block${changedRows.length === 1 ? '' : 's'}.`;
          await loadBlocks();
        };
    
        const resetRow = (row) => {
          setDraft(row.id, {
            slot: asString(row.slot) || 'main',
            sort: row.sort,
            group_tag: asString(row.group_tag),
          });
        };
    
        const openDrawerItem = (collectionName, primaryKey) => {
          const nextCollection = asString(collectionName);
          const nextPrimaryKey = parseId(primaryKey);
          if (!nextCollection || !nextPrimaryKey) return;

          if (!hasDrawerItem) {
            error.value = 'Drawer editor is unavailable. Cannot open editor in-page.';
            return;
          }

          if (drawerRefreshTimer) {
            clearTimeout(drawerRefreshTimer);
            drawerRefreshTimer = null;
          }
          drawerSessionKey.value += 1;
          const nextSession = drawerSessionKey.value;
          drawerSavedByInput.value = false;
          drawerSnapshotHash.value = '';
          drawerPendingPatch.value = {};
          drawerCollection.value = nextCollection;
          drawerPrimaryKey.value = nextPrimaryKey;
          drawerActive.value = true;
          void captureDrawerSnapshot(nextCollection, nextPrimaryKey, nextSession);
        };

        const detectDrawerSnapshotChange = async (collectionName, primaryKey, beforeSnapshot, sessionToken) => {
          const delays = [0, 220, 420, 760, 1200];
          let latestSnapshot = '';
          for (const waitMs of delays) {
            if (waitMs > 0) await delay(waitMs);
            latestSnapshot = await fetchDrawerSnapshotHash(collectionName, primaryKey);
            if (sessionToken !== drawerSessionKey.value) {
              return { changed: false, latestSnapshot: '' };
            }
            if (beforeSnapshot && latestSnapshot && latestSnapshot !== beforeSnapshot) {
              return { changed: true, latestSnapshot };
            }
          }
          return { changed: false, latestSnapshot };
        };

        const handleDrawerActive = async (nextActive) => {
          const shouldBeActive = Boolean(nextActive);
          drawerActive.value = shouldBeActive;
          if (shouldBeActive) return;

          const closingCollection = asString(drawerCollection.value);
          const closingPrimaryKey = parseId(drawerPrimaryKey.value);
          const closingSession = drawerSessionKey.value;
          let changedWhileOpen = drawerSavedByInput.value;
          if (!changedWhileOpen) {
            const beforeSnapshot = asString(drawerSnapshotHash.value);
            if (beforeSnapshot && closingCollection && closingPrimaryKey && closingPrimaryKey !== '+') {
              const { changed, latestSnapshot } = await detectDrawerSnapshotChange(
                closingCollection,
                closingPrimaryKey,
                beforeSnapshot,
                closingSession,
              );
              if (changed) {
                changedWhileOpen = true;
                if (latestSnapshot) {
