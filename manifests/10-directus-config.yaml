          openDrawerItem(row.collection, row.item);
        };

        const collectDescendantRowIds = (rootRowId) => {
          const rootId = parseId(rootRowId);
          if (!rootId) return [];
          const childrenByParentId = new Map();
          for (const row of blocks.value) {
            const rowId = parseId(row?.id);
            if (!rowId) continue;
            const parentId = parseId(row?.parent_block_id);
            if (!parentId) continue;
            if (!childrenByParentId.has(parentId)) childrenByParentId.set(parentId, []);
            childrenByParentId.get(parentId).push(rowId);
          }

          const ordered = [];
          const stack = [rootId];
          const seen = new Set();
          while (stack.length > 0) {
            const current = stack.pop();
            if (!current || seen.has(current)) continue;
            seen.add(current);
            ordered.push(current);
            const children = childrenByParentId.get(current) || [];
            for (const childId of children) {
              stack.push(childId);
            }
          }
          return ordered;
        };

        const deleteBlockRow = async (row) => {
          if (props.disabled) return;
          const rowId = parseId(row?.id);
          if (!rowId || isDeleting(rowId) || isSaving(rowId)) return;

          const subtreeIds = collectDescendantRowIds(rowId);
          if (subtreeIds.length === 0) return;
          const subtreeCount = subtreeIds.length;
          const requiresCascadeConfirm = subtreeCount > 1;
          const confirmMessage = requiresCascadeConfirm
            ? `Delete this block and ${subtreeCount - 1} nested block(s)?`
            : 'Delete this block?';
          if (typeof window !== 'undefined' && !window.confirm(confirmMessage)) return;

          markDeleting(rowId, true);
          error.value = '';
          info.value = '';

          try {
            const rowById = new Map(blocks.value.map((candidate) => [parseId(candidate?.id), candidate]));
            const deletionOrder = [...subtreeIds].sort((left, right) => {
              const leftDepth = asInteger(rowById.get(left)?.tree_depth) ?? 0;
              const rightDepth = asInteger(rowById.get(right)?.tree_depth) ?? 0;
              return rightDepth - leftDepth;
            });

            for (const targetId of deletionOrder) {
              await apiRequest(
                'DELETE',
                `/items/${pageBlocksCollection.value}/${encodeURIComponent(targetId)}`,
              );
            }

            const deleted = new Set(subtreeIds);
            blocks.value = blocks.value.filter((candidate) => !deleted.has(parseId(candidate?.id)));

            const nextDrafts = { ...drafts.value };
            for (const deletedId of deleted) {
              delete nextDrafts[deletedId];
            }
            drafts.value = nextDrafts;

            if (
              asString(drawerCollection.value) === asString(pageBlocksCollection.value)
              && deleted.has(parseId(drawerPrimaryKey.value))
            ) {
              drawerActive.value = false;
            }

            emit('input', buildRelationManagerValue());
            info.value = `Deleted ${subtreeCount} block${subtreeCount === 1 ? '' : 's'}. Save the page to publish and trigger refresh.`;
            await refreshAll();
          } catch (requestError) {
            error.value = requestError?.message || 'Failed to delete block.';
          } finally {
            markDeleting(rowId, false);
          }
        };
    
        const publishedSiteScopeFilter = () => {
          const siteKey = asString(pageContext.value?.site_key);
          return siteKey
            ? {
                _or: [
                  { site_key: { _empty: true } },
                  { site_key: { _eq: siteKey } },
                ],
              }
            : { site_key: { _empty: true } };
        };

        const inferParentBlockIdForContext = () => {
          const contextId = asString(activeContext.value?.value) || PAGE_CONTEXT_ID;
          if (contextId === PAGE_CONTEXT_ID) return '';
          return parseTemplateContextId(contextId);
        };

        const inferDefaultSlotForContext = async () => {
          const templateKey = asString(activeContext.value?.template_key);
          if (templateKey) {
            await loadSlotsForTemplate(templateKey);
          }
          const slots = contextTemplateSlots.value;
          if (Array.isArray(slots) && slots.length > 0) {
            if (slots.includes('main')) return 'main';
            return asString(slots[0]) || 'main';
          }
          return 'main';
        };

        const inferNextSortForContext = () => {
          const parentBlockId = inferParentBlockIdForContext();
          const siblingSorts = blocks.value
            .filter((row) => {
              const rowParent = parseId(row?.parent_block_id);
              if (parentBlockId) return rowParent === parentBlockId;
              return !rowParent;
            })
            .map((row) => asInteger(row?.sort))
            .filter((value) => Number.isFinite(value));
          if (siblingSorts.length === 0) return 10;
          return Math.max(...siblingSorts) + 10;
        };

        const resolveDefaultPublishedModuleKey = async (preferredModuleKey = '', providerFilter = []) => {
          const preferred = asString(preferredModuleKey);
          const normalizedProviders = Array.from(
            new Set(
              (Array.isArray(providerFilter) ? providerFilter : [providerFilter])
                .map((entry) => asString(entry).toLowerCase())
                .filter(Boolean),
            ),
          );
          const providerClause = normalizedProviders.length === 1
            ? { provider: { _eq: normalizedProviders[0] } }
            : (normalizedProviders.length > 1 ? { provider: { _in: normalizedProviders } } : null);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              publishedSiteScopeFilter(),
              ...(providerClause ? [providerClause] : []),
              ...(preferred ? [{ module_key: { _eq: preferred } }] : []),
            ],
          };
          const response = await apiRequest('GET', '/items/cms_modules', {
            fields: 'module_key,provider,site_key',
            limit: 50,
            sort: 'site_key,provider,module_key',
            filter: JSON.stringify(filter),
          });
          const rows = normalizeRows(response);
          if (!rows.length) return '';
          const siteKey = asString(pageContext.value?.site_key);
          const siteSpecific = rows.find((row) => asString(row?.site_key) === siteKey);
          return asString(siteSpecific?.module_key || rows[0]?.module_key);
        };

        const resolveDefaultPublishedTemplateKey = async (preferredTemplateKey = '') => {
          const preferred = asString(preferredTemplateKey);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              publishedSiteScopeFilter(),
              ...(preferred ? [{ template_key: { _eq: preferred } }] : []),
            ],
          };
          const response = await apiRequest('GET', '/items/cms_layout_templates', {
            fields: 'template_key,site_key',
            limit: 50,
            sort: 'site_key,template_key',
            filter: JSON.stringify(filter),
          });
          const rows = normalizeRows(response);
          if (!rows.length) return '';
          const siteKey = asString(pageContext.value?.site_key);
          const siteSpecific = rows.find((row) => asString(row?.site_key) === siteKey);
          return asString(siteSpecific?.template_key || rows[0]?.template_key);
        };

        const createPageBlockWithContent = async (type) => {
          if (props.disabled || !pageId.value || creatingBlockType.value) return;
          creatingBlockType.value = asString(type);
          error.value = '';
          info.value = '';

          try {
            let contentCollection = '';
            let contentPayload = {};
            let preferredEditorCollection = '';
            let preferredEditorId = '';

            if (type === 'rich_text') {
              contentCollection = 'cms_block_rich_text';
              contentPayload = {
                status: 'published',
                body: '<p>New content block</p>',
              };
            } else if (type === 'hero') {
              contentCollection = 'cms_block_hero';
              contentPayload = {
                status: 'published',
                headline: 'New hero block',
                subheadline: '',
              };
            } else if (type === 'module') {
              const moduleKey = await resolveDefaultPublishedModuleKey('', ['radix']);
              if (!moduleKey) {
                throw new Error('No published UI modules are available for this site context.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'radix',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'image') {
              const moduleKey = await resolveDefaultPublishedModuleKey('radix-image', ['radix']);
              if (!moduleKey) {
                throw new Error('The radix-image module is not available yet. Deploy modules first.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'radix',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'mfe') {
              const moduleKey = await resolveDefaultPublishedModuleKey('', ['mfe']);
              if (!moduleKey) {
                throw new Error('No published MFE modules are available for this site context.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'mfe',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'template_ref') {
              const preferredTemplateKey =
                asString(activeContext.value?.template_key)
                || asString(pageContext.value?.layout_template_key);
              const templateKey = await resolveDefaultPublishedTemplateKey(preferredTemplateKey);
              if (!templateKey) {
                throw new Error('No published layout templates are available for this site context.');
              }
              contentCollection = 'cms_block_template_ref';
              contentPayload = {
                status: 'published',
                name: `Template ${templateKey}`,
                template_key: templateKey,
              };
            } else {
              throw new Error(`Unsupported block type: ${type}`);
            }

            const createdContent = await apiRequest('POST', `/items/${contentCollection}`, {}, contentPayload);
            const contentId = parseId(createdContent?.data?.id);
            if (!contentId) {
              throw new Error('Block content created but id was missing.');
            }

            const parentBlockId = inferParentBlockIdForContext();
            const defaultSlot = await inferDefaultSlotForContext();
            const blockPayload = {
              page_id: pageId.value,
              collection: contentCollection,
              item: contentId,
              slot: defaultSlot,
              sort: inferNextSortForContext(),
              parent_block_id: parentBlockId || null,
            };

            const createdLink = await apiRequest('POST', `/items/${pageBlocksCollection.value}`, {}, blockPayload);
            const linkId = parseId(createdLink?.data?.id);

            info.value = `Created ${collectionDisplayName(contentCollection)} block.`;
            await refreshAll();

            preferredEditorCollection = contentCollection;
            preferredEditorId = contentId;

            if (preferredEditorCollection && preferredEditorId) {
              openDrawerItem(preferredEditorCollection, preferredEditorId);
            } else if (linkId) {
              openDrawerItem(pageBlocksCollection.value, linkId);
            }
          } catch (requestError) {
            error.value = requestError?.message || 'Failed to create block.';
          } finally {
            creatingBlockType.value = '';
          }
        };

        const contextChoices = computed(() => {
          const choices = [{
            value: PAGE_CONTEXT_ID,
            text: `Page (${asString(pageContext.value.layout_template_key) || 'no layout'})`,
            template_key: asString(pageContext.value.layout_template_key),
            block_id: '',
            scope: 'page',
          }];
          const seen = new Set([PAGE_CONTEXT_ID]);

          for (const row of blocks.value) {
            const templateKey = asString(row.template_group_key);
            if (!templateKey || templateKey === 'page-root') continue;
            const contextBlockId = parseId(row.template_nearest_block_id) || parseId(row.id);
            const contextId = buildTemplateContextId(contextBlockId);
            if (!contextId || seen.has(contextId)) continue;
            seen.add(contextId);
            choices.push({
              value: contextId,
              text: `Template ${templateKey} (${contextBlockId.slice(0, 8)})`,
              template_key: templateKey,
              block_id: contextBlockId,
              scope: asString(row.template_scope) || 'template',
            });
          }

          return choices;
        });

        const activeContext = computed(() => {
          const match = contextChoices.value.find((item) => item.value === selectedContext.value);
          if (match) return match;
          return contextChoices.value[0] || {
            value: PAGE_CONTEXT_ID,
            text: 'Page',
            template_key: '',
            block_id: '',
            scope: 'page',
          };
        });

        const rowInSelectedContext = (row) => {
          const contextId = asString(activeContext.value?.value) || PAGE_CONTEXT_ID;
          if (contextId === PAGE_CONTEXT_ID) {
            return asString(row._context_id) === PAGE_CONTEXT_ID;
          }
          const templateBlockId = parseTemplateContextId(contextId);
          if (!templateBlockId) return false;
          return asString(row._context_id) === contextId;
        };

        const isDirectChildForContext = (row) => {
          const contextId = asString(activeContext.value?.value) || PAGE_CONTEXT_ID;
          if (contextId === PAGE_CONTEXT_ID) return isDirectChildRow(row);
          const templateBlockId = parseTemplateContextId(contextId);
          if (!templateBlockId) return false;
          return parseId(row.parent_block_id) === templateBlockId;
        };

        const contextBlocks = computed(() => blocks.value.filter((row) => rowInSelectedContext(row)));
        const contextTemplateKey = computed(() => asString(activeContext.value?.template_key));
        const contextTemplateSlots = computed(() => templateSlotsFor(contextTemplateKey.value));

        const collectionChoices = computed(() => uniqueNonEmpty(contextBlocks.value.map((row) => row.collection)));
        const slotChoices = computed(() => uniqueNonEmpty([...contextTemplateSlots.value, ...contextBlocks.value.map((row) => row.slot)]));
        const scopeChoices = computed(() => uniqueNonEmpty(contextBlocks.value.map((row) => row.template_scope)));
        const groupTagChoices = computed(() => uniqueNonEmpty(contextBlocks.value.map((row) => row.group_tag)));

        const filteredBlocks = computed(() => {
          const needle = toLower(searchText.value);
          return contextBlocks.value.filter((row) => {
            if (needle && !row._search_text.includes(needle)) return false;
            if (filterHierarchy.value === 'direct_children' && !isDirectChildForContext(row)) return false;
            if (filterHierarchy.value === 'nested_only' && isDirectChildForContext(row)) return false;
            if (filterCollection.value !== '__all' && row.collection !== filterCollection.value) return false;
            if (filterSlot.value !== '__all' && row.slot !== filterSlot.value) return false;
            if (filterScope.value !== '__all' && row.template_scope !== filterScope.value) return false;
            if (filterGroupTag.value !== '__all' && asString(row.group_tag) !== filterGroupTag.value) return false;
            return true;
          });
        });
    
        const groupedBlocks = computed(() => {
          const groups = new Map();
          const addToGroup = (key, label, row) => {
            if (!groups.has(key)) groups.set(key, { key, label, rows: [] });
            groups.get(key).rows.push(row);
          };
    
          for (const row of filteredBlocks.value) {
            if (groupBy.value === 'none') {
              addToGroup('all', 'All Blocks', row);
              continue;
            }
            if (groupBy.value === 'group_tag') {
              const label = asString(row.group_tag) || '(no group tag)';
              addToGroup(`group:${label}`, `Group Tag: ${label}`, row);
              continue;
            }
            if (groupBy.value === 'slot') {
              const label = asString(row.slot) || 'main';
              addToGroup(`slot:${label}`, `Slot: ${label}`, row);
              continue;
            }
            if (groupBy.value === 'collection') {
              const label = asString(row.collection) || '(unknown)';
              addToGroup(`collection:${label}`, `Collection: ${label}`, row);
              continue;
            }
            const scope = asString(row.template_scope) || 'page';
            const templateGroup = asString(row.template_group_key) || 'page-root';
            const label = `${scope}/${templateGroup}`;
            addToGroup(`template:${label}`, `Template Group: ${label}`, row);
          }
    
          return Array.from(groups.values()).sort((a, b) => a.label.localeCompare(b.label));
        });
    
        watch(
          () => JSON.stringify({
            pageId: pageId.value,
            pagesCollection: pagesCollection.value,
            pageBlocksCollection: pageBlocksCollection.value,
            layoutTemplatesCollection: layoutTemplatesCollection.value,
            layoutSlotsCollection: layoutSlotsCollection.value,
            pageSiteField: pageSiteField.value,
            pageTemplateField: pageTemplateField.value,
            defaultLimit: defaultLimit.value,
            defaultSort: defaultSort.value,
          }),
          async () => {
            resetFilters();
            await refreshAll();
          },
          { immediate: true }
        );
    
        watch(instanceSignature, () => {
          claimPrimaryInstance();
        });

        watch(
          () => contextChoices.value.map((item) => item.value).join('|'),
          () => {
            const active = contextChoices.value.find((item) => item.value === selectedContext.value);
            if (!active) {
              selectedContext.value = contextChoices.value[0]?.value || PAGE_CONTEXT_ID;
            }
          },
          { immediate: true }
        );

        watch(
          () => blocks.value.map((row) => asString(row?.id)).filter(Boolean).join('|'),
          () => {
            const valid = new Set(['__root', ...blocks.value.map((row) => asString(row?.id)).filter(Boolean)]);
            const next = {};
            for (const [key, value] of Object.entries(expandedNodes.value || {})) {
              if (!valid.has(key)) continue;
              next[key] = Boolean(value);
            }
            if (!Object.prototype.hasOwnProperty.call(next, '__root')) next.__root = true;
            expandedNodes.value = next;
          },
          { immediate: true }
        );
    
        onMounted(() => {
          claimPrimaryInstance();
          if (typeof window !== 'undefined') {
            window.addEventListener(BLOCKS_MANAGER_REGISTRY_EVENT, claimPrimaryInstance);
          }
          if (!groupBy.value) {
            groupBy.value = asString(resolvedOptions.value?.default_group_by) || 'template';
          }
        });
    
        onBeforeUnmount(() => {
          if (drawerRefreshTimer) {
            clearTimeout(drawerRefreshTimer);
            drawerRefreshTimer = null;
          }
          if (typeof window !== 'undefined') {
            window.removeEventListener(BLOCKS_MANAGER_REGISTRY_EVENT, claimPrimaryInstance);
          }
          releasePrimaryInstance();
        });
    
        return () => {
          if (!isPrimaryInstance.value) {
            return h('div', {
              class: 'cms-page-blocks-manager cms-page-blocks-manager--duplicate-hidden',
              style: { display: 'none' },
            });
          }
          const resolvedNotice = resolveComponent('v-notice');
          const resolvedInput = resolveComponent('v-input');
          const resolvedSelect = resolveComponent('v-select');
          const resolvedButton = resolveComponent('v-button');
          const resolvedIcon = resolveComponent('v-icon');
          const resolvedChip = resolveComponent('v-chip');
          const resolvedDivider = resolveComponent('v-divider');
          const resolvedCard = resolveComponent('v-card');
    
          const hasNotice = typeof resolvedNotice !== 'string';
          const hasInput = typeof resolvedInput !== 'string';
          const hasSelect = typeof resolvedSelect !== 'string';
          const hasButton = typeof resolvedButton !== 'string';
          const hasIcon = typeof resolvedIcon !== 'string';
          const hasChip = typeof resolvedChip !== 'string';
          const hasDivider = typeof resolvedDivider !== 'string';
          const hasCard = typeof resolvedCard !== 'string';
    
          const sortBlockRows = (left, right) => {
            const leftSort = asInteger(left?.sort);
            const rightSort = asInteger(right?.sort);
            if (leftSort !== null && rightSort !== null && leftSort !== rightSort) return leftSort - rightSort;
            if (leftSort !== null && rightSort === null) return -1;
            if (leftSort === null && rightSort !== null) return 1;
            const leftDepth = asInteger(left?.tree_depth) ?? 0;
            const rightDepth = asInteger(right?.tree_depth) ?? 0;
            if (leftDepth !== rightDepth) return leftDepth - rightDepth;
            const leftPath = asString(left?.tree_path);
            const rightPath = asString(right?.tree_path);
            if (leftPath !== rightPath) return leftPath.localeCompare(rightPath);
            const leftCollection = asString(left?.collection);
            const rightCollection = asString(right?.collection);
            if (leftCollection !== rightCollection) return leftCollection.localeCompare(rightCollection);
            return asString(left?.id).localeCompare(asString(right?.id));
          };

          const blockById = new Map();
          for (const row of blocks.value) {
            if (!row?.id) continue;
            blockById.set(asString(row.id), row);
          }

          const searchNeedle = toLower(searchText.value);
          const visibleRowIds = new Set();
          if (searchNeedle) {
            for (const row of blocks.value) {
              const rowId = asString(row?.id);
              if (!rowId) continue;
              if (toLower(row?._search_text).includes(searchNeedle)) {
                visibleRowIds.add(rowId);
                let parentId = parseId(row?.parent_block_id);
                while (parentId) {
                  if (visibleRowIds.has(parentId)) break;
                  visibleRowIds.add(parentId);
                  parentId = parseId(blockById.get(parentId)?.parent_block_id);
                }
              }
            }
          }

          const rowsForTree = searchNeedle
            ? blocks.value.filter((row) => visibleRowIds.has(asString(row?.id)))
            : blocks.value;

          const childrenByParent = new Map();
          const pushChild = (parentKey, row) => {
            if (!childrenByParent.has(parentKey)) childrenByParent.set(parentKey, []);
            childrenByParent.get(parentKey).push(row);
          };
          for (const row of rowsForTree) {
            const rowId = asString(row?.id);
            if (!rowId) continue;
            const parentId = parseId(row?.parent_block_id);
            if (parentId && blockById.has(parentId)) {
              pushChild(parentId, row);
            } else {
              pushChild('__root', row);
            }
          }
          for (const entry of childrenByParent.values()) {
            entry.sort(sortBlockRows);
          }
          const rootRows = childrenByParent.get('__root') || [];
          const visibleCount = rowsForTree.length;

          const styles = {
            root: {
              display: 'flex',
              flexDirection: 'column',
              gap: '12px',
            },
            toolbar: {
              display: 'flex',
              flexWrap: 'wrap',
              gap: '8px',
              alignItems: 'center',
              padding: '12px',
              borderRadius: 'var(--theme--border-radius)',
              background: 'var(--theme--background-subdued)',
            },
            toolbarSearch: {
              minWidth: '220px',
              flex: '1 1 280px',
            },
            toolbarActionGroup: {
              display: 'flex',
              alignItems: 'center',
              gap: '6px',
              flexWrap: 'wrap',
            },
            meta: {
              margin: '0',
              fontSize: '12px',
              color: 'var(--theme--foreground-subdued)',
            },
            treeRoot: {
              display: 'flex',
              flexDirection: 'column',
              gap: '10px',
            },
            treeViewport: {
              maxHeight: '68vh',
              overflow: 'auto',
              borderRadius: 'var(--theme--border-radius)',
              padding: '10px 12px',
              background: 'var(--theme--background)',
            },
            treeViewportFrame: {
              border: '2px solid var(--theme--border-color-subdued)',
              borderRadius: 'calc(var(--theme--border-radius) + 2px)',
              padding: '2px',
              background: 'var(--theme--background-subdued)',
              boxShadow: '0 0 0 1px var(--theme--border-color-subdued)',
            },
            treeNodeCard: {
              display: 'flex',
              flexDirection: 'column',
              gap: '6px',
              padding: '8px 10px',
              border: '1px solid var(--theme--border-subdued)',
              borderRadius: 'var(--theme--border-radius)',
              background: 'var(--theme--background-page)',
            },
            treeNodeHeader: {
              display: 'flex',
              flexWrap: 'nowrap',
              justifyContent: 'space-between',
              alignItems: 'center',
              gap: '6px',
            },
            treeNodeHeaderLeft: {
              display: 'flex',
              alignItems: 'center',
              minWidth: 0,
              flexWrap: 'nowrap',
              gap: '4px',
            },
            treeNodeTitleWrap: {
              display: 'flex',
              flexDirection: 'column',
              gap: '2px',
              minWidth: 0,
            },
            treeNodeTitle: {
              fontSize: '12px',
              fontWeight: '600',
              color: 'var(--theme--foreground-normal)',
              whiteSpace: 'nowrap',
              overflow: 'hidden',
              textOverflow: 'ellipsis',
            },
            treeNodeSubtitle: {
              fontSize: '10px',
              color: 'var(--theme--foreground-subdued)',
              whiteSpace: 'nowrap',
              overflow: 'hidden',
              textOverflow: 'ellipsis',
            },
            treeNodeMeta: {
              display: 'flex',
              flexWrap: 'wrap',
              gap: '4px',
              alignItems: 'center',
            },
            treeNodeActions: {
              display: 'flex',
              flexWrap: 'nowrap',
              gap: '4px',
              alignItems: 'center',
              marginLeft: '8px',
            },
            iconButtonFallback: {
              width: '28px',
              minWidth: '28px',
              height: '28px',
              minHeight: '28px',
              border: '1px solid var(--theme--border-normal)',
              borderRadius: '6px',
              background: 'var(--theme--background-page)',
              color: 'var(--theme--foreground-normal)',
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              cursor: 'pointer',
              padding: '0',
              lineHeight: 1,
            },
            treeList: {
              listStyle: 'none',
              margin: '0',
              padding: '0',
            },
            treeChildList: {
              listStyle: 'none',
              margin: '8px 0 0 0',
              padding: '0 0 0 18px',
              borderLeft: '1px solid var(--theme--border-subdued)',
            },
            treePageHeader: {
              display: 'flex',
              flexWrap: 'wrap',
              justifyContent: 'space-between',
              alignItems: 'center',
              gap: '8px',
            },
          };
    
          const toChoiceItems = (values) => (values || []).map((value) => ({ text: asString(value), value: asString(value) }));
    
          const renderInputControl = ({ value, onUpdate, disabled, placeholder = '', type = 'text', style = {} }) => {
            if (hasInput) {
              return h(resolvedInput, {
                modelValue: value ?? '',
                placeholder,
                disabled,
                type,
                'onUpdate:modelValue': (next) => onUpdate(next),
              });
            }
            return h('input', {
              type,
              value: value ?? '',
              placeholder,
              disabled,
              style: {
                minHeight: '34px',
                width: '100%',
                border: '1px solid var(--theme--border-normal)',
                borderRadius: '6px',
                padding: '6px 10px',
                ...style,
              },
              onInput: (event) => onUpdate(event?.target?.value ?? ''),
            });
          };
    
          const renderSelectControl = ({ value, items, onUpdate, disabled, style = {} }) => {
            if (hasSelect) {
              return h(resolvedSelect, {
                modelValue: value,
                items,
                disabled,
                allowNone: false,
                'onUpdate:modelValue': (next) => onUpdate(next),
              });
            }
            return h(
              'select',
              {
                value,
                disabled,
                style: {
                  minHeight: '34px',
                  width: '100%',
                  border: '1px solid var(--theme--border-normal)',
                  borderRadius: '6px',
                  padding: '6px 10px',
                  ...style,
                },
                onChange: (event) => onUpdate(event?.target?.value ?? ''),
              },
              (items || []).map((item) => h('option', { value: item.value }, item.text))
            );
          };
    
          const renderButtonControl = ({ label, onClick, disabled, primary = false }) => {
            if (hasButton) {
              return h(
                resolvedButton,
                {
                  disabled,
                  secondary: !primary,
                  small: true,
                  onClick,
                },
                () => label
              );
            }
            return h(
              'button',
              {
                type: 'button',
                disabled,
                onClick,
                style: {
                  minHeight: '34px',
                  border: primary ? '1px solid var(--theme--primary)' : '1px solid var(--theme--border-normal)',
                  borderRadius: '6px',
                  padding: '6px 10px',
                  background: primary ? 'var(--theme--primary)' : 'var(--theme--background-page)',
                  color: primary ? 'var(--theme--primary-alt)' : 'var(--theme--foreground-normal)',
                  cursor: 'pointer',
                },
              },
              label
            );
          };

          const renderIconControl = ({ icon, fallbackIcon = '•', label, onClick, disabled = false, danger = false }) => {
            if (hasButton) {
              return h(
                resolvedButton,
                {
                  disabled,
                  small: true,
                  secondary: true,
                  title: label,
                  'aria-label': label,
                  style: danger ? { color: 'var(--theme--danger)' } : {},
                  onClick,
                },
