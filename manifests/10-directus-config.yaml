          return (
            normalizedSlot !== (asString(row.slot) || 'main')
            || normalizedSort !== (asInteger(row.sort))
            || normalizedTag !== asString(row.group_tag)
          );
        };
    
        const buildPatchPayload = (row) => {
          const draft = getDraft(row);
          const nextSlot = asString(draft.slot) || 'main';
          const nextSort = asInteger(draft.sort);
          const nextTag = asString(draft.group_tag);
    
          const payload = {};
          if (nextSlot !== (asString(row.slot) || 'main')) payload.slot = nextSlot;
          if (nextSort !== asInteger(row.sort)) payload.sort = nextSort;
          if (nextTag !== asString(row.group_tag)) payload.group_tag = nextTag || null;
          return payload;
        };
    
        const markSaving = (rowId, active) => {
          const next = { ...saving.value };
          if (active) next[rowId] = true;
          else delete next[rowId];
          saving.value = next;
        };
    
        const isDeleting = (rowId) => Boolean(deleting.value[rowId]);
    
        const markDeleting = (rowId, active) => {
          const next = { ...deleting.value };
          if (active) next[rowId] = true;
          else delete next[rowId];
          deleting.value = next;
        };
    
        const saveRow = async (row) => {
          if (props.disabled || isSaving(row.id)) return;
          const payload = buildPatchPayload(row);
          if (Object.keys(payload).length === 0) return;
    
          markSaving(row.id, true);
          info.value = '';
          error.value = '';
          try {
            const response = await apiRequest(
              'PATCH',
              `/items/${pageBlocksCollection.value}/${encodeURIComponent(row.id)}`,
              {},
              payload,
            );
            const updated = normalizeBlockRow(response?.data || { ...row, ...payload });
            blocks.value = blocks.value.map((candidate) => (candidate.id === row.id ? updated : candidate));
            setDraft(row.id, {
              slot: updated.slot,
              sort: updated.sort,
              group_tag: updated.group_tag,
            });
            info.value = `Saved block ${row.id}.`;
          } catch (requestError) {
            error.value = requestError?.message || `Failed to save block ${row.id}.`;
          } finally {
            markSaving(row.id, false);
          }
        };
    
        const saveAll = async () => {
          if (props.disabled) return;
          const changedRows = contextBlocks.value.filter((row) => hasChanges(row));
          if (changedRows.length === 0) return;
          info.value = '';
          error.value = '';
          for (const row of changedRows) {
            await saveRow(row);
            if (error.value) return;
          }
          info.value = `Saved ${changedRows.length} block${changedRows.length === 1 ? '' : 's'}.`;
          await loadBlocks();
        };
    
        const resetRow = (row) => {
          setDraft(row.id, {
            slot: asString(row.slot) || 'main',
            sort: row.sort,
            group_tag: asString(row.group_tag),
          });
        };
    
        const openDrawerItem = (collectionName, primaryKey) => {
          const nextCollection = asString(collectionName);
          const nextPrimaryKey = parseId(primaryKey);
          if (!nextCollection || !nextPrimaryKey) return;
    
          if (!hasDrawerItem) {
            error.value = 'Drawer editor is unavailable. Cannot open editor in-page.';
            return;
          }
    
          if (drawerRefreshTimer) {
            clearTimeout(drawerRefreshTimer);
            drawerRefreshTimer = null;
          }
          drawerSessionKey.value += 1;
          const nextSession = drawerSessionKey.value;
          drawerSavedByInput.value = false;
          drawerSnapshotHash.value = '';
          drawerPendingPatch.value = {};
          drawerCollection.value = nextCollection;
          drawerPrimaryKey.value = nextPrimaryKey;
          drawerActive.value = true;
          void captureDrawerSnapshot(nextCollection, nextPrimaryKey, nextSession);
        };
    
        const detectDrawerSnapshotChange = async (collectionName, primaryKey, beforeSnapshot, sessionToken) => {
          const delays = [0, 220, 420, 760, 1200];
          let latestSnapshot = '';
          for (const waitMs of delays) {
            if (waitMs > 0) await delay(waitMs);
            latestSnapshot = await fetchDrawerSnapshotHash(collectionName, primaryKey);
            if (sessionToken !== drawerSessionKey.value) {
              return { changed: false, latestSnapshot: '' };
            }
            if (beforeSnapshot && latestSnapshot && latestSnapshot !== beforeSnapshot) {
              return { changed: true, latestSnapshot };
            }
          }
          return { changed: false, latestSnapshot };
        };
    
        const handleDrawerActive = async (nextActive) => {
          const shouldBeActive = Boolean(nextActive);
          drawerActive.value = shouldBeActive;
          if (shouldBeActive) return;
    
          const closingCollection = asString(drawerCollection.value);
          const closingPrimaryKey = parseId(drawerPrimaryKey.value);
          const closingSession = drawerSessionKey.value;
          let changedWhileOpen = drawerSavedByInput.value;
          if (!changedWhileOpen) {
            const beforeSnapshot = asString(drawerSnapshotHash.value);
            if (beforeSnapshot && closingCollection && closingPrimaryKey && closingPrimaryKey !== '+') {
              const { changed, latestSnapshot } = await detectDrawerSnapshotChange(
                closingCollection,
                closingPrimaryKey,
                beforeSnapshot,
                closingSession,
              );
              if (changed) {
                changedWhileOpen = true;
                if (latestSnapshot) {
                  drawerSnapshotHash.value = latestSnapshot;
                }
              }
            }
          }
          if (changedWhileOpen) {
            markPageDirtyFromDrawerEdits();
          }
          drawerSavedByInput.value = false;
          drawerPendingPatch.value = {};
    
          // Avoid immediate refresh/unmount races with DrawerItem save handling.
          if (drawerRefreshTimer) {
            clearTimeout(drawerRefreshTimer);
            drawerRefreshTimer = null;
          }
          if (!pageId.value) return;
          drawerRefreshTimer = setTimeout(() => {
            drawerRefreshTimer = null;
            if (!drawerActive.value && pageId.value) {
              void refreshAll();
            }
          }, 1200);
        };
    
        const handleDrawerInput = async (edits) => {
          const collection = asString(drawerCollection.value);
          const primaryKey = parseId(drawerPrimaryKey.value);
          if (!collection || !primaryKey || primaryKey === '+') return;
          if (!edits || typeof edits !== 'object') return;
          const sanitizedPatch = sanitizeDrawerPatchPayload(edits);
          if (Object.keys(sanitizedPatch).length === 0) return;
          drawerPendingPatch.value = sanitizedPatch;
    
          try {
            const response = await apiRequest(
              'PATCH',
              `/items/${collection}/${encodeURIComponent(primaryKey)}`,
              {},
              sanitizedPatch,
            );
    
            const updatedRow = response?.data || null;
            drawerSavedByInput.value = true;
            drawerPendingPatch.value = {};
    
            if (collection === asString(pageBlocksCollection.value) && updatedRow) {
              const normalizedUpdated = normalizeBlockRow(updatedRow);
              blocks.value = blocks.value.map((candidate) => (
                candidate.id === normalizedUpdated.id ? normalizedUpdated : candidate
              ));
              setDraft(normalizedUpdated.id, {
                slot: normalizedUpdated.slot,
                sort: normalizedUpdated.sort,
                group_tag: normalizedUpdated.group_tag,
              });
            }
    
            const nextSnapshot = updatedRow ? toSnapshotHash(updatedRow) : '';
            if (nextSnapshot) {
              drawerSnapshotHash.value = nextSnapshot;
            } else {
              void captureDrawerSnapshot(collection, primaryKey, drawerSessionKey.value);
            }
    
            markPageDirtyFromDrawerEdits();
            info.value = 'Saved drawer edits. Save the page to publish and trigger refresh.';
          } catch (requestError) {
            error.value = requestError?.message || 'Failed to persist drawer edits.';
          }
        };
    
        const openBlockRow = (row) => {
          openDrawerItem(pageBlocksCollection.value, row?.id);
        };
    
        const openContentItem = (row) => {
          if (!row.collection || !row.item) return;
          openDrawerItem(row.collection, row.item);
        };
    
        const resolveDrawerFields = (collectionName) => {
          const key = asString(collectionName).toLowerCase();
          if (!key) return ['*'];
          if (key === asString(pageBlocksCollection.value).toLowerCase()) {
            return ['id', 'slot', 'parent_block_id', 'group_tag', 'sort', 'collection', 'item'];
          }
          if (key === 'cms_block_module') {
            return ['id', 'status', 'module_key', 'props_json', 'module_provider'];
          }
          if (key === 'cms_block_rich_text') {
            return ['id', 'status', 'body'];
          }
          if (key === 'cms_block_hero') {
            return ['id', 'status', 'headline', 'subheadline', 'background_image', 'cta_label', 'cta_url'];
          }
          if (key === 'cms_block_template_ref') {
            return ['id', 'status', 'name', 'template_key'];
          }
          return ['*'];
        };
    
        const drawerFields = computed(() =>
          resolveDrawerFields(drawerCollection.value || pageBlocksCollection.value)
        );
    
        const collectDescendantRowIds = (rootRowId) => {
          const rootId = parseId(rootRowId);
          if (!rootId) return [];
          const childrenByParentId = new Map();
          for (const row of blocks.value) {
            const rowId = parseId(row?.id);
            if (!rowId) continue;
            const parentId = parseId(row?.parent_block_id);
            if (!parentId) continue;
            if (!childrenByParentId.has(parentId)) childrenByParentId.set(parentId, []);
            childrenByParentId.get(parentId).push(rowId);
          }
    
          const ordered = [];
          const stack = [rootId];
          const seen = new Set();
          while (stack.length > 0) {
            const current = stack.pop();
            if (!current || seen.has(current)) continue;
            seen.add(current);
            ordered.push(current);
            const children = childrenByParentId.get(current) || [];
            for (const childId of children) {
              stack.push(childId);
            }
          }
          return ordered;
        };
    
        const deleteBlockRow = async (row) => {
          if (props.disabled) return;
          const rowId = parseId(row?.id);
          if (!rowId || isDeleting(rowId) || isSaving(rowId)) return;
    
          const subtreeIds = collectDescendantRowIds(rowId);
          if (subtreeIds.length === 0) return;
          const subtreeCount = subtreeIds.length;
          const requiresCascadeConfirm = subtreeCount > 1;
          const confirmMessage = requiresCascadeConfirm
            ? `Delete this block and ${subtreeCount - 1} nested block(s)?`
            : 'Delete this block?';
          if (typeof window !== 'undefined' && !window.confirm(confirmMessage)) return;
    
          markDeleting(rowId, true);
          error.value = '';
          info.value = '';
    
          try {
            const rowById = new Map(blocks.value.map((candidate) => [parseId(candidate?.id), candidate]));
            const deletionOrder = [...subtreeIds].sort((left, right) => {
              const leftDepth = asInteger(rowById.get(left)?.tree_depth) ?? 0;
              const rightDepth = asInteger(rowById.get(right)?.tree_depth) ?? 0;
              return rightDepth - leftDepth;
            });
    
            for (const targetId of deletionOrder) {
              await apiRequest(
                'DELETE',
                `/items/${pageBlocksCollection.value}/${encodeURIComponent(targetId)}`,
              );
            }
    
            const deleted = new Set(subtreeIds);
            blocks.value = blocks.value.filter((candidate) => !deleted.has(parseId(candidate?.id)));
    
            const nextDrafts = { ...drafts.value };
            for (const deletedId of deleted) {
              delete nextDrafts[deletedId];
            }
            drafts.value = nextDrafts;
    
            if (
              asString(drawerCollection.value) === asString(pageBlocksCollection.value)
              && deleted.has(parseId(drawerPrimaryKey.value))
            ) {
              drawerActive.value = false;
            }
    
            emit('input', buildRelationManagerValue());
            info.value = `Deleted ${subtreeCount} block${subtreeCount === 1 ? '' : 's'}. Save the page to publish and trigger refresh.`;
            await refreshAll();
          } catch (requestError) {
            error.value = requestError?.message || 'Failed to delete block.';
          } finally {
            markDeleting(rowId, false);
          }
        };
    
        const publishedSiteScopeFilter = () => {
          const siteKey = asString(pageContext.value?.site_key);
          return siteKey
            ? {
                _or: [
                  { site_key: { _empty: true } },
                  { site_key: { _eq: siteKey } },
                ],
              }
            : { site_key: { _empty: true } };
        };
    
        const inferParentBlockIdForContext = () => {
          const contextId = asString(activeContext.value?.value) || PAGE_CONTEXT_ID;
          if (contextId === PAGE_CONTEXT_ID) return '';
          return parseTemplateContextId(contextId);
        };
    
        const inferDefaultSlotForContext = async () => {
          const templateKey = asString(activeContext.value?.template_key);
          if (templateKey) {
            await loadSlotsForTemplate(templateKey);
          }
          const slots = contextTemplateSlots.value;
          if (Array.isArray(slots) && slots.length > 0) {
            if (slots.includes('main')) return 'main';
            return asString(slots[0]) || 'main';
          }
          return 'main';
        };
    
        const inferNextSortForContext = () => {
          const parentBlockId = inferParentBlockIdForContext();
          const siblingSorts = blocks.value
            .filter((row) => {
              const rowParent = parseId(row?.parent_block_id);
              if (parentBlockId) return rowParent === parentBlockId;
              return !rowParent;
            })
            .map((row) => asInteger(row?.sort))
            .filter((value) => Number.isFinite(value));
          if (siblingSorts.length === 0) return 10;
          return Math.max(...siblingSorts) + 10;
        };
    
        const resolveDefaultPublishedModuleKey = async (preferredModuleKey = '', providerFilter = []) => {
          const preferred = asString(preferredModuleKey);
          const normalizedProviders = Array.from(
            new Set(
              (Array.isArray(providerFilter) ? providerFilter : [providerFilter])
                .map((entry) => asString(entry).toLowerCase())
                .filter(Boolean),
            ),
          );
    
          if (moduleRegistryEnabled.value && moduleRegistryUrl.value) {
            if (!Array.isArray(moduleRegistryModules.value) || moduleRegistryModules.value.length === 0) {
              await loadModuleRegistryModules();
            }
            const registryRows = Array.isArray(moduleRegistryModules.value) ? moduleRegistryModules.value : [];
            const matchingRegistryRows = registryRows.filter((row) => {
              if (!row?.module_key) return false;
              if (preferred && row.module_key !== preferred) return false;
              if (normalizedProviders.length > 0) {
                return normalizedProviders.includes(toLower(row.provider));
              }
              return true;
            });
            if (matchingRegistryRows.length > 0) {
              return asString(matchingRegistryRows[0]?.module_key);
            }
          }
    
          const providerClause = normalizedProviders.length === 1
            ? { provider: { _eq: normalizedProviders[0] } }
            : (normalizedProviders.length > 1 ? { provider: { _in: normalizedProviders } } : null);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              publishedSiteScopeFilter(),
              ...(providerClause ? [providerClause] : []),
              ...(preferred ? [{ module_key: { _eq: preferred } }] : []),
            ],
          };
          const response = await apiRequest('GET', '/items/cms_modules', {
            fields: 'module_key,provider,site_key',
            limit: 50,
            sort: 'site_key,provider,module_key',
            filter: JSON.stringify(filter),
          });
          const rows = normalizeRows(response);
          if (!rows.length) return '';
          const siteKey = asString(pageContext.value?.site_key);
          const siteSpecific = rows.find((row) => asString(row?.site_key) === siteKey);
          return asString(siteSpecific?.module_key || rows[0]?.module_key);
        };
    
        const resolveDefaultPublishedTemplateKey = async (preferredTemplateKey = '') => {
          const preferred = asString(preferredTemplateKey);
          const filter = {
            _and: [
              { status: { _eq: 'published' } },
              publishedSiteScopeFilter(),
              ...(preferred ? [{ template_key: { _eq: preferred } }] : []),
            ],
          };
          const response = await apiRequest('GET', '/items/cms_layout_templates', {
            fields: 'template_key,site_key',
            limit: 50,
            sort: 'site_key,template_key',
            filter: JSON.stringify(filter),
          });
          const rows = normalizeRows(response);
          if (!rows.length) return '';
          const siteKey = asString(pageContext.value?.site_key);
          const siteSpecific = rows.find((row) => asString(row?.site_key) === siteKey);
          return asString(siteSpecific?.template_key || rows[0]?.template_key);
        };
    
        const createPageBlockWithContent = async (type) => {
          if (props.disabled || !pageId.value || creatingBlockType.value) return;
          creatingBlockType.value = asString(type);
          error.value = '';
          info.value = '';
    
          try {
            let contentCollection = '';
            let contentPayload = {};
            let preferredEditorCollection = '';
            let preferredEditorId = '';
    
            if (type === 'rich_text') {
              contentCollection = 'cms_block_rich_text';
              contentPayload = {
                status: 'published',
                body: '<p>New content block</p>',
              };
            } else if (type === 'hero') {
              contentCollection = 'cms_block_hero';
              contentPayload = {
                status: 'published',
                headline: 'New hero block',
                subheadline: '',
              };
            } else if (type === 'module') {
              const moduleKey = await resolveDefaultPublishedModuleKey('', ['radix']);
              if (!moduleKey) {
                throw new Error('No published UI modules are available for this site context.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'radix',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'image') {
              const moduleKey = await resolveDefaultPublishedModuleKey('radix-image', ['radix']);
              if (!moduleKey) {
                throw new Error('The radix-image module is not available yet. Deploy modules first.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'radix',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'mfe') {
              const moduleKey = await resolveDefaultPublishedModuleKey('', ['mfe']);
              if (!moduleKey) {
                throw new Error('No published MFE modules are available for this site context.');
              }
              contentCollection = 'cms_block_module';
              contentPayload = {
                status: 'published',
                module_provider: 'mfe',
                module_key: moduleKey,
                props_json: {},
              };
            } else if (type === 'template_ref') {
              const preferredTemplateKey =
                asString(activeContext.value?.template_key)
                || asString(pageContext.value?.layout_template_key);
              const templateKey = await resolveDefaultPublishedTemplateKey(preferredTemplateKey);
              if (!templateKey) {
                throw new Error('No published layout templates are available for this site context.');
              }
              contentCollection = 'cms_block_template_ref';
              contentPayload = {
                status: 'published',
                name: `Template ${templateKey}`,
                template_key: templateKey,
              };
            } else {
              throw new Error(`Unsupported block type: ${type}`);
            }
    
            const createdContent = await apiRequest('POST', `/items/${contentCollection}`, {}, contentPayload);
            const contentId = parseId(createdContent?.data?.id);
            if (!contentId) {
              throw new Error('Block content created but id was missing.');
            }
    
            const parentBlockId = inferParentBlockIdForContext();
            const defaultSlot = await inferDefaultSlotForContext();
            const blockPayload = {
              page_id: pageId.value,
              collection: contentCollection,
              item: contentId,
              slot: defaultSlot,
              sort: inferNextSortForContext(),
              parent_block_id: parentBlockId || null,
            };
    
            const createdLink = await apiRequest('POST', `/items/${pageBlocksCollection.value}`, {}, blockPayload);
            const linkId = parseId(createdLink?.data?.id);
    
            info.value = `Created ${collectionDisplayName(contentCollection)} block.`;
            await refreshAll();
    
            preferredEditorCollection = contentCollection;
            preferredEditorId = contentId;
    
            if (preferredEditorCollection && preferredEditorId) {
              openDrawerItem(preferredEditorCollection, preferredEditorId);
            } else if (linkId) {
