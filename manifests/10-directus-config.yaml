            const schemaFormat = asString(schema?.format).toLowerCase();
            const showImagePreview =
              schemaFormat === 'image' ||
              /(image|icon|logo|avatar|thumbnail|sprite|background|poster|favicon|hero)/i.test(propKey);
    
            const pickerButtons = supportsAssetPicker
              ? h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '6px' } }, [
                  renderButtonControl({
                    label: isPickerOpen ? 'Close Library' : 'Browse Files',
                    disabled: disabled,
                    onClick: () => { void toggleAssetPicker(propKey); },
                  }),
                  renderButtonControl({
                    label: assetPickerUploading.value && isPickerOpen ? 'Uploading...' : 'Upload File',
                    disabled: disabled || assetPickerUploading.value,
                    onClick: () => { openAssetUploadChooser(propKey); },
                  }),
                  renderButtonControl({
                    label: 'Clear',
                    disabled: disabled || !currentValue,
                    onClick: () => setPropertyValue(propKey, ''),
                  }),
                ])
              : null;
    
            const pickerPanel = supportsAssetPicker && isPickerOpen
              ? h('section', {
                  style: {
                    border: '1px solid var(--theme--border-subdued)',
                    borderRadius: '8px',
                    padding: '10px',
                    marginTop: '8px',
                    background: 'var(--theme--background-subdued)',
                    display: 'grid',
                    gap: '8px',
                    maxHeight: '300px',
                    overflow: 'auto',
                  },
                }, [
                  h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } }, [
                    h('div', { style: { flex: '1 1 auto' } }, [
                      renderInputControl({
                        id: `${inputId}-asset-search`,
                        type: 'search',
