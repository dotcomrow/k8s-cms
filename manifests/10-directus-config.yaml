            }

            const nextSnapshot = updatedRow ? toSnapshotHash(updatedRow) : '';
            if (nextSnapshot) {
              drawerSnapshotHash.value = nextSnapshot;
            } else {
              void captureDrawerSnapshot(collection, primaryKey, drawerSessionKey.value);
