            const sortedSourceRows = [...sourceRows].sort((left, right) => {
              const leftDepth = asInteger(left?.tree_depth) ?? 0;
              const rightDepth = asInteger(right?.tree_depth) ?? 0;
              if (leftDepth !== rightDepth) return leftDepth - rightDepth;
