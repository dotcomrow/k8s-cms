          };
          const response = await apiRequest('GET', `/items/${pagesCollection.value}`, {
            fields: 'id,slug,site_key,release_channel',
            limit: 1,
            sort: '-date_updated',
            filter: JSON.stringify(filter),
          });
          const rows = normalizeRows(response);
          return rows[0] || null;
        };
    
        const listBlocksForPage = async (targetPageId) => {
          const normalizedPageId = parseId(targetPageId);
          if (!normalizedPageId) return [];
