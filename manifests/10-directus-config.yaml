              {
                type: 'button',
                disabled,
                title: label,
                'aria-label': label,
                onClick,
                style: {
                  ...styles.iconButtonFallback,
                  ...(danger
                    ? {
                        border: '1px solid var(--theme--danger)',
                        color: 'var(--theme--danger)',
                      }
                    : {}),
                },
              },
              fallbackIcon
            );
          };
    
          const renderMetaChip = (text) => {
