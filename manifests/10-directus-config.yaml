  cms-asset-url-picker.index.js: |
    import { defineInterface } from '@directus/extensions-sdk';
    import { defineComponent, h, ref, computed, watch, resolveComponent } from 'vue';

    const asString = (value) => {
      if (value === null || value === undefined) return '';
      return String(value).trim();
    };

    const asInteger = (value, fallback) => {
      const parsed = Number.parseInt(asString(value), 10);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    };

    const parseOptions = (value) => {
      if (!value) return {};
      if (typeof value === 'string') {
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }
      return typeof value === 'object' ? value : {};
    };

    const normalizeRows = (response) => {
      const payload = response?.data;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload)) return payload;
      return [];
    };

    const defaultAssetPath = '/assets';

    const InterfaceComponent = defineComponent({
      name: 'CmsAssetUrlPicker',
      props: {
        value: { type: [String, Number, Object, null], default: null },
        disabled: { type: Boolean, default: false },
        options: { type: Object, default: () => ({}) },
        field: { type: String, default: '' },
        collection: { type: String, default: '' },
      },
      emits: ['input'],
      setup(props, { emit }) {
        const pickerOpen = ref(false);
        const loading = ref(false);
        const uploading = ref(false);
        const error = ref('');
        const query = ref('');
        const files = ref([]);
        const hiddenFileInput = ref(null);

        const resolvedOptions = computed(() => parseOptions(props.options));
        const storeAbsoluteUrl = computed(() => {
          const raw = asString(resolvedOptions.value?.store_absolute_url).toLowerCase();
          if (['0', 'false', 'no', 'off'].includes(raw)) return false;
          return true;
        });
        const assetPath = computed(() => {
          const configured = asString(resolvedOptions.value?.asset_path);
