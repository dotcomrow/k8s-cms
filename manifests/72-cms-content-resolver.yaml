apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-content-resolver
  namespace: directus
data:
  requirements.txt: |
    confluent-kafka==2.6.1
    fastapi==0.115.5
    httpx==0.27.2
    uvicorn==0.30.6
  openapi.yaml: |
    openapi: 3.0.3
    info:
      title: CMS Content Resolver API
      version: 1.0.0
      description: Resolves CMS content item JSON for a required requested language and queues translation misses.
    servers:
      - url: http://cms-content-resolver.directus.svc.cluster.local:8080
    paths:
      /hasura/actions/resolve-content:
        post:
          operationId: resolve_cms_content
          summary: Resolve content items for a requested language
          description: Hasura action surface for language-aware CMS content resolution.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ResolveContentRequest"
          responses:
            "200":
              description: Resolved content items
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ResolveContentResponse"
    components:
      schemas:
        ContentItem:
          type: object
          required: [id, content_json]
          properties:
            id:
              type: string
            content_key:
              type: string
            name:
              type: string
            default_language_code:
              type: string
              default: en
            content_version:
              type: integer
            source_hash:
              type: string
            source_kind:
              type: string
            content_json:
              type: object
        ContentRef:
          type: object
          properties:
            id:
              type: string
            content_item_id:
              type: string
            page_slug:
              type: string
            refresh_target:
              type: string
        ResolveContentRequest:
          type: object
          required: [language, content_items]
          properties:
            language:
              type: string
            site_key:
              type: string
            release_channel:
              type: string
            page_slug:
              type: string
            content_items:
              type: array
              items:
                $ref: "#/components/schemas/ContentItem"
            content_refs:
              type: array
              items:
                $ref: "#/components/schemas/ContentRef"
        ResolveContentItem:
          type: object
          required: [content_item_id, requested_language_code, resolved_language_code, fallback_used, content_json]
          properties:
            content_item_id:
              type: string
            requested_language_code:
              type: string
            resolved_language_code:
              type: string
            fallback_used:
              type: boolean
            stale:
              type: boolean
            source_content_version:
              type: integer
            content_json:
              type: object
        ResolveContentResponse:
          type: object
          required: [ok, language, items]
          properties:
            ok:
              type: boolean
            language:
              type: string
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResolveContentItem"
        UpsertTranslationRequest:
          type: object
          required: [content_item_id, language_code, source_content_version, content_json]
          properties:
            content_item_id:
              type: string
            language_code:
              type: string
            status:
              type: string
              default: published
            source_content_version:
              type: integer
            source_hash:
              type: string
            content_json:
              type: object
            model:
              type: string
            prompt_version:
              type: string
            translated_by:
              type: string
  app.py: |
    import json
    import os
    import re
    import threading
    import time
    from datetime import datetime, timezone
    from typing import Any, Dict, List, Optional

    import httpx
    from confluent_kafka import Producer
    from fastapi import FastAPI, Header, HTTPException, Request
    from pydantic import BaseModel, Field, field_validator

    APP_VERSION = "1.2.0"
    DEFAULT_LANGUAGE = "en"
    LANGUAGE_PATTERN = re.compile(r"^[A-Za-z]{1,8}(?:-[A-Za-z0-9]{1,8}){0,8}$")
    SYNTHETIC_BLOCK_CONTENT_KEY_PREFIX = "cms_block_"

    DIRECTUS_BASE_URL = os.environ.get(
      "DIRECTUS_BASE_URL",
      "http://directus-service.directus.svc.cluster.local:8055",
    ).rstrip("/")
    DIRECTUS_STATIC_TOKEN = os.environ.get("DIRECTUS_STATIC_TOKEN", "").strip()
    DIRECTUS_TOKEN_VAULT_PATH = os.environ.get("DIRECTUS_TOKEN_VAULT_PATH", "secret/data/directus/gravitee/openapi/admin")
    DIRECTUS_TOKEN_VAULT_KEY = os.environ.get("DIRECTUS_TOKEN_VAULT_KEY", "token")
    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.vault.svc.cluster.local:8200").rstrip("/")
    VAULT_TOKEN_FILE = os.environ.get("VAULT_TOKEN_FILE", "/vault-secrets/vault-token")
    TOKEN_CACHE_SECONDS = int(os.environ.get("TOKEN_CACHE_SECONDS", "300"))

    KAFKA_BOOTSTRAP_SERVERS = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "kafka.kafka.svc.internal.lan:9092")
    KAFKA_SECURITY_PROTOCOL = os.environ.get("KAFKA_SECURITY_PROTOCOL", "SASL_PLAINTEXT")
    KAFKA_SASL_MECHANISM = os.environ.get("KAFKA_SASL_MECHANISM", "SCRAM-SHA-256")
    KAFKA_USERNAME = os.environ.get("KAFKA_USERNAME", "").strip()
    KAFKA_PASSWORD = os.environ.get("KAFKA_PASSWORD", "").strip()
    KAFKA_USERNAME_VAULT_PATH = os.environ.get("KAFKA_USERNAME_VAULT_PATH", "secret/data/kafka-scram-user-cms-content-resolver")
    KAFKA_USERNAME_VAULT_KEY = os.environ.get("KAFKA_USERNAME_VAULT_KEY", "value")
    KAFKA_PASSWORD_VAULT_PATH = os.environ.get("KAFKA_PASSWORD_VAULT_PATH", "secret/data/kafka-scram-user-cms-content-resolver-password")
    KAFKA_PASSWORD_VAULT_KEY = os.environ.get("KAFKA_PASSWORD_VAULT_KEY", "value")
    KAFKA_TRANSLATION_TOPIC = os.environ.get("KAFKA_TRANSLATION_TOPIC", "batch.cms.content.translation.requests.v1")

    REQUEST_TIMEOUT_SECONDS = float(os.environ.get("REQUEST_TIMEOUT_SECONDS", "8"))
    TRANSLATION_VALIDATION_MAX_ERRORS = int(os.environ.get("TRANSLATION_VALIDATION_MAX_ERRORS", "25"))
    TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS = int(os.environ.get("TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS", "3600"))
    ACTIVE_TRANSLATION_JOB_STATUSES = {"queued", "processing"}
    CONTENT_RESOLVER_BEARER_TOKEN = os.environ.get("CONTENT_RESOLVER_BEARER_TOKEN", "").strip()
    CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH = os.environ.get(
      "CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH",
      "secret/data/cms-content-resolver",
    ).strip()
    CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY = os.environ.get("CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY", "token").strip()

    _vault_cache: Dict[str, tuple[float, str]] = {}
    _vault_lock = threading.Lock()
    _producer: Optional[Producer] = None
    _producer_lock = threading.Lock()

    app = FastAPI(title="CMS Content Resolver API", version=APP_VERSION)

    def normalize_language(value: str) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or candidate == "*" or not LANGUAGE_PATTERN.match(candidate):
        return DEFAULT_LANGUAGE
      return candidate

    def _read_vault_token() -> str:
      try:
        with open(VAULT_TOKEN_FILE, "r", encoding="utf-8") as handle:
          return handle.read().strip()
      except FileNotFoundError:
        return ""

    async def vault_value(path: str, key: str) -> str:
      cache_key = f"{path}#{key}"
      now = time.time()
      with _vault_lock:
        cached = _vault_cache.get(cache_key)
        if cached and cached[0] > now:
          return cached[1]
      token = _read_vault_token()
      if not token:
        return ""
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(f"{VAULT_ADDR}/v1/{path}", headers={"X-Vault-Token": token})
        response.raise_for_status()
      value = str(response.json().get("data", {}).get("data", {}).get(key, "")).strip()
      with _vault_lock:
        _vault_cache[cache_key] = (now + TOKEN_CACHE_SECONDS, value)
      return value

    async def directus_token() -> str:
      if DIRECTUS_STATIC_TOKEN:
        return DIRECTUS_STATIC_TOKEN
      return await vault_value(DIRECTUS_TOKEN_VAULT_PATH, DIRECTUS_TOKEN_VAULT_KEY)

    async def kafka_credentials() -> tuple[str, str]:
      username = KAFKA_USERNAME or await vault_value(KAFKA_USERNAME_VAULT_PATH, KAFKA_USERNAME_VAULT_KEY)
      password = KAFKA_PASSWORD or await vault_value(KAFKA_PASSWORD_VAULT_PATH, KAFKA_PASSWORD_VAULT_KEY)
      return username, password

    async def kafka_producer() -> Optional[Producer]:
      global _producer
      if _producer is not None:
        return _producer
      username, password = await kafka_credentials()
      if not username or not password:
        return None
      with _producer_lock:
        if _producer is None:
          _producer = Producer({
            "bootstrap.servers": KAFKA_BOOTSTRAP_SERVERS,
            "security.protocol": KAFKA_SECURITY_PROTOCOL,
            "sasl.mechanism": KAFKA_SASL_MECHANISM,
            "sasl.username": username,
            "sasl.password": password,
            "client.id": "cms-content-resolver",
          })
      return _producer

    class ContentItem(BaseModel):
      id: str
      content_key: Optional[str] = None
      name: Optional[str] = None
      default_language_code: str = DEFAULT_LANGUAGE
      content_version: Optional[int] = None
      source_hash: Optional[str] = None
      source_kind: Optional[str] = None
      content_json: Dict[str, Any] = Field(default_factory=dict)

      @field_validator("default_language_code")
      @classmethod
      def normalize_default_language(cls, value: str) -> str:
        return normalize_language(value)

    class ContentRef(BaseModel):
      id: Optional[str] = None
      content_item_id: Optional[str] = None
      page_slug: Optional[str] = None
      refresh_target: Optional[str] = None

    class ResolveContentRequest(BaseModel):
      language: str
      site_key: Optional[str] = None
      release_channel: Optional[str] = None
      page_slug: Optional[str] = None
      content_items: List[ContentItem]
      content_refs: List[ContentRef] = Field(default_factory=list)

      @field_validator("language")
      @classmethod
      def normalize_requested_language(cls, value: str) -> str:
        normalized = normalize_language(value)
        if not normalized:
          raise ValueError("language is required")
        return normalized

    class UpsertTranslationRequest(BaseModel):
      content_item_id: str
      language_code: str
      status: str = "published"
      source_content_version: int
      source_hash: Optional[str] = None
      content_json: Dict[str, Any]
      model: Optional[str] = None
      prompt_version: Optional[str] = None
      translated_by: Optional[str] = None

      @field_validator("language_code")
      @classmethod
      def normalize_translation_language(cls, value: str) -> str:
        return normalize_language(value)

    class InvalidTranslationContentError(Exception):
      pass

    def json_kind(value: Any) -> str:
      if value is None:
        return "null"
      if isinstance(value, bool):
        return "boolean"
      if isinstance(value, dict):
        return "object"
      if isinstance(value, list):
        return "array"
      if isinstance(value, str):
        return "string"
      if isinstance(value, (int, float)):
        return "number"
      return type(value).__name__

    def append_validation_error(errors: List[str], message: str) -> bool:
      if len(errors) < TRANSLATION_VALIDATION_MAX_ERRORS:
        errors.append(message)
      return len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS

    def collect_content_json_shape_errors(source: Any, translated: Any, path: str = "$", errors: Optional[List[str]] = None) -> List[str]:
      if errors is None:
        errors = []
      if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
        return errors

      if isinstance(source, dict):
        if not isinstance(translated, dict):
          append_validation_error(errors, f"{path}: expected object, got {json_kind(translated)}")
          return errors
        source_keys = set(source.keys())
        translated_keys = set(translated.keys())
        for key in sorted(source_keys - translated_keys):
          if append_validation_error(errors, f"{path}.{key}: missing translated key"):
            return errors
        for key in sorted(translated_keys - source_keys):
          if append_validation_error(errors, f"{path}.{key}: unexpected translated key"):
            return errors
        for key in sorted(source_keys & translated_keys):
          collect_content_json_shape_errors(source[key], translated[key], f"{path}.{key}", errors)
          if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
            return errors
        return errors

      if isinstance(source, list):
        if not isinstance(translated, list):
          append_validation_error(errors, f"{path}: expected array, got {json_kind(translated)}")
          return errors
        if len(source) != len(translated):
          append_validation_error(errors, f"{path}: expected array length {len(source)}, got {len(translated)}")
          return errors
        for index, source_item in enumerate(source):
          collect_content_json_shape_errors(source_item, translated[index], f"{path}[{index}]", errors)
          if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
            return errors
        return errors

      if isinstance(source, str):
        if not isinstance(translated, str):
          append_validation_error(errors, f"{path}: expected string, got {json_kind(translated)}")
        elif source.strip() and not translated.strip():
          append_validation_error(errors, f"{path}: translated string is empty")
        return errors

      if isinstance(source, bool):
        if not isinstance(translated, bool):
          append_validation_error(errors, f"{path}: expected boolean, got {json_kind(translated)}")
        return errors

      if isinstance(source, (int, float)) and not isinstance(source, bool):
        if not isinstance(translated, (int, float)) or isinstance(translated, bool):
          append_validation_error(errors, f"{path}: expected number, got {json_kind(translated)}")
        return errors

      if source is None:
        return errors

      if type(source) is not type(translated):
        append_validation_error(errors, f"{path}: expected {json_kind(source)}, got {json_kind(translated)}")
      return errors

    def validate_translation_content_json(source_content_json: Any, translated_content_json: Any) -> List[str]:
      if not isinstance(source_content_json, dict):
        return [f"$: source content_json must be object, got {json_kind(source_content_json)}"]
      if not isinstance(translated_content_json, dict):
        return [f"$: translated content_json must be object, got {json_kind(translated_content_json)}"]
      return collect_content_json_shape_errors(source_content_json, translated_content_json)

    async def fetch_source_content_item(content_item_id: str) -> Optional[Dict[str, Any]]:
      headers = await directus_headers()
      params = {
        "fields": "id,content_json,content_version",
        "limit": "1",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_items/{content_item_id}",
          headers=headers,
          params=params,
        )
        if response.status_code == 404:
          return None
        response.raise_for_status()
      data = response.json().get("data")
      return data if isinstance(data, dict) else None

    def fallback_item(item: ContentItem, requested_language: str, stale: bool = False) -> Dict[str, Any]:
      return {
        "content_item_id": item.id,
        "requested_language_code": requested_language,
        "resolved_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "fallback_used": requested_language.lower() != (item.default_language_code or DEFAULT_LANGUAGE).lower(),
        "stale": stale,
        "source_content_version": item.content_version,
        "content_json": item.content_json,
      }

    async def fetch_translation(item: ContentItem, language: str) -> Optional[Dict[str, Any]]:
      token = await directus_token()
      headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"} if token else {"Accept": "application/json"}
      params = {
        "filter[content_item_id][_eq]": item.id,
        "filter[language_code][_eq]": language,
        "filter[status][_eq]": "published",
        "fields": "id,content_item_id,language_code,status,content_json,source_content_version,source_hash,model,prompt_version,translated_by",
        "limit": "1",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
          headers=headers,
          params=params,
        )
        response.raise_for_status()
      data = response.json().get("data", [])
      if not data:
        return None
      translation = data[0]
      if translation.get("source_content_version") != item.content_version:
        return None
      if item.source_hash and str(translation.get("source_hash") or "").strip() != item.source_hash:
        return None
      content_json = translation.get("content_json")
      if not isinstance(content_json, dict):
        return None
      validation_errors = validate_translation_content_json(item.content_json, content_json)
      if validation_errors:
        print(json.dumps({
          "event": "translation_content_json_invalid",
          "content_item_id": item.id,
          "language_code": language,
          "errors": validation_errors,
        }), flush=True)
        raise InvalidTranslationContentError("translation content_json does not match source content_json")
      return {
        "content_item_id": item.id,
        "requested_language_code": language,
        "resolved_language_code": language,
        "fallback_used": False,
        "stale": False,
        "source_content_version": item.content_version,
        "source_hash": translation.get("source_hash"),
        "model": translation.get("model"),
        "prompt_version": translation.get("prompt_version"),
        "translated_by": translation.get("translated_by"),
        "content_json": content_json,
      }

    async def directus_headers() -> Dict[str, str]:
      token = await directus_token()
      headers = {"Accept": "application/json", "Content-Type": "application/json"}
      if token:
        headers["Authorization"] = f"Bearer {token}"
      return headers

    def source_version_for_job(item: ContentItem) -> int:
      return int(item.content_version or 0)

    def translation_job_key(item: ContentItem, language: str) -> str:
      return f"{item.id}:{language}:{source_version_for_job(item)}"

    def parse_directus_datetime(value: Any) -> Optional[datetime]:
      if not value:
        return None
      candidate = str(value).strip()
      if not candidate:
        return None
      if candidate.endswith("Z"):
        candidate = f"{candidate[:-1]}+00:00"
      try:
        parsed = datetime.fromisoformat(candidate)
      except ValueError:
        return None
      if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
      return parsed

    def translation_job_is_expired(job: Dict[str, Any]) -> bool:
      if TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS <= 0:
        return False
      timestamp = parse_directus_datetime(job.get("date_updated") or job.get("date_created"))
      if timestamp is None:
        return False
      age_seconds = (datetime.now(timezone.utc) - timestamp.astimezone(timezone.utc)).total_seconds()
      return age_seconds > TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS

    async def find_active_translation_jobs(content_item_id: str, language_code: str, source_content_version: int) -> List[Dict[str, Any]]:
      headers = await directus_headers()
      params = {
        "filter[content_item_id][_eq]": content_item_id,
        "filter[language_code][_eq]": language_code,
        "filter[source_content_version][_eq]": str(source_content_version),
        "fields": "id,status,attempt_count,date_created,date_updated,date_completed",
        "sort": "-date_created",
        "limit": "10",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs",
          headers=headers,
          params=params,
        )
        response.raise_for_status()
      rows = response.json().get("data", [])
      if not isinstance(rows, list):
        return []
      return [
        row for row in rows
        if str(row.get("status") or "").strip().lower() in ACTIVE_TRANSLATION_JOB_STATUSES
      ]

    async def create_translation_job(payload: ResolveContentRequest, item: ContentItem, reason: str, kafka_key: str) -> tuple[bool, Optional[str]]:
      source_content_version = source_version_for_job(item)
      existing_jobs = await find_active_translation_jobs(item.id, payload.language, source_content_version)
      if existing_jobs:
        await expire_stale_translation_jobs_safely(existing_jobs)
        existing_jobs = await find_active_translation_jobs(item.id, payload.language, source_content_version)
      if existing_jobs:
        return False, str(existing_jobs[0].get("id") or "").strip() or None
      headers = await directus_headers()
      body = {
        "content_item_id": item.id,
        "language_code": payload.language,
        "source_content_version": source_content_version,
        "source_hash": item.source_hash,
        "status": "queued",
        "reason": reason,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "page_slug": payload.page_slug,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
        "kafka_key": kafka_key,
        "attempt_count": 0,
      }
      body = {key: value for key, value in body.items() if value is not None}
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.post(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs",
          headers=headers,
          json=body,
        )
      if response.status_code >= 400:
        existing_jobs = await find_active_translation_jobs(item.id, payload.language, source_content_version)
        if existing_jobs:
          await expire_stale_translation_jobs_safely(existing_jobs)
          existing_jobs = await find_active_translation_jobs(item.id, payload.language, source_content_version)
        if existing_jobs:
          return False, str(existing_jobs[0].get("id") or "").strip() or None
        response.raise_for_status()
      data = response.json().get("data", {})
      return True, str(data.get("id") or "").strip() or None

    async def patch_translation_job(job_id: str, status: str, last_error: Optional[str] = None) -> None:
      if not job_id:
        return
      headers = await directus_headers()
      now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
      body: Dict[str, Any] = {
        "status": status,
        "date_updated": now,
      }
      if status not in ACTIVE_TRANSLATION_JOB_STATUSES:
        body["date_completed"] = now
      if last_error:
        body["last_error"] = last_error[:2000]
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.patch(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs/{job_id}",
          headers=headers,
          json=body,
        )
        response.raise_for_status()

    async def patch_translation_job_safely(job_id: Optional[str], status: str, last_error: Optional[str] = None) -> None:
      try:
        await patch_translation_job(job_id or "", status, last_error)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_status_update_failed",
          "translation_job_id": job_id,
          "status": status,
          "error": str(exc),
        }), flush=True)

    async def expire_stale_translation_jobs_safely(jobs: List[Dict[str, Any]]) -> None:
      for job in jobs:
        if not translation_job_is_expired(job):
          continue
        job_id = str(job.get("id") or "").strip()
        await patch_translation_job_safely(job_id, "failed", "translation_job_active_timeout")

    async def mark_active_translation_jobs(content_item_id: str, language_code: str, source_content_version: int, status: str, last_error: Optional[str] = None) -> None:
      jobs = await find_active_translation_jobs(content_item_id, language_code, source_content_version)
      for job in jobs:
        await patch_translation_job(str(job.get("id") or "").strip(), status, last_error)

    async def mark_translation_jobs_safely(content_item_id: str, language_code: str, source_content_version: int, status: str, last_error: Optional[str] = None) -> None:
      try:
        await mark_active_translation_jobs(content_item_id, language_code, source_content_version, status, last_error)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_status_update_failed",
          "content_item_id": content_item_id,
          "language_code": language_code,
          "source_content_version": source_content_version,
          "status": status,
          "error": str(exc),
        }), flush=True)

    def is_synthetic_block_content_item(item: ContentItem) -> bool:
      return item.source_kind == "cms_block" and bool((item.content_key or "").startswith(SYNTHETIC_BLOCK_CONTENT_KEY_PREFIX))

    def directus_content_item_body(payload: ResolveContentRequest, item: ContentItem, include_id: bool = False) -> Dict[str, Any]:
      body: Dict[str, Any] = {
        "status": "published",
        "content_key": item.content_key,
        "name": item.name or item.content_key or item.id,
        "default_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "content_version": item.content_version,
        "content_json": item.content_json,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "refresh_target": "both",
      }
      if include_id:
        body["id"] = item.id
      return {key: value for key, value in body.items() if value is not None}

    async def ensure_synthetic_content_item(payload: ResolveContentRequest, item: ContentItem) -> None:
      if not is_synthetic_block_content_item(item):
        return
      headers = await directus_headers()
      create_body = directus_content_item_body(payload, item, include_id=True)
      patch_body = directus_content_item_body(payload, item, include_id=False)
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        existing = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_items/{item.id}",
          headers=headers,
          params={"fields": "id"},
        )
        if existing.status_code == 404:
          response = await client.post(
            f"{DIRECTUS_BASE_URL}/items/cms_content_items",
            headers=headers,
            json=create_body,
          )
        else:
          existing.raise_for_status()
          response = await client.patch(
            f"{DIRECTUS_BASE_URL}/items/cms_content_items/{item.id}",
            headers=headers,
            json=patch_body,
          )
        response.raise_for_status()

    async def find_translation_id(content_item_id: str, language_code: str) -> Optional[str]:
      headers = await directus_headers()
      params = {
        "filter[content_item_id][_eq]": content_item_id,
        "filter[language_code][_eq]": language_code,
        "fields": "id",
        "limit": "1",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
          headers=headers,
          params=params,
        )
        response.raise_for_status()
      data = response.json().get("data", [])
      if not data:
        return None
      return str(data[0].get("id") or "").strip() or None

    async def upsert_translation(payload: UpsertTranslationRequest) -> Dict[str, Any]:
      headers = await directus_headers()
      source_item = await fetch_source_content_item(payload.content_item_id)
      if source_item is None:
        await mark_translation_jobs_safely(
          payload.content_item_id,
          payload.language_code,
          payload.source_content_version,
          "failed",
          "source_content_item_not_found",
        )
        raise HTTPException(status_code=422, detail={
          "error": "source_content_item_not_found",
          "content_item_id": payload.content_item_id,
        })
      source_content_json = source_item.get("content_json")
      validation_errors = validate_translation_content_json(source_content_json, payload.content_json)
      if validation_errors:
        await mark_translation_jobs_safely(
          payload.content_item_id,
          payload.language_code,
          payload.source_content_version,
          "failed",
          "translation_content_json_shape_mismatch",
        )
        raise HTTPException(status_code=422, detail={
          "error": "translation_content_json_shape_mismatch",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
          "errors": validation_errors,
        })
      source_content_version = source_item.get("content_version")
      if source_content_version is not None and payload.source_content_version != source_content_version:
        await mark_translation_jobs_safely(
          payload.content_item_id,
          payload.language_code,
          payload.source_content_version,
          "failed",
          "translation_source_version_stale",
        )
        raise HTTPException(status_code=409, detail={
          "error": "translation_source_version_stale",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
          "expected_source_content_version": source_content_version,
          "received_source_content_version": payload.source_content_version,
        })
      source_hash = str(source_item.get("source_hash") or "").strip()
      payload_hash = str(payload.source_hash or "").strip()
      if source_hash and payload_hash and payload_hash != source_hash:
        await mark_translation_jobs_safely(
          payload.content_item_id,
          payload.language_code,
          payload.source_content_version,
          "failed",
          "translation_source_hash_stale",
        )
        raise HTTPException(status_code=409, detail={
          "error": "translation_source_hash_stale",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
        })
      body = {
        "content_item_id": payload.content_item_id,
        "language_code": payload.language_code,
        "status": payload.status,
        "source_content_version": payload.source_content_version,
        "source_hash": payload.source_hash,
        "content_json": payload.content_json,
        "model": payload.model,
        "prompt_version": payload.prompt_version,
        "translated_by": payload.translated_by,
      }
      existing_id = await find_translation_id(payload.content_item_id, payload.language_code)
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        if existing_id:
          response = await client.patch(
            f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations/{existing_id}",
            headers=headers,
            json=body,
          )
        else:
          response = await client.post(
            f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
            headers=headers,
            json=body,
          )
          if response.status_code >= 400:
            duplicate_id = await find_translation_id(payload.content_item_id, payload.language_code)
            if duplicate_id:
              existing_id = duplicate_id
              response = await client.patch(
                f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations/{duplicate_id}",
                headers=headers,
                json=body,
              )
        response.raise_for_status()
      data = response.json().get("data", {})
      await mark_translation_jobs_safely(
        payload.content_item_id,
        payload.language_code,
        payload.source_content_version,
        "succeeded",
      )
      return {
        "ok": True,
        "mode": "update" if existing_id else "create",
        "id": data.get("id", existing_id),
        "content_item_id": payload.content_item_id,
        "language_code": payload.language_code,
        "source_content_version": payload.source_content_version,
      }

    async def enqueue_translation_request(payload: ResolveContentRequest, item: ContentItem, reason: str) -> bool:
      key = translation_job_key(item, payload.language)
      try:
        job_created, job_id = await create_translation_job(payload, item, reason, key)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_claim_failed",
          "content_item_id": item.id,
          "language_code": payload.language,
          "source_content_version": source_version_for_job(item),
          "error": str(exc),
        }), flush=True)
        return False
      if not job_created:
        print(json.dumps({
          "event": "translation_request_already_in_progress",
          "content_item_id": item.id,
          "language_code": payload.language,
          "source_content_version": source_version_for_job(item),
          "translation_job_id": job_id,
        }), flush=True)
        return False
      producer = await kafka_producer()
      if producer is None:
        await patch_translation_job_safely(job_id, "failed", "kafka_producer_unavailable")
        return False
      refs = [ref.model_dump() for ref in payload.content_refs if ref.content_item_id == item.id]
      message = {
        "schema_version": "cms-content-translation-request.v1",
        "reason": reason,
        "translation_job_id": job_id,
        "requested_language_code": payload.language,
        "source_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "page_slug": payload.page_slug,
        "content_item": {
          "id": item.id,
          "content_key": item.content_key,
          "name": item.name,
          "content_version": item.content_version,
          "source_hash": item.source_hash,
          "content_json": item.content_json,
        },
        "content_refs": refs,
      }
      try:
        producer.produce(
          KAFKA_TRANSLATION_TOPIC,
          key=key.encode("utf-8"),
          value=json.dumps(message, separators=(",", ":")).encode("utf-8"),
        )
        producer.poll(0)
        producer.flush(5)
      except Exception as exc:
        await patch_translation_job_safely(job_id, "failed", f"kafka_publish_failed: {exc}")
        return False
      return True

    async def resolver_bearer_token() -> str:
      if CONTENT_RESOLVER_BEARER_TOKEN:
        return CONTENT_RESOLVER_BEARER_TOKEN
      if CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH:
        return await vault_value(CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH, CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY or "token")
      return ""

    async def require_auth(authorization: Optional[str]) -> None:
      try:
        token = await resolver_bearer_token()
      except Exception as exc:
        raise HTTPException(status_code=503, detail="Resolver auth token unavailable") from exc
      if not token:
        return
      expected = f"Bearer {token}"
      if authorization != expected:
        raise HTTPException(status_code=401, detail="Unauthorized")

    @app.get("/healthz")
    async def healthz() -> Dict[str, Any]:
      return {
        "ok": True,
        "version": APP_VERSION,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
        "has_vault_token": bool(_read_vault_token()),
        "resolver_auth_configured": bool(CONTENT_RESOLVER_BEARER_TOKEN or CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH),
      }

    async def resolve_content_payload(payload: ResolveContentRequest) -> Dict[str, Any]:
      items: List[Dict[str, Any]] = []
      for item in payload.content_items:
        if payload.language.lower() == (item.default_language_code or DEFAULT_LANGUAGE).lower():
          items.append(fallback_item(item, payload.language, stale=False))
          continue
        reason = "missing_or_stale"
        try:
          translation = await fetch_translation(item, payload.language)
        except InvalidTranslationContentError:
          translation = None
          reason = "invalid_translation_content_json"
        except Exception:
          translation = None
          reason = "translation_lookup_failed"
        if translation:
          items.append(translation)
          continue
        try:
          await ensure_synthetic_content_item(payload, item)
        except Exception:
          reason = f"{reason}_source_sync_failed"
        await enqueue_translation_request(payload, item, reason)
        items.append(fallback_item(item, payload.language, stale=True))
      return {"ok": True, "language": payload.language, "items": items}

    @app.post("/content/resolve")
    async def resolve_content(payload: ResolveContentRequest, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      await require_auth(authorization)
      return await resolve_content_payload(payload)

    @app.post("/hasura/actions/resolve-content")
    async def resolve_content_action(request: Request, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      envelope = await request.json()
      payload = ResolveContentRequest.model_validate(envelope.get("input", envelope))
      return await resolve_content_payload(payload)

    @app.post("/content/translations/upsert")
    async def upsert_content_translation(payload: UpsertTranslationRequest, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      return await upsert_translation(payload)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-cms-content-resolver
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-content-resolver
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: cms-content-resolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-content-resolver
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: cms-content-resolver
    spec:
      serviceAccountName: directus
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: cms-content-resolver
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: DIRECTUS_BASE_URL
              value: "http://directus-service.directus.svc.cluster.local:8055"
            - name: DIRECTUS_TOKEN_VAULT_PATH
              value: "secret/data/directus/gravitee/openapi/admin"
            - name: DIRECTUS_TOKEN_VAULT_KEY
              value: "token"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.internal.lan:9092"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: KAFKA_SASL_MECHANISM
              value: "SCRAM-SHA-256"
            - name: KAFKA_TRANSLATION_TOPIC
              value: "batch.cms.content.translation.requests.v1"
            - name: KAFKA_USERNAME_VAULT_PATH
              value: "secret/data/kafka-scram-user-cms-content-resolver"
            - name: KAFKA_PASSWORD_VAULT_PATH
              value: "secret/data/kafka-scram-user-cms-content-resolver-password"
            - name: CONTENT_RESOLVER_BEARER_TOKEN
              value: ""
            - name: CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH
              value: "secret/data/cms-content-resolver"
            - name: CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY
              value: "token"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "8"
            - name: TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS
              value: "3600"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              while [ ! -f /vault-secrets/vault-token ]; do
                sleep 2
              done
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: app
              mountPath: /app
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: app
          configMap:
            name: cms-content-resolver
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-cms-content-resolver
        - name: vault-secrets
          emptyDir: {}
---
