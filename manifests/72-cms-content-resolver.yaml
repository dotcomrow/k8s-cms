    gravitee.io/definition-pages: '{"swagger":{"type":"SWAGGER","name":"openapi","published":true,"visibility":"PUBLIC","homepage":false,"source":{"type":"http-fetcher","configuration":{"url":"http://cms-content-resolver.directus.svc.cluster.local:8080/openapi.json","autoFetch":true,"fetchCron":"0 */5 * * * *","useSystemProxy":false}}}}'
    gravitee.io/definition-plans: '{"open-access":{"name":"Open access","description":"Resolver API access is enforced by the service bearer token","security":{"type":"KEY_LESS"},"status":"PUBLISHED","validation":"AUTO","type":"API","selectionRule":"true"}}'
    gravitee.io/definition-flows: '[]'
  labels:
    app: cms-content-resolver
spec:
  selector:
    app: cms-content-resolver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
