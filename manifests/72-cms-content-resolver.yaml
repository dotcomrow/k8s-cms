apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-content-resolver
  namespace: directus
data:
  requirements.txt: |
    confluent-kafka==2.6.1
    fastapi==0.115.5
    httpx==0.27.2
    uvicorn==0.30.6
  openapi.yaml: |
    openapi: 3.0.3
    info:
      title: CMS Content Resolver API
      version: 1.0.0
      description: Resolves CMS content item JSON for a required requested language and queues translation misses.
    servers:
      - url: http://cms-content-resolver.directus.svc.cluster.local:8080
    paths:
      /hasura/actions/resolve-content:
        post:
          operationId: resolve_cms_content
          summary: Resolve content items for a requested language
          description: Hasura action surface for language-aware CMS content resolution.
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ResolveContentRequest"
          responses:
            "200":
              description: Resolved content items
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ResolveContentResponse"
    components:
      schemas:
        ContentItem:
          type: object
          required: [id, content_json]
          properties:
            id:
              type: string
            content_key:
              type: string
            name:
              type: string
            default_language_code:
              type: string
              default: en
            content_version:
              type: integer
            source_hash:
              type: string
            source_kind:
              type: string
            site_key:
              type: string
            release_channel:
              type: string
            translation_enabled:
              type: boolean
              default: true
            translation_excluded_languages:
              type: array
              items:
                type: string
            translation_prewarm_languages:
              type: array
              items:
                type: string
            translation_rules:
              type: array
              items:
                type: object
            content_json:
              type: object
        ContentRef:
          type: object
          properties:
            id:
              type: string
            content_item_id:
              type: string
            page_slug:
              type: string
            refresh_target:
              type: string
        ResolveContentRequest:
          type: object
          required: [language, content_items]
          properties:
            language:
              type: string
            site_key:
              type: string
            release_channel:
              type: string
            page_slug:
              type: string
            model:
              type: string
              description: Optional request-level translation model override. If omitted, the resolver uses cms_translation_languages.
            content_items:
              type: array
              items:
                $ref: "#/components/schemas/ContentItem"
            content_refs:
              type: array
              items:
                $ref: "#/components/schemas/ContentRef"
        ResolveContentItem:
          type: object
          required: [content_item_id, requested_language_code, resolved_language_code, fallback_used, content_json]
          properties:
            content_item_id:
              type: string
            requested_language_code:
              type: string
            resolved_language_code:
              type: string
            fallback_used:
              type: boolean
            stale:
              type: boolean
            translation_blocked:
              type: boolean
            source_content_version:
              type: integer
            content_json:
              type: object
        ResolveContentResponse:
          type: object
          required: [ok, language, items]
          properties:
            ok:
              type: boolean
            language:
              type: string
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResolveContentItem"
        UpsertTranslationRequest:
          type: object
          required: [content_item_id, language_code, source_content_version, content_json]
          properties:
            content_item_id:
              type: string
            language_code:
              type: string
            status:
              type: string
              default: published
            source_content_version:
              type: integer
            source_hash:
              type: string
            content_json:
              type: object
            model:
              type: string
            prompt_version:
              type: string
            translated_by:
              type: string
  app.py: |
    import asyncio
    import json
    import os
    import re
    import threading
    import time
    from datetime import datetime, timezone
    from typing import Any, Dict, List, Optional

    import httpx
    from confluent_kafka import Producer
    from fastapi import FastAPI, Header, HTTPException, Request
    from pydantic import BaseModel, Field, field_validator

    APP_VERSION = "1.3.1"
    DEFAULT_LANGUAGE = "en"
    LANGUAGE_PATTERN = re.compile(r"^[A-Za-z]{1,8}(?:-[A-Za-z0-9]{1,8}){0,8}$")
    MODEL_PATTERN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$")
    SYNTHETIC_BLOCK_CONTENT_KEY_PREFIX = "cms_block_"

    DIRECTUS_BASE_URL = os.environ.get(
      "DIRECTUS_BASE_URL",
      "http://directus-service.directus.svc.cluster.local:8055",
    ).rstrip("/")
    DIRECTUS_STATIC_TOKEN = os.environ.get("DIRECTUS_STATIC_TOKEN", "").strip()
    DIRECTUS_TOKEN_VAULT_PATH = os.environ.get("DIRECTUS_TOKEN_VAULT_PATH", "secret/data/directus/gravitee/openapi/admin")
    DIRECTUS_TOKEN_VAULT_KEY = os.environ.get("DIRECTUS_TOKEN_VAULT_KEY", "token")
    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.vault.svc.cluster.local:8200").rstrip("/")
    VAULT_TOKEN_FILE = os.environ.get("VAULT_TOKEN_FILE", "/vault-secrets/vault-token")
    TOKEN_CACHE_SECONDS = int(os.environ.get("TOKEN_CACHE_SECONDS", "300"))

    KAFKA_BOOTSTRAP_SERVERS = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "kafka.kafka.svc.internal.lan:9092")
    KAFKA_SECURITY_PROTOCOL = os.environ.get("KAFKA_SECURITY_PROTOCOL", "SASL_PLAINTEXT")
    KAFKA_SASL_MECHANISM = os.environ.get("KAFKA_SASL_MECHANISM", "SCRAM-SHA-256")
    KAFKA_USERNAME = os.environ.get("KAFKA_USERNAME", "").strip()
    KAFKA_PASSWORD = os.environ.get("KAFKA_PASSWORD", "").strip()
    KAFKA_USERNAME_VAULT_PATH = os.environ.get("KAFKA_USERNAME_VAULT_PATH", "secret/data/kafka-scram-user-cms-content-resolver")
    KAFKA_USERNAME_VAULT_KEY = os.environ.get("KAFKA_USERNAME_VAULT_KEY", "value")
    KAFKA_PASSWORD_VAULT_PATH = os.environ.get("KAFKA_PASSWORD_VAULT_PATH", "secret/data/kafka-scram-user-cms-content-resolver-password")
    KAFKA_PASSWORD_VAULT_KEY = os.environ.get("KAFKA_PASSWORD_VAULT_KEY", "value")
    KAFKA_TRANSLATION_TOPIC = os.environ.get("KAFKA_TRANSLATION_TOPIC", "batch.cms.content.translation.requests.v1")

    REQUEST_TIMEOUT_SECONDS = float(os.environ.get("REQUEST_TIMEOUT_SECONDS", "8"))
    READINESS_TIMEOUT_SECONDS = float(os.environ.get("READINESS_TIMEOUT_SECONDS", "5"))
    DIRECTUS_HEALTH_PATH = os.environ.get("DIRECTUS_HEALTH_PATH", "/server/health")
    TRANSLATION_VALIDATION_MAX_ERRORS = int(os.environ.get("TRANSLATION_VALIDATION_MAX_ERRORS", "25"))
    TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS = int(os.environ.get("TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS", "3600"))
    TRANSLATION_MODEL_CACHE_SECONDS = int(os.environ.get("TRANSLATION_MODEL_CACHE_SECONDS", "0"))
    ACTIVE_TRANSLATION_JOB_STATUSES = {"queued", "processing"}
    CONTENT_RESOLVER_BEARER_TOKEN = os.environ.get("CONTENT_RESOLVER_BEARER_TOKEN", "").strip()
    CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH = os.environ.get(
      "CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH",
      "secret/data/cms-content-resolver",
    ).strip()
    CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY = os.environ.get("CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY", "token").strip()

    _vault_cache: Dict[str, tuple[float, str]] = {}
    _vault_lock = threading.Lock()
    _translation_model_cache: Dict[str, tuple[float, Optional[str]]] = {}
    _translation_model_lock = threading.Lock()
    _producer: Optional[Producer] = None
    _producer_lock = threading.Lock()

    app = FastAPI(title="CMS Content Resolver API", version=APP_VERSION)

    def normalize_language(value: str) -> str:
      candidate = (value or "").strip().replace("_", "-")
      if not candidate or candidate == "*" or not LANGUAGE_PATTERN.match(candidate):
        return DEFAULT_LANGUAGE
      return candidate

    def normalize_optional_language(value: Any) -> Optional[str]:
      candidate = str(value or "").strip().replace("_", "-")
      if not candidate or candidate == "*" or not LANGUAGE_PATTERN.match(candidate):
        return None
      return candidate

    def normalize_language_list(value: Any) -> List[str]:
      if isinstance(value, str):
        stripped = value.strip()
        if not stripped:
          raw_items: List[Any] = []
        else:
          try:
            parsed = json.loads(stripped)
          except json.JSONDecodeError:
            parsed = re.split(r"[,\s]+", stripped)
          raw_items = parsed if isinstance(parsed, list) else [parsed]
      elif isinstance(value, list):
        raw_items = value
      else:
        raw_items = []
      languages: List[str] = []
      for raw_item in raw_items:
        language = normalize_optional_language(raw_item)
        if language and language not in languages:
          languages.append(language)
      return languages

    def language_is_configured(configured_languages: Any, requested_language: str) -> bool:
      requested = normalize_optional_language(requested_language)
      if not requested:
        return False
      requested_lower = requested.lower()
      for configured in normalize_language_list(configured_languages):
        configured_lower = configured.lower()
        if requested_lower == configured_lower or requested_lower.startswith(f"{configured_lower}-"):
          return True
      return False

    def coerce_json_object_array(value: Any) -> List[Dict[str, Any]]:
      if isinstance(value, str):
        try:
          value = json.loads(value)
        except json.JSONDecodeError:
          return []
      if not isinstance(value, list):
        return []
      return [item for item in value if isinstance(item, dict)]

    def parse_json_path(path: Any) -> Optional[List[Any]]:
      text = str(path or "").strip()
      if not text:
        return None
      if text == "$":
        return []
      if not text.startswith("$"):
        return None
      segments: List[Any] = []
      index = 1
      while index < len(text):
        char = text[index]
        if char == ".":
          index += 1
          start = index
          while index < len(text) and text[index] not in ".[":
            index += 1
          key = text[start:index].strip()
          if not key:
            return None
          segments.append(key)
          continue
        if char == "[":
          close_index = text.find("]", index + 1)
          if close_index < 0:
            return None
          token = text[index + 1:close_index].strip()
          if token.isdigit():
            segments.append(int(token))
          elif (token.startswith('"') and token.endswith('"')) or (token.startswith("'") and token.endswith("'")):
            key = token[1:-1]
            if not key:
              return None
            segments.append(key)
          else:
            return None
          index = close_index + 1
          continue
        return None
      return segments

    def get_json_path_value(root: Any, segments: List[Any]) -> tuple[bool, Any]:
      current = root
      for segment in segments:
        if isinstance(segment, int):
          if not isinstance(current, list) or segment < 0 or segment >= len(current):
            return False, None
          current = current[segment]
        else:
          if not isinstance(current, dict) or segment not in current:
            return False, None
          current = current[segment]
      return True, current

    def normalize_translation_rules(value: Any) -> List[Dict[str, Any]]:
      rules: List[Dict[str, Any]] = []
      for raw_rule in coerce_json_object_array(value):
        path = str(raw_rule.get("path") or raw_rule.get("json_path") or "").strip()
        segments = parse_json_path(path)
        if segments is None:
          continue
        translation_enabled = raw_rule.get("translation_enabled")
        if not isinstance(translation_enabled, bool):
          translation_enabled = raw_rule.get("translate")
        rules.append({
          "path": path,
          "segments": segments,
          "translation_enabled": translation_enabled if isinstance(translation_enabled, bool) else None,
          "excluded_languages": normalize_language_list(
            raw_rule.get("excluded_languages")
            or raw_rule.get("exclude_languages")
            or raw_rule.get("do_not_translate_languages")
          ),
          "prewarm_languages": normalize_language_list(
            raw_rule.get("prewarm_languages")
            or raw_rule.get("translate_immediately_languages")
            or raw_rule.get("translate_now_languages")
          ),
        })
      return rules

    def protected_translation_rules(translation_rules: Any, language: str) -> List[Dict[str, Any]]:
      protected: List[Dict[str, Any]] = []
      for rule in normalize_translation_rules(translation_rules):
        disabled = rule.get("translation_enabled") is False
        excluded = language_is_configured(rule.get("excluded_languages"), language)
        if disabled or excluded:
          protected.append(rule)
      return protected

    def normalize_model(value: Optional[str]) -> Optional[str]:
      candidate = str(value or "").strip()
      if not candidate:
        return None
      if not MODEL_PATTERN.match(candidate):
        return None
      return candidate

    def language_lookup_candidates(language: str) -> List[str]:
      normalized = normalize_language(language)
      candidates: List[str] = []

      def add(candidate: str) -> None:
        if candidate and candidate not in candidates:
          candidates.append(candidate)

      add(normalized)
      add(normalized.lower())
      if "-" in normalized:
        base_language = normalized.split("-", 1)[0]
        add(base_language)
        add(base_language.lower())
      return candidates

    def language_model_candidates(language: str) -> List[str]:
      return language_lookup_candidates(language)

    def _read_vault_token() -> str:
      try:
        with open(VAULT_TOKEN_FILE, "r", encoding="utf-8") as handle:
          return handle.read().strip()
      except FileNotFoundError:
        return ""

    async def vault_value(path: str, key: str) -> str:
      cache_key = f"{path}#{key}"
      now = time.time()
      with _vault_lock:
        cached = _vault_cache.get(cache_key)
        if cached and cached[0] > now:
          return cached[1]
      token = _read_vault_token()
      if not token:
        return ""
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(f"{VAULT_ADDR}/v1/{path}", headers={"X-Vault-Token": token})
        response.raise_for_status()
      value = str(response.json().get("data", {}).get("data", {}).get(key, "")).strip()
      with _vault_lock:
        _vault_cache[cache_key] = (now + TOKEN_CACHE_SECONDS, value)
      return value

    async def directus_token() -> str:
      if DIRECTUS_STATIC_TOKEN:
        return DIRECTUS_STATIC_TOKEN
      return await vault_value(DIRECTUS_TOKEN_VAULT_PATH, DIRECTUS_TOKEN_VAULT_KEY)

    async def kafka_credentials() -> tuple[str, str]:
      username = KAFKA_USERNAME or await vault_value(KAFKA_USERNAME_VAULT_PATH, KAFKA_USERNAME_VAULT_KEY)
      password = KAFKA_PASSWORD or await vault_value(KAFKA_PASSWORD_VAULT_PATH, KAFKA_PASSWORD_VAULT_KEY)
      return username, password

    async def kafka_producer() -> Optional[Producer]:
      global _producer
      if _producer is not None:
        return _producer
      username, password = await kafka_credentials()
      if not username or not password:
        return None
      with _producer_lock:
        if _producer is None:
          _producer = Producer({
            "bootstrap.servers": KAFKA_BOOTSTRAP_SERVERS,
            "security.protocol": KAFKA_SECURITY_PROTOCOL,
            "sasl.mechanism": KAFKA_SASL_MECHANISM,
            "sasl.username": username,
            "sasl.password": password,
            "client.id": "cms-content-resolver",
          })
      return _producer

    class ContentItem(BaseModel):
      id: str
      content_key: Optional[str] = None
      name: Optional[str] = None
      default_language_code: str = DEFAULT_LANGUAGE
      content_version: Optional[int] = None
      source_hash: Optional[str] = None
      source_kind: Optional[str] = None
      site_key: Optional[str] = None
      release_channel: Optional[str] = None
      translation_enabled: bool = True
      translation_excluded_languages: List[str] = Field(default_factory=list)
      translation_prewarm_languages: List[str] = Field(default_factory=list)
      translation_rules: List[Dict[str, Any]] = Field(default_factory=list)
      content_json: Dict[str, Any] = Field(default_factory=dict)

      @field_validator("default_language_code")
      @classmethod
      def normalize_default_language(cls, value: str) -> str:
        return normalize_language(value)

      @field_validator("translation_excluded_languages", "translation_prewarm_languages", mode="before")
      @classmethod
      def normalize_translation_language_array(cls, value: Any) -> List[str]:
        return normalize_language_list(value)

      @field_validator("translation_rules", mode="before")
      @classmethod
      def normalize_translation_rule_array(cls, value: Any) -> List[Dict[str, Any]]:
        return coerce_json_object_array(value)

    class ContentRef(BaseModel):
      id: Optional[str] = None
      content_item_id: Optional[str] = None
      page_slug: Optional[str] = None
      refresh_target: Optional[str] = None

    class ResolveContentRequest(BaseModel):
      language: str
      site_key: Optional[str] = None
      release_channel: Optional[str] = None
      page_slug: Optional[str] = None
      model: Optional[str] = None
      content_items: List[ContentItem]
      content_refs: List[ContentRef] = Field(default_factory=list)

      @field_validator("language")
      @classmethod
      def normalize_requested_language(cls, value: str) -> str:
        normalized = normalize_language(value)
        if not normalized:
          raise ValueError("language is required")
        return normalized

      @field_validator("model")
      @classmethod
      def normalize_requested_model(cls, value: Optional[str]) -> Optional[str]:
        if value is None or str(value).strip() == "":
          return None
        normalized = normalize_model(value)
        if not normalized:
          raise ValueError("model must be a valid Ollama/OpenWebUI model id")
        return normalized

    class UpsertTranslationRequest(BaseModel):
      content_item_id: str
      language_code: str
      status: str = "published"
      source_content_version: int
      source_hash: Optional[str] = None
      translation_job_id: Optional[str] = None
      content_json: Dict[str, Any]
      model: Optional[str] = None
      prompt_version: Optional[str] = None
      translated_by: Optional[str] = None

      @field_validator("language_code")
      @classmethod
      def normalize_translation_language(cls, value: str) -> str:
        return normalize_language(value)

    class PrewarmTranslationRequest(BaseModel):
      content_item_id: str
      site_key: Optional[str] = None
      release_channel: Optional[str] = None
      page_slug: Optional[str] = None
      model: Optional[str] = None
      languages: List[str] = Field(default_factory=list)

      @field_validator("languages", mode="before")
      @classmethod
      def normalize_prewarm_languages(cls, value: Any) -> List[str]:
        return normalize_language_list(value)

      @field_validator("model")
      @classmethod
      def normalize_requested_model(cls, value: Optional[str]) -> Optional[str]:
        if value is None or str(value).strip() == "":
          return None
        normalized = normalize_model(value)
        if not normalized:
          raise ValueError("model must be a valid Ollama/OpenWebUI model id")
        return normalized

    class InvalidTranslationContentError(Exception):
      pass

    def json_kind(value: Any) -> str:
      if value is None:
        return "null"
      if isinstance(value, bool):
        return "boolean"
      if isinstance(value, dict):
        return "object"
      if isinstance(value, list):
        return "array"
      if isinstance(value, str):
        return "string"
      if isinstance(value, (int, float)):
        return "number"
      return type(value).__name__

    def append_validation_error(errors: List[str], message: str) -> bool:
      if len(errors) < TRANSLATION_VALIDATION_MAX_ERRORS:
        errors.append(message)
      return len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS

    def collect_content_json_shape_errors(source: Any, translated: Any, path: str = "$", errors: Optional[List[str]] = None) -> List[str]:
      if errors is None:
        errors = []
      if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
        return errors

      if isinstance(source, dict):
        if not isinstance(translated, dict):
          append_validation_error(errors, f"{path}: expected object, got {json_kind(translated)}")
          return errors
        source_keys = set(source.keys())
        translated_keys = set(translated.keys())
        for key in sorted(source_keys - translated_keys):
          if append_validation_error(errors, f"{path}.{key}: missing translated key"):
            return errors
        for key in sorted(translated_keys - source_keys):
          if append_validation_error(errors, f"{path}.{key}: unexpected translated key"):
            return errors
        for key in sorted(source_keys & translated_keys):
          collect_content_json_shape_errors(source[key], translated[key], f"{path}.{key}", errors)
          if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
            return errors
        return errors

      if isinstance(source, list):
        if not isinstance(translated, list):
          append_validation_error(errors, f"{path}: expected array, got {json_kind(translated)}")
          return errors
        if len(source) != len(translated):
          append_validation_error(errors, f"{path}: expected array length {len(source)}, got {len(translated)}")
          return errors
        for index, source_item in enumerate(source):
          collect_content_json_shape_errors(source_item, translated[index], f"{path}[{index}]", errors)
          if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
            return errors
        return errors

      if isinstance(source, str):
        if not isinstance(translated, str):
          append_validation_error(errors, f"{path}: expected string, got {json_kind(translated)}")
        elif source.strip() and not translated.strip():
          append_validation_error(errors, f"{path}: translated string is empty")
        return errors

      if isinstance(source, bool):
        if not isinstance(translated, bool):
          append_validation_error(errors, f"{path}: expected boolean, got {json_kind(translated)}")
        return errors

      if isinstance(source, (int, float)) and not isinstance(source, bool):
        if not isinstance(translated, (int, float)) or isinstance(translated, bool):
          append_validation_error(errors, f"{path}: expected number, got {json_kind(translated)}")
        return errors

      if source is None:
        return errors

      if type(source) is not type(translated):
        append_validation_error(errors, f"{path}: expected {json_kind(source)}, got {json_kind(translated)}")
      return errors

    def content_item_translation_blocked(item: ContentItem, language: str) -> bool:
      if not item.translation_enabled:
        return True
      if language_is_configured(item.translation_excluded_languages, language):
        return True
      return any(rule.get("segments") == [] for rule in protected_translation_rules(item.translation_rules, language))

    def translation_policy_payload(item: ContentItem) -> Dict[str, Any]:
      return {
        "translation_enabled": item.translation_enabled,
        "translation_excluded_languages": item.translation_excluded_languages,
        "translation_prewarm_languages": item.translation_prewarm_languages,
        "translation_rules": item.translation_rules,
      }

    def prewarm_languages_for_item(item: ContentItem) -> List[str]:
      languages = normalize_language_list(item.translation_prewarm_languages)
      for rule in normalize_translation_rules(item.translation_rules):
        for language in normalize_language_list(rule.get("prewarm_languages")):
          if language not in languages:
            languages.append(language)
      return languages

    def collect_protected_path_errors(source: Any, translated: Any, translation_rules: Any, language: str) -> List[str]:
      errors: List[str] = []
      seen_paths: set[str] = set()
      for rule in protected_translation_rules(translation_rules, language):
        path = str(rule.get("path") or "$")
        if path in seen_paths:
          continue
        seen_paths.add(path)
        segments = rule.get("segments")
        if not isinstance(segments, list):
          continue
        source_exists, source_value = get_json_path_value(source, segments)
        if not source_exists:
          continue
        translated_exists, translated_value = get_json_path_value(translated, segments)
        if not translated_exists:
          if append_validation_error(errors, f"{path}: protected path missing from translated content"):
            return errors
          continue
        if translated_value != source_value:
          if append_validation_error(errors, f"{path}: protected path changed by translation"):
            return errors
      return errors

    def validate_translation_content_json(
      source_content_json: Any,
      translated_content_json: Any,
      translation_rules: Any = None,
      language: Optional[str] = None,
    ) -> List[str]:
      if not isinstance(source_content_json, dict):
        return [f"$: source content_json must be object, got {json_kind(source_content_json)}"]
      if not isinstance(translated_content_json, dict):
        return [f"$: translated content_json must be object, got {json_kind(translated_content_json)}"]
      errors = collect_content_json_shape_errors(source_content_json, translated_content_json)
      if len(errors) >= TRANSLATION_VALIDATION_MAX_ERRORS:
        return errors
      if translation_rules is not None and language:
        errors.extend(collect_protected_path_errors(source_content_json, translated_content_json, translation_rules, language))
      return errors[:TRANSLATION_VALIDATION_MAX_ERRORS]

    async def fetch_source_content_item(content_item_id: str) -> Optional[Dict[str, Any]]:
      headers = await directus_headers()
      params = {
        "fields": "id,content_key,name,default_language_code,content_json,content_version,site_key,release_channel,translation_enabled,translation_excluded_languages,translation_prewarm_languages,translation_rules",
        "limit": "1",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_items/{content_item_id}",
          headers=headers,
          params=params,
        )
        if response.status_code == 404:
          return None
        response.raise_for_status()
      data = response.json().get("data")
      return data if isinstance(data, dict) else None

    def fallback_item(item: ContentItem, requested_language: str, stale: bool = False, translation_blocked: bool = False) -> Dict[str, Any]:
      return {
        "content_item_id": item.id,
        "requested_language_code": requested_language,
        "resolved_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "fallback_used": requested_language.lower() != (item.default_language_code or DEFAULT_LANGUAGE).lower(),
        "stale": stale,
        "translation_blocked": translation_blocked,
        "source_content_version": item.content_version,
        "content_json": item.content_json,
      }

    async def fetch_translation(item: ContentItem, language: str) -> Optional[Dict[str, Any]]:
      token = await directus_token()
      headers = {"Authorization": f"Bearer {token}", "Accept": "application/json"} if token else {"Accept": "application/json"}
      invalid_translation_found = False
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        for candidate in language_lookup_candidates(language):
          params = {
            "filter[content_item_id][_eq]": item.id,
            "filter[language_code][_eq]": candidate,
            "filter[status][_eq]": "published",
            "fields": "id,content_item_id,language_code,status,content_json,source_content_version,source_hash,model,prompt_version,translated_by",
            "limit": "1",
          }
          response = await client.get(
            f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
            headers=headers,
            params=params,
          )
          response.raise_for_status()
          data = response.json().get("data", [])
          if not data:
            continue
          translation = data[0]
          resolved_language = str(translation.get("language_code") or candidate).strip() or candidate
          if translation.get("source_content_version") != item.content_version:
            continue
          item_source_hash = str(item.source_hash or "").strip()
          translation_source_hash = str(translation.get("source_hash") or "").strip()
          if item_source_hash and translation_source_hash and translation_source_hash != item_source_hash:
            continue
          content_json = translation.get("content_json")
          if not isinstance(content_json, dict):
            continue
          validation_errors = validate_translation_content_json(item.content_json, content_json, item.translation_rules, language)
          if validation_errors:
            invalid_translation_found = True
            print(json.dumps({
              "event": "translation_content_json_invalid",
              "content_item_id": item.id,
              "requested_language_code": language,
              "language_code": resolved_language,
              "errors": validation_errors,
            }), flush=True)
            continue
          return {
            "content_item_id": item.id,
            "requested_language_code": language,
            "resolved_language_code": resolved_language,
            "fallback_used": False,
            "stale": False,
            "source_content_version": item.content_version,
            "source_hash": translation_source_hash or item_source_hash or None,
            "model": translation.get("model"),
            "prompt_version": translation.get("prompt_version"),
            "translated_by": translation.get("translated_by"),
            "content_json": content_json,
          }
      if invalid_translation_found:
        raise InvalidTranslationContentError("translation content_json does not match source content_json")
      return None

    async def directus_headers() -> Dict[str, str]:
      token = await directus_token()
      headers = {"Accept": "application/json", "Content-Type": "application/json"}
      if token:
        headers["Authorization"] = f"Bearer {token}"
      return headers

    async def fetch_configured_translation_model(language: str) -> Optional[str]:
      candidates = language_model_candidates(language)
      cache_key = "|".join(candidates)
      now = time.time()
      if TRANSLATION_MODEL_CACHE_SECONDS > 0:
        with _translation_model_lock:
          cached = _translation_model_cache.get(cache_key)
          if cached and cached[0] > now:
            return cached[1]

      selected_model: Optional[str] = None
      cacheable = True
      headers = await directus_headers()
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        for candidate in candidates:
          params = {
            "filter[language_code][_eq]": candidate,
            "filter[status][_eq]": "published",
            "fields": "language_code,model",
            "limit": "1",
          }
          response = await client.get(
            f"{DIRECTUS_BASE_URL}/items/cms_translation_languages",
            headers=headers,
            params=params,
          )
          if response.status_code == 403 or response.status_code == 404:
            cacheable = False
            break
          response.raise_for_status()
          rows = response.json().get("data", [])
          if not isinstance(rows, list) or not rows:
            continue
          raw_model = rows[0].get("model")
          selected_model = normalize_model(raw_model)
          if raw_model and not selected_model:
            print(json.dumps({
              "event": "translation_language_model_invalid",
              "language_code": candidate,
              "model": str(raw_model)[:128],
            }), flush=True)
          break

      if cacheable and TRANSLATION_MODEL_CACHE_SECONDS > 0:
        with _translation_model_lock:
          _translation_model_cache[cache_key] = (now + TRANSLATION_MODEL_CACHE_SECONDS, selected_model)
      return selected_model

    async def resolve_translation_model(payload: ResolveContentRequest) -> Optional[str]:
      if payload.model:
        return payload.model
      try:
        return await fetch_configured_translation_model(payload.language)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_language_model_lookup_failed",
          "language_code": payload.language,
          "error": str(exc),
        }), flush=True)
        return None

    def source_version_for_job(item: ContentItem) -> int:
      return int(item.content_version or 0)

    def translation_job_key(item: ContentItem, language: str) -> str:
      return f"{item.id}:{language}:{source_version_for_job(item)}"

    def parse_directus_datetime(value: Any) -> Optional[datetime]:
      if not value:
        return None
      candidate = str(value).strip()
      if not candidate:
        return None
      if candidate.endswith("Z"):
        candidate = f"{candidate[:-1]}+00:00"
      try:
        parsed = datetime.fromisoformat(candidate)
      except ValueError:
        return None
      if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
      return parsed

    def translation_job_is_expired(job: Dict[str, Any]) -> bool:
      if TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS <= 0:
        return False
      timestamp = parse_directus_datetime(job.get("date_updated") or job.get("date_created"))
      if timestamp is None:
        return False
      age_seconds = (datetime.now(timezone.utc) - timestamp.astimezone(timezone.utc)).total_seconds()
      return age_seconds > TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS

    def directus_response_is_record_not_unique(response: httpx.Response) -> bool:
      if response.status_code != 400:
        return False
      body = response.text
      return "RECORD_NOT_UNIQUE" in body or "has to be unique" in body

    async def find_translation_jobs(content_item_id: str, language_code: str, source_content_version: int) -> List[Dict[str, Any]]:
      headers = await directus_headers()
      params = {
        "filter[content_item_id][_eq]": content_item_id,
        "filter[language_code][_eq]": language_code,
        "filter[source_content_version][_eq]": str(source_content_version),
        "fields": "id,status,attempt_count,date_created,date_updated,date_completed",
        "sort": "-date_created",
        "limit": "10",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs",
          headers=headers,
          params=params,
        )
        response.raise_for_status()
      rows = response.json().get("data", [])
      if not isinstance(rows, list):
        return []
      return rows

    def active_translation_jobs(rows: List[Dict[str, Any]]) -> List[Dict[str, Any]]:
      return [
        row for row in rows
        if str(row.get("status") or "").strip().lower() in ACTIVE_TRANSLATION_JOB_STATUSES
      ]

    async def find_active_translation_jobs(content_item_id: str, language_code: str, source_content_version: int) -> List[Dict[str, Any]]:
      return active_translation_jobs(await find_translation_jobs(content_item_id, language_code, source_content_version))

    async def find_translation_jobs_with_retry(content_item_id: str, language_code: str, source_content_version: int, attempts: int = 4) -> List[Dict[str, Any]]:
      total_attempts = max(1, attempts)
      for attempt in range(total_attempts):
        jobs = await find_translation_jobs(content_item_id, language_code, source_content_version)
        if jobs or attempt == total_attempts - 1:
          return jobs
        await asyncio.sleep(0.25 * (attempt + 1))
      return []

    async def create_translation_job(payload: ResolveContentRequest, item: ContentItem, reason: str, kafka_key: str, model: Optional[str]) -> tuple[bool, Optional[str]]:
      source_content_version = source_version_for_job(item)
      existing_jobs = await find_translation_jobs(item.id, payload.language, source_content_version)
      active_jobs = active_translation_jobs(existing_jobs)
      if active_jobs:
        await expire_stale_translation_jobs_safely(active_jobs)
        existing_jobs = await find_translation_jobs(item.id, payload.language, source_content_version)
        active_jobs = active_translation_jobs(existing_jobs)
      if active_jobs:
        return False, str(active_jobs[0].get("id") or "").strip() or None
      reusable_jobs = [job for job in existing_jobs if str(job.get("id") or "").strip()]
      if reusable_jobs:
        job_id = str(reusable_jobs[0].get("id") or "").strip()
        await requeue_translation_job(job_id, payload, item, reason, kafka_key, model)
        return True, job_id
      headers = await directus_headers()
      body = {
        "content_item_id": item.id,
        "language_code": payload.language,
        "source_content_version": source_content_version,
        "source_hash": item.source_hash,
        "status": "queued",
        "reason": reason,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "page_slug": payload.page_slug,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
        "kafka_key": kafka_key,
        "model": model,
        "attempt_count": 0,
      }
      body = {key: value for key, value in body.items() if value is not None}
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.post(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs",
          headers=headers,
          json=body,
        )
      if response.status_code >= 400:
        existing_jobs = await find_translation_jobs_with_retry(item.id, payload.language, source_content_version)
        active_jobs = active_translation_jobs(existing_jobs)
        if active_jobs:
          await expire_stale_translation_jobs_safely(active_jobs)
          existing_jobs = await find_translation_jobs_with_retry(item.id, payload.language, source_content_version)
          active_jobs = active_translation_jobs(existing_jobs)
        if active_jobs:
          return False, str(active_jobs[0].get("id") or "").strip() or None
        reusable_jobs = [job for job in existing_jobs if str(job.get("id") or "").strip()]
        if reusable_jobs:
          job_id = str(reusable_jobs[0].get("id") or "").strip()
          await requeue_translation_job(job_id, payload, item, reason, kafka_key, model)
          return True, job_id
        if directus_response_is_record_not_unique(response):
          return False, None
        print(json.dumps({
          "event": "translation_job_claim_failed_no_existing_job",
          "content_item_id": item.id,
          "language_code": payload.language,
          "source_content_version": source_content_version,
          "directus_status_code": response.status_code,
          "directus_response": response.text[:1000],
        }), flush=True)
        response.raise_for_status()
      data = response.json().get("data", {})
      return True, str(data.get("id") or "").strip() or None

    async def requeue_translation_job(job_id: str, payload: ResolveContentRequest, item: ContentItem, reason: str, kafka_key: str, model: Optional[str]) -> None:
      if not job_id:
        return
      headers = await directus_headers()
      now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
      body: Dict[str, Any] = {
        "status": "queued",
        "reason": reason,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "page_slug": payload.page_slug,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
        "kafka_key": kafka_key,
        "model": model,
        "date_updated": now,
        "date_completed": None,
        "last_error": None,
      }
      body = {key: value for key, value in body.items() if value is not None or key in {"date_completed", "last_error"}}
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.patch(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs/{job_id}",
          headers=headers,
          json=body,
        )
        response.raise_for_status()

    async def patch_translation_job(job_id: str, status: str, last_error: Optional[str] = None) -> None:
      if not job_id:
        return
      headers = await directus_headers()
      now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
      body: Dict[str, Any] = {
        "status": status,
        "date_updated": now,
      }
      if status in ACTIVE_TRANSLATION_JOB_STATUSES:
        body["date_completed"] = None
      else:
        body["date_completed"] = now
      if last_error:
        body["last_error"] = last_error[:2000]
      elif status == "succeeded":
        body["last_error"] = None
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.patch(
          f"{DIRECTUS_BASE_URL}/items/cms_content_translation_jobs/{job_id}",
          headers=headers,
          json=body,
        )
        response.raise_for_status()

    async def patch_translation_job_safely(job_id: Optional[str], status: str, last_error: Optional[str] = None) -> None:
      try:
        await patch_translation_job(job_id or "", status, last_error)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_status_update_failed",
          "translation_job_id": job_id,
          "status": status,
          "error": str(exc),
        }), flush=True)

    async def expire_stale_translation_jobs_safely(jobs: List[Dict[str, Any]]) -> None:
      for job in jobs:
        if not translation_job_is_expired(job):
          continue
        job_id = str(job.get("id") or "").strip()
        await patch_translation_job_safely(job_id, "failed", "translation_job_active_timeout")

    async def mark_active_translation_jobs(content_item_id: str, language_code: str, source_content_version: int, status: str, last_error: Optional[str] = None) -> None:
      jobs = active_translation_jobs(await find_translation_jobs_with_retry(content_item_id, language_code, source_content_version))
      if not jobs:
        print(json.dumps({
          "event": "translation_job_update_no_active_job",
          "content_item_id": content_item_id,
          "language_code": language_code,
          "source_content_version": source_content_version,
          "status": status,
        }), flush=True)
        return
      for job in jobs:
        await patch_translation_job(str(job.get("id") or "").strip(), status, last_error)

    async def mark_translation_jobs_safely(content_item_id: str, language_code: str, source_content_version: int, status: str, last_error: Optional[str] = None) -> None:
      try:
        await mark_active_translation_jobs(content_item_id, language_code, source_content_version, status, last_error)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_status_update_failed",
          "content_item_id": content_item_id,
          "language_code": language_code,
          "source_content_version": source_content_version,
          "status": status,
          "error": str(exc),
        }), flush=True)

    async def mark_upsert_translation_job_safely(payload: UpsertTranslationRequest, status: str, last_error: Optional[str] = None) -> None:
      job_id = str(payload.translation_job_id or "").strip()
      if job_id:
        try:
          await patch_translation_job(job_id, status, last_error)
          return
        except Exception as exc:
          print(json.dumps({
            "event": "translation_job_id_status_update_failed",
            "translation_job_id": job_id,
            "content_item_id": payload.content_item_id,
            "language_code": payload.language_code,
            "source_content_version": payload.source_content_version,
            "status": status,
            "error": str(exc),
          }), flush=True)
      await mark_translation_jobs_safely(
        payload.content_item_id,
        payload.language_code,
        payload.source_content_version,
        status,
        last_error,
      )

    def is_synthetic_block_content_item(item: ContentItem) -> bool:
      return item.source_kind == "cms_block" and bool((item.content_key or "").startswith(SYNTHETIC_BLOCK_CONTENT_KEY_PREFIX))

    def directus_content_item_body(payload: ResolveContentRequest, item: ContentItem, include_id: bool = False) -> Dict[str, Any]:
      body: Dict[str, Any] = {
        "status": "published",
        "content_key": item.content_key,
        "name": item.name or item.content_key or item.id,
        "default_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "content_version": item.content_version,
        "translation_enabled": item.translation_enabled,
        "translation_excluded_languages": item.translation_excluded_languages,
        "translation_prewarm_languages": item.translation_prewarm_languages,
        "translation_rules": item.translation_rules,
        "content_json": item.content_json,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "refresh_target": "both",
      }
      if include_id:
        body["id"] = item.id
      return {key: value for key, value in body.items() if value is not None}

    async def ensure_synthetic_content_item(payload: ResolveContentRequest, item: ContentItem) -> None:
      if not is_synthetic_block_content_item(item):
        return
      headers = await directus_headers()
      create_body = directus_content_item_body(payload, item, include_id=True)
      patch_body = directus_content_item_body(payload, item, include_id=False)
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        existing = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_items/{item.id}",
          headers=headers,
          params={"fields": "id"},
        )
        if existing.status_code == 404:
          response = await client.post(
            f"{DIRECTUS_BASE_URL}/items/cms_content_items",
            headers=headers,
            json=create_body,
          )
        else:
          existing.raise_for_status()
          response = await client.patch(
            f"{DIRECTUS_BASE_URL}/items/cms_content_items/{item.id}",
            headers=headers,
            json=patch_body,
          )
        response.raise_for_status()

    async def find_translation_id(content_item_id: str, language_code: str) -> Optional[str]:
      headers = await directus_headers()
      params = {
        "filter[content_item_id][_eq]": content_item_id,
        "filter[language_code][_eq]": language_code,
        "fields": "id",
        "limit": "1",
      }
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        response = await client.get(
          f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
          headers=headers,
          params=params,
        )
        response.raise_for_status()
      data = response.json().get("data", [])
      if not data:
        return None
      return str(data[0].get("id") or "").strip() or None

    async def find_translation_id_with_retry(content_item_id: str, language_code: str, attempts: int = 6) -> Optional[str]:
      total_attempts = max(1, attempts)
      for attempt in range(total_attempts):
        translation_id = await find_translation_id(content_item_id, language_code)
        if translation_id or attempt == total_attempts - 1:
          return translation_id
        await asyncio.sleep(0.2 * (attempt + 1))
      return None

    def log_directus_upsert_failure(payload: UpsertTranslationRequest, response: httpx.Response, mode: str) -> None:
      print(json.dumps({
        "event": "translation_upsert_directus_failed",
        "mode": mode,
        "content_item_id": payload.content_item_id,
        "language_code": payload.language_code,
        "source_content_version": payload.source_content_version,
        "directus_status_code": response.status_code,
        "directus_response": response.text[:2000],
      }), flush=True)

    async def upsert_translation(payload: UpsertTranslationRequest) -> Dict[str, Any]:
      headers = await directus_headers()
      source_item = await fetch_source_content_item(payload.content_item_id)
      if source_item is None:
        await mark_upsert_translation_job_safely(
          payload,
          "failed",
          "source_content_item_not_found",
        )
        raise HTTPException(status_code=422, detail={
          "error": "source_content_item_not_found",
          "content_item_id": payload.content_item_id,
        })
      source_policy_item = ContentItem.model_validate(source_item)
      if content_item_translation_blocked(source_policy_item, payload.language_code):
        await mark_upsert_translation_job_safely(
          payload,
          "failed",
          "translation_disabled_by_policy",
        )
        raise HTTPException(status_code=422, detail={
          "error": "translation_disabled_by_policy",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
        })
      source_content_json = source_item.get("content_json")
      validation_errors = validate_translation_content_json(
        source_content_json,
        payload.content_json,
        source_policy_item.translation_rules,
        payload.language_code,
      )
      if validation_errors:
        await mark_upsert_translation_job_safely(
          payload,
          "failed",
          "translation_content_json_shape_mismatch",
        )
        raise HTTPException(status_code=422, detail={
          "error": "translation_content_json_shape_mismatch",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
          "errors": validation_errors,
        })
      source_content_version = source_item.get("content_version")
      if source_content_version is not None and payload.source_content_version != source_content_version:
        await mark_upsert_translation_job_safely(
          payload,
          "failed",
          "translation_source_version_stale",
        )
        raise HTTPException(status_code=409, detail={
          "error": "translation_source_version_stale",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
          "expected_source_content_version": source_content_version,
          "received_source_content_version": payload.source_content_version,
        })
      source_hash = str(source_item.get("source_hash") or "").strip()
      payload_hash = str(payload.source_hash or "").strip()
      if source_hash and payload_hash and payload_hash != source_hash:
        await mark_upsert_translation_job_safely(
          payload,
          "failed",
          "translation_source_hash_stale",
        )
        raise HTTPException(status_code=409, detail={
          "error": "translation_source_hash_stale",
          "content_item_id": payload.content_item_id,
          "language_code": payload.language_code,
        })
      body = {
        "content_item_id": payload.content_item_id,
        "language_code": payload.language_code,
        "status": payload.status,
        "source_content_version": payload.source_content_version,
        "source_hash": payload.source_hash,
        "content_json": payload.content_json,
        "model": payload.model,
        "prompt_version": payload.prompt_version,
        "translated_by": payload.translated_by,
      }
      existing_id = await find_translation_id_with_retry(payload.content_item_id, payload.language_code, attempts=3)
      async with httpx.AsyncClient(timeout=REQUEST_TIMEOUT_SECONDS) as client:
        if existing_id:
          response = await client.patch(
            f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations/{existing_id}",
            headers=headers,
            json=body,
          )
          if response.status_code >= 400:
            log_directus_upsert_failure(payload, response, "patch_existing_translation")
        else:
          response = await client.post(
            f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations",
            headers=headers,
            json=body,
          )
          if response.status_code >= 400:
            duplicate_id = await find_translation_id_with_retry(payload.content_item_id, payload.language_code)
            if duplicate_id:
              existing_id = duplicate_id
              response = await client.patch(
                f"{DIRECTUS_BASE_URL}/items/cms_content_item_translations/{duplicate_id}",
                headers=headers,
                json=body,
              )
              if response.status_code >= 400:
                log_directus_upsert_failure(payload, response, "patch_after_duplicate_create")
            else:
              log_directus_upsert_failure(payload, response, "create_translation")
        response.raise_for_status()
      data = response.json().get("data", {})
      await mark_upsert_translation_job_safely(
        payload,
        "succeeded",
      )
      return {
        "ok": True,
        "mode": "update" if existing_id else "create",
        "id": data.get("id", existing_id),
        "content_item_id": payload.content_item_id,
        "language_code": payload.language_code,
        "source_content_version": payload.source_content_version,
      }

    async def enqueue_translation_request(payload: ResolveContentRequest, item: ContentItem, reason: str, model: Optional[str]) -> bool:
      if content_item_translation_blocked(item, payload.language):
        print(json.dumps({
          "event": "translation_request_blocked_by_policy",
          "content_item_id": item.id,
          "language_code": payload.language,
        }), flush=True)
        return False
      key = translation_job_key(item, payload.language)
      try:
        job_created, job_id = await create_translation_job(payload, item, reason, key, model)
      except Exception as exc:
        print(json.dumps({
          "event": "translation_job_claim_failed",
          "content_item_id": item.id,
          "language_code": payload.language,
          "source_content_version": source_version_for_job(item),
          "error": str(exc),
        }), flush=True)
        return False
      if not job_created:
        print(json.dumps({
          "event": "translation_request_already_in_progress",
          "content_item_id": item.id,
          "language_code": payload.language,
          "source_content_version": source_version_for_job(item),
          "translation_job_id": job_id,
        }), flush=True)
        return False
      producer = await kafka_producer()
      if producer is None:
        await patch_translation_job_safely(job_id, "failed", "kafka_producer_unavailable")
        return False
      refs = [ref.model_dump() for ref in payload.content_refs if ref.content_item_id == item.id]
      message = {
        "schema_version": "cms-content-translation-request.v1",
        "reason": reason,
        "translation_job_id": job_id,
        "requested_language_code": payload.language,
        "source_language_code": item.default_language_code or DEFAULT_LANGUAGE,
        "site_key": payload.site_key,
        "release_channel": payload.release_channel,
        "page_slug": payload.page_slug,
        "content_item": {
          "id": item.id,
          "content_key": item.content_key,
          "name": item.name,
          "content_version": item.content_version,
          "source_hash": item.source_hash,
          "translation_enabled": item.translation_enabled,
          "translation_excluded_languages": item.translation_excluded_languages,
          "translation_prewarm_languages": item.translation_prewarm_languages,
          "translation_rules": item.translation_rules,
          "content_json": item.content_json,
        },
        "translation_policy": translation_policy_payload(item),
        "content_refs": refs,
      }
      if model:
        message["model"] = model
        message["translation_model"] = model
      try:
        producer.produce(
          KAFKA_TRANSLATION_TOPIC,
          key=key.encode("utf-8"),
          value=json.dumps(message, separators=(",", ":")).encode("utf-8"),
        )
        producer.poll(0)
        producer.flush(5)
      except Exception as exc:
        await patch_translation_job_safely(job_id, "failed", f"kafka_publish_failed: {exc}")
        return False
      return True

    async def resolver_bearer_token() -> str:
      if CONTENT_RESOLVER_BEARER_TOKEN:
        return CONTENT_RESOLVER_BEARER_TOKEN
      if CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH:
        return await vault_value(CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH, CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY or "token")
      return ""

    async def require_auth(authorization: Optional[str]) -> None:
      try:
        token = await resolver_bearer_token()
      except Exception as exc:
        raise HTTPException(status_code=503, detail="Resolver auth token unavailable") from exc
      if not token:
        return
      expected = f"Bearer {token}"
      if authorization != expected:
        raise HTTPException(status_code=401, detail="Unauthorized")

    @app.get("/healthz")
    async def healthz() -> Dict[str, Any]:
      return {
        "ok": True,
        "version": APP_VERSION,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
        "has_vault_token": bool(_read_vault_token()),
        "resolver_auth_configured": bool(CONTENT_RESOLVER_BEARER_TOKEN or CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH),
      }

    @app.get("/readyz")
    async def readyz() -> Dict[str, Any]:
      try:
        token = await directus_token()
      except Exception as exc:
        raise HTTPException(
          status_code=503,
          detail={
            "ok": False,
            "reason": "directus_token_lookup_failed",
            "directus_base_url": DIRECTUS_BASE_URL,
            "error": str(exc)[:500],
          },
        ) from exc
      if not token:
        raise HTTPException(
          status_code=503,
          detail={
            "ok": False,
            "reason": "directus_token_unavailable",
            "directus_base_url": DIRECTUS_BASE_URL,
          },
        )
      try:
        async with httpx.AsyncClient(timeout=READINESS_TIMEOUT_SECONDS) as client:
          response = await client.get(
            f"{DIRECTUS_BASE_URL}{DIRECTUS_HEALTH_PATH}",
            headers={"Accept": "application/json", "Authorization": f"Bearer {token}"},
          )
          response.raise_for_status()
      except Exception as exc:
        raise HTTPException(
          status_code=503,
          detail={
            "ok": False,
            "reason": "directus_health_unavailable",
            "directus_base_url": DIRECTUS_BASE_URL,
            "directus_health_path": DIRECTUS_HEALTH_PATH,
            "error": str(exc)[:500],
          },
        ) from exc
      return {
        "ok": True,
        "version": APP_VERSION,
        "directus_base_url": DIRECTUS_BASE_URL,
        "directus_health_path": DIRECTUS_HEALTH_PATH,
        "kafka_topic": KAFKA_TRANSLATION_TOPIC,
      }

    async def resolve_content_payload(payload: ResolveContentRequest) -> Dict[str, Any]:
      items: List[Dict[str, Any]] = []
      translation_model_resolved = False
      translation_model: Optional[str] = None
      for item in payload.content_items:
        if payload.language.lower() == (item.default_language_code or DEFAULT_LANGUAGE).lower():
          items.append(fallback_item(item, payload.language, stale=False))
          continue
        if content_item_translation_blocked(item, payload.language):
          items.append(fallback_item(item, payload.language, stale=False, translation_blocked=True))
          continue
        reason = "missing_or_stale"
        try:
          translation = await fetch_translation(item, payload.language)
        except InvalidTranslationContentError:
          translation = None
          reason = "invalid_translation_content_json"
        except Exception:
          translation = None
          reason = "translation_lookup_failed"
        if translation:
          await mark_translation_jobs_safely(item.id, payload.language, source_version_for_job(item), "succeeded")
          items.append(translation)
          continue
        try:
          await ensure_synthetic_content_item(payload, item)
        except Exception:
          reason = f"{reason}_source_sync_failed"
        if not translation_model_resolved:
          translation_model = await resolve_translation_model(payload)
          translation_model_resolved = True
        await enqueue_translation_request(payload, item, reason, translation_model)
        items.append(fallback_item(item, payload.language, stale=True))
      return {"ok": True, "language": payload.language, "items": items}

    async def prewarm_content_item_translations(payload: PrewarmTranslationRequest) -> Dict[str, Any]:
      source_item = await fetch_source_content_item(payload.content_item_id)
      if source_item is None:
        raise HTTPException(status_code=404, detail={
          "error": "source_content_item_not_found",
          "content_item_id": payload.content_item_id,
        })
      item = ContentItem.model_validate(source_item)
      languages = payload.languages or prewarm_languages_for_item(item)
      results: List[Dict[str, Any]] = []
      for language in languages:
        if language.lower() == (item.default_language_code or DEFAULT_LANGUAGE).lower():
          results.append({"language_code": language, "status": "skipped_default_language"})
          continue
        if content_item_translation_blocked(item, language):
          results.append({"language_code": language, "status": "blocked_by_policy"})
          continue
        try:
          existing_translation = await fetch_translation(item, language)
        except InvalidTranslationContentError:
          existing_translation = None
        except Exception as exc:
          print(json.dumps({
            "event": "translation_prewarm_lookup_failed",
            "content_item_id": item.id,
            "language_code": language,
            "error": str(exc),
          }), flush=True)
          existing_translation = None
        if existing_translation:
          results.append({"language_code": language, "status": "already_translated"})
          continue
        request_payload = ResolveContentRequest(
          language=language,
          site_key=payload.site_key or item.site_key,
          release_channel=payload.release_channel or item.release_channel,
          page_slug=payload.page_slug,
          model=payload.model,
          content_items=[item],
          content_refs=[],
        )
        translation_model = await resolve_translation_model(request_payload)
        queued = await enqueue_translation_request(
          request_payload,
          item,
          "prewarm_configured_language",
          translation_model,
        )
        results.append({
          "language_code": language,
          "status": "queued" if queued else "already_in_progress_or_unavailable",
          "model": translation_model,
        })
      return {
        "ok": True,
        "content_item_id": item.id,
        "languages": languages,
        "results": results,
      }

    @app.post("/hasura/actions/resolve-content")
    async def resolve_content_action(request: Request, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      envelope = await request.json()
      payload = ResolveContentRequest.model_validate(envelope.get("input", envelope))
      return await resolve_content_payload(payload)

    @app.post("/content/translations/prewarm", include_in_schema=False)
    async def prewarm_content_translation(payload: PrewarmTranslationRequest, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      return await prewarm_content_item_translations(payload)

    @app.post("/content/translations/upsert", include_in_schema=False)
    async def upsert_content_translation(payload: UpsertTranslationRequest, authorization: Optional[str] = Header(default=None)) -> Dict[str, Any]:
      return await upsert_translation(payload)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-cms-content-resolver
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-content-resolver
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: cms-content-resolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-content-resolver
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: cms-content-resolver
    spec:
      serviceAccountName: directus
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: cms-content-resolver
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: DIRECTUS_BASE_URL
              value: "http://directus-service.directus.svc.cluster.local:8055"
            - name: DIRECTUS_TOKEN_VAULT_PATH
              value: "secret/data/directus/gravitee/openapi/admin"
            - name: DIRECTUS_TOKEN_VAULT_KEY
              value: "token"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.internal.lan:9092"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: KAFKA_SASL_MECHANISM
              value: "SCRAM-SHA-256"
            - name: KAFKA_TRANSLATION_TOPIC
              value: "batch.cms.content.translation.requests.v1"
            - name: KAFKA_USERNAME_VAULT_PATH
              value: "secret/data/kafka-scram-user-cms-content-resolver"
            - name: KAFKA_PASSWORD_VAULT_PATH
              value: "secret/data/kafka-scram-user-cms-content-resolver-password"
            - name: CONTENT_RESOLVER_BEARER_TOKEN
              value: ""
            - name: CONTENT_RESOLVER_BEARER_TOKEN_VAULT_PATH
              value: "secret/data/cms-content-resolver"
            - name: CONTENT_RESOLVER_BEARER_TOKEN_VAULT_KEY
              value: "token"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "8"
            - name: READINESS_TIMEOUT_SECONDS
              value: "5"
            - name: DIRECTUS_HEALTH_PATH
              value: "/server/health"
            - name: TRANSLATION_JOB_ACTIVE_MAX_AGE_SECONDS
              value: "3600"
            - name: TRANSLATION_MODEL_CACHE_SECONDS
              value: "0"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              while [ ! -f /vault-secrets/vault-token ]; do
                sleep 2
              done
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: app
              mountPath: /app
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: app
          configMap:
            name: cms-content-resolver
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-cms-content-resolver
        - name: vault-secrets
          emptyDir: {}
---
