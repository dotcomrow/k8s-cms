# Serve a Gravitee-friendly OpenAPI document (normalized to OpenAPI 3.0.3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus-openapi
  namespace: directus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus-openapi
  namespace: directus
  labels:
    app: directus-openapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus-openapi
  template:
    metadata:
      labels:
        app: directus-openapi
    spec:
      # Reuse the Directus SA so this pod can authenticate to Vault and read
      # the per-site Directus static token for authenticated OpenAPI fetches.
      serviceAccountName: directus
      containers:
        - name: openapi-fetcher
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              import re
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              url = os.environ.get(
                  "OPENAPI_SOURCE_URL",
                  "http://directus-service.directus.svc.cluster.local:8055/server/specs/oas",
              )
              out_path = "/openapi/openapi.json"

              retry_seconds = int(os.environ.get("OPENAPI_RETRY_SECONDS", "5"))
              refresh_seconds = int(os.environ.get("OPENAPI_REFRESH_SECONDS", "300"))
              fetch_timeout_seconds = int(os.environ.get("OPENAPI_FETCH_TIMEOUT_SECONDS", "15"))
              extra_collections = [
                  item.strip()
                  for item in os.environ.get("OPENAPI_EXTRA_COLLECTIONS", "cms_pages").split(",")
                  if item.strip()
              ]

              vault_addr = os.environ.get("VAULT_ADDR", "http://vault.vault.svc.cluster.local:8200").rstrip("/")
              vault_auth_path = os.environ.get("VAULT_AUTH_PATH", "kubernetes").strip("/")
              vault_role = os.environ.get("VAULT_ROLE", "directus")
              vault_k8s_token_file = os.environ.get(
                  "VAULT_K8S_TOKEN_FILE",
                  "/var/run/secrets/kubernetes.io/serviceaccount/token",
              )
              openapi_token_vault_path = os.environ.get(
                  "OPENAPI_TOKEN_VAULT_PATH",
                  "secret/data/directus/gravitee/openapi/admin",
              )
              openapi_token_vault_key = os.environ.get("OPENAPI_TOKEN_VAULT_KEY", "token")
              openapi_token_cache_seconds = int(os.environ.get("OPENAPI_TOKEN_CACHE_SECONDS", "300"))

              _vault_client_token = ""
              _vault_client_token_expiry = 0.0
              _openapi_token = ""
              _openapi_token_loaded_at = 0.0

              def _read_file(path):
                  try:
                      with open(path, "r", encoding="utf-8") as handle:
                          return handle.read().strip()
                  except Exception:
                      return ""

              def _vault_login():
                  global _vault_client_token, _vault_client_token_expiry
                  now = time.time()
                  if _vault_client_token and now < (_vault_client_token_expiry - 5):
                      return _vault_client_token

                  jwt_token = _read_file(vault_k8s_token_file)
                  if not jwt_token:
                      raise RuntimeError("service-account token unavailable for Vault auth")

                  payload = json.dumps({"role": vault_role, "jwt": jwt_token}).encode("utf-8")
                  req = urllib.request.Request(
                      f"{vault_addr}/v1/auth/{vault_auth_path}/login",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=fetch_timeout_seconds) as resp:
                      if resp.status != 200:
                          raise RuntimeError(f"vault auth failed HTTP {resp.status}")
                      body = json.load(resp)

                  auth = body.get("auth") or {}
                  client_token = auth.get("client_token") or ""
                  lease = int(auth.get("lease_duration") or 300)
                  if not client_token:
                      raise RuntimeError("vault auth did not return client_token")

                  _vault_client_token = client_token
                  _vault_client_token_expiry = now + lease
                  return _vault_client_token

              def _vault_read(path):
                  token = _vault_login()
                  req = urllib.request.Request(
                      f"{vault_addr}/v1/{path.lstrip('/')}",
                      headers={"X-Vault-Token": token},
                  )
                  with urllib.request.urlopen(req, timeout=fetch_timeout_seconds) as resp:
                      if resp.status != 200:
                          raise RuntimeError(f"vault read failed HTTP {resp.status}")
                      return json.load(resp)

              def _get_openapi_token():
                  global _openapi_token, _openapi_token_loaded_at
                  now = time.time()
                  if _openapi_token and now - _openapi_token_loaded_at < openapi_token_cache_seconds:
                      return _openapi_token

                  body = _vault_read(openapi_token_vault_path)
                  token = ((body.get("data") or {}).get("data") or {}).get(openapi_token_vault_key, "") or ""
                  if not token:
                      raise RuntimeError("openapi token missing in Vault payload")

                  _openapi_token = token
                  _openapi_token_loaded_at = now
                  return _openapi_token

              def normalize(obj):
                  if isinstance(obj, dict):
                      obj.pop("jsonSchemaDialect", None)
                      t = obj.get("type")
                      if isinstance(t, list) and "null" in t:
                          t_no_null = [x for x in t if x != "null"]
                          obj["nullable"] = True
                          if len(t_no_null) == 1:
                              obj["type"] = t_no_null[0]
                          else:
                              obj["type"] = t_no_null
                      for key in ("anyOf", "oneOf"):
                          if key in obj and isinstance(obj[key], list):
                              items = obj[key]
                              has_null = any(
                                  isinstance(item, dict) and item.get("type") == "null"
                                  for item in items
                              )
                              if has_null:
                                  obj["nullable"] = True
                                  items = [
                                      item
                                      for item in items
                                      if not (isinstance(item, dict) and item.get("type") == "null")
                                  ]
                              obj[key] = [normalize(item) for item in items]
                      for k, v in list(obj.items()):
                          if k in ("anyOf", "oneOf"):
                              continue
                          obj[k] = normalize(v)
                  elif isinstance(obj, list):
                      return [normalize(item) for item in obj]
                  return obj

              def ensure_path_params(spec):
                  path_re = re.compile(r"{([^}]+)}")
                  paths = spec.get("paths", {})
                  for path, methods in paths.items():
                      if not isinstance(methods, dict):
                          continue
                      required = path_re.findall(path)
                      if not required:
                          continue
                      path_level_params = methods.get("parameters")
                      if path_level_params is None:
                          path_level_params = []
                          methods["parameters"] = path_level_params
                      path_level_params = [
                          p for p in path_level_params if isinstance(p, dict)
                      ]
                      for method, op in methods.items():
                          if method.startswith("x-") or method == "parameters":
                              continue
                          if not isinstance(op, dict):
                              continue
                          op_params = op.get("parameters") or []
                          op_params = [p for p in op_params if isinstance(p, dict)]
                          existing = set(
                              p.get("name")
                              for p in path_level_params + op_params
                              if p.get("in") == "path" and p.get("name")
                          )
                          missing = [p for p in required if p not in existing]
                          if not missing:
                              continue
                          for param in missing:
                              op_params.append(
                                  {
                                      "name": param,
                                      "in": "path",
                                      "required": True,
                                      "schema": {"type": "string"},
                                  }
                              )
                          op["parameters"] = op_params

              def dedupe_operation_ids(spec):
                  seen = {}
                  paths = spec.get("paths", {})
                  for path, methods in paths.items():
                      if not isinstance(methods, dict):
                          continue
                      for method, op in methods.items():
                          if method.startswith("x-") or method == "parameters":
                              continue
                          if not isinstance(op, dict):
                              continue
                          op_id = op.get("operationId")
                          if not op_id:
                              op_id = (
                                  f"{method}_{path}"
                                  .replace("/", "_")
                                  .replace("{", "")
                                  .replace("}", "")
                              )
                              op["operationId"] = op_id
                          if op_id in seen:
                              new_id = f"{op_id}_{method}"
                              if new_id in seen:
                                  idx = 2
                                  while f"{op_id}_{idx}" in seen:
                                      idx += 1
                                  new_id = f"{op_id}_{idx}"
                              op["operationId"] = new_id
                              seen[new_id] = (path, method)
                          else:
                              seen[op_id] = (path, method)

              def pascal_collection_name(collection):
                  return "".join(part[:1].upper() + part[1:] for part in collection.split("_") if part)

              def add_collection_paths(spec):
                  paths = spec.setdefault("paths", {})
                  for collection in extra_collections:
                      if not re.match(r"^[A-Za-z0-9_]+$", collection):
                          print(f"Skipping invalid OpenAPI extra collection: {collection}")
                          continue
                      path = f"/items/{collection}"
                      methods = paths.setdefault(path, {})
                      if "get" in methods:
                          continue
                      methods["get"] = {
                          "operationId": f"readItems{pascal_collection_name(collection)}",
                          "summary": f"Read {collection} items",
                          "parameters": [
                              {"name": "fields", "in": "query", "required": False, "schema": {"type": "string"}},
                              {"name": "filter", "in": "query", "required": False, "schema": {"type": "string"}},
                              {"name": "limit", "in": "query", "required": False, "schema": {"type": "integer"}},
                              {"name": "offset", "in": "query", "required": False, "schema": {"type": "integer"}},
                              {"name": "sort", "in": "query", "required": False, "schema": {"type": "string"}},
                              {"name": "search", "in": "query", "required": False, "schema": {"type": "string"}},
                          ],
                          "responses": {
                              "200": {
                                  "description": "Items response",
                                  "content": {
                                      "application/json": {
                                          "schema": {"type": "object"}
                                      }
                                  },
                              }
                          },
                      }

              def write_stub():
                  if os.path.exists(out_path):
                      return
                  stub = {
                      "openapi": "3.0.3",
                      "info": {
                          "title": "Directus API",
                          "version": "0.0.0",
                      },
                      "paths": {},
                  }
                  os.makedirs(os.path.dirname(out_path), exist_ok=True)
                  with open(out_path, "w", encoding="utf-8") as handle:
                      json.dump(stub, handle)

              def fetch_once():
                  headers = {"Accept": "application/json"}
                  try:
                      token = _get_openapi_token()
                      if token:
                          headers["Authorization"] = f"Bearer {token}"
                  except Exception as exc:
                      print(f"OpenAPI auth token unavailable (fetching anonymously): {exc}")

                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=fetch_timeout_seconds) as resp:
                      if resp.status != 200:
                          raise RuntimeError(f"unexpected status {resp.status}")
                      data = json.load(resp)
                  data["openapi"] = "3.0.3"
                  normalize(data)
                  ensure_path_params(data)
                  add_collection_paths(data)
                  dedupe_operation_ids(data)
                  os.makedirs(os.path.dirname(out_path), exist_ok=True)
                  tmp_path = f"{out_path}.tmp"
                  with open(tmp_path, "w", encoding="utf-8") as handle:
                      json.dump(data, handle)
                  os.replace(tmp_path, out_path)

              write_stub()

              while True:
                  try:
                      fetch_once()
                      print("OpenAPI fetched successfully")
                      time.sleep(refresh_seconds)
                  except Exception as exc:
                      print(f"OpenAPI fetch failed: {exc}")
                      write_stub()
                      time.sleep(retry_seconds)
          env:
            - name: OPENAPI_SOURCE_URL
              value: "http://directus-service.directus.svc.cluster.local:8055/server/specs/oas"
            - name: OPENAPI_RETRY_SECONDS
              value: "5"
            - name: OPENAPI_REFRESH_SECONDS
              value: "300"
            - name: OPENAPI_FETCH_TIMEOUT_SECONDS
              value: "15"
            - name: OPENAPI_TOKEN_VAULT_PATH
              value: "secret/data/directus/gravitee/openapi/admin"
            - name: OPENAPI_TOKEN_VAULT_KEY
              value: "token"
            - name: OPENAPI_TOKEN_CACHE_SECONDS
              value: "300"
            - name: OPENAPI_EXTRA_COLLECTIONS
              value: "cms_pages"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_AUTH_PATH
              value: "kubernetes"
            - name: VAULT_ROLE
              value: "directus"
          volumeMounts:
            - name: openapi
              mountPath: /openapi
        - name: openapi-server
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8080", "--directory", "/openapi"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: openapi
              mountPath: /openapi
      volumes:
        - name: openapi
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: directus-openapi
  namespace: directus
  labels:
    app: directus-openapi
spec:
  selector:
    app: directus-openapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
