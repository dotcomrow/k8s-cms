apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-backup-config
  namespace: directus
  labels:
    app.kubernetes.io/name: directus-full-backup
    app.kubernetes.io/managed-by: argocd
data:
  GCS_PREFIX: "directus-production"
  RETENTION_COUNT: "2"
  VERIFY_RESTORE: "true"
  SSH_USER: "ubuntu"
  SSH_HOST: "129.151.63.67"
  SSH_REMOTE_DB_HOST: "127.0.0.1"
  SSH_REMOTE_DB_PORT: "5432"
  SSH_LOCAL_DB_PORT: "15432"
  UPLOADS_PATH: "/source-uploads"
  VERIFY_DB_HOST: "127.0.0.1"
  VERIFY_DB_PORT: "55432"
  VERIFY_DB_NAME: "directus_restore_verify"
  ESPOCRM_DB_NAME: "espocrm"
  ESPOCRM_DB_USER: "espocrm_app"
  OPENWEBUI_DB_NAME: "openwebui"
  OPENWEBUI_DB_USER: "openwebui_app"
  SUNCOAST_CRM_DB_NAME: "suncoast_crm"
  SUNCOAST_CRM_DB_USER: "suncoast_crm_app"
  BACKUP_WORK_DIR: "/work"
  CONNECT_TIMEOUT_SECONDS: "10"
  COMMAND_TIMEOUT_SECONDS: "7200"
  RESTORE_TIMEOUT_SECONDS: "7200"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directus-backup-gcs
  namespace: directus
  labels:
    app.kubernetes.io/name: directus-full-backup
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: directus-backup-gcs
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: GCS_BUCKET
      remoteRef:
        key: directus-backup-gcs
        property: bucket
    - secretKey: service-account.json
      remoteRef:
        key: directus-backup-gcs
        property: service_account_json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directus-backup-databases
  namespace: directus
  labels:
    app.kubernetes.io/name: directus-full-backup
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: directus-backup-databases
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: ESPOCRM_DB_PASSWORD
      remoteRef:
        key: suncoast-crm-api
        property: espocrm_database_password
    - secretKey: OPENWEBUI_DB_PASSWORD
      remoteRef:
        key: openwebui-db-password
        property: value
    - secretKey: SUNCOAST_CRM_DB_PASSWORD
      remoteRef:
        key: suncoast-crm-api
        property: facade_database_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-backup-scripts
  namespace: directus
data:
  backup.sh: |
    #!/bin/sh
    set -eu

    apk add --no-cache coreutils findutils gzip jq openssh-client tar >/dev/null

    WORK_DIR="${BACKUP_WORK_DIR:-/work}"
    RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)"
    RUN_DIR="${WORK_DIR}/run"
    DATABASES_DIR="${RUN_DIR}/databases"
    VERIFY_UPLOADS_DIR="${WORK_DIR}/uploads-verify"
    SSH_KEY_FILE="/ssh/ssh-key"
    SSH_LOCAL_DB_PORT="${SSH_LOCAL_DB_PORT:-15432}"
    VERIFY_DB_HOST="${VERIFY_DB_HOST:-127.0.0.1}"
    VERIFY_DB_PORT="${VERIFY_DB_PORT:-55432}"
    VERIFY_DB_NAME="${VERIFY_DB_NAME:-directus_restore_verify}"
    VERIFY_RESTORE="${VERIFY_RESTORE:-true}"
    CONNECT_TIMEOUT_SECONDS="${CONNECT_TIMEOUT_SECONDS:-10}"
    COMMAND_TIMEOUT_SECONDS="${COMMAND_TIMEOUT_SECONDS:-7200}"
    RESTORE_TIMEOUT_SECONDS="${RESTORE_TIMEOUT_SECONDS:-7200}"
    UPLOADS_PATH="${UPLOADS_PATH:-/source-uploads}"
    SSH_PID=""
    SNAPSHOT_SESSION_PID=""
    SNAPSHOT_CONTROL_FIFO=""

    cleanup() {
      cleanup_status="$?"
      if [ "${cleanup_status}" -ne 0 ]; then
        touch "${WORK_DIR}/backup-failed" >/dev/null 2>&1 || true
      fi
      touch "${WORK_DIR}/stop-verifier" >/dev/null 2>&1 || true
      if [ -n "${SSH_PID}" ]; then
        kill "${SSH_PID}" >/dev/null 2>&1 || true
      fi
      if [ -n "${SNAPSHOT_SESSION_PID}" ]; then
        kill "${SNAPSHOT_SESSION_PID}" >/dev/null 2>&1 || true
        wait "${SNAPSHOT_SESSION_PID}" >/dev/null 2>&1 || true
      fi
    }
    fail() {
      printf '%s\n' "$1" >&2
      touch "${WORK_DIR}/backup-failed"
      exit 1
    }
    trap cleanup EXIT
    trap 'exit 1' INT TERM

    rm -rf "${RUN_DIR}" "${VERIFY_UPLOADS_DIR}"
    mkdir -p "${DATABASES_DIR}" "${VERIFY_UPLOADS_DIR}"

    case "${GCS_BUCKET:-}" in
      ""|REPLACE_WITH_GCS_BUCKET) fail "GCS_BUCKET is not configured" ;;
    esac
    case "${RETENTION_COUNT:-}" in
      1|2) ;;
      *) fail "RETENTION_COUNT must be 1 or 2" ;;
    esac
    [ -n "${DB_NAME:-}" ] || fail "DB_NAME is not configured"
    [ -n "${DB_USER:-}" ] || fail "DB_USER is not configured"
    [ -n "${DB_PASSWORD:-}" ] || fail "DB_PASSWORD is not configured"
    [ -n "${ESPOCRM_DB_PASSWORD:-}" ] || fail "ESPOCRM_DB_PASSWORD is not configured"
    [ -n "${OPENWEBUI_DB_PASSWORD:-}" ] || fail "OPENWEBUI_DB_PASSWORD is not configured"
    [ -n "${SUNCOAST_CRM_DB_PASSWORD:-}" ] || fail "SUNCOAST_CRM_DB_PASSWORD is not configured"

    echo "Starting read-only SSH tunnel to the Oracle PostgreSQL VM..."
    ssh \
      -N \
      -o BatchMode=yes \
      -o ConnectTimeout="${CONNECT_TIMEOUT_SECONDS}" \
      -o ExitOnForwardFailure=yes \
      -o ServerAliveInterval=15 \
      -o ServerAliveCountMax=3 \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      -o LogLevel=ERROR \
      -i "${SSH_KEY_FILE}" \
      -L "${SSH_LOCAL_DB_PORT}:${SSH_REMOTE_DB_HOST:-127.0.0.1}:${SSH_REMOTE_DB_PORT:-5432}" \
      "${SSH_USER}@${SSH_HOST}" &
    SSH_PID="$!"

    tunnel_attempt=0
    until PGPASSWORD="${DB_PASSWORD}" pg_isready \
      -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" >/dev/null 2>&1; do
      tunnel_attempt=$((tunnel_attempt + 1))
      if [ "${tunnel_attempt}" -ge 30 ]; then
        fail "Timed out waiting for the PostgreSQL SSH tunnel"
      fi
      sleep 2
    done

    export PGCONNECT_TIMEOUT="${CONNECT_TIMEOUT_SECONDS}"

    SERVER_VERSION="$(PGPASSWORD="${DB_PASSWORD}" psql -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -qAtX -c "SHOW server_version;")"
    SERVER_VERSION_NUM="$(PGPASSWORD="${DB_PASSWORD}" psql -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -qAtX -c "SHOW server_version_num;")"

    if [ "${VERIFY_RESTORE}" = "true" ]; then
      verify_attempt=0
      until pg_isready -h "${VERIFY_DB_HOST}" -p "${VERIFY_DB_PORT}" -U postgres -d postgres >/dev/null 2>&1; do
        verify_attempt=$((verify_attempt + 1))
        if [ "${verify_attempt}" -ge 60 ]; then
          fail "Timed out waiting for the isolated verification PostgreSQL instance"
        fi
        sleep 2
      done
    fi

    backup_database() {
      db_slug="$1"
      db_name="$2"
      db_user="$3"
      db_password="$4"
      db_dir="${DATABASES_DIR}/${db_slug}"
      snapshot_id_file="${db_dir}/snapshot-id"
      snapshot_log="${db_dir}/snapshot-session.log"
      dump_file="${db_dir}/${db_slug}.dump"
      restore_list="${db_dir}/${db_slug}.restore-list"
      table_count_sql="${db_dir}/table-counts.sql"
      source_counts="${db_dir}/source-table-counts.txt"
      restored_counts="${db_dir}/restored-table-counts.txt"
      table_count_diff="${db_dir}/table-counts.diff"
      mkdir -p "${db_dir}"

      database_bytes="$(PGPASSWORD="${db_password}" psql -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${db_user}" -d "${db_name}" -qAtX -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database());")"

      # Keep one exported snapshot open per database so its dump and source
      # row counts describe the same point in time.
      SNAPSHOT_CONTROL_FIFO="${db_dir}/snapshot-control"
      mkfifo "${SNAPSHOT_CONTROL_FIFO}"
      PGPASSWORD="${db_password}" psql -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${db_user}" -d "${db_name}" -qAtX -v ON_ERROR_STOP=1 \
        <"${SNAPSHOT_CONTROL_FIFO}" >"${snapshot_log}" 2>&1 &
      SNAPSHOT_SESSION_PID="$!"
      exec 3>"${SNAPSHOT_CONTROL_FIFO}"
      printf '%s\n' \
        'BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;' \
        "\\o ${snapshot_id_file}" \
        'SELECT pg_export_snapshot();' \
        '\o' >&3

      snapshot_waited=0
      while [ ! -s "${snapshot_id_file}" ]; do
        if ! kill -0 "${SNAPSHOT_SESSION_PID}" >/dev/null 2>&1; then
          cat "${snapshot_log}" >&2 || true
          fail "PostgreSQL snapshot session for ${db_name} exited before exporting a snapshot"
        fi
        snapshot_waited=$((snapshot_waited + 1))
        if [ "${snapshot_waited}" -ge 30 ]; then
          fail "Timed out waiting for PostgreSQL to export a ${db_name} snapshot"
        fi
        sleep 1
      done
      database_snapshot_id="$(tr -d '[:space:]' <"${snapshot_id_file}")"
      case "${database_snapshot_id}" in
        *[!0-9A-Fa-f:-]*|'') fail "PostgreSQL returned an invalid ${db_name} snapshot ID" ;;
      esac

      echo "Creating ${db_name} custom-format backup from a shared snapshot..."
      PGPASSWORD="${db_password}" timeout "${COMMAND_TIMEOUT_SECONDS}" pg_dump \
        --host=127.0.0.1 \
        --port="${SSH_LOCAL_DB_PORT}" \
        --username="${db_user}" \
        --dbname="${db_name}" \
        --format=custom \
        --compress=6 \
        --snapshot="${database_snapshot_id}" \
        --no-owner \
        --no-privileges \
        --file="${dump_file}"
      pg_restore --list "${dump_file}" >"${restore_list}"
      test -s "${dump_file}" || fail "${db_name} database dump is empty"
      test -s "${restore_list}" || fail "${db_name} restore list is empty"

      {
        printf '%s\n' \
          'BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;' \
          "SET TRANSACTION SNAPSHOT '${database_snapshot_id}';" \
          "\\o ${table_count_sql}" \
          "SELECT format('SELECT %L || ''|'' || count(*) FROM %I.%I;', schemaname || '.' || tablename, schemaname, tablename) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY schemaname,tablename;" \
          '\o' \
          "\\i ${table_count_sql}"
        printf '%s\n' 'COMMIT;'
      } | PGPASSWORD="${db_password}" psql -h 127.0.0.1 -p "${SSH_LOCAL_DB_PORT}" -U "${db_user}" -d "${db_name}" -qAtX -v ON_ERROR_STOP=1 \
        | sort >"${source_counts}"
      printf '%s\n' 'COMMIT;' '\q' >&3
      exec 3>&-
      wait "${SNAPSHOT_SESSION_PID}"
      SNAPSHOT_SESSION_PID=""
      rm -f "${SNAPSHOT_CONTROL_FIFO}" "${snapshot_id_file}"
      SNAPSHOT_CONTROL_FIFO=""

      isolated_restore=false
      if [ "${VERIFY_RESTORE}" = "true" ]; then
        verify_db_name="${VERIFY_DB_NAME}_${db_slug}"
        echo "Restoring ${db_name} into isolated verification database ${verify_db_name}..."
        dropdb --if-exists -h "${VERIFY_DB_HOST}" -p "${VERIFY_DB_PORT}" -U postgres "${verify_db_name}"
        createdb -h "${VERIFY_DB_HOST}" -p "${VERIFY_DB_PORT}" -U postgres "${verify_db_name}"
        timeout "${RESTORE_TIMEOUT_SECONDS}" pg_restore \
          --exit-on-error \
          --no-owner \
          --no-privileges \
          --host="${VERIFY_DB_HOST}" \
          --port="${VERIFY_DB_PORT}" \
          --username=postgres \
          --dbname="${verify_db_name}" \
          "${dump_file}"
        psql -h "${VERIFY_DB_HOST}" -p "${VERIFY_DB_PORT}" -U postgres -d "${verify_db_name}" -qAtX -v ON_ERROR_STOP=1 -f "${table_count_sql}" \
          | sort >"${restored_counts}"
        if ! diff -u "${source_counts}" "${restored_counts}" >"${table_count_diff}"; then
          cat "${table_count_diff}" >&2
          fail "Restored ${db_name} row counts do not match the exported snapshot"
        fi
        dropdb -h "${VERIFY_DB_HOST}" -p "${VERIFY_DB_PORT}" -U postgres "${verify_db_name}"
        isolated_restore=true
      fi

      dump_bytes="$(stat -c '%s' "${dump_file}")"
      table_count="$(wc -l <"${source_counts}" | tr -d ' ')"
      jq -n \
        --arg database "${db_name}" \
        --arg artifact "databases/${db_slug}/${db_slug}.dump" \
        --argjson database_bytes "${database_bytes}" \
        --argjson dump_bytes "${dump_bytes}" \
        --argjson table_count "${table_count}" \
        --argjson isolated_restore "${isolated_restore}" \
        '{database:$database,artifact:$artifact,database_bytes:$database_bytes,dump_bytes:$dump_bytes,table_count:$table_count,verification:{pg_restore_list:true,isolated_restore:$isolated_restore,row_counts_match:$isolated_restore}}' \
        >"${db_dir}/manifest.json"
    }

    backup_database directus "${DB_NAME}" "${DB_USER}" "${DB_PASSWORD}"
    backup_database espocrm "${ESPOCRM_DB_NAME}" "${ESPOCRM_DB_USER}" "${ESPOCRM_DB_PASSWORD}"
    backup_database openwebui "${OPENWEBUI_DB_NAME}" "${OPENWEBUI_DB_USER}" "${OPENWEBUI_DB_PASSWORD}"
    backup_database suncoast_crm "${SUNCOAST_CRM_DB_NAME}" "${SUNCOAST_CRM_DB_USER}" "${SUNCOAST_CRM_DB_PASSWORD}"

    jq -s '.' "${DATABASES_DIR}"/*/manifest.json >"${RUN_DIR}/databases.json"
    (
      cd "${RUN_DIR}"
      find databases -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >databases/SHA256SUMS
      sha256sum -c databases/SHA256SUMS >/dev/null
      tar -czf databases.tar.gz databases
      gzip -t databases.tar.gz
    )
    ln "${DATABASES_DIR}/directus/directus.dump" "${RUN_DIR}/directus.dump"
    ln "${DATABASES_DIR}/directus/directus.restore-list" "${RUN_DIR}/directus.restore-list"
    ln "${DATABASES_DIR}/directus/source-table-counts.txt" "${RUN_DIR}/source-table-counts.txt"

    echo "Archiving Directus uploads and generating per-file checksums..."
    upload_snapshot_attempt=1
    upload_snapshot_ok=false
    while [ "${upload_snapshot_attempt}" -le 3 ]; do
      rm -rf "${VERIFY_UPLOADS_DIR}"
      mkdir -p "${VERIFY_UPLOADS_DIR}"
      if (
        cd "${UPLOADS_PATH}"
        find . -type f ! -path './directus-health-file' -print0 | sort -z | xargs -0 -r sha256sum >"${RUN_DIR}/uploads.sha256" &&
          tar --exclude='./directus-health-file' -czf "${RUN_DIR}/uploads.tar.gz" .
      ) &&
        gzip -t "${RUN_DIR}/uploads.tar.gz" &&
        tar -xzf "${RUN_DIR}/uploads.tar.gz" -C "${VERIFY_UPLOADS_DIR}" &&
        (
          cd "${VERIFY_UPLOADS_DIR}"
          sha256sum -c "${RUN_DIR}/uploads.sha256" >/dev/null
        ); then
        UPLOAD_FILE_COUNT="$(wc -l <"${RUN_DIR}/uploads.sha256" | tr -d ' ')"
        RESTORED_UPLOAD_FILE_COUNT="$(find "${VERIFY_UPLOADS_DIR}" -type f | wc -l | tr -d ' ')"
        if [ "${UPLOAD_FILE_COUNT}" = "${RESTORED_UPLOAD_FILE_COUNT}" ]; then
          upload_snapshot_ok=true
          break
        fi
        echo "Uploads file count changed while archiving (attempt ${upload_snapshot_attempt}/3); retrying..." >&2
      else
        echo "Uploads changed while archiving (attempt ${upload_snapshot_attempt}/3); retrying..." >&2
      fi
      upload_snapshot_attempt=$((upload_snapshot_attempt + 1))
      sleep 5
    done
    [ "${upload_snapshot_ok}" = "true" ] || fail "Could not create a stable uploads snapshot after 3 attempts"

    DIRECTUS_DUMP_BYTES="$(stat -c '%s' "${RUN_DIR}/directus.dump")"
    DATABASE_ARCHIVE_BYTES="$(stat -c '%s' "${RUN_DIR}/databases.tar.gz")"
    UPLOAD_ARCHIVE_BYTES="$(stat -c '%s' "${RUN_DIR}/uploads.tar.gz")"
    DATABASE_COUNT="$(jq 'length' "${RUN_DIR}/databases.json")"
    ALL_DATABASES_VERIFIED=false
    if [ "${VERIFY_RESTORE}" = "true" ]; then
      ALL_DATABASES_VERIFIED=true
    fi
    jq -n \
      --arg run_id "${RUN_ID}" \
      --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
      --arg database "${DB_NAME}" \
      --arg server_version "${SERVER_VERSION}" \
      --arg server_version_num "${SERVER_VERSION_NUM}" \
      --slurpfile databases "${RUN_DIR}/databases.json" \
      --argjson database_count "${DATABASE_COUNT}" \
      --argjson directus_dump_bytes "${DIRECTUS_DUMP_BYTES}" \
      --argjson database_archive_bytes "${DATABASE_ARCHIVE_BYTES}" \
      --argjson uploads_archive_bytes "${UPLOAD_ARCHIVE_BYTES}" \
      --argjson upload_file_count "${UPLOAD_FILE_COUNT}" \
      --argjson all_databases_verified "${ALL_DATABASES_VERIFIED}" \
      --argjson retention_count "${RETENTION_COUNT}" \
      '{run_id:$run_id,created_at:$created_at,database:$database,databases:$databases[0],postgresql:{server_version:$server_version,server_version_num:$server_version_num,database_count:$database_count},artifacts:{directus_database_dump_bytes:$directus_dump_bytes,database_archive_bytes:$database_archive_bytes,uploads_archive_bytes:$uploads_archive_bytes,upload_file_count:$upload_file_count},verification:{all_database_restore_lists:true,all_databases_isolated_restore:$all_databases_verified,all_database_row_counts_match:$all_databases_verified,uploads_checksums_match:true},retention_count:$retention_count}' \
      >"${RUN_DIR}/manifest.json"
    (
      cd "${RUN_DIR}"
      sha256sum directus.dump directus.restore-list source-table-counts.txt databases.tar.gz databases.json uploads.tar.gz uploads.sha256 manifest.json >SHA256SUMS
      sha256sum -c SHA256SUMS >/dev/null
    )

    printf '%s\n' "${RUN_ID}" >"${WORK_DIR}/run-id"
    touch "${WORK_DIR}/ready-to-upload"
    echo "Backup ${RUN_ID} passed isolated restore, row-count, archive, and checksum verification for ${DATABASE_COUNT} databases."

    upload_waited=0
    until [ -f "${WORK_DIR}/upload-succeeded" ]; do
      if [ -f "${WORK_DIR}/upload-failed" ]; then
        fail "GCS upload or retention rotation failed"
      fi
      upload_waited=$((upload_waited + 5))
      if [ "${upload_waited}" -ge 7200 ]; then
        fail "Timed out waiting for the GCS uploader"
      fi
      sleep 5
    done
    touch "${WORK_DIR}/stop-verifier"
    echo "Backup ${RUN_ID} uploaded and promoted successfully."

  verifier.sh: |
    #!/bin/sh
    set -eu

    docker-entrypoint.sh postgres -p 55432 -c listen_addresses=127.0.0.1 &
    postgres_pid="$!"
    stop_postgres() {
      if kill -0 "${postgres_pid}" >/dev/null 2>&1; then
        kill -TERM "${postgres_pid}" >/dev/null 2>&1 || true
        shutdown_waited=0
        while kill -0 "${postgres_pid}" >/dev/null 2>&1 && [ "${shutdown_waited}" -lt 30 ]; do
          sleep 1
          shutdown_waited=$((shutdown_waited + 1))
        done
        if kill -0 "${postgres_pid}" >/dev/null 2>&1; then
          kill -KILL "${postgres_pid}" >/dev/null 2>&1 || true
        fi
      fi
      wait "${postgres_pid}" >/dev/null 2>&1 || true
    }
    trap stop_postgres EXIT INT TERM

    while [ ! -f /work/stop-verifier ]; do
      if ! kill -0 "${postgres_pid}" >/dev/null 2>&1; then
        wait "${postgres_pid}"
        exit 1
      fi
      sleep 5
    done

  upload.sh: |
    #!/bin/bash
    set -euo pipefail

    WORK_DIR="${BACKUP_WORK_DIR:-/work}"
    RUN_DIR="${WORK_DIR}/run"
    CREDENTIAL_FILE="/gcs/service-account.json"
    trap 'touch "${WORK_DIR}/upload-failed"' ERR

    until [[ -f "${WORK_DIR}/ready-to-upload" ]]; do
      if [[ -f "${WORK_DIR}/backup-failed" ]]; then
        echo "Backup creation failed; uploader is exiting without changing GCS."
        exit 1
      fi
      sleep 5
    done

    RUN_ID="$(<"${WORK_DIR}/run-id")"
    [[ "${RUN_ID}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "Invalid run ID" >&2; exit 1; }
    [[ "${RETENTION_COUNT}" =~ ^[12]$ ]] || { echo "RETENTION_COUNT must be 1 or 2" >&2; exit 1; }
    [[ -s "${CREDENTIAL_FILE}" ]] || { echo "GCS service-account key is missing" >&2; exit 1; }

    gcloud auth activate-service-account --key-file="${CREDENTIAL_FILE}" --quiet >/dev/null
    BASE_URI="gs://${GCS_BUCKET}/${GCS_PREFIX}"
    RUN_URI="${BASE_URI}/runs/${RUN_ID}"

    echo "Uploading verified backup ${RUN_ID}..."
    ARTIFACTS=(
      directus.dump
      directus.restore-list
      source-table-counts.txt
      databases.tar.gz
      databases.json
      uploads.tar.gz
      uploads.sha256
      manifest.json
      SHA256SUMS
    )
    for artifact in "${ARTIFACTS[@]}"; do
      gcloud storage cp "${RUN_DIR}/${artifact}" "${RUN_URI}/${artifact}" --quiet
      local_size="$(stat -c '%s' "${RUN_DIR}/${artifact}")"
      remote_size="$(gcloud storage objects describe "${RUN_URI}/${artifact}" --format='value(size)' --quiet)"
      [[ "${remote_size}" == "${local_size}" ]] || {
        echo "Uploaded size mismatch for ${artifact}: local=${local_size} remote=${remote_size}" >&2
        exit 1
      }
    done

    OLD_LATEST=""
    if gcloud storage cp "${BASE_URI}/latest.json" "${WORK_DIR}/old-latest.json" --quiet 2>/dev/null; then
      OLD_LATEST="$(
        tr -d '\r\n' <"${WORK_DIR}/old-latest.json" \
          | sed -nE 's/.*"run_id"[[:space:]]*:[[:space:]]*"([0-9]{8}T[0-9]{6}Z)".*/\1/p' \
          | head -n1
      )"
      if [[ ! "${OLD_LATEST}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
        echo "Existing latest.json has an invalid run ID; refusing retention changes" >&2
        exit 1
      fi
    fi

    printf '{"run_id":"%s","manifest":"%s"}\n' "${RUN_ID}" "${RUN_URI}/manifest.json" \
      >"${WORK_DIR}/latest.json"
    gcloud storage cp "${WORK_DIR}/latest.json" "${BASE_URI}/latest.json" --quiet

    if [[ "${RETENTION_COUNT}" == "2" && -n "${OLD_LATEST}" && "${OLD_LATEST}" != "${RUN_ID}" ]]; then
      printf '{"run_id":"%s","manifest":"%s"}\n' "${OLD_LATEST}" "${BASE_URI}/runs/${OLD_LATEST}/manifest.json" \
        >"${WORK_DIR}/previous.json"
      gcloud storage cp "${WORK_DIR}/previous.json" "${BASE_URI}/previous.json" --quiet
    elif [[ "${RETENTION_COUNT}" == "1" ]]; then
      gcloud storage rm "${BASE_URI}/previous.json" --quiet 2>/dev/null || true
    fi

    mapfile -t RUN_IDS < <(
      gcloud storage ls "${BASE_URI}/runs/" --recursive 2>/dev/null \
        | sed -nE 's#^.*/runs/([0-9]{8}T[0-9]{6}Z)/.*#\1#p' \
        | sort -u
    )
    for candidate in "${RUN_IDS[@]}"; do
      [[ "${candidate}" == "${RUN_ID}" ]] && continue
      if [[ "${RETENTION_COUNT}" == "2" && "${candidate}" == "${OLD_LATEST}" ]]; then
        continue
      fi
      [[ "${candidate}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
      echo "Deleting expired backup run ${candidate} after successful promotion..."
      gcloud storage rm --recursive "${BASE_URI}/runs/${candidate}" --quiet
    done

    touch "${WORK_DIR}/upload-succeeded"
    trap - ERR
    echo "GCS backup ${RUN_ID} is current; retention count is ${RETENTION_COUNT}."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: directus-full-backup
  namespace: directus
  labels:
    app: directus-full-backup
spec:
  schedule: "0 2 * * *"
  timeZone: "America/New_York"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: directus-full-backup
          annotations:
            linkerd.io/inject: "disabled"
        spec:
          serviceAccountName: directus
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup-and-verify
              image: postgres:16.15-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup.sh"]
              envFrom:
                - configMapRef:
                    name: directus-backup-config
              env:
                - name: GCS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: directus-backup-gcs
                      key: GCS_BUCKET
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: vm-stats-service-db
                      key: name
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: vm-stats-service-db
                      key: user
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vm-stats-service-db
                      key: password
                - name: ESPOCRM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: directus-backup-databases
                      key: ESPOCRM_DB_PASSWORD
                - name: OPENWEBUI_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: directus-backup-databases
                      key: OPENWEBUI_DB_PASSWORD
                - name: SUNCOAST_CRM_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: directus-backup-databases
                      key: SUNCOAST_CRM_DB_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 4Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: ssh-key
                  mountPath: /ssh
                  readOnly: true
                - name: uploads
                  mountPath: /source-uploads
                  readOnly: true
            - name: restore-verifier
              image: postgres:16.15-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/verifier.sh"]
              env:
                - name: POSTGRES_HOST_AUTH_METHOD
                  value: trust
                - name: PGDATA
                  value: /verify-db/data
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                  ephemeral-storage: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 4Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: verify-db
                  mountPath: /verify-db
            - name: gcs-uploader
              image: google/cloud-sdk:stable
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/upload.sh"]
              envFrom:
                - configMapRef:
                    name: directus-backup-config
              env:
                - name: GCS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: directus-backup-gcs
                      key: GCS_BUCKET
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: gcs-credentials
                  mountPath: /gcs
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: directus-backup-scripts
                defaultMode: 0555
            - name: work
              emptyDir:
                sizeLimit: 4Gi
            - name: verify-db
              emptyDir:
                sizeLimit: 4Gi
            - name: ssh-key
              secret:
                secretName: vm-stats-service-ssh
                defaultMode: 0400
                items:
                  - key: private-key
                    path: ssh-key
            - name: uploads
              persistentVolumeClaim:
                claimName: directus-uploads-remote-vm-v9
            - name: gcs-credentials
              secret:
                secretName: directus-backup-gcs
                defaultMode: 0400
                items:
                  - key: service-account.json
                    path: service-account.json
