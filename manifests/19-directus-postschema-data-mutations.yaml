apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-postschema-data-mutations
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: directus
data:
  directus-postschema-data-mutations.sh: |
    set -eu

    run_cms_page_metadata_mutations() {
      sync_site_metadata_failed="0"

      if ! _psql_yb_retry "DO \$\$
        BEGIN
          IF to_regclass('directus.cms_pages') IS NOT NULL THEN
            UPDATE cms_pages
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END,
                   release_channel = CASE WHEN LOWER(COALESCE(release_channel, '')) IN ('preview','prod') THEN LOWER(release_channel) ELSE 'preview' END,
                   theme_mode = CASE WHEN LOWER(COALESCE(theme_mode, '')) IN ('auto','light','dark') THEN LOWER(theme_mode) ELSE 'auto' END,
                   widget_dock_enabled = COALESCE(widget_dock_enabled, true),
                   widget_dock_position = CASE
                     WHEN LOWER(COALESCE(widget_dock_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(widget_dock_position)
                     WHEN LOWER(COALESCE(theme_switcher_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(theme_switcher_position)
                     ELSE 'top-right'
                   END,
                   widget_dock_direction = CASE
                     WHEN LOWER(COALESCE(widget_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(widget_dock_direction)
                     WHEN LOWER(COALESCE(theme_switcher_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(theme_switcher_dock_direction)
                     ELSE 'vertical'
                   END,
                   theme_selector_dock_position = CASE WHEN LOWER(COALESCE(theme_selector_dock_position, '')) IN ('start','end') THEN LOWER(theme_selector_dock_position) ELSE 'start' END,
                   force_login_for_page_access = COALESCE(force_login_for_page_access, false),
                   required_role_for_page_access = CASE
                     WHEN COALESCE(force_login_for_page_access, false) = false THEN NULL
                     WHEN NULLIF(BTRIM(required_role_for_page_access), '') IS NULL THEN NULL
                     WHEN LOWER(NULLIF(BTRIM(required_role_for_page_access), '')) = 'none' THEN NULL
                     ELSE NULLIF(BTRIM(required_role_for_page_access), '')
                   END,
                   theme_switcher_position = CASE
                     WHEN LOWER(COALESCE(widget_dock_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(widget_dock_position)
                     WHEN LOWER(COALESCE(theme_switcher_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(theme_switcher_position)
                     ELSE 'top-right'
                   END,
                   theme_switcher_dock_direction = CASE
                     WHEN LOWER(COALESCE(widget_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(widget_dock_direction)
                     WHEN LOWER(COALESCE(theme_switcher_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(theme_switcher_dock_direction)
                     ELSE 'vertical'
                   END,
                   theme_package_key = CASE WHEN LOWER(COALESCE(BTRIM(theme_package_key), '')) = 'theme-clear-light' THEN 'theme-clear' ELSE theme_package_key END,
                   analytics_google_measurement_id = NULLIF(BTRIM(analytics_google_measurement_id), ''),
                   analytics_openobserve_rum_script_url = NULLIF(BTRIM(analytics_openobserve_rum_script_url), ''),
                   analytics_openobserve_rum_config = CASE WHEN analytics_openobserve_rum_config IS NULL OR jsonb_typeof(analytics_openobserve_rum_config) IS DISTINCT FROM 'object' THEN '{}'::jsonb ELSE analytics_openobserve_rum_config END,
                   page_cache_enabled = COALESCE(page_cache_enabled, false),
                   page_cache_browser_max_age_seconds = LEAST(86400, GREATEST(0, COALESCE(page_cache_browser_max_age_seconds, 0))),
                   page_cache_cdn_max_age_seconds = LEAST(604800, GREATEST(0, COALESCE(page_cache_cdn_max_age_seconds, 60))),
                   page_cache_stale_while_revalidate_seconds = LEAST(604800, GREATEST(0, COALESCE(page_cache_stale_while_revalidate_seconds, 300))),
                   head_title = NULLIF(BTRIM(head_title), ''),
                   head_description = NULLIF(BTRIM(head_description), ''),
                   head_theme_color = CASE WHEN NULLIF(BTRIM(head_theme_color), '') IS NULL THEN NULL WHEN LOWER(NULLIF(BTRIM(head_theme_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(head_theme_color), '')) ELSE NULL END,
                   head_manifest_url = NULLIF(BTRIM(head_manifest_url), ''),
                   head_icon_url = NULLIF(BTRIM(head_icon_url), ''),
                   head_apple_touch_icon_url = NULLIF(BTRIM(head_apple_touch_icon_url), ''),
                   head_icon_shortcut_url = NULLIF(BTRIM(head_icon_shortcut_url), ''),
                   head_icon_svg_url = NULLIF(BTRIM(head_icon_svg_url), ''),
                   head_icon_16_url = NULLIF(BTRIM(head_icon_16_url), ''),
                   head_icon_32_url = NULLIF(BTRIM(head_icon_32_url), ''),
                   head_icon_180_url = NULLIF(BTRIM(head_icon_180_url), ''),
                   head_icon_192_url = NULLIF(BTRIM(head_icon_192_url), ''),
                   head_icon_512_url = NULLIF(BTRIM(head_icon_512_url), ''),
                   head_icon_mask_url = NULLIF(BTRIM(head_icon_mask_url), ''),
                   head_icon_mask_color = CASE WHEN NULLIF(BTRIM(head_icon_mask_color), '') IS NULL THEN NULL WHEN LOWER(NULLIF(BTRIM(head_icon_mask_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(head_icon_mask_color), '')) ELSE NULL END,
                   head_canonical_url = NULLIF(BTRIM(head_canonical_url), ''),
                   head_robots = NULLIF(BTRIM(head_robots), ''),
                   head_generator = NULLIF(BTRIM(head_generator), '');
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL THEN
            UPDATE cms_page_blocks
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END,
                   release_channel = CASE WHEN LOWER(COALESCE(release_channel, '')) IN ('preview','prod') THEN LOWER(release_channel) ELSE 'preview' END,
                   slot = COALESCE(NULLIF(LOWER(BTRIM(slot)), ''), 'main'),
                   group_tag = NULLIF(BTRIM(group_tag), ''),
                   tree_depth = COALESCE(tree_depth, 0),
                   tree_path = COALESCE(tree_path, ''),
                   template_scope = CASE WHEN LOWER(COALESCE(template_scope, '')) = 'template' THEN 'template' ELSE 'page' END,
                   template_group_key = COALESCE(NULLIF(BTRIM(template_group_key), ''), 'page-root'),
                   template_ancestor_block_ids = COALESCE(template_ancestor_block_ids, ''),
                   template_ancestor_template_keys = COALESCE(template_ancestor_template_keys, '');
          END IF;

          IF to_regclass('directus.cms_pages') IS NOT NULL AND to_regclass('directus.cms_page_blocks') IS NOT NULL THEN
            UPDATE cms_page_blocks pb
               SET site_key = p.site_key,
                   release_channel = p.release_channel,
                   page_slug = p.slug,
                   refresh_target = p.refresh_target
              FROM cms_pages p
             WHERE pb.page_id = p.id
               AND (pb.site_key IS DISTINCT FROM p.site_key
                 OR pb.release_channel IS DISTINCT FROM p.release_channel
                 OR pb.page_slug IS DISTINCT FROM p.slug
                 OR pb.refresh_target IS DISTINCT FROM p.refresh_target);
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL AND to_regclass('directus.cms_block_rich_text') IS NOT NULL THEN
            UPDATE cms_block_rich_text rt
               SET release_channel = CASE WHEN LOWER(COALESCE(rt.release_channel, '')) IN ('preview','prod') THEN LOWER(rt.release_channel) ELSE 'preview' END,
                   refresh_target = CASE WHEN LOWER(COALESCE(rt.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(rt.refresh_target) ELSE 'both' END;
            UPDATE cms_block_rich_text rt
               SET site_key = pb.site_key,
                   release_channel = pb.release_channel,
                   page_slug = pb.page_slug,
                   refresh_target = pb.refresh_target
              FROM cms_page_blocks pb
             WHERE pb.collection = 'cms_block_rich_text'
               AND pb.item = rt.id::text;
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL AND to_regclass('directus.cms_block_hero') IS NOT NULL THEN
            UPDATE cms_block_hero h
               SET release_channel = CASE WHEN LOWER(COALESCE(h.release_channel, '')) IN ('preview','prod') THEN LOWER(h.release_channel) ELSE 'preview' END,
                   refresh_target = CASE WHEN LOWER(COALESCE(h.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(h.refresh_target) ELSE 'both' END,
                   background_image = NULLIF(BTRIM(h.background_image), '');
            UPDATE cms_block_hero h
               SET site_key = pb.site_key,
                   release_channel = pb.release_channel,
                   page_slug = pb.page_slug,
                   refresh_target = pb.refresh_target
              FROM cms_page_blocks pb
             WHERE pb.collection = 'cms_block_hero'
               AND pb.item = h.id::text;
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL AND to_regclass('directus.cms_block_module') IS NOT NULL THEN
            UPDATE cms_block_module m
               SET module_provider = COALESCE(NULLIF(LOWER(BTRIM(COALESCE(m.module_provider, ''))), ''), 'radix'),
                   release_channel = CASE WHEN LOWER(COALESCE(m.release_channel, '')) IN ('preview','prod') THEN LOWER(m.release_channel) ELSE 'preview' END,
                   refresh_target = CASE WHEN LOWER(COALESCE(m.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(m.refresh_target) ELSE 'both' END;
            UPDATE cms_block_module m
               SET module_provider = COALESCE(NULLIF((SELECT LOWER(BTRIM(COALESCE(mm.provider, '')))
                                                        FROM cms_modules mm
                                                       WHERE mm.module_key = m.module_key
                                                         AND LOWER(COALESCE(mm.status, 'published')) = 'published'
                                                         AND (COALESCE(NULLIF(BTRIM(COALESCE(mm.site_key, '')), ''), '') = ''
                                                           OR COALESCE(NULLIF(BTRIM(COALESCE(mm.site_key, '')), ''), '') = COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), ''))
                                                       ORDER BY CASE WHEN COALESCE(NULLIF(BTRIM(COALESCE(mm.site_key, '')), ''), '') = COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') THEN 0 ELSE 1 END,
                                                                COALESCE(mm.date_updated, mm.date_created, now()) DESC
                                                       LIMIT 1), ''), m.module_provider, 'radix')
             WHERE m.module_key IS NOT NULL
               AND BTRIM(m.module_key) <> ''
               AND to_regclass('directus.cms_modules') IS NOT NULL;
            UPDATE cms_block_module m
               SET site_key = pb.site_key,
                   release_channel = pb.release_channel,
                   page_slug = pb.page_slug,
                   refresh_target = pb.refresh_target
              FROM cms_page_blocks pb
             WHERE pb.collection = 'cms_block_module'
               AND pb.item = m.id::text;
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL AND to_regclass('directus.cms_block_template_ref') IS NOT NULL THEN
            UPDATE cms_block_template_ref tr
               SET release_channel = CASE WHEN LOWER(COALESCE(tr.release_channel, '')) IN ('preview','prod') THEN LOWER(tr.release_channel) ELSE 'preview' END,
                   refresh_target = CASE WHEN LOWER(COALESCE(tr.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(tr.refresh_target) ELSE 'both' END;
            UPDATE cms_block_template_ref tr
               SET site_key = pb.site_key,
                   release_channel = pb.release_channel,
                   page_slug = pb.page_slug,
                   refresh_target = pb.refresh_target
              FROM cms_page_blocks pb
             WHERE pb.collection = 'cms_block_template_ref'
               AND pb.item = tr.id::text;
          END IF;

          IF to_regclass('directus.cms_layout_templates') IS NOT NULL THEN
            UPDATE cms_layout_templates
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END;
          END IF;

          IF to_regclass('directus.cms_layout_template_slots') IS NOT NULL THEN
            UPDATE cms_layout_template_slots
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END;
            IF to_regclass('directus.cms_layout_templates') IS NOT NULL THEN
              UPDATE cms_layout_template_slots s
                 SET refresh_target = t.refresh_target
                FROM cms_layout_templates t
               WHERE s.template_key = t.template_key
                 AND COALESCE(s.site_key, '') = COALESCE(t.site_key, '')
                 AND s.refresh_target IS DISTINCT FROM t.refresh_target;
            END IF;
          END IF;

          IF to_regclass('directus.cms_modules') IS NOT NULL THEN
            UPDATE cms_modules
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END;
          END IF;

          IF to_regclass('directus.cms_theme_packages') IS NOT NULL THEN
            UPDATE cms_theme_packages
               SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END;
          END IF;
        END
        \$\$;" "normalize CMS page/block metadata for optional rebuild bootstrap" 24; then
        sync_site_metadata_failed="1"
      fi

      if ! _psql_yb_retry "DO \$\$
        BEGIN
          IF to_regclass('directus.cms_pages') IS NOT NULL THEN
            ALTER TABLE cms_pages ALTER COLUMN refresh_target SET DEFAULT 'both';
            ALTER TABLE cms_pages ALTER COLUMN release_channel SET DEFAULT 'preview';
            ALTER TABLE cms_pages ALTER COLUMN theme_mode SET DEFAULT 'auto';
            ALTER TABLE cms_pages ALTER COLUMN widget_dock_enabled SET DEFAULT true;
            ALTER TABLE cms_pages ALTER COLUMN widget_dock_position SET DEFAULT 'top-right';
            ALTER TABLE cms_pages ALTER COLUMN widget_dock_direction SET DEFAULT 'vertical';
            ALTER TABLE cms_pages ALTER COLUMN theme_selector_dock_position SET DEFAULT 'start';
            ALTER TABLE cms_pages ALTER COLUMN analytics_openobserve_rum_config SET DEFAULT '{}'::jsonb;
            ALTER TABLE cms_pages ALTER COLUMN page_cache_enabled SET DEFAULT false;
            ALTER TABLE cms_pages ALTER COLUMN page_cache_browser_max_age_seconds SET DEFAULT 0;
            ALTER TABLE cms_pages ALTER COLUMN page_cache_cdn_max_age_seconds SET DEFAULT 60;
            ALTER TABLE cms_pages ALTER COLUMN page_cache_stale_while_revalidate_seconds SET DEFAULT 300;
            ALTER TABLE cms_pages ALTER COLUMN force_login_for_page_access SET DEFAULT false;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_refresh_target_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_release_channel_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_release_channel_check CHECK (release_channel IN ('preview','prod'));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_theme_mode_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_theme_mode_check CHECK (theme_mode IN ('auto','light','dark'));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_page_cache_browser_max_age_seconds_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_page_cache_browser_max_age_seconds_check CHECK (page_cache_browser_max_age_seconds IS NULL OR (page_cache_browser_max_age_seconds >= 0 AND page_cache_browser_max_age_seconds <= 86400));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_page_cache_cdn_max_age_seconds_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_page_cache_cdn_max_age_seconds_check CHECK (page_cache_cdn_max_age_seconds IS NULL OR (page_cache_cdn_max_age_seconds >= 0 AND page_cache_cdn_max_age_seconds <= 604800));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_pages_page_cache_stale_while_revalidate_seconds_check' AND conrelid = to_regclass('directus.cms_pages')) THEN
              ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_page_cache_stale_while_revalidate_seconds_check CHECK (page_cache_stale_while_revalidate_seconds IS NULL OR (page_cache_stale_while_revalidate_seconds >= 0 AND page_cache_stale_while_revalidate_seconds <= 604800));
            END IF;
          END IF;

          IF to_regclass('directus.cms_page_blocks') IS NOT NULL THEN
            ALTER TABLE cms_page_blocks ALTER COLUMN slot SET DEFAULT 'main';
            ALTER TABLE cms_page_blocks ALTER COLUMN refresh_target SET DEFAULT 'both';
            ALTER TABLE cms_page_blocks ALTER COLUMN release_channel SET DEFAULT 'preview';
            ALTER TABLE cms_page_blocks ALTER COLUMN tree_depth SET DEFAULT 0;
            ALTER TABLE cms_page_blocks ALTER COLUMN template_scope SET DEFAULT 'page';
            ALTER TABLE cms_page_blocks ALTER COLUMN template_group_key SET DEFAULT 'page-root';
            ALTER TABLE cms_page_blocks ALTER COLUMN template_ancestor_block_ids SET DEFAULT '';
            ALTER TABLE cms_page_blocks ALTER COLUMN template_ancestor_template_keys SET DEFAULT '';
            ALTER TABLE cms_page_blocks ALTER COLUMN tree_path SET DEFAULT '';
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_page_blocks_refresh_target_check' AND conrelid = to_regclass('directus.cms_page_blocks')) THEN
              ALTER TABLE cms_page_blocks ADD CONSTRAINT cms_page_blocks_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_page_blocks_release_channel_check' AND conrelid = to_regclass('directus.cms_page_blocks')) THEN
              ALTER TABLE cms_page_blocks ADD CONSTRAINT cms_page_blocks_release_channel_check CHECK (release_channel IN ('preview','prod'));
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_page_blocks_template_scope_check' AND conrelid = to_regclass('directus.cms_page_blocks')) THEN
              ALTER TABLE cms_page_blocks ADD CONSTRAINT cms_page_blocks_template_scope_check CHECK (template_scope IN ('page','template'));
            END IF;
          END IF;

          IF to_regclass('directus.cms_block_module') IS NOT NULL THEN
            ALTER TABLE cms_block_module ALTER COLUMN module_provider SET DEFAULT 'radix';
          END IF;

          IF to_regclass('directus.cms_layout_templates') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_layout_templates_refresh_target_check' AND conrelid = to_regclass('directus.cms_layout_templates')) THEN
            ALTER TABLE cms_layout_templates ADD CONSTRAINT cms_layout_templates_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
          END IF;
          IF to_regclass('directus.cms_layout_template_slots') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_layout_template_slots_refresh_target_check' AND conrelid = to_regclass('directus.cms_layout_template_slots')) THEN
            ALTER TABLE cms_layout_template_slots ADD CONSTRAINT cms_layout_template_slots_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
          END IF;
          IF to_regclass('directus.cms_modules') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_modules_refresh_target_check' AND conrelid = to_regclass('directus.cms_modules')) THEN
            ALTER TABLE cms_modules ADD CONSTRAINT cms_modules_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
          END IF;
          IF to_regclass('directus.cms_theme_packages') IS NOT NULL AND NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'cms_theme_packages_refresh_target_check' AND conrelid = to_regclass('directus.cms_theme_packages')) THEN
            ALTER TABLE cms_theme_packages ADD CONSTRAINT cms_theme_packages_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
          END IF;
        END
        \$\$;" "enforce optional CMS refresh/default guards" 24; then
        sync_site_metadata_failed="1"
      fi

      if ! _psql_yb_retry "CREATE OR REPLACE FUNCTION cms_pages_parent_scope_guard()
        RETURNS trigger
        LANGUAGE plpgsql
        AS \$\$
        DECLARE
          parent_site_key text;
          parent_release_channel text;
        BEGIN
          IF NEW.parent IS NULL THEN
            RETURN NEW;
          END IF;
          IF NEW.id IS NOT NULL AND NEW.parent = NEW.id THEN
            RAISE EXCEPTION 'cms_pages.parent cannot reference the same page id (%).', NEW.id;
          END IF;
          SELECT p.site_key, p.release_channel
            INTO parent_site_key, parent_release_channel
            FROM cms_pages p
           WHERE p.id = NEW.parent;
          IF NOT FOUND THEN
            RETURN NEW;
          END IF;
          IF NEW.site_key IS DISTINCT FROM parent_site_key OR NEW.release_channel IS DISTINCT FROM parent_release_channel THEN
            RAISE EXCEPTION 'cms_pages.parent must reference a page in the same site_key and release_channel.';
          END IF;
          RETURN NEW;
        END
        \$\$;
        DO \$\$
        BEGIN
          IF to_regclass('directus.cms_pages') IS NULL THEN
            RETURN;
          END IF;
          DROP TRIGGER IF EXISTS cms_pages_parent_scope_guard_trg ON cms_pages;
          CREATE TRIGGER cms_pages_parent_scope_guard_trg
            BEFORE INSERT OR UPDATE OF parent, site_key, release_channel
            ON cms_pages
            FOR EACH ROW
            EXECUTE FUNCTION cms_pages_parent_scope_guard();
        END
        \$\$;" "enforce cms_pages.parent scope guard" 24; then
        sync_site_metadata_failed="1"
      fi

      if ! _psql_yb_retry "CREATE OR REPLACE FUNCTION cms_pages_access_scope_guard()
        RETURNS trigger
        LANGUAGE plpgsql
        AS \$\$
        BEGIN
          IF TG_OP = 'UPDATE'
             AND COALESCE(NULLIF(BTRIM(NEW.site_key), ''), '') IS DISTINCT FROM COALESCE(NULLIF(BTRIM(OLD.site_key), ''), '') THEN
            NEW.force_login_for_page_access := false;
            NEW.required_role_for_page_access := NULL;
          END IF;
          NEW.force_login_for_page_access := COALESCE(NEW.force_login_for_page_access, false);
          IF NEW.force_login_for_page_access = false THEN
            NEW.required_role_for_page_access := NULL;
          ELSE
            NEW.required_role_for_page_access := NULLIF(BTRIM(NEW.required_role_for_page_access), '');
            IF LOWER(COALESCE(NEW.required_role_for_page_access, '')) = 'none' THEN
              NEW.required_role_for_page_access := NULL;
            END IF;
          END IF;
          RETURN NEW;
        END
        \$\$;
        DO \$\$
        BEGIN
          IF to_regclass('directus.cms_pages') IS NULL THEN
            RETURN;
          END IF;
          DROP TRIGGER IF EXISTS cms_pages_access_scope_guard_trg ON cms_pages;
          CREATE TRIGGER cms_pages_access_scope_guard_trg
            BEFORE INSERT OR UPDATE OF site_key, force_login_for_page_access, required_role_for_page_access
            ON cms_pages
            FOR EACH ROW
            EXECUTE FUNCTION cms_pages_access_scope_guard();
        END
        \$\$;" "enforce cms_pages access-scope guard" 24; then
        sync_site_metadata_failed="1"
      fi

      if [ "${sync_site_metadata_failed}" != "0" ]; then
        echo "Warning: one or more optional CMS metadata mutations failed; continuing with best-effort updates."
      fi
    }

    run_site_homepage_mutations() {
      if [ -z "${site_key:-}" ] || [ "${site_key}" = "null" ]; then
        return 0
      fi
      if [ "${CMS_PAGES_TABLE_EXISTS:-0}" != "1" ]; then
        echo "INFO: cms_pages table not found; skipping homepage provisioning for site_key='${site_key}'."
        return 0
      fi

      site_key_sql="$(printf '%s' "${site_key}" | sed "s/'/''/g")"
      homepage_slug_sql="$(printf '%s' "${homepage_slug:-home}" | sed "s/'/''/g")"
      homepage_release_channel_sql="$(printf '%s' "${homepage_release_channel:-preview}" | sed "s/'/''/g")"
      homepage_layout_template_value_sql="NULL"
      homepage_theme_package_value_sql="NULL"
      if [ -n "${homepage_layout_template_key:-}" ]; then
        homepage_layout_template_key_sql="$(printf '%s' "${homepage_layout_template_key}" | sed "s/'/''/g")"
        homepage_layout_template_value_sql="'${homepage_layout_template_key_sql}'"
      fi
      if [ -n "${homepage_theme_package_key:-}" ]; then
        homepage_theme_package_key_sql="$(printf '%s' "${homepage_theme_package_key}" | sed "s/'/''/g")"
        homepage_theme_package_value_sql="'${homepage_theme_package_key_sql}'"
      fi

      HOME_PAGE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT id FROM directus.cms_pages WHERE site_key='${site_key_sql}' AND release_channel='${homepage_release_channel_sql}' AND slug='${homepage_slug_sql}' LIMIT 1;" || true)"
      HOME_PAGE_ID="$(printf '%s' "${HOME_PAGE_ID:-}" | tr -d '\r')"

      if [ -z "${HOME_PAGE_ID:-}" ] || [ "${HOME_PAGE_ID}" = "null" ]; then
        UNSCOPED_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT id FROM directus.cms_pages WHERE slug='${homepage_slug_sql}' AND release_channel='${homepage_release_channel_sql}' AND (site_key IS NULL OR site_key='') ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST LIMIT 1;" || true)"
        UNSCOPED_ID="$(printf '%s' "${UNSCOPED_ID:-}" | tr -d '\r')"
        if [ -n "${UNSCOPED_ID:-}" ] && [ "${UNSCOPED_ID}" != "null" ]; then
          unscoped_id_sql="$(printf '%s' "${UNSCOPED_ID}" | sed "s/'/''/g")"
          if _psql_yb_retry "UPDATE cms_pages SET site_key='${site_key_sql}', release_channel='${homepage_release_channel_sql}' WHERE id='${unscoped_id_sql}';" "claim unscoped homepage for ${site_key}"; then
            HOME_PAGE_ID="${UNSCOPED_ID}"
            echo "INFO: Assigned existing unscoped homepage slug='${homepage_slug}' to site_key='${site_key}'."
          fi
        else
          NEW_HOME_ID="$(cat /proc/sys/kernel/random/uuid)"
          new_home_sql="$(printf '%s' "${NEW_HOME_ID}" | sed "s/'/''/g")"
          title_sql="$(printf '%s' "${site_key} Home" | sed "s/'/''/g")"
          if _psql_yb_retry "INSERT INTO cms_pages (id, slug, title, status, site_key, release_channel, layout_template_key, theme_package_key, theme_mode, analytics_openobserve_rum_config, widget_dock_enabled, widget_dock_position, widget_dock_direction, theme_selector_dock_position, theme_switcher_position, theme_switcher_dock_direction, refresh_target, force_login_for_page_access, required_role_for_page_access)
            VALUES ('${new_home_sql}', '${homepage_slug_sql}', '${title_sql}', 'published', '${site_key_sql}', '${homepage_release_channel_sql}', ${homepage_layout_template_value_sql}, ${homepage_theme_package_value_sql}, 'auto', '{}'::jsonb, true, 'top-right', 'vertical', 'start', 'top-right', 'vertical', 'both', false, NULL);" "seed default homepage for ${site_key}"; then
            HOME_PAGE_ID="${NEW_HOME_ID}"
            echo "INFO: Created default homepage for site_key='${site_key}'."
          fi
        fi
      fi

      if [ -n "${HOME_PAGE_ID:-}" ] && [ "${HOME_PAGE_ID}" != "null" ]; then
        home_page_id_sql="$(printf '%s' "${HOME_PAGE_ID}" | sed "s/'/''/g")"
        _psql_yb_retry "UPDATE cms_pages
          SET refresh_target = CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END,
              release_channel = '${homepage_release_channel_sql}',
              theme_mode = CASE WHEN LOWER(COALESCE(theme_mode, '')) IN ('auto','light','dark') THEN LOWER(theme_mode) ELSE 'auto' END,
              widget_dock_enabled = COALESCE(widget_dock_enabled, true),
              widget_dock_position = CASE WHEN LOWER(COALESCE(widget_dock_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(widget_dock_position) ELSE 'top-right' END,
              widget_dock_direction = CASE WHEN LOWER(COALESCE(widget_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(widget_dock_direction) ELSE 'vertical' END,
              theme_selector_dock_position = CASE WHEN LOWER(COALESCE(theme_selector_dock_position, '')) IN ('start','end') THEN LOWER(theme_selector_dock_position) ELSE 'start' END,
              theme_switcher_position = widget_dock_position,
              theme_switcher_dock_direction = widget_dock_direction,
              layout_template_key = COALESCE(${homepage_layout_template_value_sql}, layout_template_key),
              theme_package_key = COALESCE(${homepage_theme_package_value_sql}, theme_package_key)
          WHERE id='${home_page_id_sql}';" "normalize homepage for ${site_key}" 12 || true

        _psql_yb_retry "UPDATE cms_page_blocks pb
          SET site_key=p.site_key, release_channel=p.release_channel, page_slug=p.slug, refresh_target=p.refresh_target, slot=COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main')
          FROM cms_pages p
          WHERE pb.page_id=p.id AND p.id='${home_page_id_sql}';" "sync homepage block metadata for ${site_key}" 12 || true
      fi
    }

    run_directus_settings_mutations() {
      SETTINGS_FILE="${EXTRA_SETTINGS_FILE:-/directus-settings/settings.yaml}"
      if [ ! -f "${SETTINGS_FILE}" ]; then
        echo "INFO: ${SETTINGS_FILE} not found; skipping optional Directus settings seed."
        return 0
      fi

      SETTINGS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT CASE WHEN to_regclass('directus.directus_settings') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
      SETTINGS_TABLE_EXISTS="$(printf '%s' "${SETTINGS_TABLE_EXISTS:-0}" | tr -d '\r')"
      if [ "${SETTINGS_TABLE_EXISTS}" != "1" ]; then
        echo "INFO: directus_settings table not found; skipping optional Directus settings seed."
        return 0
      fi

      SETTINGS_JSON="$(yq -o=json '.' "${SETTINGS_FILE}")"

      _settings_sql_escape() {
        printf '%s' "$1" | sed "s/'/''/g"
      }

      _settings_value_sql() {
        _settings_data_type="$1"
        _settings_udt_name="$2"
        _settings_entry="$3"
        _settings_value_type="$(printf '%s' "${_settings_entry}" | jq -r '.value | type')"

        if [ "${_settings_value_type}" = "null" ]; then
          printf 'NULL'
          return 0
        fi

        case "${_settings_data_type}:${_settings_udt_name}" in
          boolean:bool)
            printf '%s' "$(printf '%s' "${_settings_entry}" | jq -r 'if .value == true then "true" elif .value == false then "false" else "false" end')"
            ;;
          smallint:*|integer:*|bigint:*|real:*|double\ precision:*|numeric:*)
            printf '%s' "$(printf '%s' "${_settings_entry}" | jq -r '.value | tonumber')"
            ;;
          json:json|jsonb:jsonb)
            _settings_json_value="$(printf '%s' "${_settings_entry}" | jq -c '.value')"
            _settings_json_value_sql="$(_settings_sql_escape "${_settings_json_value}")"
            if [ "${_settings_data_type}" = "jsonb" ]; then
              printf "'%s'::jsonb" "${_settings_json_value_sql}"
            else
              printf "'%s'::json" "${_settings_json_value_sql}"
            fi
            ;;
          *)
            if [ "${_settings_value_type}" = "array" ] || [ "${_settings_value_type}" = "object" ]; then
              _settings_text_value="$(printf '%s' "${_settings_entry}" | jq -c '.value')"
            else
              _settings_text_value="$(printf '%s' "${_settings_entry}" | jq -r '.value | tostring')"
            fi
            _settings_text_value_sql="$(_settings_sql_escape "${_settings_text_value}")"
            printf "'%s'" "${_settings_text_value_sql}"
            ;;
        esac
      }

      SETTINGS_ROW_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT COUNT(*) FROM directus.directus_settings;" || true)"
      SETTINGS_ROW_COUNT="$(printf '%s' "${SETTINGS_ROW_COUNT:-0}" | tr -d '\r')"
      if [ -z "${SETTINGS_ROW_COUNT:-}" ] || [ "${SETTINGS_ROW_COUNT}" = "0" ]; then
        if ! _psql_yb_retry "INSERT INTO directus.directus_settings DEFAULT VALUES;" "seed directus_settings singleton row" 12; then
          echo "ERROR: Failed to seed directus_settings singleton row." >&2
          return 1
        fi
      fi

      printf '%s' "${SETTINGS_JSON}" | jq -c 'to_entries[] | select(.key != "id")' > /tmp/directus-settings-seed-items.jsonl
      while IFS= read -r settings_entry || [ -n "${settings_entry:-}" ]; do
        [ -z "${settings_entry:-}" ] && continue

        settings_key="$(printf '%s' "${settings_entry}" | jq -r '.key')"
        if ! printf '%s' "${settings_key}" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
          echo "INFO: Skipping invalid Directus settings key '${settings_key}'."
          continue
        fi

        case "${settings_key}" in
          module_bar)
            settings_value_type="$(printf '%s' "${settings_entry}" | jq -r '.value | type')"
            if [ "${settings_value_type}" = "null" ]; then
              echo "INFO: Skipping directus_settings.module_bar null; module bar is reconciled separately."
              continue
            fi
            ;;
          *_api_key)
            echo "INFO: Skipping ${settings_key}; Directus runtime encrypts API key settings from Vault."
            continue
            ;;
        esac

        settings_key_sql="$(_settings_sql_escape "${settings_key}")"
        settings_col_meta="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT data_type || '|' || udt_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' AND column_name='${settings_key_sql}' LIMIT 1;" || true)"
        settings_col_meta="$(printf '%s' "${settings_col_meta:-}" | tr -d '\r')"
        if [ -z "${settings_col_meta:-}" ]; then
          echo "INFO: directus_settings.${settings_key} does not exist in this Directus version; skipping."
          continue
        fi

        settings_data_type="${settings_col_meta%%|*}"
        settings_udt_name="${settings_col_meta#*|}"
        settings_value_sql="$(_settings_value_sql "${settings_data_type}" "${settings_udt_name}" "${settings_entry}")"

        if ! _psql_yb_retry "UPDATE directus.directus_settings SET \"${settings_key}\" = ${settings_value_sql} WHERE \"${settings_key}\" IS DISTINCT FROM ${settings_value_sql};" "seed directus_settings.${settings_key}" 12; then
          echo "ERROR: Failed to seed directus_settings.${settings_key}." >&2
          return 1
        fi
      done < /tmp/directus-settings-seed-items.jsonl

      echo "INFO: Optional Directus settings seed completed from ${SETTINGS_FILE}."
    }
