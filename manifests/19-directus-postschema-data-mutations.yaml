                  theme_exists="$(printf '%s' "$theme_exists" | tr -d '\r')"
                  if [ "$theme_exists" = "1" ]; then
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; UPDATE cms_pages SET theme_package_key='${homepage_theme_package_key_sql}' WHERE site_key='${site_key_sql}' AND release_channel='${homepage_release_channel_sql}' AND slug='${homepage_slug_sql}' AND (theme_package_key IS DISTINCT FROM '${homepage_theme_package_key_sql}');"
                    echo "✅ Set homepage theme '${homepage_theme_package_key}' for site_key='${site_key}'"
                  else
                    echo "⚠️  homepage theme '${homepage_theme_package_key}' not found for site_key='${site_key}' (or global published); leaving page unchanged"
                  fi
                fi
              elif [ -n "${site_key:-}" ] && [ "${site_key}" != "null" ]; then
                echo "ℹ️ cms_pages table not found; skipping homepage provisioning for site_key='${site_key}'."
              fi
        
    }

    run_directus_settings_mutations() {
        # 6) Configure Directus settings directly in DB
        echo "🤖 Configuring Directus settings..."
        EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
        EXTRA_SETTINGS_HAS_KEYS="0"
        OPENAI_KEY=""
        OPENAI_KEY_SOURCE=""
        if [ -f "$EXTRA_SETTINGS_FILE" ]; then
          EXTRA_SETTINGS_JSON="$(yq -o=json '.' "$EXTRA_SETTINGS_FILE" 2>/dev/null || true)"
          if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'type=="object"' >/dev/null 2>&1; then
            if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'length>0' >/dev/null 2>&1; then
              EXTRA_SETTINGS_HAS_KEYS="1"
            fi
            OPENAI_KEY_FROM_SETTINGS="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r \
              'to_entries[] | select(.key|test("openai.*key$"; "i")) | .value | if type=="string" then . else empty end' \
              | head -n1 || true)"
            if [ -n "${OPENAI_KEY_FROM_SETTINGS:-}" ] && [ "${OPENAI_KEY_FROM_SETTINGS}" != "null" ]; then
              if printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q '<' && \
                 printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q 'path:'; then
                echo "⚠️ OpenAI key placeholder detected in settings.yaml (AVP not rendered); will try Vault."
              else
                OPENAI_KEY="$OPENAI_KEY_FROM_SETTINGS"
                OPENAI_KEY_SOURCE="settings.yaml"
              fi
            fi
          else
            echo "⚠️ Invalid YAML in $EXTRA_SETTINGS_FILE; ignoring."
          fi
        fi
        
        if [ -z "${OPENAI_KEY:-}" ]; then
          OPENAI_KEY="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/secret/data/open_ai_key" | jq -r '.data.data.value' || true)"
          if [ -n "${OPENAI_KEY:-}" ] && [ "${OPENAI_KEY}" != "null" ]; then
            OPENAI_KEY_SOURCE="vault"
          else
            OPENAI_KEY=""
            OPENAI_KEY_SOURCE=""
            echo "⚠️ OpenAI key missing; will skip OpenAI setting."
          fi
        fi
        
        SETTINGS_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' ORDER BY column_name;" || true)"
        if [ -z "${SETTINGS_COLS:-}" ]; then
          echo "⚠️ Could not read directus_settings columns; skipping settings."
          touch "${POSTSCHEMA_DB_READY_FILE}"
          touch "${POSTSCHEMA_READY_FILE}"
          echo "✅ Schema patch applied. Going idle."
          exec tail -f /dev/null
        fi
        
        ENCRYPTED_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT field FROM directus.directus_fields WHERE collection='directus_settings' AND special::text ILIKE '%encrypt%';" || true)"
        ENCRYPTED_REGEX='^1\\|\\|scrypt\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+$'
        
        EXTRA_ENCRYPTED_COLS="ai_openai_api_key ai_anthropic_api_key ai_google_api_key ai_openai_compatible_api_key"
        _sanitize_encrypted_col() {
          enc_col="$1"
          [ -z "${enc_col:-}" ] && return 0
          if ! printf '%s\n' "$SETTINGS_COLS" | grep -qx "$enc_col"; then
            return 0
          fi
          _col_escaped="$(printf '%s' "$enc_col" | sed 's/\"/\"\"/g')"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL WHERE \"${_col_escaped}\" IS NOT NULL AND \"${_col_escaped}\" !~ '${ENCRYPTED_REGEX}';"
        }
        
        echo "🔐 Sanitizing encrypted settings fields..."
        if [ -n "${ENCRYPTED_COLS:-}" ]; then
          printf '%s\n' "$ENCRYPTED_COLS" | while IFS= read -r enc_col; do
            _sanitize_encrypted_col "$enc_col"
          done
        fi
        for enc_col in $EXTRA_ENCRYPTED_COLS; do
          _sanitize_encrypted_col "$enc_col"
        done
        
        _update_setting() {
          _col="$1"
          _val="$2"
          _col_escaped="$(printf '%s' "$_col" | sed 's/\"/\"\"/g')"
          _val_escaped="$(printf '%s' "$_val" | sed "s/'/''/g")"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = '${_val_escaped}';"
        }
        
        UPDATED="0"
        
        if [ -n "${OPENAI_KEY:-}" ]; then
          OPENAI_COL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' AND column_name ~* 'openai.*key$' ORDER BY column_name LIMIT 1;" || true)"
          if [ -n "${OPENAI_COL:-}" ]; then
            if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$OPENAI_COL" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$OPENAI_COL"; then
              echo "⚠️ ${OPENAI_COL} is encrypted; skipping direct DB update to avoid invalid encrypted payload."
            else
              _update_setting "$OPENAI_COL" "$OPENAI_KEY"
              UPDATED="1"
              echo "✅ OpenAI key stored in directus_settings.${OPENAI_COL} (source: ${OPENAI_KEY_SOURCE})"
            fi
          else
            echo "⚠️ No OpenAI settings column found in directus_settings; skipping OpenAI setting."
          fi
        fi
        
        if [ "$EXTRA_SETTINGS_HAS_KEYS" = "1" ]; then
          EXTRA_SETTINGS_KEYS_FILE="$(mktemp)"
          printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r 'keys[]' >"${EXTRA_SETTINGS_KEYS_FILE}"
          while IFS= read -r key; do
            if printf '%s' "$key" | grep -Eq 'openai.*key$'; then
              # handled separately via OPENAI_KEY logic above
              continue
            fi
            if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$key" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$key"; then
              echo "⚠️ settings.yaml key '${key}' is encrypted; skipping direct DB update."
              continue
            fi
            if printf '%s\n' "$SETTINGS_COLS" | grep -qx "$key"; then
              val_type="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k] | type')"
              if [ "$val_type" = "null" ]; then
                _col_escaped="$(printf '%s' "$key" | sed 's/\"/\"\"/g')"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                  -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL;"
                UPDATED="1"
                continue
              fi
              case "$val_type" in
                string)
                  val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                  ;;
                number|boolean)
                  val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                  ;;
                *)
                  val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -c --arg k "$key" '.[$k]')"
                  ;;
              esac
              _update_setting "$key" "$val"
              UPDATED="1"
            else
              echo "⚠️ settings.yaml key '${key}' not found in directus_settings; skipping."
            fi
          done < "${EXTRA_SETTINGS_KEYS_FILE}"
          rm -f "${EXTRA_SETTINGS_KEYS_FILE}"
        fi
        
        if [ "$UPDATED" != "1" ]; then
          echo "⚠️ No applicable settings were updated."
        else
          echo "✅ Directus settings updated in database."
        fi
        
        if [ -z "${OPENAI_KEY:-}" ] && [ "$EXTRA_SETTINGS_HAS_KEYS" != "1" ]; then
          echo "ℹ️ No settings to apply from settings.yaml/OpenAI; continuing with owner/cleanup."
        fi
        
        echo "👤 Ensuring project owner is set..."
        if printf '%s\n' "$SETTINGS_COLS" | grep -qx "project_owner"; then
          CURRENT_OWNER="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT project_owner FROM directus.directus_settings LIMIT 1;" || true)"
          if [ -z "${CURRENT_OWNER:-}" ] || [ "${CURRENT_OWNER}" = "null" ]; then
            OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT u.id FROM directus.directus_users u JOIN directus.directus_roles r ON u.role = r.id WHERE r.name='Administrator' ORDER BY u.id ASC LIMIT 1;" || true)"
            if [ -z "${OWNER_ID:-}" ] || [ "${OWNER_ID}" = "null" ]; then
              OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_users ORDER BY id ASC LIMIT 1;" || true)"
            fi
            if [ -n "${OWNER_ID:-}" ] && [ "${OWNER_ID}" != "null" ]; then
              _owner_escaped="$(printf '%s' "$OWNER_ID" | sed "s/'/''/g")"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                -c "UPDATE directus.directus_settings SET project_owner = '${_owner_escaped}' WHERE project_owner IS NULL;"
              echo "✅ Project owner set to ${OWNER_ID}"
            else
              echo "⚠️ No users found to set project owner."
            fi
          else
            echo "✅ Project owner already set."
          fi
        else
          echo "⚠️ project_owner column not found; skipping."
        fi
        
    }
