            ELSE 'preview'
          END
          WHERE rt.release_channel IS NULL
             OR LOWER(COALESCE(rt.release_channel, '')) NOT IN ('preview','prod')
             OR rt.release_channel <> LOWER(rt.release_channel);" "normalize cms_block_rich_text.release_channel"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_block_rich_text rt
