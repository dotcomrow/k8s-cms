apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-postschema-data-mutations
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: directus
data:
  directus-postschema-data-mutations.sh: |
    set -eu

    run_cms_page_metadata_mutations() {
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET refresh_target = CASE
            WHEN LOWER(COALESCE(p.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(p.refresh_target)
            ELSE 'both'
          END
          WHERE p.refresh_target IS NULL
             OR LOWER(COALESCE(p.refresh_target, '')) NOT IN ('preview','prod','both')
             OR p.refresh_target <> LOWER(p.refresh_target);" "normalize cms_pages.refresh_target"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET release_channel = CASE
            WHEN LOWER(COALESCE(p.release_channel, '')) IN ('preview','prod') THEN LOWER(p.release_channel)
            ELSE 'preview'
          END
          WHERE p.release_channel IS NULL
             OR LOWER(COALESCE(p.release_channel, '')) NOT IN ('preview','prod')
             OR p.release_channel <> LOWER(p.release_channel);" "normalize cms_pages.release_channel"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET theme_mode = CASE
            WHEN LOWER(COALESCE(p.theme_mode, '')) IN ('auto','light','dark') THEN LOWER(p.theme_mode)
            ELSE 'auto'
          END
          WHERE p.theme_mode IS NULL
             OR LOWER(COALESCE(p.theme_mode, '')) NOT IN ('auto','light','dark')
             OR p.theme_mode <> LOWER(p.theme_mode);" "normalize cms_pages.theme_mode"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET widget_dock_enabled = COALESCE(p.widget_dock_enabled, true)
          WHERE p.widget_dock_enabled IS NULL;" "normalize cms_pages.widget_dock_enabled"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET force_login_for_page_access = COALESCE(p.force_login_for_page_access, false)
          WHERE p.force_login_for_page_access IS NULL;" "normalize cms_pages.force_login_for_page_access"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET required_role_for_page_access = CASE
            WHEN NULLIF(BTRIM(p.required_role_for_page_access), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.required_role_for_page_access), '')) = 'none' THEN NULL
            ELSE NULLIF(BTRIM(p.required_role_for_page_access), '')
          END
          WHERE p.required_role_for_page_access IS DISTINCT FROM CASE
            WHEN NULLIF(BTRIM(p.required_role_for_page_access), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.required_role_for_page_access), '')) = 'none' THEN NULL
            ELSE NULLIF(BTRIM(p.required_role_for_page_access), '')
          END;" "normalize cms_pages.required_role_for_page_access"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET widget_dock_position = CASE
            WHEN LOWER(COALESCE(p.widget_dock_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(p.widget_dock_position)
            WHEN LOWER(COALESCE(p.theme_switcher_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(p.theme_switcher_position)
            ELSE 'top-right'
          END
          WHERE p.widget_dock_position IS NULL
             OR LOWER(COALESCE(p.widget_dock_position, '')) NOT IN ('top-right','top-left','bottom-right','bottom-left')
             OR p.widget_dock_position <> LOWER(p.widget_dock_position);" "normalize cms_pages.widget_dock_position"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET widget_dock_direction = CASE
            WHEN LOWER(COALESCE(p.widget_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(p.widget_dock_direction)
            WHEN LOWER(COALESCE(p.theme_switcher_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(p.theme_switcher_dock_direction)
            ELSE 'vertical'
          END
          WHERE p.widget_dock_direction IS NULL
             OR LOWER(COALESCE(p.widget_dock_direction, '')) NOT IN ('vertical','horizontal')
             OR p.widget_dock_direction <> LOWER(p.widget_dock_direction);" "normalize cms_pages.widget_dock_direction"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET theme_selector_dock_position = CASE
            WHEN LOWER(COALESCE(p.theme_selector_dock_position, '')) IN ('start','end') THEN LOWER(p.theme_selector_dock_position)
            ELSE 'start'
          END
          WHERE p.theme_selector_dock_position IS NULL
             OR LOWER(COALESCE(p.theme_selector_dock_position, '')) NOT IN ('start','end')
             OR p.theme_selector_dock_position <> LOWER(p.theme_selector_dock_position);" "normalize cms_pages.theme_selector_dock_position"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET theme_switcher_position = p.widget_dock_position,
              theme_switcher_dock_direction = p.widget_dock_direction
          WHERE p.theme_switcher_position IS DISTINCT FROM p.widget_dock_position
             OR p.theme_switcher_dock_direction IS DISTINCT FROM p.widget_dock_direction;" "sync cms_pages legacy theme_switcher fields"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET theme_package_key = 'theme-clear'
          WHERE LOWER(COALESCE(BTRIM(p.theme_package_key), '')) = 'theme-clear-light';" "migrate cms_pages.theme_package_key legacy family key"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET analytics_google_measurement_id = NULLIF(BTRIM(p.analytics_google_measurement_id), '')
          WHERE p.analytics_google_measurement_id IS DISTINCT FROM NULLIF(BTRIM(p.analytics_google_measurement_id), '');" "normalize cms_pages.analytics_google_measurement_id"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET analytics_openobserve_rum_script_url = NULLIF(BTRIM(p.analytics_openobserve_rum_script_url), '')
          WHERE p.analytics_openobserve_rum_script_url IS DISTINCT FROM NULLIF(BTRIM(p.analytics_openobserve_rum_script_url), '');" "normalize cms_pages.analytics_openobserve_rum_script_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET analytics_openobserve_rum_config = CASE
            WHEN p.analytics_openobserve_rum_config IS NULL THEN '{}'::jsonb
            WHEN jsonb_typeof(p.analytics_openobserve_rum_config) = 'object' THEN p.analytics_openobserve_rum_config
            ELSE '{}'::jsonb
          END
          WHERE p.analytics_openobserve_rum_config IS NULL
             OR jsonb_typeof(p.analytics_openobserve_rum_config) IS DISTINCT FROM 'object';" "normalize cms_pages.analytics_openobserve_rum_config"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_title = NULLIF(BTRIM(p.head_title), '')
          WHERE p.head_title IS DISTINCT FROM NULLIF(BTRIM(p.head_title), '');" "normalize cms_pages.head_title"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_description = NULLIF(BTRIM(p.head_description), '')
          WHERE p.head_description IS DISTINCT FROM NULLIF(BTRIM(p.head_description), '');" "normalize cms_pages.head_description"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_theme_color = CASE
            WHEN NULLIF(BTRIM(p.head_theme_color), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.head_theme_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(p.head_theme_color), ''))
            ELSE NULL
          END
          WHERE p.head_theme_color IS DISTINCT FROM CASE
            WHEN NULLIF(BTRIM(p.head_theme_color), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.head_theme_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(p.head_theme_color), ''))
            ELSE NULL
          END;" "normalize cms_pages.head_theme_color"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_manifest_url = NULLIF(BTRIM(p.head_manifest_url), '')
          WHERE p.head_manifest_url IS DISTINCT FROM NULLIF(BTRIM(p.head_manifest_url), '');" "normalize cms_pages.head_manifest_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_url = NULLIF(BTRIM(p.head_icon_url), '')
          WHERE p.head_icon_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_url), '');" "normalize cms_pages.head_icon_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_apple_touch_icon_url = NULLIF(BTRIM(p.head_apple_touch_icon_url), '')
          WHERE p.head_apple_touch_icon_url IS DISTINCT FROM NULLIF(BTRIM(p.head_apple_touch_icon_url), '');" "normalize cms_pages.head_apple_touch_icon_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_shortcut_url = NULLIF(BTRIM(p.head_icon_shortcut_url), '')
          WHERE p.head_icon_shortcut_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_shortcut_url), '');" "normalize cms_pages.head_icon_shortcut_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_svg_url = NULLIF(BTRIM(p.head_icon_svg_url), '')
          WHERE p.head_icon_svg_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_svg_url), '');" "normalize cms_pages.head_icon_svg_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_16_url = NULLIF(BTRIM(p.head_icon_16_url), '')
          WHERE p.head_icon_16_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_16_url), '');" "normalize cms_pages.head_icon_16_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_32_url = NULLIF(BTRIM(p.head_icon_32_url), '')
          WHERE p.head_icon_32_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_32_url), '');" "normalize cms_pages.head_icon_32_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_180_url = NULLIF(BTRIM(p.head_icon_180_url), '')
          WHERE p.head_icon_180_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_180_url), '');" "normalize cms_pages.head_icon_180_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_192_url = NULLIF(BTRIM(p.head_icon_192_url), '')
          WHERE p.head_icon_192_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_192_url), '');" "normalize cms_pages.head_icon_192_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_512_url = NULLIF(BTRIM(p.head_icon_512_url), '')
          WHERE p.head_icon_512_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_512_url), '');" "normalize cms_pages.head_icon_512_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_mask_url = NULLIF(BTRIM(p.head_icon_mask_url), '')
          WHERE p.head_icon_mask_url IS DISTINCT FROM NULLIF(BTRIM(p.head_icon_mask_url), '');" "normalize cms_pages.head_icon_mask_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_icon_mask_color = CASE
            WHEN NULLIF(BTRIM(p.head_icon_mask_color), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.head_icon_mask_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(p.head_icon_mask_color), ''))
            ELSE NULL
          END
          WHERE p.head_icon_mask_color IS DISTINCT FROM CASE
            WHEN NULLIF(BTRIM(p.head_icon_mask_color), '') IS NULL THEN NULL
            WHEN LOWER(NULLIF(BTRIM(p.head_icon_mask_color), '')) ~ '^#[0-9a-f]{3}([0-9a-f]{3}|[0-9a-f]{5})?$' THEN LOWER(NULLIF(BTRIM(p.head_icon_mask_color), ''))
            ELSE NULL
          END;" "normalize cms_pages.head_icon_mask_color"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_canonical_url = NULLIF(BTRIM(p.head_canonical_url), '')
          WHERE p.head_canonical_url IS DISTINCT FROM NULLIF(BTRIM(p.head_canonical_url), '');" "normalize cms_pages.head_canonical_url"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_robots = NULLIF(BTRIM(p.head_robots), '')
          WHERE p.head_robots IS DISTINCT FROM NULLIF(BTRIM(p.head_robots), '');" "normalize cms_pages.head_robots"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_pages p
          SET head_generator = NULLIF(BTRIM(p.head_generator), '')
          WHERE p.head_generator IS DISTINCT FROM NULLIF(BTRIM(p.head_generator), '');" "normalize cms_pages.head_generator"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET refresh_target = CASE
            WHEN LOWER(COALESCE(pb.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(pb.refresh_target)
            ELSE 'both'
          END
          WHERE pb.refresh_target IS NULL
             OR LOWER(COALESCE(pb.refresh_target, '')) NOT IN ('preview','prod','both')
             OR pb.refresh_target <> LOWER(pb.refresh_target);" "normalize cms_page_blocks.refresh_target"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET release_channel = CASE
            WHEN LOWER(COALESCE(pb.release_channel, '')) IN ('preview','prod') THEN LOWER(pb.release_channel)
            ELSE 'preview'
          END
          WHERE pb.release_channel IS NULL
             OR LOWER(COALESCE(pb.release_channel, '')) NOT IN ('preview','prod')
             OR pb.release_channel <> LOWER(pb.release_channel);" "normalize cms_page_blocks.release_channel"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET slot = COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main')
          WHERE pb.slot IS NULL
             OR BTRIM(COALESCE(pb.slot, '')) = ''
             OR pb.slot <> COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main');" "normalize cms_page_blocks.slot"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET group_tag = NULLIF(BTRIM(pb.group_tag), '')
          WHERE pb.group_tag IS DISTINCT FROM NULLIF(BTRIM(pb.group_tag), '');" "normalize cms_page_blocks.group_tag"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET tree_depth = COALESCE(pb.tree_depth, 0),
              tree_path = COALESCE(pb.tree_path, ''),
              template_scope = CASE WHEN LOWER(COALESCE(pb.template_scope, '')) = 'template' THEN 'template' ELSE 'page' END,
              template_group_key = COALESCE(NULLIF(BTRIM(pb.template_group_key), ''), 'page-root'),
              template_ancestor_block_ids = COALESCE(pb.template_ancestor_block_ids, ''),
              template_ancestor_template_keys = COALESCE(pb.template_ancestor_template_keys, '')
          WHERE pb.tree_depth IS NULL
             OR pb.tree_path IS NULL
             OR pb.template_scope IS NULL
             OR LOWER(COALESCE(pb.template_scope, '')) NOT IN ('page','template')
             OR pb.template_group_key IS NULL
             OR BTRIM(COALESCE(pb.template_group_key, '')) = ''
             OR pb.template_ancestor_block_ids IS NULL
             OR pb.template_ancestor_template_keys IS NULL;" "normalize cms_page_blocks organization defaults"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_page_blocks pb
          SET site_key = p.site_key,
              release_channel = p.release_channel,
              page_slug = p.slug,
              refresh_target = p.refresh_target
          FROM cms_pages p
          WHERE pb.page_id = p.id
            AND (pb.site_key IS DISTINCT FROM p.site_key
              OR pb.release_channel IS DISTINCT FROM p.release_channel
              OR pb.page_slug IS DISTINCT FROM p.slug
              OR pb.refresh_target IS DISTINCT FROM p.refresh_target);" "propagate metadata to cms_page_blocks"; then
          sync_site_metadata_failed="1"
        fi
        if ! _psql_yb_retry "UPDATE cms_block_rich_text rt
          SET refresh_target = CASE
