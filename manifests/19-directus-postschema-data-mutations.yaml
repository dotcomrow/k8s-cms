        if ! _psql_yb_retry "UPDATE cms_block_module m
          SET module_provider = COALESCE(
            NULLIF((
              SELECT LOWER(BTRIM(COALESCE(mm.provider, '')))
              FROM directus.cms_modules mm
              WHERE mm.module_key = m.module_key
                AND LOWER(COALESCE(mm.status, 'published')) = 'published'
                AND (
                  COALESCE(NULLIF(BTRIM(COALESCE(mm.site_key, '')), ''), '') = ''
                  OR COALESCE(NULLIF(BTRIM(COALESCE(mm.site_key, '')), ''), '') = COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '')
