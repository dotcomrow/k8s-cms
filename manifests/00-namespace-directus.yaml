# Namespace for Directus CMS
apiVersion: v1
kind: Namespace
metadata:
  name: directus
  labels:
    app: directus-cms
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/proxy-cpu-request: "25m"
    config.linkerd.io/proxy-memory-request: "64Mi"
    config.linkerd.io/skip-outbound-ports: "5433"
    field.cattle.io/projectId: "local:applications"
