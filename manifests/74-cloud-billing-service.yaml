apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-billing-service-config
  namespace: directus
data:
  BILLING_SERVICES_JSON: |
    [
      {
        "id": "oci-directus-db",
        "name": "Directus Database VM",
        "provider": "oci",
        "accountRef": "oci-prod-tenancy",
        "region": "us-ashburn-1",
        "environment": "Production",
        "owner": "Platform Ops",
        "budgetMonthly": 1250,
        "currency": "USD",
        "oci": {
          "region": "us-ashburn-1",
          "groupBy": ["service"],
          "compartmentDepth": 6
        }
      },
      {
        "id": "aws-edge-services",
        "name": "Edge and Registry Services",
        "provider": "aws",
        "accountRef": "aws-shared-prod",
        "region": "us-east-1",
        "environment": "Production",
        "owner": "Platform Ops",
        "budgetMonthly": 900,
        "currency": "USD",
        "aws": {
          "region": "us-east-1",
          "metric": "UnblendedCost",
          "tagFilters": {
            "platform": ["internal-app"]
          }
        }
      },
      {
        "id": "gcp-observability",
        "name": "Observability and Analytics",
        "provider": "gcp",
        "accountRef": "gcp-platform-observability",
        "region": "US",
        "environment": "Shared",
        "owner": "Data Platform",
        "budgetMonthly": 700,
        "currency": "USD",
        "gcp": {
          "projectId": "billing-export-project",
          "billingTable": "billing_export.gcp_billing_export_v1_XXXXXX",
          "serviceAccountJsonEnv": "GOOGLE_APPLICATION_CREDENTIALS_JSON"
        }
      },
      {
        "id": "azure-identity",
        "name": "Identity Integration",
        "provider": "azure",
        "accountRef": "azure-platform-subscription",
        "region": "global",
        "environment": "Shared",
        "owner": "Security",
        "budgetMonthly": 320,
        "currency": "USD",
        "azure": {
          "subscriptionId": "00000000-0000-0000-0000-000000000000",
          "tenantIdEnv": "AZURE_TENANT_ID",
          "clientIdEnv": "AZURE_CLIENT_ID",
          "clientSecretEnv": "AZURE_CLIENT_SECRET"
        }
      },
      {
        "id": "serverpronto-miami-colocation",
        "name": "ServerPronto Miami Colocation",
        "provider": "generic",
        "providerLabel": "ServerPronto",
        "adapter": "generic",
        "accountRef": "serverpronto-miami",
        "region": "Miami, FL",
        "environment": "Production",
        "owner": "Platform Ops",
        "budgetMonthly": 0,
        "currency": "USD",
        "generic": {
          "source": "manual",
          "monthlyRecurringCostEnv": "SERVERPRONTO_MONTHLY_RECURRING_COST",
          "monthToDateCostEnv": "SERVERPRONTO_MONTH_TO_DATE_COST",
          "previousMonthCostEnv": "SERVERPRONTO_PREVIOUS_MONTH_COST",
          "breakdownJsonEnv": "SERVERPRONTO_BILLING_BREAKDOWN_JSON",
          "defaultLineItemLabel": "Colocation recurring charge"
        }
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-billing-service
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: cloud-billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-billing-service
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: cloud-billing-service
    spec:
      serviceAccountName: directus
      containers:
        - name: cloud-billing-service
          image: "ghcr.io/dotcomrow/cloud-billing-service:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OPENAPI_SERVER_URL
              value: "http://cloud-billing-service.directus.svc.cluster.local:8080"
            - name: TRUST_PROXY_HOPS
              value: "1"
            - name: REQUEST_TIMEOUT_MS
              value: "45000"
            - name: CACHE_TTL_SECONDS
              value: "300"
            - name: DEFAULT_CURRENCY
              value: "USD"
            - name: BILLING_SERVICES_JSON
              valueFrom:
                configMapKeyRef:
                  name: cloud-billing-service-config
                  key: BILLING_SERVICES_JSON
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-aws
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-aws
                  key: secret-access-key
                  optional: true
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-aws
                  key: session-token
                  optional: true
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-azure
                  key: tenant-id
                  optional: true
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-azure
                  key: client-id
                  optional: true
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-azure
                  key: client-secret
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-gcp
                  key: service-account-json
                  optional: true
            - name: OCI_TENANCY_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-oci
                  key: tenancy-id
                  optional: true
            - name: OCI_USER_ID
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-oci
                  key: user-id
                  optional: true
            - name: OCI_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-oci
                  key: fingerprint
                  optional: true
            - name: OCI_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-oci
                  key: private-key
                  optional: true
            - name: SERVERPRONTO_MONTHLY_RECURRING_COST
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-serverpronto
                  key: monthly-recurring-cost
                  optional: true
            - name: SERVERPRONTO_MONTH_TO_DATE_COST
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-serverpronto
                  key: month-to-date-cost
                  optional: true
            - name: SERVERPRONTO_PREVIOUS_MONTH_COST
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-serverpronto
                  key: previous-month-cost
                  optional: true
            - name: SERVERPRONTO_BILLING_BREAKDOWN_JSON
              valueFrom:
                secretKeyRef:
                  name: cloud-billing-service-serverpronto
                  key: billing-breakdown-json
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
