# Directus theme packages (GitOps source of truth).
# Generated from ./themes via scripts/sync-theme-configmap.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-theme-packages
  namespace: directus
  labels:
    app: directus
data:
  themes.yaml: |
    themes:
      - theme_key: theme-clear
        name: Clear
        description: "Clean neutral family suitable for default business and app layouts."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-clear-light.css
        css_dark_file: theme-clear-dark.css
        css_file: theme-clear-light.css
    
      - theme_key: theme-modern-slate
        name: Modern Slate
        description: "Muted slate family with polished enterprise UI styling."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-modern-slate.css
        css_dark_file: theme-modern-slate-dark.css
        css_file: theme-modern-slate.css
    
      - theme_key: theme-ocean-blue
        name: Ocean Blue
        description: "Blue-forward family with crisp accents and high readability."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-ocean-blue.css
        css_dark_file: theme-ocean-blue-dark.css
        css_file: theme-ocean-blue.css
    
      - theme_key: theme-forest-green
        name: Forest Green
        description: "Natural green family for sustainability and operations-focused apps."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-forest-green.css
        css_dark_file: theme-forest-green-dark.css
        css_file: theme-forest-green.css
    
      - theme_key: theme-sandstone
        name: Sandstone Warm
        description: "Warm neutral family with approachable marketing-friendly tones."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-sandstone.css
        css_dark_file: theme-sandstone-dark.css
        css_file: theme-sandstone.css
    
      - theme_key: theme-midnight-contrast
        name: Midnight Contrast
        description: "High-contrast family for dashboard-heavy interfaces."
        status: published
        site_key: null
        refresh_target: both
        css_light_file: theme-midnight-contrast-light.css
        css_dark_file: theme-midnight-contrast.css
        css_file: theme-midnight-contrast.css
  theme-clear-light.css: |
    :root {
      --cms-bg: #f8fafc;
      --cms-surface: #ffffff;
      --cms-elevated: #f1f5f9;
      --cms-border: #dbe3ee;
      --cms-text: #0f172a;
      --cms-muted: #475569;
      --cms-accent: #1d4ed8;
    }
    
    .layout,
    .cms-page {
      background: var(--cms-bg);
      color: var(--cms-text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    
    .layout [class*="layout__"],
    .cms-section,
    .cms-hero {
      background: var(--cms-surface);
      border-color: var(--cms-border);
    }
    
    .cms-section-subtitle,
    .cms-hero-subtitle {
      color: var(--cms-muted);
    }
    
    .cms-section-cta a {
      color: #ffffff;
      background: var(--cms-accent);
      border-radius: 0.5rem;
      padding: 0.45rem 0.8rem;
      text-decoration: none;
    }
  theme-clear-dark.css: |
    :root {
      --cms-bg: #0f172a;
      --cms-surface: #111827;
      --cms-elevated: #1f2937;
      --cms-border: #334155;
      --cms-text: #e5e7eb;
      --cms-muted: #94a3b8;
      --cms-accent: #60a5fa;
    }
    
    .layout,
    .cms-page {
      background: linear-gradient(180deg, #0b1220 0%, var(--cms-bg) 100%);
      color: var(--cms-text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    
    .layout [class*="layout__"],
