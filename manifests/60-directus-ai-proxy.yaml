# Directus AI proxy:
# - Exposes an OpenAI-compatible base URL for Directus (e.g. http://directus-ai-proxy:8080/v1)
# - Mints a Keycloak client_credentials JWT (from Vault) and forwards calls to the Gravitee gateway
#   so Gravitee policies/analytics stay in the path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus-ai-proxy
  namespace: directus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-ai-proxy
  namespace: directus
data:
  requirements.txt: |
    fastapi==0.115.5
    uvicorn==0.30.6
    httpx==0.27.2
  app.py: |
    import asyncio
    import json
    import os
    import time
    import urllib.error
    import urllib.request
    from typing import Dict, List, Optional, Tuple

    import httpx
    from fastapi import FastAPI, HTTPException, Request
    from fastapi.responses import JSONResponse, Response, StreamingResponse

    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.vault.svc.cluster.local:8200").rstrip("/")
    VAULT_TOKEN_FILE = os.environ.get("VAULT_TOKEN_FILE", "/vault-secrets/vault-token")
    VAULT_CACHE_SECONDS = int(os.environ.get("VAULT_CACHE_SECONDS", "300"))

    KEYCLOAK_TOKEN_URL = os.environ.get(
      "KEYCLOAK_TOKEN_URL",
      "https://auth.suncoast.systems/realms/external/protocol/openid-connect/token",
    )
    KEYCLOAK_CLIENT_ID_VAULT_PATH = os.environ.get(
      "KEYCLOAK_CLIENT_ID_VAULT_PATH",
      "secret/data/keycloak-client-id-cms-site-internal",
    )
    KEYCLOAK_CLIENT_SECRET_VAULT_PATH = os.environ.get(
      "KEYCLOAK_CLIENT_SECRET_VAULT_PATH",
      "secret/data/keycloak-client-secret-cms-site-internal",
    )
    TOKEN_MIN_TTL_SECONDS = int(os.environ.get("TOKEN_MIN_TTL_SECONDS", "30"))

    GRAVITEE_BASE_URL = os.environ.get(
      "GRAVITEE_BASE_URL",
      "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082",
    ).rstrip("/")
    GRAVITEE_CONTEXT_PATH = os.environ.get("GRAVITEE_CONTEXT_PATH", "/ollama")

    CONNECT_TIMEOUT_SECONDS = float(os.environ.get("CONNECT_TIMEOUT_SECONDS", "30"))
    READ_TIMEOUT_SECONDS = float(os.environ.get("READ_TIMEOUT_SECONDS", "300"))

    app = FastAPI()

    _lock = asyncio.Lock()
    _creds = {"client_id": "", "client_secret": "", "loaded_at": 0.0}
    _token = {"access_token": "", "expires_at": 0.0}
    _http: Optional[httpx.AsyncClient] = None

    _HOP_BY_HOP = {
      "connection",
      "keep-alive",
      "proxy-authenticate",
      "proxy-authorization",
      "te",
      "trailer",
      "transfer-encoding",
      "upgrade",
    }

    def _read_file(path: str) -> str:
      try:
        with open(path, "r", encoding="utf-8") as handle:
          return handle.read().strip()
      except Exception:
        return ""

    def _vault_read(path: str) -> Dict:
      token = _read_file(VAULT_TOKEN_FILE)
      if not token:
        raise RuntimeError("vault token not available")

      url = f"{VAULT_ADDR}/v1/{path.lstrip('/')}"
      req = urllib.request.Request(url, headers={"X-Vault-Token": token})
      try:
        with urllib.request.urlopen(req, timeout=5) as resp:
          if resp.status != 200:
            raise RuntimeError(f"vault returned HTTP {resp.status}")
          return json.load(resp)
      except urllib.error.HTTPError as exc:
        raise RuntimeError(f"vault returned HTTP {exc.code}")
      except Exception as exc:
        raise RuntimeError("vault request failed") from exc

    def _extract_value(payload: Dict) -> str:
      try:
        data = (payload.get("data", {}).get("data", {}) or {})
        for key in ("value", "client_id", "client_secret", "secret", "password"):
          val = data.get(key)
          if isinstance(val, str) and val:
            return val
      except Exception:
        pass
      return ""

    async def _get_keycloak_client_creds() -> Tuple[str, str]:
      now = time.time()
      async with _lock:
        if (
          _creds["client_id"]
          and _creds["client_secret"]
          and now - _creds["loaded_at"] < VAULT_CACHE_SECONDS
        ):
          return _creds["client_id"], _creds["client_secret"]

      client_id = _extract_value(_vault_read(KEYCLOAK_CLIENT_ID_VAULT_PATH))
      client_secret = _extract_value(_vault_read(KEYCLOAK_CLIENT_SECRET_VAULT_PATH))
      if not client_id or not client_secret:
        raise RuntimeError("keycloak client credentials not found in vault")

      async with _lock:
        _creds["client_id"] = client_id
        _creds["client_secret"] = client_secret
        _creds["loaded_at"] = now

      return client_id, client_secret

    async def _mint_access_token(force_refresh: bool = False) -> str:
      now = time.time()
      async with _lock:
        if (
          not force_refresh
          and _token["access_token"]
          and _token["expires_at"] - now > TOKEN_MIN_TTL_SECONDS
        ):
          return _token["access_token"]

      client_id, client_secret = await _get_keycloak_client_creds()
      if _http is None:
        raise RuntimeError("http client not initialized")

      resp = await _http.post(
        KEYCLOAK_TOKEN_URL,
        data={
          "grant_type": "client_credentials",
          "client_id": client_id,
          "client_secret": client_secret,
        },
        headers={"Content-Type": "application/x-www-form-urlencoded"},
      )
      if resp.status_code != 200:
        raise RuntimeError(f"keycloak token endpoint returned HTTP {resp.status_code}")

      payload = resp.json()
      access_token = payload.get("access_token") or ""
      expires_in = payload.get("expires_in") or 60
      if not access_token:
        raise RuntimeError("keycloak token response missing access_token")

      async with _lock:
        _token["access_token"] = access_token
        _token["expires_at"] = now + float(expires_in)

      return access_token

    def _upstream_url(path: str, query: str) -> str:
      ctx = GRAVITEE_CONTEXT_PATH
      if not ctx.startswith("/"):
        ctx = "/" + ctx
      p = path if path.startswith("/") else "/" + path
      if p.startswith(ctx.rstrip("/") + "/") or p == ctx:
        out_path = p
      else:
        out_path = ctx.rstrip("/") + p
      url = f"{GRAVITEE_BASE_URL}{out_path}"
      if query:
        url = f"{url}?{query}"
      return url

    def _filter_request_headers(req: Request) -> List[Tuple[str, str]]:
      out: List[Tuple[str, str]] = []
      for k, v in req.headers.items():
        lk = k.lower()
        if lk in _HOP_BY_HOP:
          continue
        if lk in ("host", "content-length", "authorization"):
          continue
        out.append((k, v))
      return out

    def _filter_response_headers(headers: httpx.Headers) -> Dict[str, str]:
      out: Dict[str, str] = {}
      for k, v in headers.items():
        lk = k.lower()
        if lk in _HOP_BY_HOP:
          continue
        if lk in ("content-length",):
          continue
        out[k] = v
      return out

    def _is_tools_unsupported_error(payload: bytes) -> bool:
      if not payload:
        return False
      try:
        obj = json.loads(payload.decode("utf-8"))
        if isinstance(obj, dict):
          err = obj.get("error")
          if isinstance(err, dict):
            msg = err.get("message")
            if isinstance(msg, str) and "does not support tools" in msg:
              return True
      except Exception:
        pass
      return b"does not support tools" in payload

    def _strip_tools_from_body(body: bytes) -> Optional[bytes]:
      if not body:
        return None
      try:
        obj = json.loads(body.decode("utf-8"))
      except Exception:
        return None
      if not isinstance(obj, dict):
        return None
      changed = False
      for key in (
        "tools",
        "tool_choice",
        "parallel_tool_calls",
        # Older OpenAI-compatible fields; strip if present.
        "functions",
        "function_call",
      ):
        if key in obj:
          obj.pop(key, None)
          changed = True
      if not changed:
        return None
      return json.dumps(obj).encode("utf-8")

    @app.on_event("startup")
    async def _startup():
      global _http
      _http = httpx.AsyncClient(
        timeout=httpx.Timeout(READ_TIMEOUT_SECONDS, connect=CONNECT_TIMEOUT_SECONDS),
        follow_redirects=False,
      )

    @app.on_event("shutdown")
    async def _shutdown():
      global _http
      if _http is not None:
        await _http.aclose()
        _http = None

    @app.get("/healthz")
    async def healthz():
      try:
        await _mint_access_token()
        return {"ok": True}
      except Exception:
        return JSONResponse(status_code=503, content={"ok": False})

    @app.api_route(
      "/{full_path:path}",
      methods=["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"],
    )
    async def proxy(full_path: str, request: Request):
      if _http is None:
        raise HTTPException(status_code=503, detail="proxy not ready")

      upstream = _upstream_url("/" + full_path, request.url.query)
      body = await request.body()
      body_to_send = body
      base_headers = _filter_request_headers(request)

      did_refresh = False
      did_strip_tools = False
      last_err: Optional[Exception] = None
      for _ in range(3):
        try:
          token = await _mint_access_token(force_refresh=did_refresh)
          headers = list(base_headers)
          headers.append(("authorization", f"Bearer {token}"))

          cm = _http.stream(
            request.method,
            upstream,
            headers=headers,
            content=body_to_send,
          )
          resp = await cm.__aenter__()

          # If our cached token expired unexpectedly, refresh once.
          if resp.status_code == 401 and not did_refresh:
            await cm.__aexit__(None, None, None)
            did_refresh = True
            continue

          # Ollama tool calling support is model-dependent. If the upstream returns the
          # "does not support tools" error, retry once with tool definitions stripped.
          if (
            resp.status_code == 400
            and request.method in ("POST", "PUT", "PATCH")
            and not did_strip_tools
          ):
            err_bytes = await resp.aread()
            resp_headers = _filter_response_headers(resp.headers)
            await cm.__aexit__(None, None, None)

            if _is_tools_unsupported_error(err_bytes):
              stripped = _strip_tools_from_body(body_to_send)
              if stripped is not None:
                body_to_send = stripped
                did_strip_tools = True
                continue

            return Response(
              content=err_bytes,
              status_code=resp.status_code,
              headers=resp_headers,
            )

          resp_headers = _filter_response_headers(resp.headers)

          async def _iter_body():
            try:
              async for chunk in resp.aiter_raw():
                yield chunk
            finally:
              await cm.__aexit__(None, None, None)

          return StreamingResponse(
            _iter_body(),
            status_code=resp.status_code,
            headers=resp_headers,
          )
        except Exception as exc:
          last_err = exc

      raise HTTPException(status_code=502, detail="upstream request failed") from last_err
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus-ai-proxy
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus-ai-proxy"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus-ai-proxy
  namespace: directus
  labels:
    app: directus-ai-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus-ai-proxy
  template:
    metadata:
      labels:
        app: directus-ai-proxy
    spec:
      serviceAccountName: directus-ai-proxy
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: directus-ai-proxy
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
            - name: KEYCLOAK_TOKEN_URL
              value: "https://auth.suncoast.systems/realms/external/protocol/openid-connect/token"
            - name: KEYCLOAK_CLIENT_ID_VAULT_PATH
              value: "secret/data/keycloak-client-id-cms-site-internal"
            - name: KEYCLOAK_CLIENT_SECRET_VAULT_PATH
              value: "secret/data/keycloak-client-secret-cms-site-internal"
            - name: GRAVITEE_BASE_URL
              value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082"
            - name: GRAVITEE_CONTEXT_PATH
              value: "/ollama"
            - name: TOKEN_MIN_TTL_SECONDS
              value: "30"
            - name: CONNECT_TIMEOUT_SECONDS
              value: "30"
            - name: READ_TIMEOUT_SECONDS
              value: "300"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              echo "Waiting for Vault agent to authenticate..."
              while [ ! -f /vault-secrets/vault-token ]; do
                sleep 2
              done
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: app
              mountPath: /app
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: app
          configMap:
            name: directus-ai-proxy
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus-ai-proxy
        - name: vault-secrets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: directus-ai-proxy
  namespace: directus
  labels:
    app: directus-ai-proxy
spec:
  selector:
    app: directus-ai-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
