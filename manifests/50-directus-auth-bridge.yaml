# Token exchange bridge used by Gravitee to validate internal/external JWTs and mint a stable Directus Bearer token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-auth-bridge
  namespace: directus
data:
  requirements.txt: |
    fastapi==0.115.5
    uvicorn==0.30.6
    PyJWT==2.9.0
    cryptography==43.0.1
    python-multipart==0.0.9
  app.py: |
    import json
    import os
    import re
    import threading
    import time
    import urllib.error
    import urllib.request
    import uuid

    import jwt
    from fastapi import FastAPI, Form, HTTPException

    INTERNAL_ISSUER = os.environ.get(
        "KEYCLOAK_INTERNAL_ISSUER",
        "https://auth.suncoast.systems/realms/internal",
    )
    INTERNAL_JWKS_URL = os.environ.get(
        "KEYCLOAK_INTERNAL_JWKS_URL",
        "https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs",
    )
    EXTERNAL_ISSUER = os.environ.get(
        "KEYCLOAK_EXTERNAL_ISSUER",
        "https://auth.suncoast.systems/realms/external",
    )
    EXTERNAL_JWKS_URL = os.environ.get(
        "KEYCLOAK_EXTERNAL_JWKS_URL",
        "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs",
    )

    # Backward-compatible single-issuer overrides.
    SINGLE_ISSUER = os.environ.get("KEYCLOAK_ISSUER", "")
    SINGLE_JWKS_URL = os.environ.get("KEYCLOAK_JWKS_URL", "")

    TOKEN_TTL_SECONDS = int(os.environ.get("DIRECTUS_EXPIRES_IN_SECONDS", "3600"))
    JWKS_CACHE_SECONDS = int(os.environ.get("JWKS_CACHE_SECONDS", "300"))
    JWKS_TIMEOUT_SECONDS = int(os.environ.get("JWKS_TIMEOUT_SECONDS", "5"))

    VAULT_ADDR = os.environ.get("VAULT_ADDR", "http://vault.vault.svc.cluster.local:8200").rstrip("/")
    VAULT_TOKEN_FILE = os.environ.get("VAULT_TOKEN_FILE", "/vault-secrets/vault-token")
    DIRECTUS_TOKEN_CLIENT_PREFIX = os.environ.get(
        "DIRECTUS_TOKEN_CLIENT_PREFIX",
        "secret/data/directus/gravitee/clients/",
    )
    DIRECTUS_TOKEN_KEY = os.environ.get("DIRECTUS_TOKEN_KEY", "token")
    TOKEN_CACHE_SECONDS = int(os.environ.get("DIRECTUS_TOKEN_CACHE_SECONDS", "60"))
    AUDIENCE_TOKEN_FALLBACK_ENABLED = os.environ.get(
        "DIRECTUS_TOKEN_AUDIENCE_FALLBACK_ENABLED",
        "true",
    ).strip().lower() in ("1", "true", "yes", "on")

    _jwks_cache = {"by_url": {}}
    _jwks_lock = threading.Lock()

    _token_cache = {"by_client": {}}
    _token_lock = threading.Lock()

    app = FastAPI()

    _client_id_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")

    def _is_client_key(value) -> bool:
        return isinstance(value, str) and _client_id_re.match(value) is not None

    def _issuer_configs():
        if SINGLE_ISSUER and SINGLE_JWKS_URL:
            return [{"issuer": SINGLE_ISSUER, "jwks_url": SINGLE_JWKS_URL}]
        return [
            {"issuer": INTERNAL_ISSUER, "jwks_url": INTERNAL_JWKS_URL},
            {"issuer": EXTERNAL_ISSUER, "jwks_url": EXTERNAL_JWKS_URL},
        ]

    def _read_file(path: str) -> str:
        try:
            with open(path, "r", encoding="utf-8") as handle:
                return handle.read().strip()
        except Exception:
            return ""

    def _vault_read(path: str) -> dict:
        token = _read_file(VAULT_TOKEN_FILE)
        if not token:
            raise HTTPException(status_code=503, detail="Vault token not available")

        url = f"{VAULT_ADDR}/v1/{path.lstrip('/')}"
        req = urllib.request.Request(url, headers={"X-Vault-Token": token})
        try:
            with urllib.request.urlopen(req, timeout=5) as resp:
                if resp.status != 200:
                    raise HTTPException(status_code=502, detail=f"Vault returned HTTP {resp.status}")
                return json.load(resp)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return {}
            raise HTTPException(status_code=502, detail=f"Vault returned HTTP {exc.code}")
        except Exception:
            raise HTTPException(status_code=502, detail="Vault request failed")

    def _extract_token(payload: dict) -> str:
        try:
            return (payload.get("data", {}).get("data", {}) or {}).get(DIRECTUS_TOKEN_KEY, "") or ""
        except Exception:
            return ""

    def _get_client_key(decoded: dict) -> str:
        # For client_credentials tokens, Keycloak typically includes the caller client id as `azp`.
        azp = decoded.get("azp")
        if _is_client_key(azp):
            return azp

        cid = decoded.get("client_id") or decoded.get("clientId")
        if _is_client_key(cid):
            return cid

        pu = decoded.get("preferred_username")
        if isinstance(pu, str) and pu.startswith("service-account-"):
            cid2 = pu[len("service-account-") :]
            if _is_client_key(cid2):
                return cid2

        return ""

    def _get_directus_token_for_client(client_key: str) -> str:
        now = time.time()
        with _token_lock:
            cached = _token_cache["by_client"].get(client_key)
            if cached and now - cached.get("loaded_at", 0.0) < TOKEN_CACHE_SECONDS:
                return cached.get("token", "")

        token = _extract_token(_vault_read(f"{DIRECTUS_TOKEN_CLIENT_PREFIX}{client_key}"))

        with _token_lock:
            _token_cache["by_client"][client_key] = {"token": token, "loaded_at": now}
        return token

    def _load_jwks(jwks_url: str):
        now = time.time()
        cached = _jwks_cache["by_url"].get(jwks_url)
        if cached and now - cached.get("loaded_at", 0.0) < JWKS_CACHE_SECONDS:
            return cached.get("data")
        with _jwks_lock:
            now = time.time()
            cached = _jwks_cache["by_url"].get(jwks_url)
            if cached and now - cached.get("loaded_at", 0.0) < JWKS_CACHE_SECONDS:
                return cached.get("data")
            try:
                with urllib.request.urlopen(jwks_url, timeout=JWKS_TIMEOUT_SECONDS) as resp:
                    data = json.load(resp)
                _jwks_cache["by_url"][jwks_url] = {"data": data, "loaded_at": now}
                return data
            except Exception:
                if cached and cached.get("data"):
                    return cached.get("data")
                raise

    def _find_signing_key(token: str, jwks_url: str):
        header = jwt.get_unverified_header(token)
        kid = header.get("kid")
        if not kid:
            return None
        jwks = _load_jwks(jwks_url) or {}
        for key in jwks.get("keys", []):
            if key.get("kid") == kid:
                return jwt.algorithms.RSAAlgorithm.from_jwk(json.dumps(key))
        return None

    def get_signing_key(token: str, jwks_url: str):
        key = _find_signing_key(token, jwks_url)
        if key:
            return key
        _jwks_cache["by_url"][jwks_url] = {"data": None, "loaded_at": 0.0}
        key = _find_signing_key(token, jwks_url)
        if key:
            return key
        raise HTTPException(status_code=401, detail="Invalid subject token")

    def verify_token(token: str):
        last_error = None
        try:
            unverified = jwt.decode(token, options={"verify_signature": False, "verify_exp": False})
            token_issuer = unverified.get("iss")
        except Exception:
            token_issuer = None

        configs = _issuer_configs()
        if token_issuer:
            matching = [cfg for cfg in configs if cfg.get("issuer") == token_issuer]
            if matching:
                configs = matching + [cfg for cfg in configs if cfg not in matching]
        try:
            for cfg in configs:
                try:
                    key = get_signing_key(token, cfg["jwks_url"])
                    return jwt.decode(
                        token,
                        key,
                        algorithms=["RS256"],
                        issuer=cfg["issuer"],
                        options={"verify_aud": False},
                    )
                except Exception as exc:
                    last_error = exc
                    continue
        except Exception:
            pass
        if last_error is not None:
            raise HTTPException(status_code=401, detail="Invalid subject token")
        raise HTTPException(status_code=401, detail="Invalid subject token")

    @app.post("/token")
    def token_exchange(
        grant_type: str = Form(...),
        subject_token: str = Form(...),
        subject_token_type: str = Form(None),
        audience: str = Form(None),
        client_id: str = Form(None),
        client_secret: str = Form(None),
    ):
        if grant_type != "urn:ietf:params:oauth:grant-type:token-exchange":
            raise HTTPException(status_code=400, detail="Unsupported grant_type")

        decoded = verify_token(subject_token)

        # Enforce audience match if provided (matches Keycloak 'aud' semantics)
        if audience:
            aud = decoded.get("aud")
            if isinstance(aud, list) and audience not in aud:
                raise HTTPException(status_code=401, detail="Requested audience not available")
            if isinstance(aud, str) and aud != audience:
                raise HTTPException(status_code=401, detail="Requested audience not available")

        client_key = _get_client_key(decoded)
        if not client_key:
            raise HTTPException(
                status_code=403,
                detail="Subject token missing client identifier",
            )

        directus_token = _get_directus_token_for_client(client_key)
        if not directus_token and AUDIENCE_TOKEN_FALLBACK_ENABLED and _is_client_key(audience):
            directus_token = _get_directus_token_for_client(audience)
        if not directus_token:
            raise HTTPException(
                status_code=403,
                detail=f"No Directus token configured for client '{client_key}'",
            )

        return {
            "access_token": directus_token,
            "token_type": "Bearer",
            "expires_in": TOKEN_TTL_SECONDS,
            "issued_token_type": "urn:ietf:params:oauth:token-type:access_token",
            "jti": str(uuid.uuid4()),
        }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus-auth-bridge
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }

      sink "file" {
        config = {
          # Shared with the app container via the /vault-secrets emptyDir.
          path = "/vault-secrets/vault-token"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus-auth-bridge
  namespace: directus
  labels:
    app: directus-auth-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus-auth-bridge
  template:
    metadata:
      labels:
        app: directus-auth-bridge
    spec:
      # Reuse the Directus service account so Vault Kubernetes auth role binding keeps working.
      serviceAccountName: directus
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: directus-auth-bridge
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_INTERNAL_ISSUER
              value: "https://auth.suncoast.systems/realms/internal"
            - name: KEYCLOAK_INTERNAL_JWKS_URL
              value: "https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs"
            - name: KEYCLOAK_EXTERNAL_ISSUER
              value: "https://auth.suncoast.systems/realms/external"
            - name: KEYCLOAK_EXTERNAL_JWKS_URL
              value: "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs"
            - name: DIRECTUS_EXPIRES_IN_SECONDS
              value: "3600"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt >/dev/null
              echo "⏳ Waiting for Vault agent to authenticate..."
              while [ ! -f /vault-secrets/vault-token ]; do
                sleep 2
              done
              python -m uvicorn app:app --app-dir /app --host 0.0.0.0 --port 8080
          volumeMounts:
            - name: app
              mountPath: /app
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: app
          configMap:
            name: directus-auth-bridge
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus-auth-bridge
        - name: vault-secrets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: directus-auth-bridge
  namespace: directus
  labels:
    app: directus-auth-bridge
spec:
  selector:
    app: directus-auth-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
