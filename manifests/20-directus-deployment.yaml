# Directus Deployment with Vault integration & dynamic role mapping
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: directus
  labels:
    app: directus
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # start with one replica to avoid concurrent DB init
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
      annotations:
        reloader.stakater.com/auto: "true"
        directus.suncoast.systems/extensions-seed-revision: "2026-07-10.2"
        # Init containers must reach Oracle VM (SSH 22 / Postgres 5432) before
        # linkerd-proxy is running. Skip proxy redirection for these ports.
        config.linkerd.io/skip-outbound-ports: "22,5432,5433"
    spec:
      serviceAccountName: directus
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads-remote-vm-v8
        - name: uploads-legacy
          emptyDir: {}
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus
        - name: vault-secrets
          emptyDir: {}
        - name: vault-templates
          configMap:
            name: vault-agent-config-directus
            items:
              - key: app-keys.tpl
                path: app-keys.tpl
              - key: openai.tpl
                path: openai.tpl
              - key: redis-creds.tpl
                path: redis-creds.tpl
        - name: directus-settings
          configMap:
            name: directus-settings
            items:
              - key: settings.yaml
                path: settings.yaml
        - name: directus-sites
          configMap:
            name: directus-sites
            items:
              - key: sites.yaml
                path: sites.yaml
        - name: directus-layout-templates
          configMap:
            name: directus-layout-templates
        - name: directus-theme-packages
          configMap:
            name: directus-theme-packages
        - name: directus-modules
          configMap:
            name: directus-modules
            items:
              - key: modules.yaml
                path: modules.yaml
        - name: directus-postschema-script
          configMap:
            name: directus-postschema-script
            items:
              - key: directus-postschema.sh
                path: directus-postschema.sh
        - name: directus-postschema-data-mutations
          configMap:
            name: directus-postschema-data-mutations
            items:
              - key: directus-postschema-data-mutations.sh
                path: directus-postschema-data-mutations.sh
        - name: directus-postschema-state
          emptyDir: {}
        - name: directus-extensions-seed
          configMap:
            name: directus-extensions-seed
            items:
              - key: github-profile-sync.package.json
                path: github-profile-sync/package.json
              - key: github-profile-sync.index.js
                path: github-profile-sync/index.js
              - key: ai-provider-access.package.json
                path: ai-provider-access/package.json
              - key: ai-provider-access.index.js
                path: ai-provider-access/index.js
              - key: cms-content-model-select.package.json
                path: cms-content-model-select/package.json
              - key: cms-content-model-select.index.js
                path: cms-content-model-select/index.js
              - key: cms-keycloak-role-options.package.json
                path: cms-keycloak-role-options/package.json
              - key: cms-keycloak-role-options.index.js
                path: cms-keycloak-role-options/index.js
              - key: cms-asset-url-picker.package.json
                path: cms-asset-url-picker/package.json
              - key: cms-asset-url-picker.index.js
                path: cms-asset-url-picker/index.js
              - key: cms-module-props-editor.package.json
                path: cms-module-props-editor/package.json
              - key: cms-module-props-editor.index.js
                path: cms-module-props-editor/index.js
              - key: cms-preset-bookmark-copy.package.json
                path: cms-preset-bookmark-copy/package.json
              - key: cms-preset-bookmark-copy.index.js
                path: cms-preset-bookmark-copy/index.js
              - key: cms-bookmark-copy.package.json
                path: cms-bookmark-copy/package.json
              - key: cms-bookmark-copy.index.js
                path: cms-bookmark-copy/index.js
              - key: cms-page-blocks-manager.package.json
                path: cms-page-blocks-manager/package.json
              - key: cms-page-blocks-manager.index.js
                path: cms-page-blocks-manager/index.js
        - name: directus-extensions
          emptyDir: {}
      initContainers:
        - name: migrate-legacy-uploads
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              SRC_DIR="/legacy-uploads"
              DST_DIR="/directus/uploads"
              SENTINEL="${DST_DIR}/.legacy_uploads_migrated"

              mkdir -p "${DST_DIR}"

              if [ -f "${SENTINEL}" ]; then
                echo "✅ Legacy uploads already migrated."
                exit 0
              fi

              if [ ! -d "${SRC_DIR}" ] || [ -z "$(find "${SRC_DIR}" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null || true)" ]; then
                echo "ℹ️ No legacy uploads detected."
                touch "${SENTINEL}"
                exit 0
              fi

              echo "📦 Migrating legacy uploads to remote volume..."
              cp -a "${SRC_DIR}/." "${DST_DIR}/"
              touch "${SENTINEL}"
              echo "✅ Legacy uploads migration complete."
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: uploads-legacy
              mountPath: /legacy-uploads
            - name: uploads
              mountPath: /directus/uploads
        - name: seed-directus-extensions
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              echo "📦 Seeding Directus extensions into writable storage..."
              mkdir -p /directus/extensions

              # Keep our GitOps-managed extensions deterministic on every start.
              rm -rf /directus/extensions/github-profile-sync /directus/extensions/ai-provider-access /directus/extensions/cms-content-model-select /directus/extensions/cms-keycloak-role-options /directus/extensions/cms-asset-url-picker /directus/extensions/cms-module-props-editor /directus/extensions/cms-preset-bookmark-copy /directus/extensions/cms-bookmark-copy /directus/extensions/cms-page-blocks-manager
              # ConfigMap volumes use symlinks; dereference so we copy real files into the PVC.
              cp -RL /extensions-seed/* /directus/extensions/

              # Best-effort: ensure the runtime can write here for marketplace installs.
              chmod -R a+rwX /directus/extensions || true
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: directus-extensions
              mountPath: /directus/extensions
            - name: directus-extensions-seed
              mountPath: /extensions-seed
              readOnly: true
        - name: render-directus-db-creds
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              KV_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus/db"
              TOPLEVEL_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus_db"
              LEAF_DB_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_user"
              LEAF_DB_PASSWROD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_passwrod"
              LEAF_DB_PASSWORD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_password"
              LEAF_DB_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_host"
              LEAF_DB_PORT_URL="${VAULT_ADDR}/v1/secret/data/directus_db_port"
              LEAF_DB_DATABASE_URL="${VAULT_ADDR}/v1/secret/data/directus_db_database"
              LEAF_DB_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_host"
              LEAF_DB_SSH_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_host"
              LEAF_DB_TUNNEL_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_user"
              LEAF_DB_SSH_TUNNEL_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_user"
              LEAF_DB_SSH_PRIVATE_KEY_B64_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_private_key_b64"
              DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW="${DIRECTUS_DB_LEAF_SECRETS_ONLY:-true}"
              case "$(printf '%s' "${DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) DIRECTUS_DB_LEAF_SECRETS_ONLY="true" ;;
                *) DIRECTUS_DB_LEAF_SECRETS_ONLY="false" ;;
              esac

              _quote_env_value() {
                # Render a POSIX shell-safe single-quoted literal.
                # This prevents '$' and backticks in secrets from expanding when sourced.
                printf '%s' "$1" | sed "s/'/'\"'\"'/g"
              }

              _write_env_export() {
                _name="$1"
                _value="$2"
                printf "export %s='%s'\n" "${_name}" "$(_quote_env_value "${_value}")"
              }

              DB_SOURCE=""
              DB_HOST_OVERRIDE=""
              DB_PORT_OVERRIDE=""
              DB_DATABASE_OVERRIDE=""
              DB_USER=""
              DB_PASS=""
              DB_TUNNEL_ENABLED_RAW="false"
              DB_TUNNEL_HOST=""
              DB_TUNNEL_PORT=""
              DB_TUNNEL_USER=""
              DB_TUNNEL_LOCAL_PORT=""
              DB_TUNNEL_REMOTE_PORT=""
              DB_TUNNEL_PRIVATE_KEY_B64=""

              i=0
              while [ "$i" -lt 40 ]; do
                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                  CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-kv.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${KV_CREDS_URL}" || true)"
                  if [ "${CODE}" = "200" ]; then
                    DB_USER="$(jq -r '.data.data.username // .data.data.user // empty' /tmp/db-kv.json)"
                    DB_PASS="$(jq -r '.data.data.password // .data.data.pass // empty' /tmp/db-kv.json)"
                    DB_HOST_OVERRIDE="$(jq -r '.data.data.host // empty' /tmp/db-kv.json)"
                    DB_PORT_OVERRIDE="$(jq -r '.data.data.port // empty' /tmp/db-kv.json)"
                    DB_DATABASE_OVERRIDE="$(jq -r '.data.data.database // .data.data.db // empty' /tmp/db-kv.json)"
                    DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.ssh_tunnel_enabled // "false"' /tmp/db-kv.json)"
                    DB_TUNNEL_HOST="$(jq -r '.data.data.ssh_tunnel_host // .data.data.host // empty' /tmp/db-kv.json)"
                    DB_TUNNEL_PORT="$(jq -r '.data.data.ssh_tunnel_port // "22"' /tmp/db-kv.json)"
                    DB_TUNNEL_USER="$(jq -r '.data.data.ssh_tunnel_user // "directus_tunnel"' /tmp/db-kv.json)"
                    DB_TUNNEL_LOCAL_PORT="$(jq -r '.data.data.ssh_tunnel_local_port // "15432"' /tmp/db-kv.json)"
                    DB_TUNNEL_REMOTE_PORT="$(jq -r '.data.data.ssh_tunnel_remote_port // "5432"' /tmp/db-kv.json)"
                    DB_TUNNEL_PRIVATE_KEY_B64="$(jq -r '.data.data.ssh_private_key_b64 // empty' /tmp/db-kv.json)"
                    if [ -n "${DB_USER}" ] && [ -n "${DB_PASS}" ] && [ "${DB_USER}" != "null" ] && [ "${DB_PASS}" != "null" ]; then
                      DB_SOURCE="secret/data/directus/db"
                      break
                    fi
                  fi
                fi

                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                  TOPLEVEL_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-top.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${TOPLEVEL_CREDS_URL}" || true)"
                  if [ "${TOPLEVEL_CODE}" = "200" ]; then
                    DB_USER="$(jq -r '.data.data.directus_db_username // .data.data.directus_db_user // .data.data.username // .data.data.user // empty' /tmp/db-top.json)"
                    DB_PASS="$(jq -r '.data.data.directus_db_password // .data.data.password // .data.data.pass // empty' /tmp/db-top.json)"
                    DB_HOST_OVERRIDE="$(jq -r '.data.data.directus_db_host // .data.data.host // empty' /tmp/db-top.json)"
                    DB_PORT_OVERRIDE="$(jq -r '.data.data.directus_db_port // .data.data.port // empty' /tmp/db-top.json)"
                    DB_DATABASE_OVERRIDE="$(jq -r '.data.data.directus_db_database // .data.data.database // .data.data.db // empty' /tmp/db-top.json)"
                    DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.directus_db_ssh_tunnel_enabled // .data.data.ssh_tunnel_enabled // "false"' /tmp/db-top.json)"
                    DB_TUNNEL_HOST="$(jq -r '.data.data.directus_db_ssh_tunnel_host // .data.data.ssh_tunnel_host // .data.data.directus_db_host // .data.data.host // empty' /tmp/db-top.json)"
                    DB_TUNNEL_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_port // .data.data.ssh_tunnel_port // "22"' /tmp/db-top.json)"
                    DB_TUNNEL_USER="$(jq -r '.data.data.directus_db_ssh_tunnel_user // .data.data.ssh_tunnel_user // "directus_tunnel"' /tmp/db-top.json)"
                    DB_TUNNEL_LOCAL_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_local_port // .data.data.ssh_tunnel_local_port // "15432"' /tmp/db-top.json)"
                    DB_TUNNEL_REMOTE_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_remote_port // .data.data.ssh_tunnel_remote_port // "5432"' /tmp/db-top.json)"
                    DB_TUNNEL_PRIVATE_KEY_B64="$(jq -r '.data.data.directus_db_ssh_private_key_b64 // .data.data.ssh_private_key_b64 // empty' /tmp/db-top.json)"
                    if [ -n "${DB_USER}" ] && [ -n "${DB_PASS}" ] && [ "${DB_USER}" != "null" ] && [ "${DB_PASS}" != "null" ]; then
                      DB_SOURCE="secret/data/directus_db"
                      break
                    fi
                  fi
                fi

                LEAF_DB_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-user.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_USER_URL}" || true)"
                LEAF_DB_PASSWROD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-passwrod.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWROD_URL}" || true)"
                LEAF_DB_PASSWORD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-password.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWORD_URL}" || true)"
                LEAF_DB_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_HOST_URL}" || true)"
                LEAF_DB_PORT_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-port.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PORT_URL}" || true)"
                LEAF_DB_DATABASE_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-database.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_DATABASE_URL}" || true)"
                LEAF_DB_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_HOST_URL}" || true)"
                LEAF_DB_SSH_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_HOST_URL}" || true)"
                LEAF_DB_TUNNEL_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-tunnel-user.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_USER_URL}" || true)"
                LEAF_DB_SSH_TUNNEL_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-tunnel-user.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_USER_URL}" || true)"
                LEAF_DB_SSH_PRIVATE_KEY_B64_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-key.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_PRIVATE_KEY_B64_URL}" || true)"
                LEAF_DB_USER=""
                LEAF_DB_PASS=""
                LEAF_DB_HOST=""
                LEAF_DB_PORT=""
                LEAF_DB_DATABASE=""
                LEAF_DB_TUNNEL_HOST=""
                LEAF_DB_TUNNEL_USER=""
                LEAF_DB_SSH_PRIVATE_KEY_B64=""
                if [ "${LEAF_DB_USER_CODE}" = "200" ]; then
                  LEAF_DB_USER="$(jq -r '.data.data.value // .data.data.username // .data.data.user // .data.data.directus_db_user // .data.data.directus_db_username // empty' /tmp/db-leaf-user.json)"
                fi
                if [ "${LEAF_DB_PASSWROD_CODE}" = "200" ]; then
                  LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/db-leaf-passwrod.json)"
                fi
                if [ -z "${LEAF_DB_PASS}" ] && [ "${LEAF_DB_PASSWORD_CODE}" = "200" ]; then
                  LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/db-leaf-password.json)"
                fi
                if [ "${LEAF_DB_HOST_CODE}" = "200" ]; then
                  LEAF_DB_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_host // empty' /tmp/db-leaf-host.json)"
                fi
                if [ "${LEAF_DB_PORT_CODE}" = "200" ]; then
                  LEAF_DB_PORT="$(jq -r '.data.data.value // .data.data.port // .data.data.directus_db_port // empty' /tmp/db-leaf-port.json)"
                fi
                if [ "${LEAF_DB_DATABASE_CODE}" = "200" ]; then
                  LEAF_DB_DATABASE="$(jq -r '.data.data.value // .data.data.database // .data.data.db // .data.data.directus_db_database // empty' /tmp/db-leaf-database.json)"
                fi
                if [ "${LEAF_DB_SSH_TUNNEL_HOST_CODE}" = "200" ]; then
                  LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/db-leaf-ssh-tunnel-host.json)"
                elif [ "${LEAF_DB_TUNNEL_HOST_CODE}" = "200" ]; then
                  LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/db-leaf-tunnel-host.json)"
                fi
                if [ "${LEAF_DB_SSH_TUNNEL_USER_CODE}" = "200" ]; then
                  LEAF_DB_TUNNEL_USER="$(jq -r '.data.data.value // .data.data.user // .data.data.username // .data.data.directus_db_ssh_tunnel_user // .data.data.directus_db_tunnel_user // empty' /tmp/db-leaf-ssh-tunnel-user.json)"
                elif [ "${LEAF_DB_TUNNEL_USER_CODE}" = "200" ]; then
                  LEAF_DB_TUNNEL_USER="$(jq -r '.data.data.value // .data.data.user // .data.data.username // .data.data.directus_db_ssh_tunnel_user // .data.data.directus_db_tunnel_user // empty' /tmp/db-leaf-tunnel-user.json)"
                fi
                if [ "${LEAF_DB_SSH_PRIVATE_KEY_B64_CODE}" = "200" ]; then
                  LEAF_DB_SSH_PRIVATE_KEY_B64="$(jq -r '.data.data.value // .data.data.directus_db_ssh_private_key_b64 // .data.data.ssh_private_key_b64 // empty' /tmp/db-leaf-ssh-key.json)"
                fi
                if [ -n "${LEAF_DB_USER}" ] && [ -n "${LEAF_DB_PASS}" ] && [ "${LEAF_DB_USER}" != "null" ] && [ "${LEAF_DB_PASS}" != "null" ]; then
                  DB_USER="${LEAF_DB_USER}"
                  DB_PASS="${LEAF_DB_PASS}"
                  DB_DATABASE_OVERRIDE="${LEAF_DB_DATABASE}"
                  if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ]; then
                    DB_HOST_OVERRIDE="${LEAF_DB_TUNNEL_HOST}"
                  else
                    DB_HOST_OVERRIDE="${LEAF_DB_HOST}"
                  fi
                  if [ -n "${LEAF_DB_PORT}" ] && [ "${LEAF_DB_PORT}" != "null" ]; then
                    DB_PORT_OVERRIDE="${LEAF_DB_PORT}"
                  elif [ -n "${DB_HOST_OVERRIDE}" ] && [ "${DB_HOST_OVERRIDE}" != "null" ]; then
                    DB_PORT_OVERRIDE="5432"
                  fi
                  if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ] && [ -n "${LEAF_DB_SSH_PRIVATE_KEY_B64}" ] && [ "${LEAF_DB_SSH_PRIVATE_KEY_B64}" != "null" ]; then
                    DB_TUNNEL_ENABLED_RAW="true"
                    DB_TUNNEL_HOST="${LEAF_DB_TUNNEL_HOST}"
                    DB_TUNNEL_PORT="22"
                    if [ -n "${LEAF_DB_TUNNEL_USER}" ] && [ "${LEAF_DB_TUNNEL_USER}" != "null" ]; then
                      DB_TUNNEL_USER="${LEAF_DB_TUNNEL_USER}"
                    else
                      DB_TUNNEL_USER="directus_tunnel"
                    fi
                    DB_TUNNEL_LOCAL_PORT="15432"
                    DB_TUNNEL_REMOTE_PORT="${DB_PORT_OVERRIDE:-5432}"
                    DB_TUNNEL_PRIVATE_KEY_B64="${LEAF_DB_SSH_PRIVATE_KEY_B64}"
                  else
                    DB_TUNNEL_ENABLED_RAW="false"
                    DB_TUNNEL_HOST=""
                    DB_TUNNEL_PORT=""
                    DB_TUNNEL_USER=""
                    DB_TUNNEL_LOCAL_PORT=""
                    DB_TUNNEL_REMOTE_PORT=""
                    DB_TUNNEL_PRIVATE_KEY_B64=""
                  fi
                  DB_SOURCE="secret/data/directus_db_user + secret/data/directus_db_passwrod"
                  break
                fi

                i=$((i + 1))
                sleep 3
              done

              if [ -z "${DB_SOURCE}" ]; then
                echo "❌ Failed to resolve Directus DB credentials from Vault."
                exit 1
              fi
              if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" = "true" ] && { [ -z "${DB_HOST_OVERRIDE}" ] || [ "${DB_HOST_OVERRIDE}" = "null" ]; }; then
                echo "❌ DIRECTUS_DB_LEAF_SECRETS_ONLY=true but secret/data/directus_db_tunnel_host or secret/data/directus_db_ssh_tunnel_host (or directus_db_host) is missing."
                exit 1
              fi

              DB_HOST_EFFECTIVE="${DB_HOST}"
              DB_PORT_EFFECTIVE="${DB_PORT}"
              DB_DATABASE_EFFECTIVE="${DB_DATABASE}"

              if [ -n "${DB_HOST_OVERRIDE}" ] && [ "${DB_HOST_OVERRIDE}" != "null" ]; then DB_HOST_EFFECTIVE="${DB_HOST_OVERRIDE}"; fi
              if [ -n "${DB_PORT_OVERRIDE}" ] && [ "${DB_PORT_OVERRIDE}" != "null" ]; then DB_PORT_EFFECTIVE="${DB_PORT_OVERRIDE}"; fi
              if [ -n "${DB_DATABASE_OVERRIDE}" ] && [ "${DB_DATABASE_OVERRIDE}" != "null" ]; then DB_DATABASE_EFFECTIVE="${DB_DATABASE_OVERRIDE}"; fi

              case "$(printf '%s' "${DB_TUNNEL_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) DB_TUNNEL_ENABLED="true" ;;
                *) DB_TUNNEL_ENABLED="false" ;;
              esac
              DB_TUNNEL_USER_CANDIDATES=""

              if [ "${DB_TUNNEL_ENABLED}" = "true" ]; then
                if [ -z "${DB_TUNNEL_HOST}" ] || [ "${DB_TUNNEL_HOST}" = "null" ]; then DB_TUNNEL_HOST="${DB_HOST_EFFECTIVE}"; fi
                if [ -z "${DB_TUNNEL_PORT}" ] || [ "${DB_TUNNEL_PORT}" = "null" ]; then DB_TUNNEL_PORT="22"; fi
                if [ -z "${DB_TUNNEL_USER}" ] || [ "${DB_TUNNEL_USER}" = "null" ]; then DB_TUNNEL_USER="directus_tunnel"; fi
                if [ -z "${DB_TUNNEL_LOCAL_PORT}" ] || [ "${DB_TUNNEL_LOCAL_PORT}" = "null" ]; then DB_TUNNEL_LOCAL_PORT="15432"; fi
                if [ -z "${DB_TUNNEL_REMOTE_PORT}" ] || [ "${DB_TUNNEL_REMOTE_PORT}" = "null" ]; then DB_TUNNEL_REMOTE_PORT="5432"; fi
                DB_TUNNEL_USER_CANDIDATES="${DB_TUNNEL_USER}"
                for _fallback_user in ubuntu opc; do
                  if [ "${_fallback_user}" != "${DB_TUNNEL_USER}" ]; then
                    DB_TUNNEL_USER_CANDIDATES="${DB_TUNNEL_USER_CANDIDATES},${_fallback_user}"
                  fi
                done
                DB_HOST_EFFECTIVE="127.0.0.1"
                DB_PORT_EFFECTIVE="${DB_TUNNEL_LOCAL_PORT}"
              else
                DB_TUNNEL_HOST=""
                DB_TUNNEL_PORT=""
                DB_TUNNEL_USER=""
                DB_TUNNEL_LOCAL_PORT=""
                DB_TUNNEL_REMOTE_PORT=""
                DB_TUNNEL_PRIVATE_KEY_B64=""
                DB_TUNNEL_USER_CANDIDATES=""
              fi

              TMP_ENV="/vault-secrets/db-creds.env.tmp"
              FINAL_ENV="/vault-secrets/db-creds.env"
              {
                _write_env_export DB_HOST "${DB_HOST_EFFECTIVE}"
                _write_env_export DB_PORT "${DB_PORT_EFFECTIVE}"
                _write_env_export DB_DATABASE "${DB_DATABASE_EFFECTIVE}"
                _write_env_export DB_USER "${DB_USER}"
                _write_env_export DB_PASSWORD "${DB_PASS}"
                _write_env_export DB_TUNNEL_ENABLED "${DB_TUNNEL_ENABLED}"
                if [ "${DB_TUNNEL_ENABLED}" = "true" ]; then
                  _write_env_export DB_TUNNEL_HOST "${DB_TUNNEL_HOST}"
                  _write_env_export DB_TUNNEL_PORT "${DB_TUNNEL_PORT}"
                  _write_env_export DB_TUNNEL_USER "${DB_TUNNEL_USER}"
                  _write_env_export DB_TUNNEL_USER_CANDIDATES "${DB_TUNNEL_USER_CANDIDATES}"
                  _write_env_export DB_TUNNEL_LOCAL_PORT "${DB_TUNNEL_LOCAL_PORT}"
                  _write_env_export DB_TUNNEL_REMOTE_PORT "${DB_TUNNEL_REMOTE_PORT}"
                  _write_env_export DB_TUNNEL_SSH_PRIVATE_KEY_B64 "${DB_TUNNEL_PRIVATE_KEY_B64}"
                fi
              } > "${TMP_ENV}"
              mv "${TMP_ENV}" "${FINAL_ENV}"
              chmod 0644 "${FINAL_ENV}" || true

              echo "✅ Wrote ${FINAL_ENV} from ${DB_SOURCE} (host=${DB_HOST_EFFECTIVE} port=${DB_PORT_EFFECTIVE} db=${DB_DATABASE_EFFECTIVE})"
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
            - name: DB_SCHEMA
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_SCHEMA } }
            - name: DIRECTUS_DB_LEAF_SECRETS_ONLY
              value: "true"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
            - name: vault-secrets
              mountPath: /vault-secrets
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: nuke-directus-roles
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              RESET_DIRECTUS_USERS_ROLES_RAW="${RESET_DIRECTUS_USERS_ROLES:-false}"
              case "$(printf '%s' "${RESET_DIRECTUS_USERS_ROLES_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) RESET_DIRECTUS_USERS_ROLES="true" ;;
                *) RESET_DIRECTUS_USERS_ROLES="false" ;;
              esac
              if [ "${RESET_DIRECTUS_USERS_ROLES}" != "true" ]; then
                echo "ℹ️ Skipping destructive Directus role/user reset (RESET_DIRECTUS_USERS_ROLES=false)."
                exit 0
              fi

              # tools we need (alpine base)
              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              KV_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus/db"
              TOPLEVEL_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus_db"
              LEAF_DB_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_user"
              LEAF_DB_PASSWROD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_passwrod"
              LEAF_DB_PASSWORD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_password"
              LEAF_DB_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_host"
              LEAF_DB_PORT_URL="${VAULT_ADDR}/v1/secret/data/directus_db_port"
              LEAF_DB_DATABASE_URL="${VAULT_ADDR}/v1/secret/data/directus_db_database"
              LEAF_DB_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_host"
              LEAF_DB_SSH_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_host"
              DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW="${DIRECTUS_DB_LEAF_SECRETS_ONLY:-true}"
              case "$(printf '%s' "${DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) DIRECTUS_DB_LEAF_SECRETS_ONLY="true" ;;
                *) DIRECTUS_DB_LEAF_SECRETS_ONLY="false" ;;
              esac

              echo "🔐 Fetching DB credentials from Vault…"
              DB_HOST_OVERRIDE=""
              DB_PORT_OVERRIDE=""
              DB_DATABASE_OVERRIDE=""
              DB_USER=""
              DB_PASS=""
              i=0
              while [ "$i" -lt 40 ]; do
                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                  CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${KV_CREDS_URL}" || true)"
                  if [ "$CODE" = "200" ]; then
                    DB_USER="$(jq -r '.data.data.username // .data.data.user // empty' /tmp/creds.json)"
                    DB_PASS="$(jq -r '.data.data.password // .data.data.pass // empty' /tmp/creds.json)"
                    DB_HOST_OVERRIDE="$(jq -r '.data.data.host // empty' /tmp/creds.json)"
                    DB_PORT_OVERRIDE="$(jq -r '.data.data.port // empty' /tmp/creds.json)"
                    DB_DATABASE_OVERRIDE="$(jq -r '.data.data.database // .data.data.db // empty' /tmp/creds.json)"
                    if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                      echo "  .. using secret/data/directus/db"
                      break
                    fi
                  elif [ "$CODE" != "404" ]; then
                    ERR="$(jq -r '.errors[0] // empty' /tmp/creds.json 2>/dev/null || true)"
                    if [ -n "$ERR" ]; then
                      echo "  .. Vault returned HTTP $CODE: $ERR"
                    else
                      echo "  .. Vault returned HTTP $CODE"
                    fi
                  fi
                fi

                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                  TOPLEVEL_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/top-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${TOPLEVEL_CREDS_URL}" || true)"
                  if [ "$TOPLEVEL_CODE" = "200" ]; then
                    DB_USER="$(jq -r '.data.data.directus_db_username // .data.data.directus_db_user // .data.data.username // .data.data.user // empty' /tmp/top-creds.json)"
                    DB_PASS="$(jq -r '.data.data.directus_db_password // .data.data.password // .data.data.pass // empty' /tmp/top-creds.json)"
                    DB_HOST_OVERRIDE="$(jq -r '.data.data.directus_db_host // .data.data.host // empty' /tmp/top-creds.json)"
                    DB_PORT_OVERRIDE="$(jq -r '.data.data.directus_db_port // .data.data.port // empty' /tmp/top-creds.json)"
                    DB_DATABASE_OVERRIDE="$(jq -r '.data.data.directus_db_database // .data.data.database // .data.data.db // empty' /tmp/top-creds.json)"
                    if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                      echo "  .. using secret/data/directus_db"
                      break
                    fi
                  elif [ "$TOPLEVEL_CODE" != "404" ]; then
                    ERR="$(jq -r '.errors[0] // empty' /tmp/top-creds.json 2>/dev/null || true)"
                    if [ -n "$ERR" ]; then
                      echo "  .. Vault returned HTTP $TOPLEVEL_CODE from secret/data/directus_db: $ERR"
                    else
                      echo "  .. Vault returned HTTP $TOPLEVEL_CODE from secret/data/directus_db"
                    fi
                  fi
                fi

                LEAF_DB_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-user.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_USER_URL}" || true)"
                LEAF_DB_PASSWROD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-passwrod.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWROD_URL}" || true)"
                LEAF_DB_PASSWORD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-password.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWORD_URL}" || true)"
                LEAF_DB_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_HOST_URL}" || true)"
                LEAF_DB_PORT_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-port.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PORT_URL}" || true)"
                LEAF_DB_DATABASE_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-database.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_DATABASE_URL}" || true)"
                LEAF_DB_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_HOST_URL}" || true)"
                LEAF_DB_SSH_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/leaf-db-ssh-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_HOST_URL}" || true)"
                LEAF_DB_USER=""
                LEAF_DB_PASS=""
                LEAF_DB_HOST=""
                LEAF_DB_PORT=""
                LEAF_DB_DATABASE=""
                LEAF_DB_TUNNEL_HOST=""
                if [ "$LEAF_DB_USER_CODE" = "200" ]; then
                  LEAF_DB_USER="$(jq -r '.data.data.value // .data.data.username // .data.data.user // .data.data.directus_db_user // .data.data.directus_db_username // empty' /tmp/leaf-db-user.json)"
                fi
                if [ "$LEAF_DB_PASSWROD_CODE" = "200" ]; then
                  LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/leaf-db-passwrod.json)"
                fi
                if [ -z "$LEAF_DB_PASS" ] && [ "$LEAF_DB_PASSWORD_CODE" = "200" ]; then
                  LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/leaf-db-password.json)"
                fi
                if [ "$LEAF_DB_HOST_CODE" = "200" ]; then
                  LEAF_DB_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_host // empty' /tmp/leaf-db-host.json)"
                fi
                if [ "$LEAF_DB_PORT_CODE" = "200" ]; then
                  LEAF_DB_PORT="$(jq -r '.data.data.value // .data.data.port // .data.data.directus_db_port // empty' /tmp/leaf-db-port.json)"
                fi
                if [ "$LEAF_DB_DATABASE_CODE" = "200" ]; then
                  LEAF_DB_DATABASE="$(jq -r '.data.data.value // .data.data.database // .data.data.db // .data.data.directus_db_database // empty' /tmp/leaf-db-database.json)"
                fi
                if [ "${LEAF_DB_SSH_TUNNEL_HOST_CODE}" = "200" ]; then
                  LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/leaf-db-ssh-tunnel-host.json)"
                elif [ "$LEAF_DB_TUNNEL_HOST_CODE" = "200" ]; then
                  LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/leaf-db-tunnel-host.json)"
                fi
                if [ -n "$LEAF_DB_USER" ] && [ -n "$LEAF_DB_PASS" ]; then
                  DB_USER="$LEAF_DB_USER"
                  DB_PASS="$LEAF_DB_PASS"
                  if [ -n "$LEAF_DB_TUNNEL_HOST" ] && [ "$LEAF_DB_TUNNEL_HOST" != "null" ]; then
                    DB_HOST_OVERRIDE="$LEAF_DB_TUNNEL_HOST"
                  else
                    DB_HOST_OVERRIDE="$LEAF_DB_HOST"
                  fi
                  if [ -n "$LEAF_DB_PORT" ] && [ "$LEAF_DB_PORT" != "null" ]; then
                    DB_PORT_OVERRIDE="$LEAF_DB_PORT"
                  elif [ -n "$DB_HOST_OVERRIDE" ] && [ "$DB_HOST_OVERRIDE" != "null" ]; then
                    DB_PORT_OVERRIDE="5432"
                  fi
                  DB_DATABASE_OVERRIDE="$LEAF_DB_DATABASE"
                  echo "  .. using secret/data/directus_db_user + secret/data/directus_db_passwrod"
                  break
                fi

                i=$((i + 1))
                sleep 3
              done

              if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
                echo "❌ Failed to fetch DB creds from Vault"; exit 1
              fi

              if [ -n "$DB_HOST_OVERRIDE" ]; then DB_HOST="$DB_HOST_OVERRIDE"; fi
              if [ -n "$DB_PORT_OVERRIDE" ]; then DB_PORT="$DB_PORT_OVERRIDE"; fi
              if [ -n "$DB_DATABASE_OVERRIDE" ]; then DB_DATABASE="$DB_DATABASE_OVERRIDE"; fi

              export PGPASSWORD="$DB_PASS"
              echo "🔧 Checking and truncating directus tables if they exist…"
              
              # Check if directus_roles table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_roles'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_roles..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_roles RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_roles does not exist, skipping"
              fi
              
              # Check if directus_users table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_users'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_users..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_users RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_users does not exist, skipping"
              fi
              
              echo "✅ Directus tables checked and cleaned if they existed."
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
            - name: RESET_DIRECTUS_USERS_ROLES
              value: "false"
            - name: DIRECTUS_DB_LEAF_SECRETS_ONLY
              value: "true"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              TARGET_PREFIX="${DIRECTUS_DB_CONFIG_JOB_PREFIX:-}"
              if [ -z "${TARGET_PREFIX}" ]; then
                echo "ℹ️ DIRECTUS_DB_CONFIG_JOB_PREFIX is empty; skipping DB config job wait."
                exit 0
              fi
              echo "Waiting for Job(s) with prefix '${TARGET_PREFIX}' in vault namespace to complete..."
              MAX_MISSES=24 # ~2 minutes at 5s intervals
              MISSES=0

              while true; do
                # 1) If an exact job exists, check it first
                if kubectl -n vault get job "$TARGET_PREFIX" >/dev/null 2>&1; then
                  SUCC="$(kubectl -n vault get job "$TARGET_PREFIX" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  [ "${SUCC:-0}" -ge 1 ] && { echo "✅ Job $TARGET_PREFIX succeeded"; break; }
                  MISSES=0
                fi

                # 2) Otherwise, find any job whose name starts with the prefix (handles CronJob or generateName cases)
                MATCHING_JOB="$(kubectl -n vault get jobs -o json \
                  | jq -r --arg p "$TARGET_PREFIX" '.items[] | select(.metadata.name | startswith($p)) | .metadata.name' \
                  | head -n1)"

                if [ -n "$MATCHING_JOB" ]; then
                  SUCC="$(kubectl -n vault get job "$MATCHING_JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  if [ "${SUCC:-0}" -ge 1 ]; then
                    echo "✅ Job $MATCHING_JOB succeeded"
                    break
                  fi
                  MISSES=0
                else
                  MISSES=$((MISSES + 1))
                  if [ "$MISSES" -ge "$MAX_MISSES" ]; then
                    echo "⚠️ No matching job found after waiting; continuing startup."
                    break
                  fi
                fi

                echo "  └─ still waiting…"
                sleep 5
              done
        - name: wait-for-directus-db
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              apk add --no-cache curl jq postgresql15-client openssh-client netcat-openbsd >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              KV_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus/db"
              TOPLEVEL_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus_db"
              LEAF_DB_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_user"
              LEAF_DB_PASSWROD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_passwrod"
              LEAF_DB_PASSWORD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_password"
              LEAF_DB_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_host"
              LEAF_DB_PORT_URL="${VAULT_ADDR}/v1/secret/data/directus_db_port"
              LEAF_DB_DATABASE_URL="${VAULT_ADDR}/v1/secret/data/directus_db_database"
              LEAF_DB_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_host"
              LEAF_DB_SSH_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_host"
              LEAF_DB_TUNNEL_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_user"
              LEAF_DB_SSH_TUNNEL_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_user"
              LEAF_DB_SSH_PRIVATE_KEY_B64_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_private_key_b64"
              DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW="${DIRECTUS_DB_LEAF_SECRETS_ONLY:-true}"
              case "$(printf '%s' "${DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) DIRECTUS_DB_LEAF_SECRETS_ONLY="true" ;;
                *) DIRECTUS_DB_LEAF_SECRETS_ONLY="false" ;;
              esac

              DIRECTUS_DB_WAIT_TIMEOUT_SECONDS_RAW="${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS:-1800}"
              DIRECTUS_DB_WAIT_TIMEOUT_SECONDS="$(printf '%s' "${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS_RAW}" | tr -dc '0-9')"
              if [ -z "${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS:-}" ] || [ "${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS}" -lt 60 ]; then
                DIRECTUS_DB_WAIT_TIMEOUT_SECONDS=1800
              fi
              DIRECTUS_DB_WAIT_INTERVAL_SECONDS=5

              echo "⏳ Waiting for Directus DB readiness (host, auth, and query checks)..."

              _waited=0
              while [ "${_waited}" -lt "${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS}" ]; do
                DB_HOST_EFFECTIVE="${DB_HOST}"
                DB_PORT_EFFECTIVE="${DB_PORT}"
                DB_DATABASE_EFFECTIVE="${DB_DATABASE}"
                DB_SCHEMA_EFFECTIVE="${DB_SCHEMA:-directus}"
                DB_USER_EFFECTIVE=""
                DB_PASS_EFFECTIVE=""
                DB_HOST_OVERRIDE=""
                DB_PORT_OVERRIDE=""
                DB_DATABASE_OVERRIDE=""
                DB_TUNNEL_ENABLED_RAW="false"
                DB_TUNNEL_HOST=""
                DB_TUNNEL_PORT=""
                DB_TUNNEL_USER=""
                DB_TUNNEL_LOCAL_PORT=""
                DB_TUNNEL_REMOTE_PORT=""
                DB_TUNNEL_PRIVATE_KEY_B64=""
                DB_TUNNEL_ENABLED="false"
                TUNNEL_PID=""
                SSH_ERR_FILE="/tmp/directus-db-ready-ssh.err"
                DB_ERR_FILE="/tmp/directus-db-ready-psql.err"
                : > "${SSH_ERR_FILE}"
                : > "${DB_ERR_FILE}"

                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                  CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${KV_CREDS_URL}" || true)"
                  if [ "${CODE}" = "200" ]; then
