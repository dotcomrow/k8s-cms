                      DB_PASS_EFFECTIVE="$(jq -r '.data.data.directus_db_password // .data.data.password // .data.data.pass // empty' /tmp/db-top-creds.json)"
                      DB_HOST_OVERRIDE="$(jq -r '.data.data.directus_db_host // .data.data.host // empty' /tmp/db-top-creds.json)"
                      DB_PORT_OVERRIDE="$(jq -r '.data.data.directus_db_port // .data.data.port // empty' /tmp/db-top-creds.json)"
                      DB_DATABASE_OVERRIDE="$(jq -r '.data.data.directus_db_database // .data.data.database // .data.data.db // empty' /tmp/db-top-creds.json)"
                      DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.directus_db_ssh_tunnel_enabled // .data.data.ssh_tunnel_enabled // "false"' /tmp/db-top-creds.json)"
                      DB_TUNNEL_HOST="$(jq -r '.data.data.directus_db_ssh_tunnel_host // .data.data.ssh_tunnel_host // .data.data.directus_db_host // .data.data.host // empty' /tmp/db-top-creds.json)"
                      DB_TUNNEL_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_port // .data.data.ssh_tunnel_port // "22"' /tmp/db-top-creds.json)"
                      DB_TUNNEL_USER="$(jq -r '.data.data.directus_db_ssh_tunnel_user // .data.data.ssh_tunnel_user // "directus_tunnel"' /tmp/db-top-creds.json)"
                      DB_TUNNEL_LOCAL_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_local_port // .data.data.ssh_tunnel_local_port // "15432"' /tmp/db-top-creds.json)"
                      DB_TUNNEL_REMOTE_PORT="$(jq -r '.data.data.directus_db_ssh_tunnel_remote_port // .data.data.ssh_tunnel_remote_port // "5432"' /tmp/db-top-creds.json)"
                      DB_TUNNEL_PRIVATE_KEY_B64="$(jq -r '.data.data.directus_db_ssh_private_key_b64 // .data.data.ssh_private_key_b64 // empty' /tmp/db-top-creds.json)"
                    fi
                  fi
                fi

                if [ -z "${DB_USER_EFFECTIVE}" ] || [ -z "${DB_PASS_EFFECTIVE}" ] || [ "${DB_USER_EFFECTIVE}" = "null" ] || [ "${DB_PASS_EFFECTIVE}" = "null" ]; then
                  LEAF_DB_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-user-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_USER_URL}" || true)"
                  LEAF_DB_PASSWROD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-passwrod-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWROD_URL}" || true)"
                  LEAF_DB_PASSWORD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-password-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWORD_URL}" || true)"
                  LEAF_DB_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-host-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_HOST_URL}" || true)"
                  LEAF_DB_PORT_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-port-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PORT_URL}" || true)"
                  LEAF_DB_DATABASE_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-database-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_DATABASE_URL}" || true)"
                  LEAF_DB_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-tunnel-host-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_HOST_URL}" || true)"
                  LEAF_DB_SSH_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-tunnel-host-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_HOST_URL}" || true)"
                  LEAF_DB_TUNNEL_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-tunnel-user-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_USER_URL}" || true)"
                  LEAF_DB_SSH_TUNNEL_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-tunnel-user-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_USER_URL}" || true)"
                  LEAF_DB_SSH_PRIVATE_KEY_B64_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-leaf-ssh-key-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_PRIVATE_KEY_B64_URL}" || true)"
                  LEAF_DB_USER=""
                  LEAF_DB_PASS=""
                  LEAF_DB_HOST=""
                  LEAF_DB_PORT=""
                  LEAF_DB_DATABASE=""
                  LEAF_DB_TUNNEL_HOST=""
                  LEAF_DB_TUNNEL_USER=""
                  LEAF_DB_SSH_PRIVATE_KEY_B64=""
                  if [ "${LEAF_DB_USER_CODE}" = "200" ]; then
                    LEAF_DB_USER="$(jq -r '.data.data.value // .data.data.username // .data.data.user // .data.data.directus_db_user // .data.data.directus_db_username // empty' /tmp/db-leaf-user-creds.json)"
                  fi
                  if [ "${LEAF_DB_PASSWROD_CODE}" = "200" ]; then
                    LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/db-leaf-passwrod-creds.json)"
                  fi
                  if [ -z "${LEAF_DB_PASS}" ] && [ "${LEAF_DB_PASSWORD_CODE}" = "200" ]; then
                    LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/db-leaf-password-creds.json)"
                  fi
                  if [ "${LEAF_DB_HOST_CODE}" = "200" ]; then
                    LEAF_DB_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_host // empty' /tmp/db-leaf-host-creds.json)"
                  fi
                  if [ "${LEAF_DB_PORT_CODE}" = "200" ]; then
                    LEAF_DB_PORT="$(jq -r '.data.data.value // .data.data.port // .data.data.directus_db_port // empty' /tmp/db-leaf-port-creds.json)"
                  fi
                  if [ "${LEAF_DB_DATABASE_CODE}" = "200" ]; then
                    LEAF_DB_DATABASE="$(jq -r '.data.data.value // .data.data.database // .data.data.db // .data.data.directus_db_database // empty' /tmp/db-leaf-database-creds.json)"
                  fi
                  if [ "${LEAF_DB_SSH_TUNNEL_HOST_CODE}" = "200" ]; then
                    LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/db-leaf-ssh-tunnel-host-creds.json)"
                  elif [ "${LEAF_DB_TUNNEL_HOST_CODE}" = "200" ]; then
                    LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/db-leaf-tunnel-host-creds.json)"
                  fi
                  if [ "${LEAF_DB_SSH_TUNNEL_USER_CODE}" = "200" ]; then
                    LEAF_DB_TUNNEL_USER="$(jq -r '.data.data.value // .data.data.user // .data.data.username // .data.data.directus_db_ssh_tunnel_user // .data.data.directus_db_tunnel_user // empty' /tmp/db-leaf-ssh-tunnel-user-creds.json)"
                  elif [ "${LEAF_DB_TUNNEL_USER_CODE}" = "200" ]; then
                    LEAF_DB_TUNNEL_USER="$(jq -r '.data.data.value // .data.data.user // .data.data.username // .data.data.directus_db_ssh_tunnel_user // .data.data.directus_db_tunnel_user // empty' /tmp/db-leaf-tunnel-user-creds.json)"
                  fi
                  if [ "${LEAF_DB_SSH_PRIVATE_KEY_B64_CODE}" = "200" ]; then
                    LEAF_DB_SSH_PRIVATE_KEY_B64="$(jq -r '.data.data.value // .data.data.directus_db_ssh_private_key_b64 // .data.data.ssh_private_key_b64 // empty' /tmp/db-leaf-ssh-key-creds.json)"
                  fi
                  if [ -n "${LEAF_DB_USER}" ] && [ -n "${LEAF_DB_PASS}" ]; then
                    DB_USER_EFFECTIVE="${LEAF_DB_USER}"
                    DB_PASS_EFFECTIVE="${LEAF_DB_PASS}"
                    DB_DATABASE_OVERRIDE="${LEAF_DB_DATABASE}"
                    if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ]; then
                      DB_HOST_OVERRIDE="${LEAF_DB_TUNNEL_HOST}"
                    else
                      DB_HOST_OVERRIDE="${LEAF_DB_HOST}"
                    fi
                    if [ -n "${LEAF_DB_PORT}" ] && [ "${LEAF_DB_PORT}" != "null" ]; then
                      DB_PORT_OVERRIDE="${LEAF_DB_PORT}"
                    elif [ -n "${DB_HOST_OVERRIDE}" ] && [ "${DB_HOST_OVERRIDE}" != "null" ]; then
                      DB_PORT_OVERRIDE="5432"
                    fi
                    if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ] && [ -n "${LEAF_DB_SSH_PRIVATE_KEY_B64}" ] && [ "${LEAF_DB_SSH_PRIVATE_KEY_B64}" != "null" ]; then
                      DB_TUNNEL_ENABLED_RAW="true"
                      DB_TUNNEL_HOST="${LEAF_DB_TUNNEL_HOST}"
                      DB_TUNNEL_PORT="22"
                      if [ -n "${LEAF_DB_TUNNEL_USER}" ] && [ "${LEAF_DB_TUNNEL_USER}" != "null" ]; then
                        DB_TUNNEL_USER="${LEAF_DB_TUNNEL_USER}"
                      else
                        DB_TUNNEL_USER="directus_tunnel"
                      fi
                      DB_TUNNEL_LOCAL_PORT="15432"
                      DB_TUNNEL_REMOTE_PORT="${DB_PORT_OVERRIDE:-5432}"
                      DB_TUNNEL_PRIVATE_KEY_B64="${LEAF_DB_SSH_PRIVATE_KEY_B64}"
                    else
                      DB_TUNNEL_ENABLED_RAW="false"
                    fi
                  fi
                fi

                if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" = "true" ] && { [ -z "${DB_HOST_OVERRIDE}" ] || [ "${DB_HOST_OVERRIDE}" = "null" ]; }; then
                  echo "❌ DIRECTUS_DB_LEAF_SECRETS_ONLY=true but secret/data/directus_db_tunnel_host or secret/data/directus_db_ssh_tunnel_host (or directus_db_host) is missing."
                  exit 1
                fi

                if [ -n "${DB_HOST_OVERRIDE}" ] && [ "${DB_HOST_OVERRIDE}" != "null" ]; then DB_HOST_EFFECTIVE="${DB_HOST_OVERRIDE}"; fi
                if [ -n "${DB_PORT_OVERRIDE}" ] && [ "${DB_PORT_OVERRIDE}" != "null" ]; then DB_PORT_EFFECTIVE="${DB_PORT_OVERRIDE}"; fi
                if [ -n "${DB_DATABASE_OVERRIDE}" ] && [ "${DB_DATABASE_OVERRIDE}" != "null" ]; then DB_DATABASE_EFFECTIVE="${DB_DATABASE_OVERRIDE}"; fi
                if [ -z "${DB_SCHEMA_EFFECTIVE}" ] || [ "${DB_SCHEMA_EFFECTIVE}" = "null" ]; then DB_SCHEMA_EFFECTIVE="directus"; fi
                DB_SCHEMA_SQL="$(printf '%s' "${DB_SCHEMA_EFFECTIVE}" | sed "s/'/''/g")"

                case "$(printf '%s' "${DB_TUNNEL_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
                  1|true|yes|on) DB_TUNNEL_ENABLED="true" ;;
                  *) DB_TUNNEL_ENABLED="false" ;;
                esac

                if [ "${DB_TUNNEL_ENABLED}" = "true" ]; then
                  if [ -z "${DB_TUNNEL_HOST}" ] || [ -z "${DB_TUNNEL_PORT}" ] || [ -z "${DB_TUNNEL_USER}" ] || [ -z "${DB_TUNNEL_LOCAL_PORT}" ] || [ -z "${DB_TUNNEL_REMOTE_PORT}" ] || [ -z "${DB_TUNNEL_PRIVATE_KEY_B64}" ]; then
                    echo "❌ Tunnel mode enabled but one or more tunnel settings are missing."
                    exit 1
                  fi
                  echo "ℹ️ DB tunnel mode enabled; performing init-time SSH tunnel and DB auth check."
                fi

                if [ "${DB_TUNNEL_ENABLED}" = "true" ]; then
                  if [ -n "${DB_TUNNEL_PRIVATE_KEY_B64}" ] && [ -n "${DB_TUNNEL_HOST}" ] && [ -n "${DB_TUNNEL_USER}" ] && [ -n "${DB_TUNNEL_PORT}" ] && [ -n "${DB_TUNNEL_LOCAL_PORT}" ] && [ -n "${DB_TUNNEL_REMOTE_PORT}" ]; then
                    KEY_FILE="/tmp/directus-db-tunnel.key"
                    if printf '%s' "${DB_TUNNEL_PRIVATE_KEY_B64}" | base64 --decode > "${KEY_FILE}" 2>/dev/null; then
                      true
                    elif printf '%s' "${DB_TUNNEL_PRIVATE_KEY_B64}" | base64 -d > "${KEY_FILE}" 2>/dev/null; then
                      true
                    else
                      printf '%s' "${DB_TUNNEL_PRIVATE_KEY_B64}" | base64 -D > "${KEY_FILE}"
                    fi
                    chmod 600 "${KEY_FILE}"
                    KNOWN_HOSTS_FILE="/tmp/directus-db-tunnel-known_hosts"
                    touch "${KNOWN_HOSTS_FILE}"
                    KEY_FINGERPRINT="$(ssh-keygen -lf "${KEY_FILE}" 2>/dev/null | awk '{print $2}' || true)"
                    if [ -n "${KEY_FINGERPRINT}" ]; then
                      echo "  .. tunnel key fingerprint: ${KEY_FINGERPRINT}"
                    fi
                    TUNNEL_READY="false"
                    LAST_TUNNEL_ERR=""
                    DB_TUNNEL_USER_CANDIDATES="${DB_TUNNEL_USER},ubuntu,opc"
                    _OLD_IFS="${IFS}"
                    IFS=','
                    for _db_tunnel_user_try in ${DB_TUNNEL_USER_CANDIDATES}; do
                      DB_TUNNEL_USER_TRY="$(printf '%s' "${_db_tunnel_user_try}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                      [ -z "${DB_TUNNEL_USER_TRY}" ] && continue
                      : > "${SSH_ERR_FILE}"

                      ssh \
                        -N \
                        -i "${KEY_FILE}" \
                        -o ExitOnForwardFailure=yes \
                        -o IdentitiesOnly=yes \
                        -o BatchMode=yes \
                        -o ConnectTimeout=10 \
                        -o ConnectionAttempts=1 \
                        -o StrictHostKeyChecking=accept-new \
                        -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
                        -o ServerAliveInterval=30 \
                        -o ServerAliveCountMax=3 \
                        -p "${DB_TUNNEL_PORT}" \
                        -L "127.0.0.1:${DB_TUNNEL_LOCAL_PORT}:127.0.0.1:${DB_TUNNEL_REMOTE_PORT}" \
                        "${DB_TUNNEL_USER_TRY}@${DB_TUNNEL_HOST}" >/tmp/directus-db-ready-tunnel.log 2>"${SSH_ERR_FILE}" &
                      TUNNEL_PID="$!"

                      _tunnel_waited=0
                      while [ "${_tunnel_waited}" -lt 20 ]; do
                        if ! kill -0 "${TUNNEL_PID}" >/dev/null 2>&1; then
                          ERR_MSG="$(tail -n1 "${SSH_ERR_FILE}" 2>/dev/null || true)"
                          if [ -n "${ERR_MSG}" ]; then
                            LAST_TUNNEL_ERR="${DB_TUNNEL_USER_TRY}: ${ERR_MSG}"
                          else
                            LAST_TUNNEL_ERR="${DB_TUNNEL_USER_TRY}: ssh tunnel failed before ready"
                          fi
                          break
                        fi
                        if nc -z -w 1 127.0.0.1 "${DB_TUNNEL_LOCAL_PORT}" >/dev/null 2>&1; then
                          TUNNEL_READY="true"
                          DB_TUNNEL_USER="${DB_TUNNEL_USER_TRY}"
                          break
                        fi
                        sleep 1
                        _tunnel_waited=$((_tunnel_waited + 1))
                      done

                      if [ "${TUNNEL_READY}" = "true" ]; then
                        echo "  .. tunnel auth succeeded with user ${DB_TUNNEL_USER}"
                        break
                      fi

                      if [ -n "${TUNNEL_PID}" ]; then
                        kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
                        wait "${TUNNEL_PID}" 2>/dev/null || true
                      fi
                      TUNNEL_PID=""
                    done
                    IFS="${_OLD_IFS}"

                    if [ "${TUNNEL_READY}" != "true" ]; then
                      if [ -n "${LAST_TUNNEL_ERR}" ]; then
                        echo "  .. waiting for DB/auth (${_waited}s elapsed): ssh tunnel not ready: ${LAST_TUNNEL_ERR}"
                      else
                        echo "  .. waiting for DB/auth (${_waited}s elapsed): ssh tunnel not ready after trying users ${DB_TUNNEL_USER_CANDIDATES}"
                      fi
                      if [ -n "${TUNNEL_PID}" ]; then
                        kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
                        wait "${TUNNEL_PID}" 2>/dev/null || true
                      fi
                      sleep "${DIRECTUS_DB_WAIT_INTERVAL_SECONDS}"
                      _waited=$((_waited + DIRECTUS_DB_WAIT_INTERVAL_SECONDS))
                      continue
                    fi
                    DB_HOST_EFFECTIVE="127.0.0.1"
                    DB_PORT_EFFECTIVE="${DB_TUNNEL_LOCAL_PORT}"
                  fi
                fi

                if [ -n "${DB_USER_EFFECTIVE}" ] && [ -n "${DB_PASS_EFFECTIVE}" ] && [ "${DB_USER_EFFECTIVE}" != "null" ] && [ "${DB_PASS_EFFECTIVE}" != "null" ]; then
                  CHECK_OUTPUT="$(PGPASSWORD="${DB_PASS_EFFECTIVE}" PGCONNECT_TIMEOUT=5 psql -h "${DB_HOST_EFFECTIVE}" -p "${DB_PORT_EFFECTIVE}" -U "${DB_USER_EFFECTIVE}" -d "${DB_DATABASE_EFFECTIVE}" -Atc "SELECT current_user || '|' || current_database();" 2>"${DB_ERR_FILE}" || true)"
                  AUTH_USER="$(printf '%s' "${CHECK_OUTPUT}" | cut -d'|' -f1 | tr -d '\r')"
                  AUTH_DB="$(printf '%s' "${CHECK_OUTPUT}" | cut -d'|' -f2 | tr -d '\r')"

                  if [ "${AUTH_USER}" = "${DB_USER_EFFECTIVE}" ] && [ "${AUTH_DB}" = "${DB_DATABASE_EFFECTIVE}" ]; then
                    SCHEMA_READY="true"
                    if [ -n "${DB_SCHEMA_EFFECTIVE}" ] && [ "${DB_SCHEMA_EFFECTIVE}" != "public" ]; then
                      SCHEMA_CHECK_OUTPUT="$(PGPASSWORD="${DB_PASS_EFFECTIVE}" PGCONNECT_TIMEOUT=5 psql -h "${DB_HOST_EFFECTIVE}" -p "${DB_PORT_EFFECTIVE}" -U "${DB_USER_EFFECTIVE}" -d "${DB_DATABASE_EFFECTIVE}" -Atc "SELECT 1 FROM information_schema.schemata WHERE schema_name = '${DB_SCHEMA_SQL}' LIMIT 1;" 2>>"${DB_ERR_FILE}" || true)"
                      if [ "${SCHEMA_CHECK_OUTPUT}" != "1" ]; then
                        SCHEMA_READY="false"
                        printf 'schema "%s" does not exist\n' "${DB_SCHEMA_EFFECTIVE}" > "${DB_ERR_FILE}"
                      fi
                    fi

                    if [ "${SCHEMA_READY}" = "true" ]; then
                      echo "✅ Directus DB is ready (host=${DB_HOST_EFFECTIVE} port=${DB_PORT_EFFECTIVE} db=${AUTH_DB} schema=${DB_SCHEMA_EFFECTIVE} user=${AUTH_USER})"
                      if [ -n "${TUNNEL_PID}" ]; then
                        kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
                        wait "${TUNNEL_PID}" 2>/dev/null || true
                      fi
                      exit 0
                    fi
                  fi
                fi

                # If SSH succeeds but DB auth fails, reconcile role password on
                # the VM to the Vault-provided value, then retry the DB check.
                if [ "${DB_TUNNEL_ENABLED}" = "true" ] && grep -Eqi "password authentication failed|database .* does not exist|schema .* does not exist" "${DB_ERR_FILE}" 2>/dev/null; then
                  DB_USER_B64="$(printf '%s' "${DB_USER_EFFECTIVE}" | base64 | tr -d '\n')"
                  DB_PASS_B64="$(printf '%s' "${DB_PASS_EFFECTIVE}" | base64 | tr -d '\n')"
                  DB_NAME_B64="$(printf '%s' "${DB_DATABASE_EFFECTIVE}" | base64 | tr -d '\n')"
                  DB_SCHEMA_B64="$(printf '%s' "${DB_SCHEMA_EFFECTIVE}" | base64 | tr -d '\n')"
                  REMOTE_RECONCILE_CMD="set -eu; DB_USER=\$(printf '%s' '${DB_USER_B64}' | base64 -d); DB_PASS=\$(printf '%s' '${DB_PASS_B64}' | base64 -d); DB_NAME=\$(printf '%s' '${DB_NAME_B64}' | base64 -d); DB_SCHEMA=\$(printf '%s' '${DB_SCHEMA_B64}' | base64 -d); if ! command -v sudo >/dev/null 2>&1; then exit 1; fi; DB_USER_SQL=\$(printf '%s' \"\${DB_USER}\" | sed \"s/'/''/g\"); DB_PASS_SQL=\$(printf '%s' \"\${DB_PASS}\" | sed \"s/'/''/g\"); DB_NAME_SQL=\$(printf '%s' \"\${DB_NAME}\" | sed \"s/'/''/g\"); DB_SCHEMA_SQL=\$(printf '%s' \"\${DB_SCHEMA}\" | sed \"s/'/''/g\"); sudo -n -u postgres psql -v ON_ERROR_STOP=1 -c \"DO \\\$do\\\$ DECLARE v_db_user text := '\${DB_USER_SQL}'; v_db_password text := '\${DB_PASS_SQL}'; BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_db_user) THEN EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', v_db_user, v_db_password); ELSE EXECUTE format('ALTER ROLE %I WITH LOGIN PASSWORD %L', v_db_user, v_db_password); END IF; END \\\$do\\\$;\"; DB_EXISTS=\$(sudo -n -u postgres psql -Atqc \"SELECT 1 FROM pg_database WHERE datname = '\${DB_NAME_SQL}' LIMIT 1;\"); if [ \"\${DB_EXISTS}\" != \"1\" ]; then CREATE_DB_SQL=\$(sudo -n -u postgres psql -Atqc \"SELECT format('CREATE DATABASE %I OWNER %I', '\${DB_NAME_SQL}', '\${DB_USER_SQL}');\"); sudo -n -u postgres psql -v ON_ERROR_STOP=1 -c \"\${CREATE_DB_SQL}\"; fi; GRANT_SQL=\$(sudo -n -u postgres psql -Atqc \"SELECT format('GRANT CONNECT ON DATABASE %I TO %I', '\${DB_NAME_SQL}', '\${DB_USER_SQL}');\"); sudo -n -u postgres psql -v ON_ERROR_STOP=1 -c \"\${GRANT_SQL}\"; SCHEMA_EXISTS=\$(sudo -n -u postgres psql -d \"\${DB_NAME}\" -Atqc \"SELECT 1 FROM information_schema.schemata WHERE schema_name = '\${DB_SCHEMA_SQL}' LIMIT 1;\"); if [ \"\${SCHEMA_EXISTS}\" != \"1\" ]; then CREATE_SCHEMA_SQL=\$(sudo -n -u postgres psql -d \"\${DB_NAME}\" -Atqc \"SELECT format('CREATE SCHEMA %I AUTHORIZATION %I', '\${DB_SCHEMA_SQL}', '\${DB_USER_SQL}');\"); sudo -n -u postgres psql -d \"\${DB_NAME}\" -v ON_ERROR_STOP=1 -c \"\${CREATE_SCHEMA_SQL}\"; fi; GRANT_SCHEMA_SQL=\$(sudo -n -u postgres psql -d \"\${DB_NAME}\" -Atqc \"SELECT format('GRANT USAGE, CREATE ON SCHEMA %I TO %I', '\${DB_SCHEMA_SQL}', '\${DB_USER_SQL}');\"); sudo -n -u postgres psql -d \"\${DB_NAME}\" -v ON_ERROR_STOP=1 -c \"\${GRANT_SCHEMA_SQL}\""
                  RECONCILE_OK="false"
                  LAST_RECONCILE_ERR=""
                  RECONCILE_USER_CANDIDATES="${DB_TUNNEL_USER}"
                  if [ "${DB_TUNNEL_USER}" != "ubuntu" ]; then
                    RECONCILE_USER_CANDIDATES="${RECONCILE_USER_CANDIDATES},ubuntu"
                  fi
                  if [ "${DB_TUNNEL_USER}" = "opc" ]; then
                    RECONCILE_USER_CANDIDATES="${RECONCILE_USER_CANDIDATES},opc"
                  fi
                  _OLD_IFS="${IFS}"
                  IFS=','
                  for _reconcile_user_try in ${RECONCILE_USER_CANDIDATES}; do
                    RECONCILE_USER="$(printf '%s' "${_reconcile_user_try}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                    [ -z "${RECONCILE_USER}" ] && continue

                    # Guard: only attempt reconcile with users that can run postgres sudo non-interactively.
                    if ! ssh \
                      -i "${KEY_FILE}" \
                      -o IdentitiesOnly=yes \
                      -o BatchMode=yes \
                      -o ConnectTimeout=10 \
                      -o ConnectionAttempts=1 \
                      -o StrictHostKeyChecking=accept-new \
                      -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
                      -p "${DB_TUNNEL_PORT}" \
                      "${RECONCILE_USER}@${DB_TUNNEL_HOST}" \
                      "sudo -n -u postgres true" >/tmp/directus-db-pass-reconcile.out 2>&1; then
                      LAST_RECONCILE_ERR="$(tail -n1 /tmp/directus-db-pass-reconcile.out 2>/dev/null || true)"
                      [ -z "${LAST_RECONCILE_ERR}" ] && LAST_RECONCILE_ERR="${RECONCILE_USER}: cannot sudo -n -u postgres"
                      continue
                    fi

                    if ssh \
                      -i "${KEY_FILE}" \
                      -o IdentitiesOnly=yes \
                      -o BatchMode=yes \
                      -o ConnectTimeout=10 \
                      -o ConnectionAttempts=1 \
                      -o StrictHostKeyChecking=accept-new \
                      -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
                      -p "${DB_TUNNEL_PORT}" \
                      "${RECONCILE_USER}@${DB_TUNNEL_HOST}" \
                      "${REMOTE_RECONCILE_CMD}" >/tmp/directus-db-pass-reconcile.out 2>&1; then
                      RECONCILE_OK="true"
                      DB_TUNNEL_USER="${RECONCILE_USER}"
                      break
                    fi
                    LAST_RECONCILE_ERR="$(tail -n1 /tmp/directus-db-pass-reconcile.out 2>/dev/null || true)"
                    [ -z "${LAST_RECONCILE_ERR}" ] && LAST_RECONCILE_ERR="${RECONCILE_USER}: password reconcile command failed"
                  done
                  IFS="${_OLD_IFS}"

                  if [ "${RECONCILE_OK}" = "true" ]; then
                    echo "  .. reconciled DB role password using SSH user ${DB_TUNNEL_USER}; retrying DB auth check."
                    if [ -n "${TUNNEL_PID}" ]; then
                      kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
                      wait "${TUNNEL_PID}" 2>/dev/null || true
                    fi
                    sleep 1
                    continue
                  fi

                  if [ -n "${LAST_RECONCILE_ERR}" ]; then
                    echo "  .. password reconcile attempt failed: ${LAST_RECONCILE_ERR}"
                  else
                    echo "  .. password reconcile attempt failed with no detailed error."
                  fi
                fi

                if [ -n "${TUNNEL_PID}" ]; then
                  kill "${TUNNEL_PID}" >/dev/null 2>&1 || true
                  wait "${TUNNEL_PID}" 2>/dev/null || true
                fi

                ERR_MSG="$(tail -n1 "${DB_ERR_FILE}" 2>/dev/null || true)"
                if [ -z "${ERR_MSG}" ]; then
                  ERR_MSG="$(tail -n1 "${SSH_ERR_FILE}" 2>/dev/null || true)"
                fi
                if [ -n "${ERR_MSG}" ]; then
                  echo "  .. waiting for DB/auth (${_waited}s elapsed): ${ERR_MSG}"
                else
                  echo "  .. waiting for DB/auth (${_waited}s elapsed)"
                fi

                sleep "${DIRECTUS_DB_WAIT_INTERVAL_SECONDS}"
                _waited=$((_waited + DIRECTUS_DB_WAIT_INTERVAL_SECONDS))
              done

              echo "❌ Timed out after ${DIRECTUS_DB_WAIT_TIMEOUT_SECONDS}s waiting for Directus DB readiness."
              exit 1
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
            - name: DB_SCHEMA
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_SCHEMA } }
            - name: DIRECTUS_DB_LEAF_SECRETS_ONLY
              value: "true"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              REDIS_MASTER_SET="${REDIS_NAME:-mymaster}"
              REDIS_SENTINEL_HOST="${REDIS_SENTINEL_HOST:-redis-sentinel.redis.svc.cluster.local}"
              REDIS_SENTINEL_PORT="${REDIS_SENTINEL_PORT:-26379}"

              echo "⏳ Waiting for Redis master (${REDIS_MASTER_SET}) via Sentinel..."
              _master_host=""
              _master_port=""
              while [ -z "${_master_host}" ] || [ -z "${_master_port}" ]; do
                _master_reply="$(redis-cli -h "${REDIS_SENTINEL_HOST}" -p "${REDIS_SENTINEL_PORT}" --raw SENTINEL get-master-addr-by-name "${REDIS_MASTER_SET}" 2>/dev/null || true)"
                if [ -n "${_master_reply}" ]; then
                  _master_host="$(printf '%s\n' "${_master_reply}" | sed -n '1p')"
                  _master_port="$(printf '%s\n' "${_master_reply}" | sed -n '2p')"
                fi
                if [ -z "${_master_host}" ] || [ -z "${_master_port}" ]; then
                  echo "Redis master not yet published by Sentinel, waiting..."
                  sleep 5
                fi
              done

              while true; do
                _master_ping="$(redis-cli -h "${_master_host}" -p "${_master_port}" ping 2>&1 || true)"
                case "${_master_ping}" in
                  *PONG*|*NOAUTH*)
                    echo "✅ Redis master ${_master_host}:${_master_port} is reachable (${_master_ping})"
                    break
                    ;;
                  *)
                    echo "Redis master ${_master_host}:${_master_port} not ready yet (${_master_ping}), waiting..."
                    sleep 5
                    ;;
                esac
              done
          env:
            - name: REDIS_NAME
              valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_NAME } }
            - name: REDIS_SENTINEL_HOST
              value: "redis-sentinel.redis.svc.cluster.local"
            - name: REDIS_SENTINEL_PORT
              value: "26379"
      containers:
      - name: directus-postschema
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/directus-postschema.sh"]
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - test -f /postschema-state/db-ready
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        env:
          - name: DB_HOST
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
          - name: DB_PORT
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
          - name: DB_DATABASE
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
          - name: DIRECTUS_MODULE_REGISTRY_URL
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_URL } }
          - name: DIRECTUS_MODULE_REGISTRY_PATH
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_PATH } }
          - name: DIRECTUS_MODULE_REGISTRY_CACHE_TTL_MS
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_CACHE_TTL_MS } }
          - name: DIRECTUS_POSTSCHEMA_STATE_DIR
            value: "/postschema-state"
          - name: DIRECTUS_FLOW_API_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/flows/admin"
          - name: OPENAPI_SYNC_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/openapi/admin"
          - name: DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED
            value: "no"
          - name: DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED
            value: "no"
          - name: DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED
            value: "no"
          - name: DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED
            value: "no"
          - name: DIRECTUS_POSTSCHEMA_RECONCILE_VERSION
            value: "2026-04-29.1"
          - name: DIRECTUS_POSTSCHEMA_FORCE_RECONCILE
            value: "false"
          - name: DIRECTUS_DB_LEAF_SECRETS_ONLY
            value: "true"
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-token
            readOnly: true
          - name: directus-settings
            mountPath: /directus-settings
            readOnly: true
          - name: directus-sites
            mountPath: /directus-sites
            readOnly: true
          - name: directus-layout-templates
            mountPath: /directus-layout-templates
            readOnly: true
          - name: directus-theme-packages
            mountPath: /directus-theme-packages
            readOnly: true
          - name: directus-modules
            mountPath: /directus-modules
            readOnly: true
          - name: directus-postschema-script
            mountPath: /scripts
            readOnly: true
          - name: directus-postschema-data-mutations
            mountPath: /scripts-data-mutations
            readOnly: true
          - name: directus-postschema-state
            mountPath: /postschema-state
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
        volumeMounts:
        - name: vault-agent-config
          mountPath: /vault-config
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: vault-templates
          mountPath: /vault-templates
      - name: directus-db-tunnel
        image: alpine:3.20
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -eu
            apk add --no-cache openssh-client >/dev/null

            while [ ! -f /vault-secrets/db-creds.env ]; do
              echo "⏳ Waiting for /vault-secrets/db-creds.env..."
              sleep 2
            done

            # shellcheck disable=SC1091
            . /vault-secrets/db-creds.env

            DB_TUNNEL_ENABLED_RAW="${DB_TUNNEL_ENABLED:-false}"
            case "$(printf '%s' "${DB_TUNNEL_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) DB_TUNNEL_ENABLED="true" ;;
              *) DB_TUNNEL_ENABLED="false" ;;
            esac

            if [ "${DB_TUNNEL_ENABLED}" != "true" ]; then
              echo "ℹ️ DB tunnel disabled by Vault DB secret; idling."
              tail -f /dev/null
            fi

            DB_TUNNEL_HOST="${DB_TUNNEL_HOST:-}"
            DB_TUNNEL_PORT="${DB_TUNNEL_PORT:-22}"
            DB_TUNNEL_USER="${DB_TUNNEL_USER:-directus_tunnel}"
            DB_TUNNEL_USER_CANDIDATES="${DB_TUNNEL_USER_CANDIDATES:-${DB_TUNNEL_USER},ubuntu,opc}"
            DB_TUNNEL_LOCAL_PORT="${DB_TUNNEL_LOCAL_PORT:-15432}"
            DB_TUNNEL_REMOTE_PORT="${DB_TUNNEL_REMOTE_PORT:-5432}"
            DB_TUNNEL_SSH_PRIVATE_KEY_B64="${DB_TUNNEL_SSH_PRIVATE_KEY_B64:-}"

            if [ -z "${DB_TUNNEL_HOST}" ] || [ -z "${DB_TUNNEL_SSH_PRIVATE_KEY_B64}" ]; then
              echo "❌ DB tunnel enabled but DB_TUNNEL_HOST or DB_TUNNEL_SSH_PRIVATE_KEY_B64 is missing."
              exit 1
            fi

            mkdir -p /tmp/directus-db-tunnel
            KEY_FILE="/tmp/directus-db-tunnel/id_ed25519"
            KNOWN_HOSTS_FILE="/tmp/directus-db-tunnel/known_hosts"
            if printf '%s' "${DB_TUNNEL_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${KEY_FILE}" 2>/dev/null; then
              true
            elif printf '%s' "${DB_TUNNEL_SSH_PRIVATE_KEY_B64}" | base64 -d > "${KEY_FILE}" 2>/dev/null; then
              true
            else
              printf '%s' "${DB_TUNNEL_SSH_PRIVATE_KEY_B64}" | base64 -D > "${KEY_FILE}"
            fi
            chmod 600 "${KEY_FILE}"
            touch "${KNOWN_HOSTS_FILE}"
            KEY_FINGERPRINT="$(ssh-keygen -lf "${KEY_FILE}" 2>/dev/null | awk '{print $2}' || true)"
            if [ -n "${KEY_FINGERPRINT}" ]; then
              echo "🔑 DB tunnel key fingerprint: ${KEY_FINGERPRINT}"
            fi

            while true; do
              _attempted_any="false"
              _old_ifs="${IFS}"
              IFS=','
              for _candidate in ${DB_TUNNEL_USER_CANDIDATES}; do
                DB_TUNNEL_USER_TRY="$(printf '%s' "${_candidate}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                [ -z "${DB_TUNNEL_USER_TRY}" ] && continue
                _attempted_any="true"
                echo "🔒 Starting DB SSH tunnel ${DB_TUNNEL_USER_TRY}@${DB_TUNNEL_HOST}:${DB_TUNNEL_PORT} -> 127.0.0.1:${DB_TUNNEL_REMOTE_PORT} (local ${DB_TUNNEL_LOCAL_PORT})"
                ssh \
                  -N \
                  -i "${KEY_FILE}" \
                  -o ExitOnForwardFailure=yes \
                  -o IdentitiesOnly=yes \
                  -o BatchMode=yes \
                  -o ConnectTimeout=10 \
                  -o ConnectionAttempts=1 \
                  -o StrictHostKeyChecking=accept-new \
                  -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" \
                  -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=3 \
                  -p "${DB_TUNNEL_PORT}" \
                  -L "127.0.0.1:${DB_TUNNEL_LOCAL_PORT}:127.0.0.1:${DB_TUNNEL_REMOTE_PORT}" \
                  "${DB_TUNNEL_USER_TRY}@${DB_TUNNEL_HOST}" || true
                echo "⚠️ DB SSH tunnel disconnected/failed for user ${DB_TUNNEL_USER_TRY}; trying next candidate..."
                sleep 1
              done
              IFS="${_old_ifs}"
              if [ "${_attempted_any}" != "true" ]; then
                echo "❌ No DB tunnel users configured in DB_TUNNEL_USER_CANDIDATES."
              fi
              echo "⚠️ DB SSH tunnel attempts exhausted; retrying in 3s..."
              sleep 3
            done
        volumeMounts:
          - name: vault-secrets
            mountPath: /vault-secrets
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
      - name: directus
        image: directus/directus:11
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "⏳ Waiting for postschema DB reconcile marker..."
            _db_ready_wait_attempt=0
            _db_ready_wait_max=450
            while [ ! -f /postschema-state/db-ready ]; do
              if [ -f /postschema-state/failed ]; then
                echo "❌ postschema reported failure before DB reconcile marker; aborting Directus start."
                exit 1
              fi
              _db_ready_wait_attempt=$((_db_ready_wait_attempt + 1))
              if [ "${_db_ready_wait_attempt}" -ge "${_db_ready_wait_max}" ]; then
                echo "❌ Timed out waiting for /postschema-state/db-ready; aborting Directus start."
                exit 1
              fi
              sleep 2
            done
            echo "✅ postschema DB reconcile marker detected"

            echo "⏳ Waiting for Vault agent to generate all credential files..."
            while [ ! -f /vault-secrets/db-creds.env ] || \
                  [ ! -f /vault-secrets/app-keys.env ] || \
                  [ ! -f /vault-secrets/redis-creds.env ]; do
              echo "Waiting for credential files..."
              sleep 2
            done

            echo "✅ All credential files retrieved from Vault"
            echo "🔑 Loading credentials..."
            . /vault-secrets/db-creds.env
            . /vault-secrets/app-keys.env
            if [ -f /vault-secrets/openai.env ]; then
              . /vault-secrets/openai.env
            else
              echo "⚠️ /vault-secrets/openai.env not found; continuing without OPENAI_API_KEY"
            fi
            . /vault-secrets/redis-creds.env

            # Generate random admin credentials for initial setup (not used for actual login)
            RANDOM_ADMIN_EMAIL="admin-$(tr -dc 'a-z0-9' < /dev/urandom | head -c 8)@example.com"
            RANDOM_ADMIN_PASSWORD="$(tr -dc 'A-Za-z0-9@#%^*+=_-' < /dev/urandom | head -c 32)"
            
            # Export required envs for Directus
            export DB_USER DB_PASSWORD KEY SECRET REDIS_PASSWORD OPENAI_API_KEY
            export ADMIN_EMAIL="$RANDOM_ADMIN_EMAIL" ADMIN_PASSWORD="$RANDOM_ADMIN_PASSWORD"

            # Work from the app dir so the CLI behaves consistently
            cd /directus

            # Ensure Directus uses the intended schema/search_path for all CLI calls
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            _directus_wait_for_db_connectivity() {
              _attempt=0
              _max_attempts_raw="${DIRECTUS_DB_CONNECT_MAX_ATTEMPTS:-60}"
              _retry_seconds_raw="${DIRECTUS_DB_CONNECT_RETRY_SECONDS:-2}"
              _max_attempts="$(printf '%s' "${_max_attempts_raw}" | tr -dc '0-9')"
              _retry_seconds="$(printf '%s' "${_retry_seconds_raw}" | tr -dc '0-9')"
              if [ -z "${_max_attempts}" ] || [ "${_max_attempts}" -lt 1 ]; then
                _max_attempts=60
              fi
              if [ -z "${_retry_seconds}" ] || [ "${_retry_seconds}" -lt 1 ]; then
                _retry_seconds=2
              fi

              if command -v psql >/dev/null 2>&1; then
                _DB_CONNECT_CHECK_MODE="psql"
              elif command -v nc >/dev/null 2>&1; then
                _DB_CONNECT_CHECK_MODE="nc"
              elif command -v node >/dev/null 2>&1; then
                _DB_CONNECT_CHECK_MODE="node"
              else
                echo "⚠️ No DB connectivity check tool available; skipping TCP check and allowing Directus startup."
                _DB_CONNECT_CHECK_MODE="skip"
              fi

              while true; do
                if [ "${_DB_CONNECT_CHECK_MODE}" = "psql" ]; then
                  if PGPASSWORD="${DB_PASSWORD}" PGCONNECT_TIMEOUT=2 psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_DATABASE}" -Atc "SELECT 1" >/dev/null 2>&1; then
                    echo "✅ Directus can reach the DB through the tunnel."
                    return 0
                  fi
                elif [ "${_DB_CONNECT_CHECK_MODE}" = "nc" ]; then
                  if nc -z -w2 "${DB_HOST}" "${DB_PORT}"; then
                    echo "✅ Directus can reach the DB through the tunnel (tcp check)."
                    return 0
                  fi
                elif [ "${_DB_CONNECT_CHECK_MODE}" = "node" ]; then
                  if node -e 'const net = require("net"); const host = process.env.DB_HOST; const port = Number(process.env.DB_PORT || 5432); const socket = net.createConnection({ host, port, timeout: 2000 }, () => { socket.end(); process.exit(0); }); socket.on("error", () => process.exit(1)); socket.on("timeout", () => { socket.destroy(); process.exit(1); });'; then
                    echo "✅ Directus can reach the DB through the tunnel."
                    return 0
                  fi
                elif [ "${_DB_CONNECT_CHECK_MODE}" = "skip" ]; then
                  echo "⚠️ DB connectivity check skipped; attempting Directus startup."
                  return 0
                fi

                _attempt=$((_attempt + 1))
                if [ "${_attempt}" -ge "${_max_attempts}" ]; then
                  echo "❌ Timed out after ${_max_attempts} attempts waiting for direct DB connectivity."
                  return 1
                fi
                echo "⚠️ Directus DB connectivity check failed; retrying in ${_retry_seconds}s (${_attempt}/${_max_attempts})."
                sleep "${_retry_seconds}"
              done
            }

            _reset_partial_directus_install_if_needed() {
              RESET_PARTIAL_INSTALL_RAW="${DIRECTUS_RESET_PARTIAL_INSTALL:-true}"
              case "$(printf '%s' "${RESET_PARTIAL_INSTALL_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) RESET_PARTIAL_INSTALL="true" ;;
                *) RESET_PARTIAL_INSTALL="false" ;;
              esac

              if [ "${RESET_PARTIAL_INSTALL}" != "true" ]; then
                echo "ℹ️ Skipping partial Directus install reset check (DIRECTUS_RESET_PARTIAL_INSTALL=false)."
                return 0
              fi

              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");

            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));

            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }

            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
