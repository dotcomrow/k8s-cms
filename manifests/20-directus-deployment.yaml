        - name: AUTH_GITHUB_SYNC_USER_INFO
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_SYNC_USER_INFO } }
        - name: AUTH_GITHUB_FIRST_NAME_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_FIRST_NAME_KEY } }

        startupProbe:
          httpGet: { path: /server/health, port: 8055 }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
