          value: "/directus/extensions"

        # Other configuration
        - name: LOG_LEVEL
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_LEVEL } }
        - name: LOG_STYLE
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_STYLE } }
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: PUBLIC_URL } }
        - name: CORS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ENABLED } }
        - name: CORS_ORIGIN
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ORIGIN } }
        - name: ASSETS_CACHE_TTL
          valueFrom: { configMapKeyRef: { name: directus-config, key: ASSETS_CACHE_TTL } }
        - name: DIRECTUS_KC_BASE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_BASE_URL } }
        - name: DIRECTUS_KC_INTERNAL_REALM
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_INTERNAL_REALM } }
        - name: DIRECTUS_KC_EXTERNAL_REALM
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_EXTERNAL_REALM } }
        - name: DIRECTUS_KC_INTERNAL_CLIENT_ID
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_INTERNAL_CLIENT_ID } }
        - name: DIRECTUS_KC_INTERNAL_CLIENT_SECRET
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_INTERNAL_CLIENT_SECRET } }
        - name: DIRECTUS_KC_EXTERNAL_CLIENT_ID
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_EXTERNAL_CLIENT_ID } }
        - name: DIRECTUS_KC_EXTERNAL_CLIENT_SECRET
          valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_KC_EXTERNAL_CLIENT_SECRET } }

        # WebSockets configuration
        - name: WEBSOCKETS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_ENABLED } }
        - name: WEBSOCKETS_COLLAB_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_COLLAB_ENABLED } }

        # GitHub OAuth provider config
        - name: AUTH_GITHUB_DRIVER
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_DRIVER } }
        - name: AUTH_GITHUB_AUTHORIZE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_AUTHORIZE_URL } }
