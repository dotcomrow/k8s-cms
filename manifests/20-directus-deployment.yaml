# Directus Deployment with Vault integration & dynamic role mapping
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: directus
  labels:
    app: directus
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # start with one replica to avoid concurrent DB init
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
      annotations:
        reloader.stakater.com/auto: "true"
        directus.suncoast.systems/extensions-seed-revision: "2026-03-14.2"
    spec:
      serviceAccountName: directus
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus
        - name: vault-secrets
          emptyDir: {}
        - name: vault-templates
          configMap:
            name: vault-agent-config-directus
            items:
              - key: db-creds.tpl
                path: db-creds.tpl
              - key: app-keys.tpl
                path: app-keys.tpl
              - key: openai.tpl
                path: openai.tpl
              - key: redis-creds.tpl
                path: redis-creds.tpl
        - name: directus-settings
          configMap:
            name: directus-settings
            items:
              - key: settings.yaml
                path: settings.yaml
        - name: directus-sites
          configMap:
            name: directus-sites
            items:
              - key: sites.yaml
                path: sites.yaml
        - name: directus-layout-templates
          configMap:
            name: directus-layout-templates
        - name: directus-theme-packages
          configMap:
            name: directus-theme-packages
        - name: directus-modules
          configMap:
            name: directus-modules
            items:
              - key: modules.yaml
                path: modules.yaml
        - name: directus-postschema-script
          configMap:
            name: directus-postschema-script
            items:
              - key: directus-postschema.sh
                path: directus-postschema.sh
        - name: directus-postschema-state
          emptyDir: {}
        - name: directus-extensions-seed
          configMap:
            name: directus-extensions-seed
            items:
              - key: github-profile-sync.package.json
                path: github-profile-sync/package.json
              - key: github-profile-sync.index.js
                path: github-profile-sync/index.js
              - key: ai-provider-access.package.json
                path: ai-provider-access/package.json
              - key: ai-provider-access.index.js
                path: ai-provider-access/index.js
              - key: cms-content-model-select.package.json
                path: cms-content-model-select/package.json
              - key: cms-content-model-select.index.js
                path: cms-content-model-select/index.js
              - key: cms-asset-url-picker.package.json
                path: cms-asset-url-picker/package.json
              - key: cms-asset-url-picker.index.js
                path: cms-asset-url-picker/index.js
              - key: cms-module-props-editor.package.json
                path: cms-module-props-editor/package.json
              - key: cms-module-props-editor.index.js
                path: cms-module-props-editor/index.js
              - key: cms-page-blocks-manager.package.json
                path: cms-page-blocks-manager/package.json
              - key: cms-page-blocks-manager.index.js
                path: cms-page-blocks-manager/index.js
        - name: directus-extensions
          persistentVolumeClaim:
            claimName: directus-extensions
      initContainers:
        - name: seed-directus-extensions
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              echo "📦 Seeding Directus extensions into writable storage..."
              mkdir -p /directus/extensions

              # Keep our GitOps-managed extensions deterministic on every start.
              rm -rf /directus/extensions/github-profile-sync /directus/extensions/ai-provider-access /directus/extensions/cms-content-model-select /directus/extensions/cms-asset-url-picker /directus/extensions/cms-module-props-editor /directus/extensions/cms-page-blocks-manager
              # ConfigMap volumes use symlinks; dereference so we copy real files into the PVC.
              cp -RL /extensions-seed/* /directus/extensions/

              # Best-effort: ensure the runtime can write here for marketplace installs.
              chmod -R a+rwX /directus/extensions || true
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: directus-extensions
              mountPath: /directus/extensions
            - name: directus-extensions-seed
              mountPath: /extensions-seed
              readOnly: true
        - name: nuke-directus-roles
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              RESET_DIRECTUS_USERS_ROLES_RAW="${RESET_DIRECTUS_USERS_ROLES:-false}"
              case "$(printf '%s' "${RESET_DIRECTUS_USERS_ROLES_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) RESET_DIRECTUS_USERS_ROLES="true" ;;
                *) RESET_DIRECTUS_USERS_ROLES="false" ;;
              esac
              if [ "${RESET_DIRECTUS_USERS_ROLES}" != "true" ]; then
                echo "ℹ️ Skipping destructive Directus role/user reset (RESET_DIRECTUS_USERS_ROLES=false)."
                exit 0
              fi

              # tools we need (alpine base)
              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔐 Fetching DB static creds for directus-app from Vault…"
              CREDS_URL="${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app"
              DB_USER=""
              DB_PASS=""
              i=0
              while [ "$i" -lt 40 ]; do
                CODE="$(curl -sS -o /tmp/creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "$CREDS_URL" || true)"
                if [ "$CODE" = "200" ]; then
                  DB_USER="$(jq -r '.data.username // empty' /tmp/creds.json)"
                  DB_PASS="$(jq -r '.data.password // empty' /tmp/creds.json)"
                  if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                    break
                  fi
                else
                  ERR="$(jq -r '.errors[0] // empty' /tmp/creds.json 2>/dev/null || true)"
                  if [ -n "$ERR" ]; then
                    echo "  .. Vault returned HTTP $CODE: $ERR"
                  else
                    echo "  .. Vault returned HTTP $CODE"
                  fi
                fi
                i=$((i + 1))
                sleep 3
              done

              if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
                echo "❌ Failed to fetch DB creds from Vault"; exit 1
              fi

              export PGPASSWORD="$DB_PASS"
              echo "🔧 Checking and truncating directus tables if they exist…"
              
              # Check if directus_roles table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_roles'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_roles..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_roles RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_roles does not exist, skipping"
              fi
              
              # Check if directus_users table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_users'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_users..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_users RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_users does not exist, skipping"
              fi
              
              echo "✅ Directus tables checked and cleaned if they existed."
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
            - name: RESET_DIRECTUS_USERS_ROLES
              value: "false"
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job(s) with prefix 'directus-yugabyte-config' in vault namespace to complete..."

              TARGET_PREFIX="directus-yugabyte-config"
              MAX_MISSES=24 # ~2 minutes at 5s intervals
              MISSES=0

              while true; do
                # 1) If an exact job exists, check it first
                if kubectl -n vault get job "$TARGET_PREFIX" >/dev/null 2>&1; then
                  SUCC="$(kubectl -n vault get job "$TARGET_PREFIX" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  [ "${SUCC:-0}" -ge 1 ] && { echo "✅ Job $TARGET_PREFIX succeeded"; break; }
                  MISSES=0
                fi

                # 2) Otherwise, find any job whose name starts with the prefix (handles CronJob or generateName cases)
                MATCHING_JOB="$(kubectl -n vault get jobs -o json \
                  | jq -r --arg p "$TARGET_PREFIX" '.items[] | select(.metadata.name | startswith($p)) | .metadata.name' \
                  | head -n1)"

                if [ -n "$MATCHING_JOB" ]; then
                  SUCC="$(kubectl -n vault get job "$MATCHING_JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  if [ "${SUCC:-0}" -ge 1 ]; then
                    echo "✅ Job $MATCHING_JOB succeeded"
                    break
                  fi
                  MISSES=0
                else
                  MISSES=$((MISSES + 1))
                  if [ "$MISSES" -ge "$MAX_MISSES" ]; then
                    echo "⚠️ No matching job found after waiting; continuing startup."
                    break
                  fi
                fi

                echo "  └─ still waiting…"
                sleep 5
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "⏳ Waiting for existing Redis instance to be ready..."
              until redis-cli -h redis-0.redis-headless.redis.svc.cluster.local -p 6379 ping; do
                echo "Redis not ready, waiting..."
                sleep 5
              done
              echo "✅ Existing Redis instance is ready"
      containers:
      - name: directus-postschema
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/directus-postschema.sh"]
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - test -f /postschema-state/ready
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        env:
          - name: DB_HOST
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
          - name: DB_PORT
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
          - name: DB_DATABASE
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
          - name: DIRECTUS_MODULE_REGISTRY_URL
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_URL } }
          - name: DIRECTUS_MODULE_REGISTRY_PATH
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_PATH } }
          - name: DIRECTUS_MODULE_REGISTRY_CACHE_TTL_MS
            valueFrom: { configMapKeyRef: { name: directus-config, key: DIRECTUS_MODULE_REGISTRY_CACHE_TTL_MS } }
          - name: DIRECTUS_POSTSCHEMA_STATE_DIR
            value: "/postschema-state"
          - name: DIRECTUS_FLOW_API_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/flows/admin"
          - name: OPENAPI_SYNC_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/openapi/admin"
          - name: DIRECTUS_POSTSCHEMA_RECONCILE_VERSION
            value: "2026-04-12.1"
          - name: DIRECTUS_POSTSCHEMA_FORCE_RECONCILE
            value: "false"
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-token
            readOnly: true
          - name: directus-settings
            mountPath: /directus-settings
            readOnly: true
          - name: directus-sites
            mountPath: /directus-sites
            readOnly: true
          - name: directus-layout-templates
            mountPath: /directus-layout-templates
            readOnly: true
          - name: directus-theme-packages
            mountPath: /directus-theme-packages
            readOnly: true
          - name: directus-modules
            mountPath: /directus-modules
            readOnly: true
          - name: directus-postschema-script
            mountPath: /scripts
            readOnly: true
          - name: directus-postschema-state
            mountPath: /postschema-state
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
        volumeMounts:
        - name: vault-agent-config
          mountPath: /vault-config
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: vault-templates
          mountPath: /vault-templates
      - name: directus
        image: directus/directus:11
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "⏳ Waiting for postschema DB reconcile marker..."
            _db_ready_wait_attempt=0
            _db_ready_wait_max=450
            while [ ! -f /postschema-state/db-ready ]; do
              if [ -f /postschema-state/failed ]; then
                echo "❌ postschema reported failure before DB reconcile marker; aborting Directus start."
                exit 1
              fi
              _db_ready_wait_attempt=$((_db_ready_wait_attempt + 1))
              if [ "${_db_ready_wait_attempt}" -ge "${_db_ready_wait_max}" ]; then
                echo "❌ Timed out waiting for /postschema-state/db-ready; aborting Directus start."
                exit 1
              fi
              sleep 2
            done
            echo "✅ postschema DB reconcile marker detected"

            echo "⏳ Waiting for Vault agent to generate all credential files..."
            while [ ! -f /vault-secrets/db-creds.env ] || \
                  [ ! -f /vault-secrets/app-keys.env ] || \
                  [ ! -f /vault-secrets/redis-creds.env ]; do
              echo "Waiting for credential files..."
              sleep 2
            done

            echo "✅ All credential files retrieved from Vault"
            echo "🔑 Loading credentials..."
            . /vault-secrets/db-creds.env
            . /vault-secrets/app-keys.env
            if [ -f /vault-secrets/openai.env ]; then
              . /vault-secrets/openai.env
            else
              echo "⚠️ /vault-secrets/openai.env not found; continuing without OPENAI_API_KEY"
            fi
            . /vault-secrets/redis-creds.env

            # Generate random admin credentials for initial setup (not used for actual login)
            RANDOM_ADMIN_EMAIL="admin-$(tr -dc 'a-z0-9' < /dev/urandom | head -c 8)@example.com"
            RANDOM_ADMIN_PASSWORD="$(tr -dc 'A-Za-z0-9@#%^*+=_-' < /dev/urandom | head -c 32)"
            
            # Export required envs for Directus
            export DB_USER DB_PASSWORD KEY SECRET REDIS_PASSWORD OPENAI_API_KEY
            export ADMIN_EMAIL="$RANDOM_ADMIN_EMAIL" ADMIN_PASSWORD="$RANDOM_ADMIN_PASSWORD"

            # Work from the app dir so the CLI behaves consistently
            cd /directus

            # Ensure Directus uses the intended schema/search_path for all CLI calls
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            _reset_partial_directus_install_if_needed() {
              RESET_PARTIAL_INSTALL_RAW="${DIRECTUS_RESET_PARTIAL_INSTALL:-true}"
              case "$(printf '%s' "${RESET_PARTIAL_INSTALL_RAW}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) RESET_PARTIAL_INSTALL="true" ;;
                *) RESET_PARTIAL_INSTALL="false" ;;
              esac

              if [ "${RESET_PARTIAL_INSTALL}" != "true" ]; then
                echo "ℹ️ Skipping partial Directus install reset check (DIRECTUS_RESET_PARTIAL_INSTALL=false)."
                return 0
              fi

              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");

            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));

            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }

            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });

            async function run() {
              const migrationsTable = await db("information_schema.tables")
                .where({ table_schema: schema, table_name: "directus_migrations" })
                .first();

              if (migrationsTable) {
                console.log("directus_migrations table present; no partial-install reset needed.");
                return;
              }

              const collectionsTable = await db("information_schema.tables")
                .where({ table_schema: schema, table_name: "directus_collections" })
                .first();

              if (!collectionsTable) {
                console.log("No Directus system tables detected yet; no partial-install reset needed.");
                return;
              }

              const directusTables = await db("information_schema.tables")
                .where({ table_schema: schema })
                .where("table_name", "like", "directus_%")
                .orderBy("table_name")
                .select("table_name");

              const cmsTables = await db("information_schema.tables")
                .where({ table_schema: schema })
                .where("table_name", "like", "cms_%")
                .orderBy("table_name")
                .select("table_name");

              const patchTables = await db("information_schema.tables")
                .where({ table_schema: schema })
                .whereIn("table_name", ["schema_patch_log", "schema_patch_runs"])
                .orderBy("table_name")
                .select("table_name");

              const tablesToDrop = [...directusTables, ...patchTables];

              if (!tablesToDrop.length) {
                console.log(
                  `Detected partial Directus install but found no directus_*/schema_patch_* tables to clean in schema "${schema}".`
                );
                return;
              }

              const quoteIdent = (identifier) => `"${String(identifier).replace(/"/g, '""')}"`;

              console.log(
                `Detected partial Directus install (directus_collections exists without directus_migrations). ` +
                  `Cleaning in-schema tables without schema recreation. directus tables=${directusTables.length}, cms tables=${cmsTables.length}, patch tables=${patchTables.length}`
              );

              for (const { table_name: tableName } of tablesToDrop) {
                await db.raw(`DROP TABLE IF EXISTS ${quoteIdent(schema)}.${quoteIdent(tableName)} CASCADE`);
              }
              console.log(`In-schema partial-install cleanup for "${schema}" complete.`);
            }

            run()
              .catch((error) => {
                console.error(error);
                process.exit(1);
              })
              .finally(() => db.destroy());
            NODE
            }

            # Increase OAuth2 userinfo timeout for cold-starting profile proxy
            if [ -n "${AUTH_GITHUB_CLIENT_HTTP__TIMEOUT:-}" ]; then
              printf '%s\n' \
                "import { custom } from 'openid-client';" \
                "const timeout = Number(process.env.AUTH_GITHUB_CLIENT_HTTP__TIMEOUT || 0);" \
                "if (Number.isFinite(timeout) && timeout > 0) { custom.setHttpOptionsDefaults({ timeout }); }" \
                > /tmp/openid-timeout.mjs
              if [ -n "${NODE_OPTIONS:-}" ]; then
                export NODE_OPTIONS="${NODE_OPTIONS} --import=/tmp/openid-timeout.mjs"
              else
                export NODE_OPTIONS="--import=/tmp/openid-timeout.mjs"
              fi
            fi

            echo "🔄 Initializing Directus database..."
            _reset_partial_directus_install_if_needed
            echo "📦 Running database install (idempotent)..."
            if CACHE_ENABLED=false RATE_LIMITER_ENABLED=false INIT_ADMIN_EMAIL="$ADMIN_EMAIL" INIT_ADMIN_PASSWORD="$ADMIN_PASSWORD" node cli.js database install >/tmp/install.log 2>&1; then
              echo "✅ Database installation completed successfully"
            else
              if grep -q "Database is already installed" /tmp/install.log; then
                echo "✅ Database already installed, proceeding..."
              else
                echo "❌ Database installation failed"; cat /tmp/install.log; exit 1
              fi
            fi

            _ensure_project_owner_migration_recorded() {
              MIGRATION_VERSION="20251014A"
              MIGRATION_NAME="Add Project Owner"
              export MIGRATION_VERSION MIGRATION_NAME

              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const migrationsTable = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_migrations" }).first(); if (!migrationsTable) return; const existing = await db("directus_migrations").withSchema(schema).where({ version: process.env.MIGRATION_VERSION }).first(); if (existing) return; const projectOwnerCol = await db("information_schema.columns").where({ table_schema: schema, table_name: "directus_settings", column_name: "project_owner" }).first(); if (!projectOwnerCol) return; const migrationCols = await db("information_schema.columns").select("column_name").where({ table_schema: schema, table_name: "directus_migrations" }); const insert = { version: process.env.MIGRATION_VERSION, name: process.env.MIGRATION_NAME }; if (migrationCols.some((col) => col.column_name === "timestamp")) { insert.timestamp = new Date().toISOString(); } await db("directus_migrations").withSchema(schema).insert(insert).onConflict("version").ignore(); console.log("Marked Add Project Owner migration as applied."); }; run().finally(() => db.destroy());'
            }

            if ! _ensure_project_owner_migration_recorded; then
              echo "⚠️ Failed to reconcile Add Project Owner migration state; continuing..."
            fi

            _ensure_settings_row() {
              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const table = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_settings" }).first(); if (!table) return; const row = await db("directus_settings").withSchema(schema).count({ count: "*" }).first(); const count = Number(row?.count ?? 0); if (!count) { await db("directus_settings").withSchema(schema).insert({}); console.log("Seeded directus_settings row."); } }; run().finally(() => db.destroy());'
            }

            echo "🔄 Running database migrations..."
            # Clear any cached schema and run migrations with cache disabled
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false  
            export CACHE_STORE=memory
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            
            # Add small delay to ensure DB is fully ready after install
            sleep 2
            
            # Run migrations with enhanced error handling
            echo "🔄 Running migrations with schema cache disabled..."
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            if node cli.js database migrate:latest >/tmp/migrate.log 2>&1; then
              cat /tmp/migrate.log
              echo "✅ Migrations completed successfully"
            else
              # Check if it's the known schema cache issue in Add Project Owner migration
              if grep -q "Cannot read properties of undefined.*primary\|Add Project Owner\|project_owner.*already exists" /tmp/migrate.log; then
                echo "⚠️ Known issue in 'Add Project Owner' migration detected"
                _ensure_project_owner_migration_recorded || true
                echo "⚠️ This is a non-critical schema cache issue - continuing with deployment"
                cat /tmp/migrate.log
                echo "✅ Migrations completed with known warnings"
              else
                echo "❌ Critical migration failure"
                cat /tmp/migrate.log
                exit 1
              fi
            fi

            if ! _ensure_settings_row; then
              echo "⚠️ Failed to ensure directus_settings row; continuing..."
            fi

            _ensure_ai_settings_defaults() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const DEFAULT_OPENAI_ALLOWED_MODELS = ["gpt-4o-mini", "gpt-5-nano", "gpt-5-mini", "gpt-5"];
            const DEFAULT_ANTHROPIC_ALLOWED_MODELS = ["claude-haiku-4-5", "claude-sonnet-4-5"];
            const DEFAULT_GOOGLE_ALLOWED_MODELS = ["gemini-3-pro-preview", "gemini-3-flash-preview", "gemini-2.5-pro", "gemini-2.5-flash"];
            
            const DEFAULT_OPENAI_COMPATIBLE_BASE_URL = "https://api.openai.com/v1";
            const DEFAULT_OPENAI_COMPATIBLE_NAME = "openai-compatible";
            const DEFAULT_OPENAI_COMPATIBLE_MODELS = [
              { id: "gpt-4o-mini", name: "GPT-4o Mini", context: 128000, output: 16384, attachment: true, reasoning: false },
              { id: "gpt-5-nano", name: "GPT-5 Nano", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5-mini", name: "GPT-5 Mini", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5", name: "GPT-5", context: 400000, output: 128000, attachment: true, reasoning: true }
            ];
            
            async function run() {
              const wantCols = [
                "ai_openai_allowed_models",
                "ai_anthropic_allowed_models",
                "ai_google_allowed_models",
                "ai_openai_compatible_base_url",
                "ai_openai_compatible_name",
                "ai_openai_compatible_models",
                "ai_openai_compatible_headers"
              ];
            
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = new Set(cols.map((c) => c.column_name));
              if (existing.size === 0) {
                console.log("No AI settings columns found; skipping AI defaults.");
                return;
              }
            
              const rowCount = await db("directus_settings").withSchema(schema).count({ count: "*" }).first();
              const count = Number(rowCount?.count ?? 0);
              if (!count) {
                await db("directus_settings").withSchema(schema).insert({});
              }
            
              const selectCols = Array.from(existing);
              const current = (await db("directus_settings").withSchema(schema).select(selectCols).first()) || {};
            
              const patch = {};
            
              if (existing.has("ai_openai_allowed_models") && current.ai_openai_allowed_models == null) {
                patch.ai_openai_allowed_models = JSON.stringify(DEFAULT_OPENAI_ALLOWED_MODELS);
              }
              if (existing.has("ai_anthropic_allowed_models") && current.ai_anthropic_allowed_models == null) {
                patch.ai_anthropic_allowed_models = JSON.stringify(DEFAULT_ANTHROPIC_ALLOWED_MODELS);
              }
              if (existing.has("ai_google_allowed_models") && current.ai_google_allowed_models == null) {
                patch.ai_google_allowed_models = JSON.stringify(DEFAULT_GOOGLE_ALLOWED_MODELS);
              }
              if (existing.has("ai_openai_compatible_base_url") && current.ai_openai_compatible_base_url == null) {
                patch.ai_openai_compatible_base_url = DEFAULT_OPENAI_COMPATIBLE_BASE_URL;
              }
              if (existing.has("ai_openai_compatible_name") && current.ai_openai_compatible_name == null) {
                patch.ai_openai_compatible_name = DEFAULT_OPENAI_COMPATIBLE_NAME;
              }
              if (existing.has("ai_openai_compatible_models") && current.ai_openai_compatible_models == null) {
                patch.ai_openai_compatible_models = JSON.stringify(DEFAULT_OPENAI_COMPATIBLE_MODELS);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("AI settings already initialized.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Initialized AI settings defaults: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            _set_ai_provider_keys() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const parsePayload = (value) => {
              const parts = String(value || "").split("||");
              if (parts.length < 9) return null;
              const [version, kdf, nStr, rStr, pStr, saltB64, ivB64, cipherText, tagB64] = parts;
              if (version !== "1" || kdf !== "scrypt") return null;
              return { n: Number(nStr) || 2 ** 14, r: Number(rStr) || 8, p: Number(pStr) || 1, saltB64, ivB64, cipherText, tagB64 };
            };
            
            const decryptPayload = (value, secret) => {
              const parsed = parsePayload(value);
              if (!parsed) return null;
              try {
                const salt = Buffer.from(parsed.saltB64, "base64");
                const keyBuf = crypto.scryptSync(secret, salt, 32, { N: parsed.n, r: parsed.r, p: parsed.p });
                const iv = Buffer.from(parsed.ivB64, "base64");
                const tag = Buffer.from(parsed.tagB64, "base64");
                const decipher = crypto.createDecipheriv("aes-256-gcm", keyBuf, iv);
                decipher.setAuthTag(tag);
                let plaintext = decipher.update(parsed.cipherText, "base64", "utf8");
                plaintext += decipher.final("utf8");
                return plaintext;
              } catch {
                return null;
              }
            };
            
            const encryptPayload = (plain, secret) => {
              const salt = crypto.randomBytes(16);
              const keyBuf = crypto.scryptSync(secret, salt, 32, { N: 2 ** 14, r: 8, p: 1 });
              const iv = crypto.randomBytes(12);
              const cipher = crypto.createCipheriv("aes-256-gcm", keyBuf, iv);
              let cipherText = cipher.update(plain, "utf8", "base64");
              cipherText += cipher.final("base64");
              const tag = cipher.getAuthTag().toString("base64");
              return ["1", "scrypt", 2 ** 14, 8, 1, salt.toString("base64"), iv.toString("base64"), cipherText, tag].join("||");
            };
            
            async function run() {
              const desired = process.env.OPENAI_API_KEY;
              const secret = process.env.SECRET;
            
              if (!secret) {
                console.log("Missing SECRET; skipping AI key encryption.");
                return;
              }
            
              if (!desired) {
                console.log("Missing OPENAI_API_KEY; skipping AI key encryption.");
                return;
              }
            
              const wantCols = ["ai_openai_api_key", "ai_openai_compatible_api_key"];
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = cols.map((c) => c.column_name);
              if (existing.length === 0) {
                console.log("No AI key columns found; skipping.");
                return;
              }
            
              const row = (await db("directus_settings").withSchema(schema).select(existing).first()) || {};
            
              const patch = {};
              for (const col of existing) {
                const current = row[col];
                const isEncrypted = typeof current === "string" && current.startsWith("1||scrypt||");
            
                if (isEncrypted) {
                  const decrypted = decryptPayload(current, secret);
                  if (decrypted === null) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  if (decrypted !== desired) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  continue;
                }
            
                patch[col] = encryptPayload(desired, secret);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("No AI keys to update.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Encrypted AI keys stored in directus_settings: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            echo "🤖 Ensuring AI settings defaults..."
            _ensure_ai_settings_defaults || echo "⚠️ Failed to ensure AI settings defaults."

            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "🔐 Encrypting AI provider keys into directus_settings..."
              _set_ai_provider_keys || echo "⚠️ Failed to store AI provider keys."
            else
              echo "ℹ️ OPENAI_API_KEY not set; skipping encrypted AI provider keys."
            fi

            echo "🔍 Debug: Environment check..."
            echo "DB_HOST: $DB_HOST, DB_USER: $DB_USER, DB_SCHEMA: $DB_SCHEMA"
            echo "REDIS_HOST: $REDIS_HOST"
            echo "Credentials loaded: KEY(${#KEY}), SECRET(${#SECRET}), ADMIN_EMAIL($ADMIN_EMAIL)"

            # Ensure proper schema connection
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            echo "🔧 Seeding defaults if missing & resolving role UUIDs…"

            # Make CLI quieter & deterministic for parsing
            export NO_COLOR=1
            export LOG_STYLE=raw
            export LOG_LEVEL=error
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false

            # Resolve/create roles directly in DB to avoid CLI hangs during startup.
            _resolve_role_ids() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            async function tableColumns(tableName) {
              const rows = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: tableName });
              return new Set(rows.map((row) => row.column_name));
            }
            
            async function ensureRole(name, flags, cols) {
              const existing = await db("directus_roles")
                .withSchema(schema)
                .select("id")
                .whereRaw("LOWER(name) = LOWER(?)", [name])
                .first();
            
              if (existing?.id) return existing.id;
            
              const row = {};
              if (cols.has("id")) row.id = crypto.randomUUID();
              if (cols.has("name")) row.name = name;
              if (cols.has("icon")) row.icon = flags.admin ? "verified" : "supervised_user_circle";
              if (cols.has("description")) row.description = flags.admin ? "System Administrator" : "Content Editor";
              if (cols.has("admin_access")) row.admin_access = !!flags.admin;
              if (cols.has("app_access")) row.app_access = !!flags.app;
              if (cols.has("enforce_tfa")) row.enforce_tfa = false;
              if (cols.has("ip_access")) row.ip_access = null;
            
              await db("directus_roles").withSchema(schema).insert(row);
              return row.id;
            }

            async function ensurePolicy(name, flags, cols) {
              let query = db("directus_policies")
                .withSchema(schema)
                .select("id")
                .whereRaw("LOWER(name) = LOWER(?)", [name]);
              if (cols.has("admin_access")) query = query.andWhere("admin_access", !!flags.admin);
              if (cols.has("app_access")) query = query.andWhere("app_access", !!flags.app);

              const existing = await query.orderBy("id", "desc").first();
              if (existing?.id) return existing.id;

              const row = {};
              if (cols.has("id")) row.id = crypto.randomUUID();
              if (cols.has("name")) row.name = name;
              if (cols.has("icon")) row.icon = flags.admin ? "policy" : "edit_note";
              if (cols.has("description")) row.description = flags.admin ? "Admin policy" : "Editor policy";
              if (cols.has("ip_access")) row.ip_access = null;
              if (cols.has("enforce_tfa")) row.enforce_tfa = false;
              if (cols.has("admin_access")) row.admin_access = !!flags.admin;
              if (cols.has("app_access")) row.app_access = !!flags.app;

              await db("directus_policies").withSchema(schema).insert(row);
              return row.id;
            }

            async function ensureRolePolicyAccess(roleId, policyId, cols) {
              let query = db("directus_access")
                .withSchema(schema)
                .select("id")
                .where({ role: roleId, policy: policyId });
              if (cols.has("user")) query = query.whereNull("user");

              const existing = await query.first();
              if (existing?.id) return existing.id;

              const row = {};
              if (cols.has("id")) row.id = crypto.randomUUID();
              if (cols.has("role")) row.role = roleId;
              if (cols.has("policy")) row.policy = policyId;
              if (cols.has("user")) row.user = null;
              if (cols.has("sort")) row.sort = null;

              await db("directus_access").withSchema(schema).insert(row);
              return row.id;
            }
            
            async function run() {
              const roleCols = await tableColumns("directus_roles");
              const policyCols = await tableColumns("directus_policies");
              const accessCols = await tableColumns("directus_access");
              const adminRoleId = await ensureRole("Administrator", { admin: true, app: true }, roleCols);
              const editorRoleId = await ensureRole("Editor", { admin: false, app: true }, roleCols);
              const adminPolicyId = await ensurePolicy("Policy for Administrator", { admin: true, app: true }, policyCols);
              const editorPolicyId = await ensurePolicy("Policy for Editor", { admin: false, app: true }, policyCols);
              await ensureRolePolicyAccess(adminRoleId, adminPolicyId, accessCols);
              await ensureRolePolicyAccess(editorRoleId, editorPolicyId, accessCols);
            
              process.stdout.write(`ADMIN_ROLE_ID=${adminRoleId}\n`);
              process.stdout.write(`EDITOR_ROLE_ID=${editorRoleId}\n`);
            }
            
            run()
              .catch((error) => {
                console.error(error);
                process.exit(1);
              })
              .finally(() => db.destroy());
            NODE
            }
            
            role_ids_env="$(mktemp)"
            if _resolve_role_ids >"${role_ids_env}"; then
              . "${role_ids_env}"
            else
              echo "❌ Failed to resolve Directus role IDs"; rm -f "${role_ids_env}"; exit 1
            fi
            rm -f "${role_ids_env}"

            # IDs printed above; make sure they are in the environment for everything that follows
            export ADMIN_ROLE_ID
            export EDITOR_ROLE_ID

            # Build AUTH_GITHUB_ROLE_MAPPING purely in sh from TEAM_ROLE_MAP and the two IDs
            TEAM_ROLE_MAP="${TEAM_ROLE_MAP:-github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor}"

            make_mapping() {
              pairs="$1"
              admin_id="$2"
              editor_id="$3"
              out='json:{'
              first=1
              OLDIFS="$IFS"; IFS=',' 
              for kv in $pairs; do
                IFS="$OLDIFS"
                group="${kv%%=*}"
                name="${kv#*=}"
                id=""
                [ "$name" = "Administrator" ] && id="$admin_id"
                [ "$name" = "Editor" ] && id="$editor_id"
                if [ -n "$id" ]; then
                  [ $first -eq 0 ] && out="$out,"
                  out="$out\"$group\":\"$id\""
                  first=0
                else
                  echo "  ⚠ no id available for role name: $name" >&2
                fi
                IFS=',' 
              done
              IFS="$OLDIFS"
              out="$out}"
              printf "%s" "$out"
            }

            AUTH_GITHUB_ROLE_MAPPING="$(make_mapping "$TEAM_ROLE_MAP" "$ADMIN_ROLE_ID" "$EDITOR_ROLE_ID")"
            export AUTH_GITHUB_ROLE_MAPPING
            echo "✅ AUTH_GITHUB_ROLE_MAPPING = $AUTH_GITHUB_ROLE_MAPPING"

            # Ensure admin user exists to disable setup form
            echo "👤 Ensuring admin user exists..."
            admin_tmp="$(mktemp)"
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            # Try to create admin user (will fail if exists, which is fine)
            if node cli.js users create --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --role "$ADMIN_ROLE_ID" >"$admin_tmp" 2>&1; then
              echo "✅ Admin user created successfully"
            else
              if grep -q "already exists\|duplicate\|unique constraint" "$admin_tmp"; then
                echo "✅ Admin user already exists"
              else
                echo "⚠️ Admin user creation issue (continuing anyway):"
                cat "$admin_tmp"
              fi
            fi
            rm -f "$admin_tmp"

            echo "🚀 Starting Directus server..."
            # Reset cache settings for production mode
            unset NO_COLOR LOG_STYLE
            export LOG_LEVEL=info
            export CACHE_ENABLED=true
            export RATE_LIMITER_ENABLED=true
            
            # Clear any lingering schema cache issues before starting
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false

            DIRECTUS_START_MAX_RETRIES_RAW="${DIRECTUS_START_MAX_RETRIES:-12}"
            DIRECTUS_START_RETRY_DELAY_SECONDS_RAW="${DIRECTUS_START_RETRY_DELAY_SECONDS:-8}"
            DIRECTUS_START_MAX_RETRIES="$(printf '%s' "${DIRECTUS_START_MAX_RETRIES_RAW}" | tr -dc '0-9')"
            DIRECTUS_START_RETRY_DELAY_SECONDS="$(printf '%s' "${DIRECTUS_START_RETRY_DELAY_SECONDS_RAW}" | tr -dc '0-9')"
            if [ -z "${DIRECTUS_START_MAX_RETRIES:-}" ] || [ "${DIRECTUS_START_MAX_RETRIES}" -lt 1 ]; then
              DIRECTUS_START_MAX_RETRIES=12
            fi
            if [ -z "${DIRECTUS_START_RETRY_DELAY_SECONDS:-}" ] || [ "${DIRECTUS_START_RETRY_DELAY_SECONDS}" -lt 1 ]; then
              DIRECTUS_START_RETRY_DELAY_SECONDS=8
            fi

            _directus_start_attempt=1
            while true; do
              echo "▶️ Directus start attempt ${_directus_start_attempt}/${DIRECTUS_START_MAX_RETRIES}"
              if node cli.js start; then
                exit 0
              fi
              _directus_start_rc="$?"
              if [ "${_directus_start_attempt}" -ge "${DIRECTUS_START_MAX_RETRIES}" ]; then
                echo "❌ Directus exited with code ${_directus_start_rc} after ${_directus_start_attempt} attempts."
                exit "${_directus_start_rc}"
              fi
              if [ -f /postschema-state/ready ]; then
                echo "⚠️ Directus exited with code ${_directus_start_rc}; retrying in ${DIRECTUS_START_RETRY_DELAY_SECONDS}s."
              else
                echo "⚠️ Directus exited with code ${_directus_start_rc} while postschema is still reconciling; retrying in ${DIRECTUS_START_RETRY_DELAY_SECONDS}s."
              fi
              _directus_start_attempt=$((_directus_start_attempt + 1))
              sleep "${DIRECTUS_START_RETRY_DELAY_SECONDS}"
            done
        ports:
        - containerPort: 8055
        env:
        - name: AUTH_PROVIDERS
          value: "github"
        - name: AUTH_DISABLE_DEFAULT
          value: "true"

        # Optional: your default team→role names (left = proxy group; right = Directus role name)
        - name: TEAM_ROLE_MAP
          value: "github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor"

        # Database configuration
        - name: DB_CLIENT
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_CLIENT } }
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
        - name: DB_DATABASE
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
        - name: DB_SCHEMA
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_SCHEMA } }
        - name: DIRECTUS_RESET_PARTIAL_INSTALL
          value: "true"
        - name: DB_POOL__MIN
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_POOL__MIN } }
        - name: DB_POOL__MAX
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_POOL__MAX } }

        # Cache configuration
        - name: CACHE_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: CACHE_ENABLED } }
        - name: CACHE_STORE
          valueFrom: { configMapKeyRef: { name: directus-config, key: CACHE_STORE } }
        - name: REDIS_HOST
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_HOST } }
        - name: REDIS_PORT
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_PORT } }
        - name: REDIS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_ENABLED } }

        # Rate limiting
        - name: RATE_LIMITER_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: RATE_LIMITER_ENABLED } }
        - name: RATE_LIMITER_STORE
          valueFrom: { configMapKeyRef: { name: directus-config, key: RATE_LIMITER_STORE } }

        # Storage configuration
        - name: STORAGE_LOCATIONS
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCATIONS } }
        - name: STORAGE_LOCAL_DRIVER
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCAL_DRIVER } }
        - name: STORAGE_LOCAL_ROOT
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCAL_ROOT } }

        # Extensions configuration
        - name: EXTENSIONS_PATH
          value: "/directus/extensions"

        # Other configuration
        - name: LOG_LEVEL
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_LEVEL } }
        - name: LOG_STYLE
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_STYLE } }
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: PUBLIC_URL } }
        - name: CORS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ENABLED } }
        - name: CORS_ORIGIN
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ORIGIN } }
        - name: ASSETS_CACHE_TTL
          valueFrom: { configMapKeyRef: { name: directus-config, key: ASSETS_CACHE_TTL } }

        # WebSockets configuration
        - name: WEBSOCKETS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_ENABLED } }
        - name: WEBSOCKETS_COLLAB_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_COLLAB_ENABLED } }

        # GitHub OAuth provider config
        - name: AUTH_GITHUB_DRIVER
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_DRIVER } }
        - name: AUTH_GITHUB_AUTHORIZE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_AUTHORIZE_URL } }
        - name: AUTH_GITHUB_ACCESS_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_ACCESS_URL } }
        - name: AUTH_GITHUB_PROFILE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_PROFILE_URL } }
        - name: AUTH_GITHUB_IDENTIFIER_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_IDENTIFIER_KEY } }
        - name: AUTH_GITHUB_EMAIL_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_EMAIL_KEY } }
        - name: AUTH_GITHUB_SCOPE
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_SCOPE } }
        - name: AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION } }
        - name: AUTH_GITHUB_GROUP_CLAIM_NAME
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_GROUP_CLAIM_NAME } }
        - name: AUTH_GITHUB_GROUPS_CLAIM
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_GROUP_CLAIM_NAME } }
        - name: AUTH_GITHUB_CLIENT_ID
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_CLIENT_ID } }
        - name: AUTH_GITHUB_CLIENT_SECRET
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_CLIENT_SECRET } }
        - name: AUTH_GITHUB_SYNC_USER_INFO
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_SYNC_USER_INFO } }
        - name: AUTH_GITHUB_FIRST_NAME_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_FIRST_NAME_KEY } }

        startupProbe:
          httpGet: { path: /server/health, port: 8055 }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet: { path: /server/health, port: 8055 }
          initialDelaySeconds: 360
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /server/health, port: 8055 }
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /directus/uploads
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: directus-extensions
          mountPath: /directus/extensions
        - name: directus-postschema-state
          mountPath: /postschema-state
