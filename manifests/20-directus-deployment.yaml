            export NO_COLOR=1
            export LOG_STYLE=raw
            export LOG_LEVEL=error
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false

            # Parse the first UUID-looking token from a file
            _extract_uuid_from_file() {
              # greedy-safe: match canonical 8-4-4-4-12 hex UUID
              grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$1" | head -n1
            }

            # Create role and capture UUID from *its own* output stream
            _create_role_and_get_id() {
              local role_name="$1"; shift
              local tmp="$(mktemp)"
              # run create; don’t fail the script if it errors (already exists etc.)
              node cli.js roles create --role "$role_name" "$@" >"$tmp" 2>&1 || true
              local id="$(_extract_uuid_from_file "$tmp")"
              rm -f "$tmp"
              printf "%s" "$id"
            }

            # Try to create (or re-create) roles and grab their IDs
            ADMIN_ROLE_ID="$(_create_role_and_get_id "Administrator" --admin --app)"
            EDITOR_ROLE_ID="$(_create_role_and_get_id "Editor" --app)"

            # IDs printed above; make sure they are in the environment for everything that follows
            export ADMIN_ROLE_ID
            export EDITOR_ROLE_ID

            # Build AUTH_GITHUB_ROLE_MAPPING purely in sh from TEAM_ROLE_MAP and the two IDs
            TEAM_ROLE_MAP="${TEAM_ROLE_MAP:-github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor}"

            make_mapping() {
              pairs="$1"
              admin_id="$2"
              editor_id="$3"
              out='json:{'
              first=1
              OLDIFS="$IFS"; IFS=',' 
              for kv in $pairs; do
                IFS="$OLDIFS"
                group="${kv%%=*}"
                name="${kv#*=}"
                id=""
                [ "$name" = "Administrator" ] && id="$admin_id"
                [ "$name" = "Editor" ] && id="$editor_id"
                if [ -n "$id" ]; then
                  [ $first -eq 0 ] && out="$out,"
                  out="$out\"$group\":\"$id\""
                  first=0
                else
                  echo "  ⚠ no id available for role name: $name" >&2
                fi
                IFS=',' 
              done
              IFS="$OLDIFS"
              out="$out}"
              printf "%s" "$out"
            }

            AUTH_GITHUB_ROLE_MAPPING="$(make_mapping "$TEAM_ROLE_MAP" "$ADMIN_ROLE_ID" "$EDITOR_ROLE_ID")"
            export AUTH_GITHUB_ROLE_MAPPING
            echo "✅ AUTH_GITHUB_ROLE_MAPPING = $AUTH_GITHUB_ROLE_MAPPING"

            # Ensure admin user exists to disable setup form
