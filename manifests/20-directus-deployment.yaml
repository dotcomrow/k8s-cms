                    DB_PASS_EFFECTIVE="$(jq -r '.data.data.password // .data.data.pass // empty' /tmp/db-creds.json)"
                    DB_HOST_OVERRIDE="$(jq -r '.data.data.host // empty' /tmp/db-creds.json)"
                    DB_PORT_OVERRIDE="$(jq -r '.data.data.port // empty' /tmp/db-creds.json)"
                    DB_DATABASE_OVERRIDE="$(jq -r '.data.data.database // .data.data.db // empty' /tmp/db-creds.json)"
                    DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.ssh_tunnel_enabled // "false"' /tmp/db-creds.json)"
                    DB_TUNNEL_HOST="$(jq -r '.data.data.ssh_tunnel_host // .data.data.host // empty' /tmp/db-creds.json)"
                    DB_TUNNEL_PORT="$(jq -r '.data.data.ssh_tunnel_port // "22"' /tmp/db-creds.json)"
                    DB_TUNNEL_USER="$(jq -r '.data.data.ssh_tunnel_user // "directus_tunnel"' /tmp/db-creds.json)"
                    DB_TUNNEL_LOCAL_PORT="$(jq -r '.data.data.ssh_tunnel_local_port // "15432"' /tmp/db-creds.json)"
                    DB_TUNNEL_REMOTE_PORT="$(jq -r '.data.data.ssh_tunnel_remote_port // "5432"' /tmp/db-creds.json)"
                    DB_TUNNEL_PRIVATE_KEY_B64="$(jq -r '.data.data.ssh_private_key_b64 // empty' /tmp/db-creds.json)"
                  fi
                fi

                if [ -z "${DB_USER_EFFECTIVE}" ] || [ -z "${DB_PASS_EFFECTIVE}" ] || [ "${DB_USER_EFFECTIVE}" = "null" ] || [ "${DB_PASS_EFFECTIVE}" = "null" ]; then
                  if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
                    TOPLEVEL_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/db-top-creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${TOPLEVEL_CREDS_URL}" || true)"
