# Directus Deployment with Vault integration & dynamic role mapping
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: directus
  labels:
    app: directus
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # start with one replica to avoid concurrent DB init
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: directus
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus
        - name: vault-secrets
          emptyDir: {}
        - name: vault-templates
          configMap:
            name: vault-agent-config-directus
            items:
              - key: db-creds.tpl
                path: db-creds.tpl
              - key: app-keys.tpl
                path: app-keys.tpl
              - key: openai.tpl
                path: openai.tpl
              - key: redis-creds.tpl
                path: redis-creds.tpl
        - name: directus-settings
          configMap:
            name: directus-settings
            items:
              - key: settings.yaml
                path: settings.yaml
        - name: directus-sites
          configMap:
            name: directus-sites
            items:
              - key: sites.yaml
                path: sites.yaml
        - name: directus-layout-templates
          configMap:
            name: directus-layout-templates
        - name: directus-extensions-seed
          configMap:
            name: directus-extensions-seed
            items:
              - key: github-profile-sync.package.json
                path: github-profile-sync/package.json
              - key: github-profile-sync.index.js
                path: github-profile-sync/index.js
              - key: ai-provider-access.package.json
                path: ai-provider-access/package.json
              - key: ai-provider-access.index.js
                path: ai-provider-access/index.js
        - name: directus-extensions
          persistentVolumeClaim:
            claimName: directus-extensions
      initContainers:
        - name: seed-directus-extensions
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              echo "📦 Seeding Directus extensions into writable storage..."
              mkdir -p /directus/extensions

              # Keep our GitOps-managed extensions deterministic on every start.
              rm -rf /directus/extensions/github-profile-sync /directus/extensions/ai-provider-access
              # ConfigMap volumes use symlinks; dereference so we copy real files into the PVC.
              cp -RL /extensions-seed/* /directus/extensions/

              # Best-effort: ensure the runtime can write here for marketplace installs.
              chmod -R a+rwX /directus/extensions || true
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: directus-extensions
              mountPath: /directus/extensions
            - name: directus-extensions-seed
              mountPath: /extensions-seed
              readOnly: true
        - name: nuke-directus-roles
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              # tools we need (alpine base)
              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔐 Fetching DB static creds for directus-app from Vault…"
              CREDS_URL="${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app"
              DB_USER=""
              DB_PASS=""
              i=0
              while [ "$i" -lt 40 ]; do
                CODE="$(curl -sS -o /tmp/creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "$CREDS_URL" || true)"
                if [ "$CODE" = "200" ]; then
                  DB_USER="$(jq -r '.data.username // empty' /tmp/creds.json)"
                  DB_PASS="$(jq -r '.data.password // empty' /tmp/creds.json)"
                  if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                    break
                  fi
                else
                  ERR="$(jq -r '.errors[0] // empty' /tmp/creds.json 2>/dev/null || true)"
                  if [ -n "$ERR" ]; then
                    echo "  .. Vault returned HTTP $CODE: $ERR"
                  else
                    echo "  .. Vault returned HTTP $CODE"
                  fi
                fi
                i=$((i + 1))
                sleep 3
              done

              if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
                echo "❌ Failed to fetch DB creds from Vault"; exit 1
              fi

              export PGPASSWORD="$DB_PASS"
              echo "🔧 Checking and truncating directus tables if they exist…"
              
              # Check if directus_roles table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_roles'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_roles..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_roles RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_roles does not exist, skipping"
              fi
              
              # Check if directus_users table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_users'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_users..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_users RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_users does not exist, skipping"
              fi
              
              echo "✅ Directus tables checked and cleaned if they existed."
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job(s) with prefix 'directus-yugabyte-config' in vault namespace to complete..."

              TARGET_PREFIX="directus-yugabyte-config"
              MAX_MISSES=24 # ~2 minutes at 5s intervals
              MISSES=0

              while true; do
                # 1) If an exact job exists, check it first
                if kubectl -n vault get job "$TARGET_PREFIX" >/dev/null 2>&1; then
                  SUCC="$(kubectl -n vault get job "$TARGET_PREFIX" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  [ "${SUCC:-0}" -ge 1 ] && { echo "✅ Job $TARGET_PREFIX succeeded"; break; }
                  MISSES=0
                fi

                # 2) Otherwise, find any job whose name starts with the prefix (handles CronJob or generateName cases)
                MATCHING_JOB="$(kubectl -n vault get jobs -o json \
                  | jq -r --arg p "$TARGET_PREFIX" '.items[] | select(.metadata.name | startswith($p)) | .metadata.name' \
                  | head -n1)"

                if [ -n "$MATCHING_JOB" ]; then
                  SUCC="$(kubectl -n vault get job "$MATCHING_JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  if [ "${SUCC:-0}" -ge 1 ]; then
                    echo "✅ Job $MATCHING_JOB succeeded"
                    break
                  fi
                  MISSES=0
                else
                  MISSES=$((MISSES + 1))
                  if [ "$MISSES" -ge "$MAX_MISSES" ]; then
                    echo "⚠️ No matching job found after waiting; continuing startup."
                    break
                  fi
                fi

                echo "  └─ still waiting…"
                sleep 5
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "⏳ Waiting for existing Redis instance to be ready..."
              until redis-cli -h redis-0.redis-headless.redis.svc.cluster.local -p 6379 ping; do
                echo "Redis not ready, waiting..."
                sleep 5
              done
              echo "✅ Existing Redis instance is ready"
      containers:
      - name: directus-postschema
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu

            # tools
            apk add --no-cache curl jq yq >/dev/null

            # --- wait for Directus to be healthy (same pod: localhost) ---
            echo "⏳ Waiting for Directus /server/health..."
            until curl -sf http://127.0.0.1:8055/server/health >/dev/null; do
              echo "  .. not ready yet"
              sleep 3
            done
            echo "✅ Directus is healthy"

            # --- fetch DB creds from Vault ---
            VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
            CREDS="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app")"
            DB_USER="$(echo "$CREDS" | jq -r '.data.username')"
            DB_PASS="$(echo "$CREDS" | jq -r '.data.password')"

            if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
              echo "❌ Failed to fetch DB creds from Vault"; exit 1
            fi

            export PGPASSWORD="$DB_PASS"

            # 1) Ensure schema_patch_log exists (no heredocs)
            echo "🔎 Ensuring sentinel table…"
            printf '%s\n' \
              'SET search_path TO directus, public;' \
              'CREATE TABLE IF NOT EXISTS schema_patch_log (' \
              '  patch_key TEXT PRIMARY KEY,' \
              '  applied_at TIMESTAMPTZ NOT NULL DEFAULT now()' \
              ');' \
            | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 >/dev/null

            # 2) Check sentinel; skip schema patch if already applied
            PATCH_KEY="github_profile_cols_v1"
            SKIP_PATCH="0"
            # IMPORTANT: do not prepend `SET search_path ...;` in `-Atc` queries.
            # psql prints `SET` to stdout, which pollutes captured values.
            ALREADY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM directus.schema_patch_log WHERE patch_key='${PATCH_KEY}' LIMIT 1;" || true)"

            if [ "$ALREADY" = "1" ]; then
              echo "✅ Patch already applied; skipping schema changes."
              SKIP_PATCH="1"
            fi

            if [ "$SKIP_PATCH" != "1" ]; then
              # 3) Apply idempotent ALTERs
              echo "🔧 Applying user profile columns…"
              printf '%s\n' \
                'SET search_path TO directus, public;' \
                'ALTER TABLE directus_users' \
                '  ADD COLUMN IF NOT EXISTS github_login    TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_url      TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_company  TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_bio      TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_metadata JSONB;' \
              | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1

              # 4) Record sentinel
              echo "📝 Recording sentinel…"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO schema_patch_log (patch_key) VALUES ('${PATCH_KEY}') ON CONFLICT (patch_key) DO NOTHING;"
            fi

            # 5) Static tokens are provisioned via service users (directus_users.token) in the site bootstrap below.
            echo "🔐 Provisioning Directus static tokens via site service users..."

            # Ensure multi-site columns exist for GitOps-managed row-level site filters.
            # This is idempotent and safe to run every startup.
            echo "🧱 Ensuring multi-site columns exist..."
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               ALTER TABLE IF EXISTS demo_pages ADD COLUMN IF NOT EXISTS site_key TEXT; \
               ALTER TABLE IF EXISTS demo_pages ADD COLUMN IF NOT EXISTS layout_template_key TEXT; \
               ALTER TABLE IF EXISTS demo_pages ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
               ALTER TABLE IF EXISTS demo_page_blocks ADD COLUMN IF NOT EXISTS site_key TEXT; \
               ALTER TABLE IF EXISTS demo_page_blocks ADD COLUMN IF NOT EXISTS page_slug TEXT; \
               ALTER TABLE IF EXISTS demo_page_blocks ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
               ALTER TABLE IF EXISTS demo_block_rich_text ADD COLUMN IF NOT EXISTS site_key TEXT; \
               ALTER TABLE IF EXISTS demo_block_rich_text ADD COLUMN IF NOT EXISTS page_slug TEXT; \
               ALTER TABLE IF EXISTS demo_block_rich_text ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
               ALTER TABLE IF EXISTS demo_block_hero ADD COLUMN IF NOT EXISTS site_key TEXT; \
               ALTER TABLE IF EXISTS demo_block_hero ADD COLUMN IF NOT EXISTS page_slug TEXT; \
               ALTER TABLE IF EXISTS demo_block_hero ADD COLUMN IF NOT EXISTS refresh_target TEXT;"

            # Allow each site to have its own homepage slug (e.g. both can use "home").
            echo "🧱 Ensuring per-site slug uniqueness..."
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               DO \$\$ \
               BEGIN \
                 IF EXISTS ( \
                   SELECT 1 \
                   FROM pg_constraint \
                   WHERE conname = 'demo_pages_slug_unique' \
                     AND conrelid = 'directus.demo_pages'::regclass \
                 ) THEN \
                   ALTER TABLE demo_pages DROP CONSTRAINT demo_pages_slug_unique; \
                 END IF; \
                 IF NOT EXISTS ( \
                   SELECT 1 \
                   FROM pg_constraint \
                   WHERE conname = 'demo_pages_site_slug_unique' \
                     AND conrelid = 'directus.demo_pages'::regclass \
                 ) THEN \
                   ALTER TABLE demo_pages ADD CONSTRAINT demo_pages_site_slug_unique UNIQUE (site_key, slug); \
                 END IF; \
                 IF NOT EXISTS ( \
                   SELECT 1 \
                   FROM pg_constraint \
                   WHERE conname = 'demo_page_blocks_collection_item_unique' \
                     AND conrelid = 'directus.demo_page_blocks'::regclass \
                 ) THEN \
                   IF NOT EXISTS ( \
                     SELECT 1 \
                     FROM demo_page_blocks \
                     GROUP BY collection, item \
                     HAVING COUNT(*) > 1 \
                   ) THEN \
                     ALTER TABLE demo_page_blocks ADD CONSTRAINT demo_page_blocks_collection_item_unique UNIQUE (collection, item); \
                   ELSE \
                     RAISE NOTICE 'Skipping demo_page_blocks_collection_item_unique due to duplicate (collection,item) rows'; \
                   END IF; \
                 END IF; \
               END \
               \$\$;"

            # Keep derived site metadata on junction/content rows aligned to the page they belong to.
            echo "🔄 Syncing site/page metadata onto blocks..."
            _psql_yb_retry() {
              _sql="$1"
              _label="$2"
              _max="${3:-12}"
              _attempt=1
              while :; do
                if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c "SET search_path TO directus, public; ${_sql}" >/tmp/directus-sync-site-metadata.log 2>&1; then
                  cat /tmp/directus-sync-site-metadata.log
                  return 0
                fi
                if grep -Eiq 'current transaction is expired or aborted|YB001|serialization failure|restart read required' /tmp/directus-sync-site-metadata.log; then
                  if [ "${_attempt}" -lt "${_max}" ]; then
                    echo "⚠️ Transient Yugabyte conflict during ${_label} (attempt ${_attempt}/${_max}); retrying..."
                    _attempt=$((_attempt + 1))
                    sleep 2
                    continue
                  fi
                fi
                cat /tmp/directus-sync-site-metadata.log
                echo "⚠️ ${_label} failed after retries."
                return 1
              done
            }

            sync_site_metadata_failed="0"
            if ! _psql_yb_retry "UPDATE demo_pages p
              SET refresh_target = CASE
                WHEN LOWER(COALESCE(p.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(p.refresh_target)
                ELSE 'both'
              END
              WHERE p.refresh_target IS NULL
                 OR LOWER(COALESCE(p.refresh_target, '')) NOT IN ('preview','prod','both')
                 OR p.refresh_target <> LOWER(p.refresh_target);" "normalize demo_pages.refresh_target"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_page_blocks pb
              SET refresh_target = CASE
                WHEN LOWER(COALESCE(pb.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(pb.refresh_target)
                ELSE 'both'
              END
              WHERE pb.refresh_target IS NULL
                 OR LOWER(COALESCE(pb.refresh_target, '')) NOT IN ('preview','prod','both')
                 OR pb.refresh_target <> LOWER(pb.refresh_target);" "normalize demo_page_blocks.refresh_target"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_page_blocks pb
              SET site_key = p.site_key,
                  page_slug = p.slug,
                  refresh_target = p.refresh_target
              FROM demo_pages p
              WHERE pb.page_id = p.id
                AND (pb.site_key IS DISTINCT FROM p.site_key
                  OR pb.page_slug IS DISTINCT FROM p.slug
                  OR pb.refresh_target IS DISTINCT FROM p.refresh_target);" "propagate metadata to demo_page_blocks"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_block_rich_text rt
              SET refresh_target = CASE
                WHEN LOWER(COALESCE(rt.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(rt.refresh_target)
                ELSE 'both'
              END
              WHERE rt.refresh_target IS NULL
                 OR LOWER(COALESCE(rt.refresh_target, '')) NOT IN ('preview','prod','both')
                 OR rt.refresh_target <> LOWER(rt.refresh_target);" "normalize demo_block_rich_text.refresh_target"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_block_rich_text rt
              SET site_key = pb.site_key,
                  page_slug = pb.page_slug,
                  refresh_target = pb.refresh_target
              FROM demo_page_blocks pb
              WHERE pb.collection = 'demo_block_rich_text'
                AND pb.item = rt.id::text
                AND (rt.site_key IS DISTINCT FROM pb.site_key
                  OR rt.page_slug IS DISTINCT FROM pb.page_slug
                  OR rt.refresh_target IS DISTINCT FROM pb.refresh_target);" "propagate metadata to demo_block_rich_text"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_block_hero h
              SET refresh_target = CASE
                WHEN LOWER(COALESCE(h.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(h.refresh_target)
                ELSE 'both'
              END
              WHERE h.refresh_target IS NULL
                 OR LOWER(COALESCE(h.refresh_target, '')) NOT IN ('preview','prod','both')
                 OR h.refresh_target <> LOWER(h.refresh_target);" "normalize demo_block_hero.refresh_target"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "UPDATE demo_block_hero h
              SET site_key = pb.site_key,
                  page_slug = pb.page_slug,
                  refresh_target = pb.refresh_target
              FROM demo_page_blocks pb
              WHERE pb.collection = 'demo_block_hero'
                AND pb.item = h.id::text
                AND (h.site_key IS DISTINCT FROM pb.site_key
                  OR h.page_slug IS DISTINCT FROM pb.page_slug
                  OR h.refresh_target IS DISTINCT FROM pb.refresh_target);" "propagate metadata to demo_block_hero"; then
              sync_site_metadata_failed="1"
            fi
            if ! _psql_yb_retry "DO \$\$
              BEGIN
                IF to_regclass('directus.demo_pages') IS NOT NULL THEN
                  ALTER TABLE demo_pages ALTER COLUMN refresh_target DROP DEFAULT;
                  ALTER TABLE demo_pages ALTER COLUMN refresh_target SET NOT NULL;
                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'demo_pages_refresh_target_check' AND conrelid = 'directus.demo_pages'::regclass) THEN
                    ALTER TABLE demo_pages ADD CONSTRAINT demo_pages_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
                  END IF;
                END IF;
                IF to_regclass('directus.demo_page_blocks') IS NOT NULL THEN
                  ALTER TABLE demo_page_blocks ALTER COLUMN refresh_target DROP DEFAULT;
                  ALTER TABLE demo_page_blocks ALTER COLUMN refresh_target SET NOT NULL;
                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'demo_page_blocks_refresh_target_check' AND conrelid = 'directus.demo_page_blocks'::regclass) THEN
                    ALTER TABLE demo_page_blocks ADD CONSTRAINT demo_page_blocks_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
                  END IF;
                END IF;
                IF to_regclass('directus.demo_block_rich_text') IS NOT NULL THEN
                  ALTER TABLE demo_block_rich_text ALTER COLUMN refresh_target DROP DEFAULT;
                  ALTER TABLE demo_block_rich_text ALTER COLUMN refresh_target SET NOT NULL;
                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'demo_block_rich_text_refresh_target_check' AND conrelid = 'directus.demo_block_rich_text'::regclass) THEN
                    ALTER TABLE demo_block_rich_text ADD CONSTRAINT demo_block_rich_text_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
                  END IF;
                END IF;
                IF to_regclass('directus.demo_block_hero') IS NOT NULL THEN
                  ALTER TABLE demo_block_hero ALTER COLUMN refresh_target DROP DEFAULT;
                  ALTER TABLE demo_block_hero ALTER COLUMN refresh_target SET NOT NULL;
                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'demo_block_hero_refresh_target_check' AND conrelid = 'directus.demo_block_hero'::regclass) THEN
                    ALTER TABLE demo_block_hero ADD CONSTRAINT demo_block_hero_refresh_target_check CHECK (refresh_target IN ('preview','prod','both'));
                  END IF;
                END IF;
              END
              \$\$;" "enforce refresh_target constraints"; then
              sync_site_metadata_failed="1"
            fi
            if [ "${sync_site_metadata_failed}" != "0" ]; then
              echo "⚠️ Some site metadata sync steps failed after retries; continuing startup and retrying on next deploy."
            fi

            echo "🧭 Configuring refresh_target field UX in Directus..."
            DIRECTUS_FIELDS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_fields' LIMIT 1;" || true)"
            if [ "${DIRECTUS_FIELDS_EXISTS:-0}" = "1" ]; then
              DF_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_fields' ORDER BY column_name;" || true)"
              _df_has_col() { printf '%s\n' "$DF_COLS" | grep -qx "$1"; }

              DF_OPTIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_fields' AND column_name='options' LIMIT 1;" || true)"
              DF_DISPLAY_OPTIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_fields' AND column_name='display_options' LIMIT 1;" || true)"

              _df_json_sql() {
                _t="$1"
                _json="$2"
                if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
                  printf "NULL"
                  return
                fi
                _json_sql="$(printf '%s' "$_json" | sed "s/'/''/g")"
                case "$_t" in
                  jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
                  json) printf "'%s'::json" "$_json_sql" ;;
                  text|character\ varying) printf "'%s'" "$_json_sql" ;;
                  *) printf "NULL" ;;
                esac
              }

              refresh_choices_json="$(jq -nc '[
                {"text":"Preview Only","value":"preview","foreground":"#1D4ED8","background":"#DBEAFE"},
                {"text":"Prod Only","value":"prod","foreground":"#92400E","background":"#FEF3C7"},
                {"text":"Both Preview + Prod","value":"both","foreground":"#065F46","background":"#D1FAE5"}
              ]')"
              refresh_options_json="$(jq -nc --argjson choices "${refresh_choices_json}" \
                '{choices:$choices,allowNone:false}')"
              refresh_display_options_json="$(jq -nc --argjson choices "${refresh_choices_json}" \
                '{choices:$choices}')"
              refresh_note="Required: choose where cache refresh runs after save (Preview, Prod, or Both)."
              refresh_note_sql="$(printf '%s' "${refresh_note}" | sed "s/'/''/g")"
              refresh_field_name_sql="$(printf '%s' "refresh_target" | sed "s/'/''/g")"

              _upsert_refresh_target_field_meta() {
                _collection="$1"
                if [ -z "${_collection:-}" ] || [ "${_collection}" = "null" ]; then
                  return 0
                fi

                _collection_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='${_collection}' LIMIT 1;" || true)"
                _collection_exists="$(printf '%s' "$_collection_exists" | tr -d '\r')"
                if [ "${_collection_exists}" != "1" ]; then
                  return 0
                fi

                _collection_sql="$(printf '%s' "${_collection}" | sed "s/'/''/g")"
                _exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus.directus_fields WHERE collection='${_collection_sql}' AND field='refresh_target' LIMIT 1;" || true)"
                _exists="$(printf '%s' "$_exists" | tr -d '\r')"

                _options_sql="$(_df_json_sql "${DF_OPTIONS_TYPE:-}" "${refresh_options_json}")"
                _display_options_sql="$(_df_json_sql "${DF_DISPLAY_OPTIONS_TYPE:-}" "${refresh_display_options_json}")"

                if [ "${_exists}" = "1" ]; then
                  SETS=""
                  if _df_has_col "interface"; then SETS="${SETS},interface='select-dropdown'"; fi
                  if _df_has_col "options"; then SETS="${SETS},options=${_options_sql}"; fi
                  if _df_has_col "display"; then SETS="${SETS},display='labels'"; fi
                  if _df_has_col "display_options"; then SETS="${SETS},display_options=${_display_options_sql}"; fi
                  if _df_has_col "required"; then SETS="${SETS},required=true"; fi
                  if _df_has_col "readonly"; then SETS="${SETS},readonly=false"; fi
                  if _df_has_col "hidden"; then SETS="${SETS},hidden=false"; fi
                  if _df_has_col "width"; then SETS="${SETS},width='full'"; fi
                  if _df_has_col "sort"; then SETS="${SETS},sort=1"; fi
                  if _df_has_col "note"; then SETS="${SETS},note='${refresh_note_sql}'"; fi
                  if [ -n "${SETS:-}" ]; then
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; UPDATE directus_fields SET ${SETS#,} WHERE collection='${_collection_sql}' AND field='refresh_target';"
                    echo "✅ Updated refresh_target field UX on ${_collection}"
                  fi
                  return 0
                fi

                FCOLS="collection,field"
                FVALS="'${_collection_sql}','${refresh_field_name_sql}'"
                if _df_has_col "interface"; then FCOLS="${FCOLS},interface"; FVALS="${FVALS},'select-dropdown'"; fi
                if _df_has_col "options"; then FCOLS="${FCOLS},options"; FVALS="${FVALS},${_options_sql}"; fi
                if _df_has_col "display"; then FCOLS="${FCOLS},display"; FVALS="${FVALS},'labels'"; fi
                if _df_has_col "display_options"; then FCOLS="${FCOLS},display_options"; FVALS="${FVALS},${_display_options_sql}"; fi
                if _df_has_col "required"; then FCOLS="${FCOLS},required"; FVALS="${FVALS},true"; fi
                if _df_has_col "readonly"; then FCOLS="${FCOLS},readonly"; FVALS="${FVALS},false"; fi
                if _df_has_col "hidden"; then FCOLS="${FCOLS},hidden"; FVALS="${FVALS},false"; fi
                if _df_has_col "width"; then FCOLS="${FCOLS},width"; FVALS="${FVALS},'full'"; fi
                if _df_has_col "sort"; then FCOLS="${FCOLS},sort"; FVALS="${FVALS},1"; fi
                if _df_has_col "note"; then FCOLS="${FCOLS},note"; FVALS="${FVALS},'${refresh_note_sql}'"; fi

                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; INSERT INTO directus_fields (${FCOLS}) VALUES (${FVALS});"
                echo "✅ Created refresh_target field UX on ${_collection}"
              }

              _upsert_refresh_target_field_meta "demo_pages"
              _upsert_refresh_target_field_meta "demo_page_blocks"
              _upsert_refresh_target_field_meta "demo_block_rich_text"
              _upsert_refresh_target_field_meta "demo_block_hero"
            else
              echo "  └─ directus_fields metadata table not found; skipping refresh_target UX config"
            fi

            # 5b) Ensure layout template collection exists and seed templates from GitOps config.
            echo "🧱 Ensuring demo_layout_templates exists..."
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               CREATE TABLE IF NOT EXISTS demo_layout_templates ( \
                 id UUID PRIMARY KEY, \
                 template_key TEXT NOT NULL, \
                 name TEXT NOT NULL, \
                 description TEXT NULL, \
                 status TEXT NOT NULL DEFAULT 'draft', \
                 site_key TEXT NULL, \
                 html TEXT NOT NULL, \
                 css TEXT NULL, \
                 date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
                 date_updated TIMESTAMPTZ NULL \
               ); \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS template_key TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS name TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS description TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS status TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS site_key TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS html TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS css TEXT; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
               ALTER TABLE IF EXISTS demo_layout_templates ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
               ALTER TABLE IF EXISTS demo_layout_templates ALTER COLUMN status SET DEFAULT 'draft'; \
               ALTER TABLE IF EXISTS demo_layout_templates ALTER COLUMN date_created SET DEFAULT now(); \
               DO \$\$ \
               BEGIN \
                 IF EXISTS ( \
                   SELECT 1 \
                   FROM pg_constraint \
                   WHERE conname = 'demo_layout_templates_template_key_unique' \
                     AND conrelid = 'directus.demo_layout_templates'::regclass \
                 ) THEN \
                   ALTER TABLE demo_layout_templates DROP CONSTRAINT demo_layout_templates_template_key_unique; \
                 END IF; \
                 IF NOT EXISTS ( \
                   SELECT 1 \
                   FROM pg_indexes \
                   WHERE schemaname = 'directus' \
                     AND indexname = 'demo_layout_templates_scope_template_unique' \
                 ) THEN \
                   IF NOT EXISTS ( \
                     SELECT 1 \
                     FROM ( \
                       SELECT COALESCE(site_key, '') AS site_scope, template_key, COUNT(*) AS c \
                       FROM demo_layout_templates \
                       GROUP BY COALESCE(site_key, ''), template_key \
                       HAVING COUNT(*) > 1 \
                     ) dups \
                   ) THEN \
                     CREATE UNIQUE INDEX demo_layout_templates_scope_template_unique \
                     ON demo_layout_templates (COALESCE(site_key, ''), template_key); \
                   ELSE \
                     RAISE NOTICE 'Skipping demo_layout_templates_scope_template_unique due to duplicate (site_key,template_key) rows'; \
                   END IF; \
                 END IF; \
               END \
               \$\$;"

            LAYOUTS_FILE="/directus-layout-templates/templates.yaml"
            if [ -f "$LAYOUTS_FILE" ]; then
              LAYOUTS_JSON="$(yq -o=json '.' "$LAYOUTS_FILE" 2>/dev/null || true)"
              if printf '%s' "$LAYOUTS_JSON" | jq -e '.templates | type=="array" and length>0' >/dev/null 2>&1; then
                printf '%s' "$LAYOUTS_JSON" | jq -c '.templates[]' | while IFS= read -r tpl; do
                  tpl_key="$(printf '%s' "$tpl" | jq -r '.template_key // empty')"
                  tpl_name="$(printf '%s' "$tpl" | jq -r '.name // empty')"
                  tpl_status="$(printf '%s' "$tpl" | jq -r '.status // "published"')"
                  tpl_desc="$(printf '%s' "$tpl" | jq -r '.description // empty')"
                  tpl_site="$(printf '%s' "$tpl" | jq -r 'if .site_key == null then "" else (.site_key | tostring) end')"
                  tpl_html="$(printf '%s' "$tpl" | jq -r '.html // empty')"
                  tpl_css="$(printf '%s' "$tpl" | jq -r '.css // empty')"
                  tpl_html_file="$(printf '%s' "$tpl" | jq -r '.html_file // empty')"
                  tpl_css_file="$(printf '%s' "$tpl" | jq -r '.css_file // empty')"

                  if [ -z "${tpl_html:-}" ] && [ -n "${tpl_html_file:-}" ]; then
                    case "$tpl_html_file" in
                      /*|*..*)
                        echo "⚠️  skipping template '${tpl_key}': invalid html_file path '${tpl_html_file}'"
                        continue
                        ;;
                    esac
                    tpl_html_path="/directus-layout-templates/${tpl_html_file}"
                    if [ ! -f "$tpl_html_path" ]; then
                      echo "⚠️  skipping template '${tpl_key}': html file not found at ${tpl_html_path}"
                      continue
                    fi
                    tpl_html="$(cat "$tpl_html_path")"
                  fi

                  if [ -z "${tpl_css:-}" ] && [ -n "${tpl_css_file:-}" ]; then
                    case "$tpl_css_file" in
                      /*|*..*)
                        echo "⚠️  template '${tpl_key}' has invalid css_file path '${tpl_css_file}'; ignoring css"
                        tpl_css=""
                        ;;
                      *)
                        tpl_css_path="/directus-layout-templates/${tpl_css_file}"
                        if [ -f "$tpl_css_path" ]; then
                          tpl_css="$(cat "$tpl_css_path")"
                        else
                          echo "⚠️  template '${tpl_key}' css file not found at ${tpl_css_path}; continuing without css"
                          tpl_css=""
                        fi
                        ;;
                    esac
                  fi

                  if [ -z "${tpl_key:-}" ] || [ -z "${tpl_name:-}" ] || [ -z "${tpl_html:-}" ]; then
                    echo "⚠️  skipping invalid layout template entry (template_key/name/html required)"
                    continue
                  fi

                  tpl_key_sql="$(printf '%s' "$tpl_key" | sed "s/'/''/g")"
                  tpl_name_sql="$(printf '%s' "$tpl_name" | sed "s/'/''/g")"
                  tpl_status_sql="$(printf '%s' "$tpl_status" | sed "s/'/''/g")"
                  tpl_html_sql="$(printf '%s' "$tpl_html" | sed "s/'/''/g")"

                  tpl_desc_sql="NULL"
                  if [ -n "${tpl_desc:-}" ]; then
                    tpl_desc_esc="$(printf '%s' "$tpl_desc" | sed "s/'/''/g")"
                    tpl_desc_sql="'${tpl_desc_esc}'"
                  fi

                  tpl_site_sql="NULL"
                  tpl_scope_condition="site_key IS NULL"
                  if [ -n "${tpl_site:-}" ]; then
                    tpl_site_esc="$(printf '%s' "$tpl_site" | sed "s/'/''/g")"
                    tpl_site_sql="'${tpl_site_esc}'"
                    tpl_scope_condition="site_key='${tpl_site_esc}'"
                  fi

                  tpl_css_sql="NULL"
                  if [ -n "${tpl_css:-}" ]; then
                    tpl_css_esc="$(printf '%s' "$tpl_css" | sed "s/'/''/g")"
                    tpl_css_sql="'${tpl_css_esc}'"
                  fi

                  existing_tpl_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT id FROM directus.demo_layout_templates WHERE template_key='${tpl_key_sql}' AND ${tpl_scope_condition} LIMIT 1;" || true)"
                  existing_tpl_id="$(printf '%s' "$existing_tpl_id" | tr -d '\r')"

                  if [ -n "${existing_tpl_id:-}" ] && [ "${existing_tpl_id}" != "null" ]; then
                    existing_tpl_id_sql="$(printf '%s' "$existing_tpl_id" | sed "s/'/''/g")"
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; \
                       UPDATE demo_layout_templates \
                       SET name='${tpl_name_sql}', \
                           description=${tpl_desc_sql}, \
                           status='${tpl_status_sql}', \
                           site_key=${tpl_site_sql}, \
                           html='${tpl_html_sql}', \
                           css=${tpl_css_sql}, \
                           date_updated=now() \
                       WHERE id='${existing_tpl_id_sql}';"
                    echo "✅ Reconciled layout template '${tpl_key}'"
                  else
                    new_tpl_id="$(cat /proc/sys/kernel/random/uuid)"
                    new_tpl_id_sql="$(printf '%s' "$new_tpl_id" | sed "s/'/''/g")"
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; \
                       INSERT INTO demo_layout_templates (id, template_key, name, description, status, site_key, html, css, date_created, date_updated) \
                       VALUES ('${new_tpl_id_sql}','${tpl_key_sql}','${tpl_name_sql}',${tpl_desc_sql},'${tpl_status_sql}',${tpl_site_sql},'${tpl_html_sql}',${tpl_css_sql},now(),now());"
                    echo "✅ Seeded layout template '${tpl_key}'"
                  fi
                done
              else
                echo "  └─ no templates configured in ${LAYOUTS_FILE}; skipping"
              fi
            else
              echo "  └─ ${LAYOUTS_FILE} not found; skipping"
            fi

            # 5c) Provision site-specific roles/policies/users/tokens/permissions (GitOps-driven).
            # - Keycloak `azp` (client id) -> Vault token -> Directus service user token.
            # - GraphQL schema/actions are permission-filtered; seed baseline read perms per site policy.
            echo "🧭 Provisioning Directus sites (roles/policies/users/permissions)..."
            SITES_FILE="/directus-sites/sites.yaml"
            if [ -f "$SITES_FILE" ]; then
              SITES_JSON="$(yq -o=json '.' "$SITES_FILE" 2>/dev/null || true)"
              if printf '%s' "$SITES_JSON" | jq -e '.sites | type=="array" and length>0' >/dev/null 2>&1; then
                ROLE_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_roles' ORDER BY column_name;" || true)"
                _has_role_col() { printf '%s\n' "$ROLE_COLS_ALL" | grep -qx "$1"; }

                POLICY_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_policies' LIMIT 1;" || true)"
                POLICY_COLS_ALL=""
                if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
                  POLICY_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_policies' ORDER BY column_name;" || true)"
                fi
                _has_policy_col() { printf '%s\n' "$POLICY_COLS_ALL" | grep -qx "$1"; }

                ACCESS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_access' LIMIT 1;" || true)"
                ACCESS_COLS_ALL=""
                if [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
                  ACCESS_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_access' ORDER BY column_name;" || true)"
                fi
                _has_access_col() { printf '%s\n' "$ACCESS_COLS_ALL" | grep -qx "$1"; }

                USER_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
                _has_user_col() { printf '%s\n' "$USER_COLS_ALL" | grep -qx "$1"; }

                PERM_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_permissions' LIMIT 1;" || true)"
                PERM_COLS_ALL=""
                PERM_FIELDS_TYPE=""
                PERMISSIONS_TYPE=""
                VALIDATION_TYPE=""
                PRESETS_TYPE=""
                PERM_ID_DEFAULT=""
                PERM_ID_HAS_DEFAULT="0"
                PERM_PRINC_COL=""
                if [ "${PERM_TABLE_EXISTS:-0}" = "1" ]; then
                  PERM_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' ORDER BY column_name;" || true)"
                  _has_perm_col() { printf '%s\n' "$PERM_COLS_ALL" | grep -qx "$1"; }
                  PERM_FIELDS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT data_type || ':' || udt_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='fields' LIMIT 1;" || true)"
                  PERMISSIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='permissions' LIMIT 1;" || true)"
                  VALIDATION_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='validation' LIMIT 1;" || true)"
                  PRESETS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='presets' LIMIT 1;" || true)"
                  PERM_ID_DEFAULT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT column_default FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='id' LIMIT 1;" || true)"
                  if [ -n "${PERM_ID_DEFAULT:-}" ] && [ "${PERM_ID_DEFAULT}" != "null" ]; then
                    PERM_ID_HAS_DEFAULT="1"
                  fi
                  if _has_perm_col "policy"; then
                    PERM_PRINC_COL="policy"
                  elif _has_perm_col "role"; then
                    PERM_PRINC_COL="role"
                  elif _has_perm_col "role_id"; then
                    PERM_PRINC_COL="role_id"
                  elif _has_perm_col "policy_id"; then
                    PERM_PRINC_COL="policy_id"
                  fi
                else
                  _has_perm_col() { return 1; }
                fi

                _json_empty_for_type() {
                  _t="$1"
                  case "$_t" in
                    jsonb) printf "'{}'::jsonb" ;;
                    json) printf "'{}'::json" ;;
                    *) printf "NULL" ;;
                  esac
                }

                _fields_value_for_type() {
                  _t="$1"
                  case "$_t" in
                    ARRAY:*) printf "ARRAY['*']::text[]" ;;
                    jsonb:*|jsonb) printf "'[\"*\"]'::jsonb" ;;
                    json:*|json) printf "'[\"*\"]'::json" ;;
                    text:*|text|character\ varying:*|character\ varying) printf "'*'" ;;
                    *) printf "NULL" ;;
                  esac
                }

                _json_value_for_type() {
                  _t="$1"
                  _json="$2"
                  if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
                    _json_empty_for_type "$_t"
                    return
                  fi
                  _json_compact="$(printf '%s' "$_json" | jq -c '.' 2>/dev/null || true)"
                  if [ -z "${_json_compact:-}" ] || [ "${_json_compact}" = "null" ]; then
                    _json_empty_for_type "$_t"
                    return
                  fi
                  _json_sql="$(printf '%s' "$_json_compact" | sed "s/'/''/g")"
                  case "$_t" in
                    jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
                    json) printf "'%s'::json" "$_json_sql" ;;
                    *) printf "NULL" ;;
                  esac
                }

                _fields_value_from_config_for_type() {
                  _t="$1"
                  _cfg="$2"
                  if [ -z "${_cfg:-}" ] || [ "${_cfg}" = "null" ]; then
                    _fields_value_for_type "$_t"
                    return
                  fi
                  _fields_json="$(printf '%s' "$_cfg" | jq -c 'if type=="array" then map(tostring) elif type=="string" then [.] else null end' 2>/dev/null || true)"
                  if [ -z "${_fields_json:-}" ] || [ "${_fields_json}" = "null" ]; then
                    _fields_value_for_type "$_t"
                    return
                  fi
                  case "$_t" in
                    ARRAY:*)
                      _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
                      if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                        printf "ARRAY['*']::text[]"
                      else
                        _arr_sql="$(printf '%s' "$_csv" | sed "s/'/''/g;s/,/','/g")"
                        printf "ARRAY['%s']::text[]" "$_arr_sql"
                      fi
                      ;;
                    jsonb:*|jsonb)
                      _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
                      printf "'%s'::jsonb" "$_fields_sql"
                      ;;
                    json:*|json)
                      _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
                      printf "'%s'::json" "$_fields_sql"
                      ;;
                    text:*|text|character\ varying:*|character\ varying)
                      _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
                      if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                        _csv='*'
                      fi
                      _csv_sql="$(printf '%s' "$_csv" | sed "s/'/''/g")"
                      printf "'%s'" "$_csv_sql"
                      ;;
                    *)
                      printf "NULL"
                      ;;
                  esac
                }

                DIRECTUS_API_BASE="http://127.0.0.1:8055"
                DIRECTUS_ACCESS_TOKEN=""
                _directus_api_enabled="0"

                _directus_api_get() {
                  _path="$1"
                  shift || true
                  curl -sS -f \
                    -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
                    --get "${DIRECTUS_API_BASE}${_path}" "$@"
                }

                _directus_api_write() {
                  _method="$1"
                  _path="$2"
                  _payload="$3"
                  curl -sS -f -X "${_method}" \
                    -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d "${_payload}" \
                    "${DIRECTUS_API_BASE}${_path}"
                }

                _directus_find_flow_id_by_name() {
                  _name="$1"
                  _id="$(_directus_api_get "/flows" \
                    --data-urlencode "filter[name][_eq]=${_name}" \
                    --data-urlencode "limit=1" \
                    --data-urlencode "fields=id" \
                    2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
                  printf '%s' "${_id:-}"
                }

                _directus_find_operation_id() {
                  _flow_id="$1"
                  _key="$2"
                  _id="$(_directus_api_get "/operations" \
                    --data-urlencode "filter[flow][_eq]=${_flow_id}" \
                    --data-urlencode "filter[key][_eq]=${_key}" \
                    --data-urlencode "limit=1" \
                    --data-urlencode "fields=id" \
                    2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
                  printf '%s' "${_id:-}"
                }

                _directus_upsert_operation() {
                  _flow_id="$1"
                  _op_key="$2"
                  _op_type="$3"
                  _op_name="$4"
                  _pos_x="$5"
                  _pos_y="$6"
                  _options_json="$7"

                  _op_id="$(_directus_find_operation_id "${_flow_id}" "${_op_key}")"
                  _create_payload="$(jq -nc \
                    --arg flow "${_flow_id}" \
                    --arg key "${_op_key}" \
                    --arg type "${_op_type}" \
                    --arg name "${_op_name}" \
                    --argjson position_x "${_pos_x}" \
                    --argjson position_y "${_pos_y}" \
                    --argjson options "${_options_json}" \
                    '{flow:$flow,key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options,resolve:null,reject:null}')"
                  _update_payload="$(jq -nc \
                    --arg key "${_op_key}" \
                    --arg type "${_op_type}" \
                    --arg name "${_op_name}" \
                    --argjson position_x "${_pos_x}" \
                    --argjson position_y "${_pos_y}" \
                    --argjson options "${_options_json}" \
                    '{key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options,resolve:null,reject:null}')"

                  if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
                    _directus_api_write "PATCH" "/operations/${_op_id}" "${_update_payload}" >/tmp/directus-op-upsert.json 2>/dev/null || true
                    printf '%s' "${_op_id}"
                    return
                  fi

                  _created="$(_directus_api_write "POST" "/operations" "${_create_payload}" 2>/dev/null || true)"
                  _op_id="$(printf '%s' "${_created}" | jq -r '.data.id // empty' 2>/dev/null || true)"
                  printf '%s' "${_op_id:-}"
                }

                _directus_set_operation_links() {
                  _op_id="$1"
                  _resolve="$2"
                  _reject="$3"
                  if [ -z "${_op_id:-}" ] || [ "${_op_id}" = "null" ]; then
                    return 0
                  fi
                  _payload="$(jq -nc --arg resolve "${_resolve}" --arg reject "${_reject}" \
                    '{resolve:(if $resolve=="" then null else $resolve end),reject:(if $reject=="" then null else $reject end)}')"
                  _directus_api_write "PATCH" "/operations/${_op_id}" "${_payload}" >/tmp/directus-op-links.json 2>/dev/null || true
                }

                _vault_kv_read_field() {
                  _path="$1"
                  _field="$2"
                  if [ -z "${_path:-}" ] || [ "${_path}" = "null" ] || [ -z "${_field:-}" ] || [ "${_field}" = "null" ]; then
                    return 1
                  fi
                  _response="$(curl -sS -f -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${_path}" 2>/dev/null || true)"
                  if [ -z "${_response:-}" ]; then
                    return 1
                  fi
                  _value="$(printf '%s' "${_response}" | jq -r --arg field "${_field}" '.data.data[$field] // empty' 2>/dev/null || true)"
                  _value="$(printf '%s' "${_value}" | tr -d '\r')"
                  if [ -z "${_value:-}" ] || [ "${_value}" = "null" ]; then
                    return 1
                  fi
                  printf '%s' "${_value}"
                }

                _urlencode_value() {
                  _raw="$1"
                  jq -nr --arg v "${_raw}" '$v|@uri' 2>/dev/null || true
                }

                _directus_verify_token() {
                  _candidate="$1"
                  if [ -z "${_candidate:-}" ] || [ "${_candidate}" = "null" ]; then
                    return 1
                  fi
                  _verify_code="$(curl -sS -o /tmp/directus-token-verify.json -w '%{http_code}' \
                    -H "Authorization: Bearer ${_candidate}" \
                    "${DIRECTUS_API_BASE}/users/me" || true)"
                  [ "${_verify_code}" = "200" ]
                }

                echo "🔐 Preparing Directus API token for flow provisioning..."
                DIRECTUS_FLOW_API_TOKEN_VAULT_PATH="${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/openapi/admin}"

                FLOW_TOKEN_CODE="$(curl -sS -o /tmp/directus-flow-token.json -w '%{http_code}' \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
                if [ "${FLOW_TOKEN_CODE}" = "200" ]; then
                  DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.data.token // empty' /tmp/directus-flow-token.json 2>/dev/null || true)"
                fi

                if _directus_verify_token "${DIRECTUS_ACCESS_TOKEN:-}"; then
                  _directus_api_enabled="1"
                  echo "✅ Directus API token acquired from Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
                else
                  if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
                    echo "⚠️ Vault token at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH} is invalid for Directus API; rotating token"
                  else
                    echo "ℹ️ No Directus API token found at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}; creating one"
                  fi

                  if _has_user_col "token"; then
                    FLOW_ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                      "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
                    FLOW_ADMIN_ROLE_ID="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | tr -d '\r')"
                    if [ -n "${FLOW_ADMIN_ROLE_ID:-}" ] && [ "${FLOW_ADMIN_ROLE_ID}" != "null" ]; then
                      flow_admin_email="svc-flow-admin@svc.local"
                      flow_admin_email_sql="$(printf '%s' "$flow_admin_email" | sed "s/'/''/g")"
                      FLOW_ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                        "SELECT id FROM directus.directus_users WHERE email = '${flow_admin_email_sql}' LIMIT 1;" || true)"
                      FLOW_ADMIN_USER_ID="$(printf '%s' "$FLOW_ADMIN_USER_ID" | tr -d '\r')"

                      FLOW_ADMIN_TOKEN="${DIRECTUS_ACCESS_TOKEN:-}"
                      if [ -z "${FLOW_ADMIN_TOKEN:-}" ] || [ "${FLOW_ADMIN_TOKEN}" = "null" ]; then
                        FLOW_ADMIN_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                      fi
                      flow_admin_role_sql="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | sed "s/'/''/g")"
                      flow_admin_token_sql="$(printf '%s' "$FLOW_ADMIN_TOKEN" | sed "s/'/''/g")"

                      if [ -z "${FLOW_ADMIN_USER_ID:-}" ] || [ "${FLOW_ADMIN_USER_ID}" = "null" ]; then
                        FLOW_ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                        UCOLS="id,email"
                        UVALS="'${FLOW_ADMIN_USER_ID}','${flow_admin_email_sql}'"
                        if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${flow_admin_role_sql}'"; fi
                        if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${flow_admin_token_sql}'"; fi
                        if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                        if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                        if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'flow-admin'"; fi
                        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                          "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                        echo "✅ Created flow admin service user ${flow_admin_email}"
                      else
                        flow_admin_user_id_sql="$(printf '%s' "$FLOW_ADMIN_USER_ID" | sed "s/'/''/g")"
                        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                          "SET search_path TO directus, public; UPDATE directus_users SET role='${flow_admin_role_sql}', token='${flow_admin_token_sql}', status='active' WHERE id='${flow_admin_user_id_sql}';"
                        echo "✅ Updated flow admin service user ${flow_admin_email}"
                      fi

                      payload="$(jq -nc --arg t "$FLOW_ADMIN_TOKEN" '{data:{token:$t}}')"
                      FLOW_TOKEN_WRITE_CODE="$(curl -sS -o /tmp/directus-flow-token-write.json -w '%{http_code}' -X POST \
                        -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                        -d "${payload}" "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
                      if [ "${FLOW_TOKEN_WRITE_CODE}" = "200" ] || [ "${FLOW_TOKEN_WRITE_CODE}" = "204" ]; then
                        echo "✅ Directus flow API token stored in Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
                      else
                        echo "⚠️ Failed to write Directus flow API token to Vault (HTTP ${FLOW_TOKEN_WRITE_CODE})"
                      fi

                      if _directus_verify_token "${FLOW_ADMIN_TOKEN:-}"; then
                        DIRECTUS_ACCESS_TOKEN="${FLOW_ADMIN_TOKEN}"
                        _directus_api_enabled="1"
                        echo "✅ Directus API token prepared for flow reconciliation"
                      else
                        echo "⚠️ Generated Directus flow token did not authenticate; will attempt legacy login fallback"
                      fi
                    else
                      echo "⚠️ Administrator role not found; cannot mint Directus API token for flow reconciliation"
                    fi
                  else
                    echo "⚠️ directus_users.token column not found; cannot mint Directus API token for flow reconciliation"
                  fi
                fi

                # Fallback for environments that still allow local email/password auth.
                if [ "${_directus_api_enabled}" != "1" ]; then
                  ADMIN_CREDS_CODE="$(curl -sS -o /tmp/directus-admin-creds.json -w '%{http_code}' \
                    -H "X-Vault-Token: ${VAULT_TOKEN}" \
                    "${VAULT_ADDR}/v1/secret/data/directus/admin" || true)"
                  if [ "${ADMIN_CREDS_CODE}" = "200" ]; then
                    DIRECTUS_ADMIN_EMAIL="$(jq -r '.data.data.email // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
                    DIRECTUS_ADMIN_PASSWORD="$(jq -r '.data.data.password // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
                    if [ -n "${DIRECTUS_ADMIN_EMAIL:-}" ] && [ -n "${DIRECTUS_ADMIN_PASSWORD:-}" ] \
                      && [ "${DIRECTUS_ADMIN_EMAIL}" != "null" ] && [ "${DIRECTUS_ADMIN_PASSWORD}" != "null" ]; then
                      LOGIN_PAYLOAD="$(jq -nc --arg email "${DIRECTUS_ADMIN_EMAIL}" --arg password "${DIRECTUS_ADMIN_PASSWORD}" '{email:$email,password:$password}')"
                      LOGIN_CODE="$(curl -sS -o /tmp/directus-login.json -w '%{http_code}' -X POST \
                        -H "Content-Type: application/json" \
                        -d "${LOGIN_PAYLOAD}" \
                        "${DIRECTUS_API_BASE}/auth/login" || true)"
                      if [ "${LOGIN_CODE}" = "200" ]; then
                        DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.access_token // empty' /tmp/directus-login.json 2>/dev/null || true)"
                        if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
                          _directus_api_enabled="1"
                          echo "✅ Directus API token acquired from /auth/login fallback"
                        else
                          echo "⚠️ Directus login succeeded but no access_token returned; skipping flow reconciliation"
                        fi
                      else
                        echo "⚠️ Directus login fallback failed (HTTP ${LOGIN_CODE}); skipping flow reconciliation"
                      fi
                    else
                      echo "⚠️ Vault secret secret/data/directus/admin missing email/password; skipping flow reconciliation"
                    fi
                  else
                    echo "⚠️ Could not read secret/data/directus/admin from Vault (HTTP ${ADMIN_CREDS_CODE}); skipping flow reconciliation"
                  fi
                fi

                printf '%s' "$SITES_JSON" | jq -c '.sites[]' | while IFS= read -r site; do
                  site_key="$(printf '%s' "$site" | jq -r '.site_key // .key // empty')"
                  homepage_slug="$(printf '%s' "$site" | jq -r '.homepage_slug // "home"')"
                  homepage_layout_template_key="$(printf '%s' "$site" | jq -r '.homepage_layout_template_key // .layout_template_key // "spa-default"')"
                  client_key="$(printf '%s' "$site" | jq -r '.client_key // .clientId // empty')"
                  role_name="$(printf '%s' "$site" | jq -r '.role_name // .role // empty')"

                  if [ -z "${client_key:-}" ] || [ "${client_key}" = "null" ]; then
                    echo "⚠️  site entry missing client_key; skipping (site_key=${site_key})"
                    continue
                  fi
                  if [ -z "${role_name:-}" ] || [ "${role_name}" = "null" ]; then
                    role_name="$client_key"
                  fi
                  if ! printf '%s' "$client_key" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
                    echo "⚠️  invalid client_key '${client_key}' (site_key=${site_key}); skipping"
                    continue
                  fi

                  if [ -z "${homepage_slug:-}" ] || [ "${homepage_slug}" = "null" ]; then
                    homepage_slug="home"
                  fi
                  if [ -z "${homepage_layout_template_key:-}" ] || [ "${homepage_layout_template_key}" = "null" ]; then
                    homepage_layout_template_key=""
                  fi

                  # Ensure each site has a homepage row keyed by (site_key, homepage_slug).
                  # If absent, claim an unscoped page first; otherwise clone page metadata from any existing slug match.
                  if [ -n "${site_key:-}" ] && [ "${site_key}" != "null" ]; then
                    site_key_sql="$(printf '%s' "$site_key" | sed "s/'/''/g")"
                    homepage_slug_sql="$(printf '%s' "$homepage_slug" | sed "s/'/''/g")"
                    homepage_layout_template_key_sql=""
                    homepage_layout_template_value_sql="NULL"
                    if [ -n "${homepage_layout_template_key:-}" ]; then
                      homepage_layout_template_key_sql="$(printf '%s' "$homepage_layout_template_key" | sed "s/'/''/g")"
                      homepage_layout_template_value_sql="'${homepage_layout_template_key_sql}'"
                    fi

                    HOME_PAGE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                      "SELECT id FROM directus.demo_pages WHERE site_key='${site_key_sql}' AND slug='${homepage_slug_sql}' LIMIT 1;" || true)"
                    HOME_PAGE_ID="$(printf '%s' "$HOME_PAGE_ID" | tr -d '\r')"

                    if [ -z "${HOME_PAGE_ID:-}" ] || [ "${HOME_PAGE_ID}" = "null" ]; then
                      UNSCOPED_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                        "SELECT id FROM directus.demo_pages WHERE slug='${homepage_slug_sql}' AND (site_key IS NULL OR site_key='') ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST LIMIT 1;" || true)"
                      UNSCOPED_ID="$(printf '%s' "$UNSCOPED_ID" | tr -d '\r')"

                      if [ -n "${UNSCOPED_ID:-}" ] && [ "${UNSCOPED_ID}" != "null" ]; then
                        unscoped_id_sql="$(printf '%s' "$UNSCOPED_ID" | sed "s/'/''/g")"
                        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                          "SET search_path TO directus, public; UPDATE demo_pages SET site_key='${site_key_sql}' WHERE id='${unscoped_id_sql}';"
                        HOME_PAGE_ID="$UNSCOPED_ID"
                        echo "✅ Assigned existing homepage slug='${homepage_slug}' to site_key='${site_key}'"
                      else
                        SEED_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                          "SELECT id FROM directus.demo_pages WHERE slug='${homepage_slug_sql}' ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST LIMIT 1;" || true)"
                        SEED_ID="$(printf '%s' "$SEED_ID" | tr -d '\r')"
                        NEW_HOME_ID="$(cat /proc/sys/kernel/random/uuid)"
                        new_home_sql="$(printf '%s' "$NEW_HOME_ID" | sed "s/'/''/g")"

                        if [ -n "${SEED_ID:-}" ] && [ "${SEED_ID}" != "null" ]; then
                          seed_id_sql="$(printf '%s' "$SEED_ID" | sed "s/'/''/g")"
                          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                            "SET search_path TO directus, public; INSERT INTO demo_pages (id, slug, title, status, seo_title, seo_description, parent, site_key, layout_template_key, refresh_target) SELECT '${new_home_sql}', slug, title, status, seo_title, seo_description, parent, '${site_key_sql}', layout_template_key, CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM demo_pages WHERE id='${seed_id_sql}';"

                          # Clone supported homepage blocks so the new site homepage has immediate content.
                          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -AtF '|' -c \
                            "SELECT collection, item, COALESCE(sort, 0) FROM directus.demo_page_blocks WHERE page_id='${seed_id_sql}' ORDER BY sort NULLS LAST, id;" \
                            | while IFS='|' read -r blk_collection blk_item blk_sort; do
                                [ -z "${blk_collection:-}" ] && continue
                                [ -z "${blk_item:-}" ] && continue

                                src_item_sql="$(printf '%s' "$blk_item" | sed "s/'/''/g")"
                                new_item_id="$(cat /proc/sys/kernel/random/uuid)"
                                new_item_sql="$(printf '%s' "$new_item_id" | sed "s/'/''/g")"
                                copied="0"

                                case "$blk_collection" in
                                  demo_block_rich_text)
                                    copied="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                                      "WITH ins AS (INSERT INTO directus.demo_block_rich_text (id, status, sort, body, site_key, page_slug, refresh_target) SELECT '${new_item_sql}', status, sort, body, '${site_key_sql}', '${homepage_slug_sql}', CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM directus.demo_block_rich_text WHERE id='${src_item_sql}' RETURNING 1) SELECT COALESCE(COUNT(*),0) FROM ins;" || true)"
                                    ;;
                                  demo_block_hero)
                                    copied="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                                      "WITH ins AS (INSERT INTO directus.demo_block_hero (id, status, sort, headline, subheadline, background_image, cta_label, cta_url, site_key, page_slug, refresh_target) SELECT '${new_item_sql}', status, sort, headline, subheadline, background_image, cta_label, cta_url, '${site_key_sql}', '${homepage_slug_sql}', CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM directus.demo_block_hero WHERE id='${src_item_sql}' RETURNING 1) SELECT COALESCE(COUNT(*),0) FROM ins;" || true)"
                                    ;;
                                  *)
                                    echo "⚠️  skipping unsupported block collection '${blk_collection}' for site_key='${site_key}'"
                                    continue
                                    ;;
                                esac

                                copied="$(printf '%s' "$copied" | tr -d '\r')"
                                if [ "${copied:-0}" != "1" ]; then
                                  echo "⚠️  source block item '${blk_item}' missing for collection '${blk_collection}'; skipping"
                                  continue
                                fi

                                new_pb_id="$(cat /proc/sys/kernel/random/uuid)"
                                new_pb_sql="$(printf '%s' "$new_pb_id" | sed "s/'/''/g")"
                                blk_coll_sql="$(printf '%s' "$blk_collection" | sed "s/'/''/g")"
                                sort_sql="NULL"
                                if [ -n "${blk_sort:-}" ] && [ "${blk_sort}" != "null" ] && printf '%s' "$blk_sort" | grep -Eq '^-?[0-9]+$'; then
                                  sort_sql="$blk_sort"
                                fi
                                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                                  "SET search_path TO directus, public; INSERT INTO demo_page_blocks (id, page_id, collection, item, sort, site_key, page_slug, refresh_target) VALUES ('${new_pb_sql}', '${new_home_sql}', '${blk_coll_sql}', '${new_item_sql}', ${sort_sql}, '${site_key_sql}', '${homepage_slug_sql}', 'both');"
                              done

                          echo "✅ Cloned homepage metadata + supported blocks for site_key='${site_key}'"
                        else
                          title_sql="$(printf '%s' "${site_key} Home" | sed "s/'/''/g")"
                          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                            "SET search_path TO directus, public; INSERT INTO demo_pages (id, slug, title, status, site_key, layout_template_key, refresh_target) VALUES ('${new_home_sql}','${homepage_slug_sql}','${title_sql}','published','${site_key_sql}',${homepage_layout_template_value_sql},'both');"
                          echo "✅ Created default homepage for site_key='${site_key}'"
                        fi
                        HOME_PAGE_ID="$NEW_HOME_ID"
                      fi
                    fi

                    # Keep derived metadata aligned for this site's homepage content graph.
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; \
                       UPDATE demo_pages p \
                       SET refresh_target = CASE \
                         WHEN LOWER(COALESCE(p.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(p.refresh_target) \
                         ELSE 'both' \
                       END \
                       WHERE p.site_key='${site_key_sql}' \
                         AND p.slug='${homepage_slug_sql}' \
                         AND (p.refresh_target IS NULL OR LOWER(COALESCE(p.refresh_target, '')) NOT IN ('preview','prod','both') OR p.refresh_target <> LOWER(p.refresh_target)); \
                       UPDATE demo_page_blocks pb \
                       SET site_key = p.site_key, page_slug = p.slug, refresh_target = p.refresh_target \
                       FROM demo_pages p \
                       WHERE pb.page_id = p.id \
                         AND p.site_key='${site_key_sql}' \
                         AND p.slug='${homepage_slug_sql}' \
                         AND (pb.site_key IS DISTINCT FROM p.site_key OR pb.page_slug IS DISTINCT FROM p.slug OR pb.refresh_target IS DISTINCT FROM p.refresh_target); \
                       UPDATE demo_block_rich_text rt \
                       SET site_key = pb.site_key, page_slug = pb.page_slug, refresh_target = pb.refresh_target \
                       FROM demo_page_blocks pb \
                       WHERE pb.collection = 'demo_block_rich_text' \
                         AND pb.item = rt.id::text \
                         AND pb.site_key='${site_key_sql}' \
                         AND pb.page_slug='${homepage_slug_sql}' \
                         AND (rt.site_key IS DISTINCT FROM pb.site_key OR rt.page_slug IS DISTINCT FROM pb.page_slug OR rt.refresh_target IS DISTINCT FROM pb.refresh_target); \
                       UPDATE demo_block_hero h \
                       SET site_key = pb.site_key, page_slug = pb.page_slug, refresh_target = pb.refresh_target \
                       FROM demo_page_blocks pb \
                       WHERE pb.collection = 'demo_block_hero' \
                         AND pb.item = h.id::text \
                         AND pb.site_key='${site_key_sql}' \
                         AND pb.page_slug='${homepage_slug_sql}' \
                         AND (h.site_key IS DISTINCT FROM pb.site_key OR h.page_slug IS DISTINCT FROM pb.page_slug OR h.refresh_target IS DISTINCT FROM pb.refresh_target);"

                    # Set homepage layout assignment from sites.yaml if configured.
                    if [ -n "${homepage_layout_template_key_sql:-}" ]; then
                      layout_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                        "SELECT 1 FROM directus.demo_layout_templates WHERE template_key='${homepage_layout_template_key_sql}' AND (site_key='${site_key_sql}' OR site_key IS NULL OR site_key='') ORDER BY CASE WHEN site_key='${site_key_sql}' THEN 0 ELSE 1 END LIMIT 1;" || true)"
                      layout_exists="$(printf '%s' "$layout_exists" | tr -d '\r')"
                      if [ "$layout_exists" = "1" ]; then
                        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                          "SET search_path TO directus, public; UPDATE demo_pages SET layout_template_key='${homepage_layout_template_key_sql}' WHERE site_key='${site_key_sql}' AND slug='${homepage_slug_sql}' AND (layout_template_key IS DISTINCT FROM '${homepage_layout_template_key_sql}');"
                        echo "✅ Set homepage layout '${homepage_layout_template_key}' for site_key='${site_key}'"
                      else
                        echo "⚠️  homepage layout '${homepage_layout_template_key}' not found for site_key='${site_key}' (or global); leaving page unchanged"
                      fi
                    fi
                  fi

                  # Ensure a per-client Directus service-user token exists in Vault.
                  SITE_TOKEN=""
                  SITE_VAULT_PATH="secret/data/directus/gravitee/clients/${client_key}"
                  CODE="$(curl -sS -o /tmp/site-token.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
                    "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
                  if [ "$CODE" = "200" ]; then
                    SITE_TOKEN="$(jq -r '.data.data.token // empty' /tmp/site-token.json 2>/dev/null || true)"
                  fi
                  if [ -z "${SITE_TOKEN:-}" ] || [ "${SITE_TOKEN}" = "null" ]; then
                    SITE_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                    payload="$(jq -nc --arg t "$SITE_TOKEN" '{data:{token:$t}}')"
                    WCODE="$(curl -sS -o /tmp/site-token-write.json -w '%{http_code}' -X POST \
                      -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                      -d "$payload" "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
                    if [ "$WCODE" != "200" ] && [ "$WCODE" != "204" ]; then
                      echo "⚠️  failed to write Vault token for client_key=${client_key} (HTTP ${WCODE}); skipping"
                      continue
                    fi
                    echo "🔐 Vault token created for client_key=${client_key}"
                  fi

                  # Ensure Directus role exists (create if missing).
                  role_name_sql="$(printf '%s' "$role_name" | sed "s/'/''/g")"
                  ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT id FROM directus.directus_roles WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
                  ROLE_ID="$(printf '%s' "$ROLE_ID" | tr -d '\r')"
                  if [ -z "${ROLE_ID:-}" ] || [ "${ROLE_ID}" = "null" ]; then
                    ROLE_ID="$(cat /proc/sys/kernel/random/uuid)"
                    desc="Site role for ${site_key:-$client_key}"
                    desc_sql="$(printf '%s' "$desc" | sed "s/'/''/g")"
                    INS_COLS="id,name"
                    INS_VALS="'${ROLE_ID}','${role_name_sql}'"
                    if _has_role_col "description"; then INS_COLS="${INS_COLS},description"; INS_VALS="${INS_VALS},'${desc_sql}'"; fi
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; INSERT INTO directus_roles (${INS_COLS}) VALUES (${INS_VALS});"
                    echo "✅ Created Directus role '${role_name}' (id=${ROLE_ID})"
                  fi

                  # Ensure Directus policy exists and is linked to the site role.
                  POLICY_ID=""
                  if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
                    POLICY_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                      "SELECT id FROM directus.directus_policies WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
                    POLICY_ID="$(printf '%s' "$POLICY_ID" | tr -d '\r')"
                    if [ -z "${POLICY_ID:-}" ] || [ "${POLICY_ID}" = "null" ]; then
                      POLICY_ID="$(cat /proc/sys/kernel/random/uuid)"
                      PDESC="Site policy for ${site_key:-$client_key}"
                      PDESC_SQL="$(printf '%s' "$PDESC" | sed "s/'/''/g")"
                      PCOLS="id,name"
                      PVALS="'${POLICY_ID}','${role_name_sql}'"
                      if _has_policy_col "description"; then PCOLS="${PCOLS},description"; PVALS="${PVALS},'${PDESC_SQL}'"; fi
                      if _has_policy_col "icon"; then PCOLS="${PCOLS},icon"; PVALS="${PVALS},'badge'"; fi
                      if _has_policy_col "admin_access"; then PCOLS="${PCOLS},admin_access"; PVALS="${PVALS},false"; fi
                      if _has_policy_col "app_access"; then PCOLS="${PCOLS},app_access"; PVALS="${PVALS},false"; fi
                      if _has_policy_col "enforce_tfa"; then PCOLS="${PCOLS},enforce_tfa"; PVALS="${PVALS},false"; fi
                      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                        "SET search_path TO directus, public; INSERT INTO directus_policies (${PCOLS}) VALUES (${PVALS});"
                      echo "✅ Created Directus policy '${role_name}' (id=${POLICY_ID})"
                    fi
                  else
                    echo "⚠️ directus_policies table not found; skipping policy provisioning for client_key=${client_key}"
                  fi

                  if [ -n "${POLICY_ID:-}" ] && [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
                    acc_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                      "SELECT 1 FROM directus.directus_access WHERE role = '${ROLE_ID}' AND policy = '${POLICY_ID}' LIMIT 1;" || true)"
                    acc_exists="$(printf '%s' "$acc_exists" | tr -d '\r')"
                    if [ "$acc_exists" != "1" ]; then
                      acc_id="$(cat /proc/sys/kernel/random/uuid)"
                      ACOLS="id,policy"
                      AVALS="'${acc_id}','${POLICY_ID}'"
                      if _has_access_col "role"; then ACOLS="${ACOLS},role"; AVALS="${AVALS},'${ROLE_ID}'"; fi
                      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                        "SET search_path TO directus, public; INSERT INTO directus_access (${ACOLS}) VALUES (${AVALS});"
                      echo "✅ Linked role '${role_name}' to policy '${role_name}'"
                    fi
                  fi

                  # Ensure a service user exists for this site and set its static token (Directus uses directus_users.token).
                  if _has_user_col "token"; then
                    svc_email="svc-${client_key}@svc.local"
                    svc_email_sql="$(printf '%s' "$svc_email" | sed "s/'/''/g")"
                    USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                      "SELECT id FROM directus.directus_users WHERE email = '${svc_email_sql}' LIMIT 1;" || true)"
                    USER_ID="$(printf '%s' "$USER_ID" | tr -d '\r')"
                    token_sql="$(printf '%s' "$SITE_TOKEN" | sed "s/'/''/g")"
                    if [ -z "${USER_ID:-}" ] || [ "${USER_ID}" = "null" ]; then
                      USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                      UCOLS="id,email"
                      UVALS="'${USER_ID}','${svc_email_sql}'"
                      if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${ROLE_ID}'"; fi
                      if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
                      if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                      if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                      if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'${role_name_sql}'"; fi
                      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                        "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                      echo "✅ Created site user ${svc_email}"
                    else
                      role_id_sql="$(printf '%s' "$ROLE_ID" | sed "s/'/''/g")"
                      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                        "SET search_path TO directus, public; UPDATE directus_users SET role='${role_id_sql}', token='${token_sql}', status='active' WHERE id='${USER_ID}';"
                      echo "✅ Updated site user ${svc_email}"
                    fi
                  else
                    echo "⚠️ directus_users.token column not found; cannot provision site token for client_key=${client_key}"
                  fi

                  # Seed baseline read permissions for this policy (drives available GraphQL actions).
                  if [ "${PERM_TABLE_EXISTS:-0}" = "1" ] && [ -n "${POLICY_ID:-}" ] && [ -n "${PERM_PRINC_COL:-}" ]; then
                    # Reconcile desired read access from sites.yaml on every deploy.
                    # This removes stale read grants so ArgoCD-driven config is authoritative.
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; DELETE FROM directus_permissions WHERE ${PERM_PRINC_COL}='${POLICY_ID}' AND action='read';"

                    printf '%s' "$site" | jq -c '.read_collections[]?' | while IFS= read -r coll_entry; do
                      [ -z "${coll_entry:-}" ] && continue

                      coll=""
                      fields_cfg="null"
                      permissions_cfg="null"
                      validation_cfg="null"
                      presets_cfg="null"

                      coll_type="$(printf '%s' "$coll_entry" | jq -r 'type' 2>/dev/null || true)"
                      if [ "$coll_type" = "string" ]; then
                        coll="$(printf '%s' "$coll_entry" | jq -r '.' 2>/dev/null || true)"
                      elif [ "$coll_type" = "object" ]; then
                        coll="$(printf '%s' "$coll_entry" | jq -r '.collection // .name // empty' 2>/dev/null || true)"
                        fields_cfg="$(printf '%s' "$coll_entry" | jq -c '.fields // null' 2>/dev/null || true)"
                        permissions_cfg="$(printf '%s' "$coll_entry" | jq -c '.permissions // .filter // null' 2>/dev/null || true)"
                        validation_cfg="$(printf '%s' "$coll_entry" | jq -c '.validation // null' 2>/dev/null || true)"
                        presets_cfg="$(printf '%s' "$coll_entry" | jq -c '.presets // null' 2>/dev/null || true)"
                      else
                        continue
                      fi

                      if [ -z "${coll:-}" ] || [ "${coll}" = "null" ]; then
                        continue
                      fi

                      coll_sql="$(printf '%s' "$coll" | sed "s/'/''/g")"
                      perms_val="$(_json_value_for_type "${PERMISSIONS_TYPE:-}" "${permissions_cfg:-null}")"
                      val_val="$(_json_value_for_type "${VALIDATION_TYPE:-}" "${validation_cfg:-null}")"
                      pre_val="$(_json_value_for_type "${PRESETS_TYPE:-}" "${presets_cfg:-null}")"
                      fields_val="$(_fields_value_from_config_for_type "${PERM_FIELDS_TYPE:-}" "${fields_cfg:-null}")"

                      existing_perm_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                        "SELECT id FROM directus.directus_permissions WHERE ${PERM_PRINC_COL} = '${POLICY_ID}' AND collection = '${coll_sql}' AND action = 'read' LIMIT 1;" || true)"
                      existing_perm_id="$(printf '%s' "$existing_perm_id" | tr -d '\r')"

                      if [ -n "${existing_perm_id:-}" ] && [ "${existing_perm_id}" != "null" ]; then
                        SETS=""
                        if _has_perm_col "permissions"; then SETS="${SETS},permissions=${perms_val}"; fi
                        if _has_perm_col "validation"; then SETS="${SETS},validation=${val_val}"; fi
                        if _has_perm_col "presets"; then SETS="${SETS},presets=${pre_val}"; fi
                        if _has_perm_col "fields"; then SETS="${SETS},fields=${fields_val}"; fi
                        if [ -n "${SETS:-}" ]; then
                          perm_id_sql="$(printf '%s' "$existing_perm_id" | sed "s/'/''/g")"
                          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                            "SET search_path TO directus, public; UPDATE directus_permissions SET ${SETS#,} WHERE id='${perm_id_sql}';"
                        fi
                        echo "✅ Reconciled read on ${coll} for policy '${role_name}'"
                        continue
                      fi

                      PCOLS="${PERM_PRINC_COL},collection,action"
                      PVALS="'${POLICY_ID}','${coll_sql}','read'"
                      if [ "${PERM_ID_HAS_DEFAULT:-0}" != "1" ]; then
                        pid="$(cat /proc/sys/kernel/random/uuid)"
                        PCOLS="id,${PCOLS}"
                        PVALS="'${pid}',${PVALS}"
                      fi
                      if _has_perm_col "permissions"; then PCOLS="${PCOLS},permissions"; PVALS="${PVALS},${perms_val}"; fi
                      if _has_perm_col "validation"; then PCOLS="${PCOLS},validation"; PVALS="${PVALS},${val_val}"; fi
                      if _has_perm_col "presets"; then PCOLS="${PCOLS},presets"; PVALS="${PVALS},${pre_val}"; fi
                      if _has_perm_col "fields"; then PCOLS="${PCOLS},fields"; PVALS="${PVALS},${fields_val}"; fi
                      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                        "SET search_path TO directus, public; INSERT INTO directus_permissions (${PCOLS}) VALUES (${PVALS});"
                      echo "✅ Granted read on ${coll} to policy '${role_name}'"
                    done
                  fi

                  # Provision per-site Directus flows that call the app cache refresh endpoint after content saves.
                  # These are seeded from sites.yaml and can also be adjusted from the Directus Flow UI.
                  if [ "${_directus_api_enabled}" = "1" ]; then
                    refresh_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.enabled // false' 2>/dev/null || true)"
                    refresh_auth_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.enabled // true' 2>/dev/null || true)"
                    refresh_auth_token_url_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.token_url // empty' 2>/dev/null || true)"
                    refresh_auth_scope="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.scope // empty' 2>/dev/null || true)"
                    refresh_auth_audience="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience // empty' 2>/dev/null || true)"
                    refresh_auth_audience_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_path // "secret/data/keycloak-client-id-graphql-api"' 2>/dev/null || true)"
                    refresh_auth_audience_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_field // "value"' 2>/dev/null || true)"
                    refresh_auth_client_id_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_path // empty' 2>/dev/null || true)"
                    refresh_auth_client_id_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_field // "value"' 2>/dev/null || true)"
                    refresh_auth_client_secret_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_path // empty' 2>/dev/null || true)"
                    refresh_auth_client_secret_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_field // "value"' 2>/dev/null || true)"

                    case "$(printf '%s' "${refresh_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
                      1|true|yes|on) refresh_enabled="true" ;;
                      *) refresh_enabled="false" ;;
                    esac

                    case "$(printf '%s' "${refresh_auth_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
                      1|true|yes|on) refresh_auth_enabled="true" ;;
                      *) refresh_auth_enabled="false" ;;
                    esac

                    refresh_auth_token_url="$(printf '%s' "${refresh_auth_token_url_raw:-}" | tr -d '\r')"
                    if [ -z "${refresh_auth_token_url:-}" ] || [ "${refresh_auth_token_url}" = "null" ]; then
                      refresh_auth_token_url="https://auth.suncoast.systems/realms/external/protocol/openid-connect/token"
                    fi

                    refresh_auth_client_id_vault_path="$(printf '%s' "${refresh_auth_client_id_vault_path:-}" | tr -d '\r')"
                    if [ -z "${refresh_auth_client_id_vault_path:-}" ] || [ "${refresh_auth_client_id_vault_path}" = "null" ]; then
                      refresh_auth_client_id_vault_path="secret/data/keycloak-client-id-${client_key}"
                    fi

                    refresh_auth_client_secret_vault_path="$(printf '%s' "${refresh_auth_client_secret_vault_path:-}" | tr -d '\r')"
                    if [ -z "${refresh_auth_client_secret_vault_path:-}" ] || [ "${refresh_auth_client_secret_vault_path}" = "null" ]; then
                      refresh_auth_client_secret_vault_path="secret/data/keycloak-client-secret-${client_key}"
                    fi

                    refresh_auth_client_id_vault_field="$(printf '%s' "${refresh_auth_client_id_vault_field:-value}" | tr -d '\r')"
                    if [ -z "${refresh_auth_client_id_vault_field:-}" ] || [ "${refresh_auth_client_id_vault_field}" = "null" ]; then
                      refresh_auth_client_id_vault_field="value"
                    fi

                    refresh_auth_client_secret_vault_field="$(printf '%s' "${refresh_auth_client_secret_vault_field:-value}" | tr -d '\r')"
                    if [ -z "${refresh_auth_client_secret_vault_field:-}" ] || [ "${refresh_auth_client_secret_vault_field}" = "null" ]; then
                      refresh_auth_client_secret_vault_field="value"
                    fi

                    refresh_auth_audience_vault_path="$(printf '%s' "${refresh_auth_audience_vault_path:-}" | tr -d '\r')"
                    refresh_auth_audience_vault_field="$(printf '%s' "${refresh_auth_audience_vault_field:-value}" | tr -d '\r')"
                    if [ -z "${refresh_auth_audience_vault_field:-}" ] || [ "${refresh_auth_audience_vault_field}" = "null" ]; then
                      refresh_auth_audience_vault_field="value"
                    fi

                    refresh_auth_client_id=""
                    refresh_auth_client_secret=""
                    refresh_auth_token_body=""
                    refresh_auth_ready="false"

                    if [ "${refresh_auth_enabled}" = "true" ]; then
                      refresh_auth_client_id="$(_vault_kv_read_field "${refresh_auth_client_id_vault_path}" "${refresh_auth_client_id_vault_field}" || true)"
                      refresh_auth_client_secret="$(_vault_kv_read_field "${refresh_auth_client_secret_vault_path}" "${refresh_auth_client_secret_vault_field}" || true)"
                      refresh_auth_audience="$(printf '%s' "${refresh_auth_audience:-}" | tr -d '\r')"
                      if [ -z "${refresh_auth_audience:-}" ] && [ -n "${refresh_auth_audience_vault_path:-}" ] && [ "${refresh_auth_audience_vault_path}" != "null" ]; then
                        refresh_auth_audience="$(_vault_kv_read_field "${refresh_auth_audience_vault_path}" "${refresh_auth_audience_vault_field}" || true)"
                      fi

                      if [ -z "${refresh_auth_client_id:-}" ] || [ -z "${refresh_auth_client_secret:-}" ]; then
                        echo "⚠️ cache refresh auth enabled but Keycloak client credentials missing for site_key='${site_key}' (client_id_path='${refresh_auth_client_id_vault_path}', client_secret_path='${refresh_auth_client_secret_vault_path}')"
                      else
                        enc_client_id="$(_urlencode_value "${refresh_auth_client_id}")"
                        enc_client_secret="$(_urlencode_value "${refresh_auth_client_secret}")"
                        refresh_auth_token_body="grant_type=client_credentials&client_id=${enc_client_id}&client_secret=${enc_client_secret}"

                        refresh_auth_scope="$(printf '%s' "${refresh_auth_scope:-}" | tr -d '\r')"
                        if [ -n "${refresh_auth_scope:-}" ] && [ "${refresh_auth_scope}" != "null" ]; then
                          enc_scope="$(_urlencode_value "${refresh_auth_scope}")"
                          refresh_auth_token_body="${refresh_auth_token_body}&scope=${enc_scope}"
                        fi

                        if [ -n "${refresh_auth_audience:-}" ] && [ "${refresh_auth_audience}" != "null" ]; then
                          enc_audience="$(_urlencode_value "${refresh_auth_audience}")"
                          refresh_auth_token_body="${refresh_auth_token_body}&audience=${enc_audience}"
                        fi

                        refresh_auth_ready="true"
                      fi
                    fi

                    refresh_targets_json="$(printf '%s' "$site" | jq -c '
                      def norm_headers($h):
                        if ($h|type)=="array" then
                          ($h | map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")))
                        else [] end;
                      if (.cache_refresh.targets | type) == "object" then
                        (.cache_refresh.targets | to_entries | map({
                          target_key:(.key|tostring|ascii_downcase),
                          enabled:(.value.enabled // false),
                          endpoint:(.value.endpoint // "" | tostring),
                          method:(.value.method // (.cache_refresh.method // "POST") | tostring),
                          headers:(norm_headers(.value.headers))
                        }))
                      elif (.cache_refresh.targets | type) == "array" then
                        (.cache_refresh.targets | map({
                          target_key:((.target_key // .key // .name // "")|tostring|ascii_downcase),
                          enabled:(.enabled // false),
                          endpoint:(.endpoint // "" | tostring),
                          method:(.method // (.cache_refresh.method // "POST") | tostring),
                          headers:(norm_headers(.headers))
                        }) | map(select(.target_key != "")))
                      else
                        [{
                          target_key:"prod",
                          enabled:(.cache_refresh.enabled // false),
                          endpoint:(.cache_refresh.endpoint // "" | tostring),
                          method:(.cache_refresh.method // "POST" | tostring),
                          headers:(norm_headers(.cache_refresh.headers))
                        }]
                      end' 2>/dev/null || true)"
                    if [ -z "${refresh_targets_json:-}" ] || [ "${refresh_targets_json}" = "null" ]; then
                      refresh_targets_json="[]"
                    fi
                    if ! printf '%s' "${refresh_targets_json}" | jq -e 'type=="array"' >/dev/null 2>&1; then
                      refresh_targets_json="[]"
                    fi

                    refresh_collections_json='["demo_pages","demo_page_blocks","demo_block_rich_text","demo_block_hero"]'
                    targets_count="$(printf '%s' "${refresh_targets_json}" | jq -r 'length' 2>/dev/null || echo 0)"
                    if [ "${targets_count:-0}" = "0" ]; then
                      echo "⚠️ No cache refresh targets configured for site_key='${site_key}'"
                    fi

                    printf '%s' "${refresh_targets_json}" | jq -c '.[]' | while IFS= read -r target; do
                      target_key="$(printf '%s' "$target" | jq -r '.target_key // empty' 2>/dev/null || true)"
                      target_enabled_raw="$(printf '%s' "$target" | jq -r '.enabled // false' 2>/dev/null || true)"
                      target_endpoint_raw="$(printf '%s' "$target" | jq -r '.endpoint // empty' 2>/dev/null || true)"
                      target_method_raw="$(printf '%s' "$target" | jq -r '.method // "POST"' 2>/dev/null || true)"
                      target_headers_json="$(printf '%s' "$target" | jq -c \
                        '(.headers // []) | if type=="array" then map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")) else [] end' \
                        2>/dev/null || true)"

                      if [ -z "${target_key:-}" ] || [ "${target_key}" = "null" ]; then
                        continue
                      fi

                      case "$(printf '%s' "${target_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
                        1|true|yes|on) target_enabled="true" ;;
                        *) target_enabled="false" ;;
                      esac

                      target_method="$(printf '%s' "${target_method_raw:-POST}" | tr '[:lower:]' '[:upper:]')"
                      case "${target_method}" in
                        GET|POST|PUT|PATCH|DELETE) ;;
                        *) target_method="POST" ;;
                      esac

                      if [ -z "${target_headers_json:-}" ] || [ "${target_headers_json}" = "null" ]; then
                        target_headers_json="[]"
                      fi

                      flow_status="active"
                      if [ "${refresh_enabled}" != "true" ] || [ "${target_enabled}" != "true" ]; then
                        flow_status="inactive"
                      fi

                      target_endpoint_effective="$(printf '%s' "${target_endpoint_raw:-}" | tr -d '\r')"
                      if [ -z "${target_endpoint_effective:-}" ] || [ "${target_endpoint_effective}" = "null" ]; then
                        flow_status="inactive"
                        target_endpoint_effective="https://replace-me-${site_key}-${target_key}.invalid/api/cache/refresh"
                      fi

                      target_headers_effective_json="${target_headers_json}"
                      if [ "${refresh_auth_enabled}" = "true" ]; then
                        if [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                          target_headers_effective_json="$(jq -nc --argjson headers "${target_headers_json}" \
                            '[{header:"Authorization",value:"Bearer {{ $last.data.access_token }}"}] + ($headers // [])')"
                        else
                          flow_status="inactive"
                        fi
                      fi

                      create_flow_name="CMS Cache Refresh (${site_key}/${target_key}) - Create"
                      update_flow_name="CMS Cache Refresh (${site_key}/${target_key}) - Update"
                      create_flow_desc="Refreshes '${target_key}' app cache endpoint for site '${site_key}' after create events."
                      update_flow_desc="Refreshes '${target_key}' app cache endpoint for site '${site_key}' after update events."

                      create_flow_payload="$(jq -nc \
                        --arg name "${create_flow_name}" \
                        --arg status "${flow_status}" \
                        --arg desc "${create_flow_desc}" \
                        --argjson collections "${refresh_collections_json}" \
                        '{name:$name,trigger:"event",status:$status,accountability:"all",icon:"sync",color:"#2E7D32",description:$desc,options:{type:"action",scope:["items.create"],collections:$collections}}')"
                      update_flow_payload="$(jq -nc \
                        --arg name "${update_flow_name}" \
                        --arg status "${flow_status}" \
                        --arg desc "${update_flow_desc}" \
                        --argjson collections "${refresh_collections_json}" \
                        '{name:$name,trigger:"event",status:$status,accountability:"all",icon:"sync",color:"#2E7D32",description:$desc,options:{type:"action",scope:["items.update"],collections:$collections}}')"

                      create_flow_id="$(_directus_find_flow_id_by_name "${create_flow_name}")"
                      if [ -n "${create_flow_id:-}" ] && [ "${create_flow_id}" != "null" ]; then
                        _directus_api_write "PATCH" "/flows/${create_flow_id}" "${create_flow_payload}" >/tmp/directus-flow-upsert.json 2>/dev/null || true
                      else
                        created_flow="$(_directus_api_write "POST" "/flows" "${create_flow_payload}" 2>/dev/null || true)"
                        create_flow_id="$(printf '%s' "${created_flow}" | jq -r '.data.id // empty' 2>/dev/null || true)"
                      fi

                      update_flow_id="$(_directus_find_flow_id_by_name "${update_flow_name}")"
                      if [ -n "${update_flow_id:-}" ] && [ "${update_flow_id}" != "null" ]; then
                        _directus_api_write "PATCH" "/flows/${update_flow_id}" "${update_flow_payload}" >/tmp/directus-flow-upsert.json 2>/dev/null || true
                      else
                        updated_flow="$(_directus_api_write "POST" "/flows" "${update_flow_payload}" 2>/dev/null || true)"
                        update_flow_id="$(printf '%s' "${updated_flow}" | jq -r '.data.id // empty' 2>/dev/null || true)"
                      fi

                      if [ -z "${create_flow_id:-}" ] || [ -z "${update_flow_id:-}" ]; then
                        echo "⚠️ Failed to ensure cache-refresh flows for site_key='${site_key}', target='${target_key}'"
                      else
                        create_read_options="$(jq -nc \
                          '{collection:"{{ $trigger.collection }}",key:"{{ $trigger.key }}",query:{fields:["id","site_key","refresh_target"]},emitEvents:false,permissions:"$full"}')"
                        create_match_options="$(jq -nc --arg site "${site_key}" --arg target "${target_key}" \
                          '{filter:{_and:[{site_key:{_eq:$site}},{_or:[{refresh_target:{_eq:$target}},{refresh_target:{_eq:"both"}},{refresh_target:{_null:true}},{refresh_target:{_eq:""}}]}]}}')"
                        create_request_options="$(jq -nc \
                          --arg method "${target_method}" \
                          --arg url "${target_endpoint_effective}" \
                          --arg site "${site_key}" \
                          --arg target "${target_key}" \
                          --argjson headers "${target_headers_effective_json}" \
                          '{method:$method,url:$url,headers:$headers,body:{source:"directus",site_key:$site,target:$target,event:"items.create",collection:"{{ $trigger.collection }}",key:"{{ $trigger.key }}"}}')"
                        create_token_options="$(jq -nc \
                          --arg url "${refresh_auth_token_url}" \
                          --arg body "${refresh_auth_token_body}" \
                          '{method:"POST",url:$url,headers:[{header:"Content-Type",value:"application/x-www-form-urlencoded"},{header:"Accept",value:"application/json"}],body:$body}')"

                        create_read_op_id="$(_directus_upsert_operation "${create_flow_id}" "read_item" "item-read" "Read Created Item" 19 1 "${create_read_options}")"
                        create_match_op_id="$(_directus_upsert_operation "${create_flow_id}" "match_site_target" "condition" "Match Site + Target" 37 1 "${create_match_options}")"
                        if [ "${refresh_auth_enabled}" = "true" ] && [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                          create_token_op_id="$(_directus_upsert_operation "${create_flow_id}" "mint_refresh_token" "request" "Mint Refresh Token" 55 1 "${create_token_options}")"
                          create_request_op_id="$(_directus_upsert_operation "${create_flow_id}" "refresh_cache" "request" "Refresh Cache Endpoint" 73 1 "${create_request_options}")"
                          _directus_set_operation_links "${create_read_op_id}" "${create_match_op_id}" ""
                          _directus_set_operation_links "${create_match_op_id}" "${create_token_op_id}" ""
                          _directus_set_operation_links "${create_token_op_id}" "${create_request_op_id}" ""
                        else
                          create_request_op_id="$(_directus_upsert_operation "${create_flow_id}" "refresh_cache" "request" "Refresh Cache Endpoint" 55 1 "${create_request_options}")"
                          _directus_set_operation_links "${create_read_op_id}" "${create_match_op_id}" ""
                          _directus_set_operation_links "${create_match_op_id}" "${create_request_op_id}" ""
                        fi
                        _directus_set_operation_links "${create_request_op_id}" "" ""
                        _directus_api_write "PATCH" "/flows/${create_flow_id}" \
                          "$(jq -nc --arg operation "${create_read_op_id}" --arg status "${flow_status}" '{operation:$operation,status:$status}')" \
                          >/tmp/directus-flow-entry.json 2>/dev/null || true

                        update_read_options="$(jq -nc \
                          '{collection:"{{ $trigger.collection }}",key:"{{ $trigger.keys.0 }}",query:{fields:["id","site_key","refresh_target"]},emitEvents:false,permissions:"$full"}')"
                        update_match_options="$(jq -nc --arg site "${site_key}" --arg target "${target_key}" \
                          '{filter:{_and:[{site_key:{_eq:$site}},{_or:[{refresh_target:{_eq:$target}},{refresh_target:{_eq:"both"}},{refresh_target:{_null:true}},{refresh_target:{_eq:""}}]}]}}')"
                        update_request_options="$(jq -nc \
                          --arg method "${target_method}" \
                          --arg url "${target_endpoint_effective}" \
                          --arg site "${site_key}" \
                          --arg target "${target_key}" \
                          --argjson headers "${target_headers_effective_json}" \
                          '{method:$method,url:$url,headers:$headers,body:{source:"directus",site_key:$site,target:$target,event:"items.update",collection:"{{ $trigger.collection }}",key:"{{ $trigger.keys.0 }}"}}')"
                        update_token_options="$(jq -nc \
                          --arg url "${refresh_auth_token_url}" \
                          --arg body "${refresh_auth_token_body}" \
                          '{method:"POST",url:$url,headers:[{header:"Content-Type",value:"application/x-www-form-urlencoded"},{header:"Accept",value:"application/json"}],body:$body}')"

                        update_read_op_id="$(_directus_upsert_operation "${update_flow_id}" "read_item" "item-read" "Read Updated Item" 19 1 "${update_read_options}")"
                        update_match_op_id="$(_directus_upsert_operation "${update_flow_id}" "match_site_target" "condition" "Match Site + Target" 37 1 "${update_match_options}")"
                        if [ "${refresh_auth_enabled}" = "true" ] && [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                          update_token_op_id="$(_directus_upsert_operation "${update_flow_id}" "mint_refresh_token" "request" "Mint Refresh Token" 55 1 "${update_token_options}")"
                          update_request_op_id="$(_directus_upsert_operation "${update_flow_id}" "refresh_cache" "request" "Refresh Cache Endpoint" 73 1 "${update_request_options}")"
                          _directus_set_operation_links "${update_read_op_id}" "${update_match_op_id}" ""
                          _directus_set_operation_links "${update_match_op_id}" "${update_token_op_id}" ""
                          _directus_set_operation_links "${update_token_op_id}" "${update_request_op_id}" ""
                        else
                          update_request_op_id="$(_directus_upsert_operation "${update_flow_id}" "refresh_cache" "request" "Refresh Cache Endpoint" 55 1 "${update_request_options}")"
                          _directus_set_operation_links "${update_read_op_id}" "${update_match_op_id}" ""
                          _directus_set_operation_links "${update_match_op_id}" "${update_request_op_id}" ""
                        fi
                        _directus_set_operation_links "${update_request_op_id}" "" ""
                        _directus_api_write "PATCH" "/flows/${update_flow_id}" \
                          "$(jq -nc --arg operation "${update_read_op_id}" --arg status "${flow_status}" '{operation:$operation,status:$status}')" \
                          >/tmp/directus-flow-entry.json 2>/dev/null || true

                        if [ "${flow_status}" = "active" ]; then
                          echo "✅ Reconciled active cache-refresh flows for site_key='${site_key}', target='${target_key}' (${target_method} ${target_endpoint_effective})"
                        else
                          echo "✅ Reconciled cache-refresh flows for site_key='${site_key}', target='${target_key}' as inactive"
                        fi
                      fi
                    done

                    # Keep legacy pre-target flow names inactive to avoid duplicate refresh calls.
                    legacy_create_flow_name="CMS Cache Refresh (${site_key}) - Create"
                    legacy_update_flow_name="CMS Cache Refresh (${site_key}) - Update"
                    legacy_create_flow_id="$(_directus_find_flow_id_by_name "${legacy_create_flow_name}")"
                    if [ -n "${legacy_create_flow_id:-}" ] && [ "${legacy_create_flow_id}" != "null" ]; then
                      _directus_api_write "PATCH" "/flows/${legacy_create_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
                    fi
                    legacy_update_flow_id="$(_directus_find_flow_id_by_name "${legacy_update_flow_name}")"
                    if [ -n "${legacy_update_flow_id:-}" ] && [ "${legacy_update_flow_id}" != "null" ]; then
                      _directus_api_write "PATCH" "/flows/${legacy_update_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
                    fi
                  else
                    echo "⚠️ Skipping cache-refresh flow provisioning for site_key='${site_key}' (Directus API token unavailable)"
                  fi
                done
              else
                echo "  └─ no sites configured in ${SITES_FILE}; skipping"
              fi
            else
              echo "  └─ ${SITES_FILE} not found; skipping"
            fi

            # 5d) Provision a dedicated admin-backed token for OpenAPI discovery sync.
            # Directus only includes `/items/*` paths in OAS for admin-level users.
            echo "🧾 Ensuring OpenAPI sync admin token exists..."
            OPENAPI_SYNC_TOKEN_VAULT_PATH="${OPENAPI_SYNC_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/openapi/admin}"
            OPENAPI_USER_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
            _openapi_has_user_col() { printf '%s\n' "$OPENAPI_USER_COLS" | grep -qx "$1"; }

            if _openapi_has_user_col "token"; then
              ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
              ADMIN_ROLE_ID="$(printf '%s' "$ADMIN_ROLE_ID" | tr -d '\r')"

              if [ -z "${ADMIN_ROLE_ID:-}" ] || [ "${ADMIN_ROLE_ID}" = "null" ]; then
                echo "⚠️ Administrator role not found; skipping OpenAPI sync token provisioning."
              else
                OPENAPI_SYNC_TOKEN=""
                RCODE="$(curl -sS -o /tmp/openapi-sync-token-read.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
                if [ "$RCODE" = "200" ]; then
                  OPENAPI_SYNC_TOKEN="$(jq -r '.data.data.token // empty' /tmp/openapi-sync-token-read.json 2>/dev/null || true)"
                fi
                if [ -z "${OPENAPI_SYNC_TOKEN:-}" ] || [ "${OPENAPI_SYNC_TOKEN}" = "null" ]; then
                  OPENAPI_SYNC_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                fi

                openapi_email="svc-openapi-admin@svc.local"
                openapi_email_sql="$(printf '%s' "$openapi_email" | sed "s/'/''/g")"
                ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT id FROM directus.directus_users WHERE email = '${openapi_email_sql}' LIMIT 1;" || true)"
                ADMIN_USER_ID="$(printf '%s' "$ADMIN_USER_ID" | tr -d '\r')"
                token_sql="$(printf '%s' "$OPENAPI_SYNC_TOKEN" | sed "s/'/''/g")"
                admin_role_sql="$(printf '%s' "$ADMIN_ROLE_ID" | sed "s/'/''/g")"

                if [ -z "${ADMIN_USER_ID:-}" ] || [ "${ADMIN_USER_ID}" = "null" ]; then
                  ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                  UCOLS="id,email"
                  UVALS="'${ADMIN_USER_ID}','${openapi_email_sql}'"
                  if _openapi_has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${admin_role_sql}'"; fi
                  if _openapi_has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
                  if _openapi_has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                  if _openapi_has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                  if _openapi_has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'openapi-admin'"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                  echo "✅ Created OpenAPI sync user ${openapi_email}"
                else
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; UPDATE directus_users SET role='${admin_role_sql}', token='${token_sql}', status='active' WHERE id='${ADMIN_USER_ID}';"
                  echo "✅ Updated OpenAPI sync user ${openapi_email}"
                fi

                payload="$(jq -nc --arg t "$OPENAPI_SYNC_TOKEN" '{data:{token:$t}}')"
                WCODE="$(curl -sS -o /tmp/openapi-sync-token-write.json -w '%{http_code}' -X POST \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                  -d "$payload" "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
                if [ "$WCODE" = "200" ] || [ "$WCODE" = "204" ]; then
                  echo "✅ OpenAPI sync token stored in Vault (${OPENAPI_SYNC_TOKEN_VAULT_PATH})"
                else
                  echo "⚠️ Failed to store OpenAPI sync token in Vault (HTTP ${WCODE})"
                fi
              fi
            else
              echo "⚠️ directus_users.token column not found; cannot provision OpenAPI sync token."
            fi

            # 6) Configure Directus settings directly in DB
            echo "🤖 Configuring Directus settings..."
            EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
            EXTRA_SETTINGS_HAS_KEYS="0"
            OPENAI_KEY=""
            OPENAI_KEY_SOURCE=""
            if [ -f "$EXTRA_SETTINGS_FILE" ]; then
              EXTRA_SETTINGS_JSON="$(yq -o=json '.' "$EXTRA_SETTINGS_FILE" 2>/dev/null || true)"
              if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'type=="object"' >/dev/null 2>&1; then
                if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'length>0' >/dev/null 2>&1; then
                  EXTRA_SETTINGS_HAS_KEYS="1"
                fi
                OPENAI_KEY_FROM_SETTINGS="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r \
                  'to_entries[] | select(.key|test("openai.*key$"; "i")) | .value | if type=="string" then . else empty end' \
                  | head -n1 || true)"
                if [ -n "${OPENAI_KEY_FROM_SETTINGS:-}" ] && [ "${OPENAI_KEY_FROM_SETTINGS}" != "null" ]; then
                  if printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q '<path:'; then
                    echo "⚠️ OpenAI key placeholder detected in settings.yaml (AVP not rendered); will try Vault."
                  else
                    OPENAI_KEY="$OPENAI_KEY_FROM_SETTINGS"
                    OPENAI_KEY_SOURCE="settings.yaml"
                  fi
                fi
              else
                echo "⚠️ Invalid YAML in $EXTRA_SETTINGS_FILE; ignoring."
              fi
            fi

            if [ -z "${OPENAI_KEY:-}" ]; then
              OPENAI_KEY="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/secret/data/open_ai_key" | jq -r '.data.data.value' || true)"
              if [ -n "${OPENAI_KEY:-}" ] && [ "${OPENAI_KEY}" != "null" ]; then
                OPENAI_KEY_SOURCE="vault"
              else
                OPENAI_KEY=""
                OPENAI_KEY_SOURCE=""
                echo "⚠️ OpenAI key missing; will skip OpenAI setting."
              fi
            fi

            SETTINGS_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' ORDER BY column_name;" || true)"
            if [ -z "${SETTINGS_COLS:-}" ]; then
              echo "⚠️ Could not read directus_settings columns; skipping settings."
              echo "✅ Schema patch applied. Going idle."
              exec tail -f /dev/null
            fi

            ENCRYPTED_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT field FROM directus_fields WHERE collection='directus_settings' AND special::text ILIKE '%encrypt%';" || true)"
            ENCRYPTED_REGEX='^1\\|\\|scrypt\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+$'

            EXTRA_ENCRYPTED_COLS="ai_openai_api_key ai_anthropic_api_key ai_google_api_key ai_openai_compatible_api_key"
            _sanitize_encrypted_col() {
              enc_col="$1"
              [ -z "${enc_col:-}" ] && return 0
              if ! printf '%s\n' "$SETTINGS_COLS" | grep -qx "$enc_col"; then
                return 0
              fi
              _col_escaped="$(printf '%s' "$enc_col" | sed 's/\"/\"\"/g')"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL WHERE \"${_col_escaped}\" IS NOT NULL AND \"${_col_escaped}\" !~ '${ENCRYPTED_REGEX}';"
            }

            echo "🔐 Sanitizing encrypted settings fields..."
            if [ -n "${ENCRYPTED_COLS:-}" ]; then
              printf '%s\n' "$ENCRYPTED_COLS" | while IFS= read -r enc_col; do
                _sanitize_encrypted_col "$enc_col"
              done
            fi
            for enc_col in $EXTRA_ENCRYPTED_COLS; do
              _sanitize_encrypted_col "$enc_col"
            done

            _update_setting() {
              _col="$1"
              _val="$2"
              _col_escaped="$(printf '%s' "$_col" | sed 's/\"/\"\"/g')"
              _val_escaped="$(printf '%s' "$_val" | sed "s/'/''/g")"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = '${_val_escaped}';"
            }

            UPDATED="0"

            if [ -n "${OPENAI_KEY:-}" ]; then
              OPENAI_COL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' AND column_name ~* 'openai.*key$' ORDER BY column_name LIMIT 1;" || true)"
              if [ -n "${OPENAI_COL:-}" ]; then
                if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$OPENAI_COL" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$OPENAI_COL"; then
                  echo "⚠️ ${OPENAI_COL} is encrypted; skipping direct DB update to avoid invalid encrypted payload."
                else
                  _update_setting "$OPENAI_COL" "$OPENAI_KEY"
                  UPDATED="1"
                  echo "✅ OpenAI key stored in directus_settings.${OPENAI_COL} (source: ${OPENAI_KEY_SOURCE})"
                fi
              else
                echo "⚠️ No OpenAI settings column found in directus_settings; skipping OpenAI setting."
              fi
            fi

            if [ "$EXTRA_SETTINGS_HAS_KEYS" = "1" ]; then
              while IFS= read -r key; do
                if printf '%s' "$key" | grep -Eq 'openai.*key$'; then
                  # handled separately via OPENAI_KEY logic above
                  continue
                fi
                if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$key" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$key"; then
                  echo "⚠️ settings.yaml key '${key}' is encrypted; skipping direct DB update."
                  continue
                fi
                if printf '%s\n' "$SETTINGS_COLS" | grep -qx "$key"; then
                  val_type="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k] | type')"
                  if [ "$val_type" = "null" ]; then
                    _col_escaped="$(printf '%s' "$key" | sed 's/\"/\"\"/g')"
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                      -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL;"
                    UPDATED="1"
                    continue
                  fi
                  case "$val_type" in
                    string)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                      ;;
                    number|boolean)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                      ;;
                    *)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -c --arg k "$key" '.[$k]')"
                      ;;
                  esac
                  _update_setting "$key" "$val"
                  UPDATED="1"
                else
                  echo "⚠️ settings.yaml key '${key}' not found in directus_settings; skipping."
                fi
              done < <(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r 'keys[]')
            fi

            if [ "$UPDATED" != "1" ]; then
              echo "⚠️ No applicable settings were updated."
            else
              echo "✅ Directus settings updated in database."
            fi

            if [ -z "${OPENAI_KEY:-}" ] && [ "$EXTRA_SETTINGS_HAS_KEYS" != "1" ]; then
              echo "ℹ️ No settings to apply from settings.yaml/OpenAI; continuing with owner/cleanup."
            fi

            echo "👤 Ensuring project owner is set..."
            if printf '%s\n' "$SETTINGS_COLS" | grep -qx "project_owner"; then
              CURRENT_OWNER="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT project_owner FROM directus_settings LIMIT 1;" || true)"
              if [ -z "${CURRENT_OWNER:-}" ] || [ "${CURRENT_OWNER}" = "null" ]; then
                OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT u.id FROM directus_users u JOIN directus_roles r ON u.role = r.id WHERE r.name='Administrator' ORDER BY u.id ASC LIMIT 1;" || true)"
                if [ -z "${OWNER_ID:-}" ] || [ "${OWNER_ID}" = "null" ]; then
                  OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT id FROM directus_users ORDER BY id ASC LIMIT 1;" || true)"
                fi
                if [ -n "${OWNER_ID:-}" ] && [ "${OWNER_ID}" != "null" ]; then
                  _owner_escaped="$(printf '%s' "$OWNER_ID" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "SET search_path TO directus, public; UPDATE directus_settings SET project_owner = '${_owner_escaped}' WHERE project_owner IS NULL;"
                  echo "✅ Project owner set to ${OWNER_ID}"
                else
                  echo "⚠️ No users found to set project owner."
                fi
              else
                echo "✅ Project owner already set."
              fi
            else
              echo "⚠️ project_owner column not found; skipping."
            fi

            echo "🧩 Ensuring local extensions are enabled..."
            EXT_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_extensions' LIMIT 1;" || true)"
            if [ "$EXT_TABLE_EXISTS" = "1" ]; then
              EXT_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_extensions' ORDER BY column_name;" || true)"
              _ensure_local_ext_enabled() {
                ext_folder="$1"
                ext_folder_sql="$(printf '%s' "$ext_folder" | sed "s/'/''/g")"

                if printf '%s\n' "$EXT_COLS" | grep -qx "folder"; then
                  EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT 1 FROM directus_extensions WHERE folder='${ext_folder_sql}' AND source='local' LIMIT 1;" || true)"
                  if [ "$EXISTS" = "1" ]; then
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE folder='${ext_folder_sql}' AND source='local';"
                    echo "✅ ${ext_folder} extension enabled."
                  else
                    EXT_ID="$(cat /proc/sys/kernel/random/uuid)"
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; INSERT INTO directus_extensions (id, enabled, source, folder, bundle) VALUES ('${EXT_ID}', true, 'local', '${ext_folder_sql}', NULL);"
                    echo "✅ ${ext_folder} extension registered."
                  fi
                else
                  EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT 1 FROM directus_extensions WHERE name='${ext_folder_sql}' LIMIT 1;" || true)"
                  if [ "$EXISTS" = "1" ]; then
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE name='${ext_folder_sql}';"
                    echo "✅ ${ext_folder} extension enabled."
                  else
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                      "SET search_path TO directus, public; INSERT INTO directus_extensions (name, enabled) VALUES ('${ext_folder_sql}', true);"
                    echo "✅ ${ext_folder} extension registered."
                  fi
                fi
              }

              _ensure_local_ext_enabled "github-profile-sync"
              _ensure_local_ext_enabled "ai-provider-access"
            else
              echo "⚠️ directus_extensions table not found; skipping extension enable."
            fi

            echo "✅ Schema patch applied. Going idle."
            exec tail -f /dev/null
        env:
          - name: DB_HOST
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
          - name: DB_PORT
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
          - name: DB_DATABASE
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
          - name: DIRECTUS_FLOW_API_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/openapi/admin"
          - name: OPENAPI_SYNC_TOKEN_VAULT_PATH
            value: "secret/data/directus/gravitee/openapi/admin"
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-token
            readOnly: true
          - name: directus-settings
            mountPath: /directus-settings
            readOnly: true
          - name: directus-sites
            mountPath: /directus-sites
            readOnly: true
          - name: directus-layout-templates
            mountPath: /directus-layout-templates
            readOnly: true
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
        volumeMounts:
        - name: vault-agent-config
          mountPath: /vault-config
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: vault-templates
          mountPath: /vault-templates
      - name: directus
        image: directus/directus:11
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "⏳ Waiting for Vault agent to generate all credential files..."
            while [ ! -f /vault-secrets/db-creds.env ] || \
                  [ ! -f /vault-secrets/app-keys.env ] || \
                  [ ! -f /vault-secrets/redis-creds.env ]; do
              echo "Waiting for credential files..."
              sleep 2
            done

            echo "✅ All credential files retrieved from Vault"
            echo "🔑 Loading credentials..."
            . /vault-secrets/db-creds.env
            . /vault-secrets/app-keys.env
            if [ -f /vault-secrets/openai.env ]; then
              . /vault-secrets/openai.env
            else
              echo "⚠️ /vault-secrets/openai.env not found; continuing without OPENAI_API_KEY"
            fi
            . /vault-secrets/redis-creds.env

            # Generate random admin credentials for initial setup (not used for actual login)
            RANDOM_ADMIN_EMAIL="admin-$(tr -dc 'a-z0-9' < /dev/urandom | head -c 8)@example.com"
            RANDOM_ADMIN_PASSWORD="$(tr -dc 'A-Za-z0-9@#%^*+=_-' < /dev/urandom | head -c 32)"
            
            # Export required envs for Directus
            export DB_USER DB_PASSWORD KEY SECRET REDIS_PASSWORD OPENAI_API_KEY
            export ADMIN_EMAIL="$RANDOM_ADMIN_EMAIL" ADMIN_PASSWORD="$RANDOM_ADMIN_PASSWORD"

            # Work from the app dir so the CLI behaves consistently
            cd /directus

            # Ensure Directus uses the intended schema/search_path for all CLI calls
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            # Increase OAuth2 userinfo timeout for cold-starting profile proxy
            if [ -n "${AUTH_GITHUB_CLIENT_HTTP__TIMEOUT:-}" ]; then
              printf '%s\n' \
                "import { custom } from 'openid-client';" \
                "const timeout = Number(process.env.AUTH_GITHUB_CLIENT_HTTP__TIMEOUT || 0);" \
                "if (Number.isFinite(timeout) && timeout > 0) { custom.setHttpOptionsDefaults({ timeout }); }" \
                > /tmp/openid-timeout.mjs
              if [ -n "${NODE_OPTIONS:-}" ]; then
                export NODE_OPTIONS="${NODE_OPTIONS} --import=/tmp/openid-timeout.mjs"
              else
                export NODE_OPTIONS="--import=/tmp/openid-timeout.mjs"
              fi
            fi

            echo "🔄 Initializing Directus database..."
            echo "📦 Running database install (idempotent)..."
            if CACHE_ENABLED=false RATE_LIMITER_ENABLED=false INIT_ADMIN_EMAIL="$ADMIN_EMAIL" INIT_ADMIN_PASSWORD="$ADMIN_PASSWORD" node cli.js database install >/tmp/install.log 2>&1; then
              echo "✅ Database installation completed successfully"
            else
              if grep -q "Database is already installed" /tmp/install.log; then
                echo "✅ Database already installed, proceeding..."
              else
                echo "❌ Database installation failed"; cat /tmp/install.log; exit 1
              fi
            fi

            _ensure_project_owner_migration_recorded() {
              MIGRATION_VERSION="20251014A"
              MIGRATION_NAME="Add Project Owner"
              export MIGRATION_VERSION MIGRATION_NAME

              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const migrationsTable = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_migrations" }).first(); if (!migrationsTable) return; const existing = await db("directus_migrations").withSchema(schema).where({ version: process.env.MIGRATION_VERSION }).first(); if (existing) return; const projectOwnerCol = await db("information_schema.columns").where({ table_schema: schema, table_name: "directus_settings", column_name: "project_owner" }).first(); if (!projectOwnerCol) return; const migrationCols = await db("information_schema.columns").select("column_name").where({ table_schema: schema, table_name: "directus_migrations" }); const insert = { version: process.env.MIGRATION_VERSION, name: process.env.MIGRATION_NAME }; if (migrationCols.some((col) => col.column_name === "timestamp")) { insert.timestamp = new Date().toISOString(); } await db("directus_migrations").withSchema(schema).insert(insert).onConflict("version").ignore(); console.log("Marked Add Project Owner migration as applied."); }; run().finally(() => db.destroy());'
            }

            if ! _ensure_project_owner_migration_recorded; then
              echo "⚠️ Failed to reconcile Add Project Owner migration state; continuing..."
            fi

            _ensure_settings_row() {
              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const table = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_settings" }).first(); if (!table) return; const row = await db("directus_settings").withSchema(schema).count({ count: "*" }).first(); const count = Number(row?.count ?? 0); if (!count) { await db("directus_settings").withSchema(schema).insert({}); console.log("Seeded directus_settings row."); } }; run().finally(() => db.destroy());'
            }

            echo "🔄 Running database migrations..."
            # Clear any cached schema and run migrations with cache disabled
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false  
            export CACHE_STORE=memory
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            
            # Add small delay to ensure DB is fully ready after install
            sleep 2
            
            # Run migrations with enhanced error handling
            echo "🔄 Running migrations with schema cache disabled..."
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            if node cli.js database migrate:latest >/tmp/migrate.log 2>&1; then
              cat /tmp/migrate.log
              echo "✅ Migrations completed successfully"
            else
              # Check if it's the known schema cache issue in Add Project Owner migration
              if grep -q "Cannot read properties of undefined.*primary\|Add Project Owner\|project_owner.*already exists" /tmp/migrate.log; then
                echo "⚠️ Known issue in 'Add Project Owner' migration detected"
                _ensure_project_owner_migration_recorded || true
                echo "⚠️ This is a non-critical schema cache issue - continuing with deployment"
                cat /tmp/migrate.log
                echo "✅ Migrations completed with known warnings"
              else
                echo "❌ Critical migration failure"
                cat /tmp/migrate.log
                exit 1
              fi
            fi

            if ! _ensure_settings_row; then
              echo "⚠️ Failed to ensure directus_settings row; continuing..."
            fi

            _ensure_ai_settings_defaults() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const DEFAULT_OPENAI_ALLOWED_MODELS = ["gpt-4o-mini", "gpt-5-nano", "gpt-5-mini", "gpt-5"];
            const DEFAULT_ANTHROPIC_ALLOWED_MODELS = ["claude-haiku-4-5", "claude-sonnet-4-5"];
            const DEFAULT_GOOGLE_ALLOWED_MODELS = ["gemini-3-pro-preview", "gemini-3-flash-preview", "gemini-2.5-pro", "gemini-2.5-flash"];
            
            const DEFAULT_OPENAI_COMPATIBLE_BASE_URL = "https://api.openai.com/v1";
            const DEFAULT_OPENAI_COMPATIBLE_NAME = "openai-compatible";
            const DEFAULT_OPENAI_COMPATIBLE_MODELS = [
              { id: "gpt-4o-mini", name: "GPT-4o Mini", context: 128000, output: 16384, attachment: true, reasoning: false },
              { id: "gpt-5-nano", name: "GPT-5 Nano", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5-mini", name: "GPT-5 Mini", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5", name: "GPT-5", context: 400000, output: 128000, attachment: true, reasoning: true }
            ];
            
            async function run() {
              const wantCols = [
                "ai_openai_allowed_models",
                "ai_anthropic_allowed_models",
                "ai_google_allowed_models",
                "ai_openai_compatible_base_url",
                "ai_openai_compatible_name",
                "ai_openai_compatible_models",
                "ai_openai_compatible_headers"
              ];
            
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = new Set(cols.map((c) => c.column_name));
              if (existing.size === 0) {
                console.log("No AI settings columns found; skipping AI defaults.");
                return;
              }
            
              const rowCount = await db("directus_settings").withSchema(schema).count({ count: "*" }).first();
              const count = Number(rowCount?.count ?? 0);
              if (!count) {
                await db("directus_settings").withSchema(schema).insert({});
              }
            
              const selectCols = Array.from(existing);
              const current = (await db("directus_settings").withSchema(schema).select(selectCols).first()) || {};
            
              const patch = {};
            
              if (existing.has("ai_openai_allowed_models") && current.ai_openai_allowed_models == null) {
                patch.ai_openai_allowed_models = JSON.stringify(DEFAULT_OPENAI_ALLOWED_MODELS);
              }
              if (existing.has("ai_anthropic_allowed_models") && current.ai_anthropic_allowed_models == null) {
                patch.ai_anthropic_allowed_models = JSON.stringify(DEFAULT_ANTHROPIC_ALLOWED_MODELS);
              }
              if (existing.has("ai_google_allowed_models") && current.ai_google_allowed_models == null) {
                patch.ai_google_allowed_models = JSON.stringify(DEFAULT_GOOGLE_ALLOWED_MODELS);
              }
              if (existing.has("ai_openai_compatible_base_url") && current.ai_openai_compatible_base_url == null) {
                patch.ai_openai_compatible_base_url = DEFAULT_OPENAI_COMPATIBLE_BASE_URL;
              }
              if (existing.has("ai_openai_compatible_name") && current.ai_openai_compatible_name == null) {
                patch.ai_openai_compatible_name = DEFAULT_OPENAI_COMPATIBLE_NAME;
              }
              if (existing.has("ai_openai_compatible_models") && current.ai_openai_compatible_models == null) {
                patch.ai_openai_compatible_models = JSON.stringify(DEFAULT_OPENAI_COMPATIBLE_MODELS);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("AI settings already initialized.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Initialized AI settings defaults: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            _set_ai_provider_keys() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const parsePayload = (value) => {
              const parts = String(value || "").split("||");
              if (parts.length < 9) return null;
              const [version, kdf, nStr, rStr, pStr, saltB64, ivB64, cipherText, tagB64] = parts;
              if (version !== "1" || kdf !== "scrypt") return null;
              return { n: Number(nStr) || 2 ** 14, r: Number(rStr) || 8, p: Number(pStr) || 1, saltB64, ivB64, cipherText, tagB64 };
            };
            
            const decryptPayload = (value, secret) => {
              const parsed = parsePayload(value);
              if (!parsed) return null;
              try {
                const salt = Buffer.from(parsed.saltB64, "base64");
                const keyBuf = crypto.scryptSync(secret, salt, 32, { N: parsed.n, r: parsed.r, p: parsed.p });
                const iv = Buffer.from(parsed.ivB64, "base64");
                const tag = Buffer.from(parsed.tagB64, "base64");
                const decipher = crypto.createDecipheriv("aes-256-gcm", keyBuf, iv);
                decipher.setAuthTag(tag);
                let plaintext = decipher.update(parsed.cipherText, "base64", "utf8");
                plaintext += decipher.final("utf8");
                return plaintext;
              } catch {
                return null;
              }
            };
            
            const encryptPayload = (plain, secret) => {
              const salt = crypto.randomBytes(16);
              const keyBuf = crypto.scryptSync(secret, salt, 32, { N: 2 ** 14, r: 8, p: 1 });
              const iv = crypto.randomBytes(12);
              const cipher = crypto.createCipheriv("aes-256-gcm", keyBuf, iv);
              let cipherText = cipher.update(plain, "utf8", "base64");
              cipherText += cipher.final("base64");
              const tag = cipher.getAuthTag().toString("base64");
              return ["1", "scrypt", 2 ** 14, 8, 1, salt.toString("base64"), iv.toString("base64"), cipherText, tag].join("||");
            };
            
            async function run() {
              const desired = process.env.OPENAI_API_KEY;
              const secret = process.env.SECRET;
            
              if (!secret) {
                console.log("Missing SECRET; skipping AI key encryption.");
                return;
              }
            
              if (!desired) {
                console.log("Missing OPENAI_API_KEY; skipping AI key encryption.");
                return;
              }
            
              const wantCols = ["ai_openai_api_key", "ai_openai_compatible_api_key"];
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = cols.map((c) => c.column_name);
              if (existing.length === 0) {
                console.log("No AI key columns found; skipping.");
                return;
              }
            
              const row = (await db("directus_settings").withSchema(schema).select(existing).first()) || {};
            
              const patch = {};
              for (const col of existing) {
                const current = row[col];
                const isEncrypted = typeof current === "string" && current.startsWith("1||scrypt||");
            
                if (isEncrypted) {
                  const decrypted = decryptPayload(current, secret);
                  if (decrypted === null) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  if (decrypted !== desired) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  continue;
                }
            
                patch[col] = encryptPayload(desired, secret);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("No AI keys to update.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Encrypted AI keys stored in directus_settings: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            echo "🤖 Ensuring AI settings defaults..."
            _ensure_ai_settings_defaults || echo "⚠️ Failed to ensure AI settings defaults."

            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "🔐 Encrypting AI provider keys into directus_settings..."
              _set_ai_provider_keys || echo "⚠️ Failed to store AI provider keys."
            else
              echo "ℹ️ OPENAI_API_KEY not set; skipping encrypted AI provider keys."
            fi

            echo "🔍 Debug: Environment check..."
            echo "DB_HOST: $DB_HOST, DB_USER: $DB_USER, DB_SCHEMA: $DB_SCHEMA"
            echo "REDIS_HOST: $REDIS_HOST"
            echo "Credentials loaded: KEY(${#KEY}), SECRET(${#SECRET}), ADMIN_EMAIL($ADMIN_EMAIL)"

            # Ensure proper schema connection
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            echo "🔧 Seeding defaults if missing & resolving role UUIDs…"

            # Make CLI quieter & deterministic for parsing
            export NO_COLOR=1
            export LOG_STYLE=raw
            export LOG_LEVEL=error
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false

            # Parse the first UUID-looking token from a file
            _extract_uuid_from_file() {
              # greedy-safe: match canonical 8-4-4-4-12 hex UUID
              grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$1" | head -n1
            }

            # Create role and capture UUID from *its own* output stream
            _create_role_and_get_id() {
              local role_name="$1"; shift
              local tmp="$(mktemp)"
              # run create; don’t fail the script if it errors (already exists etc.)
              node cli.js roles create --role "$role_name" "$@" >"$tmp" 2>&1 || true
              local id="$(_extract_uuid_from_file "$tmp")"
              rm -f "$tmp"
              printf "%s" "$id"
            }

            # Try to create (or re-create) roles and grab their IDs
            ADMIN_ROLE_ID="$(_create_role_and_get_id "Administrator" --admin --app)"
            EDITOR_ROLE_ID="$(_create_role_and_get_id "Editor" --app)"

            # IDs printed above; make sure they are in the environment for everything that follows
            export ADMIN_ROLE_ID
            export EDITOR_ROLE_ID

            # Build AUTH_GITHUB_ROLE_MAPPING purely in sh from TEAM_ROLE_MAP and the two IDs
            TEAM_ROLE_MAP="${TEAM_ROLE_MAP:-github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor}"

            make_mapping() {
              pairs="$1"
              admin_id="$2"
              editor_id="$3"
              out='json:{'
              first=1
              OLDIFS="$IFS"; IFS=',' 
              for kv in $pairs; do
                IFS="$OLDIFS"
                group="${kv%%=*}"
                name="${kv#*=}"
                id=""
                [ "$name" = "Administrator" ] && id="$admin_id"
                [ "$name" = "Editor" ] && id="$editor_id"
                if [ -n "$id" ]; then
                  [ $first -eq 0 ] && out="$out,"
                  out="$out\"$group\":\"$id\""
                  first=0
                else
                  echo "  ⚠ no id available for role name: $name" >&2
                fi
                IFS=',' 
              done
              IFS="$OLDIFS"
              out="$out}"
              printf "%s" "$out"
            }

            AUTH_GITHUB_ROLE_MAPPING="$(make_mapping "$TEAM_ROLE_MAP" "$ADMIN_ROLE_ID" "$EDITOR_ROLE_ID")"
            export AUTH_GITHUB_ROLE_MAPPING
            echo "✅ AUTH_GITHUB_ROLE_MAPPING = $AUTH_GITHUB_ROLE_MAPPING"

            # Ensure admin user exists to disable setup form
            echo "👤 Ensuring admin user exists..."
            admin_tmp="$(mktemp)"
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            # Try to create admin user (will fail if exists, which is fine)
            if node cli.js users create --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --role "$ADMIN_ROLE_ID" >"$admin_tmp" 2>&1; then
              echo "✅ Admin user created successfully"
            else
              if grep -q "already exists\|duplicate\|unique constraint" "$admin_tmp"; then
                echo "✅ Admin user already exists"
              else
                echo "⚠️ Admin user creation issue (continuing anyway):"
                cat "$admin_tmp"
              fi
            fi
            rm -f "$admin_tmp"

            echo "🚀 Starting Directus server..."
            # Reset cache settings for production mode
            unset NO_COLOR LOG_STYLE
            export LOG_LEVEL=info
            export CACHE_ENABLED=true
            export RATE_LIMITER_ENABLED=true
            
            # Clear any lingering schema cache issues before starting
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            
            exec node cli.js start
        ports:
        - containerPort: 8055
        env:
        - name: AUTH_PROVIDERS
          value: "github"
        - name: AUTH_DISABLE_DEFAULT
          value: "true"

        # Optional: your default team→role names (left = proxy group; right = Directus role name)
        - name: TEAM_ROLE_MAP
          value: "github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor"

        # Database configuration
        - name: DB_CLIENT
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_CLIENT } }
