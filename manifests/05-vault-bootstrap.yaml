# =========================
# Directus CMS Platform with Vault Integration (dynamic team→role mapping)
# =========================

# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-directus-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Force=true
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → directus..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: directus/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: directus-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              apk add --no-cache jq curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              while ! curl -sS -o /dev/null --connect-timeout 2 --max-time 5 "$VAULT_ADDR/v1/sys/health"; do
                echo "⏳ Waiting for Vault at $VAULT_ADDR..."
                sleep 5
              done

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"; break
                fi
                if vault secrets list -format=json 2>/dev/null | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                fi
                vault secrets enable -path=secret -version=2 kv && break
                sleep 2
              done

              echo "🔐 Seeding directus credentials (if missing)..."
              if ! vault kv get -format=json secret/directus/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/directus/admin email=admin@suncoastsystems.com password="$PASS"
              fi
              
              if ! vault kv get -format=json secret/directus/keys >/dev/null 2>&1; then
                KEY="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                SECRET="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/directus/keys key="$KEY" secret="$SECRET"
              fi

              # Static role token used by Gravitee token exchange bridge (if missing).
              if ! vault kv get -format=json secret/directus/gravitee >/dev/null 2>&1; then
                TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/directus/gravitee token="$TOKEN"
              fi

              # Shared bearer token used by the Cloudflare shell worker when calling the CMS content resolver.
              if ! vault kv get -format=json secret/cms-content-resolver >/dev/null 2>&1; then
                TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/cms-content-resolver token="$TOKEN"
              fi

              # Internal bearer token used by the runtime canary CronJob when calling runtime-status-service.
              if ! vault kv get -format=json secret/runtime-status-service >/dev/null 2>&1; then
                TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/runtime-status-service token="$TOKEN"
              fi

              # Internal bearer token used by platform deploy runner callbacks.
              if ! vault kv get -format=json secret/platform-deploy-service >/dev/null 2>&1; then
                TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/platform-deploy-service token="$TOKEN"
              fi
              
              # Redis password is already managed in existing Redis instance

              EXTERNAL_DB_CFG="$(vault kv get -format=json secret/directus/db 2>/dev/null || true)"
              EXTERNAL_DB_HOST="$(printf '%s' "${EXTERNAL_DB_CFG}" | jq -r '.data.data.host // empty' 2>/dev/null || true)"
              EXTERNAL_DB_PORT="$(printf '%s' "${EXTERNAL_DB_CFG}" | jq -r '.data.data.port // empty' 2>/dev/null || true)"
              EXTERNAL_DB_NAME="$(printf '%s' "${EXTERNAL_DB_CFG}" | jq -r '.data.data.database // empty' 2>/dev/null || true)"
              EXTERNAL_DB_USER="$(printf '%s' "${EXTERNAL_DB_CFG}" | jq -r '.data.data.username // empty' 2>/dev/null || true)"
              EXTERNAL_DB_PASS="$(printf '%s' "${EXTERNAL_DB_CFG}" | jq -r '.data.data.password // empty' 2>/dev/null || true)"
              if [ -z "${EXTERNAL_DB_HOST}" ] || [ -z "${EXTERNAL_DB_PORT}" ] || [ -z "${EXTERNAL_DB_NAME}" ] || [ -z "${EXTERNAL_DB_USER}" ] || [ -z "${EXTERNAL_DB_PASS}" ]; then
                TOPLEVEL_DB_CFG="$(vault kv get -format=json secret/directus_db 2>/dev/null || true)"
                EXTERNAL_DB_HOST="$(printf '%s' "${TOPLEVEL_DB_CFG}" | jq -r '.data.data.directus_db_host // .data.data.host // empty' 2>/dev/null || true)"
                EXTERNAL_DB_PORT="$(printf '%s' "${TOPLEVEL_DB_CFG}" | jq -r '.data.data.directus_db_port // .data.data.port // empty' 2>/dev/null || true)"
                EXTERNAL_DB_NAME="$(printf '%s' "${TOPLEVEL_DB_CFG}" | jq -r '.data.data.directus_db_database // .data.data.database // .data.data.db // empty' 2>/dev/null || true)"
                EXTERNAL_DB_USER="$(printf '%s' "${TOPLEVEL_DB_CFG}" | jq -r '.data.data.directus_db_username // .data.data.directus_db_user // .data.data.username // empty' 2>/dev/null || true)"
                EXTERNAL_DB_PASS="$(printf '%s' "${TOPLEVEL_DB_CFG}" | jq -r '.data.data.directus_db_password // .data.data.password // empty' 2>/dev/null || true)"
              fi
              if [ -z "${EXTERNAL_DB_HOST}" ] || [ -z "${EXTERNAL_DB_PORT}" ] || [ -z "${EXTERNAL_DB_NAME}" ] || [ -z "${EXTERNAL_DB_USER}" ] || [ -z "${EXTERNAL_DB_PASS}" ]; then
                LEAF_USER_CFG="$(vault kv get -format=json secret/directus_db_user 2>/dev/null || true)"
                LEAF_PASSWROD_CFG="$(vault kv get -format=json secret/directus_db_passwrod 2>/dev/null || true)"
                LEAF_PASSWORD_CFG="$(vault kv get -format=json secret/directus_db_password 2>/dev/null || true)"
                LEAF_HOST_CFG="$(vault kv get -format=json secret/directus_db_host 2>/dev/null || true)"
                LEAF_PORT_CFG="$(vault kv get -format=json secret/directus_db_port 2>/dev/null || true)"
                LEAF_DATABASE_CFG="$(vault kv get -format=json secret/directus_db_database 2>/dev/null || true)"
                LEAF_TUNNEL_HOST_CFG="$(vault kv get -format=json secret/directus_db_tunnel_host 2>/dev/null || true)"
                LEAF_SSH_TUNNEL_HOST_CFG="$(vault kv get -format=json secret/directus_db_ssh_tunnel_host 2>/dev/null || true)"
                EXTERNAL_DB_USER="$(printf '%s' "${LEAF_USER_CFG}" | jq -r '.data.data.value // .data.data.username // .data.data.user // .data.data.directus_db_user // .data.data.directus_db_username // empty' 2>/dev/null || true)"
                EXTERNAL_DB_PASS="$(printf '%s' "${LEAF_PASSWROD_CFG}" | jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' 2>/dev/null || true)"
                if [ -z "${EXTERNAL_DB_PASS}" ]; then
                  EXTERNAL_DB_PASS="$(printf '%s' "${LEAF_PASSWORD_CFG}" | jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' 2>/dev/null || true)"
                fi
                EXTERNAL_DB_HOST="$(printf '%s' "${LEAF_HOST_CFG}" | jq -r '.data.data.value // .data.data.host // .data.data.directus_db_host // empty' 2>/dev/null || true)"
                LEAF_TUNNEL_HOST="$(printf '%s' "${LEAF_SSH_TUNNEL_HOST_CFG}" | jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' 2>/dev/null || true)"
                if [ -z "${LEAF_TUNNEL_HOST}" ] || [ "${LEAF_TUNNEL_HOST}" = "null" ]; then
                  LEAF_TUNNEL_HOST="$(printf '%s' "${LEAF_TUNNEL_HOST_CFG}" | jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' 2>/dev/null || true)"
                fi
                if [ -n "${LEAF_TUNNEL_HOST}" ] && [ "${LEAF_TUNNEL_HOST}" != "null" ]; then
                  EXTERNAL_DB_HOST="${LEAF_TUNNEL_HOST}"
                fi
                EXTERNAL_DB_PORT="$(printf '%s' "${LEAF_PORT_CFG}" | jq -r '.data.data.value // .data.data.port // .data.data.directus_db_port // empty' 2>/dev/null || true)"
                if [ -z "${EXTERNAL_DB_PORT}" ] && [ -n "${EXTERNAL_DB_HOST}" ]; then
                  EXTERNAL_DB_PORT="5432"
                fi
                EXTERNAL_DB_NAME="$(printf '%s' "${LEAF_DATABASE_CFG}" | jq -r '.data.data.value // .data.data.database // .data.data.db // .data.data.directus_db_database // empty' 2>/dev/null || true)"
                if [ -z "${EXTERNAL_DB_NAME}" ]; then
                  EXTERNAL_DB_NAME="directus"
                fi
              fi
              if [ -z "${EXTERNAL_DB_HOST}" ] || [ -z "${EXTERNAL_DB_PORT}" ] || [ -z "${EXTERNAL_DB_NAME}" ] || [ -z "${EXTERNAL_DB_USER}" ] || [ -z "${EXTERNAL_DB_PASS}" ]; then
                echo "❌ Missing required external DB credentials in Vault."
                echo "   Expected one of: secret/directus/db, secret/directus_db, or leaf secret/data/directus_db_* entries."
                echo "   Yugabyte bootstrap is disabled."
                exit 1
              fi
              echo "✅ Found external DB credentials in Vault; Yugabyte bootstrap is disabled."

              vault policy write "directus" - <<'EOF'
              path "secret/data/directus_db"                    { capabilities = ["read"] }
              path "secret/data/directus/db"                      { capabilities = ["read"] }
              path "secret/data/directus_db_user"                 { capabilities = ["read"] }
              path "secret/data/directus_db_passwrod"             { capabilities = ["read"] }
              path "secret/data/directus_db_password"             { capabilities = ["read"] }
              path "secret/data/directus_db_host"                 { capabilities = ["read"] }
              path "secret/data/directus_db_port"                 { capabilities = ["read"] }
              path "secret/data/directus_db_database"             { capabilities = ["read"] }
              path "secret/data/directus_db_tunnel_host"          { capabilities = ["read"] }
              path "secret/data/directus_db_ssh_tunnel_host"      { capabilities = ["read"] }
              path "secret/data/directus_db_tunnel_user"          { capabilities = ["read"] }
              path "secret/data/directus_db_ssh_tunnel_user"      { capabilities = ["read"] }
              path "secret/data/directus_db_ssh_private_key_b64"  { capabilities = ["read"] }
              path "secret/data/directus/admin"                    { capabilities = ["read"] }
              path "secret/data/directus/keys"                     { capabilities = ["read"] }
              path "secret/data/directus/gravitee"                 { capabilities = ["read"] }
              path "secret/data/directus/gravitee/clients/*"        { capabilities = ["read"] }
              path "secret/data/directus/gravitee/openapi/*"        { capabilities = ["read"] }
              path "secret/data/cms-content-resolver"               { capabilities = ["read"] }
              path "secret/data/runtime-status-service"              { capabilities = ["read"] }
              path "secret/data/platform-deploy-service"             { capabilities = ["read"] }
              path "secret/data/keycloak-client-id-*"               { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-*"           { capabilities = ["read"] }
              path "secret/data/kafka-scram-user-cms-content-resolver"          { capabilities = ["read"] }
              path "secret/data/kafka-scram-user-cms-content-resolver-password" { capabilities = ["read"] }
              path "secret/data/open_ai_key"                       { capabilities = ["read"] }
              path "secret/data/redis"                             { capabilities = ["read"] }
              path "secret/data/vaultadmin"                        { capabilities = ["read"] }
              path "secret/data/directus/github"                   { capabilities = ["read"] }  # <-- GitHub OAuth creds
              EOF

              vault write auth/kubernetes/role/directus \
                bound_service_account_names="directus" \
                bound_service_account_namespaces="directus" \
                policies="directus" \
                ttl="48h"

              graphql_api_client_id="$(vault kv get -field=value secret/keycloak-client-id-graphql-api 2>/dev/null || true)"
              if [ -z "${graphql_api_client_id}" ]; then
                echo "GraphQL API client id was empty in Vault; cannot write platform-deploy-service Vault policy."
                exit 1
              fi

              vault policy write "platform-deploy-service" - <<EOF
              path "secret/data/keycloak-client-id-graphql-api"        { capabilities = ["read"] }
              path "secret/data/directus/gravitee/clients/${graphql_api_client_id}" { capabilities = ["read"] }
              path "secret/data/platform-deploy-service"              { capabilities = ["create", "read", "update"] }
              path "secret/data/platform-deploy-service/*"            { capabilities = ["create", "read", "update"] }
              EOF

              vault write auth/kubernetes/role/platform-deploy-service \
                bound_service_account_names="platform-deploy-service" \
                bound_service_account_namespaces="directus" \
                policies="platform-deploy-service" \
                ttl="48h"

              vault policy write "platform-deploy-executor" - <<'EOF'
              path "secret/data/platform-deploy-service"              { capabilities = ["read"] }
              path "secret/data/platform-deploy-service/*"            { capabilities = ["read"] }
              path "secret/data/auth-gateway-admin-api"               { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/platform-deploy-executor \
                bound_service_account_names="platform-deploy-executor" \
                bound_service_account_namespaces="directus" \
                policies="platform-deploy-executor" \
                ttl="48h"

              # Directus AI proxy uses Keycloak client_credentials to call Gravitee-protected APIs.
              # Keep permissions narrow: only the specific Keycloak client creds are readable.
              vault policy write "directus-ai-proxy" - <<'EOF'
              path "secret/data/keycloak-client-id-cms-site-internal"     { capabilities = ["read"] }
              path "secret/data/keycloak-client-secret-cms-site-internal" { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/directus-ai-proxy \
                bound_service_account_names="directus-ai-proxy" \
                bound_service_account_namespaces="directus" \
                policies="directus-ai-proxy" \
                ttl="48h"

              echo "ℹ️ Vault bootstrap complete (external DB mode). DB connectivity checks run in Directus init containers."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
# RBAC for initialization jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader-directus
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-directus
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: directus
    namespace: directus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader-directus
