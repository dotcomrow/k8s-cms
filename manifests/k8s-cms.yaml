# =========================
# Directus CMS Platform with Vault Integration
# =========================

# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-directus-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → directus..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: directus/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: directus-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=directus
              ROLE_GROUP=directus
              ROLE_OWNER=directus_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"; break
                fi
                if vault secrets list -format=json 2>/dev/null | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                fi
                vault secrets enable -path=secret -version=2 kv && break
                sleep 2
              done

              echo "🔐 Seeding directus credentials (if missing)..."
              if ! vault kv get -format=json secret/directus/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/directus/admin email=admin@suncoastsystems.com password="$PASS"
              fi
              
              if ! vault kv get -format=json secret/directus/keys >/dev/null 2>&1; then
                KEY="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                SECRET="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/directus/keys key="$KEY" secret="$SECRET"
              fi
              
              # Redis password is already managed in existing Redis instance

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/${VAULTADMIN_USER}..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
                if [ -n "${OUT}" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  [ -n "${VAULTADMIN_PASS}" ] && [ "${VAULTADMIN_PASS}" != "null" ] && break
                fi
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB'..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS directus AUTHORIZATION ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} SET search_path = directus;
              GRANT CONNECT ON DATABASE ${DB} TO ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA directus TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA directus TO ${ROLE_GROUP};
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA directus TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA directus
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA directus
                GRANT USAGE, SELECT ON SEQUENCES TO ${ROLE_GROUP};
              EOSQL

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
                echo "✅ Enabled database secrets engine"
              fi

              vault write yugabyte-db/static-roles/directus-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';" \
                rotation_period="24h"

              vault policy write "directus" - <<'EOF'
              path "yugabyte-db/static-creds/directus-app"         { capabilities = ["read"] }
              path "secret/data/directus/admin"                    { capabilities = ["read"] }
              path "secret/data/directus/keys"                     { capabilities = ["read"] }
              path "secret/data/redis"                             { capabilities = ["read"] }
              path "secret/data/vaultadmin"                        { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/directus \
                bound_service_account_names="directus" \
                bound_service_account_namespaces="directus" \
                policies="directus" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/directus-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as $DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# RBAC for initialization jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader-directus
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-directus
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: directus
    namespace: directus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader-directus
---
# Namespace for Directus CMS
apiVersion: v1
kind: Namespace
metadata:
  name: directus
  labels:
    app: directus-cms
  annotations:
    linkerd.io/inject: enabled
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
    field.cattle.io/projectId: "local:applications"
---
# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus
  namespace: directus
---
# ConfigMap for Directus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-config
  namespace: directus
data:
  DB_CLIENT: "pg"
  DB_HOST: "yb-tserver-service.yugabyte.svc.cluster.local"
  DB_PORT: "5433"
  DB_DATABASE: "directus"
  DB_SCHEMA: "directus"
  CACHE_ENABLED: "true"
  CACHE_STORE: "redis"
  REDIS_HOST: "redis-headless.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  RATE_LIMITER_ENABLED: "true"
  RATE_LIMITER_STORE: "redis"
  STORAGE_LOCATIONS: "local"
  STORAGE_LOCAL_DRIVER: "local"
  STORAGE_LOCAL_ROOT: "./uploads"
  LOG_LEVEL: "info"
  LOG_STYLE: "pretty"
  PUBLIC_URL: "https://cms.suncoastsystems.com"
  CORS_ENABLED: "true"
  CORS_ORIGIN: "true"
  ASSETS_CACHE_TTL: "30d"
---
# Vault Agent Configuration for Directus
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false
    
    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }
    
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }
      
      sink "file" {
        config = {
          path = "/vault/token"
        }
      }
    }
    
    template {
      source      = "/vault-templates/db-creds.tpl"
      destination = "/vault-secrets/db-creds.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/app-keys.tpl"
      destination = "/vault-secrets/app-keys.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/admin-creds.tpl"
      destination = "/vault-secrets/admin-creds.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/redis-creds.tpl"
      destination = "/vault-secrets/redis-creds.env"
      perms       = 0644
    }
  
  db-creds.tpl: |
    {{ with secret "yugabyte-db/static-creds/directus-app" -}}
    export DB_USER="{{ .Data.username }}"
    export DB_PASSWORD="{{ .Data.password }}"
    {{- end }}
  
  app-keys.tpl: |
    {{ with secret "secret/data/directus/keys" -}}
    export KEY="{{ .Data.data.key }}"
    export SECRET="{{ .Data.data.secret }}"
    {{- end }}
  
  admin-creds.tpl: |
    {{ with secret "secret/data/directus/admin" -}}
    export ADMIN_EMAIL="{{ .Data.data.email }}"
    export ADMIN_PASSWORD="{{ .Data.data.password }}"
    {{- end }}
  
  redis-creds.tpl: |
    {{ with secret "secret/data/redis" -}}
    export REDIS_PASSWORD="{{ .Data.data.password }}"
    {{- end }}
---
# Using existing Redis instance at redis-headless.redis.svc.cluster.local (master service)
---
# PersistentVolumeClaim for Directus uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads
  namespace: directus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-client  # Use nfs-client storage class
---
# Directus Deployment with Vault integration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: directus
  labels:
    app: directus
spec:
  replicas: 1  # Start with single replica to avoid concurrent database initialization
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0  # Prevent multiple pods during deployment
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      serviceAccountName: directus
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus
        - name: vault-secrets
          emptyDir: {}
        - name: vault-templates
          configMap:
            name: vault-agent-config-directus
            items:
              - key: db-creds.tpl
                path: db-creds.tpl
              - key: app-keys.tpl
                path: app-keys.tpl
              - key: admin-creds.tpl
                path: admin-creds.tpl
              - key: redis-creds.tpl
                path: redis-creds.tpl
      initContainers:
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job vault/directus-yugabyte-config to complete..."
              while true; do
                if ! kubectl -n vault get job directus-yugabyte-config >/dev/null 2>&1; then
                  echo "  └─ job not found yet..."; sleep 5; continue
                fi
                SUCC="$(kubectl -n vault get job directus-yugabyte-config -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"; SUCC="${SUCC:-0}"
                [ "$SUCC" -ge 1 ] && break
                sleep 5
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "⏳ Waiting for existing Redis instance to be ready..."
              until redis-cli -h redis-headless.redis.svc.cluster.local -p 6379 ping; do
                echo "Redis not ready, waiting..."
                sleep 5
              done
              echo "✅ Existing Redis instance is ready"
      containers:
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
        volumeMounts:
        - name: vault-agent-config
          mountPath: /vault-config
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: vault-templates
          mountPath: /vault-templates
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      - name: directus
        image: directus/directus:11
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "⏳ Waiting for Vault agent to generate all credential files..."
            
            while [ ! -f /vault-secrets/db-creds.env ] || \
                  [ ! -f /vault-secrets/app-keys.env ] || \
                  [ ! -f /vault-secrets/admin-creds.env ] || \
                  [ ! -f /vault-secrets/redis-creds.env ]; do
              echo "Waiting for credential files..."
              sleep 2
            done
            
            echo "✅ All credential files retrieved from Vault"
            echo "🔑 Loading credentials..."
            
            source /vault-secrets/db-creds.env
            source /vault-secrets/app-keys.env
            source /vault-secrets/admin-creds.env  
            source /vault-secrets/redis-creds.env
            
            # Export all required environment variables
            export DB_USER
            export DB_PASSWORD
            export KEY
            export SECRET
            export ADMIN_EMAIL
            export ADMIN_PASSWORD
            export REDIS_PASSWORD
            
            echo "🔄 Initializing Directus database..."
            

            # Count tables to check completeness - try multiple approaches
            echo "🔍 Checking database schema and table count..."
            
            # First try to check if directus_users exists (key table)
            if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SELECT 1 FROM directus_users LIMIT 1;" >/dev/null 2>&1; then
              table_count=27  # Assume complete installation if directus_users exists
              echo "📊 Database appears complete (directus_users table exists)"
            else
              # If that fails, try to count tables in public schema (YugabyteDB default)
              table_count=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'directus_%';" 2>/dev/null | tr -d ' \n\r' || echo "0")
              
              # Ensure table_count is a valid number
              if ! [ "$table_count" -eq "$table_count" ] 2>/dev/null; then
                table_count=0
              fi
              
              echo "📊 Found $table_count Directus tables in database"
            fi
            
            if [ "$table_count" -ge 25 ]; then
              echo "✅ Database appears complete with $table_count tables, skipping install"
            else
              echo "📦 Database incomplete ($table_count tables), attempting to complete installation..."
              
              # If some tables exist but not complete, try to reset and reinstall
              if [ "$table_count" -gt 0 ]; then
                echo "🔄 Partial installation detected, resetting database..."
                # Drop existing directus tables to allow clean reinstall
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "
                  DO \$\$ 
                  DECLARE
                    r RECORD;
                  BEGIN
                    FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'directus') 
                    LOOP
                      EXECUTE 'DROP TABLE IF EXISTS directus.' || quote_ident(r.tablename) || ' CASCADE';
                    END LOOP;
                  END \$\$;
                " 2>/dev/null || true
              fi
              
              # Run database installation with retry for YugabyteDB concurrency
              for attempt in 1 2 3 4 5; do
                echo "Database install attempt $attempt..."
                if node cli.js database install; then
                  echo "✅ Database installation completed successfully"
                  break
                elif [ $attempt -eq 5 ]; then
                  echo "❌ Database installation failed after 5 attempts"
                  exit 1
                else
                  echo "⚠️ Install attempt $attempt failed, waiting before retry..."
                  sleep $((attempt * 3))
                fi
              done
            fi
            
            # Wait for any remaining DDL transactions
            echo "⏳ Waiting for database to settle..."
            sleep 5
            
            # Force complete all migrations
            echo "🔄 Running database migrations with retry..."
            for i in 1 2 3; do
              echo "Migration attempt $i..."
              
              # Try to run all pending migrations
              if node cli.js database migrate:latest; then
                echo "✅ All migrations completed successfully"
                break
              elif node cli.js database migrate:up; then
                echo "✅ Migration up completed successfully"
                break
              else
                echo "⚠️ Migration attempt $i failed, waiting before retry..."
                
                # On final attempt, try bootstrap to ensure schema is current
                if [ $i -eq 3 ]; then
                  echo "🔄 Final attempt: trying bootstrap to complete schema..."
                  node cli.js bootstrap || echo "Bootstrap also failed"
                fi
                
                sleep $((i * 5))
              fi
            done
            
            # Verify schema is complete by counting tables again
            final_table_count=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'directus_%';" 2>/dev/null | tr -d ' \n\r' || echo "0")
            echo "📊 Final table count: $final_table_count tables"
            
            echo "🔍 Debug: Environment check..."
            echo "DB_HOST: $DB_HOST, DB_USER: $DB_USER, DB_SCHEMA: $DB_SCHEMA"
            echo "REDIS_HOST: $REDIS_HOST"
            echo "Credentials loaded: KEY(${#KEY}), SECRET(${#SECRET}), ADMIN_EMAIL($ADMIN_EMAIL)"
            
            # Ensure proper schema connection
            export DB_SEARCH_PATH="directus"
            
            echo "🚀 Starting Directus server..."
            exec node cli.js start
        ports:
        - containerPort: 8055
        env:
        # Database configuration
        - name: DB_CLIENT
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: DB_CLIENT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: DB_PORT
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: DB_DATABASE
        - name: DB_SCHEMA
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: DB_SCHEMA
        # Cache configuration
        - name: CACHE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: CACHE_ENABLED
        - name: CACHE_STORE
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: CACHE_STORE
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: REDIS_PORT
        # Rate limiting
        - name: RATE_LIMITER_ENABLED
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: RATE_LIMITER_ENABLED
        - name: RATE_LIMITER_STORE
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: RATE_LIMITER_STORE
        # Storage configuration
        - name: STORAGE_LOCATIONS
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: STORAGE_LOCATIONS
        - name: STORAGE_LOCAL_DRIVER
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: STORAGE_LOCAL_DRIVER
        - name: STORAGE_LOCAL_ROOT
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: STORAGE_LOCAL_ROOT
        # Other configuration
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: LOG_LEVEL
        - name: LOG_STYLE
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: LOG_STYLE
        - name: PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: PUBLIC_URL
        - name: CORS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: CORS_ENABLED
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: CORS_ORIGIN
        - name: ASSETS_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: directus-config
              key: ASSETS_CACHE_TTL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /server/health
            port: 8055
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /server/health
            port: 8055
          initialDelaySeconds: 90
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /directus/uploads
        - name: vault-secrets
          mountPath: /vault-secrets
---
# Directus Service
apiVersion: v1
kind: Service
metadata:
  name: directus-service
  namespace: directus
  labels:
    app: directus
spec:
  selector:
    app: directus
  ports:
  - name: http
    port: 8055
    targetPort: 8055
    protocol: TCP
  type: ClusterIP
---
# HorizontalPodAutoscaler for automatic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: directus-hpa
  namespace: directus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: directus
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
