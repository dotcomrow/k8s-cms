# =========================
# Directus CMS Platform with Vault Integration (dynamic team→role mapping)
# =========================

# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-directus-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → directus..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: directus/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: directus-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: Force=true
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=directus
              ROLE_GROUP=directus
              ROLE_OWNER=directus_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              while ! curl -sS -o /dev/null --connect-timeout 2 --max-time 5 "$VAULT_ADDR/v1/sys/health"; do
                echo "⏳ Waiting for Vault at $VAULT_ADDR..."
                sleep 5
              done

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"; break
                fi
                if vault secrets list -format=json 2>/dev/null | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                fi
                vault secrets enable -path=secret -version=2 kv && break
                sleep 2
              done

              echo "🔐 Seeding directus credentials (if missing)..."
              if ! vault kv get -format=json secret/directus/admin >/dev/null 2>&1; then
                PASS="$(tr -dc 'A-Za-z0-9@#%^+=_' </dev/urandom | head -c 32)"
                vault kv put secret/directus/admin email=admin@suncoastsystems.com password="$PASS"
              fi
              
              if ! vault kv get -format=json secret/directus/keys >/dev/null 2>&1; then
                KEY="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                SECRET="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
                vault kv put secret/directus/keys key="$KEY" secret="$SECRET"
              fi
              
              # Redis password is already managed in existing Redis instance

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/${VAULTADMIN_USER}..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
                if [ -n "${OUT}" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  [ -n "${VAULTADMIN_PASS}" ] && [ "${VAULTADMIN_PASS}" != "null" ] && break
                fi
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB'..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_GROUP}') THEN
                  CREATE ROLE ${ROLE_GROUP} NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${ROLE_OWNER}') THEN
                  CREATE ROLE ${ROLE_OWNER} LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT ${ROLE_GROUP} TO ${ROLE_OWNER};
              GRANT ${ROLE_OWNER} TO ${VAULTADMIN_USER};
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS directus AUTHORIZATION ${ROLE_OWNER};
              ALTER ROLE ${ROLE_OWNER} SET search_path = directus;
              GRANT CONNECT ON DATABASE ${DB} TO ${ROLE_OWNER};
              GRANT USAGE, CREATE ON SCHEMA directus TO ${ROLE_GROUP};
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA directus TO ${ROLE_GROUP};
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA directus TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA directus
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${ROLE_GROUP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA directus
                GRANT USAGE, SELECT ON SEQUENCES TO ${ROLE_GROUP};
              EOSQL

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
                echo "✅ Enabled database secrets engine"
              fi

              vault write yugabyte-db/static-roles/directus-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';" \
                rotation_period="24h"

              vault policy write "directus" - <<'EOF'
              path "yugabyte-db/static-creds/directus-app"         { capabilities = ["read"] }
              path "secret/data/directus/admin"                    { capabilities = ["read"] }
              path "secret/data/directus/keys"                     { capabilities = ["read"] }
              path "secret/data/open_ai_key"                       { capabilities = ["read"] }
              path "secret/data/redis"                             { capabilities = ["read"] }
              path "secret/data/vaultadmin"                        { capabilities = ["read"] }
              path "secret/data/directus/github"                   { capabilities = ["read"] }  # <-- GitHub OAuth creds
              EOF

              vault write auth/kubernetes/role/directus \
                bound_service_account_names="directus" \
                bound_service_account_namespaces="directus" \
                policies="directus" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/directus-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as $DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
# RBAC for initialization jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader-directus
  namespace: vault
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-status-reader-for-directus
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: directus
    namespace: directus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-status-reader-directus
---
# Namespace for Directus CMS
apiVersion: v1
kind: Namespace
metadata:
  name: directus
  labels:
    app: directus-cms
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/skip-outbound-ports: "5433"
    field.cattle.io/projectId: "local:applications"
---
# Service Account for Directus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus
  namespace: directus
---
# ConfigMap for Directus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-config
  namespace: directus
data:
  DB_CLIENT: "pg"
  DB_HOST: "yb-tserver-service.yugabyte.svc.cluster.local"
  DB_PORT: "5433"
  DB_DATABASE: "directus"
  DB_SCHEMA: "directus"
  DB_POOL__MIN: "0"
  DB_POOL__MAX: "20"

  CACHE_ENABLED: "true"
  CACHE_STORE: "redis"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis-0.redis-headless.redis.svc.cluster.local"
  REDIS_PORT: "6379"

  RATE_LIMITER_ENABLED: "true"
  RATE_LIMITER_STORE: "redis"

  STORAGE_LOCATIONS: "local"
  STORAGE_LOCAL_DRIVER: "local"
  STORAGE_LOCAL_ROOT: "./uploads"

  LOG_LEVEL: "info"
  LOG_STYLE: "pretty"
  PUBLIC_URL: "https://cms.teleport.app.suncoast.systems/"

  CORS_ENABLED: "true"
  CORS_ORIGIN: "true"
  ASSETS_CACHE_TTL: "30d"

  # --- GitHub OAuth (Directus reads these envs) ---
  AUTH_GITHUB_DRIVER: "oauth2"
  AUTH_GITHUB_AUTHORIZE_URL: "https://github.com/login/oauth/authorize"
  AUTH_GITHUB_ACCESS_URL: "https://github.com/login/oauth/access_token"
  # Provide the FULL profile proxy URL (including ?key=...) via Vault/AVP:
  AUTH_GITHUB_PROFILE_URL: "<path:secret/data/directus-github-profile-api-url#value><path:secret/data/directus-github-profile-api-key#value>"

  # Keep CLIENT_ID/SECRET here only if AVP resolves them; otherwise they are injected by Vault Agent below.
  AUTH_GITHUB_CLIENT_ID: "<path:secret/data/directus-oauth-client-id#value>"
  AUTH_GITHUB_CLIENT_SECRET: "<path:secret/data/directus-oauth-client-secret#value>"
  # Increase OAuth2 userinfo timeout for cold-starting profile proxy
  AUTH_GITHUB_CLIENT_HTTP__TIMEOUT: "15000"

  AUTH_GITHUB_IDENTIFIER_KEY: "id"
  AUTH_GITHUB_EMAIL_KEY: "email"
  AUTH_GITHUB_SCOPE: "read:user user:email read:org"
  AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION: "true"
  AUTH_GITHUB_GROUP_CLAIM_NAME: "groups"
  AUTH_GITHUB_SYNC_USER_INFO: "true"
  AUTH_GITHUB_FIRST_NAME_KEY: "name"
  # Directus 11 no longer supports PROFILE_TRANSFORM; handled via hook extension.

  WEBSOCKETS_ENABLED: "true"
  # Yugabyte can throw transient catalog snapshot errors during collab init; disable collab handler by default.
  WEBSOCKETS_COLLAB_ENABLED: "false"
---
# Optional Directus settings patch.
# Add fields to settings.yaml to apply them via DB on startup.
# Note: If you add secrets here (e.g. OpenAI key), AVP will render them into a ConfigMap.
# Consider whether a Secret is more appropriate for your threat model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-settings
  namespace: directus
data:
  settings.yaml: |
    id: 1 # Singleton settings row id (always 1).
    project_name: "Suncoast Systems CMS" # Project name shown in Data Studio, login, and public pages.
    project_descriptor: "Content Management System for Suncoast Systems" # Short descriptor shown beneath the project name in Data Studio.
    project_url: null # URL opened when clicking the top-left logo in the module bar.
    project_color: "#6644FF" # Brand color (hex) for logo, login, and public pages.
    project_logo: null # File id for 40x40 logo (directus_files).
    public_foreground: null # File id for public page foreground image (directus_files).
    public_background: null # File id for public page background image/video (directus_files).
    public_favicon: null # File id for Data Studio favicon (directus_files).
    public_note: null # Markdown note shown on the public/login page.
    default_appearance: auto # Theme mode: auto | light | dark.
    default_theme_light: null # Theme name/id for light mode (from themes list).
    default_theme_dark: null # Theme name/id for dark mode (from themes list).
    theme_light_overrides: null # JSON of theme token overrides for light mode.
    theme_dark_overrides: null # JSON of theme token overrides for dark mode.
    default_language: en-US # Default language locale for the app (e.g. en-US).
    auth_login_attempts: 25 # Failed login attempts before account is locked/suspended.
    auth_password_policy: null # Password policy regex or preset (none/weak/strong/custom); null disables.
    storage_asset_transform: all # Asset transforms: all | none | presets.
    storage_asset_presets: null # Array of preset objects (key, fit, width, height, quality, withoutEnlargement, format, etc).
    # example:
    # - key: small
    #   fit: cover
    #   width: 200
    #   height: 161
    #   quality: 80
    #   withoutEnlargement: false
    custom_css: null # Custom CSS injected into the Data Studio.
    storage_default_folder: null # Default upload folder id (directus_folders).
    basemaps: null # Array of custom basemap tile configs; overrides Mapbox defaults.
    # example (UI fields: name, type, tileSize, url, attribution):
    # - name: OpenStreetMap
    #   type: raster
    #   tileSize: 256
    #   url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    #   attribution: "(c) OpenStreetMap contributors"
    #   # type values map to UI choices: Raster | Raster TileJSON | Mapbox Style
    mapbox_key: null # Mapbox access token for map features.
    module_bar: null # Module bar config array (visibility, order, custom links with name/icon/url).
    # example (core modules, order matters):
    # - content
    # - files
    # - insights
    # - settings
    # # Use the UI then read /settings to capture the exact structure for your version.
    custom_aspect_ratios: null # Array of { text, value } for image editor aspect ratios.
    # example:
    # - text: "16:10"
    #   value: 1.6
    report_error_url: null # Error report URL template with error/route/user context variables.
    report_bug_url: null # Bug report URL.
    report_feature_url: null # Feature request URL.
    public_registration: false # Enable user self-registration.
    public_registration_verify_email: true # Require email verification for new registrations.
    public_registration_role: null # Role id assigned to new registrations (non-admin).
    public_registration_email_filter: null # Email filter rule(s) using Directus string filters.
    visual_editor_urls: null # List of allowed website URLs for Visual Editor module.
    # example:
    # - https://www.example.com
    # - https://admin.example.com
    mcp_enabled: true # Enable MCP server in Settings > AI > Model Context Protocol.
    mcp_allow_deletes: false # Allow destructive MCP tools (delete items/files/fields/etc).
    mcp_prompts_collection: null # Collection for MCP stored prompts.
    mcp_system_prompt_enabled: true # Use default MCP system prompt.
    mcp_system_prompt: null # Custom MCP system prompt (overrides default).
    ai_openai_api_key: "<path:secret/data/open_ai_key#value>" # OpenAI API key for AI Chat (encrypted at rest; AVP renders).
    # Directus AI providers are enabled when their API key (and for openai-compatible: base URL) is configured.
    # Standard providers (openai/anthropic/google) also require a non-empty allowed-models list.
    ai_anthropic_api_key: null # Anthropic API key for AI Chat.
    ai_google_api_key: null # Google (Gemini) API key for AI Chat.
    # OpenAI-compatible provider (useful for proxies / gateways / self-hosted OpenAI-compatible endpoints).
    # Note: api keys are encrypted at rest; the manifest startup script stores the key in encrypted form.
    ai_openai_compatible_api_key: "<path:secret/data/open_ai_key#value>" # OpenAI-compatible API key (encrypted at rest).
    ai_openai_compatible_base_url: "https://api.openai.com/v1" # OpenAI-compatible base URL.
    ai_openai_compatible_name: "openai-compatible" # Provider name (UI label / providerOptions key).
    ai_openai_compatible_models:
      - id: "gpt-4o-mini"
        name: "GPT-4o Mini"
        context: 128000
        output: 16384
        attachment: true
        reasoning: false
      - id: "gpt-5-nano"
        name: "GPT-5 Nano"
        context: 400000
        output: 128000
        attachment: true
        reasoning: true
      - id: "gpt-5-mini"
        name: "GPT-5 Mini"
        context: 400000
        output: 128000
        attachment: true
        reasoning: true
      - id: "gpt-5"
        name: "GPT-5"
        context: 400000
        output: 128000
        attachment: true
        reasoning: true
    ai_openai_compatible_headers: null # Optional: [{ header, value }, ...]
    # Allowed models (empty/null disables the provider in /ai/chat).
    ai_openai_allowed_models: ["gpt-4o-mini","gpt-5-nano","gpt-5-mini","gpt-5"]
    ai_anthropic_allowed_models: ["claude-haiku-4-5","claude-sonnet-4-5"]
    ai_google_allowed_models: ["gemini-3-pro-preview","gemini-3-flash-preview","gemini-2.5-pro","gemini-2.5-flash"]
    ai_system_prompt: null # Custom AI Chat system prompt.
    collaborative_editing_enabled: false # Disable collaborative editing (collab websockets) by default.
    project_id: null # Undocumented; likely Directus Cloud metadata (leave null for self-hosted).
    project_owner: null # Undocumented; likely project owner user id (Cloud).
    project_usage: null # Undocumented; likely usage telemetry/metadata (Cloud).
    org_name: null # Undocumented; likely organization name (Cloud).
    product_updates: null # Undocumented; likely product updates metadata (Cloud).
    project_status: null # Undocumented; likely project status (Cloud).
---
# Directus hook extension: sync GitHub profile fields + avatar on SSO
apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-extensions
  namespace: directus
data:
  github-profile-sync.package.json: |
    {
      "name": "directus-extension-github-profile-sync",
      "version": "1.0.0",
      "type": "module",
      "directus:extension": {
        "type": "hook",
        "path": "index.js",
        "source": "index.js",
        "host": "^11.0.0"
      }
    }
  github-profile-sync.index.js: |
    const PROVIDER = 'github';

    const isNonEmpty = (value) => value !== null && value !== undefined && value !== '';
    const isObject = (value) => value && typeof value === 'object' && !Array.isArray(value);
    const splitName = (fullName) => {
      if (!fullName || typeof fullName !== 'string') return { firstName: undefined, lastName: undefined };
      const cleaned = fullName.trim().replace(/\s+/g, ' ');
      if (!cleaned) return { firstName: undefined, lastName: undefined };
      if (cleaned.includes(',')) {
        const parts = cleaned.split(',').map((part) => part.trim()).filter(Boolean);
        if (parts.length >= 2) return { firstName: parts.slice(1).join(' '), lastName: parts[0] };
      }
      const parts = cleaned.split(' ');
      if (parts.length === 1) return { firstName: parts[0], lastName: undefined };
      return { firstName: parts.slice(0, -1).join(' '), lastName: parts[parts.length - 1] };
    };
    const getPath = (obj, path) => {
      if (!obj) return undefined;
      return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined ? acc[key] : undefined), obj);
    };
    const pick = (obj, ...paths) => {
      if (!obj) return undefined;
      for (const path of paths) {
        const value = getPath(obj, path);
        if (isNonEmpty(value)) return value;
      }
      return undefined;
    };
    const isProfileLike = (obj) => {
      if (!isObject(obj)) return false;
      return ['login', 'id', 'html_url', 'avatar_url', 'name', 'company', 'bio']
        .some((key) => isNonEmpty(obj[key]));
    };
    const extractUserInfo = (meta) => {
      const payload = meta?.providerPayload;
      if (!isObject(payload)) return null;
      const directCandidates = [
        payload.userInfo,
        payload.profile,
        payload.user,
        payload.data,
        payload.raw,
        payload.response,
        payload.body
      ];
      for (const candidate of directCandidates) {
        if (isProfileLike(candidate)) return candidate;
      }
      if (isProfileLike(payload)) return payload;
      const queue = [{ value: payload, depth: 0 }];
      const seen = new Set();
      while (queue.length) {
        const { value, depth } = queue.shift();
        if (!isObject(value) || seen.has(value) || depth > 3) continue;
        seen.add(value);
        if (isProfileLike(value)) return value;
        for (const key of Object.keys(value)) {
          const next = value[key];
          if (isObject(next)) queue.push({ value: next, depth: depth + 1 });
        }
      }
      return null;
    };

    const buildGithubMetadata = (info, payload) => {
      const metadata = {};
      const sources = [info, payload].filter(isObject);
      const readMeta = (key) => {
        for (const src of sources) {
          const val = pick(src, key, `profile.${key}`, `data.${key}`, `user.${key}`);
          if (val !== undefined) return val;
        }
        return undefined;
      };
      const emails = readMeta('emails');
      const orgs = readMeta('orgs');
      const teams = readMeta('teams');
      if (emails !== undefined) metadata.emails = emails;
      if (orgs !== undefined) metadata.orgs = orgs;
      if (teams !== undefined) metadata.teams = teams;
      return Object.keys(metadata).length ? metadata : undefined;
    };

    export default ({ filter }, { services, logger, getSchema }) => {
      logger.info('[github-profile-sync] hook loaded');
      const { FilesService } = services;

      async function filterUserUpdates(updates, context) {
        try {
          const schema = context.schema ?? (await getSchema());
          const fields = schema?.collections?.directus_users?.fields;
          if (!fields) return updates;
          const allowed = new Set(Object.keys(fields));
          const filtered = {};
          for (const [key, value] of Object.entries(updates)) {
            if (allowed.has(key)) filtered[key] = value;
          }
          return filtered;
        } catch {
          return updates;
        }
      }

      async function maybeImportAvatar(avatarUrl, meta, context, userInfo) {
        if (!avatarUrl || typeof avatarUrl !== 'string') return undefined;

        try {
          if (meta?.identifier) {
            const existing = await context.database('directus_users')
              .select('avatar')
              .where({ external_identifier: meta.identifier, provider: PROVIDER })
              .first();

            if (existing?.avatar) return undefined;
          }

          const schema = context.schema ?? (await getSchema());
          const filesService = new FilesService({
            knex: context.database,
            schema,
            accountability: null
          });

          const title = userInfo?.login ? `${userInfo.login} (GitHub avatar)` : 'GitHub avatar';
          return await filesService.importOne(avatarUrl, { title });
        } catch (error) {
          logger.warn(error, '[github-profile-sync] Failed to import avatar from GitHub');
          return undefined;
        }
      }

      async function applyGithubProfile(payload, meta, context, opts) {
        const provider = (meta?.provider || '').toLowerCase();
        if (provider !== PROVIDER) return payload;

        const userInfo = extractUserInfo(meta);
        if (!userInfo) {
          try {
            logger.info(
              { providerPayloadKeys: Object.keys(meta?.providerPayload || {}) },
              '[github-profile-sync] No userInfo found in provider payload'
            );
          } catch {}
          return payload;
        }
        try {
          const keys = Object.keys(userInfo);
          logger.info(
            { keys: keys.slice(0, 30), total: keys.length },
            '[github-profile-sync] userInfo keys'
          );
        } catch {}

        const payloadInfo = isObject(meta?.providerPayload) ? meta.providerPayload : {};
        const updates = {};
        const login = pick(userInfo, 'login', 'profile.login', 'data.login', 'user.login')
          ?? pick(payloadInfo, 'login', 'profile.login', 'data.login', 'user.login');
        const htmlUrl = pick(userInfo, 'html_url', 'profile.html_url', 'data.html_url', 'user.html_url')
          ?? pick(payloadInfo, 'html_url', 'profile.html_url', 'data.html_url', 'user.html_url');
        const company = pick(userInfo, 'company', 'profile.company', 'data.company', 'user.company')
          ?? pick(payloadInfo, 'company', 'profile.company', 'data.company', 'user.company');
        const bio = pick(userInfo, 'bio', 'profile.bio', 'data.bio', 'user.bio')
          ?? pick(payloadInfo, 'bio', 'profile.bio', 'data.bio', 'user.bio');
        const location = pick(userInfo, 'location', 'profile.location', 'data.location', 'user.location')
          ?? pick(payloadInfo, 'location', 'profile.location', 'data.location', 'user.location');
        const title = pick(userInfo, 'title', 'profile.title', 'data.title', 'user.title')
          ?? pick(payloadInfo, 'title', 'profile.title', 'data.title', 'user.title');
        const description = pick(userInfo, 'description', 'profile.description', 'data.description', 'user.description')
          ?? pick(payloadInfo, 'description', 'profile.description', 'data.description', 'user.description');
        const givenName = pick(
          userInfo,
          'given_name',
          'first_name',
          'profile.given_name',
          'profile.first_name',
          'data.given_name',
          'data.first_name',
          'user.given_name',
          'user.first_name'
        ) ?? pick(
          payloadInfo,
          'given_name',
          'first_name',
          'profile.given_name',
          'profile.first_name',
          'data.given_name',
          'data.first_name',
          'user.given_name',
          'user.first_name'
        );
        const familyName = pick(
          userInfo,
          'family_name',
          'last_name',
          'profile.family_name',
          'profile.last_name',
          'data.family_name',
          'data.last_name',
          'user.family_name',
          'user.last_name'
        ) ?? pick(
          payloadInfo,
          'family_name',
          'last_name',
          'profile.family_name',
          'profile.last_name',
          'data.family_name',
          'data.last_name',
          'user.family_name',
          'user.last_name'
        );

        if (login) updates.github_login = login;
        if (htmlUrl) updates.github_url = htmlUrl;
        if (company) updates.github_company = company;
        if (bio) updates.github_bio = bio;
        if (location) updates.location = location;
        if (title || company) updates.title = title || company;
        if (description || bio) updates.description = description || bio;

        if (givenName || familyName) {
          if (givenName) updates.first_name = givenName;
          if (familyName) updates.last_name = familyName;
        } else {
          const name = pick(userInfo, 'name', 'profile.name', 'data.name', 'user.name')
            ?? pick(payloadInfo, 'name', 'profile.name', 'data.name', 'user.name');
          const split = splitName(name);
          if (split.firstName) updates.first_name = split.firstName;
          if (split.lastName) updates.last_name = split.lastName;
        }

        const metadata = buildGithubMetadata(userInfo, payloadInfo);
        if (metadata) updates.github_metadata = metadata;

        if (opts?.importAvatar) {
          const avatarUrl = pick(userInfo, 'avatar_url', 'profile.avatar_url', 'data.avatar_url', 'user.avatar_url')
            ?? pick(payloadInfo, 'avatar_url', 'profile.avatar_url', 'data.avatar_url', 'user.avatar_url');
          const avatarId = await maybeImportAvatar(avatarUrl, meta, context, userInfo);
          if (avatarId) updates.avatar = avatarId;
        }

        const safeUpdates = await filterUserUpdates(updates, context);
        return { ...payload, ...safeUpdates };
      }

      filter('auth.create', async (payload, meta, context) => {
        return applyGithubProfile(payload, meta, context, { importAvatar: true });
      });

      filter('auth.update', async (payload, meta, context) => {
        return applyGithubProfile(payload, meta, context, { importAvatar: true });
      });
    };
---
# Vault Agent Configuration for Directus
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-directus
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false
    
    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }
    
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "directus"
        }
      }
      
      sink "file" {
        config = {
          path = "/vault/token"
        }
      }
    }
    
    template {
      source      = "/vault-templates/db-creds.tpl"
      destination = "/vault-secrets/db-creds.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/app-keys.tpl"
      destination = "/vault-secrets/app-keys.env"
      perms       = 0644
    }
    
    template {
      source      = "/vault-templates/openai.tpl"
      destination = "/vault-secrets/openai.env"
      perms       = 0644
    }
    

    
    template {
      source      = "/vault-templates/redis-creds.tpl"
      destination = "/vault-secrets/redis-creds.env"
      perms       = 0644
    }
  
  db-creds.tpl: |
    {{ with secret "yugabyte-db/static-creds/directus-app" -}}
    export DB_USER="{{ .Data.username }}"
    export DB_PASSWORD="{{ .Data.password }}"
    {{- end }}
  
  app-keys.tpl: |
    {{ with secret "secret/data/directus/keys" -}}
    export KEY="{{ .Data.data.key }}"
    export SECRET="{{ .Data.data.secret }}"
    {{- end }}
  
  openai.tpl: |
    {{ with secret "secret/data/open_ai_key" -}}
    export OPENAI_API_KEY="{{ .Data.data.value }}"
    {{- end }}
  

  
  redis-creds.tpl: |
    {{ with secret "secret/data/redis" -}}
    export REDIS_PASSWORD="{{ .Data.data.password }}"
    {{- end }}
---
# PersistentVolumeClaim for Directus uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads
  namespace: directus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-client
---
# Directus Deployment with Vault integration & dynamic role mapping
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: directus
  labels:
    app: directus
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # start with one replica to avoid concurrent DB init
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: directus
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
        - name: uploads
          persistentVolumeClaim:
            claimName: directus-uploads
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-directus
        - name: vault-secrets
          emptyDir: {}
        - name: vault-templates
          configMap:
            name: vault-agent-config-directus
            items:
              - key: db-creds.tpl
                path: db-creds.tpl
              - key: app-keys.tpl
                path: app-keys.tpl
              - key: openai.tpl
                path: openai.tpl
              - key: redis-creds.tpl
                path: redis-creds.tpl
        - name: directus-settings
          configMap:
            name: directus-settings
            items:
              - key: settings.yaml
                path: settings.yaml
        - name: directus-extensions
          configMap:
            name: directus-extensions
            items:
              - key: github-profile-sync.package.json
                path: github-profile-sync/package.json
              - key: github-profile-sync.index.js
                path: github-profile-sync/index.js
      initContainers:
        - name: nuke-directus-roles
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu

              # tools we need (alpine base)
              apk add --no-cache curl jq >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔐 Fetching DB static creds for directus-app from Vault…"
              CREDS_URL="${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app"
              DB_USER=""
              DB_PASS=""
              i=0
              while [ "$i" -lt 40 ]; do
                CODE="$(curl -sS -o /tmp/creds.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "$CREDS_URL" || true)"
                if [ "$CODE" = "200" ]; then
                  DB_USER="$(jq -r '.data.username // empty' /tmp/creds.json)"
                  DB_PASS="$(jq -r '.data.password // empty' /tmp/creds.json)"
                  if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                    break
                  fi
                else
                  ERR="$(jq -r '.errors[0] // empty' /tmp/creds.json 2>/dev/null || true)"
                  if [ -n "$ERR" ]; then
                    echo "  .. Vault returned HTTP $CODE: $ERR"
                  else
                    echo "  .. Vault returned HTTP $CODE"
                  fi
                fi
                i=$((i + 1))
                sleep 3
              done

              if [ -z "$DB_USER" ] || [ -z "$DB_PASS" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
                echo "❌ Failed to fetch DB creds from Vault"; exit 1
              fi

              export PGPASSWORD="$DB_PASS"
              echo "🔧 Checking and truncating directus tables if they exist…"
              
              # Check if directus_roles table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_roles'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_roles..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_roles RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_roles does not exist, skipping"
              fi
              
              # Check if directus_users table exists and truncate if it does
              if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_users'" 2>/dev/null | grep -q 1; then
                echo "  └─ Truncating directus_users..."
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -c "SET search_path TO directus, public; TRUNCATE TABLE directus_users RESTART IDENTITY CASCADE;"
              else
                echo "  └─ directus_users does not exist, skipping"
              fi
              
              echo "✅ Directus tables checked and cleaned if they existed."
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
            - name: DB_DATABASE
              valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
        - name: wait-for-config-job
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-lc"]
          args:
            - |
              echo "Waiting for Job(s) with prefix 'directus-yugabyte-config' in vault namespace to complete..."

              TARGET_PREFIX="directus-yugabyte-config"
              MAX_MISSES=24 # ~2 minutes at 5s intervals
              MISSES=0

              while true; do
                # 1) If an exact job exists, check it first
                if kubectl -n vault get job "$TARGET_PREFIX" >/dev/null 2>&1; then
                  SUCC="$(kubectl -n vault get job "$TARGET_PREFIX" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  [ "${SUCC:-0}" -ge 1 ] && { echo "✅ Job $TARGET_PREFIX succeeded"; break; }
                  MISSES=0
                fi

                # 2) Otherwise, find any job whose name starts with the prefix (handles CronJob or generateName cases)
                MATCHING_JOB="$(kubectl -n vault get jobs -o json \
                  | jq -r --arg p "$TARGET_PREFIX" '.items[] | select(.metadata.name | startswith($p)) | .metadata.name' \
                  | head -n1)"

                if [ -n "$MATCHING_JOB" ]; then
                  SUCC="$(kubectl -n vault get job "$MATCHING_JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
                  if [ "${SUCC:-0}" -ge 1 ]; then
                    echo "✅ Job $MATCHING_JOB succeeded"
                    break
                  fi
                  MISSES=0
                else
                  MISSES=$((MISSES + 1))
                  if [ "$MISSES" -ge "$MAX_MISSES" ]; then
                    echo "⚠️ No matching job found after waiting; continuing startup."
                    break
                  fi
                fi

                echo "  └─ still waiting…"
                sleep 5
              done
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "⏳ Waiting for existing Redis instance to be ready..."
              until redis-cli -h redis-0.redis-headless.redis.svc.cluster.local -p 6379 ping; do
                echo "Redis not ready, waiting..."
                sleep 5
              done
              echo "✅ Existing Redis instance is ready"
      containers:
      - name: directus-postschema
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu

            # tools
            apk add --no-cache curl jq yq >/dev/null

            # --- wait for Directus to be healthy (same pod: localhost) ---
            echo "⏳ Waiting for Directus /server/health..."
            until curl -sf http://127.0.0.1:8055/server/health >/dev/null; do
              echo "  .. not ready yet"
              sleep 3
            done
            echo "✅ Directus is healthy"

            # --- fetch DB creds from Vault ---
            VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
            CREDS="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app")"
            DB_USER="$(echo "$CREDS" | jq -r '.data.username')"
            DB_PASS="$(echo "$CREDS" | jq -r '.data.password')"

            if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
              echo "❌ Failed to fetch DB creds from Vault"; exit 1
            fi

            export PGPASSWORD="$DB_PASS"

            # 1) Ensure schema_patch_log exists (no heredocs)
            echo "🔎 Ensuring sentinel table…"
            printf '%s\n' \
              'SET search_path TO directus, public;' \
              'CREATE TABLE IF NOT EXISTS schema_patch_log (' \
              '  patch_key TEXT PRIMARY KEY,' \
              '  applied_at TIMESTAMPTZ NOT NULL DEFAULT now()' \
              ');' \
            | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 >/dev/null

            # 2) Check sentinel; skip schema patch if already applied
            PATCH_KEY="github_profile_cols_v1"
            SKIP_PATCH="0"
            ALREADY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SET search_path TO directus, public; SELECT 1 FROM schema_patch_log WHERE patch_key='${PATCH_KEY}';" || true)"

            if [ "$ALREADY" = "1" ]; then
              echo "✅ Patch already applied; skipping schema changes."
              SKIP_PATCH="1"
            fi

            if [ "$SKIP_PATCH" != "1" ]; then
              # 3) Apply idempotent ALTERs
              echo "🔧 Applying user profile columns…"
              printf '%s\n' \
                'SET search_path TO directus, public;' \
                'ALTER TABLE directus_users' \
                '  ADD COLUMN IF NOT EXISTS github_login    TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_url      TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_company  TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_bio      TEXT,' \
                '  ADD COLUMN IF NOT EXISTS github_metadata JSONB;' \
              | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1

              # 4) Record sentinel
              echo "📝 Recording sentinel…"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO schema_patch_log (patch_key) VALUES ('${PATCH_KEY}') ON CONFLICT (patch_key) DO NOTHING;"
            fi

            # 5) Configure Directus settings directly in DB
            echo "🤖 Configuring Directus settings..."
            EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
            EXTRA_SETTINGS_HAS_KEYS="0"
            OPENAI_KEY=""
            OPENAI_KEY_SOURCE=""
            if [ -f "$EXTRA_SETTINGS_FILE" ]; then
              EXTRA_SETTINGS_JSON="$(yq -o=json '.' "$EXTRA_SETTINGS_FILE" 2>/dev/null || true)"
              if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'type=="object"' >/dev/null 2>&1; then
                if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'length>0' >/dev/null 2>&1; then
                  EXTRA_SETTINGS_HAS_KEYS="1"
                fi
                OPENAI_KEY_FROM_SETTINGS="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r \
                  'to_entries[] | select(.key|test("openai.*key$"; "i")) | .value | if type=="string" then . else empty end' \
                  | head -n1 || true)"
                if [ -n "${OPENAI_KEY_FROM_SETTINGS:-}" ] && [ "${OPENAI_KEY_FROM_SETTINGS}" != "null" ]; then
                  if printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q '<path:'; then
                    echo "⚠️ OpenAI key placeholder detected in settings.yaml (AVP not rendered); will try Vault."
                  else
                    OPENAI_KEY="$OPENAI_KEY_FROM_SETTINGS"
                    OPENAI_KEY_SOURCE="settings.yaml"
                  fi
                fi
              else
                echo "⚠️ Invalid YAML in $EXTRA_SETTINGS_FILE; ignoring."
              fi
            fi

            if [ -z "${OPENAI_KEY:-}" ]; then
              OPENAI_KEY="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/secret/data/open_ai_key" | jq -r '.data.data.value' || true)"
              if [ -n "${OPENAI_KEY:-}" ] && [ "${OPENAI_KEY}" != "null" ]; then
                OPENAI_KEY_SOURCE="vault"
              else
                OPENAI_KEY=""
                OPENAI_KEY_SOURCE=""
                echo "⚠️ OpenAI key missing; will skip OpenAI setting."
              fi
            fi

            SETTINGS_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' ORDER BY column_name;" || true)"
            if [ -z "${SETTINGS_COLS:-}" ]; then
              echo "⚠️ Could not read directus_settings columns; skipping settings."
              echo "✅ Schema patch applied. Going idle."
              exec tail -f /dev/null
            fi

            ENCRYPTED_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT field FROM directus_fields WHERE collection='directus_settings' AND special::text ILIKE '%encrypt%';" || true)"
            ENCRYPTED_REGEX='^1\\|\\|scrypt\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+$'

            EXTRA_ENCRYPTED_COLS="ai_openai_api_key ai_anthropic_api_key ai_google_api_key ai_openai_compatible_api_key"
            _sanitize_encrypted_col() {
              enc_col="$1"
              [ -z "${enc_col:-}" ] && return 0
              if ! printf '%s\n' "$SETTINGS_COLS" | grep -qx "$enc_col"; then
                return 0
              fi
              _col_escaped="$(printf '%s' "$enc_col" | sed 's/\"/\"\"/g')"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL WHERE \"${_col_escaped}\" IS NOT NULL AND \"${_col_escaped}\" !~ '${ENCRYPTED_REGEX}';"
            }

            echo "🔐 Sanitizing encrypted settings fields..."
            if [ -n "${ENCRYPTED_COLS:-}" ]; then
              printf '%s\n' "$ENCRYPTED_COLS" | while IFS= read -r enc_col; do
                _sanitize_encrypted_col "$enc_col"
              done
            fi
            for enc_col in $EXTRA_ENCRYPTED_COLS; do
              _sanitize_encrypted_col "$enc_col"
            done

            _update_setting() {
              _col="$1"
              _val="$2"
              _col_escaped="$(printf '%s' "$_col" | sed 's/\"/\"\"/g')"
              _val_escaped="$(printf '%s' "$_val" | sed "s/'/''/g")"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = '${_val_escaped}';"
            }

            UPDATED="0"

            if [ -n "${OPENAI_KEY:-}" ]; then
              OPENAI_COL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' AND column_name ~* 'openai.*key$' ORDER BY column_name LIMIT 1;" || true)"
              if [ -n "${OPENAI_COL:-}" ]; then
                if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$OPENAI_COL" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$OPENAI_COL"; then
                  echo "⚠️ ${OPENAI_COL} is encrypted; skipping direct DB update to avoid invalid encrypted payload."
                else
                  _update_setting "$OPENAI_COL" "$OPENAI_KEY"
                  UPDATED="1"
                  echo "✅ OpenAI key stored in directus_settings.${OPENAI_COL} (source: ${OPENAI_KEY_SOURCE})"
                fi
              else
                echo "⚠️ No OpenAI settings column found in directus_settings; skipping OpenAI setting."
              fi
            fi

            if [ "$EXTRA_SETTINGS_HAS_KEYS" = "1" ]; then
              while IFS= read -r key; do
                if printf '%s' "$key" | grep -Eq 'openai.*key$'; then
                  # handled separately via OPENAI_KEY logic above
                  continue
                fi
                if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$key" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$key"; then
                  echo "⚠️ settings.yaml key '${key}' is encrypted; skipping direct DB update."
                  continue
                fi
                if printf '%s\n' "$SETTINGS_COLS" | grep -qx "$key"; then
                  val_type="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k] | type')"
                  if [ "$val_type" = "null" ]; then
                    _col_escaped="$(printf '%s' "$key" | sed 's/\"/\"\"/g')"
                    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                      -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL;"
                    UPDATED="1"
                    continue
                  fi
                  case "$val_type" in
                    string)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                      ;;
                    number|boolean)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
                      ;;
                    *)
                      val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -c --arg k "$key" '.[$k]')"
                      ;;
                  esac
                  _update_setting "$key" "$val"
                  UPDATED="1"
                else
                  echo "⚠️ settings.yaml key '${key}' not found in directus_settings; skipping."
                fi
              done < <(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r 'keys[]')
            fi

            if [ "$UPDATED" != "1" ]; then
              echo "⚠️ No applicable settings were updated."
            else
              echo "✅ Directus settings updated in database."
            fi

            if [ -z "${OPENAI_KEY:-}" ] && [ "$EXTRA_SETTINGS_HAS_KEYS" != "1" ]; then
              echo "ℹ️ No settings to apply from settings.yaml/OpenAI; continuing with owner/cleanup."
            fi

            echo "👤 Ensuring project owner is set..."
            if printf '%s\n' "$SETTINGS_COLS" | grep -qx "project_owner"; then
              CURRENT_OWNER="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT project_owner FROM directus_settings LIMIT 1;" || true)"
              if [ -z "${CURRENT_OWNER:-}" ] || [ "${CURRENT_OWNER}" = "null" ]; then
                OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT u.id FROM directus_users u JOIN directus_roles r ON u.role = r.id WHERE r.name='Administrator' ORDER BY u.id ASC LIMIT 1;" || true)"
                if [ -z "${OWNER_ID:-}" ] || [ "${OWNER_ID}" = "null" ]; then
                  OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                    "SELECT id FROM directus_users ORDER BY id ASC LIMIT 1;" || true)"
                fi
                if [ -n "${OWNER_ID:-}" ] && [ "${OWNER_ID}" != "null" ]; then
                  _owner_escaped="$(printf '%s' "$OWNER_ID" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "SET search_path TO directus, public; UPDATE directus_settings SET project_owner = '${_owner_escaped}' WHERE project_owner IS NULL;"
                  echo "✅ Project owner set to ${OWNER_ID}"
                else
                  echo "⚠️ No users found to set project owner."
                fi
              else
                echo "✅ Project owner already set."
              fi
            else
              echo "⚠️ project_owner column not found; skipping."
            fi

            echo "🧩 Ensuring github-profile-sync extension is enabled..."
            EXT_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_extensions' LIMIT 1;" || true)"
            if [ "$EXT_TABLE_EXISTS" = "1" ]; then
              EXT_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_extensions' ORDER BY column_name;" || true)"
              if printf '%s\n' "$EXT_COLS" | grep -qx "folder"; then
                EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus_extensions WHERE folder='github-profile-sync' AND source='local' LIMIT 1;" || true)"
                if [ "$EXISTS" = "1" ]; then
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE folder='github-profile-sync' AND source='local';"
                  echo "✅ github-profile-sync extension enabled."
                else
                  EXT_ID="$(cat /proc/sys/kernel/random/uuid)"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_extensions (id, enabled, source, folder, bundle) VALUES ('${EXT_ID}', true, 'local', 'github-profile-sync', NULL);"
                  echo "✅ github-profile-sync extension registered."
                fi
              else
                EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus_extensions WHERE name='github-profile-sync' LIMIT 1;" || true)"
                if [ "$EXISTS" = "1" ]; then
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE name='github-profile-sync';"
                  echo "✅ github-profile-sync extension enabled."
                else
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_extensions (name, enabled) VALUES ('github-profile-sync', true);"
                  echo "✅ github-profile-sync extension registered."
                fi
              fi
            else
              echo "⚠️ directus_extensions table not found; skipping extension enable."
            fi

            echo "✅ Schema patch applied. Going idle."
            exec tail -f /dev/null
        env:
          - name: DB_HOST
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
          - name: DB_PORT
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
          - name: DB_DATABASE
            valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
        volumeMounts:
          - name: vault-root-token
            mountPath: /vault-token
            readOnly: true
          - name: directus-settings
            mountPath: /directus-settings
            readOnly: true
      - name: vault-agent
        image: hashicorp/vault:1.15.4
        command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
        volumeMounts:
        - name: vault-agent-config
          mountPath: /vault-config
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: vault-templates
          mountPath: /vault-templates
      - name: directus
        image: directus/directus:11
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "⏳ Waiting for Vault agent to generate all credential files..."
            while [ ! -f /vault-secrets/db-creds.env ] || \
                  [ ! -f /vault-secrets/app-keys.env ] || \
                  [ ! -f /vault-secrets/redis-creds.env ]; do
              echo "Waiting for credential files..."
              sleep 2
            done

            echo "✅ All credential files retrieved from Vault"
            echo "🔑 Loading credentials..."
            . /vault-secrets/db-creds.env
            . /vault-secrets/app-keys.env
            if [ -f /vault-secrets/openai.env ]; then
              . /vault-secrets/openai.env
            else
              echo "⚠️ /vault-secrets/openai.env not found; continuing without OPENAI_API_KEY"
            fi
            . /vault-secrets/redis-creds.env

            # Generate random admin credentials for initial setup (not used for actual login)
            RANDOM_ADMIN_EMAIL="admin-$(tr -dc 'a-z0-9' < /dev/urandom | head -c 8)@example.com"
            RANDOM_ADMIN_PASSWORD="$(tr -dc 'A-Za-z0-9@#%^*+=_-' < /dev/urandom | head -c 32)"
            
            # Export required envs for Directus
            export DB_USER DB_PASSWORD KEY SECRET REDIS_PASSWORD OPENAI_API_KEY
            export ADMIN_EMAIL="$RANDOM_ADMIN_EMAIL" ADMIN_PASSWORD="$RANDOM_ADMIN_PASSWORD"

            # Work from the app dir so the CLI behaves consistently
            cd /directus

            # Ensure Directus uses the intended schema/search_path for all CLI calls
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            # Increase OAuth2 userinfo timeout for cold-starting profile proxy
            if [ -n "${AUTH_GITHUB_CLIENT_HTTP__TIMEOUT:-}" ]; then
              printf '%s\n' \
                "import { custom } from 'openid-client';" \
                "const timeout = Number(process.env.AUTH_GITHUB_CLIENT_HTTP__TIMEOUT || 0);" \
                "if (Number.isFinite(timeout) && timeout > 0) { custom.setHttpOptionsDefaults({ timeout }); }" \
                > /tmp/openid-timeout.mjs
              if [ -n "${NODE_OPTIONS:-}" ]; then
                export NODE_OPTIONS="${NODE_OPTIONS} --import=/tmp/openid-timeout.mjs"
              else
                export NODE_OPTIONS="--import=/tmp/openid-timeout.mjs"
              fi
            fi

            echo "🔄 Initializing Directus database..."
            echo "📦 Running database install (idempotent)..."
            if CACHE_ENABLED=false RATE_LIMITER_ENABLED=false INIT_ADMIN_EMAIL="$ADMIN_EMAIL" INIT_ADMIN_PASSWORD="$ADMIN_PASSWORD" node cli.js database install >/tmp/install.log 2>&1; then
              echo "✅ Database installation completed successfully"
            else
              if grep -q "Database is already installed" /tmp/install.log; then
                echo "✅ Database already installed, proceeding..."
              else
                echo "❌ Database installation failed"; cat /tmp/install.log; exit 1
              fi
            fi

            _ensure_project_owner_migration_recorded() {
              MIGRATION_VERSION="20251014A"
              MIGRATION_NAME="Add Project Owner"
              export MIGRATION_VERSION MIGRATION_NAME

              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const migrationsTable = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_migrations" }).first(); if (!migrationsTable) return; const existing = await db("directus_migrations").withSchema(schema).where({ version: process.env.MIGRATION_VERSION }).first(); if (existing) return; const projectOwnerCol = await db("information_schema.columns").where({ table_schema: schema, table_name: "directus_settings", column_name: "project_owner" }).first(); if (!projectOwnerCol) return; const migrationCols = await db("information_schema.columns").select("column_name").where({ table_schema: schema, table_name: "directus_migrations" }); const insert = { version: process.env.MIGRATION_VERSION, name: process.env.MIGRATION_NAME }; if (migrationCols.some((col) => col.column_name === "timestamp")) { insert.timestamp = new Date().toISOString(); } await db("directus_migrations").withSchema(schema).insert(insert).onConflict("version").ignore(); console.log("Marked Add Project Owner migration as applied."); }; run().finally(() => db.destroy());'
            }

            if ! _ensure_project_owner_migration_recorded; then
              echo "⚠️ Failed to reconcile Add Project Owner migration state; continuing..."
            fi

            _ensure_settings_row() {
              node -e 'const fs = require("fs"); const path = require("path"); const pnpmRoot = "/directus/node_modules/.pnpm"; const knexEntry = fs.readdirSync(pnpmRoot).find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex"))); if (!knexEntry) { console.error("knex not found"); process.exit(1); } const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex")); const schema = process.env.DB_SCHEMA || "directus"; const db = knex({ client: "pg", connection: { host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 5432), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_DATABASE } }); const run = async () => { const table = await db("information_schema.tables").where({ table_schema: schema, table_name: "directus_settings" }).first(); if (!table) return; const row = await db("directus_settings").withSchema(schema).count({ count: "*" }).first(); const count = Number(row?.count ?? 0); if (!count) { await db("directus_settings").withSchema(schema).insert({}); console.log("Seeded directus_settings row."); } }; run().finally(() => db.destroy());'
            }

            echo "🔄 Running database migrations..."
            # Clear any cached schema and run migrations with cache disabled
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false  
            export CACHE_STORE=memory
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            
            # Add small delay to ensure DB is fully ready after install
            sleep 2
            
            # Run migrations with enhanced error handling
            echo "🔄 Running migrations with schema cache disabled..."
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            if node cli.js database migrate:latest >/tmp/migrate.log 2>&1; then
              cat /tmp/migrate.log
              echo "✅ Migrations completed successfully"
            else
              # Check if it's the known schema cache issue in Add Project Owner migration
              if grep -q "Cannot read properties of undefined.*primary\|Add Project Owner\|project_owner.*already exists" /tmp/migrate.log; then
                echo "⚠️ Known issue in 'Add Project Owner' migration detected"
                _ensure_project_owner_migration_recorded || true
                echo "⚠️ This is a non-critical schema cache issue - continuing with deployment"
                cat /tmp/migrate.log
                echo "✅ Migrations completed with known warnings"
              else
                echo "❌ Critical migration failure"
                cat /tmp/migrate.log
                exit 1
              fi
            fi

            if ! _ensure_settings_row; then
              echo "⚠️ Failed to ensure directus_settings row; continuing..."
            fi

            _ensure_ai_settings_defaults() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const DEFAULT_OPENAI_ALLOWED_MODELS = ["gpt-4o-mini", "gpt-5-nano", "gpt-5-mini", "gpt-5"];
            const DEFAULT_ANTHROPIC_ALLOWED_MODELS = ["claude-haiku-4-5", "claude-sonnet-4-5"];
            const DEFAULT_GOOGLE_ALLOWED_MODELS = ["gemini-3-pro-preview", "gemini-3-flash-preview", "gemini-2.5-pro", "gemini-2.5-flash"];
            
            const DEFAULT_OPENAI_COMPATIBLE_BASE_URL = "https://api.openai.com/v1";
            const DEFAULT_OPENAI_COMPATIBLE_NAME = "openai-compatible";
            const DEFAULT_OPENAI_COMPATIBLE_MODELS = [
              { id: "gpt-4o-mini", name: "GPT-4o Mini", context: 128000, output: 16384, attachment: true, reasoning: false },
              { id: "gpt-5-nano", name: "GPT-5 Nano", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5-mini", name: "GPT-5 Mini", context: 400000, output: 128000, attachment: true, reasoning: true },
              { id: "gpt-5", name: "GPT-5", context: 400000, output: 128000, attachment: true, reasoning: true }
            ];
            
            async function run() {
              const wantCols = [
                "ai_openai_allowed_models",
                "ai_anthropic_allowed_models",
                "ai_google_allowed_models",
                "ai_openai_compatible_base_url",
                "ai_openai_compatible_name",
                "ai_openai_compatible_models",
                "ai_openai_compatible_headers"
              ];
            
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = new Set(cols.map((c) => c.column_name));
              if (existing.size === 0) {
                console.log("No AI settings columns found; skipping AI defaults.");
                return;
              }
            
              const rowCount = await db("directus_settings").withSchema(schema).count({ count: "*" }).first();
              const count = Number(rowCount?.count ?? 0);
              if (!count) {
                await db("directus_settings").withSchema(schema).insert({});
              }
            
              const selectCols = Array.from(existing);
              const current = (await db("directus_settings").withSchema(schema).select(selectCols).first()) || {};
            
              const patch = {};
            
              if (existing.has("ai_openai_allowed_models") && current.ai_openai_allowed_models == null) {
                patch.ai_openai_allowed_models = JSON.stringify(DEFAULT_OPENAI_ALLOWED_MODELS);
              }
              if (existing.has("ai_anthropic_allowed_models") && current.ai_anthropic_allowed_models == null) {
                patch.ai_anthropic_allowed_models = JSON.stringify(DEFAULT_ANTHROPIC_ALLOWED_MODELS);
              }
              if (existing.has("ai_google_allowed_models") && current.ai_google_allowed_models == null) {
                patch.ai_google_allowed_models = JSON.stringify(DEFAULT_GOOGLE_ALLOWED_MODELS);
              }
              if (existing.has("ai_openai_compatible_base_url") && current.ai_openai_compatible_base_url == null) {
                patch.ai_openai_compatible_base_url = DEFAULT_OPENAI_COMPATIBLE_BASE_URL;
              }
              if (existing.has("ai_openai_compatible_name") && current.ai_openai_compatible_name == null) {
                patch.ai_openai_compatible_name = DEFAULT_OPENAI_COMPATIBLE_NAME;
              }
              if (existing.has("ai_openai_compatible_models") && current.ai_openai_compatible_models == null) {
                patch.ai_openai_compatible_models = JSON.stringify(DEFAULT_OPENAI_COMPATIBLE_MODELS);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("AI settings already initialized.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Initialized AI settings defaults: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            _set_ai_provider_keys() {
              node - <<'NODE'
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            
            const pnpmRoot = "/directus/node_modules/.pnpm";
            const knexEntry = fs
              .readdirSync(pnpmRoot)
              .find((name) => name.startsWith("knex@") && fs.existsSync(path.join(pnpmRoot, name, "node_modules", "knex")));
            
            if (!knexEntry) {
              console.error("knex not found");
              process.exit(1);
            }
            
            const knex = require(path.join(pnpmRoot, knexEntry, "node_modules", "knex"));
            
            const schema = process.env.DB_SCHEMA || "directus";
            const db = knex({
              client: "pg",
              connection: {
                host: process.env.DB_HOST,
                port: Number(process.env.DB_PORT || 5432),
                user: process.env.DB_USER,
                password: process.env.DB_PASSWORD,
                database: process.env.DB_DATABASE
              }
            });
            
            const parsePayload = (value) => {
              const parts = String(value || "").split("||");
              if (parts.length < 9) return null;
              const [version, kdf, nStr, rStr, pStr, saltB64, ivB64, cipherText, tagB64] = parts;
              if (version !== "1" || kdf !== "scrypt") return null;
              return { n: Number(nStr) || 2 ** 14, r: Number(rStr) || 8, p: Number(pStr) || 1, saltB64, ivB64, cipherText, tagB64 };
            };
            
            const decryptPayload = (value, secret) => {
              const parsed = parsePayload(value);
              if (!parsed) return null;
              try {
                const salt = Buffer.from(parsed.saltB64, "base64");
                const keyBuf = crypto.scryptSync(secret, salt, 32, { N: parsed.n, r: parsed.r, p: parsed.p });
                const iv = Buffer.from(parsed.ivB64, "base64");
                const tag = Buffer.from(parsed.tagB64, "base64");
                const decipher = crypto.createDecipheriv("aes-256-gcm", keyBuf, iv);
                decipher.setAuthTag(tag);
                let plaintext = decipher.update(parsed.cipherText, "base64", "utf8");
                plaintext += decipher.final("utf8");
                return plaintext;
              } catch {
                return null;
              }
            };
            
            const encryptPayload = (plain, secret) => {
              const salt = crypto.randomBytes(16);
              const keyBuf = crypto.scryptSync(secret, salt, 32, { N: 2 ** 14, r: 8, p: 1 });
              const iv = crypto.randomBytes(12);
              const cipher = crypto.createCipheriv("aes-256-gcm", keyBuf, iv);
              let cipherText = cipher.update(plain, "utf8", "base64");
              cipherText += cipher.final("base64");
              const tag = cipher.getAuthTag().toString("base64");
              return ["1", "scrypt", 2 ** 14, 8, 1, salt.toString("base64"), iv.toString("base64"), cipherText, tag].join("||");
            };
            
            async function run() {
              const desired = process.env.OPENAI_API_KEY;
              const secret = process.env.SECRET;
            
              if (!secret) {
                console.log("Missing SECRET; skipping AI key encryption.");
                return;
              }
            
              if (!desired) {
                console.log("Missing OPENAI_API_KEY; skipping AI key encryption.");
                return;
              }
            
              const wantCols = ["ai_openai_api_key", "ai_openai_compatible_api_key"];
              const cols = await db("information_schema.columns")
                .select("column_name")
                .where({ table_schema: schema, table_name: "directus_settings" })
                .whereIn("column_name", wantCols);
            
              const existing = cols.map((c) => c.column_name);
              if (existing.length === 0) {
                console.log("No AI key columns found; skipping.");
                return;
              }
            
              const row = (await db("directus_settings").withSchema(schema).select(existing).first()) || {};
            
              const patch = {};
              for (const col of existing) {
                const current = row[col];
                const isEncrypted = typeof current === "string" && current.startsWith("1||scrypt||");
            
                if (isEncrypted) {
                  const decrypted = decryptPayload(current, secret);
                  if (decrypted === null) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  if (decrypted !== desired) {
                    patch[col] = encryptPayload(desired, secret);
                    continue;
                  }
                  continue;
                }
            
                patch[col] = encryptPayload(desired, secret);
              }
            
              const keys = Object.keys(patch);
              if (keys.length === 0) {
                console.log("No AI keys to update.");
                return;
              }
            
              await db("directus_settings").withSchema(schema).update(patch);
              console.log(`Encrypted AI keys stored in directus_settings: ${keys.join(", ")}`);
            }
            
            run().finally(() => db.destroy());
            NODE
            }

            echo "🤖 Ensuring AI settings defaults..."
            _ensure_ai_settings_defaults || echo "⚠️ Failed to ensure AI settings defaults."

            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "🔐 Encrypting AI provider keys into directus_settings..."
              _set_ai_provider_keys || echo "⚠️ Failed to store AI provider keys."
            else
              echo "ℹ️ OPENAI_API_KEY not set; skipping encrypted AI provider keys."
            fi

            echo "🔍 Debug: Environment check..."
            echo "DB_HOST: $DB_HOST, DB_USER: $DB_USER, DB_SCHEMA: $DB_SCHEMA"
            echo "REDIS_HOST: $REDIS_HOST"
            echo "Credentials loaded: KEY(${#KEY}), SECRET(${#SECRET}), ADMIN_EMAIL($ADMIN_EMAIL)"

            # Ensure proper schema connection
            export DB_SEARCH_PATH="${DB_SCHEMA:-directus},public"

            echo "🔧 Seeding defaults if missing & resolving role UUIDs…"

            # Make CLI quieter & deterministic for parsing
            export NO_COLOR=1
            export LOG_STYLE=raw
            export LOG_LEVEL=error
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false

            # Parse the first UUID-looking token from a file
            _extract_uuid_from_file() {
              # greedy-safe: match canonical 8-4-4-4-12 hex UUID
              grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$1" | head -n1
            }

            # Create role and capture UUID from *its own* output stream
            _create_role_and_get_id() {
              local role_name="$1"; shift
              local tmp="$(mktemp)"
              # run create; don’t fail the script if it errors (already exists etc.)
              node cli.js roles create --role "$role_name" "$@" >"$tmp" 2>&1 || true
              local id="$(_extract_uuid_from_file "$tmp")"
              rm -f "$tmp"
              printf "%s" "$id"
            }

            # Try to create (or re-create) roles and grab their IDs
            ADMIN_ROLE_ID="$(_create_role_and_get_id "Administrator" --admin --app)"
            EDITOR_ROLE_ID="$(_create_role_and_get_id "Editor" --app)"

            # IDs printed above; make sure they are in the environment for everything that follows
            export ADMIN_ROLE_ID
            export EDITOR_ROLE_ID

            # Build AUTH_GITHUB_ROLE_MAPPING purely in sh from TEAM_ROLE_MAP and the two IDs
            TEAM_ROLE_MAP="${TEAM_ROLE_MAP:-github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor}"

            make_mapping() {
              pairs="$1"
              admin_id="$2"
              editor_id="$3"
              out='json:{'
              first=1
              OLDIFS="$IFS"; IFS=',' 
              for kv in $pairs; do
                IFS="$OLDIFS"
                group="${kv%%=*}"
                name="${kv#*=}"
                id=""
                [ "$name" = "Administrator" ] && id="$admin_id"
                [ "$name" = "Editor" ] && id="$editor_id"
                if [ -n "$id" ]; then
                  [ $first -eq 0 ] && out="$out,"
                  out="$out\"$group\":\"$id\""
                  first=0
                else
                  echo "  ⚠ no id available for role name: $name" >&2
                fi
                IFS=',' 
              done
              IFS="$OLDIFS"
              out="$out}"
              printf "%s" "$out"
            }

            AUTH_GITHUB_ROLE_MAPPING="$(make_mapping "$TEAM_ROLE_MAP" "$ADMIN_ROLE_ID" "$EDITOR_ROLE_ID")"
            export AUTH_GITHUB_ROLE_MAPPING
            echo "✅ AUTH_GITHUB_ROLE_MAPPING = $AUTH_GITHUB_ROLE_MAPPING"

            # Ensure admin user exists to disable setup form
            echo "👤 Ensuring admin user exists..."
            admin_tmp="$(mktemp)"
            export CACHE_ENABLED=false
            export RATE_LIMITER_ENABLED=false
            
            # Try to create admin user (will fail if exists, which is fine)
            if node cli.js users create --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --role "$ADMIN_ROLE_ID" >"$admin_tmp" 2>&1; then
              echo "✅ Admin user created successfully"
            else
              if grep -q "already exists\|duplicate\|unique constraint" "$admin_tmp"; then
                echo "✅ Admin user already exists"
              else
                echo "⚠️ Admin user creation issue (continuing anyway):"
                cat "$admin_tmp"
              fi
            fi
            rm -f "$admin_tmp"

            echo "🚀 Starting Directus server..."
            # Reset cache settings for production mode
            unset NO_COLOR LOG_STYLE
            export LOG_LEVEL=info
            export CACHE_ENABLED=true
            export RATE_LIMITER_ENABLED=true
            
            # Clear any lingering schema cache issues before starting
            export CACHE_SCHEMA=false
            export CACHE_PERMISSIONS=false
            
            exec node cli.js start
        ports:
        - containerPort: 8055
        env:
        - name: AUTH_PROVIDERS
          value: "github"
        - name: AUTH_DISABLE_DEFAULT
          value: "true"

        # Optional: your default team→role names (left = proxy group; right = Directus role name)
        - name: TEAM_ROLE_MAP
          value: "github:dotcomrow:k8s_directus_console_admins=Administrator,github:dotcomrow:k8s_directus_console_editors=Editor"

        # Database configuration
        - name: DB_CLIENT
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_CLIENT } }
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_PORT } }
        - name: DB_DATABASE
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_DATABASE } }
        - name: DB_SCHEMA
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_SCHEMA } }
        - name: DB_POOL__MIN
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_POOL__MIN } }
        - name: DB_POOL__MAX
          valueFrom: { configMapKeyRef: { name: directus-config, key: DB_POOL__MAX } }

        # Cache configuration
        - name: CACHE_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: CACHE_ENABLED } }
        - name: CACHE_STORE
          valueFrom: { configMapKeyRef: { name: directus-config, key: CACHE_STORE } }
        - name: REDIS_HOST
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_HOST } }
        - name: REDIS_PORT
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_PORT } }
        - name: REDIS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: REDIS_ENABLED } }

        # Rate limiting
        - name: RATE_LIMITER_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: RATE_LIMITER_ENABLED } }
        - name: RATE_LIMITER_STORE
          valueFrom: { configMapKeyRef: { name: directus-config, key: RATE_LIMITER_STORE } }

        # Storage configuration
        - name: STORAGE_LOCATIONS
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCATIONS } }
        - name: STORAGE_LOCAL_DRIVER
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCAL_DRIVER } }
        - name: STORAGE_LOCAL_ROOT
          valueFrom: { configMapKeyRef: { name: directus-config, key: STORAGE_LOCAL_ROOT } }

        # Extensions configuration
        - name: EXTENSIONS_PATH
          value: "/directus/extensions"

        # Other configuration
        - name: LOG_LEVEL
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_LEVEL } }
        - name: LOG_STYLE
          valueFrom: { configMapKeyRef: { name: directus-config, key: LOG_STYLE } }
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: PUBLIC_URL } }
        - name: CORS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ENABLED } }
        - name: CORS_ORIGIN
          valueFrom: { configMapKeyRef: { name: directus-config, key: CORS_ORIGIN } }
        - name: ASSETS_CACHE_TTL
          valueFrom: { configMapKeyRef: { name: directus-config, key: ASSETS_CACHE_TTL } }

        # WebSockets configuration
        - name: WEBSOCKETS_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_ENABLED } }
        - name: WEBSOCKETS_COLLAB_ENABLED
          valueFrom: { configMapKeyRef: { name: directus-config, key: WEBSOCKETS_COLLAB_ENABLED } }

        # GitHub OAuth provider config
        - name: AUTH_GITHUB_DRIVER
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_DRIVER } }
        - name: AUTH_GITHUB_AUTHORIZE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_AUTHORIZE_URL } }
        - name: AUTH_GITHUB_ACCESS_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_ACCESS_URL } }
        - name: AUTH_GITHUB_PROFILE_URL
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_PROFILE_URL } }
        - name: AUTH_GITHUB_IDENTIFIER_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_IDENTIFIER_KEY } }
        - name: AUTH_GITHUB_EMAIL_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_EMAIL_KEY } }
        - name: AUTH_GITHUB_SCOPE
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_SCOPE } }
        - name: AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION } }
        - name: AUTH_GITHUB_GROUP_CLAIM_NAME
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_GROUP_CLAIM_NAME } }
        - name: AUTH_GITHUB_GROUPS_CLAIM
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_GROUP_CLAIM_NAME } }
        - name: AUTH_GITHUB_CLIENT_ID
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_CLIENT_ID } }
        - name: AUTH_GITHUB_CLIENT_SECRET
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_CLIENT_SECRET } }
        - name: AUTH_GITHUB_SYNC_USER_INFO
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_SYNC_USER_INFO } }
        - name: AUTH_GITHUB_FIRST_NAME_KEY
          valueFrom: { configMapKeyRef: { name: directus-config, key: AUTH_GITHUB_FIRST_NAME_KEY } }

        livenessProbe:
          httpGet: { path: /server/health, port: 8055 }
          initialDelaySeconds: 360
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /server/health, port: 8055 }
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: uploads
          mountPath: /directus/uploads
        - name: vault-secrets
          mountPath: /vault-secrets
        - name: directus-extensions
          mountPath: /directus/extensions
---
# Directus Service
apiVersion: v1
kind: Service
metadata:
  name: directus-service
  namespace: directus
  annotations:
    teleport.dev/name: "directus-cms"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "cms.teleport.app.suncoast.systems"
    teleport.dev/description: "Directus CMS Service"
  labels:
    app: directus
    app.kubernetes.io/name: directus-cms
    app.kubernetes.io/component: cms
    teleport.dev/enroll: "true"
spec:
  selector:
    app: directus
  ports:
  - name: http
    port: 8055
    targetPort: 8055
    protocol: TCP
  type: ClusterIP
