      }

      _upsert_page_block_slot_field_meta

      _remove_preset_bookmark_copy_field_meta() {
        _collection="directus_presets"
        _collection_sql="$(printf '%s' "${_collection}" | sed "s/'/''/g")"

        _preset_table_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_presets' LIMIT 1;" || true)"
        _preset_table_exists="$(printf '%s' "${_preset_table_exists}" | tr -d '\r')"
        if [ "${_preset_table_exists}" != "1" ]; then
          echo "  └─ directus_presets table not found; skipping bookmark copy field UX cleanup"
          return 0
        fi

        if _df_has_col "interface"; then
          SETS=""
          SETS="${SETS},interface=NULL"
          if _df_has_col "note"; then SETS="${SETS},note=NULL"; fi
          if [ -n "${SETS}" ]; then
