         ) \
         FROM ( \
           SELECT DISTINCT ON (template_key) \
             template_key, \
             COALESCE(NULLIF(BTRIM(name), ''), template_key) AS display_name, \
             CASE WHEN COALESCE(NULLIF(BTRIM(site_key), ''), '') = '' THEN 1 ELSE 0 END AS scope_rank, \
