    fi

    if [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
      echo "🧭 DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=true; seeding baseline Directus list presets..."
      PRESETS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_presets' LIMIT 1;" || true)"
      PRESETS_TABLE_EXISTS="$(printf '%s' "${PRESETS_TABLE_EXISTS}" | tr -d '\r')"
      if [ "${PRESETS_TABLE_EXISTS}" = "1" ]; then
        DP_LAYOUT_QUERY_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_presets' AND column_name='layout_query' LIMIT 1;" || true)"
        DP_LAYOUT_OPTIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_presets' AND column_name='layout_options' LIMIT 1;" || true)"

        _dp_json_sql() {
          _t="$1"
          _json="$2"
          if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
            printf "NULL"
            return
          fi
          _json_sql="$(printf '%s' "$_json" | sed "s/'/''/g")"
          case "$_t" in
            jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
            json) printf "'%s'::json" "$_json_sql" ;;
            text|character\ varying) printf "'%s'" "$_json_sql" ;;
            *) printf "NULL" ;;
          esac
        }

        _upsert_global_list_preset() {
          _preset_collection="$1"
          _preset_icon="$2"
          _preset_fields_json="$3"
          _preset_sort_json="$4"
          _preset_collection_sql="$(printf '%s' "${_preset_collection}" | sed "s/'/''/g")"
          _preset_icon_sql="$(printf '%s' "${_preset_icon}" | sed "s/'/''/g")"
          _preset_layout_query_json="$(jq -nc --argjson fields "${_preset_fields_json}" --argjson sort "${_preset_sort_json}" '{tabular:{fields:$fields,sort:$sort}}')"
          _preset_layout_options_json="$(jq -nc '{}')"
          _preset_layout_query_sql="$(_dp_json_sql "${DP_LAYOUT_QUERY_TYPE:-}" "${_preset_layout_query_json}")"
          _preset_layout_options_sql="$(_dp_json_sql "${DP_LAYOUT_OPTIONS_TYPE:-}" "${_preset_layout_options_json}")"
          _preset_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.directus_presets WHERE collection='${_preset_collection_sql}' AND COALESCE(bookmark,'')='all' AND role IS NULL AND \"user\" IS NULL ORDER BY id DESC LIMIT 1;" || true)"
          _preset_id="$(printf '%s' "${_preset_id:-}" | tr -d '\r')"

          if [ -n "${_preset_id:-}" ] && [ "${_preset_id}" != "null" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               UPDATE directus_presets \
                  SET layout='tabular', \
                      layout_query=${_preset_layout_query_sql}, \
                      layout_options=${_preset_layout_options_sql}, \
                      icon='${_preset_icon_sql}' \
                WHERE id=${_preset_id};"
            echo "INFO: Reconciled ${_preset_collection} global list preset."
          else
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               INSERT INTO directus_presets (bookmark, collection, layout, layout_query, layout_options, icon) \
               VALUES ('all', '${_preset_collection_sql}', 'tabular', ${_preset_layout_query_sql}, ${_preset_layout_options_sql}, '${_preset_icon_sql}');"
            echo "INFO: Created ${_preset_collection} global list preset."
          fi
        }

        cms_pages_tabular_fields_json='["site_key","release_channel","slug","title","head_title","status","layout_template_key","layout_chrome","theme_package_key","theme_mode","analytics_google_measurement_id","analytics_openobserve_rum_script_url","widget_dock_enabled","widget_dock_position","widget_dock_direction","theme_selector_dock_position","refresh_target","force_login_for_page_access","required_role_for_page_access","date_updated"]'
        _upsert_global_list_preset "cms_pages" "view_column" "${cms_pages_tabular_fields_json}" '["-date_updated"]'

        cache_targets_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='cms_cache_refresh_targets' LIMIT 1;" || true)"
        cache_targets_exists="$(printf '%s' "${cache_targets_exists}" | tr -d '\r')"
        if [ "${cache_targets_exists}" = "1" ]; then
          cache_targets_tabular_fields_json='["site_key","target_key","enabled","endpoint","date_updated"]'
          _upsert_global_list_preset "cms_cache_refresh_targets" "link" "${cache_targets_tabular_fields_json}" '["site_key","target_key"]'
        fi

        translation_languages_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='cms_translation_languages' LIMIT 1;" || true)"
        translation_languages_exists="$(printf '%s' "${translation_languages_exists}" | tr -d '\r')"
        if [ "${translation_languages_exists}" = "1" ]; then
          translation_languages_tabular_fields_json='["language_code","name","model","status","date_updated"]'
          _upsert_global_list_preset "cms_translation_languages" "translate" "${translation_languages_tabular_fields_json}" '["language_code"]'
        fi

        cms_page_blocks_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='cms_page_blocks' LIMIT 1;" || true)"
        cms_page_blocks_exists="$(printf '%s' "${cms_page_blocks_exists}" | tr -d '\r')"
        if [ "${cms_page_blocks_exists}" = "1" ]; then
          cms_page_blocks_tabular_fields_json='["site_key","page_slug","group_tag","collection","slot","parent_block_id","sort","status","date_updated"]'
          _upsert_global_list_preset "cms_page_blocks" "account_tree" "${cms_page_blocks_tabular_fields_json}" '["site_key","page_slug","template_scope","template_group_key","group_tag","tree_path","sort"]'
        fi
      else
        echo "INFO: directus_presets table not found; skipping optional Directus list preset seed."
      fi
    else
      echo "ℹ️ DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=false; skipping manifest-managed Directus bookmark/list preset writes. Bookmark rows are managed in Directus and can be copied with the bookmark-copy interface."
    fi

    echo "🧭 Ensuring cms_page_blocks display template exposes grouping context..."
    DIRECTUS_COLLECTIONS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_collections' LIMIT 1;" || true)"
    DIRECTUS_COLLECTIONS_EXISTS="$(printf '%s' "$DIRECTUS_COLLECTIONS_EXISTS" | tr -d '\r')"
    if [ "${DIRECTUS_COLLECTIONS_EXISTS}" = "1" ]; then
      DC_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_collections' ORDER BY column_name;" || true)"
      _dc_has_col() { printf '%s\n' "${DC_COLS}" | grep -qx "$1"; }
      DIRECTUS_PRESETS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_presets' LIMIT 1;" || true)"
      DIRECTUS_PRESETS_TABLE_EXISTS="$(printf '%s' "$DIRECTUS_PRESETS_TABLE_EXISTS" | tr -d '\r')"
      if [ "${DIRECTUS_PRESETS_TABLE_EXISTS}" = "1" ]; then
        directus_presets_note="Directus bookmark/list preset metadata. Open an existing bookmark preset to use the Copy Bookmark action."
        directus_presets_note_sql="$(printf '%s' "${directus_presets_note}" | sed "s/'/''/g")"
        directus_presets_display_template='{{collection}} | {{bookmark}}'
        directus_presets_display_template_sql="$(printf '%s' "${directus_presets_display_template}" | sed "s/'/''/g")"
        directus_presets_collection_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM directus.directus_collections WHERE collection='directus_presets' LIMIT 1;" || true)"
        directus_presets_collection_exists="$(printf '%s' "$directus_presets_collection_exists" | tr -d '\r')"
        if [ "${directus_presets_collection_exists}" = "1" ]; then
          PRESET_COLLECTION_SETS=""
          if _dc_has_col "hidden"; then PRESET_COLLECTION_SETS="${PRESET_COLLECTION_SETS},hidden=false"; fi
          if _dc_has_col "singleton"; then PRESET_COLLECTION_SETS="${PRESET_COLLECTION_SETS},singleton=false"; fi
          if _dc_has_col "icon"; then PRESET_COLLECTION_SETS="${PRESET_COLLECTION_SETS},icon='bookmark'"; fi
          if _dc_has_col "note"; then PRESET_COLLECTION_SETS="${PRESET_COLLECTION_SETS},note='${directus_presets_note_sql}'"; fi
          if _dc_has_col "display_template"; then PRESET_COLLECTION_SETS="${PRESET_COLLECTION_SETS},display_template='${directus_presets_display_template_sql}'"; fi
          if [ -n "${PRESET_COLLECTION_SETS}" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_collections SET ${PRESET_COLLECTION_SETS#,} WHERE collection='directus_presets';"
            echo "✅ Updated directus_presets collection metadata for bookmark copy access"
          fi
        else
          PRESET_COLLECTION_COLS="collection"
          PRESET_COLLECTION_VALS="'directus_presets'"
          if _dc_has_col "hidden"; then PRESET_COLLECTION_COLS="${PRESET_COLLECTION_COLS},hidden"; PRESET_COLLECTION_VALS="${PRESET_COLLECTION_VALS},false"; fi
          if _dc_has_col "singleton"; then PRESET_COLLECTION_COLS="${PRESET_COLLECTION_COLS},singleton"; PRESET_COLLECTION_VALS="${PRESET_COLLECTION_VALS},false"; fi
          if _dc_has_col "icon"; then PRESET_COLLECTION_COLS="${PRESET_COLLECTION_COLS},icon"; PRESET_COLLECTION_VALS="${PRESET_COLLECTION_VALS},'bookmark'"; fi
          if _dc_has_col "note"; then PRESET_COLLECTION_COLS="${PRESET_COLLECTION_COLS},note"; PRESET_COLLECTION_VALS="${PRESET_COLLECTION_VALS},'${directus_presets_note_sql}'"; fi
          if _dc_has_col "display_template"; then PRESET_COLLECTION_COLS="${PRESET_COLLECTION_COLS},display_template"; PRESET_COLLECTION_VALS="${PRESET_COLLECTION_VALS},'${directus_presets_display_template_sql}'"; fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; INSERT INTO directus_collections (${PRESET_COLLECTION_COLS}) VALUES (${PRESET_COLLECTION_VALS});"
          echo "✅ Created directus_presets collection metadata for bookmark copy access"
        fi
      fi
      if _dc_has_col "display_template"; then
        block_display_template='{{template_scope}}/{{template_group_key}} | {{group_tag}} | {{collection}} -> {{slot}} | #{{sort}}'
        block_display_template_sql="$(printf '%s' "${block_display_template}" | sed "s/'/''/g")"
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; \
           UPDATE directus_collections \
              SET display_template='${block_display_template_sql}' \
            WHERE collection='cms_page_blocks' \
              AND COALESCE(display_template, '') IS DISTINCT FROM '${block_display_template_sql}';"
        echo "✅ Updated cms_page_blocks display template for grouped block labels"
      else
        echo "  └─ directus_collections.display_template not present; skipping grouped block label template"
      fi
    else
      echo "  └─ directus_collections table not found; skipping grouped block label template"
    fi
    
    # 5b) Ensure layout template collections exist. Rows are managed in Directus.
    echo "🧱 Ensuring cms_layout_templates exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_layout_templates ( \
         id UUID PRIMARY KEY, \
         template_key TEXT NOT NULL, \
         name TEXT NOT NULL, \
         description TEXT NULL, \
         status TEXT NOT NULL DEFAULT 'draft', \
         site_key TEXT NULL, \
         refresh_target TEXT NOT NULL DEFAULT 'both', \
         html TEXT NOT NULL, \
         css TEXT NULL, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS template_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS name TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS description TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS status TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS html TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS css TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_templates ALTER COLUMN status SET DEFAULT 'draft'; \
       ALTER TABLE IF EXISTS cms_layout_templates ALTER COLUMN refresh_target SET DEFAULT 'both'; \
       ALTER TABLE IF EXISTS cms_layout_templates ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_constraint \
           WHERE conname IN ('cms_layout_templates_template_key_unique', 'demo_layout_templates_template_key_unique') \
             AND conrelid = to_regclass('directus.cms_layout_templates') \
         ) THEN \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='cms_layout_templates_template_key_unique' AND conrelid=to_regclass('directus.cms_layout_templates')) THEN \
             ALTER TABLE cms_layout_templates DROP CONSTRAINT cms_layout_templates_template_key_unique; \
           END IF; \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='demo_layout_templates_template_key_unique' AND conrelid=to_regclass('directus.cms_layout_templates')) THEN \
             ALTER TABLE cms_layout_templates DROP CONSTRAINT demo_layout_templates_template_key_unique; \
           END IF; \
         END IF; \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'demo_layout_templates_scope_template_unique' \
         ) THEN \
           DROP INDEX directus.demo_layout_templates_scope_template_unique; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_layout_templates_scope_template_unique' \
         ) THEN \
           IF NOT EXISTS ( \
             SELECT 1 \
             FROM ( \
               SELECT COALESCE(site_key, '') AS site_scope, template_key, COUNT(*) AS c \
               FROM cms_layout_templates \
               GROUP BY COALESCE(site_key, ''), template_key \
               HAVING COUNT(*) > 1 \
             ) dups \
           ) THEN \
             CREATE UNIQUE INDEX cms_layout_templates_scope_template_unique \
             ON cms_layout_templates (COALESCE(site_key, ''), template_key); \
           ELSE \
             RAISE NOTICE 'Skipping cms_layout_templates_scope_template_unique due to duplicate (site_key,template_key) rows'; \
           END IF; \
         END IF; \
       END \
       \$\$;"
    
    echo "🧱 Ensuring cms_layout_template_slots exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_layout_template_slots ( \
         id UUID PRIMARY KEY, \
         template_key TEXT NOT NULL, \
