                manual_entry_operation_id="${manual_refresh_target_read_op_id}"
                if [ "${refresh_auth_enabled}" = "true" ] && [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                  manual_token_op_id="$(_directus_upsert_operation "${manual_flow_id}" "mint_refresh_token_attempt_1" "request" "Mint Refresh Token" 55 121 "${manual_token_options}")"
                  _directus_set_operation_links "${manual_token_op_id}" "${manual_first_request_op_id}" ""
                  _directus_set_operation_links "${manual_refresh_target_match_op_id}" "${manual_token_op_id}" ""
                else
                  _directus_set_operation_links "${manual_refresh_target_match_op_id}" "${manual_first_request_op_id}" ""
                fi
                _directus_api_write "PATCH" "/flows/${manual_flow_id}" \
                  "$(jq -nc --arg operation "${manual_entry_operation_id}" --arg status "${flow_status}" '{operation:$operation,status:$status}')" \
                  >/tmp/directus-flow-entry.json 2>/dev/null || true

                if [ "${flow_status}" = "active" ]; then
                  echo "✅ Reconciled active cache-refresh flows (create/update/manual) for site_key='${site_key}', target='${target_key}' (${target_method} ${target_endpoint_effective}, attempts=${target_retry_attempts}, retry_delay_ms=${target_retry_delay_ms}, request_timeout_ms=${target_request_timeout_ms}, token_timeout_ms=${target_token_timeout_ms})"
                else
                  echo "✅ Reconciled cache-refresh flows (create/update/manual) for site_key='${site_key}', target='${target_key}' as inactive"
                fi
              fi
            done
    
            # Keep legacy pre-target flow names inactive to avoid duplicate refresh calls.
            legacy_create_flow_name="CMS Cache Refresh (${site_key}) - Create"
            legacy_update_flow_name="CMS Cache Refresh (${site_key}) - Update"
            legacy_manual_flow_name="CMS Cache Refresh (${site_key}) - Manual"
            legacy_create_flow_id="$(_directus_find_flow_id_by_name "${legacy_create_flow_name}")"
            if [ -n "${legacy_create_flow_id:-}" ] && [ "${legacy_create_flow_id}" != "null" ]; then
              _directus_api_write "PATCH" "/flows/${legacy_create_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
            fi
            legacy_update_flow_id="$(_directus_find_flow_id_by_name "${legacy_update_flow_name}")"
            if [ -n "${legacy_update_flow_id:-}" ] && [ "${legacy_update_flow_id}" != "null" ]; then
              _directus_api_write "PATCH" "/flows/${legacy_update_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
            fi
            legacy_manual_flow_id="$(_directus_find_flow_id_by_name "${legacy_manual_flow_name}")"
            if [ -n "${legacy_manual_flow_id:-}" ] && [ "${legacy_manual_flow_id}" != "null" ]; then
              _directus_api_write "PATCH" "/flows/${legacy_manual_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
            fi
          else
            echo "⚠️ Skipping cache-refresh flow provisioning for site_key='${site_key}' (Directus API token unavailable)"
          fi
        done
      else
        echo "  └─ no sites configured in ${SITES_FILE}; skipping"
      fi
    else
      echo "  └─ ${SITES_FILE} not found; skipping"
    fi

    # 5d) Keep the backward-compatible Gravitee default token usable.
    # The auth bridge falls back to this path when a caller has no matching
    # client-specific token. Bootstrap creates the Vault secret, but Directus
    # only accepts it after a service user owns the same static token.
    echo "🔐 Ensuring default Gravitee Directus token is bound to a service user..."
    DEFAULT_GRAVITEE_TOKEN_VAULT_PATH="${DIRECTUS_DEFAULT_GRAVITEE_TOKEN_VAULT_PATH:-secret/data/directus/gravitee}"
    DEFAULT_GRAVITEE_ROLE_NAME="${DIRECTUS_DEFAULT_GRAVITEE_ROLE_NAME:-cms-site-external}"
    DEFAULT_USER_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
    _default_has_user_col() { printf '%s\n' "$DEFAULT_USER_COLS" | grep -qx "$1"; }

    if _default_has_user_col "token"; then
      DEFAULT_ROLE_NAME_SQL="$(printf '%s' "$DEFAULT_GRAVITEE_ROLE_NAME" | sed "s/'/''/g")"
      DEFAULT_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT id FROM directus.directus_roles WHERE name='${DEFAULT_ROLE_NAME_SQL}' LIMIT 1;" || true)"
      DEFAULT_ROLE_ID="$(printf '%s' "$DEFAULT_ROLE_ID" | tr -d '\r')"

      if [ -z "${DEFAULT_ROLE_ID:-}" ] || [ "${DEFAULT_ROLE_ID}" = "null" ]; then
        echo "⚠️ Default Gravitee role '${DEFAULT_GRAVITEE_ROLE_NAME}' not found; skipping default token binding."
      else
        DEFAULT_GRAVITEE_TOKEN=""
        DCODE="$(curl -sS -o /tmp/default-gravitee-token-read.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
          --connect-timeout 5 --max-time 20 \
          "${VAULT_ADDR}/v1/${DEFAULT_GRAVITEE_TOKEN_VAULT_PATH}" || true)"
        if [ "$DCODE" = "200" ]; then
          DEFAULT_GRAVITEE_TOKEN="$(jq -r '.data.data.token // empty' /tmp/default-gravitee-token-read.json 2>/dev/null || true)"
        fi
        if [ -z "${DEFAULT_GRAVITEE_TOKEN:-}" ] || [ "${DEFAULT_GRAVITEE_TOKEN}" = "null" ]; then
          DEFAULT_GRAVITEE_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
          payload="$(jq -nc --arg t "$DEFAULT_GRAVITEE_TOKEN" '{data:{token:$t}}')"
          DWCODE="$(curl -sS -o /tmp/default-gravitee-token-write.json -w '%{http_code}' -X POST \
            -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
            --connect-timeout 5 --max-time 20 \
            -d "$payload" "${VAULT_ADDR}/v1/${DEFAULT_GRAVITEE_TOKEN_VAULT_PATH}" || true)"
          if [ "$DWCODE" != "200" ] && [ "$DWCODE" != "204" ]; then
            echo "⚠️ Failed to write default Gravitee token to Vault (HTTP ${DWCODE}); skipping default token binding."
            DEFAULT_GRAVITEE_TOKEN=""
          else
            echo "🔐 Default Gravitee token created in Vault (${DEFAULT_GRAVITEE_TOKEN_VAULT_PATH})"
          fi
        fi

        if [ -n "${DEFAULT_GRAVITEE_TOKEN:-}" ] && [ "${DEFAULT_GRAVITEE_TOKEN}" != "null" ]; then
          default_svc_email="svc-gravitee-default@svc.local"
          default_svc_email_sql="$(printf '%s' "$default_svc_email" | sed "s/'/''/g")"
          DEFAULT_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.directus_users WHERE email='${default_svc_email_sql}' LIMIT 1;" || true)"
          DEFAULT_USER_ID="$(printf '%s' "$DEFAULT_USER_ID" | tr -d '\r')"
          default_token_sql="$(printf '%s' "$DEFAULT_GRAVITEE_TOKEN" | sed "s/'/''/g")"
          default_role_id_sql="$(printf '%s' "$DEFAULT_ROLE_ID" | sed "s/'/''/g")"

          if [ -z "${DEFAULT_USER_ID:-}" ] || [ "${DEFAULT_USER_ID}" = "null" ]; then
            DEFAULT_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
            DUCOLS="id,email"
            DUVALS="'${DEFAULT_USER_ID}','${default_svc_email_sql}'"
            if _default_has_user_col "role"; then DUCOLS="${DUCOLS},role"; DUVALS="${DUVALS},'${default_role_id_sql}'"; fi
            if _default_has_user_col "token"; then DUCOLS="${DUCOLS},token"; DUVALS="${DUVALS},'${default_token_sql}'"; fi
            if _default_has_user_col "status"; then DUCOLS="${DUCOLS},status"; DUVALS="${DUVALS},'active'"; fi
            if _default_has_user_col "first_name"; then DUCOLS="${DUCOLS},first_name"; DUVALS="${DUVALS},'svc'"; fi
            if _default_has_user_col "last_name"; then DUCOLS="${DUCOLS},last_name"; DUVALS="${DUVALS},'gravitee-default'"; fi
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_users (${DUCOLS}) VALUES (${DUVALS});"
            echo "✅ Created default Gravitee service user ${default_svc_email}"
          else
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_users SET role='${default_role_id_sql}', token='${default_token_sql}', status='active' WHERE id='${DEFAULT_USER_ID}';"
            echo "✅ Updated default Gravitee service user ${default_svc_email}"
          fi
        fi
      fi
    else
      echo "⚠️ directus_users.token column not found; cannot bind default Gravitee token."
    fi
    
    # 5e) Provision a dedicated admin-backed token for OpenAPI discovery sync.
    # Directus only includes `/items/*` paths in OAS for admin-level users.
    echo "🧾 Ensuring OpenAPI sync admin token exists..."
    OPENAPI_SYNC_TOKEN_VAULT_PATH="${OPENAPI_SYNC_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/openapi/admin}"
    OPENAPI_USER_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
    _openapi_has_user_col() { printf '%s\n' "$OPENAPI_USER_COLS" | grep -qx "$1"; }
    
    if _openapi_has_user_col "token"; then
      ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
      ADMIN_ROLE_ID="$(printf '%s' "$ADMIN_ROLE_ID" | tr -d '\r')"
    
      if [ -z "${ADMIN_ROLE_ID:-}" ] || [ "${ADMIN_ROLE_ID}" = "null" ]; then
        echo "⚠️ Administrator role not found; skipping OpenAPI sync token provisioning."
      else
        OPENAPI_SYNC_TOKEN=""
        RCODE="$(curl -sS -o /tmp/openapi-sync-token-read.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
        if [ "$RCODE" = "200" ]; then
          OPENAPI_SYNC_TOKEN="$(jq -r '.data.data.token // empty' /tmp/openapi-sync-token-read.json 2>/dev/null || true)"
        fi
        if [ -z "${OPENAPI_SYNC_TOKEN:-}" ] || [ "${OPENAPI_SYNC_TOKEN}" = "null" ]; then
          OPENAPI_SYNC_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
        fi
    
        openapi_email="svc-openapi-admin@svc.local"
        openapi_email_sql="$(printf '%s' "$openapi_email" | sed "s/'/''/g")"
        ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT id FROM directus.directus_users WHERE email = '${openapi_email_sql}' LIMIT 1;" || true)"
        ADMIN_USER_ID="$(printf '%s' "$ADMIN_USER_ID" | tr -d '\r')"
        token_sql="$(printf '%s' "$OPENAPI_SYNC_TOKEN" | sed "s/'/''/g")"
        admin_role_sql="$(printf '%s' "$ADMIN_ROLE_ID" | sed "s/'/''/g")"
    
        if [ -z "${ADMIN_USER_ID:-}" ] || [ "${ADMIN_USER_ID}" = "null" ]; then
          ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
          UCOLS="id,email"
          UVALS="'${ADMIN_USER_ID}','${openapi_email_sql}'"
          if _openapi_has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${admin_role_sql}'"; fi
          if _openapi_has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
          if _openapi_has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
          if _openapi_has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
          if _openapi_has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'openapi-admin'"; fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
          echo "✅ Created OpenAPI sync user ${openapi_email}"
        else
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; UPDATE directus_users SET role='${admin_role_sql}', token='${token_sql}', status='active' WHERE id='${ADMIN_USER_ID}';"
          echo "✅ Updated OpenAPI sync user ${openapi_email}"
        fi
    
        payload="$(jq -nc --arg t "$OPENAPI_SYNC_TOKEN" '{data:{token:$t}}')"
        WCODE="$(curl -sS -o /tmp/openapi-sync-token-write.json -w '%{http_code}' -X POST \
          -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
          -d "$payload" "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
        if [ "$WCODE" = "200" ] || [ "$WCODE" = "204" ]; then
          echo "✅ OpenAPI sync token stored in Vault (${OPENAPI_SYNC_TOKEN_VAULT_PATH})"
        else
          echo "⚠️ Failed to store OpenAPI sync token in Vault (HTTP ${WCODE})"
        fi
      fi
    else
      echo "⚠️ directus_users.token column not found; cannot provision OpenAPI sync token."
    fi
    
    if [ "${DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED}" = "true" ] || [ "${DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED}" = "true" ] || [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
      if command -v run_directus_settings_mutations >/dev/null 2>&1; then
        echo "🔄 Applying optional Directus settings seed..."
        run_directus_settings_mutations
      else
        echo "⚠️ Data-mutation helper missing run_directus_settings_mutations; skipping Directus settings update."
      fi
    else
      echo "ℹ️ DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED=false and DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=false; skipping Directus settings seed."
    fi

    echo "🧩 Reconciling local extension registrations..."
    EXT_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_extensions' LIMIT 1;" || true)"
    if [ "$EXT_TABLE_EXISTS" = "1" ]; then
      EXT_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_extensions' ORDER BY column_name;" || true)"
      _ensure_local_ext_enabled() {
        ext_folder="$1"
        ext_folder_sql="$(printf '%s' "$ext_folder" | sed "s/'/''/g")"
    
        if printf '%s\n' "$EXT_COLS" | grep -qx "folder"; then
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus.directus_extensions WHERE folder='${ext_folder_sql}' AND source='local' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE folder='${ext_folder_sql}' AND source='local';"
            echo "✅ ${ext_folder} extension enabled."
          else
            EXT_ID="$(cat /proc/sys/kernel/random/uuid)"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_extensions (id, enabled, source, folder, bundle) VALUES ('${EXT_ID}', true, 'local', '${ext_folder_sql}', NULL);"
            echo "✅ ${ext_folder} extension registered."
          fi
        else
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus.directus_extensions WHERE name='${ext_folder_sql}' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE name='${ext_folder_sql}';"
            echo "✅ ${ext_folder} extension enabled."
          else
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_extensions (name, enabled) VALUES ('${ext_folder_sql}', true);"
            echo "✅ ${ext_folder} extension registered."
          fi
        fi
      }

      _ensure_local_ext_disabled() {
        ext_folder="$1"
        ext_folder_sql="$(printf '%s' "$ext_folder" | sed "s/'/''/g")"

        if printf '%s\n' "$EXT_COLS" | grep -qx "folder"; then
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus.directus_extensions WHERE folder='${ext_folder_sql}' AND source='local' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=false WHERE folder='${ext_folder_sql}' AND source='local';"
            echo "✅ ${ext_folder} extension disabled."
          else
            echo "  └─ ${ext_folder} extension not registered; skip disable."
          fi
        else
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus.directus_extensions WHERE name='${ext_folder_sql}' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=false WHERE name='${ext_folder_sql}';"
            echo "✅ ${ext_folder} extension disabled."
          else
            echo "  └─ ${ext_folder} extension not registered; skip disable."
          fi
        fi
      }
    
      _ensure_local_ext_enabled "github-profile-sync"
      _ensure_local_ext_enabled "ai-provider-access"
      _ensure_local_ext_enabled "cms-content-model-select"
      _ensure_local_ext_enabled "cms-keycloak-role-options"
      _ensure_local_ext_enabled "cms-asset-url-picker"
      _ensure_local_ext_enabled "cms-module-props-editor"
      _ensure_local_ext_disabled "cms-preset-bookmark-copy"
      _ensure_local_ext_enabled "cms-bookmark-copy"
      _ensure_local_ext_enabled "cms-page-blocks-manager"
    else
      echo "⚠️ directus_extensions table not found; skipping extension enable."
    fi

    echo "🧭 Ensuring Copy Bookmarks appears in the module bar..."
    if ! _psql_yb_retry "DO \$\$
      DECLARE
        _module_bar_type text;
        _bookmark_module_bar jsonb := jsonb_build_array(
          jsonb_build_object('type', 'module', 'id', 'content', 'enabled', true),
          jsonb_build_object('type', 'module', 'id', 'visual', 'enabled', false),
          jsonb_build_object('type', 'module', 'id', 'users', 'enabled', true),
          jsonb_build_object('type', 'module', 'id', 'files', 'enabled', true),
          jsonb_build_object('type', 'module', 'id', 'insights', 'enabled', true),
          jsonb_build_object('type', 'module', 'id', 'deployments', 'enabled', false),
          jsonb_build_object('type', 'module', 'id', 'cms-bookmark-copy', 'enabled', true),
          jsonb_build_object('type', 'link', 'id', 'docs', 'enabled', true, 'name', '\$t:documentation', 'icon', 'help', 'url', 'https://docs.directus.io'),
          jsonb_build_object('type', 'module', 'id', 'settings', 'enabled', true, 'locked', true)
        );
      BEGIN
        IF to_regclass('directus.directus_settings') IS NULL THEN
          RETURN;
        END IF;

        SELECT udt_name
          INTO _module_bar_type
          FROM information_schema.columns
         WHERE table_schema='directus'
           AND table_name='directus_settings'
           AND column_name='module_bar'
        LIMIT 1;

        IF _module_bar_type = 'jsonb' THEN
          UPDATE directus_settings ds
             SET module_bar = CASE
               WHEN ds.module_bar IS NULL THEN _bookmark_module_bar
               WHEN jsonb_typeof(ds.module_bar::jsonb) = 'array'
                 THEN ds.module_bar::jsonb || jsonb_build_array(jsonb_build_object('type', 'module', 'id', 'cms-bookmark-copy', 'enabled', true))
               ELSE ds.module_bar::jsonb
             END
           WHERE ds.module_bar IS NULL
              OR (
                jsonb_typeof(ds.module_bar::jsonb) = 'array'
                AND NOT EXISTS (
                  SELECT 1
                    FROM jsonb_array_elements(CASE WHEN jsonb_typeof(ds.module_bar::jsonb) = 'array' THEN ds.module_bar::jsonb ELSE '[]'::jsonb END) elem
                   WHERE (jsonb_typeof(elem) = 'string' AND elem #>> '{}' = 'cms-bookmark-copy')
                      OR (jsonb_typeof(elem) = 'object' AND elem->>'id' = 'cms-bookmark-copy')
                      OR (jsonb_typeof(elem) = 'object' AND elem->>'url' IN ('cms-bookmark-copy', '/cms-bookmark-copy', '/admin/cms-bookmark-copy'))
                )
              );
        ELSIF _module_bar_type = 'json' THEN
          UPDATE directus_settings ds
             SET module_bar = (CASE
               WHEN ds.module_bar IS NULL THEN _bookmark_module_bar
               WHEN jsonb_typeof(ds.module_bar::jsonb) = 'array'
                 THEN ds.module_bar::jsonb || jsonb_build_array(jsonb_build_object('type', 'module', 'id', 'cms-bookmark-copy', 'enabled', true))
               ELSE ds.module_bar::jsonb
             END)::json
           WHERE ds.module_bar IS NULL
              OR (
                jsonb_typeof(ds.module_bar::jsonb) = 'array'
                AND NOT EXISTS (
                  SELECT 1
                    FROM jsonb_array_elements(CASE WHEN jsonb_typeof(ds.module_bar::jsonb) = 'array' THEN ds.module_bar::jsonb ELSE '[]'::jsonb END) elem
                   WHERE (jsonb_typeof(elem) = 'string' AND elem #>> '{}' = 'cms-bookmark-copy')
                      OR (jsonb_typeof(elem) = 'object' AND elem->>'id' = 'cms-bookmark-copy')
                      OR (jsonb_typeof(elem) = 'object' AND elem->>'url' IN ('cms-bookmark-copy', '/cms-bookmark-copy', '/admin/cms-bookmark-copy'))
                )
              );
        END IF;
      END
      \$\$;" "ensure Copy Bookmarks module bar item" 12; then
      echo "⚠️ Could not reconcile Copy Bookmarks module bar item."
    fi

    RECON_DURATION_MS=$(( ($(date +%s) - RECON_STARTED_EPOCH) * 1000 ))
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       UPDATE schema_patch_log \
          SET patch_status='success', \
              patch_checksum='${RECON_PATCH_CHECKSUM_SQL}', \
              patch_group='${RECON_PATCH_GROUP_SQL}', \
              details='${RECON_PATCH_DETAILS_SQL}'::jsonb, \
              last_error=NULL, \
              applied_at=now(), \
              last_checked_at=now(), \
              duration_ms=${RECON_DURATION_MS} \
        WHERE patch_key='${RECON_PATCH_KEY_SQL}';"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       UPDATE schema_patch_runs \
          SET patch_status='success', \
              error=NULL, \
              finished_at=now(), \
              duration_ms=${RECON_DURATION_MS} \
        WHERE run_id='${RECON_RUN_ID_SQL}';"
    RECON_DONE="1"
    trap - EXIT
    rm -f "${POSTSCHEMA_FAILED_FILE}" >/dev/null 2>&1 || true
    touch "${POSTSCHEMA_DB_READY_FILE}"
    touch "${POSTSCHEMA_READY_FILE}"

    echo "✅ Schema patch applied. Going idle."
    exec tail -f /dev/null
    
