      BEGIN
        _base := REGEXP_REPLACE(LOWER(COALESCE(NULLIF(BTRIM(_name), ''), 'template-function')), '[^a-z0-9_.-]+', '-', 'g');
        _base := REGEXP_REPLACE(_base, '(^[-.]+|[-.]+$)', '', 'g');
        IF COALESCE(NULLIF(BTRIM(_base), ''), '') = '' THEN
          _base := 'template-function';
        END IF;
        IF _base !~ '^[a-z_]' THEN
          _base := 'fn-' || _base;
        END IF;
        _base := LEFT(_base, 56);
        _base := REGEXP_REPLACE(_base, '[-.]+$', '', 'g');
        IF COALESCE(NULLIF(BTRIM(_base), ''), '') = '' THEN
          _base := 'template-function';
        END IF;
        _suffix := LEFT(REPLACE(COALESCE(_id::TEXT, directus.cms_generate_uuid()::TEXT), '-', ''), 12);
        RETURN 'system.' || _base || '-' || _suffix;
      END;
      \$\$;
      CREATE OR REPLACE FUNCTION directus.normalize_cms_template_function_token_key(_token_key TEXT, _name TEXT, _id UUID)
      RETURNS TEXT
      LANGUAGE plpgsql
      AS \$\$
      DECLARE
        _raw TEXT;
        _value TEXT;
      BEGIN
        _raw := COALESCE(NULLIF(BTRIM(_token_key), ''), '');
        IF _raw = '' THEN
          RETURN directus.generate_cms_template_function_token_key(_name, _id);
        END IF;
        IF _raw !~ '^system[.]' THEN
          _raw := 'system.' || _raw;
        END IF;
        _value := substring(_raw from 8);
        _value := REGEXP_REPLACE(_value, '[[:space:]]+', '-', 'g');
        _value := REGEXP_REPLACE(_value, '[^A-Za-z0-9_.-]+', '-', 'g');
        _value := REGEXP_REPLACE(_value, '(^[-.]+|[-.]+$)', '', 'g');
        IF COALESCE(NULLIF(BTRIM(_value), ''), '') = '' THEN
          RETURN directus.generate_cms_template_function_token_key(_name, _id);
        END IF;
        IF _value !~ '^[A-Za-z_]' THEN
          _value := 'fn-' || _value;
        END IF;
        RETURN 'system.' || _value;
      END;
      \$\$;
      CREATE OR REPLACE FUNCTION directus.ensure_cms_template_function_token_key()
      RETURNS trigger
      LANGUAGE plpgsql
      AS \$\$
      DECLARE
        _candidate TEXT;
        _scoped_site_key TEXT;
        _suffix TEXT;
      BEGIN
        IF NEW.id IS NULL THEN
          NEW.id := directus.cms_generate_uuid();
        END IF;
        IF COALESCE(NULLIF(BTRIM(NEW.release_channel), ''), '') = '' THEN
          NEW.release_channel := 'preview';
        ELSE
          NEW.release_channel := BTRIM(NEW.release_channel);
        END IF;
        IF NEW.site_key IS NOT NULL THEN
          NEW.site_key := NULLIF(BTRIM(NEW.site_key), '');
        END IF;
        _candidate := directus.normalize_cms_template_function_token_key(NEW.token_key, NEW.name, NEW.id);
        _scoped_site_key := COALESCE(NULLIF(BTRIM(NEW.site_key), ''), '');
        IF EXISTS (
          SELECT 1 FROM cms_template_functions existing
          WHERE existing.id IS DISTINCT FROM NEW.id
            AND COALESCE(NULLIF(BTRIM(existing.site_key), ''), '') = _scoped_site_key
            AND COALESCE(NULLIF(BTRIM(existing.release_channel), ''), 'preview') = NEW.release_channel
            AND existing.token_key = _candidate
          LIMIT 1
        ) THEN
          _suffix := LEFT(REPLACE(NEW.id::TEXT, '-', ''), 12);
          _candidate := REGEXP_REPLACE(LEFT(_candidate, 88), '[-.]+$', '', 'g') || '-' || _suffix;
        END IF;
        NEW.token_key := _candidate;
        IF COALESCE(NULLIF(BTRIM(NEW.handler_key), ''), '') = '' THEN
          NEW.handler_key := 'current_year';
        ELSE
          NEW.handler_key := BTRIM(NEW.handler_key);
        END IF;
        RETURN NEW;
      END;
      \$\$;
      DROP TRIGGER IF EXISTS cms_template_functions_token_key_guard ON cms_template_functions;
      CREATE TRIGGER cms_template_functions_token_key_guard
      BEFORE INSERT OR UPDATE OF token_key, name, site_key, release_channel, handler_key
      ON cms_template_functions
      FOR EACH ROW
      EXECUTE FUNCTION directus.ensure_cms_template_function_token_key();" "ensure cms_template_functions.token_key generation" 24; then
      echo "❌ Could not ensure cms_template_functions.token_key generation after retries."
      exit 1
    fi

    if [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
      echo "🌱 DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=true; reconciling cms_modules from ${MODULES_FILE}..."
      if [ -f "${MODULES_FILE}" ]; then
        MODULES_JSON="$(yq -o=json '.' "${MODULES_FILE}" 2>/dev/null || true)"
        if printf '%s' "${MODULES_JSON}" | jq -e '.modules | type=="array" and length>0' >/dev/null 2>&1; then
          printf '%s' "${MODULES_JSON}" | jq -c '.modules[]' | while IFS= read -r module; do
            module_key="$(printf '%s' "$module" | jq -r '.module_key // empty')"
            module_name="$(printf '%s' "$module" | jq -r '.name // empty')"
            module_status_raw="$(printf '%s' "$module" | jq -r '.status // "published"')"
            module_provider_raw="$(printf '%s' "$module" | jq -r '.provider // "radix"')"
            module_desc="$(printf '%s' "$module" | jq -r '.description // empty')"
            module_component_type="$(printf '%s' "$module" | jq -r '.component_type // empty')"
            module_site="$(printf '%s' "$module" | jq -r 'if .site_key == null then "" else (.site_key | tostring) end')"
            module_props_schema_json="$(printf '%s' "$module" | jq -c '.props_schema // {}')"
            module_default_props_json="$(printf '%s' "$module" | jq -c '.default_props // {}')"

            if [ -z "${module_key:-}" ] || [ -z "${module_name:-}" ]; then
              echo "⚠️  skipping invalid module entry (module_key/name required)"
              continue
            fi

            module_status="$(printf '%s' "${module_status_raw:-published}" | tr '[:upper:]' '[:lower:]')"
            if [ "${module_status}" != "published" ] && [ "${module_status}" != "draft" ] && [ "${module_status}" != "archived" ]; then
              module_status="published"
            fi
            module_provider="$(printf '%s' "${module_provider_raw:-radix}" | tr '[:upper:]' '[:lower:]')"
            if [ -z "${module_provider}" ]; then
              module_provider="radix"
            fi

            module_key_sql="$(printf '%s' "$module_key" | sed "s/'/''/g")"
            module_name_sql="$(printf '%s' "$module_name" | sed "s/'/''/g")"
            module_status_sql="$(printf '%s' "$module_status" | sed "s/'/''/g")"
            module_provider_sql="$(printf '%s' "$module_provider" | sed "s/'/''/g")"
            module_props_schema_sql="$(printf '%s' "$module_props_schema_json" | sed "s/'/''/g")"
            module_default_props_sql="$(printf '%s' "$module_default_props_json" | sed "s/'/''/g")"

            module_desc_sql="NULL"
            if [ -n "${module_desc:-}" ]; then
              module_desc_esc="$(printf '%s' "$module_desc" | sed "s/'/''/g")"
              module_desc_sql="'${module_desc_esc}'"
            fi
            module_component_type_sql="NULL"
            if [ -n "${module_component_type:-}" ]; then
              module_component_type_esc="$(printf '%s' "$module_component_type" | sed "s/'/''/g")"
              module_component_type_sql="'${module_component_type_esc}'"
            fi
            module_site_sql="NULL"
            module_scope_condition="(site_key IS NULL OR site_key='')"
            if [ -n "${module_site:-}" ]; then
              module_site_esc="$(printf '%s' "$module_site" | sed "s/'/''/g")"
              module_site_sql="'${module_site_esc}'"
              module_scope_condition="site_key='${module_site_esc}'"
            fi

            existing_module_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.cms_modules WHERE module_key='${module_key_sql}' AND ${module_scope_condition} LIMIT 1;" || true)"
            existing_module_id="$(printf '%s' "$existing_module_id" | tr -d '\r')"
            if [ -n "${existing_module_id:-}" ] && [ "${existing_module_id}" != "null" ]; then
              existing_module_id_sql="$(printf '%s' "$existing_module_id" | sed "s/'/''/g")"
              if ! _psql_yb_retry "UPDATE cms_modules
                SET name='${module_name_sql}',
                    description=${module_desc_sql},
                    provider='${module_provider_sql}',
                    component_type=${module_component_type_sql},
                    status='${module_status_sql}',
                    site_key=${module_site_sql},
                    refresh_target='both',
                    props_schema='${module_props_schema_sql}'::jsonb,
                    default_props='${module_default_props_sql}'::jsonb,
                    date_updated=now()
                WHERE id='${existing_module_id_sql}';" "reconcile module '${module_key}'" 12; then
                echo "⚠️  skipped module '${module_key}' due to transient DB errors; will retry next rebuild seed reconcile"
                continue
              fi
              echo "INFO: Reconciled module '${module_key}'"
            else
              new_module_id="$(cat /proc/sys/kernel/random/uuid)"
              new_module_id_sql="$(printf '%s' "$new_module_id" | sed "s/'/''/g")"
              if ! _psql_yb_retry "INSERT INTO cms_modules (id, module_key, name, description, provider, component_type, status, site_key, refresh_target, props_schema, default_props, date_created, date_updated)
                VALUES ('${new_module_id_sql}', '${module_key_sql}', '${module_name_sql}', ${module_desc_sql}, '${module_provider_sql}', ${module_component_type_sql}, '${module_status_sql}', ${module_site_sql}, 'both', '${module_props_schema_sql}'::jsonb, '${module_default_props_sql}'::jsonb, now(), now());" "seed module '${module_key}'" 12; then
                echo "⚠️  skipped module '${module_key}' due to transient DB errors; will retry next rebuild seed reconcile"
                continue
              fi
              echo "INFO: Seeded module '${module_key}'"
            fi
          done
        else
          echo "INFO: no modules configured in ${MODULES_FILE}; skipping optional cms_modules seed."
        fi
      else
        echo "INFO: ${MODULES_FILE} not found; skipping optional cms_modules seed."
      fi
    else
      echo "INFO: DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=false; skipping manifest-managed cms_modules data writes."
    fi
    
    echo "🧱 Ensuring cms_page_blocks M2A relation allows cms block collections..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       DO \$\$ \
       DECLARE \
         _allowed TEXT; \
       BEGIN \
         IF to_regclass('directus.directus_relations') IS NULL OR to_regclass('directus.cms_page_blocks') IS NULL THEN \
           RETURN; \
         END IF; \
         SELECT COALESCE(string_agg(src.collection_name, ',' ORDER BY src.collection_name), 'cms_block_content_ref,cms_block_hero,cms_block_module,cms_block_rich_text,cms_block_template_ref') \
           INTO _allowed \
         FROM ( \
           SELECT DISTINCT collection AS collection_name \
           FROM cms_page_blocks \
           WHERE COALESCE(NULLIF(BTRIM(collection), ''), '') <> '' \
             AND collection LIKE 'cms_block_%' \
           UNION \
           SELECT 'cms_block_content_ref' \
           UNION \
           SELECT 'cms_block_hero' \
           UNION \
           SELECT 'cms_block_module' \
           UNION \
           SELECT 'cms_block_rich_text' \
           UNION \
           SELECT 'cms_block_template_ref' \
         ) src; \
         UPDATE directus_relations \
            SET one_allowed_collections = _allowed \
          WHERE many_collection = 'cms_page_blocks' \
            AND many_field = 'item' \
            AND COALESCE(one_allowed_collections, '') IS DISTINCT FROM _allowed; \
       END \
       \$\$;"
    
    echo "🧱 Enforcing cms_page_blocks.slot against selected layout template..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE OR REPLACE FUNCTION directus.enforce_cms_page_block_slot() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         _template_key TEXT; \
         _site_key TEXT; \
         _page_release_channel TEXT; \
         _page_slug TEXT; \
         _page_refresh_target TEXT; \
         _parent_block_id UUID; \
         _parent_collection TEXT; \
         _parent_item TEXT; \
         _slot_key TEXT; \
         _slot_exists BOOLEAN; \
         _fallback_slot TEXT; \
       BEGIN \
         _slot_key := COALESCE(NULLIF(LOWER(BTRIM(NEW.slot)), ''), 'main'); \
         NEW.slot := _slot_key; \
         _parent_block_id := NEW.parent_block_id; \
         IF NEW.page_id IS NULL THEN \
           RAISE EXCEPTION 'cms_page_blocks.page_id is required'; \
         END IF; \
         IF _parent_block_id IS NOT NULL AND NEW.id IS NOT NULL AND _parent_block_id = NEW.id THEN \
           RAISE EXCEPTION 'cms_page_blocks.parent_block_id cannot equal the block id'; \
         END IF; \
         SELECT COALESCE(NULLIF(BTRIM(p.layout_template_key), ''), ''), \
                COALESCE(NULLIF(BTRIM(p.site_key), ''), ''), \
                CASE \
                  WHEN LOWER(COALESCE(p.release_channel, '')) IN ('preview','prod') THEN LOWER(p.release_channel) \
                  ELSE 'preview' \
                END, \
                COALESCE(NULLIF(BTRIM(p.slug), ''), ''), \
                CASE \
                  WHEN LOWER(COALESCE(p.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(p.refresh_target) \
                  ELSE 'both' \
                END \
           INTO _template_key, _site_key, _page_release_channel, _page_slug, _page_refresh_target \
         FROM directus.cms_pages p \
         WHERE p.id = NEW.page_id \
         LIMIT 1; \
         IF NOT FOUND THEN \
           RAISE EXCEPTION 'cms_page_blocks.page_id % does not reference an existing cms_pages row', NEW.page_id; \
         END IF; \
         NEW.site_key := NULLIF(_site_key, ''); \
         NEW.release_channel := COALESCE(NULLIF(_page_release_channel, ''), 'preview'); \
         NEW.page_slug := NULLIF(_page_slug, ''); \
         NEW.refresh_target := COALESCE(NULLIF(_page_refresh_target, ''), 'both'); \
         IF _parent_block_id IS NOT NULL THEN \
           SELECT COALESCE(NULLIF(BTRIM(pb.collection), ''), ''), \
                  COALESCE(NULLIF(BTRIM(pb.item), ''), '') \
             INTO _parent_collection, _parent_item \
           FROM directus.cms_page_blocks pb \
           WHERE pb.id = _parent_block_id \
             AND pb.page_id = NEW.page_id \
           LIMIT 1; \
           IF NOT FOUND THEN \
             RAISE EXCEPTION 'cms_page_blocks.parent_block_id % does not reference an existing block for page %', _parent_block_id, NEW.page_id; \
           END IF; \
           IF _parent_collection <> 'cms_block_template_ref' THEN \
             RAISE EXCEPTION 'cms_page_blocks.parent_block_id % must reference a cms_block_template_ref block', _parent_block_id; \
           END IF; \
           SELECT COALESCE(NULLIF(BTRIM(tr.template_key), ''), '') \
             INTO _template_key \
           FROM directus.cms_block_template_ref tr \
           WHERE tr.id::text = _parent_item \
           LIMIT 1; \
           IF COALESCE(_template_key, '') = '' THEN \
             RAISE EXCEPTION 'Parent template-ref block % has no valid template_key', _parent_block_id; \
           END IF; \
         END IF; \
         IF COALESCE(_template_key, '') = '' THEN \
           RETURN NEW; \
         END IF; \
         SELECT EXISTS ( \
           SELECT 1 \
           FROM directus.cms_layout_template_slots s \
           WHERE s.template_key = _template_key \
             AND s.slot_key = _slot_key \
             AND (COALESCE(NULLIF(BTRIM(s.site_key), ''), '') = '' OR COALESCE(NULLIF(BTRIM(s.site_key), ''), '') = _site_key) \
         ) INTO _slot_exists; \
         IF NOT COALESCE(_slot_exists, false) THEN \
           SELECT s.slot_key \
             INTO _fallback_slot \
           FROM directus.cms_layout_template_slots s \
           WHERE s.template_key = _template_key \
             AND (COALESCE(NULLIF(BTRIM(s.site_key), ''), '') = '' OR COALESCE(NULLIF(BTRIM(s.site_key), ''), '') = _site_key) \
           ORDER BY CASE WHEN s.slot_key = 'main' THEN 0 ELSE 1 END, s.slot_key \
           LIMIT 1; \
           IF COALESCE(_fallback_slot, '') = '' THEN \
             RAISE EXCEPTION 'Invalid slot % for layout template %', _slot_key, _template_key; \
           END IF; \
           _slot_key := COALESCE(NULLIF(LOWER(BTRIM(_fallback_slot)), ''), 'main'); \
           NEW.slot := _slot_key; \
         END IF; \
         RETURN NEW; \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.sync_cms_block_metadata_from_page_block() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         _refresh_target TEXT; \
       BEGIN \
         IF TG_OP = 'DELETE' THEN \
           RETURN OLD; \
         END IF; \
         IF COALESCE(NULLIF(BTRIM(NEW.collection), ''), '') = '' OR COALESCE(NULLIF(BTRIM(NEW.item), ''), '') = '' THEN \
           RETURN NEW; \
         END IF; \
         _refresh_target := CASE \
           WHEN LOWER(COALESCE(NEW.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(NEW.refresh_target) \
           ELSE 'both' \
         END; \
         IF NEW.collection = 'cms_block_rich_text' THEN \
           UPDATE directus.cms_block_rich_text rt \
              SET site_key = NEW.site_key, \
                  release_channel = NEW.release_channel, \
                  page_slug = NEW.page_slug, \
                  refresh_target = _refresh_target \
            WHERE rt.id::text = NEW.item \
              AND (rt.site_key IS DISTINCT FROM NEW.site_key \
                OR rt.release_channel IS DISTINCT FROM NEW.release_channel \
                OR rt.page_slug IS DISTINCT FROM NEW.page_slug \
                OR rt.refresh_target IS DISTINCT FROM _refresh_target); \
         ELSIF NEW.collection = 'cms_block_hero' THEN \
           UPDATE directus.cms_block_hero h \
              SET site_key = NEW.site_key, \
                  release_channel = NEW.release_channel, \
                  page_slug = NEW.page_slug, \
                  refresh_target = _refresh_target \
            WHERE h.id::text = NEW.item \
              AND (h.site_key IS DISTINCT FROM NEW.site_key \
                OR h.release_channel IS DISTINCT FROM NEW.release_channel \
                OR h.page_slug IS DISTINCT FROM NEW.page_slug \
                OR h.refresh_target IS DISTINCT FROM _refresh_target); \
         ELSIF NEW.collection = 'cms_block_module' THEN \
           UPDATE directus.cms_block_module m \
              SET site_key = NEW.site_key, \
                  release_channel = NEW.release_channel, \
                  page_slug = NEW.page_slug, \
                  refresh_target = _refresh_target \
            WHERE m.id::text = NEW.item \
              AND (m.site_key IS DISTINCT FROM NEW.site_key \
                OR m.release_channel IS DISTINCT FROM NEW.release_channel \
                OR m.page_slug IS DISTINCT FROM NEW.page_slug \
                OR m.refresh_target IS DISTINCT FROM _refresh_target); \
         ELSIF NEW.collection = 'cms_block_template_ref' THEN \
           UPDATE directus.cms_block_template_ref tr \
              SET site_key = NEW.site_key, \
                  release_channel = NEW.release_channel, \
                  page_slug = NEW.page_slug, \
                  refresh_target = _refresh_target \
            WHERE tr.id::text = NEW.item \
              AND (tr.site_key IS DISTINCT FROM NEW.site_key \
                OR tr.release_channel IS DISTINCT FROM NEW.release_channel \
                OR tr.page_slug IS DISTINCT FROM NEW.page_slug \
                OR tr.refresh_target IS DISTINCT FROM _refresh_target); \
         ELSIF NEW.collection = 'cms_block_content_ref' THEN \
           UPDATE directus.cms_block_content_ref cr \
              SET site_key = NEW.site_key, \
                  release_channel = NEW.release_channel, \
                  page_slug = NEW.page_slug, \
                  refresh_target = _refresh_target \
            WHERE cr.id::text = NEW.item \
              AND (cr.site_key IS DISTINCT FROM NEW.site_key \
                OR cr.release_channel IS DISTINCT FROM NEW.release_channel \
                OR cr.page_slug IS DISTINCT FROM NEW.page_slug \
                OR cr.refresh_target IS DISTINCT FROM _refresh_target); \
         END IF; \
         RETURN NEW; \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.sync_cms_block_metadata_from_page() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         _refresh_target TEXT; \
       BEGIN \
         IF TG_OP = 'DELETE' THEN \
           RETURN OLD; \
         END IF; \
         _refresh_target := CASE \
           WHEN LOWER(COALESCE(NEW.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(NEW.refresh_target) \
           ELSE 'both' \
         END; \
         UPDATE directus.cms_page_blocks pb \
            SET site_key = NEW.site_key, \
                release_channel = NEW.release_channel, \
                page_slug = NEW.slug, \
                refresh_target = _refresh_target, \
                slot = COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main') \
          WHERE pb.page_id = NEW.id \
            AND (pb.site_key IS DISTINCT FROM NEW.site_key \
              OR pb.release_channel IS DISTINCT FROM NEW.release_channel \
              OR pb.page_slug IS DISTINCT FROM NEW.slug \
              OR pb.refresh_target IS DISTINCT FROM _refresh_target \
              OR pb.slot IS DISTINCT FROM COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main')); \
         UPDATE directus.cms_block_rich_text rt \
            SET site_key = pb.site_key, \
                release_channel = pb.release_channel, \
                page_slug = pb.page_slug, \
                refresh_target = pb.refresh_target \
           FROM directus.cms_page_blocks pb \
          WHERE pb.page_id = NEW.id \
            AND pb.collection = 'cms_block_rich_text' \
            AND pb.item = rt.id::text \
            AND (rt.site_key IS DISTINCT FROM pb.site_key \
              OR rt.release_channel IS DISTINCT FROM pb.release_channel \
              OR rt.page_slug IS DISTINCT FROM pb.page_slug \
              OR rt.refresh_target IS DISTINCT FROM pb.refresh_target); \
         UPDATE directus.cms_block_hero h \
            SET site_key = pb.site_key, \
                release_channel = pb.release_channel, \
                page_slug = pb.page_slug, \
                refresh_target = pb.refresh_target \
           FROM directus.cms_page_blocks pb \
          WHERE pb.page_id = NEW.id \
            AND pb.collection = 'cms_block_hero' \
            AND pb.item = h.id::text \
            AND (h.site_key IS DISTINCT FROM pb.site_key \
              OR h.release_channel IS DISTINCT FROM pb.release_channel \
              OR h.page_slug IS DISTINCT FROM pb.page_slug \
              OR h.refresh_target IS DISTINCT FROM pb.refresh_target); \
         UPDATE directus.cms_block_module m \
            SET site_key = pb.site_key, \
                release_channel = pb.release_channel, \
                page_slug = pb.page_slug, \
                refresh_target = pb.refresh_target \
           FROM directus.cms_page_blocks pb \
         WHERE pb.page_id = NEW.id \
            AND pb.collection = 'cms_block_module' \
            AND pb.item = m.id::text \
         AND (m.site_key IS DISTINCT FROM pb.site_key \
              OR m.release_channel IS DISTINCT FROM pb.release_channel \
              OR m.page_slug IS DISTINCT FROM pb.page_slug \
              OR m.refresh_target IS DISTINCT FROM pb.refresh_target); \
         UPDATE directus.cms_block_template_ref tr \
            SET site_key = pb.site_key, \
                release_channel = pb.release_channel, \
                page_slug = pb.page_slug, \
                refresh_target = pb.refresh_target \
           FROM directus.cms_page_blocks pb \
          WHERE pb.page_id = NEW.id \
            AND pb.collection = 'cms_block_template_ref' \
            AND pb.item = tr.id::text \
         AND (tr.site_key IS DISTINCT FROM pb.site_key \
              OR tr.release_channel IS DISTINCT FROM pb.release_channel \
              OR tr.page_slug IS DISTINCT FROM pb.page_slug \
              OR tr.refresh_target IS DISTINCT FROM pb.refresh_target); \
         UPDATE directus.cms_block_content_ref cr \
            SET site_key = pb.site_key, \
                release_channel = pb.release_channel, \
                page_slug = pb.page_slug, \
                refresh_target = pb.refresh_target \
           FROM directus.cms_page_blocks pb \
          WHERE pb.page_id = NEW.id \
            AND pb.collection = 'cms_block_content_ref' \
            AND pb.item = cr.id::text \
         AND (cr.site_key IS DISTINCT FROM pb.site_key \
              OR cr.release_channel IS DISTINCT FROM pb.release_channel \
              OR cr.page_slug IS DISTINCT FROM pb.page_slug \
              OR cr.refresh_target IS DISTINCT FROM pb.refresh_target); \
         RETURN NEW; \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.recompute_cms_page_block_organization(_page_id UUID) \
       RETURNS void \
       LANGUAGE plpgsql \
       AS \$\$ \
       BEGIN \
         IF _page_id IS NULL THEN \
           RETURN; \
         END IF; \
         WITH RECURSIVE block_tree AS ( \
           SELECT pb.id, \
                  pb.page_id, \
                  pb.parent_block_id, \
                  pb.collection, \
                  pb.item, \
                  ARRAY[pb.id]::UUID[] AS block_path_ids, \
                  ARRAY[pb.id::text]::TEXT[] AS block_path_text, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[pb.id]::UUID[] ELSE ARRAY[]::UUID[] END AS template_path_ids, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[pb.id::text]::TEXT[] ELSE ARRAY[]::TEXT[] END AS template_path_text, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[COALESCE(NULLIF(BTRIM(tr.template_key), ''), 'template')]::TEXT[] ELSE ARRAY[]::TEXT[] END AS template_key_path, \
                  0::INTEGER AS depth \
           FROM directus.cms_page_blocks pb \
           LEFT JOIN directus.cms_block_template_ref tr \
             ON pb.collection = 'cms_block_template_ref' \
            AND pb.item = tr.id::text \
           WHERE pb.page_id = _page_id \
             AND (pb.parent_block_id IS NULL OR NOT EXISTS ( \
                    SELECT 1 \
                    FROM directus.cms_page_blocks parent \
                    WHERE parent.id = pb.parent_block_id \
                      AND parent.page_id = pb.page_id \
                 )) \
           UNION ALL \
           SELECT child.id, \
                  child.page_id, \
                  child.parent_block_id, \
                  child.collection, \
                  child.item, \
                  bt.block_path_ids || child.id, \
                  bt.block_path_text || child.id::text, \
                  CASE WHEN child.collection = 'cms_block_template_ref' THEN bt.template_path_ids || child.id ELSE bt.template_path_ids END, \
                  CASE WHEN child.collection = 'cms_block_template_ref' THEN bt.template_path_text || child.id::text ELSE bt.template_path_text END, \
                  CASE WHEN child.collection = 'cms_block_template_ref' THEN bt.template_key_path || COALESCE(NULLIF(BTRIM(child_tr.template_key), ''), 'template') ELSE bt.template_key_path END, \
                  bt.depth + 1 \
           FROM directus.cms_page_blocks child \
           JOIN block_tree bt \
             ON child.parent_block_id = bt.id \
            AND child.page_id = bt.page_id \
           LEFT JOIN directus.cms_block_template_ref child_tr \
             ON child.collection = 'cms_block_template_ref' \
            AND child.item = child_tr.id::text \
           WHERE NOT child.id = ANY(bt.block_path_ids) \
         ), \
         best_paths AS ( \
           SELECT DISTINCT ON (id) \
             id, \
             depth, \
             block_path_text, \
             template_path_ids, \
             template_path_text, \
             template_key_path \
           FROM block_tree \
           ORDER BY id, COALESCE(array_length(block_path_text, 1), 0) DESC, depth DESC \
         ), \
         fallback_paths AS ( \
           SELECT pb.id, \
                  0::INTEGER AS depth, \
                  ARRAY[pb.id::text]::TEXT[] AS block_path_text, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[pb.id]::UUID[] ELSE ARRAY[]::UUID[] END AS template_path_ids, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[pb.id::text]::TEXT[] ELSE ARRAY[]::TEXT[] END AS template_path_text, \
                  CASE WHEN pb.collection = 'cms_block_template_ref' THEN ARRAY[COALESCE(NULLIF(BTRIM(tr.template_key), ''), 'template')]::TEXT[] ELSE ARRAY[]::TEXT[] END AS template_key_path \
           FROM directus.cms_page_blocks pb \
           LEFT JOIN directus.cms_block_template_ref tr \
             ON pb.collection = 'cms_block_template_ref' \
            AND pb.item = tr.id::text \
           WHERE pb.page_id = _page_id \
             AND NOT EXISTS (SELECT 1 FROM best_paths bp WHERE bp.id = pb.id) \
         ), \
         final_paths AS ( \
           SELECT * FROM best_paths \
           UNION ALL \
           SELECT * FROM fallback_paths \
         ) \
         UPDATE directus.cms_page_blocks pb \
            SET tree_depth = fp.depth, \
                tree_path = '/' || array_to_string(fp.block_path_text, '/') || '/', \
                template_scope = CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN 'template' ELSE 'page' END, \
                template_group_key = CASE WHEN COALESCE(array_length(fp.template_key_path, 1), 0) > 0 THEN fp.template_key_path[1] ELSE 'page-root' END, \
                template_ancestor_block_ids = CASE WHEN COALESCE(array_length(fp.template_path_text, 1), 0) > 0 THEN '/' || array_to_string(fp.template_path_text, '/') || '/' ELSE '' END, \
                template_ancestor_template_keys = CASE WHEN COALESCE(array_length(fp.template_key_path, 1), 0) > 0 THEN array_to_string(fp.template_key_path, ' > ') ELSE '' END, \
                template_root_block_id = CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN fp.template_path_ids[1] ELSE NULL END, \
                template_nearest_block_id = CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN fp.template_path_ids[array_length(fp.template_path_ids, 1)] ELSE NULL END \
           FROM final_paths fp \
          WHERE pb.id = fp.id \
            AND pb.page_id = _page_id \
            AND (pb.tree_depth IS DISTINCT FROM fp.depth \
              OR pb.tree_path IS DISTINCT FROM '/' || array_to_string(fp.block_path_text, '/') || '/' \
              OR pb.template_scope IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN 'template' ELSE 'page' END \
              OR pb.template_group_key IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_key_path, 1), 0) > 0 THEN fp.template_key_path[1] ELSE 'page-root' END \
              OR pb.template_ancestor_block_ids IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_path_text, 1), 0) > 0 THEN '/' || array_to_string(fp.template_path_text, '/') || '/' ELSE '' END \
              OR pb.template_ancestor_template_keys IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_key_path, 1), 0) > 0 THEN array_to_string(fp.template_key_path, ' > ') ELSE '' END \
              OR pb.template_root_block_id IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN fp.template_path_ids[1] ELSE NULL END \
              OR pb.template_nearest_block_id IS DISTINCT FROM CASE WHEN COALESCE(array_length(fp.template_path_ids, 1), 0) > 0 THEN fp.template_path_ids[array_length(fp.template_path_ids, 1)] ELSE NULL END); \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.sync_cms_page_block_organization() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       BEGIN \
         IF pg_trigger_depth() > 1 THEN \
           RETURN COALESCE(NEW, OLD); \
         END IF; \
         IF TG_OP = 'DELETE' THEN \
           PERFORM directus.recompute_cms_page_block_organization(OLD.page_id); \
           RETURN OLD; \
         END IF; \
         PERFORM directus.recompute_cms_page_block_organization(NEW.page_id); \
         IF TG_OP = 'UPDATE' AND OLD.page_id IS DISTINCT FROM NEW.page_id THEN \
           PERFORM directus.recompute_cms_page_block_organization(OLD.page_id); \
         END IF; \
         RETURN NEW; \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.sync_cms_page_block_organization_from_template_ref() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         _block_item TEXT; \
         _page_id UUID; \
       BEGIN \
         IF TG_OP = 'DELETE' THEN \
           _block_item := OLD.id::text; \
         ELSE \
           _block_item := NEW.id::text; \
         END IF; \
         IF _block_item IS NULL OR _block_item = '' THEN \
           RETURN COALESCE(NEW, OLD); \
         END IF; \
         FOR _page_id IN \
           SELECT DISTINCT pb.page_id \
           FROM directus.cms_page_blocks pb \
           WHERE pb.collection = 'cms_block_template_ref' \
             AND pb.item = _block_item \
         LOOP \
           PERFORM directus.recompute_cms_page_block_organization(_page_id); \
         END LOOP; \
         RETURN COALESCE(NEW, OLD); \
       END; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.merge_jsonb_objects_deep(left_obj JSONB, right_obj JSONB) \
       RETURNS JSONB \
       LANGUAGE SQL \
       AS \$\$ \
       SELECT CASE \
         WHEN COALESCE(jsonb_typeof(left_obj), 'object') IS DISTINCT FROM 'object' THEN COALESCE(right_obj, '{}'::jsonb) \
         WHEN COALESCE(jsonb_typeof(right_obj), 'object') IS DISTINCT FROM 'object' THEN COALESCE(left_obj, '{}'::jsonb) \
         ELSE COALESCE( \
           (SELECT jsonb_object_agg( \
             COALESCE(left_pair.key, right_pair.key), \
             CASE \
               WHEN left_pair.key IS NULL THEN right_pair.value \
               WHEN right_pair.key IS NULL THEN left_pair.value \
               WHEN jsonb_typeof(left_pair.value) = 'object' AND jsonb_typeof(right_pair.value) = 'object' THEN \
                 directus.merge_jsonb_objects_deep(left_pair.value, right_pair.value) \
               ELSE right_pair.value \
             END \
           ) \
           FROM jsonb_each(COALESCE(left_obj, '{}'::jsonb)) AS left_pair \
           FULL OUTER JOIN jsonb_each(COALESCE(right_obj, '{}'::jsonb)) AS right_pair \
             ON left_pair.key = right_pair.key \
         ), \
         '{}'::jsonb \
         ) \
       END \
       ; \
       \$\$; \
       CREATE OR REPLACE FUNCTION directus.apply_cms_block_module_defaults() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         _site_key TEXT; \
         _module_key TEXT; \
         _module_provider TEXT; \
         _normalized_refresh_target TEXT; \
         _default_props JSONB; \
       BEGIN \
         _site_key := COALESCE(NULLIF(BTRIM(COALESCE(NEW.site_key, '')), ''), ''); \
         _module_key := COALESCE(NULLIF(BTRIM(COALESCE(NEW.module_key, '')), ''), ''); \
         _module_provider := COALESCE(NULLIF(LOWER(BTRIM(COALESCE(NEW.module_provider, ''))), ''), ''); \
         _normalized_refresh_target := CASE \
           WHEN LOWER(COALESCE(NEW.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(NEW.refresh_target) \
           ELSE 'both' \
         END; \
         NEW.refresh_target := _normalized_refresh_target; \
         NEW.props_json := COALESCE(NEW.props_json, '{}'::jsonb); \
         IF jsonb_typeof(NEW.props_json) IS DISTINCT FROM 'object' THEN \
           NEW.props_json := '{}'::jsonb; \
         END IF; \
         IF _module_key = '' THEN \
           NEW.module_provider := COALESCE(NULLIF(_module_provider, ''), 'radix'); \
           RETURN NEW; \
         END IF; \
         IF _module_provider = '' THEN \
           SELECT COALESCE(NULLIF(LOWER(BTRIM(COALESCE(m.provider, ''))), ''), 'radix') \
             INTO _module_provider \
           FROM directus.cms_modules m \
           WHERE m.module_key = _module_key \
             AND LOWER(COALESCE(m.status, 'published')) = 'published' \
             AND (COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = '' OR COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = _site_key) \
           ORDER BY CASE WHEN COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = _site_key THEN 0 ELSE 1 END, \
                    COALESCE(m.date_updated, m.date_created, now()) DESC \
           LIMIT 1; \
         END IF; \
         _module_provider := COALESCE(NULLIF(_module_provider, ''), 'radix'); \
         NEW.module_provider := _module_provider; \
         SELECT COALESCE(m.default_props, '{}'::jsonb) \
           INTO _default_props \
         FROM directus.cms_modules m \
         WHERE m.module_key = _module_key \
           AND LOWER(COALESCE(m.status, 'published')) = 'published' \
           AND COALESCE(NULLIF(LOWER(BTRIM(COALESCE(m.provider, ''))), ''), 'radix') = _module_provider \
           AND (COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = '' OR COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = _site_key) \
         ORDER BY CASE WHEN COALESCE(NULLIF(BTRIM(COALESCE(m.site_key, '')), ''), '') = _site_key THEN 0 ELSE 1 END, \
                  COALESCE(m.date_updated, m.date_created, now()) DESC \
         LIMIT 1; \
         _default_props := COALESCE(_default_props, '{}'::jsonb); \
         IF jsonb_typeof(_default_props) IS DISTINCT FROM 'object' THEN \
           _default_props := '{}'::jsonb; \
         END IF; \
         IF NEW.props_json = '{}'::jsonb THEN \
           NEW.props_json := _default_props; \
       ELSE \
         NEW.props_json := directus.merge_jsonb_objects_deep(_default_props, NEW.props_json); \
       END IF; \
       RETURN NEW; \
      END; \
      \$\$; \
      CREATE OR REPLACE FUNCTION directus.sync_cms_page_theme_dock_fields() \
      RETURNS trigger \
      LANGUAGE plpgsql \
      AS \$\$ \
      DECLARE \
        _dock_position TEXT; \
        _dock_direction TEXT; \
      BEGIN \
        _dock_position := CASE \
          WHEN LOWER(COALESCE(NEW.widget_dock_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(NEW.widget_dock_position) \
          WHEN LOWER(COALESCE(NEW.theme_switcher_position, '')) IN ('top-right','top-left','bottom-right','bottom-left') THEN LOWER(NEW.theme_switcher_position) \
          ELSE 'top-right' \
        END; \
        _dock_direction := CASE \
          WHEN LOWER(COALESCE(NEW.widget_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(NEW.widget_dock_direction) \
          WHEN LOWER(COALESCE(NEW.theme_switcher_dock_direction, '')) IN ('vertical','horizontal') THEN LOWER(NEW.theme_switcher_dock_direction) \
          ELSE 'vertical' \
        END; \
        NEW.widget_dock_position := _dock_position; \
        NEW.widget_dock_direction := _dock_direction; \
        NEW.theme_switcher_position := _dock_position; \
        NEW.theme_switcher_dock_direction := _dock_direction; \
        NEW.theme_selector_dock_position := CASE \
          WHEN LOWER(COALESCE(NEW.theme_selector_dock_position, '')) IN ('start','end') THEN LOWER(NEW.theme_selector_dock_position) \
          ELSE 'start' \
        END; \
        RETURN NEW; \
      END; \
      \$\$;"

    CMS_PAGES_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_pages') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
