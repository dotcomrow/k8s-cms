    echo "🧭 Configuring layout/theme/slot/module dropdown UX from registered models..."
    DIRECTUS_FIELDS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
