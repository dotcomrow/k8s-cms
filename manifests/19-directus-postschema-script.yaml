          if _df_has_col "width"; then FCOLS="${FCOLS},width"; FVALS="${FVALS},'full'"; fi
          if _df_has_col "sort"; then FCOLS="${FCOLS},sort"; FVALS="${FVALS},5"; fi
          if _df_has_col "note"; then FCOLS="${FCOLS},note"; FVALS="${FVALS},'${page_blocks_relation_note_sql}'"; fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; INSERT INTO directus_fields (${FCOLS}) VALUES (${FVALS});"
          echo "✅ Created cms_pages.blocks relation metadata"
        fi

        SETS=""
        if _df_has_col "special" && [ "${_special_sql}" != "NULL" ]; then SETS="${SETS},special=${_special_sql}"; fi
        if _df_has_col "interface"; then SETS="${SETS},interface='${_interface_value}'"; fi
