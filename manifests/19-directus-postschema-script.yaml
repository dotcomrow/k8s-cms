apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-postschema-script
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: directus
data:
  directus-postschema.sh: |
    set -eu

    POSTSCHEMA_STATE_DIR="${DIRECTUS_POSTSCHEMA_STATE_DIR:-/postschema-state}"
    POSTSCHEMA_READY_FILE="${POSTSCHEMA_STATE_DIR}/ready"
    POSTSCHEMA_DB_READY_FILE="${POSTSCHEMA_STATE_DIR}/db-ready"
    POSTSCHEMA_FAILED_FILE="${POSTSCHEMA_STATE_DIR}/failed"
    mkdir -p "${POSTSCHEMA_STATE_DIR}" || true
    rm -f "${POSTSCHEMA_READY_FILE}" "${POSTSCHEMA_DB_READY_FILE}" "${POSTSCHEMA_FAILED_FILE}"
    
    # tools
    apk add --no-cache curl jq yq >/dev/null
    
    # --- fetch DB creds from Vault ---
    VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
    VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
    KV_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus/db"
    TOPLEVEL_CREDS_URL="${VAULT_ADDR}/v1/secret/data/directus_db"
    LEAF_DB_USER_URL="${VAULT_ADDR}/v1/secret/data/directus_db_user"
    LEAF_DB_PASSWROD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_passwrod"
    LEAF_DB_PASSWORD_URL="${VAULT_ADDR}/v1/secret/data/directus_db_password"
    LEAF_DB_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_host"
    LEAF_DB_PORT_URL="${VAULT_ADDR}/v1/secret/data/directus_db_port"
    LEAF_DB_DATABASE_URL="${VAULT_ADDR}/v1/secret/data/directus_db_database"
    LEAF_DB_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_tunnel_host"
    LEAF_DB_SSH_TUNNEL_HOST_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_tunnel_host"
    LEAF_DB_SSH_PRIVATE_KEY_B64_URL="${VAULT_ADDR}/v1/secret/data/directus_db_ssh_private_key_b64"
    DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW="${DIRECTUS_DB_LEAF_SECRETS_ONLY:-true}"
    case "$(printf '%s' "${DIRECTUS_DB_LEAF_SECRETS_ONLY_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_DB_LEAF_SECRETS_ONLY="true" ;;
      *) DIRECTUS_DB_LEAF_SECRETS_ONLY="false" ;;
    esac

    DB_HOST_OVERRIDE=""
    DB_PORT_OVERRIDE=""
    DB_DATABASE_OVERRIDE=""
    DB_TUNNEL_ENABLED_RAW="false"
    DB_TUNNEL_LOCAL_PORT_OVERRIDE=""
    DB_USER=""
    DB_PASS=""

    if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
      CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-kv.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${KV_CREDS_URL}" || true)"
      if [ "${CODE}" = "200" ]; then
        DB_USER="$(jq -r '.data.data.username // .data.data.user // empty' /tmp/directus-db-kv.json)"
        DB_PASS="$(jq -r '.data.data.password // .data.data.pass // empty' /tmp/directus-db-kv.json)"
        DB_HOST_OVERRIDE="$(jq -r '.data.data.host // empty' /tmp/directus-db-kv.json)"
        DB_PORT_OVERRIDE="$(jq -r '.data.data.port // empty' /tmp/directus-db-kv.json)"
        DB_DATABASE_OVERRIDE="$(jq -r '.data.data.database // .data.data.db // empty' /tmp/directus-db-kv.json)"
        DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.ssh_tunnel_enabled // "false"' /tmp/directus-db-kv.json)"
        DB_TUNNEL_LOCAL_PORT_OVERRIDE="$(jq -r '.data.data.ssh_tunnel_local_port // empty' /tmp/directus-db-kv.json)"
        if [ -n "${DB_USER}" ] && [ -n "${DB_PASS}" ]; then
          echo "✅ Loaded Directus DB credentials from secret/data/directus/db"
        fi
      fi
    fi

    if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "${DB_USER}" = "null" ] || [ "${DB_PASS}" = "null" ]; then
      if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" != "true" ]; then
        TOPLEVEL_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-top.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${TOPLEVEL_CREDS_URL}" || true)"
        if [ "${TOPLEVEL_CODE}" = "200" ]; then
          DB_USER="$(jq -r '.data.data.directus_db_username // .data.data.directus_db_user // .data.data.username // .data.data.user // empty' /tmp/directus-db-top.json)"
          DB_PASS="$(jq -r '.data.data.directus_db_password // .data.data.password // .data.data.pass // empty' /tmp/directus-db-top.json)"
          DB_HOST_OVERRIDE="$(jq -r '.data.data.directus_db_host // .data.data.host // empty' /tmp/directus-db-top.json)"
          DB_PORT_OVERRIDE="$(jq -r '.data.data.directus_db_port // .data.data.port // empty' /tmp/directus-db-top.json)"
          DB_DATABASE_OVERRIDE="$(jq -r '.data.data.directus_db_database // .data.data.database // .data.data.db // empty' /tmp/directus-db-top.json)"
          DB_TUNNEL_ENABLED_RAW="$(jq -r '.data.data.directus_db_ssh_tunnel_enabled // .data.data.ssh_tunnel_enabled // "false"' /tmp/directus-db-top.json)"
          DB_TUNNEL_LOCAL_PORT_OVERRIDE="$(jq -r '.data.data.directus_db_ssh_tunnel_local_port // .data.data.ssh_tunnel_local_port // empty' /tmp/directus-db-top.json)"
          if [ -n "${DB_USER}" ] && [ -n "${DB_PASS}" ]; then
            echo "✅ Loaded Directus DB credentials from secret/data/directus_db"
          fi
        fi
      fi
    fi

    if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "${DB_USER}" = "null" ] || [ "${DB_PASS}" = "null" ]; then
      LEAF_DB_USER_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-user.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_USER_URL}" || true)"
      LEAF_DB_PASSWROD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-passwrod.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWROD_URL}" || true)"
      LEAF_DB_PASSWORD_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-password.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PASSWORD_URL}" || true)"
      LEAF_DB_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_HOST_URL}" || true)"
      LEAF_DB_PORT_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-port.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_PORT_URL}" || true)"
      LEAF_DB_DATABASE_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-database.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_DATABASE_URL}" || true)"
      LEAF_DB_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_TUNNEL_HOST_URL}" || true)"
      LEAF_DB_SSH_TUNNEL_HOST_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-ssh-tunnel-host.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_TUNNEL_HOST_URL}" || true)"
      LEAF_DB_SSH_PRIVATE_KEY_B64_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/directus-db-leaf-ssh-key.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" "${LEAF_DB_SSH_PRIVATE_KEY_B64_URL}" || true)"
      LEAF_DB_USER=""
      LEAF_DB_PASS=""
      LEAF_DB_HOST=""
      LEAF_DB_PORT=""
      LEAF_DB_DATABASE=""
      LEAF_DB_TUNNEL_HOST=""
      LEAF_DB_SSH_PRIVATE_KEY_B64=""
      if [ "${LEAF_DB_USER_CODE}" = "200" ]; then
        LEAF_DB_USER="$(jq -r '.data.data.value // .data.data.username // .data.data.user // .data.data.directus_db_user // .data.data.directus_db_username // empty' /tmp/directus-db-leaf-user.json)"
      fi
      if [ "${LEAF_DB_PASSWROD_CODE}" = "200" ]; then
        LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/directus-db-leaf-passwrod.json)"
      fi
      if [ -z "${LEAF_DB_PASS}" ] && [ "${LEAF_DB_PASSWORD_CODE}" = "200" ]; then
        LEAF_DB_PASS="$(jq -r '.data.data.value // .data.data.password // .data.data.pass // .data.data.directus_db_password // empty' /tmp/directus-db-leaf-password.json)"
      fi
      if [ "${LEAF_DB_HOST_CODE}" = "200" ]; then
        LEAF_DB_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_host // empty' /tmp/directus-db-leaf-host.json)"
      fi
      if [ "${LEAF_DB_PORT_CODE}" = "200" ]; then
        LEAF_DB_PORT="$(jq -r '.data.data.value // .data.data.port // .data.data.directus_db_port // empty' /tmp/directus-db-leaf-port.json)"
      fi
      if [ "${LEAF_DB_DATABASE_CODE}" = "200" ]; then
        LEAF_DB_DATABASE="$(jq -r '.data.data.value // .data.data.database // .data.data.db // .data.data.directus_db_database // empty' /tmp/directus-db-leaf-database.json)"
      fi
      if [ "${LEAF_DB_SSH_TUNNEL_HOST_CODE}" = "200" ]; then
        LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/directus-db-leaf-ssh-tunnel-host.json)"
      elif [ "${LEAF_DB_TUNNEL_HOST_CODE}" = "200" ]; then
        LEAF_DB_TUNNEL_HOST="$(jq -r '.data.data.value // .data.data.host // .data.data.directus_db_ssh_tunnel_host // .data.data.directus_db_tunnel_host // empty' /tmp/directus-db-leaf-tunnel-host.json)"
      fi
      if [ "${LEAF_DB_SSH_PRIVATE_KEY_B64_CODE}" = "200" ]; then
        LEAF_DB_SSH_PRIVATE_KEY_B64="$(jq -r '.data.data.value // .data.data.directus_db_ssh_private_key_b64 // .data.data.ssh_private_key_b64 // empty' /tmp/directus-db-leaf-ssh-key.json)"
      fi
      if [ -n "${LEAF_DB_USER}" ] && [ -n "${LEAF_DB_PASS}" ]; then
        DB_USER="${LEAF_DB_USER}"
        DB_PASS="${LEAF_DB_PASS}"
        DB_DATABASE_OVERRIDE="${LEAF_DB_DATABASE}"
        if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ]; then
          DB_HOST_OVERRIDE="${LEAF_DB_TUNNEL_HOST}"
        else
          DB_HOST_OVERRIDE="${LEAF_DB_HOST}"
        fi
        if [ -n "${LEAF_DB_PORT}" ] && [ "${LEAF_DB_PORT}" != "null" ]; then
          DB_PORT_OVERRIDE="${LEAF_DB_PORT}"
        elif [ -n "${DB_HOST_OVERRIDE}" ] && [ "${DB_HOST_OVERRIDE}" != "null" ]; then
          DB_PORT_OVERRIDE="5432"
        fi
        if [ -n "${LEAF_DB_TUNNEL_HOST}" ] && [ "${LEAF_DB_TUNNEL_HOST}" != "null" ] && [ -n "${LEAF_DB_SSH_PRIVATE_KEY_B64}" ] && [ "${LEAF_DB_SSH_PRIVATE_KEY_B64}" != "null" ]; then
          DB_TUNNEL_ENABLED_RAW="true"
          DB_TUNNEL_LOCAL_PORT_OVERRIDE="15432"
        else
          DB_TUNNEL_ENABLED_RAW="false"
        fi
        echo "✅ Loaded Directus DB credentials from secret/data/directus_db_user + secret/data/directus_db_passwrod"
      fi
    fi

    if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "${DB_USER}" = "null" ] || [ "${DB_PASS}" = "null" ]; then
      echo "❌ Failed to fetch DB creds from Vault"; exit 1
    fi
    if [ "${DIRECTUS_DB_LEAF_SECRETS_ONLY}" = "true" ] && { [ -z "${DB_HOST_OVERRIDE}" ] || [ "${DB_HOST_OVERRIDE}" = "null" ]; }; then
      echo "❌ DIRECTUS_DB_LEAF_SECRETS_ONLY=true but secret/data/directus_db_tunnel_host or secret/data/directus_db_ssh_tunnel_host (or directus_db_host) is missing."
      exit 1
    fi

    if [ -n "${DB_HOST_OVERRIDE}" ]; then
      DB_HOST="${DB_HOST_OVERRIDE}"
    fi
    if [ -n "${DB_PORT_OVERRIDE}" ]; then
      DB_PORT="${DB_PORT_OVERRIDE}"
    fi
    if [ -n "${DB_DATABASE_OVERRIDE}" ]; then
      DB_DATABASE="${DB_DATABASE_OVERRIDE}"
    fi
    case "$(printf '%s' "${DB_TUNNEL_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on)
        DB_HOST="127.0.0.1"
        if [ -n "${DB_TUNNEL_LOCAL_PORT_OVERRIDE}" ] && [ "${DB_TUNNEL_LOCAL_PORT_OVERRIDE}" != "null" ]; then
          DB_PORT="${DB_TUNNEL_LOCAL_PORT_OVERRIDE}"
        else
          DB_PORT="15432"
        fi
        echo "🔒 Using SSH tunnel DB endpoint ${DB_HOST}:${DB_PORT} for postschema."
        ;;
    esac

    export PGPASSWORD="$DB_PASS"

    # On fresh installs, let the Directus container seed/migrate system tables first.
    # Avoid mutating DB metadata before directus_migrations exists.
    _directus_bootstrap_ready() {
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT CASE WHEN to_regclass('directus.directus_migrations') IS NOT NULL THEN 1 ELSE 0 END;" 2>/dev/null || true
    }

    _bootstrap_ready="$(_directus_bootstrap_ready | tr -d '\r')"
    if [ "${_bootstrap_ready:-0}" != "1" ]; then
      DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS_RAW="${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS:-1200}"
      DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS="$(printf '%s' "${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS_RAW}" | tr -dc '0-9')"
      if [ -z "${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS:-}" ] || [ "${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS}" -lt 60 ]; then
        DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS=1200
      fi
      DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_INTERVAL_SECONDS=5

      echo "⏳ directus_migrations not found yet; signaling db-ready and waiting for Directus bootstrap..."
      touch "${POSTSCHEMA_DB_READY_FILE}" >/dev/null 2>&1 || true

      _bootstrap_waited=0
      while [ "${_bootstrap_waited}" -lt "${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS}" ]; do
        _bootstrap_ready="$(_directus_bootstrap_ready | tr -d '\r')"
        if [ "${_bootstrap_ready:-0}" = "1" ]; then
          echo "✅ Detected directus_migrations; starting postschema reconcile."
          break
        fi
        sleep "${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_INTERVAL_SECONDS}"
        _bootstrap_waited=$((_bootstrap_waited + DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_INTERVAL_SECONDS))
      done

      _bootstrap_ready="$(_directus_bootstrap_ready | tr -d '\r')"
      if [ "${_bootstrap_ready:-0}" != "1" ]; then
        echo "❌ Timed out waiting ${DIRECTUS_POSTSCHEMA_BOOTSTRAP_WAIT_SECONDS}s for Directus bootstrap (directus_migrations)."
        exit 1
      fi
    fi

    # Publish DB-ready marker whenever bootstrap is confirmed, including when
    # directus_migrations already exists before this script starts.
    touch "${POSTSCHEMA_DB_READY_FILE}" >/dev/null 2>&1 || true
    
    # 1) Ensure schema_patch_log exists (no heredocs)
    echo "🔎 Ensuring patch ledger table…"
    printf '%s\n' \
      'SET search_path TO directus, public;' \
      'CREATE TABLE IF NOT EXISTS schema_patch_log (' \
      '  patch_key TEXT PRIMARY KEY,' \
      '  applied_at TIMESTAMPTZ NOT NULL DEFAULT now()' \
      ');' \
    | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 >/dev/null
    
    # Expand legacy sentinel table into a richer patch ledger (idempotent).
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_checksum TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_status TEXT NOT NULL DEFAULT 'success'; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_group TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS details JSONB; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_error TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_started_at TIMESTAMPTZ; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_checked_at TIMESTAMPTZ NOT NULL DEFAULT now(); \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS duration_ms INTEGER; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS apply_count INTEGER NOT NULL DEFAULT 0;"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS schema_patch_runs ( \
         run_id TEXT PRIMARY KEY, \
         patch_key TEXT NOT NULL, \
         patch_checksum TEXT NULL, \
         patch_status TEXT NOT NULL, \
         patch_group TEXT NULL, \
         details JSONB NULL, \
         error TEXT NULL, \
         started_at TIMESTAMPTZ NOT NULL DEFAULT now(), \
         finished_at TIMESTAMPTZ NULL, \
         duration_ms INTEGER NULL \
       );"

    _file_sha256() {
      _path="$1"
      if [ -f "${_path}" ]; then
        sha256sum "${_path}" | awk '{print $1}'
      else
        printf 'missing'
      fi
    }

    RECON_DATA_MUTATIONS_FILE="/scripts-data-mutations/directus-postschema-data-mutations.sh"
    RECON_DATA_MUTATIONS_SHA="$(_file_sha256 "${RECON_DATA_MUTATIONS_FILE}")"

    if [ -f "${RECON_DATA_MUTATIONS_FILE}" ]; then
      . "${RECON_DATA_MUTATIONS_FILE}"
    else
      echo "⚠️ Data-mutation helper script missing at ${RECON_DATA_MUTATIONS_FILE}; data mutations will be skipped."
    fi

    _psql_yb_retry() {
      _sql="$1"
      _label="$2"
      _max="${3:-12}"
      _attempt=1
      while :; do
        if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c "SET search_path TO directus, public; ${_sql}" >/tmp/directus-sync-site-metadata.log 2>&1; then
          cat /tmp/directus-sync-site-metadata.log
          return 0
        fi
        if grep -Eiq 'current transaction is expired or aborted|YB001|serialization failure|restart read required' /tmp/directus-sync-site-metadata.log; then
          if [ "${_attempt}" -lt "${_max}" ]; then
            echo "⚠️ Transient Yugabyte conflict during ${_label} (attempt ${_attempt}/${_max}); retrying..."
            _attempt=$((_attempt + 1))
            sleep 2
            continue
          fi
        fi
        cat /tmp/directus-sync-site-metadata.log
        echo "⚠️ ${_label} failed after retries."
        return 1
      done
    }

    DIRECTUS_POSTSCHEMA_RECONCILE_VERSION="${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION:-2026-07-17.1}"
    DIRECTUS_POSTSCHEMA_FORCE_RECONCILE_RAW="${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_FORCE_RECONCILE="true" ;;
      *) DIRECTUS_POSTSCHEMA_FORCE_RECONCILE="false" ;;
    esac
    DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED_RAW="${DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED="true" ;;
      *) DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED="false" ;;
    esac
    DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED_RAW="${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED="true" ;;
      *) DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED="false" ;;
    esac
    DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED_RAW="${DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED="true" ;;
      *) DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED="false" ;;
    esac
    DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED_RAW="${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED="true" ;;
      *) DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED="false" ;;
    esac

    # Inputs that define desired reconciled state from GitOps.
    SITES_FILE="/directus-sites/sites.yaml"
    EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
    LAYOUT_TEMPLATES_FILE="/directus-layout-templates/templates.yaml"
    THEME_PACKAGES_FILE="/directus-theme-packages/themes.yaml"
    MODULES_FILE="/directus-modules/modules.yaml"
    RECON_SCRIPT_FILE="/scripts/directus-postschema.sh"
    RECON_SITES_SHA="$(_file_sha256 "${SITES_FILE}")"
    RECON_SETTINGS_SHA="$(_file_sha256 "${EXTRA_SETTINGS_FILE}")"
    if [ "${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED}" = "true" ] || [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
      RECON_LAYOUT_TEMPLATES_SHA="$(_file_sha256 "${LAYOUT_TEMPLATES_FILE}")"
      RECON_THEME_PACKAGES_SHA="$(_file_sha256 "${THEME_PACKAGES_FILE}")"
    else
      RECON_LAYOUT_TEMPLATES_SHA="disabled"
      RECON_THEME_PACKAGES_SHA="disabled"
    fi
    if [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
      RECON_MODULES_SHA="$(_file_sha256 "${MODULES_FILE}")"
    else
      RECON_MODULES_SHA="disabled"
    fi
    RECON_SCRIPT_SHA="$(_file_sha256 "${RECON_SCRIPT_FILE}")"
    RECON_PATCH_KEY="postschema_reconcile_v1"
    RECON_PATCH_GROUP="directus-postschema"
    RECON_PATCH_CHECKSUM="$(printf '%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s' \
      "${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}" "${RECON_SITES_SHA}" "${RECON_SETTINGS_SHA}" "${RECON_DATA_MUTATIONS_SHA}" "${RECON_SCRIPT_SHA}" \
      "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" "${DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED}" "${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED}" "${RECON_LAYOUT_TEMPLATES_SHA}" "${RECON_THEME_PACKAGES_SHA}" "${RECON_MODULES_SHA}" \
      | sha256sum | awk '{print $1}')"

    RECON_PATCH_KEY_SQL="$(printf '%s' "${RECON_PATCH_KEY}" | sed "s/'/''/g")"
    RECON_PATCH_GROUP_SQL="$(printf '%s' "${RECON_PATCH_GROUP}" | sed "s/'/''/g")"
    RECON_PATCH_CHECKSUM_SQL="$(printf '%s' "${RECON_PATCH_CHECKSUM}" | sed "s/'/''/g")"
    RECON_RUN_ID="$(cat /proc/sys/kernel/random/uuid)"
    RECON_RUN_ID_SQL="$(printf '%s' "${RECON_RUN_ID}" | sed "s/'/''/g")"
    RECON_PATCH_DETAILS_JSON="$(jq -nc \
      --arg version "${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}" \
      --arg sites_sha "${RECON_SITES_SHA}" \
      --arg settings_sha "${RECON_SETTINGS_SHA}" \
      --arg data_mutations_sha "${RECON_DATA_MUTATIONS_SHA}" \
      --arg rebuild_seed_enabled "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" \
      --arg settings_seed_enabled "${DIRECTUS_POSTSCHEMA_SETTINGS_SEED_ENABLED}" \
      --arg layout_theme_seed_enabled "${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED}" \
      --arg layout_templates_sha "${RECON_LAYOUT_TEMPLATES_SHA}" \
      --arg theme_packages_sha "${RECON_THEME_PACKAGES_SHA}" \
      --arg modules_sha "${RECON_MODULES_SHA}" \
      --arg script_sha "${RECON_SCRIPT_SHA}" \
      '{version:$version,inputs:{sites_yaml_sha256:$sites_sha,directus_settings_yaml_sha256:$settings_sha,data_mutations_script_sha256:$data_mutations_sha,rebuild_seed_enabled:$rebuild_seed_enabled,settings_seed_enabled:$settings_seed_enabled,layout_theme_seed_enabled:$layout_theme_seed_enabled,layout_templates_yaml_sha256:$layout_templates_sha,theme_packages_yaml_sha256:$theme_packages_sha,modules_yaml_sha256:$modules_sha,postschema_script_sha256:$script_sha}}')"
    RECON_PATCH_DETAILS_SQL="$(printf '%s' "${RECON_PATCH_DETAILS_JSON}" | sed "s/'/''/g")"

    RECON_ALREADY_CURRENT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM directus.schema_patch_log WHERE patch_key='${RECON_PATCH_KEY_SQL}' AND patch_status='success' AND COALESCE(patch_checksum,'')='${RECON_PATCH_CHECKSUM_SQL}' LIMIT 1;" || true)"
    RECON_FLOW_HEALTHY="1"
    FLOW_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_flows' LIMIT 1;" || true)"
    if [ "${FLOW_TABLE_EXISTS:-0}" = "1" ]; then
      FLOW_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT COUNT(*) FROM directus.directus_flows;" || true)"
      FLOW_COUNT="$(printf '%s' "${FLOW_COUNT:-0}" | tr -d '\r')"
      if [ -z "${FLOW_COUNT:-}" ] || [ "${FLOW_COUNT}" = "0" ]; then
        RECON_FLOW_HEALTHY="0"
        echo "⚠️ directus_flows is empty; forcing reconcile despite checksum match."
      fi
      if [ "${RECON_FLOW_HEALTHY}" = "1" ]; then
        PREWARM_FLOW_MISSING_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "WITH required(name) AS ( \
             VALUES \
               ('CMS Content Translation Prewarm - Create'), \
               ('CMS Content Translation Prewarm - Update') \
           ) \
           SELECT COUNT(*) \
           FROM required r \
           WHERE NOT EXISTS ( \
             SELECT 1 \
             FROM directus.directus_flows f \
             WHERE f.name = r.name \
               AND COALESCE(f.status, '') = 'active' \
           );" || true)"
        PREWARM_FLOW_MISSING_COUNT="$(printf '%s' "${PREWARM_FLOW_MISSING_COUNT:-0}" | tr -d '\r')"
        if [ -n "${PREWARM_FLOW_MISSING_COUNT:-}" ] && [ "${PREWARM_FLOW_MISSING_COUNT}" != "0" ]; then
          RECON_FLOW_HEALTHY="0"
          echo "⚠️ Translation prewarm flows are missing/inactive (${PREWARM_FLOW_MISSING_COUNT}); forcing reconcile despite checksum match."
        fi
      fi
    fi

    CACHE_TARGETS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='cms_cache_refresh_targets' LIMIT 1;" || true)"
    if [ "${RECON_FLOW_HEALTHY}" = "1" ] && [ "${FLOW_TABLE_EXISTS:-0}" = "1" ] && [ "${CACHE_TARGETS_TABLE_EXISTS:-0}" = "1" ]; then
      CACHE_TARGETS_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT COUNT(*) FROM directus.cms_cache_refresh_targets;" || true)"
      CACHE_TARGETS_COUNT="$(printf '%s' "${CACHE_TARGETS_COUNT:-0}" | tr -d '\r')"
      if [ -n "${CACHE_TARGETS_COUNT:-}" ] && [ "${CACHE_TARGETS_COUNT}" != "0" ]; then
        FLOW_DUP_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT COUNT(*) FROM ( \
             SELECT f.name \
             FROM directus.directus_flows f \
             WHERE f.name LIKE 'CMS Cache Refresh (%/%) - %' \
             GROUP BY f.name \
             HAVING COUNT(*) > 1 \
           ) d;" || true)"
        FLOW_DUP_COUNT="$(printf '%s' "${FLOW_DUP_COUNT:-0}" | tr -d '\r')"
        if [ -n "${FLOW_DUP_COUNT:-}" ] && [ "${FLOW_DUP_COUNT}" != "0" ]; then
          RECON_FLOW_HEALTHY="0"
          echo "⚠️ Duplicate cache-refresh flow names detected (${FLOW_DUP_COUNT}); forcing reconcile despite checksum match."
        fi

        if [ "${RECON_FLOW_HEALTHY}" = "1" ]; then
          FLOW_TARGET_MISMATCH_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "WITH targets AS ( \
               SELECT site_key, target_key, enabled, endpoint, \
                      ('CMS Cache Refresh (' || site_key || '/' || target_key || ') - Create') AS create_name, \
                      ('CMS Cache Refresh (' || site_key || '/' || target_key || ') - Update') AS update_name, \
                      ('CMS Cache Refresh (' || site_key || '/' || target_key || ') - Manual') AS manual_name \
               FROM directus.cms_cache_refresh_targets \
             ), expected AS ( \
               SELECT site_key, target_key, endpoint, \
                      CASE WHEN enabled THEN 'active' ELSE 'inactive' END AS expected_status, \
                      unnest(ARRAY[create_name, update_name, manual_name]) AS flow_name \
               FROM targets \
             ), current_flows AS ( \
               SELECT e.flow_name, e.endpoint, e.expected_status, \
                      f.id AS flow_id, \
                      COALESCE(f.status, '') AS flow_status, \
                      COALESCE(( \
                        SELECT o.options::jsonb->>'url' \
                        FROM directus.directus_operations o \
                        WHERE o.flow = f.id \
                          AND o.key = 'refresh_cache_attempt_1' \
                        LIMIT 1 \
                      ), '') AS op_url \
               FROM expected e \
               LEFT JOIN LATERAL ( \
                 SELECT id, status \
                 FROM directus.directus_flows \
                 WHERE name = e.flow_name \
                 ORDER BY \
                   CASE WHEN COALESCE(status, '') = 'active' THEN 0 ELSE 1 END, \
                   date_created DESC NULLS LAST, \
                   id DESC \
                 LIMIT 1 \
               ) f ON true \
             ) \
             SELECT COUNT(*) \
             FROM current_flows \
             WHERE flow_id IS NULL \
                OR flow_status IS DISTINCT FROM expected_status \
                OR (expected_status = 'active' AND op_url IS DISTINCT FROM endpoint);" || true)"
          FLOW_TARGET_MISMATCH_COUNT="$(printf '%s' "${FLOW_TARGET_MISMATCH_COUNT:-0}" | tr -d '\r')"
          if [ -n "${FLOW_TARGET_MISMATCH_COUNT:-}" ] && [ "${FLOW_TARGET_MISMATCH_COUNT}" != "0" ]; then
            RECON_FLOW_HEALTHY="0"
            echo "⚠️ Cache-refresh flow state differs from cms_cache_refresh_targets (${FLOW_TARGET_MISMATCH_COUNT} mismatches); forcing reconcile despite checksum match."
          fi
        fi
      fi
    fi

    RECON_SCHEMA_HEALTHY="1"
    MISSING_REQUIRED_TABLES="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "WITH required(table_name) AS ( \
         VALUES \
           ('cms_pages'), \
           ('cms_page_blocks'), \
           ('cms_block_rich_text'), \
           ('cms_block_hero'), \
           ('cms_block_module'), \
           ('cms_block_template_ref'), \
           ('cms_content_templates'), \
           ('cms_content_items'), \
           ('cms_content_item_translations'), \
           ('cms_content_translation_jobs'), \
           ('cms_translation_languages'), \
           ('cms_template_functions'), \
           ('cms_block_content_ref'), \
           ('cms_layout_templates'), \
           ('cms_layout_template_slots'), \
           ('cms_theme_packages'), \
           ('cms_modules'), \
           ('cms_cache_refresh_targets') \
       ) \
       SELECT COALESCE(string_agg(required.table_name, ',' ORDER BY required.table_name), '') \
       FROM required \
       WHERE to_regclass('directus.' || required.table_name) IS NULL;" || true)"
    MISSING_REQUIRED_TABLES="$(printf '%s' "${MISSING_REQUIRED_TABLES:-}" | tr -d '\r')"
    if [ -n "${MISSING_REQUIRED_TABLES:-}" ]; then
      RECON_SCHEMA_HEALTHY="0"
      echo "⚠️ Required CMS tables missing (${MISSING_REQUIRED_TABLES}); forcing reconcile despite checksum match."
    fi

    if [ "${RECON_SCHEMA_HEALTHY}" = "1" ]; then
      MISSING_REQUIRED_COLUMNS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "WITH required(table_name, column_name) AS ( \
           VALUES \
             ('cms_pages','slug'), \
             ('cms_pages','status'), \
             ('cms_pages','site_key'), \
             ('cms_pages','release_channel'), \
             ('cms_pages','layout_template_key'), \
             ('cms_pages','layout_chrome'), \
             ('cms_pages','theme_package_key'), \
             ('cms_page_blocks','page_id'), \
             ('cms_page_blocks','collection'), \
             ('cms_page_blocks','item'), \
             ('cms_page_blocks','slot'), \
             ('cms_page_blocks','parent_block_id'), \
             ('cms_page_blocks','site_key'), \
             ('cms_page_blocks','release_channel'), \
             ('cms_page_blocks','page_slug'), \
             ('cms_block_rich_text','status'), \
             ('cms_block_rich_text','body'), \
             ('cms_block_hero','status'), \
             ('cms_block_hero','headline'), \
             ('cms_block_module','status'), \
             ('cms_block_module','module_provider'), \
             ('cms_block_module','module_key'), \
             ('cms_block_template_ref','status'), \
             ('cms_block_template_ref','template_key'), \
             ('cms_content_templates','template_key'), \
             ('cms_content_templates','html_template'), \
             ('cms_content_items','default_language_code'), \
             ('cms_content_items','content_json'), \
             ('cms_content_items','translation_enabled'), \
             ('cms_content_items','translation_excluded_languages'), \
             ('cms_content_items','translation_prewarm_languages'), \
             ('cms_content_items','translation_rules'), \
             ('cms_content_item_translations','content_item_id'), \
             ('cms_content_item_translations','language_code'), \
             ('cms_content_item_translations','content_json'), \
             ('cms_content_translation_jobs','content_item_id'), \
             ('cms_content_translation_jobs','language_code'), \
             ('cms_content_translation_jobs','source_content_version'), \
             ('cms_content_translation_jobs','model'), \
             ('cms_content_translation_jobs','status'), \
             ('cms_translation_languages','language_code'), \
             ('cms_translation_languages','model'), \
             ('cms_translation_languages','status'), \
             ('cms_template_functions','token_key'), \
             ('cms_template_functions','handler_key'), \
             ('cms_template_functions','function_kind'), \
             ('cms_block_content_ref','status'), \
             ('cms_block_content_ref','template_key'), \
             ('cms_block_content_ref','content_item_id'), \
             ('cms_layout_templates','template_key'), \
             ('cms_layout_templates','html'), \
             ('cms_layout_template_slots','template_key'), \
             ('cms_layout_template_slots','slot_key'), \
             ('cms_theme_packages','theme_key'), \
             ('cms_theme_packages','css_light'), \
             ('cms_modules','module_key'), \
             ('cms_cache_refresh_targets','site_key'), \
             ('cms_cache_refresh_targets','target_key') \
         ) \
         SELECT COALESCE(string_agg(required.table_name || '.' || required.column_name, ',' ORDER BY required.table_name, required.column_name), '') \
         FROM required \
         LEFT JOIN information_schema.columns c \
           ON c.table_schema='directus' \
          AND c.table_name=required.table_name \
          AND c.column_name=required.column_name \
         WHERE c.column_name IS NULL;" || true)"
      MISSING_REQUIRED_COLUMNS="$(printf '%s' "${MISSING_REQUIRED_COLUMNS:-}" | tr -d '\r')"
      if [ -n "${MISSING_REQUIRED_COLUMNS:-}" ]; then
        RECON_SCHEMA_HEALTHY="0"
        echo "⚠️ Required CMS columns missing (${MISSING_REQUIRED_COLUMNS}); forcing reconcile despite checksum match."
      fi
    fi

    RECON_TOKEN_HEALTHY="1"
    if [ "${RECON_SCHEMA_HEALTHY}" = "1" ]; then
      USERS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_users' LIMIT 1;" || true)"
      USER_TOKEN_COL_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT 1 FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' AND column_name='token' LIMIT 1;" || true)"
      if [ "${USERS_TABLE_EXISTS:-0}" = "1" ] && [ "${USER_TOKEN_COL_EXISTS:-0}" = "1" ]; then
        DEFAULT_GRAVITEE_TOKEN_VAULT_PATH="${DIRECTUS_DEFAULT_GRAVITEE_TOKEN_VAULT_PATH:-secret/data/directus/gravitee}"
        DEFAULT_TOKEN_READ_CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/recon-default-gravitee-token.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${DEFAULT_GRAVITEE_TOKEN_VAULT_PATH}" || true)"
        DEFAULT_GRAVITEE_TOKEN=""
        if [ "${DEFAULT_TOKEN_READ_CODE}" = "200" ]; then
          DEFAULT_GRAVITEE_TOKEN="$(jq -r '.data.data.token // empty' /tmp/recon-default-gravitee-token.json 2>/dev/null || true)"
        fi
        if [ -z "${DEFAULT_GRAVITEE_TOKEN:-}" ]; then
          RECON_TOKEN_HEALTHY="0"
          echo "⚠️ Default Gravitee token is missing/unreadable in Vault (${DEFAULT_GRAVITEE_TOKEN_VAULT_PATH}, HTTP ${DEFAULT_TOKEN_READ_CODE}); forcing reconcile despite checksum match."
        else
          DEFAULT_GRAVITEE_TOKEN_SQL="$(printf '%s' "${DEFAULT_GRAVITEE_TOKEN}" | sed "s/'/''/g")"
          DEFAULT_TOKEN_ACTIVE_USER_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT COUNT(*) FROM directus.directus_users WHERE token='${DEFAULT_GRAVITEE_TOKEN_SQL}' AND COALESCE(status,'')='active';" || true)"
          DEFAULT_TOKEN_ACTIVE_USER_COUNT="$(printf '%s' "${DEFAULT_TOKEN_ACTIVE_USER_COUNT:-0}" | tr -d '\r')"
          if [ -z "${DEFAULT_TOKEN_ACTIVE_USER_COUNT:-}" ] || [ "${DEFAULT_TOKEN_ACTIVE_USER_COUNT}" = "0" ]; then
            RECON_TOKEN_HEALTHY="0"
            echo "⚠️ Default Gravitee token is not bound to any active Directus service user; forcing reconcile despite checksum match."
          fi
        fi
      fi
    fi

    if [ "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE}" != "true" ] && [ "${RECON_ALREADY_CURRENT}" = "1" ] && [ "${RECON_FLOW_HEALTHY}" = "1" ] && [ "${RECON_SCHEMA_HEALTHY}" = "1" ] && [ "${RECON_TOKEN_HEALTHY}" = "1" ]; then
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; UPDATE schema_patch_log SET last_checked_at=now() WHERE patch_key='${RECON_PATCH_KEY_SQL}';" >/dev/null
      echo "✅ Postschema reconcile already up to date (version=${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}, checksum=${RECON_PATCH_CHECKSUM})."
      touch "${POSTSCHEMA_DB_READY_FILE}"
      touch "${POSTSCHEMA_READY_FILE}"
      echo "✅ Schema patch applied. Going idle."
      exec tail -f /dev/null
    fi
    if [ "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE}" = "true" ]; then
      echo "⚠️ Forced reconcile requested (DIRECTUS_POSTSCHEMA_FORCE_RECONCILE=true); skipping checksum short-circuit."
    fi

    RECON_STARTED_EPOCH="$(date +%s)"
    RECON_DONE="0"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       INSERT INTO schema_patch_log (patch_key, patch_checksum, patch_status, patch_group, details, last_error, last_started_at, last_checked_at, apply_count) \
       VALUES ('${RECON_PATCH_KEY_SQL}', '${RECON_PATCH_CHECKSUM_SQL}', 'running', '${RECON_PATCH_GROUP_SQL}', '${RECON_PATCH_DETAILS_SQL}'::jsonb, NULL, now(), now(), 1) \
       ON CONFLICT (patch_key) DO UPDATE SET \
         patch_checksum=EXCLUDED.patch_checksum, \
         patch_status='running', \
         patch_group=EXCLUDED.patch_group, \
         details=EXCLUDED.details, \
         last_error=NULL, \
         last_started_at=now(), \
         last_checked_at=now(), \
         apply_count=COALESCE(schema_patch_log.apply_count,0)+1;"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       INSERT INTO schema_patch_runs (run_id, patch_key, patch_checksum, patch_status, patch_group, details, started_at) \
       VALUES ('${RECON_RUN_ID_SQL}', '${RECON_PATCH_KEY_SQL}', '${RECON_PATCH_CHECKSUM_SQL}', 'running', '${RECON_PATCH_GROUP_SQL}', '${RECON_PATCH_DETAILS_SQL}'::jsonb, now());"

    _reconcile_mark_failed() {
      _rc="$1"
      if [ "${RECON_DONE:-0}" = "1" ]; then
        return 0
      fi
      _duration_ms=$(( ($(date +%s) - RECON_STARTED_EPOCH) * 1000 ))
      _err="postschema exited with code ${_rc}"
      _err_sql="$(printf '%s' "${_err}" | sed "s/'/''/g")"
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; \
         UPDATE schema_patch_log \
            SET patch_status='failed', \
                last_error='${_err_sql}', \
                duration_ms=${_duration_ms}, \
                last_checked_at=now() \
          WHERE patch_key='${RECON_PATCH_KEY_SQL}';" >/dev/null 2>&1 || true
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; \
         UPDATE schema_patch_runs \
            SET patch_status='failed', \
                error='${_err_sql}', \
                finished_at=now(), \
                duration_ms=${_duration_ms} \
          WHERE run_id='${RECON_RUN_ID_SQL}';" >/dev/null 2>&1 || true
      rm -f "${POSTSCHEMA_READY_FILE}" "${POSTSCHEMA_DB_READY_FILE}" >/dev/null 2>&1 || true
      touch "${POSTSCHEMA_FAILED_FILE}" >/dev/null 2>&1 || true
      return 0
    }
    trap '_reconcile_mark_failed "$?"' EXIT

    # On fresh/empty databases, Directus core tables do not exist until
    # the main container runs `database install`. Unblock that startup path
    # by publishing db-ready early, then wait here for core tables.
    _directus_core_tables_ready() {
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT CASE WHEN to_regclass('directus.directus_users') IS NOT NULL THEN 1 ELSE 0 END;" 2>/dev/null || true
    }

    _core_ready="$(_directus_core_tables_ready | tr -d '\r')"
    if [ "${_core_ready:-0}" != "1" ]; then
      DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS_RAW="${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS:-900}"
      DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS="$(printf '%s' "${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS_RAW}" | tr -dc '0-9')"
      if [ -z "${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS:-}" ] || [ "${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS}" -lt 30 ]; then
        DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS=900
      fi
      DIRECTUS_POSTSCHEMA_CORE_WAIT_INTERVAL_SECONDS=5

      echo "⏳ directus_users not found yet; signaling db-ready and waiting for Directus bootstrap tables..."
      touch "${POSTSCHEMA_DB_READY_FILE}" >/dev/null 2>&1 || true

      _waited=0
      while [ "${_waited}" -lt "${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS}" ]; do
        _core_ready="$(_directus_core_tables_ready | tr -d '\r')"
        if [ "${_core_ready:-0}" = "1" ]; then
          echo "✅ Detected Directus core tables; continuing postschema reconcile."
          break
        fi
        sleep "${DIRECTUS_POSTSCHEMA_CORE_WAIT_INTERVAL_SECONDS}"
        _waited=$((_waited + DIRECTUS_POSTSCHEMA_CORE_WAIT_INTERVAL_SECONDS))
      done

      _core_ready="$(_directus_core_tables_ready | tr -d '\r')"
      if [ "${_core_ready:-0}" != "1" ]; then
        echo "❌ Timed out waiting ${DIRECTUS_POSTSCHEMA_CORE_WAIT_SECONDS}s for Directus core tables."
        exit 1
      fi
    fi

    # 2) Check sentinel; skip schema patch if already applied
    PATCH_KEY="github_profile_cols_v1"
    SKIP_PATCH="0"
    # IMPORTANT: do not prepend `SET search_path ...;` in `-Atc` queries.
    # psql prints `SET` to stdout, which pollutes captured values.
    ALREADY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM directus.schema_patch_log WHERE patch_key='${PATCH_KEY}' LIMIT 1;" || true)"
    
    if [ "$ALREADY" = "1" ]; then
      echo "✅ Patch already applied; skipping schema changes."
      SKIP_PATCH="1"
    fi
    
    if [ "$SKIP_PATCH" != "1" ]; then
      # 3) Apply idempotent ALTERs
      echo "🔧 Applying user profile columns…"
      printf '%s\n' \
        'SET search_path TO directus, public;' \
        'ALTER TABLE directus_users' \
        '  ADD COLUMN IF NOT EXISTS github_login    TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_url      TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_company  TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_bio      TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_metadata JSONB;' \
      | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1
    
      # 4) Record sentinel
