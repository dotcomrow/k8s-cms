          "SELECT 1 FROM directus.directus_fields WHERE collection='${_collection_sql}' AND field='slot' LIMIT 1;" || true)"
        _exists="$(printf '%s' "$_exists" | tr -d '\r')"
    
        _options_sql="$(_df_json_sql "${DF_OPTIONS_TYPE:-}" "${slot_options_json}")"
        _display_options_sql="$(_df_json_sql "${DF_DISPLAY_OPTIONS_TYPE:-}" "${slot_display_options_json}")"
    
        if [ "${_exists}" = "1" ]; then
          SETS=""
          if _df_has_col "interface"; then SETS="${SETS},interface='select-dropdown'"; fi
          if _df_has_col "options"; then SETS="${SETS},options=${_options_sql}"; fi
          if _df_has_col "display"; then SETS="${SETS},display='labels'"; fi
          if _df_has_col "display_options"; then SETS="${SETS},display_options=${_display_options_sql}"; fi
          if _df_has_col "required"; then SETS="${SETS},required=true"; fi
          if _df_has_col "readonly"; then SETS="${SETS},readonly=false"; fi
          if _df_has_col "hidden"; then SETS="${SETS},hidden=false"; fi
          if _df_has_col "width"; then SETS="${SETS},width='half'"; fi
          if _df_has_col "sort"; then SETS="${SETS},sort=2"; fi
          if _df_has_col "note"; then SETS="${SETS},note='${slot_note_sql}'"; fi
          if [ -n "${SETS:-}" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_fields SET ${SETS#,} WHERE collection='${_collection_sql}' AND field='slot';"
            echo "✅ Updated slot field UX on ${_collection}"
          fi
          return 0
        fi
    
        FCOLS="collection,field"
        FVALS="'${_collection_sql}','${slot_field_name_sql}'"
        if _df_has_col "interface"; then FCOLS="${FCOLS},interface"; FVALS="${FVALS},'select-dropdown'"; fi
        if _df_has_col "options"; then FCOLS="${FCOLS},options"; FVALS="${FVALS},${_options_sql}"; fi
        if _df_has_col "display"; then FCOLS="${FCOLS},display"; FVALS="${FVALS},'labels'"; fi
        if _df_has_col "display_options"; then FCOLS="${FCOLS},display_options"; FVALS="${FVALS},${_display_options_sql}"; fi
        if _df_has_col "required"; then FCOLS="${FCOLS},required"; FVALS="${FVALS},true"; fi
        if _df_has_col "readonly"; then FCOLS="${FCOLS},readonly"; FVALS="${FVALS},false"; fi
        if _df_has_col "hidden"; then FCOLS="${FCOLS},hidden"; FVALS="${FVALS},false"; fi
        if _df_has_col "width"; then FCOLS="${FCOLS},width"; FVALS="${FVALS},'half'"; fi
        if _df_has_col "sort"; then FCOLS="${FCOLS},sort"; FVALS="${FVALS},2"; fi
        if _df_has_col "note"; then FCOLS="${FCOLS},note"; FVALS="${FVALS},'${slot_note_sql}'"; fi
    
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; INSERT INTO directus_fields (${FCOLS}) VALUES (${FVALS});"
        echo "✅ Created slot field UX on ${_collection}"
      }
    
      _upsert_page_block_slot_field_meta
    else
      echo "  └─ directus_fields metadata table not found; skipping refresh_target UX config"
    fi

    echo "🧭 Ensuring cms_pages list view shows site_key..."
    PRESETS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_presets' LIMIT 1;" || true)"
    PRESETS_TABLE_EXISTS="$(printf '%s' "$PRESETS_TABLE_EXISTS" | tr -d '\r')"
    if [ "${PRESETS_TABLE_EXISTS}" = "1" ]; then
      DP_LAYOUT_QUERY_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_presets' AND column_name='layout_query' LIMIT 1;" || true)"
      DP_LAYOUT_OPTIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_presets' AND column_name='layout_options' LIMIT 1;" || true)"

      _dp_json_sql() {
        _t="$1"
        _json="$2"
        if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
          printf "NULL"
          return
        fi
        _json_sql="$(printf '%s' "$_json" | sed "s/'/''/g")"
        case "$_t" in
          jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
          json) printf "'%s'::json" "$_json_sql" ;;
          text|character\ varying) printf "'%s'" "$_json_sql" ;;
          *) printf "NULL" ;;
        esac
      }

      cms_pages_tabular_fields_json='["site_key","slug","title","status","layout_template_key","theme_package_key","refresh_target","date_updated"]'
      cms_pages_layout_query_json="$(jq -nc --argjson fields "${cms_pages_tabular_fields_json}" \
        '{tabular:{fields:$fields,sort:["-date_updated"]}}')"
      cms_pages_layout_options_json="$(jq -nc '{}')"
      cms_pages_layout_query_sql="$(_dp_json_sql "${DP_LAYOUT_QUERY_TYPE:-}" "${cms_pages_layout_query_json}")"
      cms_pages_layout_options_sql="$(_dp_json_sql "${DP_LAYOUT_OPTIONS_TYPE:-}" "${cms_pages_layout_options_json}")"

      cms_pages_preset_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT id FROM directus.directus_presets WHERE collection='cms_pages' AND COALESCE(bookmark,'')='all' AND role IS NULL AND \"user\" IS NULL ORDER BY id DESC LIMIT 1;" || true)"
      cms_pages_preset_id="$(printf '%s' "${cms_pages_preset_id}" | tr -d '\r')"

      if [ -n "${cms_pages_preset_id:-}" ] && [ "${cms_pages_preset_id}" != "null" ]; then
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; \
           UPDATE directus_presets \
              SET layout='tabular', \
                  layout_query=${cms_pages_layout_query_sql}, \
                  layout_options=${cms_pages_layout_options_sql}, \
                  icon='view_column' \
            WHERE id=${cms_pages_preset_id};"
        echo "✅ Updated cms_pages global tabular preset to include site_key"
      else
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; \
           INSERT INTO directus_presets (bookmark, collection, layout, layout_query, layout_options, icon) \
           VALUES ('all', 'cms_pages', 'tabular', ${cms_pages_layout_query_sql}, ${cms_pages_layout_options_sql}, 'view_column');"
        echo "✅ Created cms_pages global tabular preset with site_key column"
      fi
    else
      echo "  └─ directus_presets table not found; skipping cms_pages list preset"
    fi
    
    # 5b) Ensure layout template collection exists and seed templates from GitOps config.
    echo "🧱 Ensuring cms_layout_templates exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_layout_templates ( \
         id UUID PRIMARY KEY, \
         template_key TEXT NOT NULL, \
         name TEXT NOT NULL, \
         description TEXT NULL, \
         status TEXT NOT NULL DEFAULT 'draft', \
         site_key TEXT NULL, \
         html TEXT NOT NULL, \
         css TEXT NULL, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS template_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS name TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS description TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS status TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS html TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS css TEXT; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_templates ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_templates ALTER COLUMN status SET DEFAULT 'draft'; \
       ALTER TABLE IF EXISTS cms_layout_templates ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_constraint \
           WHERE conname IN ('cms_layout_templates_template_key_unique', 'demo_layout_templates_template_key_unique') \
             AND conrelid = 'directus.cms_layout_templates'::regclass \
         ) THEN \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='cms_layout_templates_template_key_unique' AND conrelid='directus.cms_layout_templates'::regclass) THEN \
             ALTER TABLE cms_layout_templates DROP CONSTRAINT cms_layout_templates_template_key_unique; \
           END IF; \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='demo_layout_templates_template_key_unique' AND conrelid='directus.cms_layout_templates'::regclass) THEN \
             ALTER TABLE cms_layout_templates DROP CONSTRAINT demo_layout_templates_template_key_unique; \
           END IF; \
         END IF; \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'demo_layout_templates_scope_template_unique' \
         ) THEN \
           DROP INDEX directus.demo_layout_templates_scope_template_unique; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_layout_templates_scope_template_unique' \
         ) THEN \
           IF NOT EXISTS ( \
             SELECT 1 \
             FROM ( \
               SELECT COALESCE(site_key, '') AS site_scope, template_key, COUNT(*) AS c \
               FROM cms_layout_templates \
               GROUP BY COALESCE(site_key, ''), template_key \
               HAVING COUNT(*) > 1 \
             ) dups \
           ) THEN \
             CREATE UNIQUE INDEX cms_layout_templates_scope_template_unique \
             ON cms_layout_templates (COALESCE(site_key, ''), template_key); \
           ELSE \
             RAISE NOTICE 'Skipping cms_layout_templates_scope_template_unique due to duplicate (site_key,template_key) rows'; \
           END IF; \
         END IF; \
       END \
       \$\$;"
    
    echo "🧱 Ensuring cms_layout_template_slots exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_layout_template_slots ( \
         id UUID PRIMARY KEY, \
         template_key TEXT NOT NULL, \
         site_key TEXT NULL, \
         slot_key TEXT NOT NULL, \
         slot_label TEXT NULL, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS template_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS slot_key TEXT; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS slot_label TEXT; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_layout_template_slots ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'demo_layout_template_slots_scope_slot_unique' \
         ) THEN \
           DROP INDEX directus.demo_layout_template_slots_scope_slot_unique; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_layout_template_slots_scope_slot_unique' \
         ) THEN \
           IF NOT EXISTS ( \
             SELECT 1 \
             FROM ( \
               SELECT COALESCE(site_key, '') AS site_scope, template_key, slot_key, COUNT(*) AS c \
               FROM cms_layout_template_slots \
               GROUP BY COALESCE(site_key, ''), template_key, slot_key \
               HAVING COUNT(*) > 1 \
             ) dups \
           ) THEN \
             CREATE UNIQUE INDEX cms_layout_template_slots_scope_slot_unique \
             ON cms_layout_template_slots (COALESCE(site_key, ''), template_key, slot_key); \
           ELSE \
             RAISE NOTICE 'Skipping cms_layout_template_slots_scope_slot_unique due to duplicate rows'; \
           END IF; \
         END IF; \
       END \
       \$\$;"
    
    LAYOUTS_FILE="/directus-layout-templates/templates.yaml"
    if [ -f "$LAYOUTS_FILE" ]; then
      LAYOUTS_JSON="$(yq -o=json '.' "$LAYOUTS_FILE" 2>/dev/null || true)"
      if printf '%s' "$LAYOUTS_JSON" | jq -e '.templates | type=="array" and length>0' >/dev/null 2>&1; then
        printf '%s' "$LAYOUTS_JSON" | jq -c '.templates[]' | while IFS= read -r tpl; do
          tpl_key="$(printf '%s' "$tpl" | jq -r '.template_key // empty')"
          tpl_name="$(printf '%s' "$tpl" | jq -r '.name // empty')"
          tpl_status="$(printf '%s' "$tpl" | jq -r '.status // "published"')"
          tpl_desc="$(printf '%s' "$tpl" | jq -r '.description // empty')"
          tpl_site="$(printf '%s' "$tpl" | jq -r 'if .site_key == null then "" else (.site_key | tostring) end')"
          tpl_html="$(printf '%s' "$tpl" | jq -r '.html // empty')"
          tpl_css="$(printf '%s' "$tpl" | jq -r '.css // empty')"
          tpl_html_file="$(printf '%s' "$tpl" | jq -r '.html_file // empty')"
          tpl_css_file="$(printf '%s' "$tpl" | jq -r '.css_file // empty')"
    
          if [ -z "${tpl_html:-}" ] && [ -n "${tpl_html_file:-}" ]; then
            case "$tpl_html_file" in
              /*|*..*)
                echo "⚠️  skipping template '${tpl_key}': invalid html_file path '${tpl_html_file}'"
                continue
                ;;
            esac
            tpl_html_path="/directus-layout-templates/${tpl_html_file}"
            if [ ! -f "$tpl_html_path" ]; then
              echo "⚠️  skipping template '${tpl_key}': html file not found at ${tpl_html_path}"
              continue
            fi
            tpl_html="$(cat "$tpl_html_path")"
          fi
    
          if [ -z "${tpl_css:-}" ] && [ -n "${tpl_css_file:-}" ]; then
            case "$tpl_css_file" in
              /*|*..*)
                echo "⚠️  template '${tpl_key}' has invalid css_file path '${tpl_css_file}'; ignoring css"
                tpl_css=""
                ;;
              *)
                tpl_css_path="/directus-layout-templates/${tpl_css_file}"
                if [ -f "$tpl_css_path" ]; then
                  tpl_css="$(cat "$tpl_css_path")"
                else
                  echo "⚠️  template '${tpl_key}' css file not found at ${tpl_css_path}; continuing without css"
                  tpl_css=""
                fi
                ;;
            esac
          fi
    
          if [ -z "${tpl_key:-}" ] || [ -z "${tpl_name:-}" ] || [ -z "${tpl_html:-}" ]; then
            echo "⚠️  skipping invalid layout template entry (template_key/name/html required)"
            continue
          fi
    
          tpl_key_sql="$(printf '%s' "$tpl_key" | sed "s/'/''/g")"
          tpl_name_sql="$(printf '%s' "$tpl_name" | sed "s/'/''/g")"
          tpl_status_sql="$(printf '%s' "$tpl_status" | sed "s/'/''/g")"
          tpl_html_sql="$(printf '%s' "$tpl_html" | sed "s/'/''/g")"
    
          tpl_desc_sql="NULL"
          if [ -n "${tpl_desc:-}" ]; then
            tpl_desc_esc="$(printf '%s' "$tpl_desc" | sed "s/'/''/g")"
            tpl_desc_sql="'${tpl_desc_esc}'"
          fi
    
          tpl_site_sql="NULL"
          tpl_scope_condition="(site_key IS NULL OR site_key='')"
          if [ -n "${tpl_site:-}" ]; then
            tpl_site_esc="$(printf '%s' "$tpl_site" | sed "s/'/''/g")"
            tpl_site_sql="'${tpl_site_esc}'"
            tpl_scope_condition="site_key='${tpl_site_esc}'"
          fi
    
          tpl_css_sql="NULL"
          if [ -n "${tpl_css:-}" ]; then
            tpl_css_esc="$(printf '%s' "$tpl_css" | sed "s/'/''/g")"
            tpl_css_sql="'${tpl_css_esc}'"
          fi
    
          existing_tpl_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.cms_layout_templates WHERE template_key='${tpl_key_sql}' AND ${tpl_scope_condition} LIMIT 1;" || true)"
          existing_tpl_id="$(printf '%s' "$existing_tpl_id" | tr -d '\r')"
    
          if [ -n "${existing_tpl_id:-}" ] && [ "${existing_tpl_id}" != "null" ]; then
            existing_tpl_id_sql="$(printf '%s' "$existing_tpl_id" | sed "s/'/''/g")"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               UPDATE cms_layout_templates \
               SET name='${tpl_name_sql}', \
                   description=${tpl_desc_sql}, \
                   status='${tpl_status_sql}', \
                   site_key=${tpl_site_sql}, \
                   html='${tpl_html_sql}', \
                   css=${tpl_css_sql}, \
                   date_updated=now() \
               WHERE id='${existing_tpl_id_sql}';"
            echo "✅ Reconciled layout template '${tpl_key}'"
          else
            new_tpl_id="$(cat /proc/sys/kernel/random/uuid)"
            new_tpl_id_sql="$(printf '%s' "$new_tpl_id" | sed "s/'/''/g")"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               INSERT INTO cms_layout_templates (id, template_key, name, description, status, site_key, html, css, date_created, date_updated) \
               VALUES ('${new_tpl_id_sql}','${tpl_key_sql}','${tpl_name_sql}',${tpl_desc_sql},'${tpl_status_sql}',${tpl_site_sql},'${tpl_html_sql}',${tpl_css_sql},now(),now());"
            echo "✅ Seeded layout template '${tpl_key}'"
          fi
    
          parsed_slot_keys="$(
            {
              printf '%s\n' "$tpl_html" | grep -Eo '\{\{[[:space:]]*slot:[A-Za-z0-9_-]+[[:space:]]*\}\}' | sed -E 's/\{\{[[:space:]]*slot:([A-Za-z0-9_-]+)[[:space:]]*\}\}/\1/' || true
              printf '%s\n' "$tpl_html" | grep -Eo 'data-slot="[A-Za-z0-9_-]+"' | sed -E 's/data-slot="([A-Za-z0-9_-]+)"/\1/' || true
            } | tr '[:upper:]' '[:lower:]' | awk 'NF { if (!seen[$0]++) print $0 }'
          )"
          if [ -z "${parsed_slot_keys:-}" ]; then
            parsed_slot_keys="main"
          fi
    
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; DELETE FROM cms_layout_template_slots WHERE template_key='${tpl_key_sql}' AND ${tpl_scope_condition};"
    
          printf '%s\n' "${parsed_slot_keys}" | while IFS= read -r slot_key; do
            [ -z "${slot_key:-}" ] && continue
            slot_key_sql="$(printf '%s' "$slot_key" | sed "s/'/''/g")"
            slot_label="$(printf '%s' "$slot_key" | tr '_' ' ' | tr '-' ' ')"
            slot_label_sql="$(printf '%s' "$slot_label" | sed "s/'/''/g")"
            slot_id="$(cat /proc/sys/kernel/random/uuid)"
            slot_id_sql="$(printf '%s' "$slot_id" | sed "s/'/''/g")"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               INSERT INTO cms_layout_template_slots (id, template_key, site_key, slot_key, slot_label, date_created, date_updated) \
               VALUES ('${slot_id_sql}', '${tpl_key_sql}', ${tpl_site_sql}, '${slot_key_sql}', '${slot_label_sql}', now(), now());"
          done
    
          parsed_slot_list="$(printf '%s' "${parsed_slot_keys}" | tr '\n' ',' | sed 's/,$//')"
          echo "✅ Registered slots for layout template '${tpl_key}': ${parsed_slot_list}"
        done
      else
        echo "  └─ no templates configured in ${LAYOUTS_FILE}; skipping"
      fi
    else
      echo "  └─ ${LAYOUTS_FILE} not found; skipping"
    fi

    # 5b.1) Ensure theme package collection exists and seed CSS bundles from GitOps config.
    echo "🧱 Ensuring cms_theme_packages exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_theme_packages ( \
         id UUID PRIMARY KEY, \
         theme_key TEXT NOT NULL, \
         name TEXT NOT NULL, \
         description TEXT NULL, \
         status TEXT NOT NULL DEFAULT 'draft', \
         site_key TEXT NULL, \
         refresh_target TEXT NOT NULL DEFAULT 'both', \
         css TEXT NOT NULL, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS theme_key TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS name TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS description TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS status TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS css TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN status SET DEFAULT 'draft'; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN refresh_target SET DEFAULT 'both'; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_theme_packages_scope_theme_unique' \
         ) THEN \
           RETURN; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM ( \
             SELECT COALESCE(site_key, '') AS site_scope, theme_key, COUNT(*) AS c \
             FROM cms_theme_packages \
             GROUP BY COALESCE(site_key, ''), theme_key \
             HAVING COUNT(*) > 1 \
           ) dups \
         ) THEN \
           CREATE UNIQUE INDEX cms_theme_packages_scope_theme_unique \
           ON cms_theme_packages (COALESCE(site_key, ''), theme_key); \
         ELSE \
           RAISE NOTICE 'Skipping cms_theme_packages_scope_theme_unique due to duplicate (site_key,theme_key) rows'; \
         END IF; \
       END \
       \$\$;"

    THEMES_FILE="/directus-theme-packages/themes.yaml"
    if [ -f "$THEMES_FILE" ]; then
      THEMES_JSON="$(yq -o=json '.' "$THEMES_FILE" 2>/dev/null || true)"
      if printf '%s' "$THEMES_JSON" | jq -e '.themes | type=="array" and length>0' >/dev/null 2>&1; then
        printf '%s' "$THEMES_JSON" | jq -c '.themes[]' | while IFS= read -r theme; do
          theme_key="$(printf '%s' "$theme" | jq -r '.theme_key // empty')"
          theme_name="$(printf '%s' "$theme" | jq -r '.name // empty')"
          theme_status="$(printf '%s' "$theme" | jq -r '.status // "published"')"
          theme_desc="$(printf '%s' "$theme" | jq -r '.description // empty')"
          theme_site="$(printf '%s' "$theme" | jq -r 'if .site_key == null then "" else (.site_key | tostring) end')"
          theme_refresh_target_raw="$(printf '%s' "$theme" | jq -r '.refresh_target // "both"')"
          theme_css="$(printf '%s' "$theme" | jq -r '.css // empty')"
          theme_css_file="$(printf '%s' "$theme" | jq -r '.css_file // empty')"

          if [ -z "${theme_css:-}" ] && [ -n "${theme_css_file:-}" ]; then
            case "$theme_css_file" in
              /*|*..*)
                echo "⚠️  theme '${theme_key}' has invalid css_file path '${theme_css_file}'; skipping"
                continue
                ;;
              *)
                theme_css_path="/directus-theme-packages/${theme_css_file}"
                if [ -f "$theme_css_path" ]; then
                  theme_css="$(cat "$theme_css_path")"
                else
                  echo "⚠️  theme '${theme_key}' css file not found at ${theme_css_path}; skipping"
                  continue
                fi
                ;;
            esac
          fi

          if [ -z "${theme_key:-}" ] || [ -z "${theme_name:-}" ] || [ -z "${theme_css:-}" ]; then
            echo "⚠️  skipping invalid theme package entry (theme_key/name/css required)"
            continue
          fi

          case "$(printf '%s' "${theme_refresh_target_raw:-both}" | tr '[:upper:]' '[:lower:]')" in
            preview|prod|both) theme_refresh_target="$(printf '%s' "${theme_refresh_target_raw:-both}" | tr '[:upper:]' '[:lower:]')" ;;
            *) theme_refresh_target="both" ;;
          esac

          theme_key_sql="$(printf '%s' "$theme_key" | sed "s/'/''/g")"
          theme_name_sql="$(printf '%s' "$theme_name" | sed "s/'/''/g")"
          theme_status_sql="$(printf '%s' "$theme_status" | sed "s/'/''/g")"
          theme_refresh_target_sql="$(printf '%s' "$theme_refresh_target" | sed "s/'/''/g")"
          theme_css_sql="$(printf '%s' "$theme_css" | sed "s/'/''/g")"

          theme_desc_sql="NULL"
          if [ -n "${theme_desc:-}" ]; then
            theme_desc_esc="$(printf '%s' "$theme_desc" | sed "s/'/''/g")"
            theme_desc_sql="'${theme_desc_esc}'"
          fi

          theme_site_sql="NULL"
          theme_scope_condition="(site_key IS NULL OR site_key='')"
          if [ -n "${theme_site:-}" ]; then
            theme_site_esc="$(printf '%s' "$theme_site" | sed "s/'/''/g")"
            theme_site_sql="'${theme_site_esc}'"
            theme_scope_condition="site_key='${theme_site_esc}'"
          fi

          existing_theme_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.cms_theme_packages WHERE theme_key='${theme_key_sql}' AND ${theme_scope_condition} LIMIT 1;" || true)"
          existing_theme_id="$(printf '%s' "$existing_theme_id" | tr -d '\r')"

          if [ -n "${existing_theme_id:-}" ] && [ "${existing_theme_id}" != "null" ]; then
            existing_theme_id_sql="$(printf '%s' "$existing_theme_id" | sed "s/'/''/g")"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               UPDATE cms_theme_packages \
               SET name='${theme_name_sql}', \
                   description=${theme_desc_sql}, \
                   status='${theme_status_sql}', \
                   site_key=${theme_site_sql}, \
                   refresh_target='${theme_refresh_target_sql}', \
                   css='${theme_css_sql}', \
                   date_updated=now() \
               WHERE id='${existing_theme_id_sql}';"
            echo "✅ Reconciled theme package '${theme_key}'"
          else
            new_theme_id="$(cat /proc/sys/kernel/random/uuid)"
            new_theme_id_sql="$(printf '%s' "$new_theme_id" | sed "s/'/''/g")"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               INSERT INTO cms_theme_packages (id, theme_key, name, description, status, site_key, refresh_target, css, date_created, date_updated) \
               VALUES ('${new_theme_id_sql}','${theme_key_sql}','${theme_name_sql}',${theme_desc_sql},'${theme_status_sql}',${theme_site_sql},'${theme_refresh_target_sql}','${theme_css_sql}',now(),now());"
            echo "✅ Seeded theme package '${theme_key}'"
          fi
        done
      else
        echo "  └─ no themes configured in ${THEMES_FILE}; skipping"
      fi
    else
      echo "  └─ ${THEMES_FILE} not found; skipping"
    fi

    if command -v _upsert_refresh_target_field_meta >/dev/null 2>&1; then
      _upsert_refresh_target_field_meta "cms_theme_packages"
    fi

    # 5b.2) Ensure module registry + module content block collections exist and seed modules from GitOps config.
    echo "🧱 Ensuring cms_modules exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
