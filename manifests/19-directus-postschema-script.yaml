         ) \
         FROM ( \
           SELECT s.slot_key, COALESCE(NULLIF(MAX(s.slot_label), ''), s.slot_key) AS slot_label \
           FROM directus.cms_layout_template_slots s \
           JOIN directus.cms_layout_templates t \
