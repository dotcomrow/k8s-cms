         css_dark TEXT NULL, \
         css TEXT NOT NULL, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS theme_key TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS name TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS description TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS status TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS css_light TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS css_dark TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS css TEXT; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_theme_packages ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN status SET DEFAULT 'draft'; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN refresh_target SET DEFAULT 'both'; \
       ALTER TABLE IF EXISTS cms_theme_packages ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_theme_packages_scope_theme_unique' \
         ) THEN \
           RETURN; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM ( \
             SELECT COALESCE(site_key, '') AS site_scope, theme_key, COUNT(*) AS c \
             FROM cms_theme_packages \
             GROUP BY COALESCE(site_key, ''), theme_key \
             HAVING COUNT(*) > 1 \
           ) dups \
         ) THEN \
           CREATE UNIQUE INDEX cms_theme_packages_scope_theme_unique \
           ON cms_theme_packages (COALESCE(site_key, ''), theme_key); \
         ELSE \
           RAISE NOTICE 'Skipping cms_theme_packages_scope_theme_unique due to duplicate (site_key,theme_key) rows'; \
         END IF; \
       END \
       \$\$;"

    _sql_escape_literal() {
      printf '%s' "$1" | sed "s/'/''/g"
    }

    _read_seed_asset() {
      _seed_asset_base_dir="$1"
      _seed_asset_file="$2"
      _seed_asset_label="$3"
      _seed_asset_required="$4"

      if [ -z "${_seed_asset_file:-}" ] || [ "${_seed_asset_file}" = "null" ]; then
        if [ "${_seed_asset_required}" = "true" ]; then
          echo "ERROR: Missing ${_seed_asset_label} filename in optional Directus layout/theme seed." >&2
          return 1
        fi
        return 0
      fi
      case "${_seed_asset_file}" in
        */*|*..*)
          echo "ERROR: Refusing unsafe ${_seed_asset_label} filename '${_seed_asset_file}' in optional Directus layout/theme seed." >&2
          return 1
          ;;
      esac
      _seed_asset_path="${_seed_asset_base_dir}/${_seed_asset_file}"
      if [ ! -f "${_seed_asset_path}" ]; then
        echo "ERROR: Missing ${_seed_asset_label} asset '${_seed_asset_path}' in optional Directus layout/theme seed." >&2
        return 1
      fi
      cat "${_seed_asset_path}"
    }

    _slot_label_from_key() {
      printf '%s' "$1" | tr '_-' '  ' | awk '{ for (i = 1; i <= NF; i++) { $i = toupper(substr($i, 1, 1)) substr($i, 2) } print }'
    }

    _extract_layout_seed_slots() {
      _layout_seed_html_path="$1"
      {
        grep -Eo 'data-slot="[^"]+"' "${_layout_seed_html_path}" 2>/dev/null | sed 's/^data-slot="//;s/"$//'
        grep -Eo '\{\{[[:space:]]*slot:[^}[:space:]]+' "${_layout_seed_html_path}" 2>/dev/null | sed 's/^.*slot://'
      } | sed '/^[[:space:]]*$/d' | sort -u
    }

    _seed_optional_layout_templates_and_themes() {
      if [ "${DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED}" != "true" ] && [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" != "true" ]; then
        echo "INFO: DIRECTUS_POSTSCHEMA_LAYOUT_THEME_SEED_ENABLED=false and DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=false; skipping optional layout template/theme seed data writes."
        return 0
      fi

      echo "🌱 Optional Directus layout template/theme seed is enabled; inserting missing rows only."

      if [ ! -f "${LAYOUT_TEMPLATES_FILE}" ]; then
        echo "ERROR: Optional layout seed enabled but ${LAYOUT_TEMPLATES_FILE} is missing." >&2
        return 1
      fi
      if [ ! -f "${THEME_PACKAGES_FILE}" ]; then
        echo "ERROR: Optional theme seed enabled but ${THEME_PACKAGES_FILE} is missing." >&2
        return 1
      fi

      LAYOUT_TEMPLATES_JSON="$(yq -o=json '.' "${LAYOUT_TEMPLATES_FILE}")"
      THEME_PACKAGES_JSON="$(yq -o=json '.' "${THEME_PACKAGES_FILE}")"

      printf '%s' "${LAYOUT_TEMPLATES_JSON}" | jq -c '.templates[]?' > /tmp/directus-layout-template-seed-items.jsonl
      while IFS= read -r layout_seed_item || [ -n "${layout_seed_item:-}" ]; do
        [ -z "${layout_seed_item:-}" ] && continue

        layout_template_key="$(printf '%s' "${layout_seed_item}" | jq -r '.template_key // empty')"
        layout_name="$(printf '%s' "${layout_seed_item}" | jq -r '.name // .template_key // empty')"
        layout_description="$(printf '%s' "${layout_seed_item}" | jq -r '.description // empty')"
        layout_status="$(printf '%s' "${layout_seed_item}" | jq -r '.status // "draft"')"
        layout_site_key="$(printf '%s' "${layout_seed_item}" | jq -r '.site_key // empty')"
        layout_refresh_target="$(printf '%s' "${layout_seed_item}" | jq -r '.refresh_target // "both"')"
        layout_html_file="$(printf '%s' "${layout_seed_item}" | jq -r '.html_file // empty')"
        layout_css_file="$(printf '%s' "${layout_seed_item}" | jq -r '.css_file // empty')"

        if [ -z "${layout_template_key:-}" ] || [ -z "${layout_html_file:-}" ]; then
          echo "ERROR: Optional layout seed entry is missing template_key or html_file." >&2
          return 1
        fi
        case "${layout_html_file}" in
          */*|*..*)
            echo "ERROR: Refusing unsafe layout html_file '${layout_html_file}' in optional Directus layout seed." >&2
            return 1
            ;;
        esac
        layout_html_path="/directus-layout-templates/${layout_html_file}"
        if [ ! -f "${layout_html_path}" ]; then
          echo "ERROR: Missing layout HTML asset '${layout_html_path}' in optional Directus layout seed." >&2
          return 1
        fi

        layout_html="$(cat "${layout_html_path}")"
        layout_css="$(_read_seed_asset "/directus-layout-templates" "${layout_css_file}" "layout CSS" "false")"

        layout_id="$(cat /proc/sys/kernel/random/uuid)"
        layout_template_key_sql="$(_sql_escape_literal "${layout_template_key}")"
        layout_name_sql="$(_sql_escape_literal "${layout_name}")"
        layout_description_sql="$(_sql_escape_literal "${layout_description}")"
        layout_status_sql="$(_sql_escape_literal "${layout_status}")"
        layout_site_key_sql="$(_sql_escape_literal "${layout_site_key}")"
        layout_refresh_target_sql="$(_sql_escape_literal "${layout_refresh_target}")"
        layout_html_sql="$(_sql_escape_literal "${layout_html}")"
        layout_css_sql="$(_sql_escape_literal "${layout_css}")"

        if ! _psql_yb_retry "WITH input AS ( \
             SELECT '${layout_id}'::uuid AS id, \
                    '${layout_template_key_sql}'::text AS template_key, \
                    '${layout_name_sql}'::text AS name, \
                    NULLIF('${layout_description_sql}', '')::text AS description, \
                    COALESCE(NULLIF('${layout_status_sql}', ''), 'draft')::text AS status, \
                    NULLIF(BTRIM('${layout_site_key_sql}'), '')::text AS site_key, \
                    COALESCE(NULLIF('${layout_refresh_target_sql}', ''), 'both')::text AS refresh_target, \
                    '${layout_html_sql}'::text AS html, \
                    NULLIF('${layout_css_sql}', '')::text AS css \
           ) \
           INSERT INTO directus.cms_layout_templates (id, template_key, name, description, status, site_key, refresh_target, html, css, date_created) \
           SELECT id, template_key, name, description, status, site_key, refresh_target, html, css, now() \
           FROM input \
           WHERE NOT EXISTS ( \
             SELECT 1 \
             FROM directus.cms_layout_templates t \
             WHERE t.template_key = input.template_key \
               AND COALESCE(t.site_key, '') = COALESCE(input.site_key, '') \
           );" "optional layout template seed ${layout_template_key}" 12; then
          return 1
        fi

        _extract_layout_seed_slots "${layout_html_path}" > /tmp/directus-layout-template-seed-slots.txt
        while IFS= read -r layout_slot_key || [ -n "${layout_slot_key:-}" ]; do
          [ -z "${layout_slot_key:-}" ] && continue
          layout_slot_id="$(cat /proc/sys/kernel/random/uuid)"
          layout_slot_label="$(_slot_label_from_key "${layout_slot_key}")"
          layout_slot_key_sql="$(_sql_escape_literal "${layout_slot_key}")"
          layout_slot_label_sql="$(_sql_escape_literal "${layout_slot_label}")"

          if ! _psql_yb_retry "WITH input AS ( \
               SELECT '${layout_slot_id}'::uuid AS id, \
                      '${layout_template_key_sql}'::text AS template_key, \
                      NULLIF(BTRIM('${layout_site_key_sql}'), '')::text AS site_key, \
                      COALESCE(NULLIF('${layout_refresh_target_sql}', ''), 'both')::text AS refresh_target, \
                      '${layout_slot_key_sql}'::text AS slot_key, \
                      NULLIF('${layout_slot_label_sql}', '')::text AS slot_label \
             ) \
             INSERT INTO directus.cms_layout_template_slots (id, template_key, site_key, refresh_target, slot_key, slot_label, date_created) \
             SELECT id, template_key, site_key, refresh_target, slot_key, slot_label, now() \
             FROM input \
             WHERE NOT EXISTS ( \
               SELECT 1 \
               FROM directus.cms_layout_template_slots s \
               WHERE s.template_key = input.template_key \
                 AND s.slot_key = input.slot_key \
                 AND COALESCE(s.site_key, '') = COALESCE(input.site_key, '') \
             );" "optional layout template slot seed ${layout_template_key}/${layout_slot_key}" 12; then
            return 1
          fi
        done < /tmp/directus-layout-template-seed-slots.txt
      done < /tmp/directus-layout-template-seed-items.jsonl

      printf '%s' "${THEME_PACKAGES_JSON}" | jq -c '.themes[]?' > /tmp/directus-theme-package-seed-items.jsonl
      while IFS= read -r theme_seed_item || [ -n "${theme_seed_item:-}" ]; do
        [ -z "${theme_seed_item:-}" ] && continue

        theme_key="$(printf '%s' "${theme_seed_item}" | jq -r '.theme_key // empty')"
        theme_name="$(printf '%s' "${theme_seed_item}" | jq -r '.name // .theme_key // empty')"
        theme_description="$(printf '%s' "${theme_seed_item}" | jq -r '.description // empty')"
        theme_status="$(printf '%s' "${theme_seed_item}" | jq -r '.status // "draft"')"
        theme_site_key="$(printf '%s' "${theme_seed_item}" | jq -r '.site_key // empty')"
        theme_refresh_target="$(printf '%s' "${theme_seed_item}" | jq -r '.refresh_target // "both"')"
        theme_css_light_file="$(printf '%s' "${theme_seed_item}" | jq -r '.css_light_file // empty')"
        theme_css_dark_file="$(printf '%s' "${theme_seed_item}" | jq -r '.css_dark_file // empty')"
        theme_css_file="$(printf '%s' "${theme_seed_item}" | jq -r '.css_file // empty')"

        if [ -z "${theme_key:-}" ]; then
          echo "ERROR: Optional theme seed entry is missing theme_key." >&2
          return 1
        fi

        theme_css_light="$(_read_seed_asset "/directus-theme-packages" "${theme_css_light_file}" "theme light CSS" "false")"
        theme_css_dark="$(_read_seed_asset "/directus-theme-packages" "${theme_css_dark_file}" "theme dark CSS" "false")"
        if [ -n "${theme_css_file:-}" ] && [ "${theme_css_file}" != "null" ]; then
          theme_css="$(_read_seed_asset "/directus-theme-packages" "${theme_css_file}" "theme CSS" "true")"
        elif [ -n "${theme_css_light:-}" ]; then
          theme_css="${theme_css_light}"
        elif [ -n "${theme_css_dark:-}" ]; then
          theme_css="${theme_css_dark}"
        else
          echo "ERROR: Optional theme seed entry '${theme_key}' has no CSS asset." >&2
          return 1
        fi

        theme_id="$(cat /proc/sys/kernel/random/uuid)"
        theme_key_sql="$(_sql_escape_literal "${theme_key}")"
        theme_name_sql="$(_sql_escape_literal "${theme_name}")"
        theme_description_sql="$(_sql_escape_literal "${theme_description}")"
        theme_status_sql="$(_sql_escape_literal "${theme_status}")"
        theme_site_key_sql="$(_sql_escape_literal "${theme_site_key}")"
        theme_refresh_target_sql="$(_sql_escape_literal "${theme_refresh_target}")"
        theme_css_light_sql="$(_sql_escape_literal "${theme_css_light}")"
        theme_css_dark_sql="$(_sql_escape_literal "${theme_css_dark}")"
        theme_css_sql="$(_sql_escape_literal "${theme_css}")"

        if ! _psql_yb_retry "WITH input AS ( \
             SELECT '${theme_id}'::uuid AS id, \
                    '${theme_key_sql}'::text AS theme_key, \
                    '${theme_name_sql}'::text AS name, \
                    NULLIF('${theme_description_sql}', '')::text AS description, \
                    COALESCE(NULLIF('${theme_status_sql}', ''), 'draft')::text AS status, \
                    NULLIF(BTRIM('${theme_site_key_sql}'), '')::text AS site_key, \
                    COALESCE(NULLIF('${theme_refresh_target_sql}', ''), 'both')::text AS refresh_target, \
                    NULLIF('${theme_css_light_sql}', '')::text AS css_light, \
                    NULLIF('${theme_css_dark_sql}', '')::text AS css_dark, \
                    '${theme_css_sql}'::text AS css \
           ) \
           INSERT INTO directus.cms_theme_packages (id, theme_key, name, description, status, site_key, refresh_target, css_light, css_dark, css, date_created) \
           SELECT id, theme_key, name, description, status, site_key, refresh_target, css_light, css_dark, css, now() \
           FROM input \
           WHERE NOT EXISTS ( \
             SELECT 1 \
             FROM directus.cms_theme_packages t \
             WHERE t.theme_key = input.theme_key \
               AND COALESCE(t.site_key, '') = COALESCE(input.site_key, '') \
           );" "optional theme package seed ${theme_key}" 12; then
          return 1
        fi
      done < /tmp/directus-theme-package-seed-items.jsonl

      echo "✅ Optional Directus layout template/theme seed completed."
    }

    _seed_optional_layout_templates_and_themes

    if command -v _upsert_refresh_target_field_meta >/dev/null 2>&1; then
      _upsert_refresh_target_field_meta "cms_theme_packages"
    fi

    # 5b.1.1) Ensure cache refresh target registry exists for UI-managed endpoint overrides.
    # This becomes the single editor-facing place to change refresh endpoints without code edits.
    echo "🧱 Ensuring cms_cache_refresh_targets exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_cache_refresh_targets ( \
         id UUID PRIMARY KEY, \
         site_key TEXT NOT NULL, \
         target_key TEXT NOT NULL, \
         enabled BOOLEAN NOT NULL DEFAULT false, \
         endpoint TEXT NOT NULL DEFAULT '', \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS target_key TEXT; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS enabled BOOLEAN; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS endpoint TEXT; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ALTER COLUMN enabled SET DEFAULT false; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ALTER COLUMN endpoint SET DEFAULT ''; \
       ALTER TABLE IF EXISTS cms_cache_refresh_targets ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_cache_refresh_targets_site_target_unique' \
         ) THEN \
           RETURN; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM ( \
             SELECT site_key, target_key, COUNT(*) AS c \
             FROM cms_cache_refresh_targets \
             GROUP BY site_key, target_key \
             HAVING COUNT(*) > 1 \
           ) dups \
         ) THEN \
           CREATE UNIQUE INDEX cms_cache_refresh_targets_site_target_unique \
           ON cms_cache_refresh_targets (site_key, target_key); \
         ELSE \
           RAISE NOTICE 'Skipping cms_cache_refresh_targets_site_target_unique due to duplicate (site_key,target_key) rows'; \
         END IF; \
       END \
       \$\$;"

    echo "🧱 Ensuring cms_cache_refresh_targets syncs Directus refresh-flow endpoints..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE OR REPLACE FUNCTION directus.sync_cache_refresh_target_flow_config() \
       RETURNS trigger \
       LANGUAGE plpgsql \
       AS \$\$ \
       DECLARE \
         v_site_key TEXT; \
         v_target_key TEXT; \
         v_enabled BOOLEAN; \
         v_endpoint TEXT; \
         v_effective_endpoint TEXT; \
         v_flow_status TEXT; \
         v_create_name TEXT; \
         v_update_name TEXT; \
         v_manual_name TEXT; \
         v_flow_id UUID; \
         v_options_type TEXT; \
       BEGIN \
         IF TG_OP = 'DELETE' THEN \
           v_site_key := LOWER(COALESCE(NULLIF(BTRIM(OLD.site_key), ''), '')); \
           v_target_key := LOWER(COALESCE(NULLIF(BTRIM(OLD.target_key), ''), '')); \
           v_enabled := false; \
           v_endpoint := ''; \
         ELSE \
           v_site_key := LOWER(COALESCE(NULLIF(BTRIM(NEW.site_key), ''), '')); \
           v_target_key := LOWER(COALESCE(NULLIF(BTRIM(NEW.target_key), ''), '')); \
           v_enabled := COALESCE(NEW.enabled, false); \
           v_endpoint := BTRIM(COALESCE(NEW.endpoint, '')); \
         END IF; \
         IF v_site_key = '' OR v_target_key = '' THEN \
           IF TG_OP = 'DELETE' THEN \
             RETURN OLD; \
           END IF; \
           RETURN NEW; \
         END IF; \
         IF to_regclass('directus.directus_flows') IS NULL \
            OR to_regclass('directus.directus_operations') IS NULL THEN \
           IF TG_OP = 'DELETE' THEN \
             RETURN OLD; \
           END IF; \
           RETURN NEW; \
         END IF; \
         IF v_enabled AND v_endpoint <> '' THEN \
           v_flow_status := 'active'; \
         ELSE \
           v_flow_status := 'inactive'; \
         END IF; \
         v_effective_endpoint := '{{ refresh_target_config.endpoint }}'; \
         v_create_name := FORMAT('CMS Cache Refresh (%s/%s) - Create', v_site_key, v_target_key); \
         v_update_name := FORMAT('CMS Cache Refresh (%s/%s) - Update', v_site_key, v_target_key); \
         v_manual_name := FORMAT('CMS Cache Refresh (%s/%s) - Manual', v_site_key, v_target_key); \
         SELECT c.data_type INTO v_options_type \
         FROM information_schema.columns c \
         WHERE c.table_schema = 'directus' \
           AND c.table_name = 'directus_operations' \
           AND c.column_name = 'options' \
         LIMIT 1; \
         UPDATE directus_flows \
         SET status = v_flow_status \
         WHERE name IN (v_create_name, v_update_name, v_manual_name); \
         FOR v_flow_id IN \
           SELECT f.id \
           FROM directus_flows f \
           WHERE f.name IN (v_create_name, v_update_name, v_manual_name) \
         LOOP \
           IF COALESCE(v_options_type, '') = 'json' THEN \
             UPDATE directus_operations \
             SET options = jsonb_set(COALESCE(options::jsonb, '{}'::jsonb), '{url}', to_jsonb(v_effective_endpoint), true)::json \
             WHERE flow = v_flow_id \
               AND type = 'request' \
               AND key LIKE 'refresh_cache_attempt_%'; \
           ELSE \
             UPDATE directus_operations \
             SET options = jsonb_set(COALESCE(options::jsonb, '{}'::jsonb), '{url}', to_jsonb(v_effective_endpoint), true) \
             WHERE flow = v_flow_id \
               AND type = 'request' \
               AND key LIKE 'refresh_cache_attempt_%'; \
           END IF; \
         END LOOP; \
         IF TG_OP = 'DELETE' THEN \
           RETURN OLD; \
         END IF; \
         RETURN NEW; \
       END; \
       \$\$; \
       DO \$\$ \
       BEGIN \
         IF to_regclass('directus.cms_cache_refresh_targets') IS NOT NULL THEN \
           DROP TRIGGER IF EXISTS cms_cache_refresh_targets_sync_flow_config_upsert_trg ON cms_cache_refresh_targets; \
           CREATE TRIGGER cms_cache_refresh_targets_sync_flow_config_upsert_trg \
           AFTER INSERT OR UPDATE OF site_key, target_key, enabled, endpoint \
           ON cms_cache_refresh_targets \
           FOR EACH ROW \
           EXECUTE FUNCTION directus.sync_cache_refresh_target_flow_config(); \
           DROP TRIGGER IF EXISTS cms_cache_refresh_targets_sync_flow_config_delete_trg ON cms_cache_refresh_targets; \
           CREATE TRIGGER cms_cache_refresh_targets_sync_flow_config_delete_trg \
           AFTER DELETE \
           ON cms_cache_refresh_targets \
           FOR EACH ROW \
           EXECUTE FUNCTION directus.sync_cache_refresh_target_flow_config(); \
         END IF; \
       END \
       \$\$;"

    # 5b.2) Ensure module registry + module content block collections exist. Rows are managed in Directus.
    echo "🧱 Ensuring cms_modules exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_modules ( \
         id UUID PRIMARY KEY, \
         module_key TEXT NOT NULL, \
         name TEXT NOT NULL, \
         description TEXT NULL, \
         provider TEXT NOT NULL DEFAULT 'radix', \
         component_type TEXT NULL, \
         status TEXT NOT NULL DEFAULT 'draft', \
         site_key TEXT NULL, \
         refresh_target TEXT NOT NULL DEFAULT 'both', \
         props_schema JSONB NOT NULL DEFAULT '{}'::jsonb, \
         default_props JSONB NOT NULL DEFAULT '{}'::jsonb, \
         date_created TIMESTAMPTZ NOT NULL DEFAULT now(), \
         date_updated TIMESTAMPTZ NULL \
       ); \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS module_key TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS name TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS description TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS provider TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS component_type TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS status TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS props_schema JSONB; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS default_props JSONB; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS date_created TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_modules ADD COLUMN IF NOT EXISTS date_updated TIMESTAMPTZ; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN provider SET DEFAULT 'radix'; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN status SET DEFAULT 'draft'; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN refresh_target SET DEFAULT 'both'; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN props_schema SET DEFAULT '{}'::jsonb; \
