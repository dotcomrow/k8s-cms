apiVersion: v1
kind: ConfigMap
metadata:
  name: directus-postschema-script
  namespace: directus
  labels:
    app: directus
data:
  directus-postschema.sh: |
    set -eu

    POSTSCHEMA_STATE_DIR="${DIRECTUS_POSTSCHEMA_STATE_DIR:-/postschema-state}"
    POSTSCHEMA_READY_FILE="${POSTSCHEMA_STATE_DIR}/ready"
    POSTSCHEMA_DB_READY_FILE="${POSTSCHEMA_STATE_DIR}/db-ready"
    POSTSCHEMA_FAILED_FILE="${POSTSCHEMA_STATE_DIR}/failed"
    mkdir -p "${POSTSCHEMA_STATE_DIR}" || true
    rm -f "${POSTSCHEMA_READY_FILE}" "${POSTSCHEMA_DB_READY_FILE}" "${POSTSCHEMA_FAILED_FILE}"
    
    # tools
    apk add --no-cache curl jq yq >/dev/null
    
    # --- fetch DB creds from Vault ---
    VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
    VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
    CREDS="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
      "${VAULT_ADDR}/v1/yugabyte-db/static-creds/directus-app")"
    DB_USER="$(echo "$CREDS" | jq -r '.data.username')"
    DB_PASS="$(echo "$CREDS" | jq -r '.data.password')"
    
    if [ -z "${DB_USER:-}" ] || [ -z "${DB_PASS:-}" ] || [ "$DB_USER" = "null" ] || [ "$DB_PASS" = "null" ]; then
      echo "❌ Failed to fetch DB creds from Vault"; exit 1
    fi
    
    export PGPASSWORD="$DB_PASS"
    
    # 1) Ensure schema_patch_log exists (no heredocs)
    echo "🔎 Ensuring patch ledger table…"
    printf '%s\n' \
      'SET search_path TO directus, public;' \
      'CREATE TABLE IF NOT EXISTS schema_patch_log (' \
      '  patch_key TEXT PRIMARY KEY,' \
      '  applied_at TIMESTAMPTZ NOT NULL DEFAULT now()' \
      ');' \
    | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 >/dev/null
    
    # Expand legacy sentinel table into a richer patch ledger (idempotent).
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_checksum TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_status TEXT NOT NULL DEFAULT 'success'; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS patch_group TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS details JSONB; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_error TEXT; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_started_at TIMESTAMPTZ; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS last_checked_at TIMESTAMPTZ NOT NULL DEFAULT now(); \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS duration_ms INTEGER; \
       ALTER TABLE schema_patch_log ADD COLUMN IF NOT EXISTS apply_count INTEGER NOT NULL DEFAULT 0;"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS schema_patch_runs ( \
         run_id TEXT PRIMARY KEY, \
         patch_key TEXT NOT NULL, \
         patch_checksum TEXT NULL, \
         patch_status TEXT NOT NULL, \
         patch_group TEXT NULL, \
         details JSONB NULL, \
         error TEXT NULL, \
         started_at TIMESTAMPTZ NOT NULL DEFAULT now(), \
         finished_at TIMESTAMPTZ NULL, \
         duration_ms INTEGER NULL \
       );"

    _file_sha256() {
      _path="$1"
      if [ -f "${_path}" ]; then
        sha256sum "${_path}" | awk '{print $1}'
      else
        printf 'missing'
      fi
    }

    DIRECTUS_POSTSCHEMA_RECONCILE_VERSION="${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION:-2026-02-23.1}"
    DIRECTUS_POSTSCHEMA_FORCE_RECONCILE_RAW="${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE:-false}"
    case "$(printf '%s' "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE_RAW}" | tr '[:upper:]' '[:lower:]')" in
      1|true|yes|on) DIRECTUS_POSTSCHEMA_FORCE_RECONCILE="true" ;;
      *) DIRECTUS_POSTSCHEMA_FORCE_RECONCILE="false" ;;
    esac

    # Inputs that define desired reconciled state from GitOps.
    SITES_FILE="/directus-sites/sites.yaml"
    LAYOUTS_FILE="/directus-layout-templates/templates.yaml"
    THEMES_FILE="/directus-theme-packages/themes.yaml"
    MODULES_FILE="/directus-modules/modules.yaml"
    EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
    RECON_SCRIPT_FILE="/scripts/directus-postschema.sh"
    RECON_SITES_SHA="$(_file_sha256 "${SITES_FILE}")"
    RECON_LAYOUTS_SHA="$(_file_sha256 "${LAYOUTS_FILE}")"
    RECON_THEMES_SHA="$(_file_sha256 "${THEMES_FILE}")"
    RECON_MODULES_SHA="$(_file_sha256 "${MODULES_FILE}")"
    RECON_SETTINGS_SHA="$(_file_sha256 "${EXTRA_SETTINGS_FILE}")"
    RECON_SCRIPT_SHA="$(_file_sha256 "${RECON_SCRIPT_FILE}")"
    RECON_PATCH_KEY="postschema_reconcile_v1"
    RECON_PATCH_GROUP="directus-postschema"
    RECON_PATCH_CHECKSUM="$(printf '%s|%s|%s|%s|%s|%s|%s' \
      "${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}" "${RECON_SITES_SHA}" "${RECON_LAYOUTS_SHA}" "${RECON_THEMES_SHA}" "${RECON_MODULES_SHA}" "${RECON_SETTINGS_SHA}" "${RECON_SCRIPT_SHA}" \
      | sha256sum | awk '{print $1}')"

    RECON_PATCH_KEY_SQL="$(printf '%s' "${RECON_PATCH_KEY}" | sed "s/'/''/g")"
    RECON_PATCH_GROUP_SQL="$(printf '%s' "${RECON_PATCH_GROUP}" | sed "s/'/''/g")"
    RECON_PATCH_CHECKSUM_SQL="$(printf '%s' "${RECON_PATCH_CHECKSUM}" | sed "s/'/''/g")"
    RECON_RUN_ID="$(cat /proc/sys/kernel/random/uuid)"
    RECON_RUN_ID_SQL="$(printf '%s' "${RECON_RUN_ID}" | sed "s/'/''/g")"
    RECON_PATCH_DETAILS_JSON="$(jq -nc \
      --arg version "${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}" \
      --arg sites_sha "${RECON_SITES_SHA}" \
      --arg layouts_sha "${RECON_LAYOUTS_SHA}" \
      --arg themes_sha "${RECON_THEMES_SHA}" \
      --arg modules_sha "${RECON_MODULES_SHA}" \
      --arg settings_sha "${RECON_SETTINGS_SHA}" \
      --arg script_sha "${RECON_SCRIPT_SHA}" \
      '{version:$version,inputs:{sites_yaml_sha256:$sites_sha,layout_templates_yaml_sha256:$layouts_sha,theme_packages_yaml_sha256:$themes_sha,modules_yaml_sha256:$modules_sha,directus_settings_yaml_sha256:$settings_sha,postschema_script_sha256:$script_sha}}')"
    RECON_PATCH_DETAILS_SQL="$(printf '%s' "${RECON_PATCH_DETAILS_JSON}" | sed "s/'/''/g")"

    RECON_ALREADY_CURRENT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM directus.schema_patch_log WHERE patch_key='${RECON_PATCH_KEY_SQL}' AND patch_status='success' AND COALESCE(patch_checksum,'')='${RECON_PATCH_CHECKSUM_SQL}' LIMIT 1;" || true)"
    RECON_FLOW_HEALTHY="1"
    FLOW_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_flows' LIMIT 1;" || true)"
    if [ "${FLOW_TABLE_EXISTS:-0}" = "1" ]; then
      FLOW_COUNT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT COUNT(*) FROM directus.directus_flows;" || true)"
      FLOW_COUNT="$(printf '%s' "${FLOW_COUNT:-0}" | tr -d '\r')"
      if [ -z "${FLOW_COUNT:-}" ] || [ "${FLOW_COUNT}" = "0" ]; then
        RECON_FLOW_HEALTHY="0"
        echo "⚠️ directus_flows is empty; forcing reconcile despite checksum match."
      fi
    fi

    if [ "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE}" != "true" ] && [ "${RECON_ALREADY_CURRENT}" = "1" ] && [ "${RECON_FLOW_HEALTHY}" = "1" ]; then
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; UPDATE schema_patch_log SET last_checked_at=now() WHERE patch_key='${RECON_PATCH_KEY_SQL}';" >/dev/null
      echo "✅ Postschema reconcile already up to date (version=${DIRECTUS_POSTSCHEMA_RECONCILE_VERSION}, checksum=${RECON_PATCH_CHECKSUM})."
      touch "${POSTSCHEMA_DB_READY_FILE}"
      touch "${POSTSCHEMA_READY_FILE}"
      echo "✅ Schema patch applied. Going idle."
      exec tail -f /dev/null
    fi
    if [ "${DIRECTUS_POSTSCHEMA_FORCE_RECONCILE}" = "true" ]; then
      echo "⚠️ Forced reconcile requested (DIRECTUS_POSTSCHEMA_FORCE_RECONCILE=true); skipping checksum short-circuit."
    fi

    RECON_STARTED_EPOCH="$(date +%s)"
    RECON_DONE="0"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       INSERT INTO schema_patch_log (patch_key, patch_checksum, patch_status, patch_group, details, last_error, last_started_at, last_checked_at, apply_count) \
       VALUES ('${RECON_PATCH_KEY_SQL}', '${RECON_PATCH_CHECKSUM_SQL}', 'running', '${RECON_PATCH_GROUP_SQL}', '${RECON_PATCH_DETAILS_SQL}'::jsonb, NULL, now(), now(), 1) \
       ON CONFLICT (patch_key) DO UPDATE SET \
         patch_checksum=EXCLUDED.patch_checksum, \
         patch_status='running', \
         patch_group=EXCLUDED.patch_group, \
         details=EXCLUDED.details, \
         last_error=NULL, \
         last_started_at=now(), \
         last_checked_at=now(), \
         apply_count=COALESCE(schema_patch_log.apply_count,0)+1;"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       INSERT INTO schema_patch_runs (run_id, patch_key, patch_checksum, patch_status, patch_group, details, started_at) \
       VALUES ('${RECON_RUN_ID_SQL}', '${RECON_PATCH_KEY_SQL}', '${RECON_PATCH_CHECKSUM_SQL}', 'running', '${RECON_PATCH_GROUP_SQL}', '${RECON_PATCH_DETAILS_SQL}'::jsonb, now());"

    _reconcile_mark_failed() {
      _rc="$1"
      if [ "${RECON_DONE:-0}" = "1" ]; then
        return 0
      fi
      _duration_ms=$(( ($(date +%s) - RECON_STARTED_EPOCH) * 1000 ))
      _err="postschema exited with code ${_rc}"
      _err_sql="$(printf '%s' "${_err}" | sed "s/'/''/g")"
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; \
         UPDATE schema_patch_log \
            SET patch_status='failed', \
                last_error='${_err_sql}', \
                duration_ms=${_duration_ms}, \
                last_checked_at=now() \
          WHERE patch_key='${RECON_PATCH_KEY_SQL}';" >/dev/null 2>&1 || true
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; \
         UPDATE schema_patch_runs \
            SET patch_status='failed', \
                error='${_err_sql}', \
                finished_at=now(), \
                duration_ms=${_duration_ms} \
          WHERE run_id='${RECON_RUN_ID_SQL}';" >/dev/null 2>&1 || true
      rm -f "${POSTSCHEMA_READY_FILE}" "${POSTSCHEMA_DB_READY_FILE}" >/dev/null 2>&1 || true
      touch "${POSTSCHEMA_FAILED_FILE}" >/dev/null 2>&1 || true
      return 0
    }
    trap '_reconcile_mark_failed "$?"' EXIT

    # 2) Check sentinel; skip schema patch if already applied
    PATCH_KEY="github_profile_cols_v1"
    SKIP_PATCH="0"
    # IMPORTANT: do not prepend `SET search_path ...;` in `-Atc` queries.
    # psql prints `SET` to stdout, which pollutes captured values.
    ALREADY="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM directus.schema_patch_log WHERE patch_key='${PATCH_KEY}' LIMIT 1;" || true)"
    
    if [ "$ALREADY" = "1" ]; then
      echo "✅ Patch already applied; skipping schema changes."
      SKIP_PATCH="1"
    fi
    
    if [ "$SKIP_PATCH" != "1" ]; then
      # 3) Apply idempotent ALTERs
      echo "🔧 Applying user profile columns…"
      printf '%s\n' \
        'SET search_path TO directus, public;' \
        'ALTER TABLE directus_users' \
        '  ADD COLUMN IF NOT EXISTS github_login    TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_url      TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_company  TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_bio      TEXT,' \
        '  ADD COLUMN IF NOT EXISTS github_metadata JSONB;' \
      | psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1
    
      # 4) Record sentinel
      echo "📝 Recording sentinel…"
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; INSERT INTO schema_patch_log (patch_key) VALUES ('${PATCH_KEY}') ON CONFLICT (patch_key) DO NOTHING;"
    fi
    
    # 5) Static tokens are provisioned via service users (directus_users.token) in the site bootstrap below.
    echo "🔐 Provisioning Directus static tokens via site service users..."
    
    # Migrate legacy "demo_*" collection names to production "cms_*" names.
    # This keeps existing data while removing demo naming from runtime/editor usage.
    echo "🧱 Migrating legacy demo_* collection names to cms_*..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       DO \$\$ \
       BEGIN \
         IF to_regclass('directus.cms_pages') IS NULL AND to_regclass('directus.demo_pages') IS NOT NULL THEN \
           ALTER TABLE demo_pages RENAME TO cms_pages; \
         END IF; \
         IF to_regclass('directus.cms_page_blocks') IS NULL AND to_regclass('directus.demo_page_blocks') IS NOT NULL THEN \
           ALTER TABLE demo_page_blocks RENAME TO cms_page_blocks; \
         END IF; \
         IF to_regclass('directus.cms_block_rich_text') IS NULL AND to_regclass('directus.demo_block_rich_text') IS NOT NULL THEN \
           ALTER TABLE demo_block_rich_text RENAME TO cms_block_rich_text; \
         END IF; \
         IF to_regclass('directus.cms_block_hero') IS NULL AND to_regclass('directus.demo_block_hero') IS NOT NULL THEN \
           ALTER TABLE demo_block_hero RENAME TO cms_block_hero; \
         END IF; \
         IF to_regclass('directus.cms_layout_templates') IS NULL AND to_regclass('directus.demo_layout_templates') IS NOT NULL THEN \
           ALTER TABLE demo_layout_templates RENAME TO cms_layout_templates; \
         END IF; \
         IF to_regclass('directus.cms_layout_template_slots') IS NULL AND to_regclass('directus.demo_layout_template_slots') IS NOT NULL THEN \
           ALTER TABLE demo_layout_template_slots RENAME TO cms_layout_template_slots; \
         END IF; \
         IF to_regclass('directus.cms_page_blocks') IS NOT NULL THEN \
           UPDATE cms_page_blocks SET collection='cms_block_rich_text' WHERE collection='demo_block_rich_text'; \
           UPDATE cms_page_blocks SET collection='cms_block_hero' WHERE collection='demo_block_hero'; \
         END IF; \
       END \
       \$\$; \
       DO \$\$ \
       BEGIN \
         IF to_regclass('directus.directus_collections') IS NOT NULL THEN \
           UPDATE directus_collections SET collection='cms_pages' WHERE collection='demo_pages'; \
           UPDATE directus_collections SET collection='cms_page_blocks' WHERE collection='demo_page_blocks'; \
           UPDATE directus_collections SET collection='cms_block_rich_text' WHERE collection='demo_block_rich_text'; \
           UPDATE directus_collections SET collection='cms_block_hero' WHERE collection='demo_block_hero'; \
           UPDATE directus_collections SET collection='cms_layout_templates' WHERE collection='demo_layout_templates'; \
           UPDATE directus_collections SET collection='cms_layout_template_slots' WHERE collection='demo_layout_template_slots'; \
         END IF; \
         IF to_regclass('directus.directus_fields') IS NOT NULL THEN \
           UPDATE directus_fields SET collection='cms_pages' WHERE collection='demo_pages'; \
           UPDATE directus_fields SET collection='cms_page_blocks' WHERE collection='demo_page_blocks'; \
           UPDATE directus_fields SET collection='cms_block_rich_text' WHERE collection='demo_block_rich_text'; \
           UPDATE directus_fields SET collection='cms_block_hero' WHERE collection='demo_block_hero'; \
           UPDATE directus_fields SET collection='cms_layout_templates' WHERE collection='demo_layout_templates'; \
           UPDATE directus_fields SET collection='cms_layout_template_slots' WHERE collection='demo_layout_template_slots'; \
         END IF; \
         IF to_regclass('directus.directus_relations') IS NOT NULL THEN \
           UPDATE directus_relations SET many_collection='cms_pages' WHERE many_collection='demo_pages'; \
           UPDATE directus_relations SET many_collection='cms_page_blocks' WHERE many_collection='demo_page_blocks'; \
           UPDATE directus_relations SET many_collection='cms_block_rich_text' WHERE many_collection='demo_block_rich_text'; \
           UPDATE directus_relations SET many_collection='cms_block_hero' WHERE many_collection='demo_block_hero'; \
           UPDATE directus_relations SET many_collection='cms_layout_templates' WHERE many_collection='demo_layout_templates'; \
           UPDATE directus_relations SET many_collection='cms_layout_template_slots' WHERE many_collection='demo_layout_template_slots'; \
           UPDATE directus_relations SET one_collection='cms_pages' WHERE one_collection='demo_pages'; \
           UPDATE directus_relations SET one_collection='cms_page_blocks' WHERE one_collection='demo_page_blocks'; \
           UPDATE directus_relations SET one_collection='cms_block_rich_text' WHERE one_collection='demo_block_rich_text'; \
           UPDATE directus_relations SET one_collection='cms_block_hero' WHERE one_collection='demo_block_hero'; \
           UPDATE directus_relations SET one_collection='cms_layout_templates' WHERE one_collection='demo_layout_templates'; \
           UPDATE directus_relations SET one_collection='cms_layout_template_slots' WHERE one_collection='demo_layout_template_slots'; \
           UPDATE directus_relations \
             SET one_allowed_collections = REPLACE(REPLACE(COALESCE(one_allowed_collections, ''), 'demo_block_rich_text', 'cms_block_rich_text'), 'demo_block_hero', 'cms_block_hero') \
             WHERE COALESCE(one_allowed_collections, '') <> ''; \
         END IF; \
         IF to_regclass('directus.directus_permissions') IS NOT NULL THEN \
           UPDATE directus_permissions SET collection='cms_pages' WHERE collection='demo_pages'; \
           UPDATE directus_permissions SET collection='cms_page_blocks' WHERE collection='demo_page_blocks'; \
           UPDATE directus_permissions SET collection='cms_block_rich_text' WHERE collection='demo_block_rich_text'; \
           UPDATE directus_permissions SET collection='cms_block_hero' WHERE collection='demo_block_hero'; \
           UPDATE directus_permissions SET collection='cms_layout_templates' WHERE collection='demo_layout_templates'; \
           UPDATE directus_permissions SET collection='cms_layout_template_slots' WHERE collection='demo_layout_template_slots'; \
         END IF; \
         IF to_regclass('directus.directus_presets') IS NOT NULL THEN \
           UPDATE directus_presets SET collection='cms_pages' WHERE collection='demo_pages'; \
           UPDATE directus_presets SET collection='cms_page_blocks' WHERE collection='demo_page_blocks'; \
           UPDATE directus_presets SET collection='cms_block_rich_text' WHERE collection='demo_block_rich_text'; \
           UPDATE directus_presets SET collection='cms_block_hero' WHERE collection='demo_block_hero'; \
           UPDATE directus_presets SET collection='cms_layout_templates' WHERE collection='demo_layout_templates'; \
           UPDATE directus_presets SET collection='cms_layout_template_slots' WHERE collection='demo_layout_template_slots'; \
         END IF; \
       END \
       \$\$;"
    
    # Ensure multi-site columns exist for GitOps-managed row-level site filters.
    # This is idempotent and safe to run every startup.
    echo "🧱 Ensuring multi-site columns exist..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       ALTER TABLE IF EXISTS cms_pages ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_pages ADD COLUMN IF NOT EXISTS layout_template_key TEXT; \
       ALTER TABLE IF EXISTS cms_pages ADD COLUMN IF NOT EXISTS theme_package_key TEXT; \
       ALTER TABLE IF EXISTS cms_pages ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_page_blocks ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_page_blocks ADD COLUMN IF NOT EXISTS page_slug TEXT; \
       ALTER TABLE IF EXISTS cms_page_blocks ADD COLUMN IF NOT EXISTS slot TEXT; \
       ALTER TABLE IF EXISTS cms_page_blocks ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_block_rich_text ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_block_rich_text ADD COLUMN IF NOT EXISTS page_slug TEXT; \
       ALTER TABLE IF EXISTS cms_block_rich_text ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_block_hero ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_block_hero ADD COLUMN IF NOT EXISTS page_slug TEXT; \
       ALTER TABLE IF EXISTS cms_block_hero ADD COLUMN IF NOT EXISTS refresh_target TEXT; \
       ALTER TABLE IF EXISTS cms_block_module ADD COLUMN IF NOT EXISTS site_key TEXT; \
       ALTER TABLE IF EXISTS cms_block_module ADD COLUMN IF NOT EXISTS page_slug TEXT; \
       ALTER TABLE IF EXISTS cms_block_module ADD COLUMN IF NOT EXISTS refresh_target TEXT;"
    
    # Allow each site to have its own homepage slug (e.g. both can use "home").
    echo "🧱 Ensuring per-site slug uniqueness..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_constraint \
           WHERE conname IN ('cms_pages_slug_unique', 'demo_pages_slug_unique') \
             AND conrelid = 'directus.cms_pages'::regclass \
         ) THEN \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='cms_pages_slug_unique' AND conrelid='directus.cms_pages'::regclass) THEN \
             ALTER TABLE cms_pages DROP CONSTRAINT cms_pages_slug_unique; \
           END IF; \
           IF EXISTS (SELECT 1 FROM pg_constraint WHERE conname='demo_pages_slug_unique' AND conrelid='directus.cms_pages'::regclass) THEN \
             ALTER TABLE cms_pages DROP CONSTRAINT demo_pages_slug_unique; \
           END IF; \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM pg_constraint \
           WHERE conname IN ('cms_pages_site_slug_unique', 'demo_pages_site_slug_unique') \
             AND conrelid = 'directus.cms_pages'::regclass \
         ) THEN \
           ALTER TABLE cms_pages ADD CONSTRAINT cms_pages_site_slug_unique UNIQUE (site_key, slug); \
         END IF; \
         IF NOT EXISTS ( \
           SELECT 1 \
           FROM pg_constraint \
           WHERE conname IN ('cms_page_blocks_collection_item_unique', 'demo_page_blocks_collection_item_unique') \
             AND conrelid = 'directus.cms_page_blocks'::regclass \
         ) THEN \
           IF NOT EXISTS ( \
             SELECT 1 \
             FROM cms_page_blocks \
             GROUP BY collection, item \
             HAVING COUNT(*) > 1 \
           ) THEN \
             ALTER TABLE cms_page_blocks ADD CONSTRAINT cms_page_blocks_collection_item_unique UNIQUE (collection, item); \
           ELSE \
             RAISE NOTICE 'Skipping cms_page_blocks_collection_item_unique due to duplicate (collection,item) rows'; \
           END IF; \
         END IF; \
       END \
       \$\$;"
    
    # Keep derived site metadata on junction/content rows aligned to the page they belong to.
