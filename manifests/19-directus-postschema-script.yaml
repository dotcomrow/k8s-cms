    # 5c) Provision site-specific roles/policies/users/tokens/permissions (GitOps-driven).
    # - Keycloak `azp` (client id) -> Vault token -> Directus service user token.
    # - GraphQL schema/actions are permission-filtered; seed baseline read perms per site policy.
    echo "🧭 Provisioning Directus sites (roles/policies/users/permissions)..."
    SITES_FILE="/directus-sites/sites.yaml"
    if [ -f "$SITES_FILE" ]; then
      SITES_JSON="$(yq -o=json '.' "$SITES_FILE" 2>/dev/null || true)"
      if printf '%s' "$SITES_JSON" | jq -e '.sites | type=="array" and length>0' >/dev/null 2>&1; then
        ROLE_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_roles' ORDER BY column_name;" || true)"
        _has_role_col() { printf '%s\n' "$ROLE_COLS_ALL" | grep -qx "$1"; }
    
        POLICY_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_policies' LIMIT 1;" || true)"
        POLICY_COLS_ALL=""
        if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
          POLICY_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_policies' ORDER BY column_name;" || true)"
        fi
        _has_policy_col() { printf '%s\n' "$POLICY_COLS_ALL" | grep -qx "$1"; }
    
        ACCESS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_access' LIMIT 1;" || true)"
        ACCESS_COLS_ALL=""
        if [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
          ACCESS_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_access' ORDER BY column_name;" || true)"
        fi
        _has_access_col() { printf '%s\n' "$ACCESS_COLS_ALL" | grep -qx "$1"; }
    
        USER_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
        _has_user_col() { printf '%s\n' "$USER_COLS_ALL" | grep -qx "$1"; }
    
        PERM_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_permissions' LIMIT 1;" || true)"
        PERM_COLS_ALL=""
        PERM_FIELDS_TYPE=""
        PERMISSIONS_TYPE=""
        VALIDATION_TYPE=""
        PRESETS_TYPE=""
        PERM_ID_DEFAULT=""
        PERM_ID_HAS_DEFAULT="0"
        PERM_PRINC_COL=""
        if [ "${PERM_TABLE_EXISTS:-0}" = "1" ]; then
          PERM_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' ORDER BY column_name;" || true)"
          _has_perm_col() { printf '%s\n' "$PERM_COLS_ALL" | grep -qx "$1"; }
          PERM_FIELDS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type || ':' || udt_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='fields' LIMIT 1;" || true)"
          PERMISSIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='permissions' LIMIT 1;" || true)"
          VALIDATION_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='validation' LIMIT 1;" || true)"
          PRESETS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='presets' LIMIT 1;" || true)"
          PERM_ID_DEFAULT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_default FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='id' LIMIT 1;" || true)"
          if [ -n "${PERM_ID_DEFAULT:-}" ] && [ "${PERM_ID_DEFAULT}" != "null" ]; then
            PERM_ID_HAS_DEFAULT="1"
          fi
          if _has_perm_col "policy"; then
            PERM_PRINC_COL="policy"
          elif _has_perm_col "role"; then
            PERM_PRINC_COL="role"
          elif _has_perm_col "role_id"; then
            PERM_PRINC_COL="role_id"
          elif _has_perm_col "policy_id"; then
            PERM_PRINC_COL="policy_id"
          fi
        else
          _has_perm_col() { return 1; }
        fi
    
        _json_empty_for_type() {
          _t="$1"
          case "$_t" in
            jsonb) printf "'{}'::jsonb" ;;
            json) printf "'{}'::json" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _fields_value_for_type() {
          _t="$1"
          case "$_t" in
            ARRAY:*) printf "ARRAY['*']::text[]" ;;
            jsonb:*|jsonb) printf "'[\"*\"]'::jsonb" ;;
            json:*|json) printf "'[\"*\"]'::json" ;;
            text:*|text|character\ varying:*|character\ varying) printf "'*'" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _json_value_for_type() {
          _t="$1"
          _json="$2"
          if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
            _json_empty_for_type "$_t"
            return
          fi
          _json_compact="$(printf '%s' "$_json" | jq -c '.' 2>/dev/null || true)"
          if [ -z "${_json_compact:-}" ] || [ "${_json_compact}" = "null" ]; then
            _json_empty_for_type "$_t"
            return
          fi
          _json_sql="$(printf '%s' "$_json_compact" | sed "s/'/''/g")"
          case "$_t" in
            jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
            json) printf "'%s'::json" "$_json_sql" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _fields_value_from_config_for_type() {
          _t="$1"
          _cfg="$2"
          if [ -z "${_cfg:-}" ] || [ "${_cfg}" = "null" ]; then
            _fields_value_for_type "$_t"
            return
          fi
          _fields_json="$(printf '%s' "$_cfg" | jq -c 'if type=="array" then map(tostring) elif type=="string" then [.] else null end' 2>/dev/null || true)"
          if [ -z "${_fields_json:-}" ] || [ "${_fields_json}" = "null" ]; then
            _fields_value_for_type "$_t"
            return
          fi
          case "$_t" in
            ARRAY:*)
              _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
              if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                printf "ARRAY['*']::text[]"
              else
                _arr_sql="$(printf '%s' "$_csv" | sed "s/'/''/g;s/,/','/g")"
                printf "ARRAY['%s']::text[]" "$_arr_sql"
              fi
              ;;
            jsonb:*|jsonb)
              _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
              printf "'%s'::jsonb" "$_fields_sql"
              ;;
            json:*|json)
              _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
              printf "'%s'::json" "$_fields_sql"
              ;;
            text:*|text|character\ varying:*|character\ varying)
              _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
              if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                _csv='*'
              fi
              _csv_sql="$(printf '%s' "$_csv" | sed "s/'/''/g")"
              printf "'%s'" "$_csv_sql"
              ;;
            *)
              printf "NULL"
              ;;
          esac
        }
    
        DIRECTUS_API_BASE="http://127.0.0.1:8055"
        DIRECTUS_ACCESS_TOKEN=""
        _directus_api_enabled="0"
        DIRECTUS_API_CONNECT_TIMEOUT_SECONDS="${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS:-5}"
        DIRECTUS_API_MAX_TIME_SECONDS="${DIRECTUS_API_MAX_TIME_SECONDS:-20}"
    
        _directus_api_get() {
          _path="$1"
          shift || true
          curl -sS -f \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
            --get "${DIRECTUS_API_BASE}${_path}" "$@"
        }
    
        _directus_api_write() {
          _method="$1"
          _path="$2"
          _payload="$3"
          curl -sS -f -X "${_method}" \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${_payload}" \
            "${DIRECTUS_API_BASE}${_path}"
        }
    
        _directus_find_flow_id_by_name() {
          _name="$1"
          _id="$(_directus_api_get "/flows" \
            --data-urlencode "filter[name][_eq]=${_name}" \
            --data-urlencode "limit=1" \
            --data-urlencode "fields=id" \
            2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
          printf '%s' "${_id:-}"
        }
    
        _directus_find_operation_id() {
          _flow_id="$1"
          _key="$2"
          _id="$(_directus_api_get "/operations" \
            --data-urlencode "filter[flow][_eq]=${_flow_id}" \
            --data-urlencode "filter[key][_eq]=${_key}" \
            --data-urlencode "limit=1" \
            --data-urlencode "fields=id" \
            2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
          printf '%s' "${_id:-}"
        }
    
        _directus_upsert_operation() {
          _flow_id="$1"
          _op_key="$2"
          _op_type="$3"
          _op_name="$4"
          _pos_x="$5"
          _pos_y="$6"
          _options_json="$7"
    
          _op_id="$(_directus_find_operation_id "${_flow_id}" "${_op_key}")"
          _create_payload="$(jq -nc \
            --arg flow "${_flow_id}" \
            --arg key "${_op_key}" \
            --arg type "${_op_type}" \
            --arg name "${_op_name}" \
            --argjson position_x "${_pos_x}" \
            --argjson position_y "${_pos_y}" \
            --argjson options "${_options_json}" \
            '{flow:$flow,key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options}')"
          _update_payload="$(jq -nc \
            --arg key "${_op_key}" \
            --arg type "${_op_type}" \
            --arg name "${_op_name}" \
            --argjson position_x "${_pos_x}" \
            --argjson position_y "${_pos_y}" \
            --argjson options "${_options_json}" \
            '{key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options}')"
    
          if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
            _attempt=1
            _max_attempts=8
            while [ "${_attempt}" -le "${_max_attempts}" ]; do
              if _directus_api_write "PATCH" "/operations/${_op_id}" "${_update_payload}" >/tmp/directus-op-upsert.json 2>/dev/null; then
                break
              fi
              sleep 1
              _attempt=$(( _attempt + 1 ))
            done
            printf '%s' "${_op_id}"
            return
          fi
    
          _attempt=1
          _max_attempts=8
          _op_id=""
          while [ "${_attempt}" -le "${_max_attempts}" ]; do
            _created="$(_directus_api_write "POST" "/operations" "${_create_payload}" 2>/dev/null || true)"
            _op_id="$(printf '%s' "${_created}" | jq -r '.data.id // empty' 2>/dev/null || true)"
            if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
              break
            fi
            _op_id="$(_directus_find_operation_id "${_flow_id}" "${_op_key}")"
            if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
              break
            fi
            sleep 1
            _attempt=$(( _attempt + 1 ))
          done
          printf '%s' "${_op_id:-}"
        }
    
        _directus_set_operation_links() {
          _op_id="$1"
          _resolve="$2"
          _reject="$3"
          if [ -z "${_op_id:-}" ] || [ "${_op_id}" = "null" ]; then
            return 0
          fi
          _op_id_sql="$(printf '%s' "${_op_id}" | sed "s/'/''/g")"
          _resolve_sql="NULL"
          _reject_sql="NULL"
          if [ -n "${_resolve:-}" ] && [ "${_resolve}" != "null" ]; then
            _resolve_sql="'$(printf '%s' "${_resolve}" | sed "s/'/''/g")'"
          fi
          if [ -n "${_reject:-}" ] && [ "${_reject}" != "null" ]; then
            _reject_sql="'$(printf '%s' "${_reject}" | sed "s/'/''/g")'"
          fi
          _payload="$(jq -nc --arg resolve "${_resolve}" --arg reject "${_reject}" \
            '{} | (if $resolve != "" and $resolve != "null" then .resolve=$resolve else . end) | (if $reject != "" and $reject != "null" then .reject=$reject else . end)')"

          # Directus enforces unique(resolve) and unique(reject) on directus_operations.
          # Clear conflicting links within the same flow before writing this operation's links.
          if [ "${_resolve_sql}" != "NULL" ]; then
            if ! _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET resolve=NULL WHERE id<>'${_op_id_sql}' AND flow=(SELECT flow FROM directus_operations WHERE id='${_op_id_sql}') AND resolve=${_resolve_sql};" \
              "clear conflicting resolve link for ${_op_id}"; then
              echo "⚠️ Unable to clear conflicting resolve links for operation '${_op_id}'"
            fi
          fi
          if [ "${_reject_sql}" != "NULL" ]; then
            if ! _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET reject=NULL WHERE id<>'${_op_id_sql}' AND flow=(SELECT flow FROM directus_operations WHERE id='${_op_id_sql}') AND reject=${_reject_sql};" \
              "clear conflicting reject link for ${_op_id}"; then
              echo "⚠️ Unable to clear conflicting reject links for operation '${_op_id}'"
            fi
          fi

          if [ "${_payload}" = "{}" ]; then
            if _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET resolve=${_resolve_sql}, reject=${_reject_sql} WHERE id='${_op_id_sql}';" \
              "clear operation links ${_op_id}"; then
              return 0
            fi
          fi
          _attempt=1
          _max_attempts=3
          while [ "${_attempt}" -le "${_max_attempts}" ]; do
            _directus_api_write "PATCH" "/operations/${_op_id}" "${_payload}" >/tmp/directus-op-links.json 2>/dev/null || true
            _current="$(_directus_api_get "/operations/${_op_id}" --data-urlencode "fields=resolve,reject" 2>/dev/null || true)"
            _current_resolve="$(printf '%s' "${_current}" | jq -r '.data.resolve // empty' 2>/dev/null || true)"
            _current_reject="$(printf '%s' "${_current}" | jq -r '.data.reject // empty' 2>/dev/null || true)"
            if [ "${_current_resolve}" = "${_resolve}" ] && [ "${_current_reject}" = "${_reject}" ]; then
              return 0
            fi
            sleep 1
            _attempt=$(( _attempt + 1 ))
          done
          if _psql_yb_retry \
            "SET search_path TO directus, public; UPDATE directus_operations SET resolve=${_resolve_sql}, reject=${_reject_sql} WHERE id='${_op_id_sql}';" \
            "set operation links ${_op_id}"; then
            return 0
          fi
          echo "⚠️ Failed to persist links for operation '${_op_id}' (resolve='${_resolve}', reject='${_reject}') after retries"
          return 0
        }
    
        _vault_kv_read_field() {
          _path="$1"
          _field="$2"
          if [ -z "${_path:-}" ] || [ "${_path}" = "null" ] || [ -z "${_field:-}" ] || [ "${_field}" = "null" ]; then
            return 1
          fi
          _response="$(curl -sS -f -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${_path}" 2>/dev/null || true)"
          if [ -z "${_response:-}" ]; then
            return 1
          fi
          _value="$(printf '%s' "${_response}" | jq -r --arg field "${_field}" '.data.data[$field] // empty' 2>/dev/null || true)"
          _value="$(printf '%s' "${_value}" | tr -d '\r')"
          if [ -z "${_value:-}" ] || [ "${_value}" = "null" ]; then
            return 1
          fi
          printf '%s' "${_value}"
        }
    
        _urlencode_value() {
          _raw="$1"
          jq -nr --arg v "${_raw}" '$v|@uri' 2>/dev/null || true
        }
    
        _directus_verify_token() {
          _candidate="$1"
          if [ -z "${_candidate:-}" ] || [ "${_candidate}" = "null" ]; then
            return 1
          fi
          _verify_code="$(curl -sS -o /tmp/directus-token-verify.json -w '%{http_code}' \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${_candidate}" \
            "${DIRECTUS_API_BASE}/users/me" || true)"
          [ "${_verify_code}" = "200" ]
        }

        echo "⏳ Waiting for Directus /server/health before API flow reconciliation..."
        _directus_wait_attempt=0
        _directus_wait_max=200
        until curl -sf --connect-timeout 3 --max-time 5 http://127.0.0.1:8055/server/health >/dev/null; do
          _directus_wait_attempt=$((_directus_wait_attempt + 1))
          if [ "${_directus_wait_attempt}" -ge "${_directus_wait_max}" ]; then
            echo "⚠️ Timed out waiting for Directus health endpoint; continuing with best-effort API flow reconciliation."
            break
          fi
          echo "  .. Directus not ready yet"
          sleep 3
        done
        if [ "${_directus_wait_attempt}" -lt "${_directus_wait_max}" ]; then
          echo "✅ Directus is healthy for API flow reconciliation"
        fi
    
        echo "🔐 Preparing Directus API token for flow provisioning..."
        DIRECTUS_FLOW_API_TOKEN_VAULT_PATH="${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/flows/admin}"
    
        FLOW_TOKEN_CODE="$(curl -sS -o /tmp/directus-flow-token.json -w '%{http_code}' \
          -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
        if [ "${FLOW_TOKEN_CODE}" = "200" ]; then
          DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.data.token // empty' /tmp/directus-flow-token.json 2>/dev/null || true)"
        fi
    
        if _directus_verify_token "${DIRECTUS_ACCESS_TOKEN:-}"; then
          _directus_api_enabled="1"
          echo "✅ Directus API token acquired from Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
        else
          FLOW_ADMIN_TOKEN=""
          if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
            echo "⚠️ Vault token at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH} is invalid for Directus API; rotating token"
          else
            echo "ℹ️ No Directus API token found at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}; creating one"
          fi
    
          if _has_user_col "token"; then
            FLOW_ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
            FLOW_ADMIN_ROLE_ID="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | tr -d '\r')"
            if [ -n "${FLOW_ADMIN_ROLE_ID:-}" ] && [ "${FLOW_ADMIN_ROLE_ID}" != "null" ]; then
              # Ensure Administrator role has an attached admin/app policy before token verification.
              if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ] && [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
                FLOW_ADMIN_POLICY_WHERE="LOWER(name)=LOWER('Policy for Administrator')"
                if _has_policy_col "admin_access"; then FLOW_ADMIN_POLICY_WHERE="${FLOW_ADMIN_POLICY_WHERE} AND admin_access=true"; fi
                if _has_policy_col "app_access"; then FLOW_ADMIN_POLICY_WHERE="${FLOW_ADMIN_POLICY_WHERE} AND app_access=true"; fi
                FLOW_ADMIN_POLICY_ORDER="id DESC"
                if _has_policy_col "date_created"; then FLOW_ADMIN_POLICY_ORDER="date_created DESC NULLS LAST, id DESC"; fi
                FLOW_ADMIN_POLICY_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT id FROM directus.directus_policies WHERE ${FLOW_ADMIN_POLICY_WHERE} ORDER BY ${FLOW_ADMIN_POLICY_ORDER} LIMIT 1;" || true)"
                FLOW_ADMIN_POLICY_ID="$(printf '%s' "$FLOW_ADMIN_POLICY_ID" | tr -d '\r')"

                if [ -z "${FLOW_ADMIN_POLICY_ID:-}" ] || [ "${FLOW_ADMIN_POLICY_ID}" = "null" ]; then
                  FLOW_ADMIN_POLICY_ID="$(cat /proc/sys/kernel/random/uuid)"
                  FPCOLS="id,name"
                  FPVALS="'${FLOW_ADMIN_POLICY_ID}','Policy for Administrator'"
                  if _has_policy_col "description"; then FPCOLS="${FPCOLS},description"; FPVALS="${FPVALS},'Admin policy for flow provisioning'"; fi
                  if _has_policy_col "icon"; then FPCOLS="${FPCOLS},icon"; FPVALS="${FPVALS},'verified'"; fi
                  if _has_policy_col "admin_access"; then FPCOLS="${FPCOLS},admin_access"; FPVALS="${FPVALS},true"; fi
                  if _has_policy_col "app_access"; then FPCOLS="${FPCOLS},app_access"; FPVALS="${FPVALS},true"; fi
                  if _has_policy_col "enforce_tfa"; then FPCOLS="${FPCOLS},enforce_tfa"; FPVALS="${FPVALS},false"; fi
                  if _has_policy_col "ip_access"; then FPCOLS="${FPCOLS},ip_access"; FPVALS="${FPVALS},NULL"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_policies (${FPCOLS}) VALUES (${FPVALS});"
                  echo "✅ Created fallback admin policy for flow provisioning"
                fi

                FLOW_ACCESS_WHERE="role='${FLOW_ADMIN_ROLE_ID}' AND policy='${FLOW_ADMIN_POLICY_ID}'"
                if _has_access_col "user"; then FLOW_ACCESS_WHERE="${FLOW_ACCESS_WHERE} AND \"user\" IS NULL"; fi
                _FLOW_ACCESS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus.directus_access WHERE ${FLOW_ACCESS_WHERE} LIMIT 1;" || true)"
                _FLOW_ACCESS_EXISTS="$(printf '%s' "$_FLOW_ACCESS_EXISTS" | tr -d '\r')"
                if [ "${_FLOW_ACCESS_EXISTS}" != "1" ]; then
                  FACOLS="id,policy,role"
                  FAVALS="'$(cat /proc/sys/kernel/random/uuid)','${FLOW_ADMIN_POLICY_ID}','${FLOW_ADMIN_ROLE_ID}'"
                  if _has_access_col "user"; then FACOLS="${FACOLS},\"user\""; FAVALS="${FAVALS},NULL"; fi
                  if _has_access_col "sort"; then FACOLS="${FACOLS},sort"; FAVALS="${FAVALS},NULL"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_access (${FACOLS}) VALUES (${FAVALS});"
                  echo "✅ Linked Administrator role to admin policy for flow provisioning"
                fi
              fi

              flow_admin_email="svc-flow-admin@svc.local"
              flow_admin_email_sql="$(printf '%s' "$flow_admin_email" | sed "s/'/''/g")"
              FLOW_ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_users WHERE email = '${flow_admin_email_sql}' LIMIT 1;" || true)"
              FLOW_ADMIN_USER_ID="$(printf '%s' "$FLOW_ADMIN_USER_ID" | tr -d '\r')"
    
              FLOW_ADMIN_TOKEN="${DIRECTUS_ACCESS_TOKEN:-}"
              if [ -z "${FLOW_ADMIN_TOKEN:-}" ] || [ "${FLOW_ADMIN_TOKEN}" = "null" ]; then
                FLOW_ADMIN_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
              fi
              flow_admin_role_sql="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | sed "s/'/''/g")"
              flow_admin_token_sql="$(printf '%s' "$FLOW_ADMIN_TOKEN" | sed "s/'/''/g")"
    
              if [ -z "${FLOW_ADMIN_USER_ID:-}" ] || [ "${FLOW_ADMIN_USER_ID}" = "null" ]; then
                FLOW_ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                UCOLS="id,email"
                UVALS="'${FLOW_ADMIN_USER_ID}','${flow_admin_email_sql}'"
                if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${flow_admin_role_sql}'"; fi
                if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${flow_admin_token_sql}'"; fi
                if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'flow-admin'"; fi
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                echo "✅ Created flow admin service user ${flow_admin_email}"
              else
                flow_admin_user_id_sql="$(printf '%s' "$FLOW_ADMIN_USER_ID" | sed "s/'/''/g")"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE directus_users SET role='${flow_admin_role_sql}', token='${flow_admin_token_sql}', status='active' WHERE id='${flow_admin_user_id_sql}';"
                echo "✅ Updated flow admin service user ${flow_admin_email}"
              fi
    
              payload="$(jq -nc --arg t "$FLOW_ADMIN_TOKEN" '{data:{token:$t}}')"
              FLOW_TOKEN_WRITE_CODE="$(curl -sS -o /tmp/directus-flow-token-write.json -w '%{http_code}' -X POST \
                -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                -d "${payload}" "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
              if [ "${FLOW_TOKEN_WRITE_CODE}" = "200" ] || [ "${FLOW_TOKEN_WRITE_CODE}" = "204" ]; then
                echo "✅ Directus flow API token stored in Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
              else
                echo "⚠️ Failed to write Directus flow API token to Vault (HTTP ${FLOW_TOKEN_WRITE_CODE})"
              fi
    
              if _directus_verify_token "${FLOW_ADMIN_TOKEN:-}"; then
                DIRECTUS_ACCESS_TOKEN="${FLOW_ADMIN_TOKEN}"
                _directus_api_enabled="1"
                echo "✅ Directus API token prepared for flow reconciliation"
              else
                echo "⚠️ Generated Directus flow token did not authenticate; will attempt legacy login fallback"
              fi
            else
              echo "⚠️ Administrator role not found; cannot mint Directus API token for flow reconciliation"
            fi
          else
            echo "⚠️ directus_users.token column not found; cannot mint Directus API token for flow reconciliation"
          fi
        fi

        # Retry token verification briefly to absorb startup auth propagation races.
        if [ "${_directus_api_enabled}" != "1" ] && [ -n "${FLOW_ADMIN_TOKEN:-}" ] && [ "${FLOW_ADMIN_TOKEN}" != "null" ]; then
          _verify_retry=0
          while [ "${_verify_retry}" -lt 10 ]; do
            if _directus_verify_token "${FLOW_ADMIN_TOKEN}"; then
              DIRECTUS_ACCESS_TOKEN="${FLOW_ADMIN_TOKEN}"
              _directus_api_enabled="1"
              echo "✅ Directus API token became valid after retry (${_verify_retry})"
              break
            fi
            _verify_retry=$(( _verify_retry + 1 ))
            sleep 2
          done
        fi

        # Fallback for environments that still allow local email/password auth.
        if [ "${_directus_api_enabled}" != "1" ]; then
          ADMIN_CREDS_CODE="$(curl -sS -o /tmp/directus-admin-creds.json -w '%{http_code}' \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/secret/data/directus/admin" || true)"
          if [ "${ADMIN_CREDS_CODE}" = "200" ]; then
            DIRECTUS_ADMIN_EMAIL="$(jq -r '.data.data.email // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
            DIRECTUS_ADMIN_PASSWORD="$(jq -r '.data.data.password // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
            if [ -n "${DIRECTUS_ADMIN_EMAIL:-}" ] && [ -n "${DIRECTUS_ADMIN_PASSWORD:-}" ] \
              && [ "${DIRECTUS_ADMIN_EMAIL}" != "null" ] && [ "${DIRECTUS_ADMIN_PASSWORD}" != "null" ]; then
              LOGIN_PAYLOAD="$(jq -nc --arg email "${DIRECTUS_ADMIN_EMAIL}" --arg password "${DIRECTUS_ADMIN_PASSWORD}" '{email:$email,password:$password}')"
              LOGIN_CODE="$(curl -sS -o /tmp/directus-login.json -w '%{http_code}' -X POST \
                -H "Content-Type: application/json" \
                -d "${LOGIN_PAYLOAD}" \
                "${DIRECTUS_API_BASE}/auth/login" || true)"
              if [ "${LOGIN_CODE}" = "200" ]; then
                DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.access_token // empty' /tmp/directus-login.json 2>/dev/null || true)"
                if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
                  _directus_api_enabled="1"
                  echo "✅ Directus API token acquired from /auth/login fallback"
                else
                  echo "⚠️ Directus login succeeded but no access_token returned; skipping flow reconciliation"
                fi
              else
                echo "⚠️ Directus login fallback failed (HTTP ${LOGIN_CODE}); skipping flow reconciliation"
              fi
            else
              echo "⚠️ Vault secret secret/data/directus/admin missing email/password; skipping flow reconciliation"
            fi
          else
            echo "⚠️ Could not read secret/data/directus/admin from Vault (HTTP ${ADMIN_CREDS_CODE}); skipping flow reconciliation"
          fi
        fi
    
        printf '%s' "$SITES_JSON" | jq -c '.sites[]' | while IFS= read -r site; do
          site_key="$(printf '%s' "$site" | jq -r '.site_key // .key // empty')"
          homepage_slug="$(printf '%s' "$site" | jq -r '.homepage_slug // "home"')"
          homepage_layout_template_key="$(printf '%s' "$site" | jq -r '.homepage_layout_template_key // .layout_template_key // "spa-default"')"
          homepage_theme_package_key="$(printf '%s' "$site" | jq -r '.homepage_theme_package_key // .theme_package_key // empty')"
          client_key="$(printf '%s' "$site" | jq -r '.client_key // .clientId // empty')"
          role_name="$(printf '%s' "$site" | jq -r '.role_name // .role // empty')"
    
          if [ -z "${client_key:-}" ] || [ "${client_key}" = "null" ]; then
            echo "⚠️  site entry missing client_key; skipping (site_key=${site_key})"
            continue
          fi
          if [ -z "${role_name:-}" ] || [ "${role_name}" = "null" ]; then
            role_name="$client_key"
          fi
          if ! printf '%s' "$client_key" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "⚠️  invalid client_key '${client_key}' (site_key=${site_key}); skipping"
            continue
          fi
    
          if [ -z "${homepage_slug:-}" ] || [ "${homepage_slug}" = "null" ]; then
            homepage_slug="home"
          fi
          if [ -z "${homepage_layout_template_key:-}" ] || [ "${homepage_layout_template_key}" = "null" ]; then
            homepage_layout_template_key=""
          fi
          if [ -z "${homepage_theme_package_key:-}" ] || [ "${homepage_theme_package_key}" = "null" ]; then
            homepage_theme_package_key=""
          fi

          # Ensure each site has a homepage row keyed by (site_key, homepage_slug).
          # If absent, claim an unscoped page first; otherwise clone page metadata from any existing slug match.
          if [ -n "${site_key:-}" ] && [ "${site_key}" != "null" ]; then
            site_key_sql="$(printf '%s' "$site_key" | sed "s/'/''/g")"
            homepage_slug_sql="$(printf '%s' "$homepage_slug" | sed "s/'/''/g")"
            homepage_layout_template_key_sql=""
            homepage_layout_template_value_sql="NULL"
            homepage_theme_package_key_sql=""
            homepage_theme_package_value_sql="NULL"
            if [ -n "${homepage_layout_template_key:-}" ]; then
              homepage_layout_template_key_sql="$(printf '%s' "$homepage_layout_template_key" | sed "s/'/''/g")"
              homepage_layout_template_value_sql="'${homepage_layout_template_key_sql}'"
            fi
            if [ -n "${homepage_theme_package_key:-}" ]; then
              homepage_theme_package_key_sql="$(printf '%s' "$homepage_theme_package_key" | sed "s/'/''/g")"
              homepage_theme_package_value_sql="'${homepage_theme_package_key_sql}'"
            fi
    
            HOME_PAGE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.cms_pages WHERE site_key='${site_key_sql}' AND slug='${homepage_slug_sql}' LIMIT 1;" || true)"
            HOME_PAGE_ID="$(printf '%s' "$HOME_PAGE_ID" | tr -d '\r')"
    
            if [ -z "${HOME_PAGE_ID:-}" ] || [ "${HOME_PAGE_ID}" = "null" ]; then
              UNSCOPED_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.cms_pages WHERE slug='${homepage_slug_sql}' AND (site_key IS NULL OR site_key='') ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST LIMIT 1;" || true)"
              UNSCOPED_ID="$(printf '%s' "$UNSCOPED_ID" | tr -d '\r')"
    
              if [ -n "${UNSCOPED_ID:-}" ] && [ "${UNSCOPED_ID}" != "null" ]; then
                unscoped_id_sql="$(printf '%s' "$UNSCOPED_ID" | sed "s/'/''/g")"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE cms_pages SET site_key='${site_key_sql}' WHERE id='${unscoped_id_sql}';"
                HOME_PAGE_ID="$UNSCOPED_ID"
                echo "✅ Assigned existing homepage slug='${homepage_slug}' to site_key='${site_key}'"
              else
                SEED_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT id FROM directus.cms_pages WHERE slug='${homepage_slug_sql}' ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST LIMIT 1;" || true)"
                SEED_ID="$(printf '%s' "$SEED_ID" | tr -d '\r')"
                NEW_HOME_ID="$(cat /proc/sys/kernel/random/uuid)"
                new_home_sql="$(printf '%s' "$NEW_HOME_ID" | sed "s/'/''/g")"
    
                if [ -n "${SEED_ID:-}" ] && [ "${SEED_ID}" != "null" ]; then
                  seed_id_sql="$(printf '%s' "$SEED_ID" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO cms_pages (id, slug, title, status, seo_title, seo_description, parent, site_key, layout_template_key, theme_package_key, refresh_target) SELECT '${new_home_sql}', slug, title, status, seo_title, seo_description, parent, '${site_key_sql}', layout_template_key, theme_package_key, CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM cms_pages WHERE id='${seed_id_sql}';"
    
                  # Clone supported homepage blocks so the new site homepage has immediate content.
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -AtF '|' -c \
                    "SELECT collection, item, COALESCE(sort, 0), COALESCE(NULLIF(LOWER(BTRIM(slot)),''), 'main') FROM directus.cms_page_blocks WHERE page_id='${seed_id_sql}' ORDER BY sort NULLS LAST, id;" \
                    | while IFS='|' read -r blk_collection blk_item blk_sort blk_slot; do
                        [ -z "${blk_collection:-}" ] && continue
                        [ -z "${blk_item:-}" ] && continue
    
                        src_item_sql="$(printf '%s' "$blk_item" | sed "s/'/''/g")"
                        new_item_id="$(cat /proc/sys/kernel/random/uuid)"
                        new_item_sql="$(printf '%s' "$new_item_id" | sed "s/'/''/g")"
                        copied="0"
    
                        case "$blk_collection" in
                          cms_block_rich_text)
                            copied="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                              "WITH ins AS (INSERT INTO directus.cms_block_rich_text (id, status, sort, body, site_key, page_slug, refresh_target) SELECT '${new_item_sql}', status, sort, body, '${site_key_sql}', '${homepage_slug_sql}', CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM directus.cms_block_rich_text WHERE id='${src_item_sql}' RETURNING 1) SELECT COALESCE(COUNT(*),0) FROM ins;" || true)"
                            ;;
                          cms_block_hero)
                            copied="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                              "WITH ins AS (INSERT INTO directus.cms_block_hero (id, status, sort, headline, subheadline, background_image, cta_label, cta_url, site_key, page_slug, refresh_target) SELECT '${new_item_sql}', status, sort, headline, subheadline, background_image, cta_label, cta_url, '${site_key_sql}', '${homepage_slug_sql}', CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM directus.cms_block_hero WHERE id='${src_item_sql}' RETURNING 1) SELECT COALESCE(COUNT(*),0) FROM ins;" || true)"
                            ;;
                          cms_block_module)
                            copied="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                              "WITH ins AS (INSERT INTO directus.cms_block_module (id, status, sort, module_key, props_json, site_key, page_slug, refresh_target) SELECT '${new_item_sql}', status, sort, module_key, COALESCE(props_json, '{}'::jsonb), '${site_key_sql}', '${homepage_slug_sql}', CASE WHEN LOWER(COALESCE(refresh_target, '')) IN ('preview','prod','both') THEN LOWER(refresh_target) ELSE 'both' END FROM directus.cms_block_module WHERE id='${src_item_sql}' RETURNING 1) SELECT COALESCE(COUNT(*),0) FROM ins;" || true)"
                            ;;
                          *)
                            echo "⚠️  skipping unsupported block collection '${blk_collection}' for site_key='${site_key}'"
                            continue
                            ;;
                        esac
    
                        copied="$(printf '%s' "$copied" | tr -d '\r')"
                        if [ "${copied:-0}" != "1" ]; then
                          echo "⚠️  source block item '${blk_item}' missing for collection '${blk_collection}'; skipping"
                          continue
                        fi
    
                        new_pb_id="$(cat /proc/sys/kernel/random/uuid)"
                        new_pb_sql="$(printf '%s' "$new_pb_id" | sed "s/'/''/g")"
                        blk_coll_sql="$(printf '%s' "$blk_collection" | sed "s/'/''/g")"
                        sort_sql="NULL"
                        if [ -n "${blk_sort:-}" ] && [ "${blk_sort}" != "null" ] && printf '%s' "$blk_sort" | grep -Eq '^-?[0-9]+$'; then
                          sort_sql="$blk_sort"
                        fi
                        blk_slot_sql="$(printf '%s' "${blk_slot:-main}" | sed "s/'/''/g")"
                        if [ -z "${blk_slot_sql:-}" ]; then
                          blk_slot_sql="main"
                        fi
                        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                          "SET search_path TO directus, public; INSERT INTO cms_page_blocks (id, page_id, collection, item, sort, slot, site_key, page_slug, refresh_target) VALUES ('${new_pb_sql}', '${new_home_sql}', '${blk_coll_sql}', '${new_item_sql}', ${sort_sql}, '${blk_slot_sql}', '${site_key_sql}', '${homepage_slug_sql}', 'both');"
                      done
    
                  echo "✅ Cloned homepage metadata + supported blocks for site_key='${site_key}'"
                else
                  title_sql="$(printf '%s' "${site_key} Home" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO cms_pages (id, slug, title, status, site_key, layout_template_key, theme_package_key, refresh_target) VALUES ('${new_home_sql}','${homepage_slug_sql}','${title_sql}','published','${site_key_sql}',${homepage_layout_template_value_sql},${homepage_theme_package_value_sql},'both');"
                  echo "✅ Created default homepage for site_key='${site_key}'"
                fi
                HOME_PAGE_ID="$NEW_HOME_ID"
              fi
            fi
    
            # Keep derived metadata aligned for this site's homepage content graph.
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; \
               UPDATE cms_pages p \
               SET refresh_target = CASE \
                 WHEN LOWER(COALESCE(p.refresh_target, '')) IN ('preview','prod','both') THEN LOWER(p.refresh_target) \
                 ELSE 'both' \
               END \
               WHERE p.site_key='${site_key_sql}' \
                 AND p.slug='${homepage_slug_sql}' \
                 AND (p.refresh_target IS NULL OR LOWER(COALESCE(p.refresh_target, '')) NOT IN ('preview','prod','both') OR p.refresh_target <> LOWER(p.refresh_target)); \
               UPDATE cms_page_blocks pb \
               SET site_key = p.site_key, page_slug = p.slug, refresh_target = p.refresh_target, slot = COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main') \
               FROM cms_pages p \
               WHERE pb.page_id = p.id \
                 AND p.site_key='${site_key_sql}' \
                 AND p.slug='${homepage_slug_sql}' \
                 AND (pb.site_key IS DISTINCT FROM p.site_key OR pb.page_slug IS DISTINCT FROM p.slug OR pb.refresh_target IS DISTINCT FROM p.refresh_target OR pb.slot IS DISTINCT FROM COALESCE(NULLIF(LOWER(BTRIM(pb.slot)), ''), 'main')); \
               UPDATE cms_block_rich_text rt \
               SET site_key = pb.site_key, page_slug = pb.page_slug, refresh_target = pb.refresh_target \
               FROM cms_page_blocks pb \
               WHERE pb.collection = 'cms_block_rich_text' \
                 AND pb.item = rt.id::text \
                 AND pb.site_key='${site_key_sql}' \
                 AND pb.page_slug='${homepage_slug_sql}' \
                 AND (rt.site_key IS DISTINCT FROM pb.site_key OR rt.page_slug IS DISTINCT FROM pb.page_slug OR rt.refresh_target IS DISTINCT FROM pb.refresh_target); \
               UPDATE cms_block_hero h \
               SET site_key = pb.site_key, page_slug = pb.page_slug, refresh_target = pb.refresh_target \
               FROM cms_page_blocks pb \
               WHERE pb.collection = 'cms_block_hero' \
                 AND pb.item = h.id::text \
                 AND pb.site_key='${site_key_sql}' \
                 AND pb.page_slug='${homepage_slug_sql}' \
                 AND (h.site_key IS DISTINCT FROM pb.site_key OR h.page_slug IS DISTINCT FROM pb.page_slug OR h.refresh_target IS DISTINCT FROM pb.refresh_target); \
               UPDATE cms_block_module m \
               SET site_key = pb.site_key, page_slug = pb.page_slug, refresh_target = pb.refresh_target \
               FROM cms_page_blocks pb \
               WHERE pb.collection = 'cms_block_module' \
                 AND pb.item = m.id::text \
                 AND pb.site_key='${site_key_sql}' \
                 AND pb.page_slug='${homepage_slug_sql}' \
                 AND (m.site_key IS DISTINCT FROM pb.site_key OR m.page_slug IS DISTINCT FROM pb.page_slug OR m.refresh_target IS DISTINCT FROM pb.refresh_target);"
    
            # Set homepage layout assignment from sites.yaml if configured.
            if [ -n "${homepage_layout_template_key_sql:-}" ]; then
              layout_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT 1 FROM directus.cms_layout_templates WHERE template_key='${homepage_layout_template_key_sql}' AND (site_key='${site_key_sql}' OR site_key IS NULL OR site_key='') ORDER BY CASE WHEN site_key='${site_key_sql}' THEN 0 ELSE 1 END LIMIT 1;" || true)"
              layout_exists="$(printf '%s' "$layout_exists" | tr -d '\r')"
              if [ "$layout_exists" = "1" ]; then
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE cms_pages SET layout_template_key='${homepage_layout_template_key_sql}' WHERE site_key='${site_key_sql}' AND slug='${homepage_slug_sql}' AND (layout_template_key IS DISTINCT FROM '${homepage_layout_template_key_sql}');"
                echo "✅ Set homepage layout '${homepage_layout_template_key}' for site_key='${site_key}'"
              else
                echo "⚠️  homepage layout '${homepage_layout_template_key}' not found for site_key='${site_key}' (or global); leaving page unchanged"
              fi
            fi

            # Set homepage theme assignment from sites.yaml if configured.
            if [ -n "${homepage_theme_package_key_sql:-}" ]; then
              theme_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT 1 FROM directus.cms_theme_packages WHERE theme_key='${homepage_theme_package_key_sql}' AND LOWER(COALESCE(status, 'published'))='published' AND (site_key='${site_key_sql}' OR site_key IS NULL OR site_key='') ORDER BY CASE WHEN site_key='${site_key_sql}' THEN 0 ELSE 1 END LIMIT 1;" || true)"
              theme_exists="$(printf '%s' "$theme_exists" | tr -d '\r')"
              if [ "$theme_exists" = "1" ]; then
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE cms_pages SET theme_package_key='${homepage_theme_package_key_sql}' WHERE site_key='${site_key_sql}' AND slug='${homepage_slug_sql}' AND (theme_package_key IS DISTINCT FROM '${homepage_theme_package_key_sql}');"
                echo "✅ Set homepage theme '${homepage_theme_package_key}' for site_key='${site_key}'"
              else
                echo "⚠️  homepage theme '${homepage_theme_package_key}' not found for site_key='${site_key}' (or global published); leaving page unchanged"
              fi
            fi
          fi
    
          # Ensure a per-client Directus service-user token exists in Vault.
          SITE_TOKEN=""
          SITE_VAULT_PATH="secret/data/directus/gravitee/clients/${client_key}"
          CODE="$(curl -sS -o /tmp/site-token.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
          if [ "$CODE" = "200" ]; then
            SITE_TOKEN="$(jq -r '.data.data.token // empty' /tmp/site-token.json 2>/dev/null || true)"
          fi
          if [ -z "${SITE_TOKEN:-}" ] || [ "${SITE_TOKEN}" = "null" ]; then
            SITE_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
            payload="$(jq -nc --arg t "$SITE_TOKEN" '{data:{token:$t}}')"
            WCODE="$(curl -sS -o /tmp/site-token-write.json -w '%{http_code}' -X POST \
              -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
            if [ "$WCODE" != "200" ] && [ "$WCODE" != "204" ]; then
              echo "⚠️  failed to write Vault token for client_key=${client_key} (HTTP ${WCODE}); skipping"
              continue
            fi
            echo "🔐 Vault token created for client_key=${client_key}"
          fi
    
          # Ensure Directus role exists (create if missing).
          role_name_sql="$(printf '%s' "$role_name" | sed "s/'/''/g")"
          ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.directus_roles WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
          ROLE_ID="$(printf '%s' "$ROLE_ID" | tr -d '\r')"
          if [ -z "${ROLE_ID:-}" ] || [ "${ROLE_ID}" = "null" ]; then
            ROLE_ID="$(cat /proc/sys/kernel/random/uuid)"
            desc="Site role for ${site_key:-$client_key}"
            desc_sql="$(printf '%s' "$desc" | sed "s/'/''/g")"
            INS_COLS="id,name"
            INS_VALS="'${ROLE_ID}','${role_name_sql}'"
            if _has_role_col "description"; then INS_COLS="${INS_COLS},description"; INS_VALS="${INS_VALS},'${desc_sql}'"; fi
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_roles (${INS_COLS}) VALUES (${INS_VALS});"
            echo "✅ Created Directus role '${role_name}' (id=${ROLE_ID})"
          fi
    
          # Ensure Directus policy exists and is linked to the site role.
          POLICY_ID=""
          if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
            POLICY_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_policies WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
            POLICY_ID="$(printf '%s' "$POLICY_ID" | tr -d '\r')"
            if [ -z "${POLICY_ID:-}" ] || [ "${POLICY_ID}" = "null" ]; then
              POLICY_ID="$(cat /proc/sys/kernel/random/uuid)"
              PDESC="Site policy for ${site_key:-$client_key}"
              PDESC_SQL="$(printf '%s' "$PDESC" | sed "s/'/''/g")"
              PCOLS="id,name"
              PVALS="'${POLICY_ID}','${role_name_sql}'"
              if _has_policy_col "description"; then PCOLS="${PCOLS},description"; PVALS="${PVALS},'${PDESC_SQL}'"; fi
              if _has_policy_col "icon"; then PCOLS="${PCOLS},icon"; PVALS="${PVALS},'badge'"; fi
              if _has_policy_col "admin_access"; then PCOLS="${PCOLS},admin_access"; PVALS="${PVALS},false"; fi
              if _has_policy_col "app_access"; then PCOLS="${PCOLS},app_access"; PVALS="${PVALS},false"; fi
              if _has_policy_col "enforce_tfa"; then PCOLS="${PCOLS},enforce_tfa"; PVALS="${PVALS},false"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_policies (${PCOLS}) VALUES (${PVALS});"
              echo "✅ Created Directus policy '${role_name}' (id=${POLICY_ID})"
            fi
          else
            echo "⚠️ directus_policies table not found; skipping policy provisioning for client_key=${client_key}"
          fi
    
          if [ -n "${POLICY_ID:-}" ] && [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
            acc_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM directus.directus_access WHERE role = '${ROLE_ID}' AND policy = '${POLICY_ID}' LIMIT 1;" || true)"
            acc_exists="$(printf '%s' "$acc_exists" | tr -d '\r')"
            if [ "$acc_exists" != "1" ]; then
              acc_id="$(cat /proc/sys/kernel/random/uuid)"
              ACOLS="id,policy"
              AVALS="'${acc_id}','${POLICY_ID}'"
              if _has_access_col "role"; then ACOLS="${ACOLS},role"; AVALS="${AVALS},'${ROLE_ID}'"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_access (${ACOLS}) VALUES (${AVALS});"
              echo "✅ Linked role '${role_name}' to policy '${role_name}'"
            fi
          fi
    
          # Ensure a service user exists for this site and set its static token (Directus uses directus_users.token).
          if _has_user_col "token"; then
            svc_email="svc-${client_key}@svc.local"
            svc_email_sql="$(printf '%s' "$svc_email" | sed "s/'/''/g")"
            USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_users WHERE email = '${svc_email_sql}' LIMIT 1;" || true)"
            USER_ID="$(printf '%s' "$USER_ID" | tr -d '\r')"
            token_sql="$(printf '%s' "$SITE_TOKEN" | sed "s/'/''/g")"
            if [ -z "${USER_ID:-}" ] || [ "${USER_ID}" = "null" ]; then
              USER_ID="$(cat /proc/sys/kernel/random/uuid)"
              UCOLS="id,email"
              UVALS="'${USER_ID}','${svc_email_sql}'"
              if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${ROLE_ID}'"; fi
              if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
              if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
              if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
              if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'${role_name_sql}'"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
              echo "✅ Created site user ${svc_email}"
            else
              role_id_sql="$(printf '%s' "$ROLE_ID" | sed "s/'/''/g")"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; UPDATE directus_users SET role='${role_id_sql}', token='${token_sql}', status='active' WHERE id='${USER_ID}';"
              echo "✅ Updated site user ${svc_email}"
            fi
          else
            echo "⚠️ directus_users.token column not found; cannot provision site token for client_key=${client_key}"
          fi
    
          # Seed baseline read permissions for this policy (drives available GraphQL actions).
          if [ "${PERM_TABLE_EXISTS:-0}" = "1" ] && [ -n "${POLICY_ID:-}" ] && [ -n "${PERM_PRINC_COL:-}" ]; then
            # Reconcile desired read access from sites.yaml on every deploy.
            # This removes stale read grants so ArgoCD-driven config is authoritative.
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; DELETE FROM directus_permissions WHERE ${PERM_PRINC_COL}='${POLICY_ID}' AND action='read';"
    
            printf '%s' "$site" | jq -c '.read_collections[]?' | while IFS= read -r coll_entry; do
              [ -z "${coll_entry:-}" ] && continue
    
              coll=""
              fields_cfg="null"
              permissions_cfg="null"
              validation_cfg="null"
              presets_cfg="null"
    
              coll_type="$(printf '%s' "$coll_entry" | jq -r 'type' 2>/dev/null || true)"
              if [ "$coll_type" = "string" ]; then
                coll="$(printf '%s' "$coll_entry" | jq -r '.' 2>/dev/null || true)"
              elif [ "$coll_type" = "object" ]; then
                coll="$(printf '%s' "$coll_entry" | jq -r '.collection // .name // empty' 2>/dev/null || true)"
                fields_cfg="$(printf '%s' "$coll_entry" | jq -c '.fields // null' 2>/dev/null || true)"
                permissions_cfg="$(printf '%s' "$coll_entry" | jq -c '.permissions // .filter // null' 2>/dev/null || true)"
                validation_cfg="$(printf '%s' "$coll_entry" | jq -c '.validation // null' 2>/dev/null || true)"
                presets_cfg="$(printf '%s' "$coll_entry" | jq -c '.presets // null' 2>/dev/null || true)"
              else
                continue
              fi
    
              if [ -z "${coll:-}" ] || [ "${coll}" = "null" ]; then
                continue
              fi
    
              coll_sql="$(printf '%s' "$coll" | sed "s/'/''/g")"
              perms_val="$(_json_value_for_type "${PERMISSIONS_TYPE:-}" "${permissions_cfg:-null}")"
              val_val="$(_json_value_for_type "${VALIDATION_TYPE:-}" "${validation_cfg:-null}")"
              pre_val="$(_json_value_for_type "${PRESETS_TYPE:-}" "${presets_cfg:-null}")"
              fields_val="$(_fields_value_from_config_for_type "${PERM_FIELDS_TYPE:-}" "${fields_cfg:-null}")"
    
              existing_perm_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_permissions WHERE ${PERM_PRINC_COL} = '${POLICY_ID}' AND collection = '${coll_sql}' AND action = 'read' LIMIT 1;" || true)"
              existing_perm_id="$(printf '%s' "$existing_perm_id" | tr -d '\r')"
    
              if [ -n "${existing_perm_id:-}" ] && [ "${existing_perm_id}" != "null" ]; then
                SETS=""
                if _has_perm_col "permissions"; then SETS="${SETS},permissions=${perms_val}"; fi
                if _has_perm_col "validation"; then SETS="${SETS},validation=${val_val}"; fi
                if _has_perm_col "presets"; then SETS="${SETS},presets=${pre_val}"; fi
                if _has_perm_col "fields"; then SETS="${SETS},fields=${fields_val}"; fi
                if [ -n "${SETS:-}" ]; then
                  perm_id_sql="$(printf '%s' "$existing_perm_id" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; UPDATE directus_permissions SET ${SETS#,} WHERE id='${perm_id_sql}';"
                fi
                echo "✅ Reconciled read on ${coll} for policy '${role_name}'"
                continue
              fi
    
              PCOLS="${PERM_PRINC_COL},collection,action"
              PVALS="'${POLICY_ID}','${coll_sql}','read'"
              if [ "${PERM_ID_HAS_DEFAULT:-0}" != "1" ]; then
                pid="$(cat /proc/sys/kernel/random/uuid)"
                PCOLS="id,${PCOLS}"
                PVALS="'${pid}',${PVALS}"
              fi
              if _has_perm_col "permissions"; then PCOLS="${PCOLS},permissions"; PVALS="${PVALS},${perms_val}"; fi
              if _has_perm_col "validation"; then PCOLS="${PCOLS},validation"; PVALS="${PVALS},${val_val}"; fi
              if _has_perm_col "presets"; then PCOLS="${PCOLS},presets"; PVALS="${PVALS},${pre_val}"; fi
              if _has_perm_col "fields"; then PCOLS="${PCOLS},fields"; PVALS="${PVALS},${fields_val}"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_permissions (${PCOLS}) VALUES (${PVALS});"
              echo "✅ Granted read on ${coll} to policy '${role_name}'"
            done
          fi
    
          # Provision per-site Directus flows that call the app cache refresh endpoint after content saves.
          # These are seeded from sites.yaml and can also be adjusted from the Directus Flow UI.
          if [ "${_directus_api_enabled}" = "1" ]; then
            refresh_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.enabled // false' 2>/dev/null || true)"
            refresh_auth_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.enabled // true' 2>/dev/null || true)"
            refresh_auth_token_url_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.token_url // empty' 2>/dev/null || true)"
            refresh_auth_scope="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.scope // empty' 2>/dev/null || true)"
            refresh_auth_audience="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience // empty' 2>/dev/null || true)"
            refresh_auth_audience_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_path // "secret/data/keycloak-client-id-graphql-api"' 2>/dev/null || true)"
            refresh_auth_audience_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_field // "value"' 2>/dev/null || true)"
            refresh_auth_client_id_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_path // empty' 2>/dev/null || true)"
            refresh_auth_client_id_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_field // "value"' 2>/dev/null || true)"
            refresh_auth_client_secret_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_path // empty' 2>/dev/null || true)"
            refresh_auth_client_secret_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_field // "value"' 2>/dev/null || true)"
    
            case "$(printf '%s' "${refresh_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) refresh_enabled="true" ;;
              *) refresh_enabled="false" ;;
            esac
    
            case "$(printf '%s' "${refresh_auth_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) refresh_auth_enabled="true" ;;
              *) refresh_auth_enabled="false" ;;
            esac
    
            refresh_auth_token_url="$(printf '%s' "${refresh_auth_token_url_raw:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_token_url:-}" ] || [ "${refresh_auth_token_url}" = "null" ]; then
              refresh_auth_token_url="https://auth.suncoast.systems/realms/external/protocol/openid-connect/token"
            fi
    
            refresh_auth_client_id_vault_path="$(printf '%s' "${refresh_auth_client_id_vault_path:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_id_vault_path:-}" ] || [ "${refresh_auth_client_id_vault_path}" = "null" ]; then
              refresh_auth_client_id_vault_path="secret/data/keycloak-client-id-${client_key}"
            fi
    
            refresh_auth_client_secret_vault_path="$(printf '%s' "${refresh_auth_client_secret_vault_path:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_secret_vault_path:-}" ] || [ "${refresh_auth_client_secret_vault_path}" = "null" ]; then
              refresh_auth_client_secret_vault_path="secret/data/keycloak-client-secret-${client_key}"
            fi
    
            refresh_auth_client_id_vault_field="$(printf '%s' "${refresh_auth_client_id_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_id_vault_field:-}" ] || [ "${refresh_auth_client_id_vault_field}" = "null" ]; then
              refresh_auth_client_id_vault_field="value"
            fi
    
            refresh_auth_client_secret_vault_field="$(printf '%s' "${refresh_auth_client_secret_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_secret_vault_field:-}" ] || [ "${refresh_auth_client_secret_vault_field}" = "null" ]; then
              refresh_auth_client_secret_vault_field="value"
            fi
    
            refresh_auth_audience_vault_path="$(printf '%s' "${refresh_auth_audience_vault_path:-}" | tr -d '\r')"
            refresh_auth_audience_vault_field="$(printf '%s' "${refresh_auth_audience_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_audience_vault_field:-}" ] || [ "${refresh_auth_audience_vault_field}" = "null" ]; then
              refresh_auth_audience_vault_field="value"
            fi
    
            refresh_auth_client_id=""
            refresh_auth_client_secret=""
            refresh_auth_token_body=""
            refresh_auth_ready="false"
    
            if [ "${refresh_auth_enabled}" = "true" ]; then
              refresh_auth_client_id="$(_vault_kv_read_field "${refresh_auth_client_id_vault_path}" "${refresh_auth_client_id_vault_field}" || true)"
              refresh_auth_client_secret="$(_vault_kv_read_field "${refresh_auth_client_secret_vault_path}" "${refresh_auth_client_secret_vault_field}" || true)"
              refresh_auth_audience="$(printf '%s' "${refresh_auth_audience:-}" | tr -d '\r')"
              if [ -z "${refresh_auth_audience:-}" ] && [ -n "${refresh_auth_audience_vault_path:-}" ] && [ "${refresh_auth_audience_vault_path}" != "null" ]; then
                refresh_auth_audience="$(_vault_kv_read_field "${refresh_auth_audience_vault_path}" "${refresh_auth_audience_vault_field}" || true)"
              fi
    
              if [ -z "${refresh_auth_client_id:-}" ] || [ -z "${refresh_auth_client_secret:-}" ]; then
                echo "⚠️ cache refresh auth enabled but Keycloak client credentials missing for site_key='${site_key}' (client_id_path='${refresh_auth_client_id_vault_path}', client_secret_path='${refresh_auth_client_secret_vault_path}')"
              else
                enc_client_id="$(_urlencode_value "${refresh_auth_client_id}")"
                enc_client_secret="$(_urlencode_value "${refresh_auth_client_secret}")"
                refresh_auth_token_body="grant_type=client_credentials&client_id=${enc_client_id}&client_secret=${enc_client_secret}"
    
                refresh_auth_scope="$(printf '%s' "${refresh_auth_scope:-}" | tr -d '\r')"
                if [ -n "${refresh_auth_scope:-}" ] && [ "${refresh_auth_scope}" != "null" ]; then
                  enc_scope="$(_urlencode_value "${refresh_auth_scope}")"
                  refresh_auth_token_body="${refresh_auth_token_body}&scope=${enc_scope}"
                fi
    
                if [ -n "${refresh_auth_audience:-}" ] && [ "${refresh_auth_audience}" != "null" ]; then
                  enc_audience="$(_urlencode_value "${refresh_auth_audience}")"
                  refresh_auth_token_body="${refresh_auth_token_body}&audience=${enc_audience}"
                fi
    
                refresh_auth_ready="true"
              fi
            fi
    
            refresh_targets_json="$(printf '%s' "$site" | jq -c '
              def norm_headers($h):
                if ($h|type)=="array" then
                  ($h | map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")))
                else [] end;
              if (.cache_refresh.targets | type) == "object" then
                (.cache_refresh.targets | to_entries | map({
                  target_key:(.key|tostring|ascii_downcase),
                  enabled:(.value.enabled // false),
                  endpoint:(.value.endpoint // "" | tostring),
                  method:(.value.method // (.cache_refresh.method // "POST") | tostring),
                  headers:(norm_headers(.value.headers)),
                  retry_attempts:(.value.retry_attempts // .value.retries // .cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.value.retry_delay_ms // .value.retry_delay // .cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500)
                }))
              elif (.cache_refresh.targets | type) == "array" then
                (.cache_refresh.targets | map({
                  target_key:((.target_key // .key // .name // "")|tostring|ascii_downcase),
                  enabled:(.enabled // false),
                  endpoint:(.endpoint // "" | tostring),
                  method:(.method // (.cache_refresh.method // "POST") | tostring),
                  headers:(norm_headers(.headers)),
                  retry_attempts:(.retry_attempts // .retries // .cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.retry_delay_ms // .retry_delay // .cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500)
                }) | map(select(.target_key != "")))
              else
                [{
                  target_key:"prod",
                  enabled:(.cache_refresh.enabled // false),
                  endpoint:(.cache_refresh.endpoint // "" | tostring),
                  method:(.cache_refresh.method // "POST" | tostring),
                  headers:(norm_headers(.cache_refresh.headers)),
                  retry_attempts:(.cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500)
                }]
              end' 2>/dev/null || true)"
            if [ -z "${refresh_targets_json:-}" ] || [ "${refresh_targets_json}" = "null" ]; then
              refresh_targets_json="[]"
            fi
            if ! printf '%s' "${refresh_targets_json}" | jq -e 'type=="array"' >/dev/null 2>&1; then
              refresh_targets_json="[]"
            fi
    
            refresh_collections_json='["cms_pages","cms_page_blocks","cms_block_rich_text","cms_block_hero","cms_block_module","cms_modules","cms_theme_packages"]'
            targets_count="$(printf '%s' "${refresh_targets_json}" | jq -r 'length' 2>/dev/null || echo 0)"
            if [ "${targets_count:-0}" = "0" ]; then
              echo "⚠️ No cache refresh targets configured for site_key='${site_key}'"
            fi
    
            printf '%s' "${refresh_targets_json}" | jq -c 'sort_by((if (.enabled // false) then 0 else 1 end), .target_key)[]' | while IFS= read -r target; do
              target_key="$(printf '%s' "$target" | jq -r '.target_key // empty' 2>/dev/null || true)"
              target_enabled_raw="$(printf '%s' "$target" | jq -r '.enabled // false' 2>/dev/null || true)"
              target_endpoint_raw="$(printf '%s' "$target" | jq -r '.endpoint // empty' 2>/dev/null || true)"
              target_method_raw="$(printf '%s' "$target" | jq -r '.method // "POST"' 2>/dev/null || true)"
              target_retry_attempts_raw="$(printf '%s' "$target" | jq -r '.retry_attempts // 6' 2>/dev/null || true)"
              target_retry_delay_ms_raw="$(printf '%s' "$target" | jq -r '.retry_delay_ms // 1500' 2>/dev/null || true)"
              target_headers_json="$(printf '%s' "$target" | jq -c \
                '(.headers // []) | if type=="array" then map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")) else [] end' \
                2>/dev/null || true)"
    
              if [ -z "${target_key:-}" ] || [ "${target_key}" = "null" ]; then
                continue
              fi
    
              case "$(printf '%s' "${target_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) target_enabled="true" ;;
                *) target_enabled="false" ;;
              esac
    
              target_method="$(printf '%s' "${target_method_raw:-POST}" | tr '[:lower:]' '[:upper:]')"
              case "${target_method}" in
                GET|POST|PUT|PATCH|DELETE) ;;
                *) target_method="POST" ;;
              esac
    
              if [ -z "${target_headers_json:-}" ] || [ "${target_headers_json}" = "null" ]; then
                target_headers_json="[]"
              fi

              target_retry_attempts="$(printf '%s' "${target_retry_attempts_raw:-6}" | tr -dc '0-9')"
              if [ -z "${target_retry_attempts:-}" ]; then
                target_retry_attempts=6
              fi
              if [ "${target_retry_attempts}" -lt 1 ]; then
                target_retry_attempts=1
              fi
              if [ "${target_retry_attempts}" -gt 15 ]; then
                target_retry_attempts=15
              fi

              target_retry_delay_ms="$(printf '%s' "${target_retry_delay_ms_raw:-1500}" | tr -dc '0-9')"
              if [ -z "${target_retry_delay_ms:-}" ]; then
                target_retry_delay_ms=1500
              fi
              if [ "${target_retry_delay_ms}" -gt 120000 ]; then
                target_retry_delay_ms=120000
              fi
    
              flow_status="active"
              if [ "${refresh_enabled}" != "true" ] || [ "${target_enabled}" != "true" ]; then
                flow_status="inactive"
              fi
    
              target_endpoint_effective="$(printf '%s' "${target_endpoint_raw:-}" | tr -d '\r')"
              if [ -z "${target_endpoint_effective:-}" ] || [ "${target_endpoint_effective}" = "null" ]; then
                flow_status="inactive"
                target_endpoint_effective="https://replace-me-${site_key}-${target_key}.invalid/api/cache/refresh"
              fi
    
              target_headers_effective_json="${target_headers_json}"
              if [ "${refresh_auth_enabled}" = "true" ]; then
                if [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                  target_headers_effective_json="$(jq -nc --argjson headers "${target_headers_json}" \
                    '[{header:"Authorization",value:"Bearer {{ $last.data.access_token }}"}] + ($headers // [])')"
                else
                  flow_status="inactive"
                fi
              fi
    
              create_flow_name="CMS Cache Refresh (${site_key}/${target_key}) - Create"
              update_flow_name="CMS Cache Refresh (${site_key}/${target_key}) - Update"
              create_flow_desc="Refreshes '${target_key}' app cache endpoint for site '${site_key}' after create events."
              update_flow_desc="Refreshes '${target_key}' app cache endpoint for site '${site_key}' after update events."
    
              create_flow_payload="$(jq -nc \
                --arg name "${create_flow_name}" \
                --arg status "${flow_status}" \
                --arg desc "${create_flow_desc}" \
                --argjson collections "${refresh_collections_json}" \
                '{name:$name,trigger:"event",status:$status,accountability:"all",icon:"sync",color:"#2E7D32",description:$desc,options:{type:"action",scope:["items.create"],collections:$collections}}')"
              update_flow_payload="$(jq -nc \
                --arg name "${update_flow_name}" \
                --arg status "${flow_status}" \
                --arg desc "${update_flow_desc}" \
                --argjson collections "${refresh_collections_json}" \
                '{name:$name,trigger:"event",status:$status,accountability:"all",icon:"sync",color:"#2E7D32",description:$desc,options:{type:"action",scope:["items.update"],collections:$collections}}')"
    
              create_flow_id="$(_directus_find_flow_id_by_name "${create_flow_name}")"
              if [ -n "${create_flow_id:-}" ] && [ "${create_flow_id}" != "null" ]; then
                _directus_api_write "PATCH" "/flows/${create_flow_id}" "${create_flow_payload}" >/tmp/directus-flow-upsert.json 2>/dev/null || true
              else
                created_flow="$(_directus_api_write "POST" "/flows" "${create_flow_payload}" 2>/dev/null || true)"
                create_flow_id="$(printf '%s' "${created_flow}" | jq -r '.data.id // empty' 2>/dev/null || true)"
              fi
    
              update_flow_id="$(_directus_find_flow_id_by_name "${update_flow_name}")"
              if [ -n "${update_flow_id:-}" ] && [ "${update_flow_id}" != "null" ]; then
                _directus_api_write "PATCH" "/flows/${update_flow_id}" "${update_flow_payload}" >/tmp/directus-flow-upsert.json 2>/dev/null || true
              else
                updated_flow="$(_directus_api_write "POST" "/flows" "${update_flow_payload}" 2>/dev/null || true)"
                update_flow_id="$(printf '%s' "${updated_flow}" | jq -r '.data.id // empty' 2>/dev/null || true)"
              fi
    
              if [ -z "${create_flow_id:-}" ] || [ -z "${update_flow_id:-}" ]; then
                echo "⚠️ Failed to ensure cache-refresh flows for site_key='${site_key}', target='${target_key}'"
              else
                if [ "${flow_status}" != "active" ]; then
                  echo "✅ Reconciled cache-refresh flows for site_key='${site_key}', target='${target_key}' as inactive"
                  continue
                fi

                create_read_options="$(jq -nc \
                  '{collection:"{{ $trigger.collection }}",key:"{{ $trigger.key }}",query:{fields:["id","site_key","refresh_target"]},emitEvents:false,permissions:"$full"}')"
                create_match_options="$(jq -nc --arg site "${site_key}" --arg target "${target_key}" \
                  '{filter:{_and:[{_or:[{read_item:{site_key:{_eq:$site}}},{read_item:{site_key:{_null:true}}},{read_item:{site_key:{_eq:""}}}]},{_or:[{read_item:{refresh_target:{_eq:$target}}},{read_item:{refresh_target:{_eq:"both"}}},{read_item:{refresh_target:{_null:true}}},{read_item:{refresh_target:{_eq:""}}}]}]}}')"
                create_request_options="$(jq -nc \
                  --arg method "${target_method}" \
                  --arg url "${target_endpoint_effective}" \
                  --arg site "${site_key}" \
                  --arg target "${target_key}" \
                  --argjson headers "${target_headers_effective_json}" \
                  '{method:$method,url:$url,headers:$headers,body:{source:"directus",site_key:$site,target:$target,event:"items.create",collection:"{{ $trigger.collection }}",key:"{{ $trigger.key }}"}}')"
                create_sleep_options="$(jq -nc --argjson milliseconds "${target_retry_delay_ms}" '{milliseconds:$milliseconds}')"
                create_token_options="$(jq -nc \
                  --arg url "${refresh_auth_token_url}" \
                  --arg body "${refresh_auth_token_body}" \
                  '{method:"POST",url:$url,headers:[{header:"Content-Type",value:"application/x-www-form-urlencoded"},{header:"Accept",value:"application/json"}],body:$body}')"

                create_read_op_id="$(_directus_upsert_operation "${create_flow_id}" "read_item" "item-read" "Read Created Item" 19 1 "${create_read_options}")"
                create_match_op_id="$(_directus_upsert_operation "${create_flow_id}" "match_site_target" "condition" "Match Site + Target" 37 1 "${create_match_options}")"
                _directus_set_operation_links "${create_read_op_id}" "${create_match_op_id}" ""

                create_first_request_op_id=""
                create_prev_sleep_op_id=""
                create_attempt=1
                while [ "${create_attempt}" -le "${target_retry_attempts}" ]; do
                  create_request_key="refresh_cache_attempt_${create_attempt}"
                  create_request_name="Refresh Cache Endpoint (Attempt ${create_attempt}/${target_retry_attempts})"
                  create_request_pos_x=$((73 + (create_attempt - 1) * 56))
                  create_request_op_id="$(_directus_upsert_operation "${create_flow_id}" "${create_request_key}" "request" "${create_request_name}" "${create_request_pos_x}" 1 "${create_request_options}")"

                  if [ -z "${create_first_request_op_id:-}" ]; then
                    create_first_request_op_id="${create_request_op_id}"
                  fi

                  if [ -n "${create_prev_sleep_op_id:-}" ] && [ "${create_prev_sleep_op_id}" != "null" ]; then
                    _directus_set_operation_links "${create_prev_sleep_op_id}" "${create_request_op_id}" ""
                    create_prev_sleep_op_id=""
                  fi

                  if [ "${create_attempt}" -lt "${target_retry_attempts}" ]; then
                    create_sleep_key="refresh_backoff_${create_attempt}"
                    create_sleep_name="Retry Delay (${create_attempt}/${target_retry_attempts})"
                    create_sleep_pos_x=$((create_request_pos_x + 28))
                    create_sleep_op_id="$(_directus_upsert_operation "${create_flow_id}" "${create_sleep_key}" "sleep" "${create_sleep_name}" "${create_sleep_pos_x}" 19 "${create_sleep_options}")"
                    _directus_set_operation_links "${create_request_op_id}" "" "${create_sleep_op_id}"
                    create_prev_sleep_op_id="${create_sleep_op_id}"
                  else
                    _directus_set_operation_links "${create_request_op_id}" "" ""
                  fi

                  create_attempt=$((create_attempt + 1))
                done

                if [ "${refresh_auth_enabled}" = "true" ] && [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                  # Directus operation graph uses unique(resolve/reject) links. Keep token minting single-step.
                  create_token_op_id="$(_directus_upsert_operation "${create_flow_id}" "mint_refresh_token_attempt_1" "request" "Mint Refresh Token" 55 1 "${create_token_options}")"
                  _directus_set_operation_links "${create_token_op_id}" "${create_first_request_op_id}" ""
                  _directus_set_operation_links "${create_match_op_id}" "${create_token_op_id}" ""
                else
                  _directus_set_operation_links "${create_match_op_id}" "${create_first_request_op_id}" ""
                fi
                _directus_api_write "PATCH" "/flows/${create_flow_id}" \
                  "$(jq -nc --arg operation "${create_read_op_id}" --arg status "${flow_status}" '{operation:$operation,status:$status}')" \
                  >/tmp/directus-flow-entry.json 2>/dev/null || true

                update_read_options="$(jq -nc \
                  '{collection:"{{ $trigger.collection }}",key:"{{ $trigger.keys.0 }}",query:{fields:["id","site_key","refresh_target"]},emitEvents:false,permissions:"$full"}')"
                update_match_options="$(jq -nc --arg site "${site_key}" --arg target "${target_key}" \
                  '{filter:{_and:[{_or:[{read_item:{site_key:{_eq:$site}}},{read_item:{site_key:{_null:true}}},{read_item:{site_key:{_eq:""}}}]},{_or:[{read_item:{refresh_target:{_eq:$target}}},{read_item:{refresh_target:{_eq:"both"}}},{read_item:{refresh_target:{_null:true}}},{read_item:{refresh_target:{_eq:""}}}]}]}}')"
                update_request_options="$(jq -nc \
                  --arg method "${target_method}" \
                  --arg url "${target_endpoint_effective}" \
                  --arg site "${site_key}" \
                  --arg target "${target_key}" \
                  --argjson headers "${target_headers_effective_json}" \
                  '{method:$method,url:$url,headers:$headers,body:{source:"directus",site_key:$site,target:$target,event:"items.update",collection:"{{ $trigger.collection }}",key:"{{ $trigger.keys.0 }}"}}')"
                update_sleep_options="$(jq -nc --argjson milliseconds "${target_retry_delay_ms}" '{milliseconds:$milliseconds}')"
                update_token_options="$(jq -nc \
                  --arg url "${refresh_auth_token_url}" \
                  --arg body "${refresh_auth_token_body}" \
                  '{method:"POST",url:$url,headers:[{header:"Content-Type",value:"application/x-www-form-urlencoded"},{header:"Accept",value:"application/json"}],body:$body}')"

                update_read_op_id="$(_directus_upsert_operation "${update_flow_id}" "read_item" "item-read" "Read Updated Item" 19 1 "${update_read_options}")"
                update_match_op_id="$(_directus_upsert_operation "${update_flow_id}" "match_site_target" "condition" "Match Site + Target" 37 1 "${update_match_options}")"
                _directus_set_operation_links "${update_read_op_id}" "${update_match_op_id}" ""

                update_first_request_op_id=""
                update_prev_sleep_op_id=""
                update_attempt=1
                while [ "${update_attempt}" -le "${target_retry_attempts}" ]; do
                  update_request_key="refresh_cache_attempt_${update_attempt}"
                  update_request_name="Refresh Cache Endpoint (Attempt ${update_attempt}/${target_retry_attempts})"
                  update_request_pos_x=$((73 + (update_attempt - 1) * 56))
                  update_request_op_id="$(_directus_upsert_operation "${update_flow_id}" "${update_request_key}" "request" "${update_request_name}" "${update_request_pos_x}" 61 "${update_request_options}")"

                  if [ -z "${update_first_request_op_id:-}" ]; then
                    update_first_request_op_id="${update_request_op_id}"
                  fi

                  if [ -n "${update_prev_sleep_op_id:-}" ] && [ "${update_prev_sleep_op_id}" != "null" ]; then
                    _directus_set_operation_links "${update_prev_sleep_op_id}" "${update_request_op_id}" ""
                    update_prev_sleep_op_id=""
                  fi

                  if [ "${update_attempt}" -lt "${target_retry_attempts}" ]; then
                    update_sleep_key="refresh_backoff_${update_attempt}"
                    update_sleep_name="Retry Delay (${update_attempt}/${target_retry_attempts})"
                    update_sleep_pos_x=$((update_request_pos_x + 28))
                    update_sleep_op_id="$(_directus_upsert_operation "${update_flow_id}" "${update_sleep_key}" "sleep" "${update_sleep_name}" "${update_sleep_pos_x}" 79 "${update_sleep_options}")"
                    _directus_set_operation_links "${update_request_op_id}" "" "${update_sleep_op_id}"
                    update_prev_sleep_op_id="${update_sleep_op_id}"
                  else
                    _directus_set_operation_links "${update_request_op_id}" "" ""
                  fi

                  update_attempt=$((update_attempt + 1))
                done

                if [ "${refresh_auth_enabled}" = "true" ] && [ "${refresh_auth_ready}" = "true" ] && [ -n "${refresh_auth_token_body:-}" ]; then
                  # Directus operation graph uses unique(resolve/reject) links. Keep token minting single-step.
                  update_token_op_id="$(_directus_upsert_operation "${update_flow_id}" "mint_refresh_token_attempt_1" "request" "Mint Refresh Token" 55 61 "${update_token_options}")"
                  _directus_set_operation_links "${update_token_op_id}" "${update_first_request_op_id}" ""
                  _directus_set_operation_links "${update_match_op_id}" "${update_token_op_id}" ""
                else
                  _directus_set_operation_links "${update_match_op_id}" "${update_first_request_op_id}" ""
                fi
                _directus_api_write "PATCH" "/flows/${update_flow_id}" \
                  "$(jq -nc --arg operation "${update_read_op_id}" --arg status "${flow_status}" '{operation:$operation,status:$status}')" \
                  >/tmp/directus-flow-entry.json 2>/dev/null || true

                if [ "${flow_status}" = "active" ]; then
                  echo "✅ Reconciled active cache-refresh flows for site_key='${site_key}', target='${target_key}' (${target_method} ${target_endpoint_effective}, attempts=${target_retry_attempts}, retry_delay_ms=${target_retry_delay_ms})"
                else
                  echo "✅ Reconciled cache-refresh flows for site_key='${site_key}', target='${target_key}' as inactive"
                fi
              fi
            done
    
            # Keep legacy pre-target flow names inactive to avoid duplicate refresh calls.
            legacy_create_flow_name="CMS Cache Refresh (${site_key}) - Create"
            legacy_update_flow_name="CMS Cache Refresh (${site_key}) - Update"
            legacy_create_flow_id="$(_directus_find_flow_id_by_name "${legacy_create_flow_name}")"
            if [ -n "${legacy_create_flow_id:-}" ] && [ "${legacy_create_flow_id}" != "null" ]; then
              _directus_api_write "PATCH" "/flows/${legacy_create_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
            fi
            legacy_update_flow_id="$(_directus_find_flow_id_by_name "${legacy_update_flow_name}")"
            if [ -n "${legacy_update_flow_id:-}" ] && [ "${legacy_update_flow_id}" != "null" ]; then
              _directus_api_write "PATCH" "/flows/${legacy_update_flow_id}" "$(jq -nc '{status:"inactive"}')" >/tmp/directus-flow-legacy.json 2>/dev/null || true
            fi
          else
            echo "⚠️ Skipping cache-refresh flow provisioning for site_key='${site_key}' (Directus API token unavailable)"
          fi
        done
      else
        echo "  └─ no sites configured in ${SITES_FILE}; skipping"
      fi
    else
      echo "  └─ ${SITES_FILE} not found; skipping"
    fi
    
    # 5d) Provision a dedicated admin-backed token for OpenAPI discovery sync.
    # Directus only includes `/items/*` paths in OAS for admin-level users.
    echo "🧾 Ensuring OpenAPI sync admin token exists..."
    OPENAPI_SYNC_TOKEN_VAULT_PATH="${OPENAPI_SYNC_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/openapi/admin}"
    OPENAPI_USER_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
    _openapi_has_user_col() { printf '%s\n' "$OPENAPI_USER_COLS" | grep -qx "$1"; }
    
    if _openapi_has_user_col "token"; then
      ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
      ADMIN_ROLE_ID="$(printf '%s' "$ADMIN_ROLE_ID" | tr -d '\r')"
    
      if [ -z "${ADMIN_ROLE_ID:-}" ] || [ "${ADMIN_ROLE_ID}" = "null" ]; then
        echo "⚠️ Administrator role not found; skipping OpenAPI sync token provisioning."
      else
        OPENAPI_SYNC_TOKEN=""
        RCODE="$(curl -sS -o /tmp/openapi-sync-token-read.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
        if [ "$RCODE" = "200" ]; then
          OPENAPI_SYNC_TOKEN="$(jq -r '.data.data.token // empty' /tmp/openapi-sync-token-read.json 2>/dev/null || true)"
        fi
        if [ -z "${OPENAPI_SYNC_TOKEN:-}" ] || [ "${OPENAPI_SYNC_TOKEN}" = "null" ]; then
          OPENAPI_SYNC_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
        fi
    
        openapi_email="svc-openapi-admin@svc.local"
        openapi_email_sql="$(printf '%s' "$openapi_email" | sed "s/'/''/g")"
        ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT id FROM directus.directus_users WHERE email = '${openapi_email_sql}' LIMIT 1;" || true)"
        ADMIN_USER_ID="$(printf '%s' "$ADMIN_USER_ID" | tr -d '\r')"
        token_sql="$(printf '%s' "$OPENAPI_SYNC_TOKEN" | sed "s/'/''/g")"
        admin_role_sql="$(printf '%s' "$ADMIN_ROLE_ID" | sed "s/'/''/g")"
    
        if [ -z "${ADMIN_USER_ID:-}" ] || [ "${ADMIN_USER_ID}" = "null" ]; then
          ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
          UCOLS="id,email"
          UVALS="'${ADMIN_USER_ID}','${openapi_email_sql}'"
          if _openapi_has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${admin_role_sql}'"; fi
          if _openapi_has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
          if _openapi_has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
          if _openapi_has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
          if _openapi_has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'openapi-admin'"; fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
          echo "✅ Created OpenAPI sync user ${openapi_email}"
        else
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; UPDATE directus_users SET role='${admin_role_sql}', token='${token_sql}', status='active' WHERE id='${ADMIN_USER_ID}';"
          echo "✅ Updated OpenAPI sync user ${openapi_email}"
        fi
    
        payload="$(jq -nc --arg t "$OPENAPI_SYNC_TOKEN" '{data:{token:$t}}')"
        WCODE="$(curl -sS -o /tmp/openapi-sync-token-write.json -w '%{http_code}' -X POST \
          -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
          -d "$payload" "${VAULT_ADDR}/v1/${OPENAPI_SYNC_TOKEN_VAULT_PATH}" || true)"
        if [ "$WCODE" = "200" ] || [ "$WCODE" = "204" ]; then
          echo "✅ OpenAPI sync token stored in Vault (${OPENAPI_SYNC_TOKEN_VAULT_PATH})"
        else
          echo "⚠️ Failed to store OpenAPI sync token in Vault (HTTP ${WCODE})"
        fi
      fi
    else
      echo "⚠️ directus_users.token column not found; cannot provision OpenAPI sync token."
    fi
    
    # 6) Configure Directus settings directly in DB
    echo "🤖 Configuring Directus settings..."
    EXTRA_SETTINGS_FILE="/directus-settings/settings.yaml"
    EXTRA_SETTINGS_HAS_KEYS="0"
    OPENAI_KEY=""
    OPENAI_KEY_SOURCE=""
    if [ -f "$EXTRA_SETTINGS_FILE" ]; then
      EXTRA_SETTINGS_JSON="$(yq -o=json '.' "$EXTRA_SETTINGS_FILE" 2>/dev/null || true)"
      if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'type=="object"' >/dev/null 2>&1; then
        if printf '%s' "$EXTRA_SETTINGS_JSON" | jq -e 'length>0' >/dev/null 2>&1; then
          EXTRA_SETTINGS_HAS_KEYS="1"
        fi
        OPENAI_KEY_FROM_SETTINGS="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r \
          'to_entries[] | select(.key|test("openai.*key$"; "i")) | .value | if type=="string" then . else empty end' \
          | head -n1 || true)"
        if [ -n "${OPENAI_KEY_FROM_SETTINGS:-}" ] && [ "${OPENAI_KEY_FROM_SETTINGS}" != "null" ]; then
          if printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q '<' && \
             printf '%s' "$OPENAI_KEY_FROM_SETTINGS" | grep -q 'path:'; then
            echo "⚠️ OpenAI key placeholder detected in settings.yaml (AVP not rendered); will try Vault."
          else
            OPENAI_KEY="$OPENAI_KEY_FROM_SETTINGS"
            OPENAI_KEY_SOURCE="settings.yaml"
          fi
        fi
      else
        echo "⚠️ Invalid YAML in $EXTRA_SETTINGS_FILE; ignoring."
      fi
    fi
    
    if [ -z "${OPENAI_KEY:-}" ]; then
      OPENAI_KEY="$(curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
        "${VAULT_ADDR}/v1/secret/data/open_ai_key" | jq -r '.data.data.value' || true)"
      if [ -n "${OPENAI_KEY:-}" ] && [ "${OPENAI_KEY}" != "null" ]; then
        OPENAI_KEY_SOURCE="vault"
      else
        OPENAI_KEY=""
        OPENAI_KEY_SOURCE=""
        echo "⚠️ OpenAI key missing; will skip OpenAI setting."
      fi
    fi
    
    SETTINGS_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' ORDER BY column_name;" || true)"
    if [ -z "${SETTINGS_COLS:-}" ]; then
      echo "⚠️ Could not read directus_settings columns; skipping settings."
      touch "${POSTSCHEMA_DB_READY_FILE}"
      touch "${POSTSCHEMA_READY_FILE}"
      echo "✅ Schema patch applied. Going idle."
      exec tail -f /dev/null
    fi
    
    ENCRYPTED_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT field FROM directus_fields WHERE collection='directus_settings' AND special::text ILIKE '%encrypt%';" || true)"
    ENCRYPTED_REGEX='^1\\|\\|scrypt\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[0-9]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+\\|\\|[^|]+$'
    
    EXTRA_ENCRYPTED_COLS="ai_openai_api_key ai_anthropic_api_key ai_google_api_key ai_openai_compatible_api_key"
    _sanitize_encrypted_col() {
      enc_col="$1"
      [ -z "${enc_col:-}" ] && return 0
      if ! printf '%s\n' "$SETTINGS_COLS" | grep -qx "$enc_col"; then
        return 0
      fi
      _col_escaped="$(printf '%s' "$enc_col" | sed 's/\"/\"\"/g')"
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
        -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL WHERE \"${_col_escaped}\" IS NOT NULL AND \"${_col_escaped}\" !~ '${ENCRYPTED_REGEX}';"
    }
    
    echo "🔐 Sanitizing encrypted settings fields..."
    if [ -n "${ENCRYPTED_COLS:-}" ]; then
      printf '%s\n' "$ENCRYPTED_COLS" | while IFS= read -r enc_col; do
        _sanitize_encrypted_col "$enc_col"
      done
    fi
    for enc_col in $EXTRA_ENCRYPTED_COLS; do
      _sanitize_encrypted_col "$enc_col"
    done
    
    _update_setting() {
      _col="$1"
      _val="$2"
      _col_escaped="$(printf '%s' "$_col" | sed 's/\"/\"\"/g')"
      _val_escaped="$(printf '%s' "$_val" | sed "s/'/''/g")"
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
        -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = '${_val_escaped}';"
    }
    
    UPDATED="0"
    
    if [ -n "${OPENAI_KEY:-}" ]; then
      OPENAI_COL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_settings' AND column_name ~* 'openai.*key$' ORDER BY column_name LIMIT 1;" || true)"
      if [ -n "${OPENAI_COL:-}" ]; then
        if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$OPENAI_COL" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$OPENAI_COL"; then
          echo "⚠️ ${OPENAI_COL} is encrypted; skipping direct DB update to avoid invalid encrypted payload."
        else
          _update_setting "$OPENAI_COL" "$OPENAI_KEY"
          UPDATED="1"
          echo "✅ OpenAI key stored in directus_settings.${OPENAI_COL} (source: ${OPENAI_KEY_SOURCE})"
        fi
      else
        echo "⚠️ No OpenAI settings column found in directus_settings; skipping OpenAI setting."
      fi
    fi
    
    if [ "$EXTRA_SETTINGS_HAS_KEYS" = "1" ]; then
      EXTRA_SETTINGS_KEYS_FILE="$(mktemp)"
      printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r 'keys[]' >"${EXTRA_SETTINGS_KEYS_FILE}"
      while IFS= read -r key; do
        if printf '%s' "$key" | grep -Eq 'openai.*key$'; then
          # handled separately via OPENAI_KEY logic above
          continue
        fi
        if printf '%s\n' "$ENCRYPTED_COLS" | grep -qx "$key" || printf '%s\n' "$EXTRA_ENCRYPTED_COLS" | tr ' ' '\n' | grep -qx "$key"; then
          echo "⚠️ settings.yaml key '${key}' is encrypted; skipping direct DB update."
          continue
        fi
        if printf '%s\n' "$SETTINGS_COLS" | grep -qx "$key"; then
          val_type="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k] | type')"
          if [ "$val_type" = "null" ]; then
            _col_escaped="$(printf '%s' "$key" | sed 's/\"/\"\"/g')"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
              -c "SET search_path TO directus, public; UPDATE directus_settings SET \"${_col_escaped}\" = NULL;"
            UPDATED="1"
            continue
          fi
          case "$val_type" in
            string)
              val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
              ;;
            number|boolean)
              val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -r --arg k "$key" '.[$k]')"
              ;;
            *)
              val="$(printf '%s' "$EXTRA_SETTINGS_JSON" | jq -c --arg k "$key" '.[$k]')"
              ;;
          esac
          _update_setting "$key" "$val"
          UPDATED="1"
        else
          echo "⚠️ settings.yaml key '${key}' not found in directus_settings; skipping."
        fi
      done < "${EXTRA_SETTINGS_KEYS_FILE}"
      rm -f "${EXTRA_SETTINGS_KEYS_FILE}"
    fi
    
    if [ "$UPDATED" != "1" ]; then
      echo "⚠️ No applicable settings were updated."
    else
      echo "✅ Directus settings updated in database."
    fi
    
    if [ -z "${OPENAI_KEY:-}" ] && [ "$EXTRA_SETTINGS_HAS_KEYS" != "1" ]; then
      echo "ℹ️ No settings to apply from settings.yaml/OpenAI; continuing with owner/cleanup."
    fi
    
    echo "👤 Ensuring project owner is set..."
    if printf '%s\n' "$SETTINGS_COLS" | grep -qx "project_owner"; then
      CURRENT_OWNER="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT project_owner FROM directus_settings LIMIT 1;" || true)"
      if [ -z "${CURRENT_OWNER:-}" ] || [ "${CURRENT_OWNER}" = "null" ]; then
        OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT u.id FROM directus_users u JOIN directus_roles r ON u.role = r.id WHERE r.name='Administrator' ORDER BY u.id ASC LIMIT 1;" || true)"
        if [ -z "${OWNER_ID:-}" ] || [ "${OWNER_ID}" = "null" ]; then
          OWNER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus_users ORDER BY id ASC LIMIT 1;" || true)"
        fi
        if [ -n "${OWNER_ID:-}" ] && [ "${OWNER_ID}" != "null" ]; then
          _owner_escaped="$(printf '%s' "$OWNER_ID" | sed "s/'/''/g")"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 \
            -c "SET search_path TO directus, public; UPDATE directus_settings SET project_owner = '${_owner_escaped}' WHERE project_owner IS NULL;"
          echo "✅ Project owner set to ${OWNER_ID}"
        else
          echo "⚠️ No users found to set project owner."
        fi
      else
        echo "✅ Project owner already set."
      fi
    else
      echo "⚠️ project_owner column not found; skipping."
    fi
    
    echo "🧩 Ensuring local extensions are enabled..."
    EXT_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
      "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_extensions' LIMIT 1;" || true)"
    if [ "$EXT_TABLE_EXISTS" = "1" ]; then
      EXT_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_extensions' ORDER BY column_name;" || true)"
      _ensure_local_ext_enabled() {
        ext_folder="$1"
        ext_folder_sql="$(printf '%s' "$ext_folder" | sed "s/'/''/g")"
    
        if printf '%s\n' "$EXT_COLS" | grep -qx "folder"; then
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus_extensions WHERE folder='${ext_folder_sql}' AND source='local' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE folder='${ext_folder_sql}' AND source='local';"
            echo "✅ ${ext_folder} extension enabled."
          else
            EXT_ID="$(cat /proc/sys/kernel/random/uuid)"
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_extensions (id, enabled, source, folder, bundle) VALUES ('${EXT_ID}', true, 'local', '${ext_folder_sql}', NULL);"
            echo "✅ ${ext_folder} extension registered."
          fi
        else
          EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT 1 FROM directus_extensions WHERE name='${ext_folder_sql}' LIMIT 1;" || true)"
          if [ "$EXISTS" = "1" ]; then
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; UPDATE directus_extensions SET enabled=true WHERE name='${ext_folder_sql}';"
            echo "✅ ${ext_folder} extension enabled."
          else
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_extensions (name, enabled) VALUES ('${ext_folder_sql}', true);"
            echo "✅ ${ext_folder} extension registered."
          fi
        fi
      }
    
      _ensure_local_ext_enabled "github-profile-sync"
      _ensure_local_ext_enabled "ai-provider-access"
      _ensure_local_ext_enabled "cms-content-model-select"
    else
      echo "⚠️ directus_extensions table not found; skipping extension enable."
    fi

    RECON_DURATION_MS=$(( ($(date +%s) - RECON_STARTED_EPOCH) * 1000 ))
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       UPDATE schema_patch_log \
          SET patch_status='success', \
              patch_checksum='${RECON_PATCH_CHECKSUM_SQL}', \
              patch_group='${RECON_PATCH_GROUP_SQL}', \
              details='${RECON_PATCH_DETAILS_SQL}'::jsonb, \
              last_error=NULL, \
              applied_at=now(), \
              last_checked_at=now(), \
              duration_ms=${RECON_DURATION_MS} \
        WHERE patch_key='${RECON_PATCH_KEY_SQL}';"
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       UPDATE schema_patch_runs \
          SET patch_status='success', \
              error=NULL, \
              finished_at=now(), \
              duration_ms=${RECON_DURATION_MS} \
        WHERE run_id='${RECON_RUN_ID_SQL}';"
    RECON_DONE="1"
    trap - EXIT
    rm -f "${POSTSCHEMA_FAILED_FILE}" >/dev/null 2>&1 || true
    touch "${POSTSCHEMA_DB_READY_FILE}"
    touch "${POSTSCHEMA_READY_FILE}"

    echo "✅ Schema patch applied. Going idle."
    exec tail -f /dev/null
    
