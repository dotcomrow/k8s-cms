      set +e
      DF_COLS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
        "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_fields' ORDER BY column_name;" || true)"
      _df_has_col() { printf '%s\n' "$DF_COLS" | grep -qx "$1"; }
    
      DF_OPTIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
