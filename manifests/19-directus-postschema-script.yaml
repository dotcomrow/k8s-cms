             COALESCE(NULLIF(BTRIM(name), ''), theme_key) AS display_name, \
             CASE WHEN COALESCE(NULLIF(BTRIM(site_key), ''), '') = '' THEN 1 ELSE 0 END AS scope_rank, \
             COALESCE(date_updated, date_created, now()) AS ord_ts \
           FROM directus.cms_theme_packages \
           WHERE COALESCE(NULLIF(BTRIM(theme_key), ''), '') <> '' \
             AND LOWER(COALESCE(status, 'published')) = 'published' \
