    CMS_MODULES_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_modules') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
    CMS_LAYOUT_TEMPLATE_SLOTS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_layout_template_slots') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
    CMS_BLOCK_RICH_TEXT_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_block_rich_text') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
    CMS_BLOCK_HERO_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_block_hero') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
    CMS_BLOCK_CONTENT_REF_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc "SELECT CASE WHEN to_regclass('directus.cms_block_content_ref') IS NOT NULL THEN 1 ELSE 0 END;" || true)"

    if [ "${CMS_PAGE_BLOCKS_TABLE_EXISTS}" = "1" ] && [ "${CMS_PAGES_TABLE_EXISTS}" = "1" ] && [ "${CMS_LAYOUT_TEMPLATE_SLOTS_TABLE_EXISTS}" = "1" ]; then
      psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
        "SET search_path TO directus, public; \
         DROP TRIGGER IF EXISTS cms_page_blocks_slot_guard ON cms_page_blocks; \
         CREATE TRIGGER cms_page_blocks_slot_guard \
         BEFORE INSERT OR UPDATE \
         ON cms_page_blocks \
         FOR EACH ROW \
         EXECUTE FUNCTION directus.enforce_cms_page_block_slot(); \
         DROP TRIGGER IF EXISTS cms_page_blocks_sync_block_metadata ON cms_page_blocks; \
         CREATE TRIGGER cms_page_blocks_sync_block_metadata \
         AFTER INSERT OR UPDATE \
         ON cms_page_blocks \
         FOR EACH ROW \
         EXECUTE FUNCTION directus.sync_cms_block_metadata_from_page_block(); \
         DROP TRIGGER IF EXISTS cms_page_blocks_sync_organization ON cms_page_blocks; \
         CREATE TRIGGER cms_page_blocks_sync_organization \
