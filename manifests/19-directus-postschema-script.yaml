          fi
        fi

        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; DELETE FROM directus_fields WHERE collection='${_collection_sql}' AND field='copy_bookmark_action';"
        echo "✅ Removed field-level bookmark copy UX; use the Bookmark Copy module"
      }

      _remove_preset_bookmark_copy_field_meta
      set -e
    else
