      _df_json_sql() {
        _t="$1"
        _json="$2"
        if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
          printf "NULL"
          return
        fi
        _json_sql="$(printf '%s' "$_json" | sed "s/'/''/g")"
        case "$_t" in
          jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
          json) printf "'%s'::json" "$_json_sql" ;;
          text|character\ varying) printf "'%s'" "$_json_sql" ;;
          *) printf "NULL" ;;
        esac
      }
    
