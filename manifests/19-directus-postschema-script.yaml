    # Yugabyte can briefly surface catalog-version mismatches right after DDL.
    # Probe catalog stability (with retries) before allowing Directus startup.
    echo "⏳ Waiting for catalog stabilization after DDL..."
    POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE_RAW="${DIRECTUS_POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE:-3}"
    POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS_RAW="${DIRECTUS_POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS:-3}"
    POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE="$(printf '%s' "${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE_RAW}" | tr -dc '0-9')"
    POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS="$(printf '%s' "${POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS_RAW}" | tr -dc '0-9')"
    if [ -z "${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE:-}" ] || [ "${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE}" -lt 1 ]; then
      POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE=3
    fi
    if [ -z "${POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS:-}" ] || [ "${POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS}" -lt 1 ]; then
      POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS=3
    fi
    _catalog_stable_passes=0
    while [ "${_catalog_stable_passes}" -lt "${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE}" ]; do
      if _psql_yb_retry "SELECT relname FROM pg_index, pg_class, pg_attribute, pg_namespace WHERE indrelid = pg_class.oid AND nspname IN ('directus','public') AND pg_class.relnamespace = pg_namespace.oid AND pg_attribute.attrelid = pg_class.oid AND pg_attribute.attnum = ANY (pg_index.indkey) AND indisprimary AND indnatts = 1 AND relkind != 'S' LIMIT 1;" "catalog stability probe" 6 >/dev/null; then
        _catalog_stable_passes=$(( _catalog_stable_passes + 1 ))
        echo "  .. catalog probe ${_catalog_stable_passes}/${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE} passed"
      else
        _catalog_stable_passes=0
        echo "  .. catalog probe failed; retrying stability checks"
      fi
      if [ "${_catalog_stable_passes}" -lt "${POSTSCHEMA_CATALOG_STABLE_CONSECUTIVE}" ]; then
        sleep "${POSTSCHEMA_CATALOG_STABLE_SLEEP_SECONDS}"
      fi
    done
    echo "✅ Catalog stabilization checks passed"
    touch "${POSTSCHEMA_DB_READY_FILE}"
    echo "✅ DB reconcile phase complete; Directus startup may proceed."

    # 5c) Provision site-specific roles/policies/users/tokens/permissions (GitOps-driven).
    # - Keycloak `azp` (client id) -> Vault token -> Directus service user token.
    # - GraphQL schema/actions are permission-filtered; seed baseline read perms per site policy.
    echo "🧭 Provisioning Directus sites (roles/policies/users/permissions)..."
    SITES_FILE="/directus-sites/sites.yaml"
    if [ -f "$SITES_FILE" ]; then
      SITES_JSON="$(yq -o=json '.' "$SITES_FILE" 2>/dev/null || true)"
      if printf '%s' "$SITES_JSON" | jq -e '.sites | type=="array" and length>0' >/dev/null 2>&1; then
        ROLE_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_roles' ORDER BY column_name;" || true)"
        _has_role_col() { printf '%s\n' "$ROLE_COLS_ALL" | grep -qx "$1"; }
    
        POLICY_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_policies' LIMIT 1;" || true)"
        POLICY_COLS_ALL=""
        if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
          POLICY_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_policies' ORDER BY column_name;" || true)"
        fi
        _has_policy_col() { printf '%s\n' "$POLICY_COLS_ALL" | grep -qx "$1"; }
    
        ACCESS_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_access' LIMIT 1;" || true)"
        ACCESS_COLS_ALL=""
        if [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
          ACCESS_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_access' ORDER BY column_name;" || true)"
        fi
        _has_access_col() { printf '%s\n' "$ACCESS_COLS_ALL" | grep -qx "$1"; }
    
        USER_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_users' ORDER BY column_name;" || true)"
        _has_user_col() { printf '%s\n' "$USER_COLS_ALL" | grep -qx "$1"; }
    
        PERM_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='directus_permissions' LIMIT 1;" || true)"
        PERM_COLS_ALL=""
        PERM_FIELDS_TYPE=""
        PERMISSIONS_TYPE=""
        VALIDATION_TYPE=""
        PRESETS_TYPE=""
        PERM_ID_DEFAULT=""
        PERM_ID_HAS_DEFAULT="0"
        PERM_PRINC_COL=""
        if [ "${PERM_TABLE_EXISTS:-0}" = "1" ]; then
          PERM_COLS_ALL="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' ORDER BY column_name;" || true)"
          _has_perm_col() { printf '%s\n' "$PERM_COLS_ALL" | grep -qx "$1"; }
          PERM_FIELDS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type || ':' || udt_name FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='fields' LIMIT 1;" || true)"
          PERMISSIONS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='permissions' LIMIT 1;" || true)"
          VALIDATION_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='validation' LIMIT 1;" || true)"
          PRESETS_TYPE="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='presets' LIMIT 1;" || true)"
          PERM_ID_DEFAULT="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT column_default FROM information_schema.columns WHERE table_schema='directus' AND table_name='directus_permissions' AND column_name='id' LIMIT 1;" || true)"
          if [ -n "${PERM_ID_DEFAULT:-}" ] && [ "${PERM_ID_DEFAULT}" != "null" ]; then
            PERM_ID_HAS_DEFAULT="1"
          fi
          if _has_perm_col "policy"; then
            PERM_PRINC_COL="policy"
          elif _has_perm_col "role"; then
            PERM_PRINC_COL="role"
          elif _has_perm_col "role_id"; then
            PERM_PRINC_COL="role_id"
          elif _has_perm_col "policy_id"; then
            PERM_PRINC_COL="policy_id"
          fi
        else
          _has_perm_col() { return 1; }
        fi
    
        _json_empty_for_type() {
          _t="$1"
          case "$_t" in
            jsonb) printf "'{}'::jsonb" ;;
            json) printf "'{}'::json" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _fields_value_for_type() {
          _t="$1"
          case "$_t" in
            ARRAY:*) printf "ARRAY['*']::text[]" ;;
            jsonb:*|jsonb) printf "'[\"*\"]'::jsonb" ;;
            json:*|json) printf "'[\"*\"]'::json" ;;
            text:*|text|character\ varying:*|character\ varying) printf "'*'" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _json_value_for_type() {
          _t="$1"
          _json="$2"
          if [ -z "${_json:-}" ] || [ "${_json}" = "null" ]; then
            _json_empty_for_type "$_t"
            return
          fi
          _json_compact="$(printf '%s' "$_json" | jq -c '.' 2>/dev/null || true)"
          if [ -z "${_json_compact:-}" ] || [ "${_json_compact}" = "null" ]; then
            _json_empty_for_type "$_t"
            return
          fi
          _json_sql="$(printf '%s' "$_json_compact" | sed "s/'/''/g")"
          case "$_t" in
            jsonb) printf "'%s'::jsonb" "$_json_sql" ;;
            json) printf "'%s'::json" "$_json_sql" ;;
            *) printf "NULL" ;;
          esac
        }
    
        _fields_value_from_config_for_type() {
          _t="$1"
          _cfg="$2"
          if [ -z "${_cfg:-}" ] || [ "${_cfg}" = "null" ]; then
            _fields_value_for_type "$_t"
            return
          fi
          _fields_json="$(printf '%s' "$_cfg" | jq -c 'if type=="array" then map(tostring) elif type=="string" then [.] else null end' 2>/dev/null || true)"
          if [ -z "${_fields_json:-}" ] || [ "${_fields_json}" = "null" ]; then
            _fields_value_for_type "$_t"
            return
          fi
          case "$_t" in
            ARRAY:*)
              _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
              if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                printf "ARRAY['*']::text[]"
              else
                _arr_sql="$(printf '%s' "$_csv" | sed "s/'/''/g;s/,/','/g")"
                printf "ARRAY['%s']::text[]" "$_arr_sql"
              fi
              ;;
            jsonb:*|jsonb)
              _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
              printf "'%s'::jsonb" "$_fields_sql"
              ;;
            json:*|json)
              _fields_sql="$(printf '%s' "$_fields_json" | sed "s/'/''/g")"
              printf "'%s'::json" "$_fields_sql"
              ;;
            text:*|text|character\ varying:*|character\ varying)
              _csv="$(printf '%s' "$_fields_json" | jq -r 'map(tostring) | join(",")' 2>/dev/null || true)"
              if [ -z "${_csv:-}" ] || [ "${_csv}" = "null" ]; then
                _csv='*'
              fi
              _csv_sql="$(printf '%s' "$_csv" | sed "s/'/''/g")"
              printf "'%s'" "$_csv_sql"
              ;;
            *)
            printf "NULL"
            ;;
          esac
        }

        _upsert_policy_action_permission() {
          _policy_id="$1"
          _collection="$2"
          _action="$3"
          _permissions_cfg="${4:-null}"
          _validation_cfg="${5:-null}"
          _fields_cfg="${6:-null}"
          _presets_cfg="${7:-null}"
          if [ -z "${_policy_id:-}" ] || [ -z "${_collection:-}" ] || [ -z "${_action:-}" ]; then
            return 0
          fi
          if [ "${PERM_TABLE_EXISTS:-0}" != "1" ] || [ -z "${PERM_PRINC_COL:-}" ]; then
            return 0
          fi

          _policy_id_sql="$(printf '%s' "${_policy_id}" | sed "s/'/''/g")"
          _collection_sql="$(printf '%s' "${_collection}" | sed "s/'/''/g")"
          _action_sql="$(printf '%s' "${_action}" | sed "s/'/''/g")"
          _perms_val="$(_json_value_for_type "${PERMISSIONS_TYPE:-}" "${_permissions_cfg}")"
          _val_val="$(_json_value_for_type "${VALIDATION_TYPE:-}" "${_validation_cfg}")"
          _pre_val="$(_json_value_for_type "${PRESETS_TYPE:-}" "${_presets_cfg}")"
          _fields_val="$(_fields_value_from_config_for_type "${PERM_FIELDS_TYPE:-}" "${_fields_cfg}")"

          existing_perm_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.directus_permissions WHERE ${PERM_PRINC_COL}='${_policy_id_sql}' AND collection='${_collection_sql}' AND action='${_action_sql}' LIMIT 1;" || true)"
          existing_perm_id="$(printf '%s' "$existing_perm_id" | tr -d '\r')"

          if [ -n "${existing_perm_id:-}" ] && [ "${existing_perm_id}" != "null" ]; then
            SETS=""
            if _has_perm_col "permissions"; then SETS="${SETS},permissions=${_perms_val}"; fi
            if _has_perm_col "validation"; then SETS="${SETS},validation=${_val_val}"; fi
            if _has_perm_col "presets"; then SETS="${SETS},presets=${_pre_val}"; fi
            if _has_perm_col "fields"; then SETS="${SETS},fields=${_fields_val}"; fi
            if [ -n "${SETS:-}" ]; then
              perm_id_sql="$(printf '%s' "$existing_perm_id" | sed "s/'/''/g")"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; UPDATE directus_permissions SET ${SETS#,} WHERE id='${perm_id_sql}';"
            fi
            echo "✅ Reconciled ${_action_sql} on ${_collection_sql} for policy '${role_name}'"
            return 0
          fi

          PCOLS="${PERM_PRINC_COL},collection,action"
          PVALS="'${_policy_id_sql}','${_collection_sql}','${_action_sql}'"
          if [ "${PERM_ID_HAS_DEFAULT:-0}" != "1" ]; then
            pid="$(cat /proc/sys/kernel/random/uuid)"
            PCOLS="id,${PCOLS}"
            PVALS="'${pid}',${PVALS}"
          fi
          if _has_perm_col "permissions"; then PCOLS="${PCOLS},permissions"; PVALS="${PVALS},${_perms_val}"; fi
          if _has_perm_col "validation"; then PCOLS="${PCOLS},validation"; PVALS="${PVALS},${_val_val}"; fi
          if _has_perm_col "presets"; then PCOLS="${PCOLS},presets"; PVALS="${PVALS},${_pre_val}"; fi
          if _has_perm_col "fields"; then PCOLS="${PCOLS},fields"; PVALS="${PVALS},${_fields_val}"; fi
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
            "SET search_path TO directus, public; INSERT INTO directus_permissions (${PCOLS}) VALUES (${PVALS});"
          echo "✅ Granted ${_action_sql} on ${_collection_sql} to policy '${role_name}'"
        }
    
        DIRECTUS_API_BASE="http://127.0.0.1:8055"
        DIRECTUS_ACCESS_TOKEN=""
        _directus_api_enabled="0"
        DIRECTUS_API_CONNECT_TIMEOUT_SECONDS="${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS:-5}"
        DIRECTUS_API_MAX_TIME_SECONDS="${DIRECTUS_API_MAX_TIME_SECONDS:-20}"
    
        _directus_api_get() {
          _path="$1"
          shift || true
          curl -sS -f \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
            --get "${DIRECTUS_API_BASE}${_path}" "$@"
        }
    
        _directus_api_write() {
          _method="$1"
          _path="$2"
          _payload="$3"
          curl -sS -f -X "${_method}" \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${DIRECTUS_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${_payload}" \
            "${DIRECTUS_API_BASE}${_path}"
        }
    
        _directus_find_flow_id_by_name() {
          _name="$1"
          _name_sql="$(printf '%s' "${_name}" | sed "s/'/''/g")"
          _id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id
             FROM directus.directus_flows
             WHERE name='${_name_sql}'
             ORDER BY
               CASE WHEN COALESCE(status, '')='active' THEN 0 ELSE 1 END,
               date_created DESC NULLS LAST,
               id DESC
             LIMIT 1;" || true)"
          if [ -z "${_id:-}" ] || [ "${_id}" = "null" ]; then
            _id="$(_directus_api_get "/flows" \
              --data-urlencode "filter[name][_eq]=${_name}" \
              --data-urlencode "sort=-status,-date_created,-id" \
              --data-urlencode "limit=1" \
              --data-urlencode "fields=id" \
              2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
          fi
          _id="$(printf '%s' "${_id:-}" | tr -d '\r')"
          printf '%s' "${_id:-}"
        }
    
        _directus_find_operation_id() {
          _flow_id="$1"
          _key="$2"
          _id="$(_directus_api_get "/operations" \
            --data-urlencode "filter[flow][_eq]=${_flow_id}" \
            --data-urlencode "filter[key][_eq]=${_key}" \
            --data-urlencode "sort=-date_updated" \
            --data-urlencode "limit=1" \
            --data-urlencode "fields=id" \
            2>/dev/null | jq -r '.data[0].id // empty' 2>/dev/null || true)"
          if [ -z "${_id:-}" ] || [ "${_id}" = "null" ]; then
            _flow_sql="$(printf '%s' "${_flow_id}" | sed "s/'/''/g")"
            _key_sql="$(printf '%s' "${_key}" | sed "s/'/''/g")"
            _id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_operations WHERE flow='${_flow_sql}' AND key='${_key_sql}' ORDER BY date_created DESC NULLS LAST, id DESC LIMIT 1;" || true)"
          fi
          _id="$(printf '%s' "${_id:-}" | tr -d '\r')"
          printf '%s' "${_id:-}"
        }

        _directus_dedupe_operation_key() {
          _flow_id="$1"
          _op_key="$2"
          _keep_id="$3"
          if [ -z "${_flow_id:-}" ] || [ "${_flow_id}" = "null" ] \
            || [ -z "${_op_key:-}" ] || [ "${_op_key}" = "null" ] \
            || [ -z "${_keep_id:-}" ] || [ "${_keep_id}" = "null" ]; then
            return 0
          fi

          _flow_sql="$(printf '%s' "${_flow_id}" | sed "s/'/''/g")"
          _op_key_sql="$(printf '%s' "${_op_key}" | sed "s/'/''/g")"
          _keep_sql="$(printf '%s' "${_keep_id}" | sed "s/'/''/g")"

          if _psql_yb_retry \
            "WITH dups AS ( \
               SELECT id \
               FROM directus_operations \
               WHERE flow='${_flow_sql}' \
                 AND key='${_op_key_sql}' \
                 AND id<>'${_keep_sql}' \
             ) \
             UPDATE directus_operations \
             SET resolve=NULL \
             WHERE flow='${_flow_sql}' \
               AND resolve IN (SELECT id FROM dups); \
             WITH dups AS ( \
               SELECT id \
               FROM directus_operations \
               WHERE flow='${_flow_sql}' \
                 AND key='${_op_key_sql}' \
                 AND id<>'${_keep_sql}' \
             ) \
             UPDATE directus_operations \
             SET reject=NULL \
             WHERE flow='${_flow_sql}' \
               AND reject IN (SELECT id FROM dups); \
             DELETE FROM directus_operations \
             WHERE flow='${_flow_sql}' \
               AND key='${_op_key_sql}' \
               AND id<>'${_keep_sql}';" \
            "dedupe operation key ${_op_key} in flow ${_flow_id}" >/dev/null 2>&1; then
            return 0
          fi

          echo "⚠️ Failed to dedupe duplicate operations for flow='${_flow_id}' key='${_op_key}'" >&2
          return 0
        }

        _directus_deactivate_duplicate_flow_names() {
          _flow_name="$1"
          _keep_id="$2"
          if [ -z "${_flow_name:-}" ] || [ "${_flow_name}" = "null" ] \
            || [ -z "${_keep_id:-}" ] || [ "${_keep_id}" = "null" ]; then
            return 0
          fi

          _flow_name_sql="$(printf '%s' "${_flow_name}" | sed "s/'/''/g")"
          _keep_sql="$(printf '%s' "${_keep_id}" | sed "s/'/''/g")"
          if ! _psql_yb_retry \
            "UPDATE directus_flows \
             SET status='inactive' \
             WHERE name='${_flow_name_sql}' \
               AND id<>'${_keep_sql}' \
               AND COALESCE(status, '')<>'inactive';" \
            "deactivate duplicate flows named ${_flow_name}"; then
            echo "⚠️ Failed to deactivate duplicate flow names for '${_flow_name}'"
          fi
          return 0
        }
    
        _directus_upsert_operation() {
          _flow_id="$1"
          _op_key="$2"
          _op_type="$3"
          _op_name="$4"
          _pos_x="$5"
          _pos_y="$6"
          _options_json="$7"
    
          _op_id="$(_directus_find_operation_id "${_flow_id}" "${_op_key}")"
          _create_payload="$(jq -nc \
            --arg flow "${_flow_id}" \
            --arg key "${_op_key}" \
            --arg type "${_op_type}" \
            --arg name "${_op_name}" \
            --argjson position_x "${_pos_x}" \
            --argjson position_y "${_pos_y}" \
            --argjson options "${_options_json}" \
            '{flow:$flow,key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options}')"
          _update_payload="$(jq -nc \
            --arg key "${_op_key}" \
            --arg type "${_op_type}" \
            --arg name "${_op_name}" \
            --argjson position_x "${_pos_x}" \
            --argjson position_y "${_pos_y}" \
            --argjson options "${_options_json}" \
            '{key:$key,type:$type,name:$name,position_x:$position_x,position_y:$position_y,options:$options}')"
    
          if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
            _attempt=1
            _max_attempts=8
            while [ "${_attempt}" -le "${_max_attempts}" ]; do
              if _directus_api_write "PATCH" "/operations/${_op_id}" "${_update_payload}" >/tmp/directus-op-upsert.json 2>/dev/null; then
                break
              fi
              sleep 1
              _attempt=$(( _attempt + 1 ))
            done
            _directus_dedupe_operation_key "${_flow_id}" "${_op_key}" "${_op_id}"
            printf '%s' "${_op_id}"
            return
          fi
    
          _attempt=1
          _max_attempts=8
          _op_id=""
          while [ "${_attempt}" -le "${_max_attempts}" ]; do
            _created="$(_directus_api_write "POST" "/operations" "${_create_payload}" 2>/dev/null || true)"
            _op_id="$(printf '%s' "${_created}" | jq -r '.data.id // empty' 2>/dev/null || true)"
            if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
              break
            fi
            _op_id="$(_directus_find_operation_id "${_flow_id}" "${_op_key}")"
            if [ -n "${_op_id:-}" ] && [ "${_op_id}" != "null" ]; then
              break
            fi
            sleep 1
            _attempt=$(( _attempt + 1 ))
          done
          _directus_dedupe_operation_key "${_flow_id}" "${_op_key}" "${_op_id}"
          printf '%s' "${_op_id:-}"
        }
    
        _directus_set_operation_links() {
          _op_id="$1"
          _resolve="$2"
          _reject="$3"
          if [ -z "${_op_id:-}" ] || [ "${_op_id}" = "null" ]; then
            return 0
          fi
          _op_id_sql="$(printf '%s' "${_op_id}" | sed "s/'/''/g")"
          _resolve_sql="NULL"
          _reject_sql="NULL"
          if [ -n "${_resolve:-}" ] && [ "${_resolve}" != "null" ]; then
            _resolve_sql="'$(printf '%s' "${_resolve}" | sed "s/'/''/g")'"
          fi
          if [ -n "${_reject:-}" ] && [ "${_reject}" != "null" ]; then
            _reject_sql="'$(printf '%s' "${_reject}" | sed "s/'/''/g")'"
          fi
          _payload="$(jq -nc --arg resolve "${_resolve}" --arg reject "${_reject}" \
            '{} | (if $resolve != "" and $resolve != "null" then .resolve=$resolve else . end) | (if $reject != "" and $reject != "null" then .reject=$reject else . end)')"

          # Directus enforces unique(resolve) and unique(reject) on directus_operations.
          # Clear conflicting links globally before writing this operation's links.
          if [ "${_resolve_sql}" != "NULL" ]; then
            if ! _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET resolve=NULL WHERE id<>'${_op_id_sql}' AND resolve=${_resolve_sql};" \
              "clear conflicting resolve link for ${_op_id}"; then
              echo "⚠️ Unable to clear conflicting resolve links for operation '${_op_id}'"
            fi
          fi
          if [ "${_reject_sql}" != "NULL" ]; then
            if ! _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET reject=NULL WHERE id<>'${_op_id_sql}' AND reject=${_reject_sql};" \
              "clear conflicting reject link for ${_op_id}"; then
              echo "⚠️ Unable to clear conflicting reject links for operation '${_op_id}'"
            fi
          fi

          if [ "${_payload}" = "{}" ]; then
            if _psql_yb_retry \
              "SET search_path TO directus, public; UPDATE directus_operations SET resolve=${_resolve_sql}, reject=${_reject_sql} WHERE id='${_op_id_sql}';" \
              "clear operation links ${_op_id}"; then
              return 0
            fi
          fi
          _attempt=1
          _max_attempts=3
          while [ "${_attempt}" -le "${_max_attempts}" ]; do
            _directus_api_write "PATCH" "/operations/${_op_id}" "${_payload}" >/tmp/directus-op-links.json 2>/dev/null || true
            _current="$(_directus_api_get "/operations/${_op_id}" --data-urlencode "fields=resolve,reject" 2>/dev/null || true)"
            _current_resolve="$(printf '%s' "${_current}" | jq -r '.data.resolve // empty' 2>/dev/null || true)"
            _current_reject="$(printf '%s' "${_current}" | jq -r '.data.reject // empty' 2>/dev/null || true)"
            if [ "${_current_resolve}" = "${_resolve}" ] && [ "${_current_reject}" = "${_reject}" ]; then
              return 0
            fi
            sleep 1
            _attempt=$(( _attempt + 1 ))
          done
          if _psql_yb_retry \
            "SET search_path TO directus, public; UPDATE directus_operations SET resolve=${_resolve_sql}, reject=${_reject_sql} WHERE id='${_op_id_sql}';" \
            "set operation links ${_op_id}"; then
            return 0
          fi
          echo "⚠️ Failed to persist links for operation '${_op_id}' (resolve='${_resolve}', reject='${_reject}') after retries"
          return 0
        }

        _upsert_translation_prewarm_flow() {
          _flow_name="$1"
          _scope="$2"
          _trigger_key_template="$3"
          _event_name="$4"
          _position_y="${5:-201}"
          _collections_json='["cms_content_items"]'
          _description="Queues configured translation prewarm languages for CMS content items after ${_event_name}."
          _flow_payload="$(jq -nc \
            --arg name "${_flow_name}" \
            --arg scope "${_scope}" \
            --arg desc "${_description}" \
            --argjson collections "${_collections_json}" \
            '{name:$name,trigger:"event",status:"active",accountability:"all",icon:"translate",color:"#1565C0",description:$desc,options:{type:"action",scope:[$scope],collections:$collections}}')"

          _flow_id="$(_directus_find_flow_id_by_name "${_flow_name}")"
          if [ -n "${_flow_id:-}" ] && [ "${_flow_id}" != "null" ]; then
            _directus_api_write "PATCH" "/flows/${_flow_id}" "${_flow_payload}" >/tmp/directus-flow-upsert.json 2>/dev/null || true
          else
            _created_flow="$(_directus_api_write "POST" "/flows" "${_flow_payload}" 2>/dev/null || true)"
            _flow_id="$(printf '%s' "${_created_flow}" | jq -r '.data.id // empty' 2>/dev/null || true)"
          fi

          _directus_deactivate_duplicate_flow_names "${_flow_name}" "${_flow_id}"
          if [ -z "${_flow_id:-}" ] || [ "${_flow_id}" = "null" ]; then
            echo "⚠️ Failed to ensure translation prewarm flow '${_flow_name}'"
            return 0
          fi

          _request_options="$(jq -nc \
            --arg event "${_event_name}" \
            --arg key "${_trigger_key_template}" \
            '{method:"POST",url:"http://cms-content-resolver.directus.svc.cluster.local:8080/content/translations/prewarm",timeout:120000,headers:[{header:"Content-Type",value:"application/json"},{header:"Accept",value:"application/json"}],body:{source:"directus",event:$event,collection:"{{ $trigger.collection }}",content_item_id:$key}}')"
          _request_op_id="$(_directus_upsert_operation "${_flow_id}" "queue_translation_prewarm" "request" "Queue Translation Prewarm" 19 "${_position_y}" "${_request_options}")"
          _directus_set_operation_links "${_request_op_id}" "" ""
          if [ -n "${_request_op_id:-}" ] && [ "${_request_op_id}" != "null" ]; then
            _directus_api_write "PATCH" "/flows/${_flow_id}" \
              "$(jq -nc --arg operation "${_request_op_id}" '{operation:$operation,status:"active"}')" \
              >/tmp/directus-flow-upsert.json 2>/dev/null || true
            echo "✅ Reconciled translation prewarm flow '${_flow_name}'"
          else
            echo "⚠️ Failed to ensure translation prewarm operation for '${_flow_name}'"
          fi
        }

        _upsert_translation_prewarm_flow "CMS Content Translation Prewarm - Create" "items.create" "{{ $trigger.key }}" "items.create" 201
        _upsert_translation_prewarm_flow "CMS Content Translation Prewarm - Update" "items.update" "{{ $trigger.keys[0] }}" "items.update" 241
    
        _vault_kv_read_field() {
          _path="$1"
          _field="$2"
          if [ -z "${_path:-}" ] || [ "${_path}" = "null" ] || [ -z "${_field:-}" ] || [ "${_field}" = "null" ]; then
            return 1
          fi
          _response="$(curl -sS -f -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${_path}" 2>/dev/null || true)"
          if [ -z "${_response:-}" ]; then
            return 1
          fi
          _value="$(printf '%s' "${_response}" | jq -r --arg field "${_field}" '.data.data[$field] // empty' 2>/dev/null || true)"
          _value="$(printf '%s' "${_value}" | tr -d '\r')"
          if [ -z "${_value:-}" ] || [ "${_value}" = "null" ]; then
            return 1
          fi
          printf '%s' "${_value}"
        }
    
        _urlencode_value() {
          _raw="$1"
          jq -nr --arg v "${_raw}" '$v|@uri' 2>/dev/null || true
        }
    
        _directus_verify_token() {
          _candidate="$1"
          if [ -z "${_candidate:-}" ] || [ "${_candidate}" = "null" ]; then
            return 1
          fi
          _verify_code="$(curl -sS -o /tmp/directus-token-verify.json -w '%{http_code}' \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${_candidate}" \
            "${DIRECTUS_API_BASE}/users/me" || true)"
          if [ "${_verify_code}" != "200" ]; then
            return 1
          fi
          _flows_code="$(curl -sS -o /tmp/directus-token-verify-flows.json -w '%{http_code}' \
            --connect-timeout "${DIRECTUS_API_CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${DIRECTUS_API_MAX_TIME_SECONDS}" \
            -H "Authorization: Bearer ${_candidate}" \
            --get "${DIRECTUS_API_BASE}/flows" \
            --data-urlencode "limit=1" \
            --data-urlencode "fields=id" || true)"
          [ "${_flows_code}" = "200" ]
        }

        echo "⏳ Waiting for Directus /server/health before API flow reconciliation..."
        _directus_wait_attempt=0
        _directus_wait_max=200
        until curl -sf --connect-timeout 3 --max-time 5 http://127.0.0.1:8055/server/health >/dev/null; do
          _directus_wait_attempt=$((_directus_wait_attempt + 1))
          if [ "${_directus_wait_attempt}" -ge "${_directus_wait_max}" ]; then
            echo "⚠️ Timed out waiting for Directus health endpoint; continuing with best-effort API flow reconciliation."
            break
          fi
          echo "  .. Directus not ready yet"
          sleep 3
        done
        if [ "${_directus_wait_attempt}" -lt "${_directus_wait_max}" ]; then
          echo "✅ Directus is healthy for API flow reconciliation"
        fi
    
        echo "🔐 Preparing Directus API token for flow provisioning..."
        DIRECTUS_FLOW_API_TOKEN_VAULT_PATH="${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH:-secret/data/directus/gravitee/flows/admin}"
    
        FLOW_TOKEN_CODE="$(curl -sS -o /tmp/directus-flow-token.json -w '%{http_code}' \
          -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
        if [ "${FLOW_TOKEN_CODE}" = "200" ]; then
          DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.data.token // empty' /tmp/directus-flow-token.json 2>/dev/null || true)"
        fi
    
        if _directus_verify_token "${DIRECTUS_ACCESS_TOKEN:-}"; then
          _directus_api_enabled="1"
          echo "✅ Directus API token acquired from Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
        else
          FLOW_ADMIN_TOKEN=""
          if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
            echo "⚠️ Vault token at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH} is invalid for Directus API; rotating token"
          else
            echo "ℹ️ No Directus API token found at ${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}; creating one"
          fi
    
          if _has_user_col "token"; then
            FLOW_ADMIN_ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_roles WHERE name='Administrator' LIMIT 1;" || true)"
            FLOW_ADMIN_ROLE_ID="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | tr -d '\r')"
            if [ -n "${FLOW_ADMIN_ROLE_ID:-}" ] && [ "${FLOW_ADMIN_ROLE_ID}" != "null" ]; then
              # Ensure Administrator role has an attached admin/app policy before token verification.
              if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ] && [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
                FLOW_ADMIN_POLICY_WHERE="LOWER(name)=LOWER('Policy for Administrator')"
                if _has_policy_col "admin_access"; then FLOW_ADMIN_POLICY_WHERE="${FLOW_ADMIN_POLICY_WHERE} AND admin_access=true"; fi
                if _has_policy_col "app_access"; then FLOW_ADMIN_POLICY_WHERE="${FLOW_ADMIN_POLICY_WHERE} AND app_access=true"; fi
                FLOW_ADMIN_POLICY_ORDER="id DESC"
                if _has_policy_col "date_created"; then FLOW_ADMIN_POLICY_ORDER="date_created DESC NULLS LAST, id DESC"; fi
                FLOW_ADMIN_POLICY_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT id FROM directus.directus_policies WHERE ${FLOW_ADMIN_POLICY_WHERE} ORDER BY ${FLOW_ADMIN_POLICY_ORDER} LIMIT 1;" || true)"
                FLOW_ADMIN_POLICY_ID="$(printf '%s' "$FLOW_ADMIN_POLICY_ID" | tr -d '\r')"

                if [ -z "${FLOW_ADMIN_POLICY_ID:-}" ] || [ "${FLOW_ADMIN_POLICY_ID}" = "null" ]; then
                  FLOW_ADMIN_POLICY_ID="$(cat /proc/sys/kernel/random/uuid)"
                  FPCOLS="id,name"
                  FPVALS="'${FLOW_ADMIN_POLICY_ID}','Policy for Administrator'"
                  if _has_policy_col "description"; then FPCOLS="${FPCOLS},description"; FPVALS="${FPVALS},'Admin policy for flow provisioning'"; fi
                  if _has_policy_col "icon"; then FPCOLS="${FPCOLS},icon"; FPVALS="${FPVALS},'verified'"; fi
                  if _has_policy_col "admin_access"; then FPCOLS="${FPCOLS},admin_access"; FPVALS="${FPVALS},true"; fi
                  if _has_policy_col "app_access"; then FPCOLS="${FPCOLS},app_access"; FPVALS="${FPVALS},true"; fi
                  if _has_policy_col "enforce_tfa"; then FPCOLS="${FPCOLS},enforce_tfa"; FPVALS="${FPVALS},false"; fi
                  if _has_policy_col "ip_access"; then FPCOLS="${FPCOLS},ip_access"; FPVALS="${FPVALS},NULL"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_policies (${FPCOLS}) VALUES (${FPVALS});"
                  echo "✅ Created fallback admin policy for flow provisioning"
                fi

                FLOW_ACCESS_WHERE="role='${FLOW_ADMIN_ROLE_ID}' AND policy='${FLOW_ADMIN_POLICY_ID}'"
                if _has_access_col "user"; then FLOW_ACCESS_WHERE="${FLOW_ACCESS_WHERE} AND \"user\" IS NULL"; fi
                _FLOW_ACCESS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus.directus_access WHERE ${FLOW_ACCESS_WHERE} LIMIT 1;" || true)"
                _FLOW_ACCESS_EXISTS="$(printf '%s' "$_FLOW_ACCESS_EXISTS" | tr -d '\r')"
                if [ "${_FLOW_ACCESS_EXISTS}" != "1" ]; then
                  FACOLS="id,policy,role"
                  FAVALS="'$(cat /proc/sys/kernel/random/uuid)','${FLOW_ADMIN_POLICY_ID}','${FLOW_ADMIN_ROLE_ID}'"
                  if _has_access_col "user"; then FACOLS="${FACOLS},\"user\""; FAVALS="${FAVALS},NULL"; fi
                  if _has_access_col "sort"; then FACOLS="${FACOLS},sort"; FAVALS="${FAVALS},NULL"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_access (${FACOLS}) VALUES (${FAVALS});"
                  echo "✅ Linked Administrator role to admin policy for flow provisioning"
                fi
              fi

              flow_admin_email="svc-flow-admin@svc.local"
              flow_admin_email_sql="$(printf '%s' "$flow_admin_email" | sed "s/'/''/g")"
              FLOW_ADMIN_USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_users WHERE email = '${flow_admin_email_sql}' LIMIT 1;" || true)"
              FLOW_ADMIN_USER_ID="$(printf '%s' "$FLOW_ADMIN_USER_ID" | tr -d '\r')"
    
              FLOW_ADMIN_TOKEN="${DIRECTUS_ACCESS_TOKEN:-}"
              if [ -z "${FLOW_ADMIN_TOKEN:-}" ] || [ "${FLOW_ADMIN_TOKEN}" = "null" ]; then
                FLOW_ADMIN_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
              fi
              flow_admin_role_sql="$(printf '%s' "$FLOW_ADMIN_ROLE_ID" | sed "s/'/''/g")"
              flow_admin_token_sql="$(printf '%s' "$FLOW_ADMIN_TOKEN" | sed "s/'/''/g")"
    
              if [ -z "${FLOW_ADMIN_USER_ID:-}" ] || [ "${FLOW_ADMIN_USER_ID}" = "null" ]; then
                FLOW_ADMIN_USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                UCOLS="id,email"
                UVALS="'${FLOW_ADMIN_USER_ID}','${flow_admin_email_sql}'"
                if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${flow_admin_role_sql}'"; fi
                if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${flow_admin_token_sql}'"; fi
                if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'flow-admin'"; fi
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                echo "✅ Created flow admin service user ${flow_admin_email}"
              else
                flow_admin_user_id_sql="$(printf '%s' "$FLOW_ADMIN_USER_ID" | sed "s/'/''/g")"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE directus_users SET role='${flow_admin_role_sql}', token='${flow_admin_token_sql}', status='active' WHERE id='${flow_admin_user_id_sql}';"
                echo "✅ Updated flow admin service user ${flow_admin_email}"
              fi

              # Some Directus auth paths require explicit user-policy access rows.
              if [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ] && [ -n "${FLOW_ADMIN_POLICY_ID:-}" ] \
                && [ "${FLOW_ADMIN_POLICY_ID}" != "null" ] && [ -n "${FLOW_ADMIN_USER_ID:-}" ] \
                && [ "${FLOW_ADMIN_USER_ID}" != "null" ] && _has_access_col "user"; then
                flow_admin_user_id_sql="$(printf '%s' "$FLOW_ADMIN_USER_ID" | sed "s/'/''/g")"
                flow_admin_policy_sql="$(printf '%s' "$FLOW_ADMIN_POLICY_ID" | sed "s/'/''/g")"
                FLOW_USER_ACCESS_WHERE="policy='${flow_admin_policy_sql}' AND \"user\"='${flow_admin_user_id_sql}'"
                if _has_access_col "role"; then
                  FLOW_USER_ACCESS_WHERE="${FLOW_USER_ACCESS_WHERE} AND role='${flow_admin_role_sql}'"
                fi
                FLOW_USER_ACCESS_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                  "SELECT 1 FROM directus.directus_access WHERE ${FLOW_USER_ACCESS_WHERE} LIMIT 1;" || true)"
                FLOW_USER_ACCESS_EXISTS="$(printf '%s' "$FLOW_USER_ACCESS_EXISTS" | tr -d '\r')"
                if [ "${FLOW_USER_ACCESS_EXISTS}" != "1" ]; then
                  FUACOLS="id,policy"
                  FUAVALS="'$(cat /proc/sys/kernel/random/uuid)','${flow_admin_policy_sql}'"
                  if _has_access_col "role"; then FUACOLS="${FUACOLS},role"; FUAVALS="${FUAVALS},'${flow_admin_role_sql}'"; fi
                  FUACOLS="${FUACOLS},\"user\""
                  FUAVALS="${FUAVALS},'${flow_admin_user_id_sql}'"
                  if _has_access_col "sort"; then FUACOLS="${FUACOLS},sort"; FUAVALS="${FUAVALS},NULL"; fi
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; INSERT INTO directus_access (${FUACOLS}) VALUES (${FUAVALS});"
                  echo "✅ Linked flow admin user to administrator policy for flow provisioning"
                fi
              fi

              payload="$(jq -nc --arg t "$FLOW_ADMIN_TOKEN" '{data:{token:$t}}')"
              FLOW_TOKEN_WRITE_CODE="$(curl -sS -o /tmp/directus-flow-token-write.json -w '%{http_code}' -X POST \
                -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                -d "${payload}" "${VAULT_ADDR}/v1/${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH}" || true)"
              if [ "${FLOW_TOKEN_WRITE_CODE}" = "200" ] || [ "${FLOW_TOKEN_WRITE_CODE}" = "204" ]; then
                echo "✅ Directus flow API token stored in Vault (${DIRECTUS_FLOW_API_TOKEN_VAULT_PATH})"
              else
                echo "⚠️ Failed to write Directus flow API token to Vault (HTTP ${FLOW_TOKEN_WRITE_CODE})"
              fi
    
              if _directus_verify_token "${FLOW_ADMIN_TOKEN:-}"; then
                DIRECTUS_ACCESS_TOKEN="${FLOW_ADMIN_TOKEN}"
                _directus_api_enabled="1"
                echo "✅ Directus API token prepared for flow reconciliation"
              else
                echo "⚠️ Generated Directus flow token did not authenticate; will attempt legacy login fallback"
              fi
            else
              echo "⚠️ Administrator role not found; cannot mint Directus API token for flow reconciliation"
            fi
          else
            echo "⚠️ directus_users.token column not found; cannot mint Directus API token for flow reconciliation"
          fi
        fi

        # Retry token verification briefly to absorb startup auth propagation races.
        if [ "${_directus_api_enabled}" != "1" ] && [ -n "${FLOW_ADMIN_TOKEN:-}" ] && [ "${FLOW_ADMIN_TOKEN}" != "null" ]; then
          _verify_retry=0
          while [ "${_verify_retry}" -lt 10 ]; do
            if _directus_verify_token "${FLOW_ADMIN_TOKEN}"; then
              DIRECTUS_ACCESS_TOKEN="${FLOW_ADMIN_TOKEN}"
              _directus_api_enabled="1"
              echo "✅ Directus API token became valid after retry (${_verify_retry})"
              break
            fi
            _verify_retry=$(( _verify_retry + 1 ))
            sleep 2
          done
        fi

        # Fallback for environments that still allow local email/password auth.
        if [ "${_directus_api_enabled}" != "1" ]; then
          ADMIN_CREDS_CODE="$(curl -sS -o /tmp/directus-admin-creds.json -w '%{http_code}' \
            -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/secret/data/directus/admin" || true)"
          if [ "${ADMIN_CREDS_CODE}" = "200" ]; then
            DIRECTUS_ADMIN_EMAIL="$(jq -r '.data.data.email // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
            DIRECTUS_ADMIN_PASSWORD="$(jq -r '.data.data.password // empty' /tmp/directus-admin-creds.json 2>/dev/null || true)"
            if [ -n "${DIRECTUS_ADMIN_EMAIL:-}" ] && [ -n "${DIRECTUS_ADMIN_PASSWORD:-}" ] \
              && [ "${DIRECTUS_ADMIN_EMAIL}" != "null" ] && [ "${DIRECTUS_ADMIN_PASSWORD}" != "null" ]; then
              LOGIN_PAYLOAD="$(jq -nc --arg email "${DIRECTUS_ADMIN_EMAIL}" --arg password "${DIRECTUS_ADMIN_PASSWORD}" '{email:$email,password:$password}')"
              LOGIN_CODE="$(curl -sS -o /tmp/directus-login.json -w '%{http_code}' -X POST \
                -H "Content-Type: application/json" \
                -d "${LOGIN_PAYLOAD}" \
                "${DIRECTUS_API_BASE}/auth/login" || true)"
              if [ "${LOGIN_CODE}" = "200" ]; then
                DIRECTUS_ACCESS_TOKEN="$(jq -r '.data.access_token // empty' /tmp/directus-login.json 2>/dev/null || true)"
                if [ -n "${DIRECTUS_ACCESS_TOKEN:-}" ] && [ "${DIRECTUS_ACCESS_TOKEN}" != "null" ]; then
                  _directus_api_enabled="1"
                  echo "✅ Directus API token acquired from /auth/login fallback"
                else
                  echo "⚠️ Directus login succeeded but no access_token returned; skipping flow reconciliation"
                fi
              else
                echo "⚠️ Directus login fallback failed (HTTP ${LOGIN_CODE}); skipping flow reconciliation"
              fi
            else
              echo "⚠️ Vault secret secret/data/directus/admin missing email/password; skipping flow reconciliation"
            fi
          else
            echo "⚠️ Could not read secret/data/directus/admin from Vault (HTTP ${ADMIN_CREDS_CODE}); skipping flow reconciliation"
          fi
        fi

        # Ensure admin-capable policies can manually trigger flows from Directus UI.
        # Without these permissions Directus returns 403 for /flows/trigger/:id
        # and /operations permission lookups during manual flow execution.
        if [ "${PERM_TABLE_EXISTS:-0}" = "1" ] && [ -n "${PERM_PRINC_COL:-}" ] && [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
          echo "🧭 Ensuring directus_flows.trigger permission for administrator policies..."
          admin_policy_ids=""
          if _has_policy_col "admin_access"; then
            admin_policy_ids="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_policies WHERE admin_access = true ORDER BY id;" || true)"
          fi
          if [ -z "${admin_policy_ids:-}" ]; then
            admin_policy_ids="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_policies WHERE LOWER(name)=LOWER('Policy for Administrator') ORDER BY id LIMIT 1;" || true)"
          fi
          printf '%s\n' "${admin_policy_ids}" | while IFS= read -r admin_policy_id; do
            admin_policy_id="$(printf '%s' "${admin_policy_id:-}" | tr -d '\r')"
            if [ -z "${admin_policy_id:-}" ] || [ "${admin_policy_id}" = "null" ]; then
              continue
            fi
            admin_policy_id_sql="$(printf '%s' "${admin_policy_id}" | sed "s/'/''/g")"
            admin_policy_name="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT name FROM directus.directus_policies WHERE id='${admin_policy_id_sql}' LIMIT 1;" || true)"
            admin_policy_name="$(printf '%s' "${admin_policy_name:-}" | tr -d '\r')"

            if [ -z "${admin_policy_name:-}" ] || [ "${admin_policy_name}" = "null" ]; then
              admin_policy_name="${admin_policy_id}"
            fi

            preserve_role_name="${role_name:-}"
            role_name="${admin_policy_name}"

            admin_flow_perms_json="$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
            _upsert_policy_action_permission "${admin_policy_id}" "directus_flows" "read" "${admin_flow_perms_json}"
            _upsert_policy_action_permission "${admin_policy_id}" "directus_flows" "trigger" "${admin_flow_perms_json}"
            _upsert_policy_action_permission "${admin_policy_id}" "directus_operations" "read" "$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
            role_name="${preserve_role_name}"
          done
        fi

        CMS_PAGES_TABLE_EXISTS="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT CASE WHEN to_regclass('directus.cms_pages') IS NOT NULL THEN 1 ELSE 0 END;" || true)"
        CMS_PAGES_TABLE_EXISTS="$(printf '%s' "${CMS_PAGES_TABLE_EXISTS:-0}" | tr -d '\r')"

        printf '%s' "$SITES_JSON" | jq -c '.sites[]' | while IFS= read -r site; do
          site_key="$(printf '%s' "$site" | jq -r '.site_key // .key // empty')"
          homepage_slug="$(printf '%s' "$site" | jq -r '.homepage_slug // "home"')"
          homepage_release_channel_raw="$(printf '%s' "$site" | jq -r '.homepage_release_channel // .release_channel // "preview"')"
          homepage_layout_template_key="$(printf '%s' "$site" | jq -r '.homepage_layout_template_key // .layout_template_key // "spa-default"')"
          homepage_theme_package_key="$(printf '%s' "$site" | jq -r '.homepage_theme_package_key // .theme_package_key // empty')"
          client_key="$(printf '%s' "$site" | jq -r '.client_key // .clientId // empty')"
          role_name="$(printf '%s' "$site" | jq -r '.role_name // .role // empty')"
          directus_client_id_vault_path="$(printf '%s' "$site" | jq -r '.directus_client_id_vault_path // empty' 2>/dev/null || true)"
          directus_client_id_vault_field="$(printf '%s' "$site" | jq -r '.directus_client_id_vault_field // "value"' 2>/dev/null || true)"
    
          if [ -z "${client_key:-}" ] || [ "${client_key}" = "null" ]; then
            echo "⚠️  site entry missing client_key; skipping (site_key=${site_key})"
            continue
          fi
          if [ -z "${role_name:-}" ] || [ "${role_name}" = "null" ]; then
            role_name="$client_key"
          fi
          if ! printf '%s' "$client_key" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
            echo "⚠️  invalid client_key '${client_key}' (site_key=${site_key}); skipping"
            continue
          fi
          directus_client_id_vault_path="$(printf '%s' "${directus_client_id_vault_path:-}" | tr -d '\r')"
          directus_client_id_vault_field="$(printf '%s' "${directus_client_id_vault_field:-value}" | tr -d '\r')"
          if [ -z "${directus_client_id_vault_field:-}" ] || [ "${directus_client_id_vault_field}" = "null" ]; then
            directus_client_id_vault_field="value"
          fi

          if [ -z "${homepage_slug:-}" ] || [ "${homepage_slug}" = "null" ]; then
            homepage_slug="home"
          fi
          if [ -z "${homepage_layout_template_key:-}" ] || [ "${homepage_layout_template_key}" = "null" ]; then
            homepage_layout_template_key=""
          fi
          if [ -z "${homepage_theme_package_key:-}" ] || [ "${homepage_theme_package_key}" = "null" ]; then
            homepage_theme_package_key=""
          fi
          case "$(printf '%s' "${homepage_release_channel_raw:-preview}" | tr '[:upper:]' '[:lower:]')" in
            preview|prod) homepage_release_channel="$(printf '%s' "${homepage_release_channel_raw:-preview}" | tr '[:upper:]' '[:lower:]')" ;;
            *) homepage_release_channel="preview" ;;
          esac

          if [ "${DIRECTUS_POSTSCHEMA_DATA_MUTATIONS_ENABLED}" = "true" ] || [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
            if command -v run_site_homepage_mutations >/dev/null 2>&1; then
              run_site_homepage_mutations
            else
              echo "⚠️ Data-mutation helper missing run_site_homepage_mutations; skipping site homepage provisioning."
            fi
          else
            echo "INFO: DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED=false; skipping site homepage/content provisioning for site_key='${site_key}'."
          fi
          # Ensure a per-client Directus service-user token exists in Vault.
          SITE_TOKEN=""
          SITE_VAULT_PATH="secret/data/directus/gravitee/clients/${client_key}"
          CODE="$(curl -sS -o /tmp/site-token.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
          if [ "$CODE" = "200" ]; then
            SITE_TOKEN="$(jq -r '.data.data.token // empty' /tmp/site-token.json 2>/dev/null || true)"
          fi
          if [ -z "${SITE_TOKEN:-}" ] || [ "${SITE_TOKEN}" = "null" ]; then
            SITE_TOKEN="$(tr -dc 'A-Za-z0-9-._~' </dev/urandom | head -c 64)"
            payload="$(jq -nc --arg t "$SITE_TOKEN" '{data:{token:$t}}')"
            WCODE="$(curl -sS -o /tmp/site-token-write.json -w '%{http_code}' -X POST \
              -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${VAULT_ADDR}/v1/${SITE_VAULT_PATH}" || true)"
            if [ "$WCODE" != "200" ] && [ "$WCODE" != "204" ]; then
              echo "⚠️  failed to write Vault token for client_key=${client_key} (HTTP ${WCODE}); skipping"
              continue
            fi
            echo "🔐 Vault token created for client_key=${client_key}"
          fi

          dynamic_client_key=""
          if [ -n "${directus_client_id_vault_path:-}" ] && [ "${directus_client_id_vault_path}" != "null" ]; then
            dynamic_client_key="$(_vault_kv_read_field "${directus_client_id_vault_path}" "${directus_client_id_vault_field}" || true)"
            dynamic_client_key="$(printf '%s' "${dynamic_client_key:-}" | tr -d '\r')"
            if [ -z "${dynamic_client_key:-}" ] || [ "${dynamic_client_key}" = "null" ]; then
              echo "⚠️  directus_client_id_vault_path configured but value missing (site_key=${site_key}, path=${directus_client_id_vault_path})"
              dynamic_client_key=""
            elif [ "${dynamic_client_key}" = "${client_key}" ]; then
              dynamic_client_key=""
            elif ! printf '%s' "${dynamic_client_key}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "⚠️  invalid dynamic client key '${dynamic_client_key}' from ${directus_client_id_vault_path} (site_key=${site_key}); ignoring"
              dynamic_client_key=""
            else
              echo "🔎 Resolved dynamic client key '${dynamic_client_key}' for site_key='${site_key}'"
            fi
          fi

          client_keys_to_bind="$(printf '%s\n%s\n' "${client_key}" "${dynamic_client_key:-}" | awk 'NF && !seen[$0]++')"
    
          # Ensure Directus role exists (create if missing).
          role_name_sql="$(printf '%s' "$role_name" | sed "s/'/''/g")"
          ROLE_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
            "SELECT id FROM directus.directus_roles WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
          ROLE_ID="$(printf '%s' "$ROLE_ID" | tr -d '\r')"
          if [ -z "${ROLE_ID:-}" ] || [ "${ROLE_ID}" = "null" ]; then
            ROLE_ID="$(cat /proc/sys/kernel/random/uuid)"
            desc="Site role for ${site_key:-$client_key}"
            desc_sql="$(printf '%s' "$desc" | sed "s/'/''/g")"
            INS_COLS="id,name"
            INS_VALS="'${ROLE_ID}','${role_name_sql}'"
            if _has_role_col "description"; then INS_COLS="${INS_COLS},description"; INS_VALS="${INS_VALS},'${desc_sql}'"; fi
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; INSERT INTO directus_roles (${INS_COLS}) VALUES (${INS_VALS});"
            echo "✅ Created Directus role '${role_name}' (id=${ROLE_ID})"
          fi
    
          # Ensure Directus policy exists and is linked to the site role.
          POLICY_ID=""
          if [ "${POLICY_TABLE_EXISTS:-0}" = "1" ]; then
            POLICY_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT id FROM directus.directus_policies WHERE name = '${role_name_sql}' LIMIT 1;" || true)"
            POLICY_ID="$(printf '%s' "$POLICY_ID" | tr -d '\r')"
            if [ -z "${POLICY_ID:-}" ] || [ "${POLICY_ID}" = "null" ]; then
              POLICY_ID="$(cat /proc/sys/kernel/random/uuid)"
              PDESC="Site policy for ${site_key:-$client_key}"
              PDESC_SQL="$(printf '%s' "$PDESC" | sed "s/'/''/g")"
              PCOLS="id,name"
              PVALS="'${POLICY_ID}','${role_name_sql}'"
              if _has_policy_col "description"; then PCOLS="${PCOLS},description"; PVALS="${PVALS},'${PDESC_SQL}'"; fi
              if _has_policy_col "icon"; then PCOLS="${PCOLS},icon"; PVALS="${PVALS},'badge'"; fi
              if _has_policy_col "admin_access"; then PCOLS="${PCOLS},admin_access"; PVALS="${PVALS},false"; fi
              if _has_policy_col "app_access"; then PCOLS="${PCOLS},app_access"; PVALS="${PVALS},false"; fi
              if _has_policy_col "enforce_tfa"; then PCOLS="${PCOLS},enforce_tfa"; PVALS="${PVALS},false"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_policies (${PCOLS}) VALUES (${PVALS});"
              echo "✅ Created Directus policy '${role_name}' (id=${POLICY_ID})"
            fi
          else
            echo "⚠️ directus_policies table not found; skipping policy provisioning for client_key=${client_key}"
          fi
    
          if [ -n "${POLICY_ID:-}" ] && [ "${ACCESS_TABLE_EXISTS:-0}" = "1" ]; then
            acc_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
              "SELECT 1 FROM directus.directus_access WHERE role = '${ROLE_ID}' AND policy = '${POLICY_ID}' LIMIT 1;" || true)"
            acc_exists="$(printf '%s' "$acc_exists" | tr -d '\r')"
            if [ "$acc_exists" != "1" ]; then
              acc_id="$(cat /proc/sys/kernel/random/uuid)"
              ACOLS="id,policy"
              AVALS="'${acc_id}','${POLICY_ID}'"
              if _has_access_col "role"; then ACOLS="${ACOLS},role"; AVALS="${AVALS},'${ROLE_ID}'"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_access (${ACOLS}) VALUES (${AVALS});"
              echo "✅ Linked role '${role_name}' to policy '${role_name}'"
            fi
          fi
    
          # Keep one Directus service user token owner per site client_key.
          # Additional bound client keys (aliases) reuse the same Vault token, but
          # do not receive separate directus_users.token assignments because that
          # column is unique.
          if _has_user_col "token"; then
            token_sql="$(printf '%s' "$SITE_TOKEN" | sed "s/'/''/g")"
            printf '%s\n' "${client_keys_to_bind}" | while IFS= read -r bind_client_key; do
              bind_client_key="$(printf '%s' "${bind_client_key:-}" | tr -d '\r')"
              if [ -z "${bind_client_key:-}" ] || [ "${bind_client_key}" = "null" ]; then
                continue
              fi
              if ! printf '%s' "${bind_client_key}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
                echo "⚠️  invalid bind client_key '${bind_client_key}' for site_key='${site_key}'; skipping"
                continue
              fi

              bind_vault_path="secret/data/directus/gravitee/clients/${bind_client_key}"
              bind_code="$(curl -sS -o /tmp/site-token-bind.json -w '%{http_code}' -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/${bind_vault_path}" || true)"
              bind_token=""
              if [ "${bind_code}" = "200" ]; then
                bind_token="$(jq -r '.data.data.token // empty' /tmp/site-token-bind.json 2>/dev/null || true)"
              fi
              if [ -z "${bind_token:-}" ] || [ "${bind_token}" = "null" ] || [ "${bind_token}" != "${SITE_TOKEN}" ]; then
                payload="$(jq -nc --arg t "$SITE_TOKEN" '{data:{token:$t}}')"
                bind_write_code="$(curl -sS -o /tmp/site-token-bind-write.json -w '%{http_code}' -X POST \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                  -d "$payload" "${VAULT_ADDR}/v1/${bind_vault_path}" || true)"
                if [ "${bind_write_code}" != "200" ] && [ "${bind_write_code}" != "204" ]; then
                  echo "⚠️  failed to bind Vault token for client_key=${bind_client_key} (HTTP ${bind_write_code}); skipping Directus user binding"
                  continue
                fi
                if [ -z "${bind_token:-}" ] || [ "${bind_token}" = "null" ]; then
                  echo "🔐 Vault token created for client_key=${bind_client_key}"
                else
                  echo "🔐 Vault token updated for client_key=${bind_client_key}"
                fi
              fi

              if [ "${bind_client_key}" != "${client_key}" ]; then
                echo "ℹ️  skipping Directus user token binding for alias client_key=${bind_client_key}; token owner remains client_key=${client_key}"
                continue
              fi

              svc_email="svc-${bind_client_key}@svc.local"
              svc_email_sql="$(printf '%s' "$svc_email" | sed "s/'/''/g")"
              USER_ID="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_users WHERE email = '${svc_email_sql}' LIMIT 1;" || true)"
              USER_ID="$(printf '%s' "$USER_ID" | tr -d '\r')"
              if [ -z "${USER_ID:-}" ] || [ "${USER_ID}" = "null" ]; then
                USER_ID="$(cat /proc/sys/kernel/random/uuid)"
                UCOLS="id,email"
                UVALS="'${USER_ID}','${svc_email_sql}'"
                if _has_user_col "role"; then UCOLS="${UCOLS},role"; UVALS="${UVALS},'${ROLE_ID}'"; fi
                if _has_user_col "token"; then UCOLS="${UCOLS},token"; UVALS="${UVALS},'${token_sql}'"; fi
                if _has_user_col "status"; then UCOLS="${UCOLS},status"; UVALS="${UVALS},'active'"; fi
                if _has_user_col "first_name"; then UCOLS="${UCOLS},first_name"; UVALS="${UVALS},'svc'"; fi
                if _has_user_col "last_name"; then UCOLS="${UCOLS},last_name"; UVALS="${UVALS},'${role_name_sql}'"; fi
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; INSERT INTO directus_users (${UCOLS}) VALUES (${UVALS});"
                echo "✅ Created site user ${svc_email}"
              else
                role_id_sql="$(printf '%s' "$ROLE_ID" | sed "s/'/''/g")"
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                  "SET search_path TO directus, public; UPDATE directus_users SET role='${role_id_sql}', token='${token_sql}', status='active' WHERE id='${USER_ID}';"
                echo "✅ Updated site user ${svc_email}"
              fi
            done
          else
            echo "⚠️ directus_users.token column not found; cannot provision site token for client_key=${client_key}"
          fi
    
          # Seed baseline read permissions for this policy (drives available GraphQL actions).
          if [ "${PERM_TABLE_EXISTS:-0}" = "1" ] && [ -n "${POLICY_ID:-}" ] && [ -n "${PERM_PRINC_COL:-}" ]; then
            # Reconcile desired read access from sites.yaml on every deploy.
            # This removes stale read grants so ArgoCD-driven config is authoritative.
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
              "SET search_path TO directus, public; DELETE FROM directus_permissions WHERE ${PERM_PRINC_COL}='${POLICY_ID}' AND action='read';"
    
            printf '%s' "$site" | jq -c '.read_collections[]?' | while IFS= read -r coll_entry; do
              [ -z "${coll_entry:-}" ] && continue
    
              coll=""
              fields_cfg="null"
              permissions_cfg="null"
              validation_cfg="null"
              presets_cfg="null"
    
              coll_type="$(printf '%s' "$coll_entry" | jq -r 'type' 2>/dev/null || true)"
              if [ "$coll_type" = "string" ]; then
                coll="$(printf '%s' "$coll_entry" | jq -r '.' 2>/dev/null || true)"
              elif [ "$coll_type" = "object" ]; then
                coll="$(printf '%s' "$coll_entry" | jq -r '.collection // .name // empty' 2>/dev/null || true)"
                fields_cfg="$(printf '%s' "$coll_entry" | jq -c '.fields // null' 2>/dev/null || true)"
                permissions_cfg="$(printf '%s' "$coll_entry" | jq -c '.permissions // .filter // null' 2>/dev/null || true)"
                validation_cfg="$(printf '%s' "$coll_entry" | jq -c '.validation // null' 2>/dev/null || true)"
                presets_cfg="$(printf '%s' "$coll_entry" | jq -c '.presets // null' 2>/dev/null || true)"
              else
                continue
              fi
    
              if [ -z "${coll:-}" ] || [ "${coll}" = "null" ]; then
                continue
              fi
    
              coll_sql="$(printf '%s' "$coll" | sed "s/'/''/g")"
              perms_val="$(_json_value_for_type "${PERMISSIONS_TYPE:-}" "${permissions_cfg:-null}")"
              val_val="$(_json_value_for_type "${VALIDATION_TYPE:-}" "${validation_cfg:-null}")"
              pre_val="$(_json_value_for_type "${PRESETS_TYPE:-}" "${presets_cfg:-null}")"
              fields_val="$(_fields_value_from_config_for_type "${PERM_FIELDS_TYPE:-}" "${fields_cfg:-null}")"
    
              existing_perm_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.directus_permissions WHERE ${PERM_PRINC_COL} = '${POLICY_ID}' AND collection = '${coll_sql}' AND action = 'read' LIMIT 1;" || true)"
              existing_perm_id="$(printf '%s' "$existing_perm_id" | tr -d '\r')"
    
              if [ -n "${existing_perm_id:-}" ] && [ "${existing_perm_id}" != "null" ]; then
                SETS=""
                if _has_perm_col "permissions"; then SETS="${SETS},permissions=${perms_val}"; fi
                if _has_perm_col "validation"; then SETS="${SETS},validation=${val_val}"; fi
                if _has_perm_col "presets"; then SETS="${SETS},presets=${pre_val}"; fi
                if _has_perm_col "fields"; then SETS="${SETS},fields=${fields_val}"; fi
                if [ -n "${SETS:-}" ]; then
                  perm_id_sql="$(printf '%s' "$existing_perm_id" | sed "s/'/''/g")"
                  psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                    "SET search_path TO directus, public; UPDATE directus_permissions SET ${SETS#,} WHERE id='${perm_id_sql}';"
                fi
                echo "✅ Reconciled read on ${coll} for policy '${role_name}'"
                continue
              fi
    
              PCOLS="${PERM_PRINC_COL},collection,action"
              PVALS="'${POLICY_ID}','${coll_sql}','read'"
              if [ "${PERM_ID_HAS_DEFAULT:-0}" != "1" ]; then
                pid="$(cat /proc/sys/kernel/random/uuid)"
                PCOLS="id,${PCOLS}"
                PVALS="'${pid}',${PVALS}"
              fi
              if _has_perm_col "permissions"; then PCOLS="${PCOLS},permissions"; PVALS="${PVALS},${perms_val}"; fi
              if _has_perm_col "validation"; then PCOLS="${PCOLS},validation"; PVALS="${PVALS},${val_val}"; fi
              if _has_perm_col "presets"; then PCOLS="${PCOLS},presets"; PVALS="${PVALS},${pre_val}"; fi
              if _has_perm_col "fields"; then PCOLS="${PCOLS},fields"; PVALS="${PVALS},${fields_val}"; fi
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
                "SET search_path TO directus, public; INSERT INTO directus_permissions (${PCOLS}) VALUES (${PVALS});"
              echo "✅ Granted read on ${coll} to policy '${role_name}'"
            done

            # Reconcile write permissions needed by CMS page promotion actions.
            if [ -n "${site_key:-}" ] && [ "${site_key}" != "null" ]; then
              PROMOTE_PERMISSIONS_JSON="$(jq -nc --arg site "${site_key}" '{site_key:{_eq:$site},release_channel:{_in:["preview","prod","both"]}}')"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_pages" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_pages" "update" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_page_blocks" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_page_blocks" "delete" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_block_rich_text" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_block_hero" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_block_module" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_block_template_ref" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_block_content_ref" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_items" "create" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_items" "update" "${PROMOTE_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_item_translations" "create" "$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_translation_jobs" "read" "$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_translation_jobs" "create" "$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
              _upsert_policy_action_permission "${POLICY_ID}" "cms_content_translation_jobs" "update" "$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"

              FLOW_TRIGGER_NAME_PROD="CMS Cache Refresh (${site_key}/prod) - Manual"
              FLOW_TRIGGER_NAME_SITE="CMS Cache Refresh (${site_key}) - Manual"
              FLOW_TRIGGER_PERMISSIONS_JSON="$(jq -nc --arg prod "${FLOW_TRIGGER_NAME_PROD}" --arg site "${FLOW_TRIGGER_NAME_SITE}" '{name:{_in:[$prod,$site]}}')"
              FLOW_OPERATIONS_PERMISSIONS_JSON="$(_json_empty_for_type "${PERMISSIONS_TYPE:-}")"
              _upsert_policy_action_permission "${POLICY_ID}" "directus_flows" "read" "${FLOW_TRIGGER_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "directus_flows" "trigger" "${FLOW_TRIGGER_PERMISSIONS_JSON}"
              _upsert_policy_action_permission "${POLICY_ID}" "directus_operations" "read" "${FLOW_OPERATIONS_PERMISSIONS_JSON}"
            fi
          fi
    
          # Provision per-site Directus flows that call the app cache refresh endpoint after content saves.
          # These are read from Directus-owned rows in cms_cache_refresh_targets.
          if [ "${_directus_api_enabled}" = "1" ]; then
            refresh_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.enabled // false' 2>/dev/null || true)"
            refresh_auth_enabled_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.enabled // true' 2>/dev/null || true)"
            refresh_auth_token_url_raw="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.token_url // empty' 2>/dev/null || true)"
            refresh_auth_scope="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.scope // empty' 2>/dev/null || true)"
            refresh_auth_audience="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience // empty' 2>/dev/null || true)"
            refresh_auth_audience_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_path // "secret/data/keycloak-client-id-graphql-api"' 2>/dev/null || true)"
            refresh_auth_audience_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.audience_vault_field // "value"' 2>/dev/null || true)"
            refresh_auth_client_id_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_path // empty' 2>/dev/null || true)"
            refresh_auth_client_id_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_id_vault_field // "value"' 2>/dev/null || true)"
            refresh_auth_client_secret_vault_path="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_path // empty' 2>/dev/null || true)"
            refresh_auth_client_secret_vault_field="$(printf '%s' "$site" | jq -r '.cache_refresh.auth.client_secret_vault_field // "value"' 2>/dev/null || true)"
    
            case "$(printf '%s' "${refresh_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) refresh_enabled="true" ;;
              *) refresh_enabled="false" ;;
            esac
    
            case "$(printf '%s' "${refresh_auth_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) refresh_auth_enabled="true" ;;
              *) refresh_auth_enabled="false" ;;
            esac
    
            refresh_auth_token_url="$(printf '%s' "${refresh_auth_token_url_raw:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_token_url:-}" ] || [ "${refresh_auth_token_url}" = "null" ]; then
              refresh_auth_token_url="https://auth-origin.suncoast.systems/realms/external/protocol/openid-connect/token"
            fi
    
            refresh_auth_client_id_vault_path="$(printf '%s' "${refresh_auth_client_id_vault_path:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_id_vault_path:-}" ] || [ "${refresh_auth_client_id_vault_path}" = "null" ]; then
              refresh_auth_client_id_vault_path="secret/data/keycloak-client-id-${client_key}"
            fi
    
            refresh_auth_client_secret_vault_path="$(printf '%s' "${refresh_auth_client_secret_vault_path:-}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_secret_vault_path:-}" ] || [ "${refresh_auth_client_secret_vault_path}" = "null" ]; then
              refresh_auth_client_secret_vault_path="secret/data/keycloak-client-secret-${client_key}"
            fi
    
            refresh_auth_client_id_vault_field="$(printf '%s' "${refresh_auth_client_id_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_id_vault_field:-}" ] || [ "${refresh_auth_client_id_vault_field}" = "null" ]; then
              refresh_auth_client_id_vault_field="value"
            fi
    
            refresh_auth_client_secret_vault_field="$(printf '%s' "${refresh_auth_client_secret_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_client_secret_vault_field:-}" ] || [ "${refresh_auth_client_secret_vault_field}" = "null" ]; then
              refresh_auth_client_secret_vault_field="value"
            fi
    
            refresh_auth_audience_vault_path="$(printf '%s' "${refresh_auth_audience_vault_path:-}" | tr -d '\r')"
            refresh_auth_audience_vault_field="$(printf '%s' "${refresh_auth_audience_vault_field:-value}" | tr -d '\r')"
            if [ -z "${refresh_auth_audience_vault_field:-}" ] || [ "${refresh_auth_audience_vault_field}" = "null" ]; then
              refresh_auth_audience_vault_field="value"
            fi
    
            refresh_auth_client_id=""
            refresh_auth_client_secret=""
            refresh_auth_token_body=""
            refresh_auth_ready="false"
    
            if [ "${refresh_auth_enabled}" = "true" ]; then
              refresh_auth_client_id="$(_vault_kv_read_field "${refresh_auth_client_id_vault_path}" "${refresh_auth_client_id_vault_field}" || true)"
              refresh_auth_client_secret="$(_vault_kv_read_field "${refresh_auth_client_secret_vault_path}" "${refresh_auth_client_secret_vault_field}" || true)"
              refresh_auth_audience="$(printf '%s' "${refresh_auth_audience:-}" | tr -d '\r')"
              if [ -z "${refresh_auth_audience:-}" ] && [ -n "${refresh_auth_audience_vault_path:-}" ] && [ "${refresh_auth_audience_vault_path}" != "null" ]; then
                refresh_auth_audience="$(_vault_kv_read_field "${refresh_auth_audience_vault_path}" "${refresh_auth_audience_vault_field}" || true)"
              fi
    
              if [ -z "${refresh_auth_client_id:-}" ] || [ -z "${refresh_auth_client_secret:-}" ]; then
                echo "⚠️ cache refresh auth enabled but Keycloak client credentials missing for site_key='${site_key}' (client_id_path='${refresh_auth_client_id_vault_path}', client_secret_path='${refresh_auth_client_secret_vault_path}')"
              else
                enc_client_id="$(_urlencode_value "${refresh_auth_client_id}")"
                enc_client_secret="$(_urlencode_value "${refresh_auth_client_secret}")"
                refresh_auth_token_body="grant_type=client_credentials&client_id=${enc_client_id}&client_secret=${enc_client_secret}"
    
                refresh_auth_scope="$(printf '%s' "${refresh_auth_scope:-}" | tr -d '\r')"
                if [ -n "${refresh_auth_scope:-}" ] && [ "${refresh_auth_scope}" != "null" ]; then
                  enc_scope="$(_urlencode_value "${refresh_auth_scope}")"
                  refresh_auth_token_body="${refresh_auth_token_body}&scope=${enc_scope}"
                fi
    
                if [ -n "${refresh_auth_audience:-}" ] && [ "${refresh_auth_audience}" != "null" ]; then
                  enc_audience="$(_urlencode_value "${refresh_auth_audience}")"
                  refresh_auth_token_body="${refresh_auth_token_body}&audience=${enc_audience}"
                fi
    
                refresh_auth_ready="true"
              fi
            fi
    
            refresh_targets_json="$(printf '%s' "$site" | jq -c '
              def norm_headers($h):
                if ($h|type)=="array" then
                  ($h | map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")))
                else [] end;
              if (.cache_refresh.targets | type) == "object" then
                (.cache_refresh.targets | to_entries | map({
                  target_key:(.key|tostring|ascii_downcase),
                  enabled:(.value.enabled // false),
                  endpoint:(.value.endpoint // "" | tostring),
                  method:(.value.method // (.cache_refresh.method // "POST") | tostring),
                  headers:(norm_headers(.value.headers)),
                  retry_attempts:(.value.retry_attempts // .value.retries // .cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.value.retry_delay_ms // .value.retry_delay // .cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500),
                  request_timeout_ms:(.value.request_timeout_ms // .value.timeout_ms // .cache_refresh.request_timeout_ms // .cache_refresh.timeout_ms // 120000),
                  token_timeout_ms:(.value.token_timeout_ms // .value.auth_timeout_ms // .cache_refresh.auth.token_timeout_ms // .cache_refresh.auth.timeout_ms // 20000)
                }))
              elif (.cache_refresh.targets | type) == "array" then
                (.cache_refresh.targets | map({
                  target_key:((.target_key // .key // .name // "")|tostring|ascii_downcase),
                  enabled:(.enabled // false),
                  endpoint:(.endpoint // "" | tostring),
                  method:(.method // (.cache_refresh.method // "POST") | tostring),
                  headers:(norm_headers(.headers)),
                  retry_attempts:(.retry_attempts // .retries // .cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.retry_delay_ms // .retry_delay // .cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500),
                  request_timeout_ms:(.request_timeout_ms // .timeout_ms // .cache_refresh.request_timeout_ms // .cache_refresh.timeout_ms // 120000),
                  token_timeout_ms:(.token_timeout_ms // .auth_timeout_ms // .cache_refresh.auth.token_timeout_ms // .cache_refresh.auth.timeout_ms // 20000)
                }) | map(select(.target_key != "")))
              else
                [{
                  target_key:"prod",
                  enabled:(.cache_refresh.enabled // false),
                  endpoint:(.cache_refresh.endpoint // "" | tostring),
                  method:(.cache_refresh.method // "POST" | tostring),
                  headers:(norm_headers(.cache_refresh.headers)),
                  retry_attempts:(.cache_refresh.retry_attempts // .cache_refresh.retries // 6),
                  retry_delay_ms:(.cache_refresh.retry_delay_ms // .cache_refresh.retry_delay // 1500),
                  request_timeout_ms:(.cache_refresh.request_timeout_ms // .cache_refresh.timeout_ms // 120000),
                  token_timeout_ms:(.cache_refresh.auth.token_timeout_ms // .cache_refresh.auth.timeout_ms // 20000)
                }]
              end' 2>/dev/null || true)"
            if [ -z "${refresh_targets_json:-}" ] || [ "${refresh_targets_json}" = "null" ]; then
              refresh_targets_json="[]"
            fi
            if ! printf '%s' "${refresh_targets_json}" | jq -e 'type=="array"' >/dev/null 2>&1; then
              refresh_targets_json="[]"
            fi
    
            refresh_collections_json='["cms_pages","cms_page_blocks","cms_block_rich_text","cms_block_hero","cms_block_module","cms_block_template_ref","cms_block_content_ref","cms_content_templates","cms_content_items","cms_content_item_translations","cms_template_functions","cms_modules","cms_layout_templates","cms_layout_template_slots","cms_theme_packages"]'
            manual_refresh_collections_json='["cms_pages"]'
            targets_count="$(printf '%s' "${refresh_targets_json}" | jq -r 'length' 2>/dev/null || echo 0)"
            if [ "${targets_count:-0}" = "0" ]; then
              echo "⚠️ No cache refresh targets configured for site_key='${site_key}'"
            fi
    
            printf '%s' "${refresh_targets_json}" | jq -c 'sort_by((if (.enabled // false) then 0 else 1 end), .target_key)[]' | while IFS= read -r target; do
              target_key="$(printf '%s' "$target" | jq -r '.target_key // empty' 2>/dev/null || true)"
              target_enabled_raw="$(printf '%s' "$target" | jq -r '.enabled // false' 2>/dev/null || true)"
              target_endpoint_raw="$(printf '%s' "$target" | jq -r '.endpoint // empty' 2>/dev/null || true)"
              target_method_raw="$(printf '%s' "$target" | jq -r '.method // "POST"' 2>/dev/null || true)"
              target_retry_attempts_raw="$(printf '%s' "$target" | jq -r '.retry_attempts // 6' 2>/dev/null || true)"
              target_retry_delay_ms_raw="$(printf '%s' "$target" | jq -r '.retry_delay_ms // 1500' 2>/dev/null || true)"
              target_request_timeout_ms_raw="$(printf '%s' "$target" | jq -r '.request_timeout_ms // 120000' 2>/dev/null || true)"
              target_token_timeout_ms_raw="$(printf '%s' "$target" | jq -r '.token_timeout_ms // 20000' 2>/dev/null || true)"
              target_headers_json="$(printf '%s' "$target" | jq -c \
                '(.headers // []) | if type=="array" then map(select(type=="object") | {header:((.header // "")|tostring), value:((.value // "")|tostring)} | select(.header != "")) else [] end' \
                2>/dev/null || true)"
    
              if [ -z "${target_key:-}" ] || [ "${target_key}" = "null" ]; then
                continue
              fi

              # UI-managed endpoint registry:
              # Read effective enabled/endpoint from Directus DB. Rebuild seed mode can create missing rows from sites.yaml defaults.
              target_site_sql="$(printf '%s' "${site_key}" | sed "s/'/''/g")"
              target_key_sql="$(printf '%s' "${target_key}" | sed "s/'/''/g")"
              target_endpoint_seed="$(printf '%s' "${target_endpoint_raw:-}" | tr -d '\r')"
              target_endpoint_seed_sql="$(printf '%s' "${target_endpoint_seed}" | sed "s/'/''/g")"
              target_enabled_seed="false"
              case "$(printf '%s' "${target_enabled_raw:-}" | tr '[:upper:]' '[:lower:]')" in
                1|true|yes|on) target_enabled_seed="true" ;;
                *) target_enabled_seed="false" ;;
              esac

              target_cfg_id="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT id FROM directus.cms_cache_refresh_targets WHERE site_key='${target_site_sql}' AND target_key='${target_key_sql}' LIMIT 1;" || true)"
              target_cfg_id="$(printf '%s' "${target_cfg_id}" | tr -d '\r')"
              if [ -z "${target_cfg_id:-}" ] || [ "${target_cfg_id}" = "null" ]; then
                if [ "${DIRECTUS_POSTSCHEMA_REBUILD_SEED_ENABLED}" = "true" ]; then
                  target_cfg_id="$(cat /proc/sys/kernel/random/uuid)"
                  target_cfg_id_sql="$(printf '%s' "${target_cfg_id}" | sed "s/'/''/g")"
                  if ! _psql_yb_retry "INSERT INTO cms_cache_refresh_targets (id, site_key, target_key, enabled, endpoint, date_created, date_updated)
                    VALUES ('${target_cfg_id_sql}', '${target_site_sql}', '${target_key_sql}', ${target_enabled_seed}, '${target_endpoint_seed_sql}', now(), now())
                    ON CONFLICT (site_key, target_key) DO NOTHING;" "seed cache refresh target registry for ${site_key}/${target_key}" 12; then
                    echo "⚠️ failed to seed cache refresh target registry for site_key='${site_key}', target='${target_key}'"
                    continue
                  fi
                else
                  echo "INFO: No Directus-managed cache refresh target row for ${site_key}/${target_key}; skipping flow target."
                  continue
                fi
              fi

              target_cfg_json="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
                "SELECT row_to_json(src)::text
                   FROM (
                     SELECT id, enabled, endpoint
                     FROM directus.cms_cache_refresh_targets
                     WHERE site_key='${target_site_sql}'
                       AND target_key='${target_key_sql}'
                     ORDER BY date_updated DESC NULLS LAST, date_created DESC NULLS LAST
                     LIMIT 1
                   ) src;" || true)"
              target_cfg_json="$(printf '%s' "${target_cfg_json}" | tr -d '\r')"
              if [ -n "${target_cfg_json:-}" ] && [ "${target_cfg_json}" != "null" ]; then
                target_cfg_id_db="$(printf '%s' "${target_cfg_json}" | jq -r '.id // empty' 2>/dev/null || true)"
                target_cfg_enabled="$(printf '%s' "${target_cfg_json}" | jq -r '.enabled // empty' 2>/dev/null || true)"
