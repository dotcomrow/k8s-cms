       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN props_schema SET DEFAULT '{}'::jsonb; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN default_props SET DEFAULT '{}'::jsonb; \
       ALTER TABLE IF EXISTS cms_modules ALTER COLUMN date_created SET DEFAULT now(); \
       DO \$\$ \
       BEGIN \
         IF EXISTS ( \
           SELECT 1 \
           FROM pg_indexes \
           WHERE schemaname = 'directus' \
             AND indexname = 'cms_modules_scope_module_unique' \
