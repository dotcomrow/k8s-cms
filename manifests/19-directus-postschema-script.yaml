         ) THEN \
           CREATE UNIQUE INDEX cms_modules_scope_module_unique \
           ON cms_modules (COALESCE(site_key, ''), module_key); \
         ELSE \
           RAISE NOTICE 'Skipping cms_modules_scope_module_unique due to duplicate (site_key,module_key) rows'; \
         END IF; \
       END \
       \$\$;"

    echo "🧱 Ensuring cms_block_module exists..."
    psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
      "SET search_path TO directus, public; \
       CREATE TABLE IF NOT EXISTS cms_block_module ( \
