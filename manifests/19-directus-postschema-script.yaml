      _upsert_page_blocks_relation_field_meta_dynamic() {
        _collection="cms_pages"
        _field="blocks"
        _collection_exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM information_schema.tables WHERE table_schema='directus' AND table_name='${_collection}' LIMIT 1;" || true)"
        _collection_exists="$(printf '%s' "$_collection_exists" | tr -d '\r')"
        if [ "${_collection_exists}" != "1" ]; then
          return 0
        fi

        _collection_sql="$(printf '%s' "${_collection}" | sed "s/'/''/g")"
        _field_sql="$(printf '%s' "${_field}" | sed "s/'/''/g")"
        # Fresh rebuilds can miss relation metadata for cms_pages.blocks even when
        # cms_page_blocks.page_id exists; heal relation metadata idempotently.
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -v ON_ERROR_STOP=1 -c \
          "SET search_path TO directus, public; \
           DO \$\$ \
           BEGIN \
             IF to_regclass('directus.directus_relations') IS NULL \
               OR to_regclass('directus.cms_pages') IS NULL \
               OR to_regclass('directus.cms_page_blocks') IS NULL THEN \
               RETURN; \
             END IF; \
             IF NOT EXISTS ( \
               SELECT 1 \
               FROM information_schema.columns \
               WHERE table_schema='directus' AND table_name='cms_page_blocks' AND column_name='page_id' \
             ) THEN \
               RETURN; \
             END IF; \
             IF NOT EXISTS ( \
               SELECT 1 FROM information_schema.columns \
               WHERE table_schema='directus' AND table_name='directus_relations' AND column_name='many_collection' \
             ) \
               OR NOT EXISTS ( \
               SELECT 1 FROM information_schema.columns \
               WHERE table_schema='directus' AND table_name='directus_relations' AND column_name='many_field' \
             ) \
               OR NOT EXISTS ( \
               SELECT 1 FROM information_schema.columns \
               WHERE table_schema='directus' AND table_name='directus_relations' AND column_name='one_collection' \
             ) \
               OR NOT EXISTS ( \
               SELECT 1 FROM information_schema.columns \
               WHERE table_schema='directus' AND table_name='directus_relations' AND column_name='one_field' \
             ) THEN \
               RETURN; \
             END IF; \
             IF EXISTS ( \
               SELECT 1 \
               FROM directus_relations \
               WHERE many_collection='cms_page_blocks' AND many_field='page_id' \
             ) THEN \
               UPDATE directus_relations \
                  SET one_collection='cms_pages', \
                      one_field='blocks' \
                WHERE many_collection='cms_page_blocks' \
                  AND many_field='page_id' \
                  AND (COALESCE(one_collection, '') IS DISTINCT FROM 'cms_pages' \
                    OR COALESCE(one_field, '') IS DISTINCT FROM 'blocks'); \
             ELSE \
               BEGIN \
                 INSERT INTO directus_relations (many_collection, many_field, one_collection, one_field) \
                 VALUES ('cms_page_blocks', 'page_id', 'cms_pages', 'blocks'); \
               EXCEPTION WHEN unique_violation THEN \
                 NULL; \
               END; \
             END IF; \
           END \
           \$\$;"
        _exists="$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_DATABASE" -Atc \
          "SELECT 1 FROM directus.directus_fields WHERE collection='${_collection_sql}' AND field='${_field_sql}' LIMIT 1;" || true)"
