      DECLARE
        _base TEXT;
        _suffix TEXT;
      BEGIN
        _base := REGEXP_REPLACE(LOWER(COALESCE(NULLIF(BTRIM(_name), ''), 'content')), '[^a-z0-9]+', '-', 'g');
        _base := REGEXP_REPLACE(_base, '(^-+|-+$)', '', 'g');
        IF COALESCE(NULLIF(BTRIM(_base), ''), '') = '' THEN
