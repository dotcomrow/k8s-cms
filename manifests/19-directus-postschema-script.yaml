        _base := REGEXP_REPLACE(_base, '-+$', '', 'g');
        _suffix := REPLACE(COALESCE(_id::TEXT, directus.cms_generate_uuid()::TEXT), '-', '');
        RETURN _base || '-' || _suffix;
